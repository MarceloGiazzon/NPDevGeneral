# REG-136: NO hardcoded org.gradle.projectcachedir here -- see root gradle.properties' own
# comment for the full reasoning (a dev-machine-only D:/WorkSpace/... path here broke gradlew for
# any newcomer/CI invocation). REG-136 originally judged this file out of scope because nothing
# automated invoked NPDevContract/dsl's own gradlew directly -- that stopped being true once
# sync-runtimehost-libs.ps1 grew a direct `jar --project-cache-dir <portable-path>` call against
# $dslGradleWrapper, which failed on Linux CI (ai-beta-gate) the exact REG-136 way: Gradle reads
# this file's value as a START PARAMETER before the CLI override can apply. Pass
# --project-cache-dir per invocation instead.

# Performance (see docs: mirrors NPDevRuntimeHost/gradle.properties).
# Heap is 3g (not RuntimeHost's 6g): these are six independent Gradle builds,
# each with its own daemon, against 32 GB total.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xms512m -Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.daemon.idletimeout=1800000
