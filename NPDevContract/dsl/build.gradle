// BUILD-2 follow-up: `npdev pack seal <pack.json>` -- certifies a pack is sealed (eligible to ship
// as a precompiled jar) by running PackSealednessAnalyzer across the whole transitive closure when
// the pack declares its own packs[]. Writes a .sealed marker on success; exits non-zero on a named
// violation. Same JavaExec-wrapping-a-small-Main-class convention as packList/packWhy above.
tasks.register('packSeal', JavaExec) {
    group = 'verification'
    description = 'Certify a pack is sealed (analyze + write .sealed marker); composed packs are verified across the whole transitive closure from a local packs root.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.npdev.dsl.v1.cli.PackSealMain'
    ignoreExitValue = true
    def cliArgs = []
    if (project.hasProperty('packPath')) {
        cliArgs << project.getProperty('packPath')
    }
    if (project.hasProperty('packsRoot')) {
        cliArgs << '--packs-root' << project.getProperty('packsRoot')
    }
    if (project.hasProperty('reportOut')) {
        cliArgs << '--out' << project.getProperty('reportOut')
    }
    args cliArgs
}

// PK-4 Stage A: `npdev pack diff <old> <new>` -- a pure, no-database, no-app-build classification
// of every difference between two pack.json documents into ADDITIVE/BREAKING/PATCH
// (com.npdev.dsl.v1.pack.PackDiffEngine). Purely informational: never refuses, unlike packPublish
// below. Same JavaExec-wrapped-by-a-thin-Python-subparser shape as validateModel above.
tasks.register('packDiff', JavaExec) {
    group = 'verification'
    description = 'Diff two pack.json documents and classify every difference as ADDITIVE/BREAKING/PATCH.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.npdev.dsl.v1.cli.PackDiffMain'
    ignoreExitValue = true
    def cliArgs = []
    if (project.hasProperty('oldPack')) {
        cliArgs << project.getProperty('oldPack')
    }
    if (project.hasProperty('newPack')) {
        cliArgs << project.getProperty('newPack')
    }
    if (project.hasProperty('reportOut')) {
        cliArgs << '--out' << project.getProperty('reportOut')
    }
    args cliArgs
}

// PACK-8 Step 7: `npdev pack search` -- searches a pack catalog JSON for packs matching a
// query and/or category. Same JavaExec convention as the other pack CLI tasks.
tasks.register('packSearch', JavaExec) {
    group = 'verification'
    description = 'Search a pack catalog for packs matching a query and/or category.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.npdev.dsl.v1.cli.PackSearchMain'
    ignoreExitValue = true
    def cliArgs = []
    if (project.hasProperty('catalog')) {
        cliArgs << '--catalog' << project.getProperty('catalog')
    }
    if (project.hasProperty('query')) {
        cliArgs << '--query' << project.getProperty('query')
    }
    if (project.hasProperty('category')) {
        cliArgs << '--category' << project.getProperty('category')
    }
    args cliArgs
}

// PK-4 Stage B: `npdev pack publish <old> <new>` -- wraps packDiff's classification with the
// version-bump-size refusal rule (com.npdev.dsl.v1.pack.PackPublishGate) and, with -Pwrite, writes
// an empty migrations chain entry into the new pack.json for a non-BREAKING publish. ignoreExitValue
// lets a REFUSED publish (exit 2) surface its report instead of failing the Gradle invocation itself
// -- the caller (npdev_cli.py / check-pack-diff-gate.py) reads the report's own `allowed` field.
tasks.register('packPublish', JavaExec) {
    group = 'verification'
    description = 'Refuse a pack.json publish whose version bump is smaller than PackDiffEngine requires.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.npdev.dsl.v1.cli.PackPublishMain'
    ignoreExitValue = true
    def cliArgs = []
    if (project.hasProperty('oldPack')) {
        cliArgs << project.getProperty('oldPack')
    }
    if (project.hasProperty('newPack')) {
        cliArgs << project.getProperty('newPack')
    }
    if (project.hasProperty('reportOut')) {
        cliArgs << '--out' << project.getProperty('reportOut')
    }
    if (project.hasProperty('write')) {
        cliArgs << '--write'
    }
    args cliArgs
}

tasks.register('checkRuntimeSchemaCopies') {
    description = 'Ensures active canonical schemas are synchronized into DSL runtime resources.'
    group = 'verification'

    def schemaPairs = [
            [canonical: file('../schemas/model.schema.json'), runtime: file('src/main/resources/schema/model.schema.json')],
            [canonical: file('../schemas/pack.schema.json'), runtime: file('src/main/resources/schema/pack.schema.json')]
    ]

    inputs.files(schemaPairs.collect { it.canonical })
    inputs.files(schemaPairs.collect { it.runtime })

    doLast {
        def failures = []
        schemaPairs.each { pair ->
            if (!pair.canonical.isFile()) {
                failures << "Missing canonical schema: ${pair.canonical}"
                return
            }
            if (!pair.runtime.isFile()) {
                failures << "Missing runtime schema resource: ${pair.runtime}"
                return
            }
            if (pair.canonical.bytes != pair.runtime.bytes) {
                failures << "Runtime schema is out of sync with canonical schema: ${pair.runtime}"
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException(failures.join(System.lineSeparator()))
        }
    }
}

tasks.register('checkSampleModelCopies') {
    description = 'Ensures official sample model.json copies stay content-identical across the Contract, Generator, and NPDevSamples trees.'
    group = 'verification'

    def officialSamples = ['simple-user-registry', 'medium-expense-approval', 'simple-contact-intake']
    def copyGroups = officialSamples.collect { sample ->
        [
                sample: sample,
                files : [
                        file("resources/Models/official-samples/${sample}/model.json"),
                        file("../../NPDevGenerator/resources/Models/official-samples/${sample}/model.json"),
                        file("../../NPDevSamples/${sample}/Input/model.json")
                ]
        ]
    }

    inputs.files(copyGroups.collectMany { it.files })

    doLast {
        // Compare content with line endings normalized: a raw byte compare would false-fail on
        // CRLF/LF drift between the three trees. This still catches real divergence (e.g. a
        // deprecated top-level schemaVersion left in one copy).
        def normalize = { File modelFile -> modelFile.getText('UTF-8').replace('\r\n', '\n').replace('\r', '\n') }
        def failures = []
        copyGroups.each { group ->
            def missing = group.files.findAll { !it.isFile() }
            if (!missing.isEmpty()) {
                failures << "Official sample '${group.sample}' is missing copies: ${missing.join(', ')}"
                return
            }
            def reference = group.files.first()
            def referenceText = normalize(reference)
            group.files.drop(1).each { copy ->
                if (normalize(copy) != referenceText) {
                    failures << "Official sample '${group.sample}' copy is out of sync with ${reference}: ${copy}"
                }
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException(failures.join(System.lineSeparator()))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('checkRuntimeSchemaCopies')
    dependsOn tasks.named('checkSampleModelCopies')
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'jacoco'

    group = 'com.npdev'
    version = '0.1.0'

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    dependencies {
        testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
        testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.0'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        // Perf: see note on the root Test config above.
        maxHeapSize = '2g'
        maxParallelForks = 4
        jvmArgs '-XX:+UseParallelGC'
        finalizedBy tasks.named('jacocoTestReport')
    }

    tasks.withType(JacocoReport).configureEach {
        reports {
            xml.required = true
            html.required = false
        }
    }
}
