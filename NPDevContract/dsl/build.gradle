plugins {
    id 'java-library'
}

group = 'com.npdev'
version = '0.1.0'

def resolveNpdevBuildRoot = {
    def configured = System.getenv('NPDEV_BUILD_ROOT')
    if (configured != null && !configured.trim().isEmpty()) {
        return file(configured)
    }
    // npdev-build-root-resolution: find the repo root by its CONTENTS, not its NAME. A clone named
    // anything but 'NPDev_General' used to fall through to a fallback that disagreed with
    // scripts/npdev-common.ps1's Get-NPDevBuildRoot by one directory -- see that function's comment
    // for the CI failure it caused. Same predicate as WorkspaceRootLocator.java.
    def sourceRoot = rootDir
    while (sourceRoot != null && !(new File(sourceRoot, 'NPDevContract').isDirectory()
            && new File(sourceRoot, 'NPDevGenerator').isDirectory()
            && new File(sourceRoot, 'NPDevKernel').isDirectory())) {
        sourceRoot = sourceRoot.parentFile
    }
    if (sourceRoot != null && sourceRoot.parentFile != null) {
        return new File(sourceRoot.parentFile, 'Build')
    }
    return new File(rootDir.parentFile, 'Build')
}

def npdevExternalBuildRoot = resolveNpdevBuildRoot()

allprojects {
    def safeProjectPath = project.path == ':' ? 'root' : project.path.substring(1).replace(':', '/')
    layout.buildDirectory.set(new File(npdevExternalBuildRoot, "gradle/${rootProject.name}/${safeProjectPath}"))
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.networknt:json-schema-validator:1.5.6'

    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.0'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // Perf: forked test JVMs default to 512m and ignore org.gradle.jvmargs.
    // These suites (ArchUnit/validation) are pure CPU and fork-safe.
    maxHeapSize = '2g'
    maxParallelForks = 4
    jvmArgs '-XX:+UseParallelGC'
}

// AI-authoring loop: validate a draft model.json (structural + semantic) without generating.
// Prints a typed JSON diagnostic report (contract npdev-validation-report.v2) and, with
// -PreportOut=<path>, also writes it to that file (the noise-free channel the CLI/MCP reads).
// ignoreExitValue lets the report surface even when the model fails validation (exit 2).
tasks.register('validateModel', JavaExec) {
    group = 'verification'
    description = 'Validate a model.json (structural + semantic) and emit a typed JSON diagnostic report.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.npdev.dsl.v1.cli.ModelValidatorMain'
    ignoreExitValue = true
    def cliArgs = []
    if (project.hasProperty('modelPath')) {
        cliArgs << project.getProperty('modelPath')
    }
    if (project.hasProperty('reportOut')) {
        cliArgs << '--out' << project.getProperty('reportOut')
    }
    // R81 (ledger/items/REG-81.yml): opt-in pass-through for ReleaseGateValidator.validatePromotion,
    // wired into ModelValidatorMain behind --releaseGate/--targetTruthLevel (both required together).
    if (project.hasProperty('releaseGate')) {
        cliArgs << '--releaseGate'
    }
    if (project.hasProperty('targetTruthLevel')) {
        cliArgs << "--targetTruthLevel=${project.getProperty('targetTruthLevel')}"
    }
    if (project.hasProperty('evidencePath')) {
        cliArgs << "--evidencePath=${project.getProperty('evidencePath')}"
    }
    args cliArgs
}

// PK-3: npdev pack add|update|list|why -- same JavaExec-wrapping-a-small-Main-class convention as
// validateModel above. add/update share one Main class (PackAddMain; PackUpdateMain is a 1-line
// delegate) since they're the same operation under two names.
tasks.register('packAdd', JavaExec) {
    group = 'verification'
    description = 'Resolve a model\'s transitive pack graph and (re)write npdev.lock.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.npdev.dsl.v1.cli.PackAddMain'
    ignoreExitValue = true
    def cliArgs = []
    if (project.hasProperty('modelPath')) {
        cliArgs << project.getProperty('modelPath')
    }
    if (project.hasProperty('reportOut')) {
        cliArgs << '--out' << project.getProperty('reportOut')
    }
    args cliArgs
}

