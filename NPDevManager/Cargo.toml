[package]
name = "npdev-manager"
version = "0.1.0"
edition = "2021"
description = "Installs and runs NPDev for someone who will never open a terminal."
license = "MIT"
repository = "https://github.com/MarceloGiazzon/NPDevGeneral"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
futures-util = "0.3"
zip = "8"
tar = "0.4"
flate2 = "1"
sha2 = "0.11"
dirs = "6"

[target.'cfg(windows)'.dependencies]
win32job = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
