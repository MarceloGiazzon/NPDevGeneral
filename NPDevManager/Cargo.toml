[package]
name = "npdev-manager"
version = "0.1.0"
edition = "2021"
description = "Installs and runs NPDev for someone who will never open a terminal."
license = "MIT"
repository = "https://github.com/MarceloGiazzon/NPDevGeneral"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is what lets the Scrap Manager's filmstrip render a screenshot straight off disk
# (convertFileSrc). Its SCOPE is narrowed in tauri.conf.json to exploration blob directories -- the
# feature flag opens the protocol, the scope decides what it may reach, and both are needed.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
futures-util = "0.3"
zip = "8"
tar = "0.4"
flate2 = "1"
sha2 = "0.11"
dirs = "6"
# Native multi-folder picker for D7's "add a folder to inspect" -- the same dialog every other
# Windows app uses for "pick some folders," instead of requiring an exact path typed by hand.
rfd = "0.15"

# The Prompter's provider credentials live in the OS credential store, never in manager.json.
# Per-target because the crate needs a platform backend chosen at compile time, and the right one
# differs: Windows Credential Manager, the Linux kernel keyutils keyring (no D-Bus daemon required,
# which matters because the --selftest container has none), and the macOS Keychain.
[target.'cfg(windows)'.dependencies]
win32job = "2"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Two profiles, because the Manager is 1,860 lines of Rust that launches Java and serves a local
# page: its hot path is a subprocess blocking for minutes, so whole-program optimisation across 531
# crates buys ~0.01% of wall-clock and costs most of the build.
#
# `release` stays fully optimised because that is the profile `cargo tauri build` uses to produce
# the published installer, and tauri-cli 2.11 has NO `--profile` flag -- it cannot be pointed at a
# custom profile. (storage/PLAN.md §7.1 proposed the opposite split, fast `release` + slow `dist`;
# that shape is not reachable through the bundler, so the roles are inverted here and the intent --
# "only the artifact you publish pays for LTO" -- is preserved.) That build runs manually, once, per
# release, where nobody waits.
#
# `quick` is for LOCAL ITERATION: `cargo build --profile quick`.
#
# MEASURED 2026-08-08 on this project's dev machine, rather than assumed. storage/PLAN.md §7.1
# predicted "16 min -> 2-4 min"; that is not what happened, and the real shape is worth knowing:
#
#   warm rebuild (touch src/main.rs)   release ~310s    quick ~150s     <- the real win, ~2x
#   from scratch (cargo clean)         release 1039s    quick 1317s     <- quick does NOT help
#
# The 16-minute figure is real, but it belongs to the from-scratch case, and that is exactly the
# case LTO is not the dominant cost in -- compiling 531 dependency crates is. So `quick` is a
# genuine iteration win and NOT a fix for a cold build. The manager-harness container build is
# cold every time and deliberately stays on `release`; see the note in its Dockerfile.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
