# Routine version-update PRs are DISABLED (2026-08-29, owner decision). This repo is solo work with
# no review workflow -- the weekly-scan-and-open-a-PR machinery below existed to support a team
# process (bot proposes, human approves) that has no counterpart here. It produced up to ~24-34 open
# PRs on a single run (8 entries below, each independently scanning its own Gradle root/npm/actions
# tree -- see the history further down for why 8, not 1) with no review loop to clear them.
#
# SECURITY ALERTS ARE UNAFFECTED. This file controls Dependabot VERSION updates only. Dependabot
# SECURITY updates (a PR opened because a dependency has a known vulnerability, not just a newer
# release) are a separate GitHub feature, controlled by repo Settings -> Code security -> Dependabot,
# not by this file -- disabling `updates:` here does not turn that off.
#
# To re-enable routine scanning later, restore an `updates:` list shaped like the historical one
# preserved below in comments, or regenerate it from the live repo layout (`gradlew projects` per
# root) rather than trusting this comment to still be accurate by then.
#
# ledger/items/SEC-2.yml (DONE, 2026-08-13) is UNAFFECTED by this change -- its guard checks
# scripts/security/check-npm-audit-policy.py and workflow `permissions:` blocks, neither of which
# reads this file's `updates:` list.
version: 2
updates: []

# -------------------------------------------------------------------------------------------------
# HISTORICAL CONFIG (2026-08-13 - 2026-08-29), kept for reference only -- not live, not read by
# anything. This is what `updates:` looked like when it was active: one `gradle` entry per
# independently-buildable Gradle root (this repo has no single root build -- 6 real roots, each with
# its own settings.gradle + gradlew: repo root, NPDevContract/dsl, NPDevGenerator, NPDevKernel,
# NPDevRuntimeHost, NPDevRuntimeHost/runtimehost-core), one `npm` entry (the JSON-schema validator
# under scripts/quality/json-schema-validator), one `github-actions` entry (the `uses:` pins in
# .github/workflows/*.yml). Each carried `open-pull-requests-limit: 5` and, from 2026-08-29 onward
# for its final few hours, a `groups:` block bundling minor/patch updates into one PR per entry
# (major bumps stayed ungrouped -- see ledger/items/SEC-2.yml and the Cold Clone Audit CI cleanup,
# which closed 9 major-bump PRs as genuine API-incompatible changes, not noise).
#
# KNOWN LIMITATION this config never solved: two Spring Boot pins exist in this repo.
# NPDevRuntimeHost/build.gradle (the Dependabot-scannable file) and
# NPDevRuntimeHost/build.gradle.template (the file FinalAppAssembler copies byte-for-byte into every
# generated FinalApp) BOTH pin the same version and must be bumped together by hand -- Dependabot
# parses `*.gradle` files, not `*.gradle.template` (its parser rejects the template's
# mustache-adjacent tokens), so a PR could only ever touch build.gradle. This limitation applies
# whether or not routine scanning is active, so re-enabling later does not fix it either.
