name: NPDev Release Gate

on:
  workflow_dispatch:

# R2 (MASTER-ROADMAP.md Step 9 / ledger SEC-2): least-privilege default -- despite the name, this is
# a readiness CHECK (traceable-local-release + roadmap-closure), not a publisher; it never tags,
# releases, or pushes. See publish-runtimehost-libs.yml for the workflow that actually needs write.
permissions:
  contents: read

concurrency:
  group: npdev-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: AI-only Beta 0 release eligibility
    runs-on: windows-latest
    timeout-minutes: 150

    defaults:
      run:
        shell: pwsh

    env:
      CI: true
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Dorg.gradle.workers.max=2 -Dorg.gradle.vfs.watch=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Java 17 FIRST, and 17 is the one that matters: NPDev's Gradle builds request a
      # languageVersion=17 toolchain, and no toolchain download repository is configured, so a runner
      # with only 21 installed cannot satisfy them. This gate previously set up 21 alone, which made
      # gate 8/27 (runtimehost-staged-jar-preflight) fail with
      #   "No matching toolchains found for requested specification: {languageVersion=17 ...}
      #    No locally installed toolchains match and toolchain download repositories
      #    have not been configured."
      # when it shelled out to NPDevContract/dsl's gradlew. Every other workflow in this repo
      # (ci-validation, pr-gate, kernel-quality-gate, ai-knowledge-gate) already sets up 17; this one
      # was the outlier, and nobody could see it because the run always died at gate 1/27 long before
      # reaching gate 8.
      #
      # Both versions are installed, mirroring npdev-ci-validation.yml: setup-java points JAVA_HOME at
      # the LAST version listed, so 21 stays the default JVM while 17 remains discoverable as a
      # toolchain -- keeping this gate's JAVA_HOME behaviour identical to what it was before.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run traceable Beta 0 release check
        run: pwsh ./scripts/quality/run-traceable-local-release.ps1 -WorkspaceRoot .

      - name: Run roadmap closure check
        if: always()
        run: pwsh ./scripts/quality/run-roadmap-closure-check.ps1 -WorkspaceRoot .

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npdev-release-gate-evidence
          path: scripts/reports/out
          if-no-files-found: warn
          retention-days: 30
