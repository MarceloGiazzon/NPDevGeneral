name: NPDev Release Gate

on:
  workflow_dispatch:

# R2 (MASTER-ROADMAP.md Step 9 / ledger SEC-2): least-privilege default -- despite the name, this is
# a readiness CHECK (traceable-local-release + roadmap-closure), not a publisher; it never tags,
# releases, or pushes. See publish-runtimehost-libs.yml for the workflow that actually needs write.
permissions:
  contents: read

concurrency:
  group: npdev-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: AI-only Beta 0 release eligibility
    runs-on: windows-latest
    timeout-minutes: 150

    defaults:
      run:
        shell: pwsh

    env:
      CI: true
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Dorg.gradle.workers.max=2 -Dorg.gradle.vfs.watch=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run traceable Beta 0 release check
        run: pwsh ./scripts/quality/run-traceable-local-release.ps1 -WorkspaceRoot .

      - name: Run roadmap closure check
        if: always()
        run: pwsh ./scripts/quality/run-roadmap-closure-check.ps1 -WorkspaceRoot .

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npdev-release-gate-evidence
          path: scripts/reports/out
          if-no-files-found: warn
          retention-days: 30
