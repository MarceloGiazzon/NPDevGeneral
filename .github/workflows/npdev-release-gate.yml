name: NPDev Release Gate

on:
  workflow_dispatch:

concurrency:
  group: npdev-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: NPDev manual release gate
    runs-on: windows-latest
    timeout-minutes: 240

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Manual release gate disabled for CI hardening
        run: |
          Write-Host "The monolithic beta release gate is intentionally manual-only."
          Write-Host "Use NPDev CI Validation for automatic push/PR validation."
          Write-Host "Local official release baseline remains valid and traceable."
          Write-Host "Re-enable this workflow only after each beta-gate lane is CI-safe as an isolated step."
