name: Publish RuntimeHost Libs

# I5 (manager/PHASE0_SPEC.md): on a tag push, build the runtimehost jars ONCE and attach them to
# a GitHub Release as `runtimehost-libs-<tag>.zip` + a sibling `SHA256SUMS`. `npdev setup` tries
# this download first (see `_try_download_runtimehost_libs` / `run_setup` in
# NPDevCli/npdev_cli.py) and always falls back to a local build -- untagged commit, no release,
# download failure, or checksum mismatch -- so a fork, an offline machine, or a plain feature
# branch checkout still works with no asset at all (§9: the fallback is not optional).
#
# Jars are plain JVM bytecode (platform-independent) -- built on ubuntu-latest, the cheaper
# runner, not Windows; nothing about the artifact is platform-specific.
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)publish for (defaults to the ref that triggered this run)"
        required: false

permissions:
  contents: write

concurrency:
  group: publish-runtimehost-libs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build + publish runtimehost-libs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: true
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Dorg.gradle.workers.max=2 -Dorg.gradle.vfs.watch=false

    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing runtimehost-libs for tag: $TAG"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Mirrors npdev-ci-validation.yml's own neutralization: the committed gradle.properties
      # hardcode a dev-machine absolute Windows org.gradle.projectcachedir.
      - name: Neutralize dev-machine gradle projectcachedir (portability)
        run: |
          for f in gradle.properties NPDevContract/dsl/gradle.properties NPDevEditor/gradle.properties NPDevGenerator/gradle.properties NPDevKernel/gradle.properties NPDevRuntimeHost/gradle.properties; do
            [ -f "$f" ] && sed -i '/org\.gradle\.projectcachedir/d' "$f" || true
          done

      # --build-local: this job's OWN job is to produce the artifact everyone else downloads --
      # it must never itself try to download a (possibly stale, possibly this-tag's-own-not-yet-
      # published) release.
      - name: Build runtimehost jars for this tag (never a download)
        run: |
          chmod +x ./npdev
          ./npdev setup --build-local

      - name: Package the Release asset
        id: package
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          LIBS_DIR="$(dirname "$GITHUB_WORKSPACE")/Build/runtimehost-libs"
          if [ ! -d "$LIBS_DIR" ]; then
            echo "::error::runtimehost-libs dir not found at $LIBS_DIR"
            exit 1
          fi
          ZIP_NAME="runtimehost-libs-${TAG}.zip"
          (cd "$LIBS_DIR" && zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" .)
          cd "$GITHUB_WORKSPACE"
          sha256sum "$ZIP_NAME" > SHA256SUMS
          cat SHA256SUMS
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish (or update) the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          ZIP_NAME="${{ steps.package.outputs.zip_name }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_NAME" SHA256SUMS --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$ZIP_NAME" SHA256SUMS \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --generate-notes
          fi

  # -------------------------------------------------------------------------------------------
  # storage/FULL_SUPPORT_PLAN.md W6.2 (exit criterion E13).
  #
  # beta1.7 carries NPDev.Manager_0.1.0_x64-setup.exe. beta1.8 and beta1.9 do NOT -- so a third
  # person landing on the NEWEST release today gets libs and no installer, and the installer is the
  # thing that removes the terminal. The cause was simply that nothing built it on a tag: beta1.7's
  # asset was produced by hand from a Windows machine, which is a step that gets skipped.
  #
  # So this is the fix rather than a one-off upload. Every future tag carries both.
  #
  # Windows runner, because NSIS bundling needs one and the Manager's primary audience is on
  # Windows. The Linux AppImage is a separate matter (proven buildable in Docker, never published
  # from a tag) and is deliberately NOT bolted on here -- a job that sometimes produces two
  # artifacts and sometimes one is harder to read than two jobs.
  #
  # `continue-on-error` is deliberate and narrow: the libs asset above is what `npdev setup`
  # DEPENDS ON, and a Manager build failure must not stop it being published. A missing installer is
  # an inconvenience; a missing libs zip breaks every fresh install. The job still shows red.
  # -------------------------------------------------------------------------------------------
  publish-manager-installer:
    name: Build + publish the Manager installer
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Build/manager-target
          key: manager-cargo-${{ runner.os }}-${{ hashFiles('NPDevManager/Cargo.lock') }}

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # The UI is plain JS with no bundler (SPEC.md 1.1), so there is no npm step -- `frontendDist`
      # points straight at NPDevManager/ui.
      - name: Build the installer
        working-directory: NPDevManager
        run: cargo tauri build --bundles nsis

      - name: Publish to the Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # ASK CARGO where the bundle is; never assume NPDevManager/target.
          #
          # NPDevManager/.cargo/config.toml sets `target-dir = "../../Build/manager-target"` -- this
          # repo's standing rule that build output lives OUTSIDE the source tree. Run 31279876726
          # built the installer successfully and then failed to publish it, because this step looked
          # in NPDevManager/target, which does not exist. `cargo metadata` reports the real directory
          # whatever the config says, so the same mistake cannot recur if that path changes again.
          TARGET_DIR="$(cd NPDevManager && cargo metadata --format-version 1 --no-deps             | python -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          echo "cargo target directory: $TARGET_DIR"
          SETUP="$(find "$TARGET_DIR/release/bundle/nsis" -name '*-setup.exe' 2>/dev/null | head -1)"
          if [ -z "$SETUP" ]; then
            echo "::error::no NSIS installer found under $TARGET_DIR/release/bundle/nsis"
            find "$TARGET_DIR" -name '*.exe' -path '*bundle*' 2>/dev/null | head -20
            exit 1
          fi
          echo "installer: $SETUP"
          sha256sum "$SETUP" | tee manager-installer-SHA256SUMS
          # `--clobber` so re-publishing a tag replaces the asset rather than failing. The libs job
          # may or may not have created the release yet -- these two run in parallel on purpose (the
          # Windows build is the slow one), so this creates it if needed.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$SETUP" manager-installer-SHA256SUMS \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$SETUP" manager-installer-SHA256SUMS \
              --repo "${{ github.repository }}" --title "$TAG" --generate-notes
          fi

  # -------------------------------------------------------------------------------------------
  # E16 -- the Linux installer. storage/parity/ENGINE_PARITY_PLAN.md P5b.
  #
  # beta1.10 shipped NPDev.Manager_0.1.0_x64-setup.exe and no Linux artifact, so half the possible
  # audience had no installer at all. `tauri.conf.json` has declared `bundle.targets:
  # ['nsis','appimage']` the whole time -- the target existed and CI had simply never built it.
  #
  # Sibling of publish-manager-installer, deliberately: same `continue-on-error`, same "ask cargo
  # where the bundle is", same tag resolution. A Linux build failing must not stop the libs zip,
  # which is the artifact every fresh install actually needs.
  #
  # ubuntu-22.04, NOT ubuntu-latest, and that is the point rather than caution: an AppImage links
  # against the glibc of the machine that built it, so building on 24.04 (glibc 2.39) produces a
  # bundle that refuses to start on any older distro -- and the failure looks like a corrupt
  # download, not an incompatibility. 22.04 (glibc 2.35) reaches back considerably further.
  # -------------------------------------------------------------------------------------------
  publish-manager-appimage:
    name: E16 -- build + publish the Manager AppImage (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Build/manager-target
          key: manager-cargo-${{ runner.os }}-${{ hashFiles('NPDevManager/Cargo.lock') }}

      # Tauri 2 needs webkit2gtk 4.1 specifically (v1 used 4.0). libayatana-appindicator3 is the
      # tray dependency; patchelf and libfuse2 are what the AppImage tooling itself needs -- without
      # libfuse2 the bundler produces an image that cannot mount itself on the user's machine.
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the AppImage
        working-directory: NPDevManager
        run: cargo tauri build --bundles appimage

      - name: Publish to the Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          # ASK CARGO where the bundle is; never assume NPDevManager/target. The Windows job learned
          # this the expensive way in run 31279876726 -- it built successfully and then failed to
          # publish, because .cargo/config.toml redirects target-dir out of the source tree (this
          # repo's own policy) and the step looked in the directory that policy guarantees is empty.
          TARGET_DIR="$(cd NPDevManager && cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          echo "cargo target directory: $TARGET_DIR"
          APPIMAGE="$(find "$TARGET_DIR/release/bundle/appimage" -name '*.AppImage' 2>/dev/null | head -1)"
          if [ -z "$APPIMAGE" ]; then
            echo "::error::no AppImage found under $TARGET_DIR/release/bundle/appimage"
            find "$TARGET_DIR" -name '*.AppImage' -o -name '*.deb' 2>/dev/null | head -20
            exit 1
          fi
          echo "appimage: $APPIMAGE"
          chmod +x "$APPIMAGE"
          sha256sum "$APPIMAGE" | tee manager-appimage-SHA256SUMS

          # What this run can and cannot claim, recorded in the run itself so the release notes are
          # not the only place anyone looks. `--appimage-extract` mounts nothing and needs no FUSE,
          # so it works on a runner; it proves the bundle is well-formed, NOT that it launches.
          "$APPIMAGE" --appimage-extract >/dev/null 2>&1 \
            && echo "AppImage self-extracts: OK (the bundle is well-formed)" \
            || echo "::warning::AppImage did not self-extract -- the bundle may be malformed"
          {
            echo "### E16 -- Manager AppImage"
            echo
            echo "| property | state |"
            echo "|---|---|"
            echo "| built | yes, on ubuntu-22.04 (glibc 2.35) |"
            echo "| well-formed | \`--appimage-extract\` succeeded |"
            echo "| **launches on a clean desktop** | **NOT VERIFIED** -- no GUI on a CI runner |"
            echo "| **runs without webkit2gtk installed by hand** | **NOT VERIFIED** -- manager/CLOSEOUT_PLAN.md's open question |"
            echo
            echo "The last two are the difference between an installer and a download, and neither"
            echo "can be answered by a headless runner. They need a clean-desktop trial."
          } >> "$GITHUB_STEP_SUMMARY"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APPIMAGE" manager-appimage-SHA256SUMS \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$APPIMAGE" manager-appimage-SHA256SUMS \
              --repo "${{ github.repository }}" --title "$TAG" --generate-notes
          fi
