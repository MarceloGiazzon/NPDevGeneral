name: AI Beta Gate

on:
  pull_request:
    paths:
      - "golden-ai-scenarios/**"
      - "schemas/ai/**"
      - "scripts/ai/**"
      - "scripts/policy/**"
      - "scripts/quality/**"
      - "scripts/security/**"
      - "NPDevContract/**"
      - "NPDevGenerator/**"
      - "NPDevKernel/**"
      - "NPDevRuntimeHost/**"
      - ".github/workflows/ai-beta-gate.yml"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ai-beta-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-beta-gate:
    name: AI-only Beta 0 proof
    runs-on: windows-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    env:
      CI: true
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Dorg.gradle.workers.max=2 -Dorg.gradle.vfs.watch=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ai-beta-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ai-beta-gradle-${{ runner.os }}-

      - name: Final Beta 0 release check
        run: pwsh ./scripts/quality/run-beta0-final-release-check.ps1

      - name: Upload AI beta reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-beta-gate-reports
          path: scripts/reports/out
          if-no-files-found: warn
          retention-days: 14
