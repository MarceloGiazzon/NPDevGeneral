name: Storage dialect conformance

# storage/PLAN.md §6 and §11.7. The conformance vectors run locally against H2 in each engine's
# compatibility MODE, which catches syntax and shape in seconds with no Docker. This workflow is the
# OTHER half, and the half that decides whether an engine may be CALLED supported:
#
#   "H2-in-MySQL-mode catches syntax, not semantics. REG-36 and REG-50 are this lesson already
#    learned once. Never claim MySQL support from a green local run alone."
#
# NPDEV_DIALECT_BACKEND=container flips DialectTestSupport from H2 to a real Testcontainers engine.
# The SAME test classes run -- the suite never learns which backend it got, which is what lets one
# suite serve both -- so the 12 vectors SKIPPED locally (each printing its reason) are genuinely
# executed here.
#
# ---------------------------------------------------------------------------------------------
# WHY workflow_dispatch ONLY, for now
#
# FIRST RUN: 31264977219, at commit 5814886, 2026-08-08. Three jobs red -- and underneath, MySQL 8.4
# passed 13/13 and Postgres 16 passed 13/13, against real containers, with ZERO vectors skipped. The
# 14 failures per job were 13 harness (h2 has no container image) plus ONE real behavioural finding
# on SQL Server: J2 stored "cafe [U+2615]" into a hand-written VARCHAR and read back "cafe ?",
# because SQL Server's VARCHAR is non-Unicode. All six fixes in storage/CONFORMANCE_FIX_PLAN.md have
# landed since.
#
# It stays dispatch-only anyway, and the reason changed: it is no longer "this has never run", it is
# that the container images below are MOVING TAGS. A suite that changes underneath you cannot tell
# "we broke it" from "the image changed", and that is a bad property for a gate that blocks pushes.
# Pin the images, then add the `push`/`pull_request` triggers below -- that promotion is the last
# step of storage/PLAN.md §11.7, and until it happens MySQL and SQL Server are "verified once",
# NOT "supported". See ledger STOR-3.
#
#   on:
#     push:
#       branches: [main]
#       paths: ['NPDevKernel/kernel/src/**/storage/sql/**', 'NPDevKernel/adapters/**',
#               'NPDevGenerator/generator/src/main/java/com/npdev/generator/dbconfig/**',
#               '.github/workflows/storage-dialect-conformance.yml']
# ---------------------------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      engine:
        description: 'Which engine to run against (all, mysql, postgres, sqlserver)'
        required: false
        default: 'all'

jobs:
  tier-a:
    name: Tier A -- string generation, no database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CI: true
      # REG-144: pin the build root so Gradle and PowerShell cannot resolve different ones on a
      # checkout not named NPDev_General. Same reasoning as npdev-ci-validation.yml.
      NPDEV_BUILD_ROOT: ${{ github.workspace }}/Build
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Runs first and needs no container: a typo in a clause should fail in seconds, not after an
      # engine has finished starting.
      - name: Tier A
        working-directory: NPDevKernel
        run: ./gradlew :kernel:test --tests '*DialectConformanceTierATest*' --no-daemon --console=plain

  conformance:
    name: Tier B -- ${{ matrix.engine }} (real engine)
    needs: tier-a
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # NOT fail-fast: when two engines break, seeing both in one run is the difference between one
      # fix and two round trips.
      fail-fast: false
      matrix:
        engine: [mysql, postgres, sqlserver]
    defaults:
      run:
        shell: bash
    env:
      CI: true
      NPDEV_BUILD_ROOT: ${{ github.workspace }}/Build
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Dorg.gradle.workers.max=2
      # The flip. Without it this job would run H2 and report a green that means nothing.
      NPDEV_DIALECT_BACKEND: container
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No `services:` block: DialectTestSupport starts its own containers via Testcontainers, the
      # same lifecycle PostgresTestSupport already uses (one per engine per JVM, Ryuk-reaped). A
      # services block would start a SECOND database that nothing connects to.
      #
      # -Dnpdev.dialect.only scopes the JVM to ONE engine. Without it the matrix selected jobs but
      # the test class stayed parameterised over every dialect, so each job started three containers,
      # verified MySQL three times, and reported SQL Server's failure three times -- and a job's
      # red/green said nothing about the engine in its name. NPDevKernel/build.gradle forwards the
      # property into the forked test JVM; Gradle does NOT do that on its own, and when it silently
      # did nothing the run still reported green, which is why DialectTestSupportSelectionTest now
      # pins the behaviour.
      - name: Tier B against a real ${{ matrix.engine }}
        if: ${{ github.event.inputs.engine == 'all' || github.event.inputs.engine == matrix.engine }}
        working-directory: NPDevKernel
        run: |
          ./gradlew :kernel:test --tests '*DialectConformanceTierBTest*' \
            -Dnpdev.dialect.only=${{ matrix.engine }} \
            --no-daemon --console=plain

      # Runs on failure too, and that is the point: the first run's headline said "3 jobs failed"
      # while containing a 13/13 pass nobody could see without downloading the artifact.
      - name: Per-dialect summary
        if: always()
        run: |
          python3 scripts/quality/summarize-dialect-conformance.py \
            Build/gradle/npdev-kernel/kernel/test-results \
            --title "Tier B -- ${{ matrix.engine }} (real engine)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.engine }}
          path: Build/gradle/npdev-kernel/kernel/test-results/**/*.xml
          if-no-files-found: warn
