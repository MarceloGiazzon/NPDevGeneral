name: Storage dialect conformance

# storage/PLAN.md §6 and §11.7. The conformance vectors run locally against H2 in each engine's
# compatibility MODE, which catches syntax and shape in seconds with no Docker. This workflow is the
# OTHER half, and the half that decides whether an engine may be CALLED supported:
#
#   "H2-in-MySQL-mode catches syntax, not semantics. REG-36 and REG-50 are this lesson already
#    learned once. Never claim MySQL support from a green local run alone."
#
# NPDEV_DIALECT_BACKEND=container flips DialectTestSupport from H2 to a real Testcontainers engine.
# The SAME test classes run -- the suite never learns which backend it got, which is what lets one
# suite serve both -- so the 12 vectors SKIPPED locally (each printing its reason) are genuinely
# executed here.
#
# ---------------------------------------------------------------------------------------------
# THE TRIGGER, AND THE ORDER IT WAS PROMOTED IN
#
# FIRST RUN: 31264977219, at commit 5814886, 2026-08-08. Three jobs red -- and underneath, MySQL 8.4
# passed 13/13 and Postgres 16 passed 13/13, against real containers, with ZERO vectors skipped. The
# 14 failures per job were 13 harness (h2 has no container image) plus ONE real behavioural finding
# on SQL Server: J2 stored "cafe [U+2615]" into a hand-written VARCHAR and read back "cafe ?",
# because SQL Server's VARCHAR is non-Unicode. All six fixes in storage/CONFORMANCE_FIX_PLAN.md have
# landed since.
#
# It stayed dispatch-only for one more round, and the reason had changed: no longer "this has never
# run", but that the container images were MOVING TAGS. A suite that changes underneath you cannot
# tell "we broke it" from "the image changed", and that is a bad property for a gate that blocks
# pushes. So the images were pinned to digests FIRST (storage/FULL_SUPPORT_PLAN.md W1.1), and only
# then were the push triggers added (W1.2). Doing it the other way round buys a gate people re-run
# instead of read.
# ---------------------------------------------------------------------------------------------

on:
  # W1.2, and it comes AFTER W1.1's pinning, deliberately -- see the note above. The paths are the
  # ones the dispatch-only comment already drafted: the dialect package itself, the adapters that
  # consume it, the generator's engine mapping, and this workflow. A change to any of them can move
  # what an engine actually does, and nothing else re-verified that.
  #
  # `paths:` is a filter nobody should trust without watching it fire. Verified by pushing a
  # whitespace-only change to one listed path and confirming a run started with no dispatch.
  push:
    branches: [main]
    paths:
      - 'NPDevKernel/kernel/src/**/storage/sql/**'
      - 'NPDevKernel/adapters/**'
      - 'NPDevGenerator/generator/src/main/java/com/npdev/generator/dbconfig/**'
      - '.github/workflows/storage-dialect-conformance.yml'
  pull_request:
    paths:
      - 'NPDevKernel/kernel/src/**/storage/sql/**'
      - 'NPDevKernel/adapters/**'
      - 'NPDevGenerator/generator/src/main/java/com/npdev/generator/dbconfig/**'
      - '.github/workflows/storage-dialect-conformance.yml'
  workflow_dispatch:
    inputs:
      engine:
        description: 'Which engine to run against (all, mysql, postgres, sqlserver)'
        required: false
        default: 'all'

env:
  # ---------------------------------------------------------------------------------------------
  # PINNED IMAGE DIGESTS -- the twin of DialectTestSupport.CONTAINER_IMAGES.
  #
  # These are NOT what starts the containers (Testcontainers reads the Java map). They exist so the
  # digest is visible IN THE RUN rather than only in a source file, and so the pre-pull step below
  # fails loudly if a digest stops resolving. check-container-images-pinned.py fails the knowledge
  # gate the moment these two lists disagree -- registered as a twin-pair rule, because "one place
  # updated, its twin forgotten" is this repo's most repeated defect (REG-89/104/112/144).
  #
  # DIGEST ONLY, no tag prefix: Testcontainers 1.21.4 parses `repo:tag@sha256:...` by splitting on
  # `@` alone, so the repository comes back as `mysql:8.4` and the container refuses the image at
  # construction. These stay byte-identical to the Java map so the checker can compare them directly;
  # the tag each digest came from is recorded in DialectTestSupport.CONTAINER_IMAGE_TAGS.
  #
  # Pinned 2026-08-08 (mysql:8.4, postgres:16, mssql/server:2022-latest). Refresh due 2026-11-08:
  #   python scripts/quality/check-container-images-pinned.py --resolve
  # ---------------------------------------------------------------------------------------------
  PINNED_MYSQL: 'mysql@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb'
  PINNED_POSTGRES: 'postgres@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b'
  PINNED_SQLSERVER: 'mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89'

jobs:
  tier-a:
    name: Tier A -- string generation, no database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CI: true
      # REG-144: pin the build root so Gradle and PowerShell cannot resolve different ones on a
      # checkout not named NPDev_General. Same reasoning as npdev-ci-validation.yml.
      NPDEV_BUILD_ROOT: ${{ github.workspace }}/Build
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Runs first and needs no container: a typo in a clause should fail in seconds, not after an
      # engine has finished starting.
      - name: Tier A
        working-directory: NPDevKernel
        run: ./gradlew :kernel:test --tests '*DialectConformanceTierATest*' --no-daemon --console=plain

  conformance:
    name: Tier B -- ${{ matrix.engine }} (real engine)
    needs: tier-a
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # NOT fail-fast: when two engines break, seeing both in one run is the difference between one
      # fix and two round trips.
      fail-fast: false
      matrix:
        engine: [mysql, postgres, sqlserver]
    defaults:
      run:
        shell: bash
    env:
      CI: true
      NPDEV_BUILD_ROOT: ${{ github.workspace }}/Build
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Dorg.gradle.workers.max=2
      # The flip. Without it this job would run H2 and report a green that means nothing.
      NPDEV_DIALECT_BACKEND: container
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # W1.1's visible half. Two things this buys that the Java-side pin does not:
      #   1. the digest appears IN THE RUN LOG, so a green tick's evidence is readable without
      #      downloading a source file at the right commit;
      #   2. a digest that has been garbage-collected upstream fails HERE, in seconds, with a pull
      #      error -- instead of thirty seconds into a container start inside a forked test JVM whose
      #      stdout Gradle does not forward (the exact way F5 stayed invisible).
      - name: Pinned image for ${{ matrix.engine }}
        run: |
          case "${{ matrix.engine }}" in
            mysql)     IMAGE="$PINNED_MYSQL" ;;
            postgres)  IMAGE="$PINNED_POSTGRES" ;;
            sqlserver) IMAGE="$PINNED_SQLSERVER" ;;
            *) echo "no pinned image for engine '${{ matrix.engine }}'"; exit 1 ;;
          esac
          echo "pinned image: $IMAGE"
          echo "### Pinned image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          docker pull "$IMAGE"

      # No `services:` block: DialectTestSupport starts its own containers via Testcontainers, the
      # same lifecycle PostgresTestSupport already uses (one per engine per JVM, Ryuk-reaped). A
      # services block would start a SECOND database that nothing connects to.
      #
      # -Dnpdev.dialect.only scopes the JVM to ONE engine. Without it the matrix selected jobs but
      # the test class stayed parameterised over every dialect, so each job started three containers,
      # verified MySQL three times, and reported SQL Server's failure three times -- and a job's
      # red/green said nothing about the engine in its name. NPDevKernel/build.gradle forwards the
      # property into the forked test JVM; Gradle does NOT do that on its own, and when it silently
      # did nothing the run still reported green, which is why DialectTestSupportSelectionTest now
      # pins the behaviour.
      - name: Tier B against a real ${{ matrix.engine }}
      # `github.event.inputs.engine` is EMPTY on a push -- there are no inputs. Without the
      # `|| 'all'` fallback this condition is false for every engine, so the whole matrix would skip
      # its real step and the job would report GREEN HAVING RUN NOTHING. That is the exact silent
      # defect this suite exists to prevent, arriving through the trigger promotion itself.
        if: ${{ (github.event.inputs.engine || 'all') == 'all' || github.event.inputs.engine == matrix.engine }}
        working-directory: NPDevKernel
        run: |
          ./gradlew :kernel:test --tests '*DialectConformanceTierBTest*' \
            -Dnpdev.dialect.only=${{ matrix.engine }} \
            --no-daemon --console=plain

      # Runs on failure too, and that is the point: the first run's headline said "3 jobs failed"
      # while containing a 13/13 pass nobody could see without downloading the artifact.
      - name: Per-dialect summary
        if: always()
        run: |
          python3 scripts/quality/summarize-dialect-conformance.py \
            Build/gradle/npdev-kernel/kernel/test-results \
            --title "Tier B -- ${{ matrix.engine }} (real engine)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.engine }}
          path: Build/gradle/npdev-kernel/kernel/test-results/**/*.xml
          if-no-files-found: warn
