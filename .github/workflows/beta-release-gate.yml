name: Beta Release Gate

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  beta-release:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out workspace
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: NPDevEditor/ui-react/package-lock.json

      - name: Run beta release gate
        shell: pwsh
        run: pwsh -File scripts\quality\run-beta-release-gate.ps1

      - name: Resolve evidence bundle
        if: always()
        shell: pwsh
        run: |
          $reportPath = Join-Path $PWD 'scripts\reports\out\beta-release-gate-report.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## Beta Release Gate`nBeta release report was not produced."
            exit 0
          }

          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          $summary = $report.summary
          $evidenceRoot = Join-Path $PWD ([string]$report.evidenceRoot)
          if (Test-Path -LiteralPath $evidenceRoot -PathType Container) {
            "BETA_EVIDENCE_ROOT=$evidenceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

          $summaryLines = @(
            '## Beta Release Gate'
            "- Overall status: $($report.overallStatus)"
            "- Passed: $($summary.passed)"
            "- Warnings: $($summary.warnings)"
            "- Failed: $($summary.failed)"
            "- Total: $($summary.total)"
            "- Evidence root: $($report.evidenceRoot)"
          )
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($summaryLines -join "`n")

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-release-out-${{ github.run_id }}
          path: scripts/reports/out
          if-no-files-found: warn
          retention-days: 14

      - name: Upload evidence bundle
        if: always() && env.BETA_EVIDENCE_ROOT != ''
        uses: actions/upload-artifact@v4
        with:
          name: beta-release-evidence-${{ github.run_id }}
          path: ${{ env.BETA_EVIDENCE_ROOT }}
          if-no-files-found: warn
          retention-days: 14
