name: NPDev PR Gate

# LNCH-19: "a PR that breaks a gate shows red on GitHub without any human running a script."
# Deliberately a NEW, faster workflow rather than adding `pull_request` to the existing
# `npdev-ci-validation.yml` Linux job -- that job is scoped for on-demand/release use (Postgres
# Testcontainers kernel adapters, Playwright, full maturity-report bootstrap, ~120min) and running
# all of that on every single PR would be slow and expensive. This workflow runs the doc's actual
# "on PR" DoD subset -- DSL (which includes ReleaseGateValidatorTest, so ReleaseGateValidator is
# exercised without a separate step), kernel inproc adapters, generator, and a RuntimeHost smoke
# via a real generated sample app's own test task -- and leaves the Postgres-Testcontainers kernel
# adapters + integrationTest + Playwright + full maturity bootstrap to the existing nightly-scoped
# workflow_dispatch job. Style follows ai-knowledge-gate.yml (this repo's prior art for
# lightweight PR-triggered gates, referenced by docs/LAUNCH_READINESS_GAPS.md's LNCH-19 write-up).
on:
  pull_request:
  workflow_dispatch:

# R2 (MASTER-ROADMAP.md Step 9 / ledger SEC-2): least-privilege default -- this job builds/tests and
# uploads its own evidence artifact, never commenting on the PR or writing to the repo.
permissions:
  contents: read

concurrency:
  group: npdev-pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: PR gate (DSL/kernel/generator/RuntimeHost smoke, Linux)
    runs-on: ubuntu-latest
    # F2b (docs/FINAL_OPEN_ITEMS_PLAN.md): budget re-verified after the two Postgres adapters
    # (persistence, idempotency) were promoted into this job -- see docs/ACCEPTED_BOUNDARIES.md B21.
    # OBSERVED (run 30422102769, 2026-07-29, real PR run, cold runner): 6m14s total wall clock.
    # S1_SPEC.md O2 (2026-08-03) added a third adapter (bulkhead-postgres) to the same shared
    # Testcontainers container. LOCALLY measured (dev machine, warm Gradle caches, all classes
    # UP-TO-DATE -- i.e. test-execution + container-reuse cost only, not a cold-runner proxy for the
    # 6m14s figure above): persistence+idempotency+bulkhead together = 39.6s, vs. B21's own
    # previously-recorded ~34s for persistence+idempotency alone -- bulkhead's marginal cost is a few
    # seconds, consistent with reusing one already-started container. 60 min leaves ample headroom.
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    env:
      CI: true
      # REG-10: pin the external build-output root explicitly. Without this, NPDevKernel/NPDevGenerator
      # build.gradle AND scripts/runtimehost/sync-runtimehost-libs.ps1 each fall back to walking up for a
      # folder named literally "NPDev_General" (else <workspace-parent>/Build). GitHub checks the repo out
      # as "NPDevGeneral" (no underscore -- the GitHub repo name), so that name-match fails and the gradle
      # builds emit jars to one Build dir while the sync script scans a different one -> zero jars found ->
      # "RuntimeHost libs sync failed" -> the packaged-app-boot proof tests fail. All three honor
      # NPDEV_BUILD_ROOT when set, so pinning it makes them agree. Sibling-of-repo, mirroring the dev
      # machine (D:\WorkSpace\NPDev\Build) and the ../NPDev_General__OutsideRepo path this workflow already uses.
      NPDEV_BUILD_ROOT: ${{ github.workspace }}/../Build
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Dorg.gradle.workers.max=2 -Dorg.gradle.vfs.watch=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: DSL contract check (includes ReleaseGateValidatorTest)
        working-directory: NPDevContract/dsl
        timeout-minutes: 15
        run: |
          # gradle.properties hardcodes org.gradle.projectcachedir to a D:\WorkSpace\NPDev\Build
          # path (this repo's own Windows-local build-output policy, docs/BUILD_OUTPUT_LOCATION_POLICY.md)
          # -- meaningless on a Linux runner. Gradle reads this from gradle.properties during its
          # own wrapper bootstrap, before a --project-cache-dir CLI override can take effect
          # (confirmed live: the CLI flag alone did not fix this) -- strip the line instead so
          # Gradle falls back to its own default (<project>/.gradle), which works on any OS.
          sed -i '/org\.gradle\.projectcachedir/d' gradle.properties
          ./gradlew check --no-daemon --console=plain

      - name: Kernel inproc adapter tests
        working-directory: NPDevKernel
        timeout-minutes: 20
        run: |
          sed -i '/org\.gradle\.projectcachedir/d' gradle.properties
          ./gradlew \
            :kernel:test \
            :adapters:audit-inproc:test \
            :adapters:bulkhead-inproc:test \
            :adapters:circuit-inproc:test \
            :adapters:events-inproc:test \
            :adapters:flowinstance-inproc:test \
            :adapters:idempotency-inproc:test \
            :adapters:notification-inproc:test \
            :adapters:persistence-inproc:test \
            :adapters:tracing-inproc:test \
            :adapters:webhook-inproc:test \
            :adapters:file-store-inproc:test \
            --no-daemon --console=plain

      # docs/REMEDIATION_PLAN.md R-P3 (3.5), widened by S1_SPEC.md O2 (2026-08-03,
      # docs/ACCEPTED_BOUNDARIES.md B21): three *-postgres adapters with a track record of REAL,
      # H2-invisible findings -- REG-36's btree index-entry size limit (idempotency), REG-50's
      # metadata-read failure fallback (persistence), and bulkhead's SELECT pg_try_advisory_lock/
      # pg_advisory_unlock (PostgresAdvisoryBulkheadStore) which has NO H2/in-memory equivalent at
      # all, so onlyOneThreadCanAcquireSameAdvisoryLock is architecturally impossible to satisfy
      # against anything but a real Postgres engine. All three shipped/have a real-Postgres-only
      # regression test (via :adapters:postgres-test-support, a single shared Testcontainers
      # `postgres:15-alpine`, a few seconds to start).
      #
      # The other five *-postgres adapters (eventstore/audit/circuit/flowinstance/tracestore) were
      # each read in full for this widening (verdicts: __OutsideRepo\s1\b21-coverage-assessment.txt)
      # and stay nightly-only, NOT because promoting them is expensive but because their tests would
      # pass identically against H2 today -- eventstore/audit/flowinstance are thin `Jdbc*` subclasses
      # with no dialect-specific SQL; circuit-postgres's FOR UPDATE row-locking assertion already runs,
      # unblocked by Docker, against H2 in the SAME test body (JdbcCircuitBreakerStateStoreConcurrencyTest,
      # GATE-KERNEL) with no documented H2/Postgres divergence, so re-running it here would duplicate
      # proof rather than add H2-invisible coverage; tracestore-postgres would too, and one of its two
      # test files (PersistentExecutionTracerTest) turned out to assert nothing at all (filed REG-127).
      # This remains a narrow, evidence-scoped promotion, not a blanket one -- promote the NEXT adapter
      # only when it earns the same bar: a real, H2-invisible finding with its own regression test.
      - name: "Postgres adapter tests (fast subset with real H2-invisible findings: persistence, idempotency, bulkhead)"
        working-directory: NPDevKernel
        timeout-minutes: 15
        run: |
          sed -i '/org\.gradle\.projectcachedir/d' gradle.properties
          ./gradlew \
            :adapters:persistence-postgres:test \
            :adapters:idempotency-postgres:test \
            :adapters:bulkhead-postgres:test \
            --no-daemon --console=plain

      - name: Generator unit tests
        working-directory: NPDevGenerator
        # REG-176: packagedProofTest now runs the 3 packaged-app-boot proofs SERIALLY
        # (maxParallelForks=1, generator/build.gradle) instead of contending for 2 forks with each
        # other -- budget raised from 20 to 30min for the added serial wall-clock, not because any
        # single test got slower.
        timeout-minutes: 30
        run: |
          sed -i '/org\.gradle\.projectcachedir/d' gradle.properties
          ./gradlew :generator:test :generator:behaviorTest --no-daemon --console=plain
          # REG-176 follow-up: NPDevGenerator/gradle.properties sets org.gradle.parallel=true, so a
          # single invocation naming both :generator:test and :generator:packagedProofTest as
          # top-level tasks let Gradle schedule them CONCURRENTLY (independent tasks, same project)
          # even though packagedProofTest serializes its own 3 tests internally -- reproduced live
          # (all 3 packaged-proof tests failed together, worse than the original 2-of-3 contention
          # this task split was meant to fix). A wholly separate invocation, after the fast suite
          # has already finished, is the only way to guarantee no concurrent Gradle task competes
          # for the same CPU/Docker/port resources during the packaged-app boots.
          ./gradlew :generator:packagedProofTest --no-daemon --console=plain

      # G2 (docs/CLOSEOUT_PLAN.md): the corpus-parse gate proves every DSL feature PARSES; nothing
      # proved any of them actually EMIT. dsl-conformance-max was "validated, not run" until this
      # step -- F4 was exactly this failure one layer over (generatedAction runtime-proven, but
      # validator-rejected, for as long as the feature existed). RED-then-GREEN proven live
      # (2026-07-29): temporarily forced CompiledModelCanonicalJson's aggregates field to an empty
      # array, regenerated -- this check correctly failed naming "aggregates"; reverted, regenerated,
      # green again. MEASURED local (warm Gradle daemon): ~10s; cheap enough to run on every PR
      # against this job's already-observed 6m14s/60min budget (F2b).
      - name: "Generate dsl-conformance-max (G2, docs/CLOSEOUT_PLAN.md): rare DSL features must actually emit, not just parse"
        timeout-minutes: 10
        run: |
          python scripts/quality/check-dsl-conformance-generates.py

      - name: Editor unit tests
        working-directory: NPDevEditor/ui-react
        timeout-minutes: 10
        run: |
          npm ci
          npm run test

      - name: Sync RuntimeHost libs for sample generation
        timeout-minutes: 15
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass \
            -File "$GITHUB_WORKSPACE/scripts/runtimehost/sync-runtimehost-libs.ps1" \
            -BuildLocalJars \
            -RuntimeHostLibsDir "$GITHUB_WORKSPACE/../NPDev_General__OutsideRepo/runtimehost-libs"

      - name: Generate simple-contact-intake sample (InMemory, fast RuntimeHost smoke)
        timeout-minutes: 15
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass \
            -File "$GITHUB_WORKSPACE/NPDevSamples/scripts/generate-sample-app.ps1" \
            -SampleId simple-contact-intake \
            -NPDevRoot "$GITHUB_WORKSPACE"

      - name: RuntimeHost generated-app test suite
        working-directory: NPDevSamples/simple-contact-intake/Output/App
        timeout-minutes: 20
        run: |
          chmod +x ./gradlew
          sed -i '/org\.gradle\.projectcachedir/d' gradle.properties
          ./gradlew test \
            -PnpdevRuntimeHostLibsDir="$GITHUB_WORKSPACE/../NPDev_General__OutsideRepo/runtimehost-libs" \
            --no-daemon --console=plain

      - name: On failure, print failing test reports into the log (they hold the captured subprocess output)
        if: failure()
        shell: bash
        run: |
          # Why: the packaged-app proof tests capture `gradlew bootJar` / app-boot output into the JUnit
          # assertion message (assertEquals(0, exitCode, bootJar.output())), then delete their own on-disk
          # evidence in a finally block. The only surviving copy is the test-report XML's <failure> element.
          # Build output is redirected to $NPDEV_BUILD_ROOT/gradle/... (not in-source build/), so scan there.
          # Printing it here surfaces the real error in the step log instead of an (empty) artifact.
          echo "Scanning for failing test-result XMLs under: $NPDEV_BUILD_ROOT"
          found=0
          while IFS= read -r xml; do
            if grep -q "<failure\|<error" "$xml" 2>/dev/null; then
              echo "::group::$xml"
              cat "$xml"
              echo
              echo "::endgroup::"
              found=1
            fi
          done < <(find "$NPDEV_BUILD_ROOT" -path "*test-results*" -name "*.xml" 2>/dev/null)
          [ "$found" = 1 ] || echo "No failing test-result XMLs found under $NPDEV_BUILD_ROOT"

      # Build output is redirected to $NPDEV_BUILD_ROOT (the sibling Build/), which is OUTSIDE the
      # workspace -- and actions/upload-artifact forbids '..' in path patterns. Copy the redirected
      # test reports into an in-workspace dir first so the upload has a legal, non-'..' path.
      - name: Collect redirected test reports for the evidence artifact
        if: always()
        shell: bash
        run: |
          mkdir -p ci-evidence
          if [ -d "$NPDEV_BUILD_ROOT/gradle" ]; then
            cp -r "$NPDEV_BUILD_ROOT/gradle" ci-evidence/ 2>/dev/null || true
          fi

      - name: Upload PR gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npdev-pr-gate-evidence
          path: |
            ci-evidence/**/test-results/test
            ci-evidence/**/reports/tests/test
            NPDevSamples/simple-contact-intake/Output/App/build/test-results/test
          if-no-files-found: warn
          retention-days: 14
