name: NPDev CI Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: npdev-ci-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-maturity-validation:
    name: Linux post-Beta0 maturity validation
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    env:
      CI: true
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Dorg.gradle.workers.max=2 -Dorg.gradle.vfs.watch=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: DSL contract tests
        working-directory: NPDevContract/dsl
        timeout-minutes: 15
        run: |
          ./gradlew test --no-daemon --console=plain

      - name: Kernel inproc adapter tests
        working-directory: NPDevKernel
        timeout-minutes: 20
        run: |
          ./gradlew \
            :adapters:audit-inproc:test \
            :adapters:bulkhead-inproc:test \
            :adapters:circuit-inproc:test \
            :adapters:events-inproc:test \
            :adapters:flowinstance-inproc:test \
            :adapters:idempotency-inproc:test \
            :adapters:notification-inproc:test \
            :adapters:persistence-inproc:test \
            :adapters:tracing-inproc:test \
            :adapters:webhook-inproc:test \
            --no-daemon --console=plain

      - name: Kernel Postgres Testcontainers adapter tests
        working-directory: NPDevKernel
        timeout-minutes: 35
        run: |
          ./gradlew \
            :adapters:eventstore-postgres:test \
            :adapters:audit-postgres:test \
            :adapters:bulkhead-postgres:test \
            :adapters:circuit-postgres:test \
            :adapters:flowinstance-postgres:test \
            :adapters:tracestore-postgres:test \
            --no-daemon --console=plain

      - name: Flow compiled tests
        working-directory: NPDevKernel
        timeout-minutes: 15
        run: |
          ./gradlew :adapters:flow-compiled:test --no-daemon --console=plain

      - name: Generator unit tests
        working-directory: NPDevGenerator
        timeout-minutes: 30
        run: |
          ./gradlew :generator:test --no-daemon --console=plain

      - name: Portable NPDev CLI smoke
        timeout-minutes: 45
        run: |
          chmod +x ./npdev
          ./npdev --version
          ./npdev validate model NPDevContract/dsl/resources/Models/canonical-demo/model.json
          ./npdev normalize ai-model golden-ai-scenarios/base-ai-loop/ai-model.json > /tmp/npdev-normalized-model.json
          ./npdev generate app --model NPDevContract/dsl/resources/Models/canonical-demo/model.json --config NPDevContract/dsl/resources/Models/canonical-demo/config.json --output build/npdev-generated

      - name: Generate RuntimeHost canonical app for integration tests
        timeout-minutes: 45
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass \
            -File "$GITHUB_WORKSPACE/scripts/samples/generate-sample.ps1" \
            -WorkspaceRoot "$GITHUB_WORKSPACE" \
            -SampleIds canonical-demo

      - name: RuntimeHost generated-app Postgres integration tests
        working-directory: NPDevSamples/canonical-demo/Output/App
        timeout-minutes: 45
        run: |
          chmod +x ./gradlew
          ./gradlew integrationTest \
            -Dspring.profiles.active=test,postgres \
            --no-daemon --console=plain

      - name: Bootstrap post-Beta0 maturity reports
        timeout-minutes: 60
        run: |
          chmod +x ./npdev
          chmod +x ./gradlew
          ./npdev report bootstrap
          ./gradlew postBeta0MaturityCheck --no-daemon --console=plain
          pwsh -NoProfile -File ./scripts/quality/validate-report-schemas.ps1
          pwsh -NoProfile -File ./scripts/quality/generate-final-evidence-bundle.ps1
          pwsh -NoProfile -File ./scripts/quality/run-portable-tooling-check.ps1

      - name: Upload Linux maturity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npdev-linux-maturity-validation-evidence
          path: |
            scripts/reports/out
            ../NPDev_General__OutsideRepo/temp/final-evidence-bundle
            NPDevContract/dsl/**/build/test-results/test
            NPDevKernel/**/build/test-results/test
            NPDevGenerator/**/build/test-results/test
            NPDevRuntimeHost/**/build/test-results/test
            NPDevRuntimeHost/**/build/test-results/integrationTest
            NPDevSamples/**/Output/App/**/build/test-results/integrationTest
            NPDevSamples/**/Output/App/**/build/reports/tests/integrationTest
          if-no-files-found: warn
          retention-days: 14

  ci-validation:
    name: NPDev segmented CI validation
    runs-on: windows-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    env:
      NPDEV_WORKSPACE: ${{ github.workspace }}
      CI: true
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Dorg.gradle.workers.max=2 -Dorg.gradle.vfs.watch=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Configure Gradle CI
        timeout-minutes: 5
        run: |
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          Write-Host "JAVA_HOME_17_X64=$env:JAVA_HOME_17_X64"
          Write-Host "JAVA_HOME_21_X64=$env:JAVA_HOME_21_X64"
          java -version

          if ([string]::IsNullOrWhiteSpace($env:JAVA_HOME_17_X64)) {
            throw "JAVA_HOME_17_X64 is not available after setup-java."
          }

          $gradleUserHome = Join-Path $env:USERPROFILE ".gradle"
          New-Item -ItemType Directory -Force -Path $gradleUserHome | Out-Null

          @(
            "org.gradle.daemon=false",
            "org.gradle.console=plain",
            "org.gradle.workers.max=2",
            "org.gradle.vfs.watch=false",
            "org.gradle.java.installations.auto-detect=true",
            "org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64"
          ) | Set-Content -LiteralPath (Join-Path $gradleUserHome "gradle.properties") -Encoding UTF8

          Get-Content (Join-Path $gradleUserHome "gradle.properties")

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            NPDevEditor/ui-react/package-lock.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('NPDevEditor/ui-react/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: NPDevEditor/ui-react
        timeout-minutes: 15
        run: |
          npm ci
          npm exec playwright install chromium

      - name: Preflight Gradle wrappers
        timeout-minutes: 10
        run: |
          $projects = @(
            "NPDevContract\dsl",
            "NPDevEditor",
            "NPDevGenerator",
            "NPDevKernel",
            "NPDevRuntimeHost"
          )

          foreach ($project in $projects) {
            $projectRoot = Join-Path $env:NPDEV_WORKSPACE $project
            Write-Host "Checking Gradle wrapper in $projectRoot"

            foreach ($relative in @(
              "gradle\wrapper\gradle-wrapper.properties",
              "gradle\wrapper\gradle-wrapper.jar",
              "gradlew",
              "gradlew.bat"
            )) {
              $path = Join-Path $projectRoot $relative
              if (-not (Test-Path -LiteralPath $path)) {
                throw "Missing Gradle wrapper artifact: $path"
              }
            }
          }

      - name: Script automation quality
        timeout-minutes: 10
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass `
            -File "$env:NPDEV_WORKSPACE\scripts\quality\run-script-automation-quality.ps1" `
            -WorkspaceRoot "$env:NPDEV_WORKSPACE"

      - name: Runtime surface evidence
        timeout-minutes: 10
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass `
            -File "$env:NPDEV_WORKSPACE\scripts\quality\run-runtime-surface-evidence.ps1" `
            -WorkspaceRoot "$env:NPDEV_WORKSPACE"

      - name: Preflight generator source completeness
        timeout-minutes: 5
        run: |
          $required = @(
            "NPDevGenerator\generator\src\main\java\com\npdev\generator\output\GeneratedSourceWriter.java"
          )

          foreach ($relative in $required) {
            $path = Join-Path $env:NPDEV_WORKSPACE $relative
            Write-Host "Checking source file: $path"
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing required tracked source file: $relative"
            }
          }

          git ls-files "NPDevGenerator/generator/src/main/java/com/npdev/generator/output/*"
      - name: Generator gate / prepare RuntimeHost sample output
        timeout-minutes: 40
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass `
            -File "$env:NPDEV_WORKSPACE\scripts\quality\run-generator-gate.ps1" `
            -WorkspaceRoot "$env:NPDEV_WORKSPACE"

          $outputRoot = Join-Path $env:NPDEV_WORKSPACE "NPDevSamples\simple-contact-intake\Output"
          $appRoot = Join-Path $outputRoot "App"
          $artifactRoot = Join-Path $outputRoot "ArtifactNP"

          Write-Host "Checking RuntimeHost sample prerequisite:"
          Write-Host "OutputRoot:   $outputRoot"
          Write-Host "AppRoot:      $appRoot"
          Write-Host "ArtifactRoot: $artifactRoot"

          if (-not (Test-Path -LiteralPath $outputRoot)) {
            throw "RuntimeHost prerequisite missing after generator gate: $outputRoot"
          }
          if (-not (Test-Path -LiteralPath $appRoot)) {
            throw "RuntimeHost prerequisite missing after generator gate: $appRoot"
          }
          if (-not (Test-Path -LiteralPath $artifactRoot)) {
            throw "RuntimeHost prerequisite missing after generator gate: $artifactRoot"
          }

          Get-ChildItem -LiteralPath $outputRoot -Force |
            Select-Object Name, FullName, PSIsContainer |
            Format-Table -AutoSize
      - name: Security hardening maturity evidence
        timeout-minutes: 10
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass `
            -File "$env:NPDEV_WORKSPACE\scripts\evidence\write-security-hardening-maturity-report.ps1" `
            -WorkspaceRoot "$env:NPDEV_WORKSPACE"

      - name: Runtime security consistency evidence
        timeout-minutes: 10
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass `
            -File "$env:NPDEV_WORKSPACE\scripts\quality\run-runtime-security-consistency.ps1" `
            -WorkspaceRoot "$env:NPDEV_WORKSPACE"
      - name: RuntimeHost gate
        timeout-minutes: 25
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass `
            -File "$env:NPDEV_WORKSPACE\scripts\quality\run-runtimehost-gate.ps1" `
            -WorkspaceRoot "$env:NPDEV_WORKSPACE"

      - name: Editor gate
        timeout-minutes: 35
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass `
            -File "$env:NPDEV_WORKSPACE\scripts\quality\run-editor-gate.ps1" `
            -WorkspaceRoot "$env:NPDEV_WORKSPACE"

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npdev-ci-validation-evidence
          path: |
            scripts/reports/out
            scripts/reports/releases
          if-no-files-found: warn
          retention-days: 14




