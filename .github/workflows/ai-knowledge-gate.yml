name: AI Knowledge Gate

# F1/F2 (docs/FINAL_OPEN_ITEMS_PLAN.md, 2026-07-29): this is now a 13-step gate that shells out to
# gradlew (corpus-parse, check 11/13) -- NOT "seconds, pure-Python, no Java/Gradle" any more. Runs
# Java/Gradle (`validate-corpus.py`'s validateModel task, ~4s/model amortized against a warm daemon,
# materially more on a cold CI runner -- see the timeout-minutes comment below) on every PR that
# touches any of the paths below. It guards, among others:
#   1. knowledge/platform-status.json is not stale vs the gaps ledger,
#   2. every knowledge/cards/*.json validates,
#   3. the shared failure-signature normalizer behaves,
#   4. every corpus model.json still parses against the real validator (check 11/13) --
#      REG-63's own 17-of-29-models break is exactly the event the ORIGINAL six-entry paths: list
#      would not have fired on: none of its entries covered NPDevContract/schemas/model.schema.json,
#      NPDevSamples/**/model.json, ledger/**, or scripts/quality/** itself,
#   5. every relative markdown link resolves (check 12/13) -- the ORIGINAL list did not cover
#      docs/** broadly either, so the same 8-broken-link class of break would not have fired this,
#   6. every workflow file is valid YAML (check 13/13) -- found by accident verifying THIS fix on a
#      live PR: npdev-pr-gate.yml had an unquoted colon in a step name and was silently scheduling
#      zero jobs for hours. Fixed in the same PR; this check is why it can't recur silently.
on:
  pull_request:
    paths:
      - 'docs/**'                      # link gate (check 12/12) + T1/T2 source docs
      - 'ledger/**'                    # T1/T2 authority
      - 'knowledge/**'
      - 'scripts/ai/**'
      - 'scripts/quality/**'           # every gate script re-runs its own gate
      - 'schemas/**'                   # ai + ui-contract + panel-provenance
      - 'NPDevContract/schemas/**'     # the 17-model corpus-parse trigger (check 11/12)
      - 'NPDevSamples/**/model.json'   # in-repo corpus models
      - 'gradle.properties'            # affects every gradlew invocation this gate now makes
      - '.github/workflows/*.yml'      # check 13/13 -- a workflow file that stops parsing
  workflow_dispatch:

concurrency:
  group: ai-knowledge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-knowledge-gate:
    name: AI knowledge substrate gate
    runs-on: ubuntu-latest
    # F2: was 5 -- a coin flip against a measured ~2 min for validate-corpus.py alone on a warm
    # local daemon, materially more on a cold CI runner with no dependency cache.
    # OBSERVED (PR #6, run 30421704185, 2026-07-29, cold runner): 1m21s total wall clock. 20 min
    # leaves ample headroom even against a fully cold Gradle+dependency cache; revisit only if a
    # future run approaches half the cap.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # CI-1 pattern (npdev-ci-validation.yml, npdev-pr-gate.yml): the committed gradle.properties
      # files hardcode a dev-machine org.gradle.projectcachedir (D:\WorkSpace\...), which does not
      # exist on Linux -- gradle aborts before any task runs, and a --project-cache-dir CLI override
      # does NOT fix it (gradle.properties is read during wrapper bootstrap, before the CLI flag can
      # take effect). This gate never ran gradle before check 11/12 (validate-corpus.py) existed, so
      # this had never been hit here. Strip the line so gradle falls back to its own portable default.
      - name: Neutralize dev-machine gradle projectcachedir (portability)
        run: sed -i '/org\.gradle\.projectcachedir/d' gradle.properties NPDevContract/dsl/gradle.properties

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run AI knowledge gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/quality/run-ai-knowledge-gate.ps1
