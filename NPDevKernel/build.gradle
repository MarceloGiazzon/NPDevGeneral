plugins {
    id 'base'
}

def resolveNpdevBuildRoot = {
    def prop = providers.gradleProperty('npdevBuildRoot').getOrNull()
    if (prop != null && !prop.trim().isEmpty()) {
        return file(prop)
    }
    def configured = System.getenv('NPDEV_BUILD_ROOT')
    if (configured != null && !configured.trim().isEmpty()) {
        return file(configured)
    }
    // npdev-build-root-resolution: find the repo root by its CONTENTS, not its NAME. A clone named
    // anything but 'NPDev_General' used to fall through to a fallback that disagreed with
    // scripts/npdev-common.ps1's Get-NPDevBuildRoot by one directory -- see that function's comment
    // for the CI failure it caused. Same predicate as WorkspaceRootLocator.java.
    def sourceRoot = rootDir
    while (sourceRoot != null && !(new File(sourceRoot, 'NPDevContract').isDirectory()
            && new File(sourceRoot, 'NPDevGenerator').isDirectory()
            && new File(sourceRoot, 'NPDevKernel').isDirectory())) {
        sourceRoot = sourceRoot.parentFile
    }
    if (sourceRoot != null && sourceRoot.parentFile != null) {
        return new File(sourceRoot.parentFile, 'Build')
    }
    return new File(rootDir.parentFile, 'Build')
}

def npdevExternalBuildRoot = resolveNpdevBuildRoot()

allprojects {
    def safeProjectPath = project.path == ':' ? 'root' : project.path.substring(1).replace(':', '/')
    layout.buildDirectory.set(new File(npdevExternalBuildRoot, "gradle/${rootProject.name}/${safeProjectPath}"))

    group = 'com.npdev'
    version = '0.1.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    // R3 (MASTER-ROADMAP.md Step 9 / ledger QUAL-6): applies to :core, :kernel, :dsl and every
    // :adapters:* subproject (36 of them) uniformly. Unconditional -- none of these ship into a
    // generated FinalApp (see NPDevRuntimeHost/build.gradle.template's own gating comment for the
    // one build that does); only compiled jars are staged into a generated app via
    // npdevRuntimeHostLibsDir, never this source or its coverage instrumentation.
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.0'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        // Perf: forked test JVMs default to 512m and ignore org.gradle.jvmargs.
        // maxParallelForks is held at 2 (not 4) on purpose: these suites drive
        // Testcontainers over the Docker npipe below, and concurrent forks
        // contend on shared containers/ports.
        maxHeapSize = '2g'
        maxParallelForks = 2
        jvmArgs '-XX:+UseParallelGC'

        // Gradle sets -D on ITS OWN jvm, not on the forked test jvm, so a property passed on the
        // command line silently does nothing inside a test unless it is forwarded here.
        //
        // Found the hard way: `-Dnpdev.dialect.only=mysql` ran all four dialects anyway and reported
        // green. That is the exact failure shape the property exists to prevent one level up -- CI
        // would have believed each job was scoped to one engine while every job kept running all of
        // them, and the evidence for the scoping would have been the absence of an error.
        // DialectTestSupportSelectionTest pins the behaviour so a silent no-op cannot come back.
        ['npdev.dialect.only', 'npdev.storage.dialect'].each { key ->
            String value = System.getProperty(key)
            if (value != null && !value.trim().isEmpty()) {
                systemProperty key, value
            }
        }

        // Gradle does NOT forward a forked test JVM's stdout to the console -- it captures it into
        // the JUnit XML. So DialectTestSupport's "[dialect-support] started <image> ..." line, whose
        // entire purpose is that you should not need to download an artifact to learn whether a real
        // container was used, was written, captured, and invisible. Measured on run 31268124428: the
        // line is present in system-out and absent from the log, and the log has zero mentions of
        // Testcontainers, Docker or Ryuk.
        //
        // Container backend only, so a local run stays quiet.
        if ('container'.equalsIgnoreCase(System.getenv('NPDEV_DIALECT_BACKEND') ?: '')) {
            testLogging {
                showStandardStreams = true
            }
        }

        if (System.getProperty('os.name', '').toLowerCase().contains('win')
                && System.getenv('DOCKER_HOST') == null) {
            environment 'DOCKER_HOST', 'npipe:////./pipe/dockerDesktopLinuxEngine'
            systemProperty 'docker.host', 'npipe:////./pipe/dockerDesktopLinuxEngine'
            systemProperty 'docker.client.strategy', 'org.testcontainers.dockerclient.NpipeSocketClientProviderStrategy'
        }

        // R3: any test run also produces a fresh JaCoCo XML report as a byproduct.
        finalizedBy tasks.named('jacocoTestReport')
    }

    tasks.withType(JacocoReport).configureEach {
        reports {
            xml.required = true
            html.required = false
        }
    }
}

tasks.register('kernelQualityGate') {
    group = 'verification'
    description = 'Runs the independent NPDevKernel verification build.'
    dependsOn ':kernel:test'
    dependsOn subprojects.findAll { it.path.startsWith(':adapters:') }.collect { it.tasks.named('test') }
}
