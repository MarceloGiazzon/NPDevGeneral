dependencies {
    api project(':core')
    implementation project(':dsl')
    testImplementation project(':adapters:persistence-postgres')
    testImplementation project(':adapters:events-inproc')
    testImplementation project(':adapters:tracing-inproc')
    testImplementation 'com.h2database:h2:2.2.224'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.11.0'

    // Storage dialect conformance (storage/PLAN.md S4a). Testcontainers + the three real JDBC
    // drivers are needed ONLY by the CI path -- NPDEV_DIALECT_BACKEND=container. Local runs use H2
    // and never touch these, which is what keeps the suite runnable on a machine with no Docker.
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:mysql:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.testcontainers:mssqlserver:1.21.4'
    testImplementation 'com.mysql:mysql-connector-j:9.1.0'
    testImplementation 'org.postgresql:postgresql:42.7.13'
    testImplementation 'com.microsoft.sqlserver:mssql-jdbc:12.8.1.jre11'
}
