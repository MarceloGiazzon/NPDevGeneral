# SQL reserved words per engine -- the data behind SqlDialect.isReservedIdentifier (STOR-6).
#
# A .properties file, not JSON, because the kernel has NO Jackson on its compile classpath and
# deliberately stays that way (same reason it has zero JDBC imports -- ports and adapters). This
# is still DATA: adding a word is editing a line, never editing code.
#
# `common` is the set every SQL engine reserves. Each engine adds its own on top, and those
# genuinely differ -- `rank` is reserved on MySQL and not on Postgres, `plan` on SQL Server and
# nowhere else. A single shared list would either over-quote (changing emitted SQL on engines that
# never needed it) or under-quote (leaving the defect in place on the one that did).
#
# NOT the same list as ReservedColumnNames: that one is NPDEV-reserved (version, row_version,
# tenant_id -- columns the platform adds to every business table) and is REFUSED with an
# actionable message. These are ENGINE-reserved and are QUOTED. Different question, different
# remedy, deliberately separate.

common=all,and,any,as,asc,between,both,by,case,cast,check,column,constraint,create,cross,current_date,current_time,current_timestamp,current_user,default,delete,desc,distinct,drop,else,end,except,exists,false,for,foreign,from,full,grant,group,having,in,inner,insert,intersect,into,is,join,leading,left,like,not,null,on,only,or,order,outer,primary,references,right,select,session_user,some,table,then,to,trailing,true,union,unique,user,using,values,when,where,with

# postgres: Folds unquoted identifiers to LOWER case. So an existing column created unquoted as `Order` is physically `order`; quoting must therefore emit "order", not "Order", or a deployed database stops matching. This is what SqlDialect.foldsUnquotedIdentifiersToLowerCase() exists for.
postgres=analyse,analyze,array,asymmetric,authorization,binary,collate,concurrently,current_role,do,freeze,ilike,isnull,limit,localtime,localtimestamp,notnull,offset,overlaps,placing,returning,similar,symmetric,tablesample,variadic,verbose,window

# mysql: Identifier case sensitivity depends on lower_case_table_names AND the host filesystem -- table names are case-insensitive on Windows/macOS and case-sensitive on Linux by default. Column names are always case-insensitive. Quoting does NOT make MySQL case-sensitive; it only escapes the word.
mysql=accessible,add,analyze,before,call,change,condition,database,databases,day_hour,delayed,describe,div,dual,each,elseif,enclosed,escaped,exit,explain,fetch,float4,force,fulltext,generated,groups,high_priority,if,ignore,index,infile,int1,interval,iterate,keys,kill,leave,limit,lines,load,lock,long,loop,low_priority,match,maxvalue,mediumblob,middleint,mod,modifies,no_write_to_binlog,optimize,option,optionally,out,outfile,purge,range,rank,read,reads,regexp,release,rename,repeat,replace,require,resignal,restrict,return,rlike,row,rows,schema,schemas,separator,show,signal,spatial,specific,sql,sqlexception,sqlstate,sqlwarning,ssl,starting,straight_join,system,terminated,trigger,undo,unlock,unsigned,update,usage,use,utc_date,varying,while,write,xor,zerofill

# sqlserver: Case sensitivity follows the database COLLATION, not the quoting. Bracket quoting is the T-SQL idiom; ANSI double quotes work only when QUOTED_IDENTIFIER is ON, which it is by default for most drivers -- prefer brackets and do not rely on the session setting.
sqlserver=backup,break,browse,bulk,checkpoint,clustered,coalesce,commit,compute,contains,containstable,continue,convert,current,cursor,database,dbcc,deallocate,declare,deny,disk,distributed,double,dump,errlvl,escape,exec,execute,exit,external,fetch,file,fillfactor,freetext,freetexttable,function,goto,holdlock,identity,identity_insert,identitycol,if,index,key,kill,lineno,load,merge,national,nocheck,nonclustered,nullif,of,off,offsets,open,opendatasource,openquery,openrowset,openxml,option,over,percent,pivot,plan,print,proc,procedure,public,raiserror,read,readtext,reconfigure,replication,restore,restrict,return,revert,revoke,rollback,rowcount,rowguidcol,rule,save,schema,securityaudit,semantickeyphrasetable,set,setuser,shutdown,statistics,system_user,textsize,top,tran,transaction,trigger,truncate,try_convert,tsequal,unpivot,update,updatetext,use,waitfor,while,within group,writetext

# h2: H2 folds unquoted identifiers to UPPER case by default (DATABASE_TO_LOWER changes this, and NPDev's H2-in-compatibility-mode URLs may set it). `value` is reserved in H2 and is an extremely ordinary field name -- it is the word that produced STOR-6's original error.
h2=_rowid_,array,distinct,fetch,if,ilike,intersects,interval,key,limit,localtime,localtimestamp,minus,offset,qualify,regexp,row,rownum,systimestamp,today,top,value
