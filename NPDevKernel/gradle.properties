org.gradle.projectcachedir=D:/WorkSpace/NPDev/Build/gradle-project-caches/kernel

# Performance (see docs: mirrors NPDevRuntimeHost/gradle.properties).
# Heap is 3g (not RuntimeHost's 6g): these are six independent Gradle builds,
# each with its own daemon, against 32 GB total.
# workers.max=4 bounds the adapters:* test fan-out (kernel:test depends on every
# adapter test task) so concurrent forked test JVMs stay within RAM.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xms512m -Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.daemon.idletimeout=1800000
