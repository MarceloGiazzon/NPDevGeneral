dependencies {
    implementation project(':kernel')

    compileOnly 'org.springframework:spring-context:6.1.12'
    compileOnly 'org.springframework.boot:spring-boot:3.3.2'

    // ScheduledEventDrainRunnerIT boots a real Spring context and drains a real H2
    // npdev_scheduled_event table through the real GeneratedCrudRuntimeSupport, so the proof is
    // "the timer fired it", not "a stub said it did". spring-context is compileOnly above, which
    // does NOT reach the test classpath -- hence the repeat here.
    testImplementation project(':adapters:expression-cel')
    testImplementation project(':dsl')
    // GeneratedCrudRuntimeSupport's constructor names EntityManager, so javac needs the type on the
    // classpath even though this test passes null for it.
    testImplementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    testImplementation 'org.springframework:spring-context:6.1.12'
    testImplementation 'com.h2database:h2:2.2.224'
    // GeneratedCrudRuntimeSupport touches org.springframework.http.HttpStatusCode while it loads;
    // spring-web is compileOnly over in expression-cel, so without this the class fails to
    // initialize with a NoClassDefFoundError at first use.
    testRuntimeOnly 'org.springframework:spring-web:6.1.12'
    testRuntimeOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
}
