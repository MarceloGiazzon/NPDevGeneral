dependencies {
    implementation project(':kernel')
    // LEDGER-1: boot-time persistence-binding check reads the compiled model's flow steps.
    implementation project(':dsl')

    // Spring interfaces used by these health indicators (compileOnly keeps adapter lightweight)
    compileOnly 'org.springframework:spring-context:6.1.12'
    compileOnly 'org.springframework:spring-web:6.1.12'
    compileOnly 'org.springframework.boot:spring-boot-actuator:3.3.2'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // Fix: annotations referenced in code (e.g., @JsonInclude(Include.NON_EMPTY))
    compileOnly 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'

    testImplementation 'org.springframework:spring-jdbc:6.1.12'
    testImplementation 'org.springframework:spring-web:6.1.12'
    testImplementation 'org.springframework:spring-test:6.1.12'
    testImplementation 'org.springframework.boot:spring-boot-actuator:3.3.2'
    testImplementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    testImplementation 'com.h2database:h2:2.4.240'

    // Fix for tests too
    testImplementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'
}

// Wave 1.3 (LC-C2, MASTER_AI_PLATFORM_PROGRAMME_v2.md): re-sign an app's npdev-generated/ tree with
// the SAME GeneratedFolderSignature.capture/write StrictExecutionValidator itself checks at boot,
// after a sanctioned out-of-band write (today: the metadata-only fast path overwriting
// compiled-model.json). No java-library `run` task exists on this module by default (java-library,
// not application) -- registered directly, mirroring :NPDevContract:dsl:validateModel's JavaExec pattern.
tasks.register('resignGeneratedFolder', JavaExec) {
    group = 'verification'
    description = 'Recompute and write the npdev-generated/ strict-execution signature after a sanctioned metadata-only write.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.npdev.adapters.runtime.validation.GeneratedFolderSignatureMain'
    def cliArgs = []
    if (project.hasProperty('generatedRoot')) {
        cliArgs << '--generatedRoot' << project.getProperty('generatedRoot')
    }
    args = cliArgs
}
