dependencies {
    implementation project(':kernel')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
}

// AIP-3 (3.1): the AI catalogue NPDev ships, bundled as the classpath resource npdev/ai-providers.json
// (ExternalAiCatalogue.RESOURCE), so a generated app builds its vendor profiles from the same file
// `npdev ai` reads. Copied at build time from NPDevCli/ -- one file in git, never a second list.
processResources {
    from("${projectDir}/../../../NPDevCli/ai-providers.json") {
        into 'npdev'
    }
}
