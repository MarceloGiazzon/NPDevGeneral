dependencies {
    implementation project(':kernel')

    // HARDEN-OBJSTORE-P1: the first external SDK in a kernel adapter -- deliberately isolated to
    // this module only (kernel core and the other adapters stay dependency-free on it).
    implementation platform('software.amazon.awssdk:bom:2.54.4')
    implementation 'software.amazon.awssdk:s3'

    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.testcontainers:testcontainers:1.21.4'
    testImplementation 'org.testcontainers:minio:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
}
