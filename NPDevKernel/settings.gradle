// A1 (Cold Clone Audit 2026-08-28): the platform's own builds must resolve a 17 toolchain the
// same way a generated app does -- a machine whose only JDK is 21+ used to pass `npdev doctor`
// and then fail `npdev setup` with "No matching toolchains found". Same registration the
// generated-app template ships (NPDevRuntimeHost/settings.gradle.template); with the 9.5.1
// wrapper raise (A2) this plugin's 1.0.0 is the version proven on this Gradle line.
// `plugins {}` MUST be the first statement -- even rootProject.name above it is a hard compile
// error (confirmed live, settings.gradle.template's own header). Offline opt-out is Gradle's
// native -Dorg.gradle.java.installations.auto-download=false, not removing this block.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'npdev-kernel'

include 'core'
include 'kernel'

// Some kernel adapters compile model-aware execution support through the shared contract DSL.
include 'dsl'
project(':dsl').projectDir = file('../NPDevContract/dsl')
include 'adapters:audit-inproc'
include 'adapters:audit-postgres'
include 'adapters:postgres-test-support'
include 'adapters:auth-context-jwt'
include 'adapters:authz-default'
include 'adapters:bulkhead-inproc'
include 'adapters:bulkhead-postgres'
include 'adapters:circuit-inproc'
include 'adapters:circuit-postgres'
include 'adapters:document-render-inproc'
include 'adapters:document-render-stub'
include 'adapters:events-inproc'
include 'adapters:eventstore-postgres'
include 'adapters:runtime-support'
include 'adapters:external-ai-inproc'
include 'adapters:external-ai-http'
include 'adapters:external-ai-pack-core'
include 'adapters:file-store-inproc'
include 'adapters:file-store-objectstore'
include 'adapters:flow-compiled'
include 'adapters:flowinstance-inproc'
include 'adapters:flowinstance-postgres'
include 'adapters:idempotency-inproc'
include 'adapters:idempotency-postgres'
include 'adapters:json-jackson'
include 'adapters:mail-inproc'
include 'adapters:mail-smtp'
include 'adapters:messaging-inproc'
include 'adapters:messaging-http'
include 'adapters:metrics-micrometer'
include 'adapters:notification-inproc'
include 'adapters:persistence-inproc'
include 'adapters:persistence-postgres'
include 'adapters:resume-bootstrap-spring'
