# REG-136: NO hardcoded org.gradle.projectcachedir here (removed -- see REG-10's identical
# reasoning for NPDevRuntimeHost/gradle.properties). It is a Gradle START PARAMETER, read before
# any -P/env override can apply, so a dev-machine-only D:/WorkSpace/... path here broke gradlew
# on ANY machine without that exact drive/path -- including a real newcomer's first
# `./npdev validate model`, confirmed via the firstrun-harness's own clone-mode run. npdev_cli.py's
# gradle_project_cache_args() now passes --project-cache-dir per invocation instead (a portable,
# no-op-on-this-machine equivalent), which only works cleanly when this file does NOT also set a
# conflicting value -- CI's own `sed -i '/org\.gradle\.projectcachedir/d'` workaround (three
# workflow files) was doing exactly this removal already; this makes it permanent instead of
# CI-only. Direct ad-hoc gradlew invocations that bypass npdev_cli.py/sync-runtimehost-libs.ps1
# (e.g. NPDevKernel: `./gradlew test`) will use Gradle's own default (<projectDir>/.gradle) unless
# --project-cache-dir is passed explicitly -- keep this out of the repo tree in that case via your
# own machine-global %USERPROFILE%\.gradle\gradle.properties, not by re-adding this line.

# Performance (see docs: mirrors NPDevRuntimeHost/gradle.properties).
# Heap is 3g (not RuntimeHost's 6g): these are six independent Gradle builds,
# each with its own daemon, against 32 GB total.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xms512m -Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.daemon.idletimeout=1800000
