id: STOR-29
title: >-
  Cross-engine promotion realizes, copies and verifies in one call from either the CLI or REST;
  declarative hook verification is engine-portable (boundary B10 -> LIFTED)
type: GAP
severity: LOW
status: DONE
opened: 2026-09-06
closed: 2026-09-06
source: >-
  ALL_HITTABLE_LIFT_PLAN_2026-09-05.md package P6 (Wave 2). B10.yml's own residue, two halves: (a)
  "a target table that doesn't exist yet still refuses with B10:data_only_promotion: if you call
  the bare REST endpoints directly, which still assume the target already exists" -- pure
  duplication, since PromoteMain already realizes the target schema before copying and the REST
  endpoints never learned to; (b) "H2-SQL -> Postgres-SQL translation -- deliberately out of
  scope" -- the DSL contains no raw SQL at all; the only author-written SQL in the platform is
  verifySql in conversion-hook.schema.json, which is the real, closeable scope.
surface: >-
  runtimehost-core (PromotionArc, CrossEngineDataPromotion's refusal message, ConversionHookRunner's
  declarative verify compilation, SqlDialect.countWhereNullSql), the RuntimeHost app tree (a new
  SchemaPromotionController), NPDevCli (the hook-verify codemod), and both conversion-hook.schema.json
  mirrors.
