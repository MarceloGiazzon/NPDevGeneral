  asserts: >-
    PromoteMainTest (unchanged assertions, now exercising PromotionArc under the hood) passes
    against real H2 fixtures. ConversionHookRunnerH2Test's new
    stor29_declarativeVerifyFieldResolvesTheSameWayAHandWrittenVerifySqlWould proves the declarative
    `verify` field compiles and runs correctly end to end (HOOK_VERIFIED/HOOK_APPLIED/RESOLVED, same
    outcomes a hand-written verifySql would produce). SchemaPromotionControllerStandaloneTest (4
    tests, new) covers the controller's own wiring. The full run-runtimehost-gate.ps1 passed clean
    on the second attempt -- the first failed on two real, unrelated-to-correctness gaps this
    package's own newness surfaced (the runtime-surface-evidence controller allowlist, the coverage
    ratchet), both fixed before the second (green) run. `npdev migrate hook-verify` dry-run against
    the full real test corpus (20 hook.json files) converts 12 correctly and correctly refuses 2
    untranslatable shapes, proving the codemod without needing to touch shared existing fixtures.
  provenRed: false
