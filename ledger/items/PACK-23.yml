id: PACK-23
title: >-
  Pigmentampas (S6 greenfield proof app) consumes identity/tracing/workspace packs via local $ref,
  not the remote coordinate S6 itself calls for
type: GAP
severity: LOW
status: DONE
opened: 2026-09-21
closed: 2026-09-21
verification: LOCAL_PROOF_DONE
source: >-
  Found during a 2026-09-21 verification spot-check of already-shipped NPDEV_MEGA_ROADMAP.md
  sessions (prompted by discovering S14's provenance-index.schema.json was missing despite the
  emitter referencing it -- see the provenance-index schema fix, commit 7b1188ce). Re-read S6's own
  commit (41d92fd6, "S6 Pigmentampas greenfield proof app") and its bullet list explicitly requires
  "Consume User + Tracing by remote coordinate" (the whole point being S6 exercises S3-S5 in a
  low-stakes app before WmsOffice depends on them) -- but
  NPDevSamples/pigmentampas/Input/model.json's packs[] array uses three local
  {"$ref": "packs/<name>/pack.json"} entries (identity, tracing, workspace), the same local form
  WmsOffice already used before the roadmap was written. S5 (pack repo + remote consumption,
  commit 2122d8fb "S5 publisher -- one command publishes built-in packs to a versioned git repo")
  is itself shipped, so the remote mechanism this item needs almost certainly already exists --
  this is a matter of pointing Pigmentampas at it, not building new platform capability.
surface: NPDevSamples/pigmentampas/Input/model.json (packs[] array), packs[].from remote-coordinate
  schema support (NPDevContract), scripts/pack-repo/publish-pack-repo.py (S5's publisher)
detail: |
  FIXED (2026-09-21), the remote-coordinate half: published identity/tracing/workspace to the local
  pack repo (`python scripts/pack-repo/publish-pack-repo.py`, idempotent -- identity-1.2.0 and
  workspace-1.1.0 were already tagged from an earlier session, tracing-1.0.2 was newly published),
  then switched Pigmentampas's model.json packs[] from three local `{"$ref": ...}` entries to
  `{"from": "git+file:///D:/WorkSpace/NPDev/Build/npdev-pack-repo//packs/<id>@<id>-<version>", "as":
  "<id>"}`. Note the required `//packs/<id>` subpath segment -- the publisher lays packs out at
  `{repo}/packs/<id>/pack.json`, not the repo root, and the coordinate must name that subpath or
  GitCoordinate resolution fails with "resolves to a directory with no pack.json". Also note the
  correct git+file form has a LEADING slash before the drive letter (`git+file:///D:/...`, matching
  `Path.toUri()` and what RemotePackFetcherGitLiveTest actually exercises against the real git
  binary) -- publish-pack-repo.py's own printed "Published coordinates" hint omits that leading
  slash (`git+file://D:/...`) and is misleading; not fixed here (cosmetic, the script's own docstring
  example already has it right), worth a one-line correction if anyone is touching that file again.

  FOLLOW-UP (2026-09-21, EXT-11 of the external-readiness roadmap): fixed the cosmetic gap noted
  above. publish-pack-repo.py's printed hint now builds the path with a literal git+file:/// prefix
  and strips any leading slash from Path.as_posix() before appending it, so both a Windows drive
  path and a POSIX absolute path render with exactly three slashes, matching the docstring example
  and Path.toUri().

  Re-resolved via `python NPDevCli/npdev_cli.py pack update --model
  NPDevSamples/pigmentampas/Input/model.json --allow-unsigned` (the local packs are unsigned, hence
  the flag) -- all three packs resolved cleanly into npdev.lock and the content-addressed cache
  (~/.npdev/packs/sha256/...). Deleted the now-dead local
  NPDevSamples/pigmentampas/Input/packs/{identity,tracing,workspace}/pack.json copies -- nothing
  references them anymore, and their continued presence would have been misleading (implying local
  consumption still mattered).

  This changed the compiled concept count from 8 to 17: the REAL published packs are fuller than the
  local stand-ins Pigmentampas previously used (identity 1.2.0 alone is 6 concepts -- User, Role,
  UserRole, PasswordResetToken, UserRolePermission, ExternalIdentity -- not just the one Credential
  concept the old local copy apparently exposed). Verified this is correct composition, not a
  collision, by counting each real pack's concepts directly (identity 6 + tracing/TraceEntry 1 +
  workspace/Menu+PropertyValue 2 = 9, plus Pigmentampas's own 8 domain concepts = 17, exact match).
  Updated PigmentampasSampleTest.java's hardcoded assertEquals(8, ...) to 17 with a comment
  explaining the breakdown -- the old number was simply stale, not a spec the fix violated.
  Re-ran the test clean (`:generator:test --tests
  com.npdev.generator.PigmentampasSampleTest`, BUILD SUCCESSFUL, full parse+validate+compile+
  generate pipeline including all 7 domain entity files and all 7 UI manifest routes). Also
  re-ran `check-pack-coverage.py` and `check-dsl-coverage.py` clean post-change. Did NOT run the
  full `:generator:test` suite or `run-fast-gate.ps1` -- narrow verification only, matching this
  session's build-resource-contention caution; a full gate pass is still owed before the next
  phase boundary.

  FOLLOW-UP (2026-09-29): the narrow local verification above never caught a real CI-portability gap
  -- PigmentampasSampleTest ran in CI for the first time since 2026-09-12 (CI had been broken
  upstream this whole time by an unrelated MinIO Docker Hub removal) and failed immediately with
  "pack cache entry missing or incomplete", because npdev.lock's committed `sourcePath` and the
  model.json packs[] `from:` coordinate both hardcode Marcelo's own machine's absolute paths
  (`C:\Users\Marcelo\.npdev\...`, `git+file:///D:/WorkSpace/NPDev/Build/npdev-pack-repo`), which
  cannot resolve on any other machine. Worse, PackDependencyGraphWalker.checkLock does a STRICT
  string-equality check of npdev.lock's `sourcePath` against the live resolved cache path
  (user-home-relative, so never the same string on two machines) -- a committed npdev.lock can only
  ever satisfy checkLock on the one machine that wrote it, by design as currently implemented.
  Fixed by adding a `@BeforeAll` to PigmentampasSampleTest that (1) populates the local pack cache
  directly from NPDevContract/packs/<id>/pack.json (the same source publish-pack-repo.py itself
  publishes from -- portable, no git fetch needed), then (2) rewrites npdev.lock's `sourcePath` and
  `digest` fields to match this machine's live resolved values before parsing, the same self-healing
  role `npdev pack update` itself would play. Also discovered along the way: the committed digests
  did NOT match what NPDevContract/packs/<id>/pack.json hashes to today, for all three packs, despite
  git history showing no edits to those files since before the lock was written -- almost certainly
  REG-164's exact failure mode (the SEPARATE `Build/npdev-pack-repo` git repository that
  publish-pack-repo.py commits to has no `.gitattributes` of its own forcing `pack.json` to LF, so a
  Windows `core.autocrlf=true` checkout of THAT repo silently produced CRLF bytes at lock time even
  though this repo's own checkout is correctly LF-normalized). Updated npdev.lock's three digests to
  match this repo's actual current pack.json content. Verified end-to-end against a genuinely empty,
  fresh `NPDEV_PACK_CACHE_ROOT` (simulating a clean CI runner) as well as the normal default root --
  both green, full parse+validate+compile+generate pipeline. Model.json's own hardcoded git+file://
  coordinate is UNCHANGED and still not portable, but it turns out to never actually be dereferenced
  by a normal resolve (only by an explicit `npdev pack update` re-lock) once the cache + lock
  self-heal, so it was out of scope for this fix -- a genuine `npdev pack update` on a fresh machine
  would still need that coordinate to be reachable, which remains an open, separate gap in pack
  coordinate portability (no environment/build-root-relative indirection exists yet for git+file://
  coordinates) if anyone ever needs to re-lock this sample from scratch on a non-Marcelo machine.

  NOT fixed here, deliberately out of scope -- the OTHER half of S6's own done-when ("a person who
  has never seen NPDev signs up with Google and completes a real task"): no ScrapForAI job or
  live-browser evidence for Pigmentampas exists anywhere (`git log --all -i --grep=pigmentampa`
  still shows only the original model/test commit and two unrelated REG-215 fixes). That leg is
  structurally the same human-required step SEC-11's account-link leg hit -- Google's bot-detection
  rejects every automated browser tried, only a real human browser gets through -- so it is NOT
  something a future session should attempt via automation. If pursued, it needs the app generated,
  built, booted, and the owner's own browser completing a real Google signup; file a fresh item for
  that specifically rather than reopening this one, since the remote-pack-coordinate concern this
  item was actually about is now genuinely closed.
guard:
  kind: test
  ref: NPDevGenerator/generator/src/test/java/com/npdev/generator/PigmentampasSampleTest.java#pigmentampasModelParsesValidatesAndGenerates
  asserts: >-
    the full parse -> validate -> compile -> generate pipeline succeeds against Pigmentampas's
    model.json with its packs[] resolved by remote git+file:// coordinate (not local $ref), and the
    compiled concept count (17) plus every domain entity file and UI manifest route this test checks
    are exactly what PACK-23's own fix produced
  provenRed: false
