id: PACK-8
title: >-
  Packs cannot be distributed; $ref is local-only by schema
type: GAP
severity: MEDIUM
status: OPEN
opened: 2026-08-12
source: >-
  Full-repo maturity audit 2026-08-12 (PACK-ROADMAP.md §1 ground truth, card PK-5). Confirmed this
  session: pack.schema.json's $ref pattern rejects any URI scheme -- a pack reference must be a local
  file path. There is no `npdev pack add oci://...` or `git+https://...` mechanism, and no npdev CLI
  pack command exists at all beyond the unrelated `review pack`.
surface: dsl/pack-distribution
files:
  - NPDevContract/dsl/src/main/resources/schema/pack.schema.json
detail: |
  See __OutsideRepo/strategy-2026-08-12/PACK-ROADMAP.md card PK-5 (content-addressed cache,
  oci://+git+ resolver, signatures). Decisions PD6/PD7 already recorded: both OCI and git substrates,
  OCI primary, no hosted registry; local-path packs unsigned OK, remote packs require a signature or
  an explicit --allow-unsigned in the lockfile. Extends check-container-images-pinned.py rather than
  adding a new checker (F7, pulls R2/dependency-scanning forward to sit right before this).
  MASTER-ROADMAP.md spine S7 (Step 14, milestone PM4); not in this session's scope (Steps 1-4).
