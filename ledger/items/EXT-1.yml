id: EXT-1
title: >-
  No supported path to add a REST endpoint or custom screen to a generated app
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-08-12
closed: 2026-08-14
source: >-
  Full-repo maturity audit 2026-08-12 (MASTER-ROADMAP.md F4, ROADMAP.md card R10). No plugin:
  java-controller kind and no custom-screen mount exist -- an author cannot extend a generated app
  without editing generated code that regeneration will overwrite.
surface: generator/extension-points
verification: VERIFIED_LIVE
guard:
  kind: test
  ref: >-
    NPDevGenerator/generator/src/test/java/com/npdev/generator/assembly/FinalAppAssemblerTest.java
    #mountsCompanionWebAssetsIntoStaticFolder
  asserts: >-
    plugin:java-controller: generate+build+boot NPDevSamples/probes/p7-plugin-controller on H2
    succeeds; GET /api/plugins/admin-tools/ping with the dev API key returns 200 {ok:true}; GET
    /api/plugins/super-only/ping with the SAME dev API key returns 403 (minimumRole=SUPERUSER,
    never auto-granted in dev/auth.mode=none, proving enforcement is real and per-mount, not
    merely "is authenticated"). custom-screen mount: FinalAppAssembler.mountWebAssets copies a
    nested author asset tree into <finalAppRoot>/src/main/resources/static, filters it through the
    same EXCLUDED_DIRECTORY_NAMES/EXCLUDED_FILE_NAMES every other copy mode already applies (a
    stray .git/Thumbs.db is dropped), and a declared-but-missing webAssetsRoot fails assembly
    loudly instead of silently mounting nothing.
  provenRed: true
detail: |
  See __OutsideRepo/strategy-2026-08-12/ROADMAP.md card R10 (Wave 5, milestone M5). Decision D9
  already recorded: plugin:java-controller must ENFORCE security.minimumRole with an emitted wrapper,
  not merely declare it. MASTER-ROADMAP.md F4: R10 is merged with PACK-ROADMAP.md's PK-6 (extension
  packs) into one campaign, S8, because both touch GeneratedPluginMountPlan, the definition-directory
  mount, and the three runtime-supported-controllers.json enforcement points -- designing them
  separately means designing the same extension model twice. Lands at Step 15 (PM5 milestone).

  2026-08-14 (step15-pk6-r10-extension branch): read GeneratedPluginMountPlan.java,
  RuntimeControllerAllowlistConfig.java, runtime-supported-controllers.json, build.gradle.template's
  unsupportedRuntimeHostControllerSources fileTree gate, and run-runtime-surface-evidence.ps1 (the
  three enforcement points CLAUDE.md/the agent-proxy precedent name) as part of designing the full
  PK-6+R10 campaign per F4. Confirmed the trap the card names: all three enforcement points key off
  `com/finalexec/api` + the shared, byte-identical-per-app runtime-supported-controllers.json --
  adding a plugin controller's name there would neither enable it (its source lives outside that
  package) nor be safe (the manifest is supposed to describe the FIXED platform-owned surface, not a
  per-app plugin). A real plugin:java-controller mount needs its own mechanism: a NEW mount kind on
  GeneratedPluginMountPlan (today's only kind, JAVA_SOURCE, mounts a capability IMPLEMENTATION
  invoked by reflection against an operation binding -- a raw @RestController is not that shape at
  all and would need its own descriptor convention, its own copy-at-generation-time or extra-
  sourceSet mount, the D9 security-wrapper codegen, AND the fourth enforcement point + twin-pair
  rule the card demands), plus migrating the custom-screen mount out of its current single
  PowerShell builder into a generator emitter. Genuinely XL on its own (the card's own effort key)
  and architecturally distinct enough from PK-6's satellite-concepts mechanism (which shipped this
  session, see PACK-10) that forcing both into one PR would have meant designing the same extension
  model twice under time pressure rather than once, carefully -- deliberately deferred to its own
  session/PR rather than rushed. Still not in scope; status remains OPEN.

  2026-08-14 (step15-r10-plugin-controller branch): SHIPPED the plugin:java-controller mount + D9
  security enforcement + the fourth enforcement point -- the "REST endpoint" half of the card's own
  goal sentence. DEFERRED the "custom screen" half (see below). Status moves OPEN -> PARTIAL, not
  DONE.

  MECHANISM, as built and live-verified (not merely designed): reused customCapabilities[]/
  bindings[] as-is (adapter="plugin:java-controller") rather than adding a new top-level array field
  -- both are ALREADY in ModelSourceResolver.MODEL_ARRAY_KEYS and the canonical writer/reader pair,
  so CLAUDE.md's four-place-chain rule for a NEW top-level array does not apply here; this is new
  DATA in an existing, already-threaded field, not a new field. The one real gap this reuse opened:
  CompiledPluginRequirementGraphBuilder only ever discovered a capability via a flow/procedure
  capabilityCall step, and a mounted @RestController is never called that way (HTTP clients hit it
  directly) -- so it gained a small, targeted addition (addSyntheticControllerMountRequirements)
  that synthesizes exactly one requirement per plugin:java-controller binding no real call site
  found, using operation="mount" as a sentinel that can never collide with a real flow/procedure
  operation name. GeneratedPluginMountPlan gained MountKind.JAVA_CONTROLLER + JavaControllerDescriptor,
  loaded from the SAME capabilities/<name>/capability.plugin.json convention plugin:java-source uses
  (implementation.kind=javaController instead of javaSource; a mount block with basePath + a REQUIRED
  security.minimumRole instead of runtimeRef/operationBindings) -- descriptor loading REFUSES to
  generate an app if minimumRole is missing, if controllerClass is outside the reserved
  com.npdev.generated.plugin. package (FinalExecApplication only @ComponentScans com.finalexec and
  com.npdev.generated -- anything else is dead code, never a bean, so this is also how a plugin
  controller's SIMPLE NAME becomes checkable against a manifest without any package-independent
  registry), or if mount.basePath is outside the reserved /api/plugins/ prefix (so a plugin
  controller can never collide with any platform-owned /api/* route, present or future).
  RuntimeApiEmitter copies the controller source verbatim (byte-identical mechanism to
  plugin:java-source's artifact-local copy) and writes a NEW per-app manifest,
  npdev/plugin-controllers/plugin-controller-security.json.

  TWO real defects found ONLY by a live boot, not by design review -- exactly this session's
  "smallest coherent, real, live-verified slice" discipline earning its keep: an earlier version of
  this code excluded JAVA_CONTROLLER mounts from the existing plugin-manifest/bindings-manifest
  pipeline entirely (reasoning: a controller is never capability-DISPATCHED, so why advertise a
  runtimeRef nothing calls). That reasoning was correct about dispatch and WRONG about boot: TWO
  separate `@Bean` factories in NPDevRuntimeHost -- NpdevCapabilityBindingConfig.capabilityRegistry()
  and NpdevPluginConfig.runtimePluginProfileDiagnostics() -- EAGERLY resolve EVERY
  compiledModel.getBindings() entry at boot (not lazily, only when called), and both threw real,
  reproducible BeanCreationExceptions ("Adapter 'plugin:java-controller' ... is not declared in
  active plugin manifest" / "Runtime plugin deployment mismatch ... unresolvedCapabilities=[...]")
  the first two times the probe app was booted. Fixed by including JAVA_CONTROLLER mounts in BOTH
  emitPluginManifest and emitBindingManifest after all (Mount.runtimeRef() already resolves a
  controller mount to GENERIC_MOUNTED_RUNTIME_REF/genericMountedCapabilityHandler, the same fallback
  every other unrecognized plugin:* adapter already uses, harmlessly realized against a handler
  nothing ever actually calls). See GeneratedPluginMountPlan.packageGroups()'s and
  RuntimeApiEmitter.emitBindingManifest()'s javadoc/comments for the full account.

  FOURTH ENFORCEMENT POINT: NPDevRuntimeHost/src/main/java/com/finalexec/config/
  PluginControllerSecurityConfig.java (com.finalexec.config, the app-coupled "bridge" module, not
  runtimehost-core -- it needs com.npdev.generated.runtime.service.RuntimeContextService, same as
  AgentProxyController). A WebMvcConfigurer that (a) reads the per-app security manifest and
  registers one role-checking HandlerInterceptor per mounted controller's basePath -- D9's literal
  "generated wrapper/interceptor that checks the role before delegating", reusing
  AgentProxyController's existing requireSuperUser idiom generalized to a per-mount declared role --
  and (b) enumerates every com.npdev.generated.plugin.*Controller bean and THROWS at boot if any
  exists with no matching manifest entry (fail CLOSED, unlike RuntimeControllerAllowlistConfig's
  fail-silent bean removal -- a plugin controller existing at all was the author's explicit intent,
  so one missing its security declaration is a real defect, not a channel decision). This class has
  no JUnit test: it imports com.npdev.generated.*, so build.gradle.template's
  generatedRuntimeDependentMainSources exclusion compiles it ONLY inside an assembled app, never in
  a bare-template unit test -- CLAUDE.md's own "RuntimeHost tests that name com.npdev.generated.
  never run in any gate" is why a test would be dead weight here; the live proof is the real
  verification. New twin-pair rule npdev-plugin-controller-security-enforcement
  (scripts/quality/twin-pair-registry.json) binds the 4 real coupling points (GeneratedPluginMountPlan,
  RuntimeApiEmitter, PluginControllerSecurityConfig, the proof script) via a marker token, mirroring
  the existing npdev-build-root-resolution/npdev-sql-identifier-quoting convention for exactly this
  situation -- functionally different literals in each file, no single string to track.

  plugin:query-provider declared explicitly out of scope: model.schema.json's binding.adapter gained
  `"not": {"const": "plugin:query-provider"}` + a description, in all 4 mirrored copies -- mechanically
  verified live (validateModel rejects it with json_schema_not / "must not be valid to the schema").

  LIVE VERIFICATION (H2, this session's test-cadence policy): NPDevSamples/probes/p7-plugin-controller
  -- TWO mounted controllers, deliberately gated at different roles so ONE probe proves both
  directions. adminTools (minimumRole=ADMIN, auto-granted to every dev/auth.mode=none caller) proves
  the mount serves a REAL request (GET /api/plugins/admin-tools/ping -> 200 {ok:true}). superOnlyTools
  (minimumRole=SUPERUSER, never auto-granted -- the exact AgentProxyController precedent CLAUDE.md
  documents) proves the SAME dev-key caller is REJECTED (-> 403) -- D9's enforcement is real and
  per-mount, not merely "is authenticated". scripts/proofs/run-r10-plugin-controller-proof.py runs
  this end to end (generate+build+boot+2 HTTP assertions), reusing run-engine-app-proof.py's
  machinery exactly as run-library-probe.py already does. ALSO live-proved the fail-closed guard's
  RED path by hand: removed AdminToolsController's entry from an assembled app's manifest (both the
  exploded resources and the BOOT-INF/classes jar entry), rebooted the same jar, and it refused to
  start with exactly the expected message ("Plugin controller ... is not declared in
  npdev/plugin-controllers/plugin-controller-security.json ... Refusing to start."). Determinism:
  generated the probe twice and byte-diffed the full output (excluding the two already-declared
  non-reproducible provenance files) -- zero differences. Generator (:generator:test) and DSL
  (:NPDevContract:dsl:test) full suites green.

  DEFERRED, genuinely, not silently: the custom-screen-mount PowerShell-builder-to-generator-emitter
  migration (the card's second bullet). Not designed or touched this session -- an earlier
  investigation for the exact PowerShell mechanism the card names ("the custom-screen mount
  currently lives in ONE PowerShell builder") did not conclusively locate a discrete, already-built
  "custom screen" mount under that name or an obvious synonym in scripts/appgen/; whether that
  claim describes something real-but-differently-named, something half-built, or is itself stale
  prose was NOT resolved this session. The plugin:java-controller mount + D9 wrapper + fourth
  enforcement point already consumed the full session's real-code-plus-live-proof budget on their
  own -- confirmed XL, not merely estimated, by the two live-boot-discovered defects above, neither
  of which a design-only pass would have found. A future session should START by re-investigating
  whether a custom-screen mount mechanism exists at all before designing its migration.
  Also not touched: runtime-supported-controllers.json (correctly -- the trap the card names).

  2026-08-14 (track-c-r10-custom-screen-mount branch): RESOLVED the ambiguity the prior session
  left open, and SHIPPED the card's second bullet. The card's premise was TRUE, just
  differently-named than the follow-up search's own guesses (README.md's "custom screens are
  hand-written" honest-limitations line and the two platform-utility-page builders
  (New-ControlPanelPage.ps1/New-PropertiesAdminPage.ps1) were both real but were NOT the mechanism
  the card meant -- those are platform-authored admin pages generated FOR every app, not an
  author-supplied-screen mount).

  THE MECHANISM, found by grep for "web" (not "screen") across scripts/appgen/:
  Build-NpdevApp.ps1's step 4b ("mount companion web/ assets into the app static folder") copied
  anything under `<AppFolder>/web` verbatim into the generated app's
  `App/src/main/resources/static` at generation time via a hand-rolled `Copy-Item -Recurse` loop --
  a real, generic, already-in-production "author supplies a screen file, NPDev mounts it, it
  survives regeneration" mechanism, exactly as the card describes, just spelled "companion web
  assets" rather than "custom screen mount" anywhere in the code. It is NOT a niche or
  experimental feature: FOUR real apps use it with real content --
  AppGen/apps/_official/WmsOffice/web (15 HTML pages + panel.json manifests + theme.css, the
  flagship reference app), _official/Pigmentampa/web, _official/AuxScreen/web, and
  simple-user-registry-inmemory/web (empty). New-AppTreePage.ps1 independently documents the SAME
  convention ("web/ holds the app's bespoke UI screens ... It lives beside definition/, under the
  app folder") for its own, unrelated read-only tree-viewer purpose -- confirming this is an
  established, named convention, not a one-off. CONFIRMED by code reading, not guesswork:
  Build-ClaudeApp.ps1 had zero "web" references (grep, zero hits) and `run_generate()`
  (NPDevCli/npdev_cli.py, the `npdev generate app` implementation) built its `:generator:run`
  arg list with no web-asset step at all -- so the card's "one PowerShell builder" claim was
  exactly right, and the "two mounts racing" line reads correctly as a warning against the
  obvious-but-wrong fix (copy-pasting the same Copy-Item loop into Build-ClaudeApp.ps1 as a SECOND,
  separately-maintained PowerShell mount) rather than a claim that two mounts already existed.

  THE HARDER PART, found only by tracing the actual call graph, not by reading the card alone:
  Build-NpdevApp.ps1, Build-ClaudeApp.ps1 (via invoke-npdev-generator.ps1) and `npdev generate app`
  (via Gradle :generator:run) all ultimately invoke the SAME entry point,
  com.npdev.generator.GeneratorMain -> FinalAppAssembler.assemble() -- so migrating the mount into
  the Java generator, once, gives all three callers the identical result for free, with no
  per-caller reimplementation. But the EXISTING plugin:java-source/plugin:java-controller mount
  convention (GeneratedPluginMountPlan) resolves `capabilities/<name>/capability.plugin.json`
  relative to wherever --model points (its OWN parent directory, "artifactRoot") -- while the
  real apps' `web/` sits ONE LEVEL ABOVE that (a sibling of `definition/`, at the app-folder level,
  not a sibling of model.json itself). Naively reusing the capabilities/ convention would have
  required MOVING all four real apps' web/ directories (WmsOffice notably, 15 files, the most
  heavily live-verified reference app across many sessions) -- real risk for a mechanical migration
  with no time budget to regenerate+reboot+re-verify all four in this session. Resolved by making
  the new mount EXPLICIT-ONLY, the same discipline every other GeneratorMain path flag
  (--runtimeHostTemplate, --finalAppOut, --dbDefinitionPath, ...) already uses: a new
  `--webAssetsRoot <path>` CLI flag, threaded through `FinalAppAssembler.Options.webAssetsRoot()`
  (nullable, zero behavior change when absent) and a new `mountWebAssets()` step in `assemble()`
  (CopyMode.WEB_ASSETS gets the SAME generic EXCLUDED_DIRECTORY_NAMES/EXCLUDED_FILE_NAMES filtering
  every other copy mode already gets, with none of RUNTIME_HOST_BASE's controller-source exclusions
  or GENERATED_ARTIFACT's migration-artifact skip). Each of the three callers computes the source
  path with ITS OWN existing app-layout convention and passes it explicitly -- zero filesystem-name
  guessing anywhere in the Java generator itself, zero directory moves required for any existing
  app. `Build-NpdevApp.ps1` (both its wrapper-invocation and its -PlanOnly/-Upgrade/
  -AcknowledgeDestructive direct-Java-invocation branches) and `Build-ClaudeApp.ps1` now compute
  `$WebSrc = Join-Path $AppFolder 'web'` early and pass `-WebAssetsRoot`/`--webAssetsRoot` whenever
  it exists; `npdev generate app` gained an optional `--web-assets <path>` flag with the identical
  explicit-only contract. `invoke-npdev-generator.ps1` (the wrapper both Build-NpdevApp.ps1's
  common path and Build-ClaudeApp.ps1 call, staged OUTSIDE this repo at
  AppGen/generator-runtime/current, source template AppGen/generator-runtime/
  invoke-npdev-generator.template.ps1) gained a `-WebAssetsRoot` pass-through param, edited per
  CLAUDE.md's "may edit layer 2/3 for speed" allowance since GeneratorMain's own CLI contract (the
  real code truth) already lived in this repo. Build-NpdevApp.ps1's step 4b (the retired
  Copy-Item loop) is GONE -- replaced by a comment naming exactly what replaced it and why.

  LIVE VERIFICATION (H2, this session's test-cadence policy), all three callers, real apps, not
  synthetic fixtures: (1) rebuilt AppGen's generator-runtime pack from this branch
  (prepare-npdev-generator-runtime.ps1 -ProductRepo <this branch> -RuntimeRoot
  AppGen/generator-runtime -Force) so the staged jars + refreshed invoker actually carry this
  session's code; (2) `Build-AppGenApp.ps1 -App AuxScreen` (-> Build-NpdevApp.ps1's common,
  non-direct-Java path, i.e. through invoke-npdev-generator.ps1) generated, and its log shows
  `--webAssetsRoot D:\WorkSpace\NPDev\AppGen\apps\_official\AuxScreen\web` on the actual java
  command line and `Web assets copied: 2`; aux-screen.html + aux-screen.panel.json landed under
  App/src/main/resources/static; `_ops\Build-App.ps1` built the jar, `_ops\Start-App.ps1` booted it
  on H2 (TCP 9103 / port 8093), `curl http://localhost:8093/aux-screen.html` returned HTTP 200 with
  the exact original content (Content-Type text/html, no auth required -- static is exempt from the
  API-key filter, as documented), and `_ops\Test-App.ps1`'s full REST smoke suite (7/7 checks:
  flows/audit/storage-summary GETs + 4 flow POSTs) passed; app stopped cleanly after. (2) `npdev
  generate app --model .../AuxScreen/definition/model.json --config
  .../AuxScreen/definition/config.json --output <tmp>/App --web-assets .../AuxScreen/web` (the
  Python CLI -> Gradle :generator:run path) independently produced `Web assets copied: 2` and the
  same two files under its own App/src/main/resources/static. (3) `Build-ClaudeApp.ps1
  -GenerateOnly` (a regression check -- Claude Support Desk has no web/ folder today) generated
  successfully with `Web assets copied: 0` and no --webAssetsRoot flag on the command line at all,
  proving the new, empty-by-default code path is a true no-op for every app that doesn't use it.

  New unit coverage: FinalAppAssemblerTest#mountsCompanionWebAssetsIntoStaticFolder (nested asset
  tree lands under src/main/resources/static, never npdev-generated/; a stray .git/Thumbs.db is
  filtered) and #refusesToAssembleWhenWebAssetsRootIsDeclaredButMissing (a declared-but-missing
  webAssetsRoot fails loud, matching requireDirectory's existing discipline for every other
  explicit path option). Full generator test suite, generator gate (deterministic-generation +
  out-of-tree-generation + trusted-source-security checks, which also runs :tools:npdev-cli:test),
  script-inventory check, and twin-pair-consistency check (19/19) all green.

  STILL OPEN, honestly: no checked-in, automated proof script for the custom-screen mount exists
  yet (unlike the plugin:java-controller half's run-r10-plugin-controller-proof.py) -- the live
  verification above was run by hand this session, not scripted, so it is not yet a falsifiable
  regression guard the way R11 asks for. A natural, well-scoped follow-up: a new probe under
  NPDevSamples/probes/ with a web/ fixture (mirroring lib-probe's plugin:java-source demonstration)
  plus a run-r10-custom-screen-mount-proof.py mirroring run-r10-plugin-controller-proof.py's
  machinery. Deliberately not built this session -- it is a new probe (corpus-roles.json entry) and
  a new gate-adjacent script (script-inventory classification + invocation declaration) on top of
  an already-complete, already-live-verified migration, and forcing it in risked exactly the kind
  of time-pressured, undertested addition this session's own scope discipline exists to avoid.

  2026-08-14 (reconciliation, merging all roadmap branches): R11's new check-done-item-guards.py
  (just merged) caught a real structural problem in this item's own guard block on first real run
  against combined content -- guard.ref bundled THREE separate proof references (two automated,
  one manual) into one compound string, which kind: test's single "path #method" resolver
  (TEST_REF_RE, anchored end-to-end) cannot parse -- it never matched a real file, so R1/R2 reported
  it unresolvable on a DONE item. Fixed by narrowing guard.ref to ONE real, resolvable, automated
  reference (FinalAppAssemblerTest#mountsCompanionWebAssetsIntoStaticFolder) -- the schema supports
  exactly one machine-checked ref per item, not a bundle. Nothing is lost: the second JUnit method
  (#refusesToAssembleWhenWebAssetsRootIsDeclaredButMissing), the Python proof script for the
  plugin:java-controller half (run-r10-plugin-controller-proof.py), and the manual proof narrative
  all remain fully documented above in this same detail section, just no longer squeezed into the
  one field the checker mechanically resolves.
