id: STOR-8
title: >-
  db.definition.json's `jdbcUrl`/`h2FilePath` could contradict the real connection silently -- a user
  pointing one at an existing database got no error and a connection somewhere else
type: BUG
severity: MEDIUM
status: DONE
opened: 2026-08-08
closed: 2026-08-09
verification: VERIFIED_LIVE
surface: generator/dbconfig/UserDatabaseDefinitionLoader
source: >-
  storage/OPEN_ITEMS_PLAN.md W10. Found while working out why Tier C's E1 measured nothing on
  h2local -- the obvious fix was "point both versions at the same file", and there is no way to.
detail: >-
  `UserDatabaseDefinitionLoader.load` reads both fields into `UserDatabaseDefinition`:

      text(database, "jdbcUrl"),
      text(database, "h2FilePath"),

  and nothing downstream reads either one. `jdbcUrl(definition, identity)` composes the URL for every
  engine from `identity`, whose data root is always
  `<workspace>/Build/databases/<appId>` -- appId being the `manifest.json` id, never anything the
  database block says. So a user who writes an explicit `jdbcUrl` to point at an existing database,
  or an `h2FilePath` to put the file somewhere else, gets silence: no error, no warning, and a
  connection to a different database than the one they named.

  Not the same defect as an unknown key. An unknown key would at least be visibly unrecognized; these
  two are in the schema, survive validation, and read as supported.

  CORRECTED ON CLOSING: the paragraph above is half wrong, and the correction is in `resolution`.
  `jdbcUrl` IS consulted -- for H2Server, host and port are parsed out of it. `h2FilePath` is the one
  that is genuinely read by nothing. Left in place rather than rewritten, because what this record
  BELIEVED is the reason the first proposed fix would have broken twelve apps.
resolution: |
  DONE, and the fix is NOT the one this record proposed. Severity raised LOW -> MEDIUM on the way:
  "parsed and ignored" undersells it. A user who points `jdbcUrl` at an existing production database
  gets no error, no warning, and a connection to a DIFFERENT database -- and may then write to it.

  TWO THINGS THIS RECORD GOT WRONG, both found by measuring before implementing:

  1. `jdbcUrl` is NOT ignored. For H2Server, `resolveHost` and `resolveHostPort` parse the host and
     port out of it, and `validate` accepts it as the documented ALTERNATIVE to host/port
     ("database.jdbcUrl or database.host/database.port is required for H2Server"). It is inert on
     every other engine. `h2FilePath` is the genuinely inert one.

  2. The proposed fix -- refuse both fields outright -- would have broken TWELVE app definitions,
     four of them official samples (AuxScreen, Pigmentampa, WmsOffice, WordLab). Every one of the
     twelve declares exactly what NPDev composes anyway. A blanket refusal would have broken all of
     them to fix a hazard none of them has.

  WHAT SHIPPED: `refuseDeclarationThatDisagrees`, called after the URL is composed so it can compare
  the declaration against the real answer. A value that AGREES passes; one that CONTRADICTS fails at
  generation time, quoting both. Options are ignored when comparing (`MODE=`, `DB_CLOSE_ON_EXIT=`) --
  an app may legitimately spell those differently, and failing on that would be the noisy gate this
  project refuses everywhere else.

  PROVEN BOTH WAYS:
    - `simple-consumer-h2server` -- a REAL app that sets jdbcUrl and no host/port -- still generates
    - a contradicting h2FilePath is refused, naming declared AND actual
    - three tests in UserDatabaseDefinitionDeclaredConnectionTest, including the agreeing case,
      because that is the one a blanket refusal would have regressed

  NOT DONE, deliberately: honouring an explicit URL. That is a feature, and it raises a real question
  -- does it bypass the identity check that stops two apps sharing a database? -- which deserves its
  own design rather than being smuggled into a cleanup. The refusal message says so, and invites the
  request.
files:
