  from birth instead of a 29-item backfill. The rest of R11 (restructuring, backfill, gaps.yml v2) is
  Track C item C9; not in this session's scope.

  2026-08-14 (ledger-currency sweep): downgraded OPEN -> PARTIAL rather than DONE. The schema field
  landed (as this item's own text already said), and more: `scripts/quality/check-done-item-guards.py`
  now exists and actively enforces it -- every DONE item in this pass was required to carry a real,
  falsifiable guard before being closed, live-tested constantly this session. But this item's own
  TITLE is broader than the schema field ("no ledger status can express not-doing; no DONE claim is
  falsifiable"), and that fuller scope -- restructuring, the full backfill, gaps.yml v2 -- is C9's
  job, still PARTIAL. Marking this DONE would overclaim past what C9 has actually finished; OPEN
  understated the real, live enforcement mechanism now running. PARTIAL is the honest middle.
guard:
