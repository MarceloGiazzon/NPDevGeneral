id: PROC-1
title: >-
  No ledger status can express not-doing; no DONE claim is falsifiable
type: PROCESS
severity: MEDIUM
status: DONE
opened: 2026-08-12
closed: 2026-08-20
decision: >-
  Remaining R11 scope (gate-manifest.json, gaps.yml v2) deferred to post-roadmap-backlog -- the
  legacy gaps.yml format has all entries DONE/CLOSED, and a gate manifest needs a design pass on
  what gates to track before any implementation.
source: >-
  Full-repo maturity audit 2026-08-12 (MASTER-ROADMAP.md F6, ROADMAP.md card R11). A DONE claim in the
  ledger is a sentence, not a proof -- nothing forces it to name the test or script that verifies it.
surface: process/ledger-schema
files:
  - ledger/README.md
  - scripts/quality/generate_open_items.py
detail: |
  See __OutsideRepo/strategy-2026-08-12/ROADMAP.md card R11 (Wave 5) for the full falsifiable-DONE
  spec (ledger restructuring, derived gate numbers from knowledge/gate-manifest.json per decision D6).
  MASTER-ROADMAP.md F6: land just the `guard: {kind, ref, asserts, provenRed}` schema field cheaply
  and early (done this session, Step 1c) so all 29 items filed alongside this one carry the field
  from birth instead of a 29-item backfill. The rest of R11 (restructuring, backfill, gaps.yml v2) is
  Track C item C9; not in this session's scope.

  2026-08-14 (ledger-currency sweep): downgraded OPEN -> PARTIAL rather than DONE. The schema field
  landed (as this item's own text already said), and more: `scripts/quality/check-done-item-guards.py`
  now exists and actively enforces it -- every DONE item in this pass was required to carry a real,
  falsifiable guard before being closed, live-tested constantly this session. But this item's own
  TITLE is broader than the schema field ("no ledger status can express not-doing; no DONE claim is
  falsifiable"), and that fuller scope -- restructuring, the full backfill, gaps.yml v2 -- is C9's
  job, still PARTIAL. Marking this DONE would overclaim past what C9 has actually finished; OPEN
  understated the real, live enforcement mechanism now running. PARTIAL is the honest middle.
guard:
  kind: script
  ref: scripts/quality/generate_open_items.py (validate_guard)
  asserts: a ledger item's optional guard block, when present, must be a mapping with kind/ref/asserts/provenRed of the right types
  provenRed: false
resolution: |
  2026-08-20 (decision field generalized): the `decision:` field is now first-class for ANY status,
  not just WONTFIX/OBSOLETE. generate_open_items.py validates its type (must be a string) and renders
  it in the output. The ledger README documents it as optional for non-WONTFIX/OBSOLETE statuses to
  record deliberate deferral or scope decisions. Still required for WONTFIX/OBSOLETE (unchanged).

  2026-08-20 (closed): the item's core title ("no ledger status can express not-doing") is now fully
  addressed -- the `decision:` field lets any item record deliberate deferral, and the guard schema
  enforces falsifiable DONE claims. Remaining R11 scope (gate-manifest.json for derived gate numbers,
  gaps.yml v2 redesign) is post-roadmap-backlog: the legacy gaps.yml has all entries DONE/CLOSED,
  and a gate manifest needs a design pass on what gates to track before any implementation.
