id: REG-304
title: >-
  The full behaviour-probe suite fails on the h2local (JDBC) variant: a rollup query uses the reserved column name
  `row` unquoted, and a JSON column write fails with "JAVA_OBJECT to JSON"
type: BUG
severity: HIGH
status: DONE
opened: 2026-10-24
closed: 2026-10-24
source: >-
  2026-10-24, first full run of run-behavior-probes.ps1 -StorageVariant h2local (until now only the jdbc-only file 91
  was run on h2local). Pre-existing: none of the involved files (JdbcBusinessConceptStore, RollupConceptStoreDecorator,
  the storage/sql dialect package) changed that day. The default in-memory run is 129/129 green.
surface: NPDevRuntimeHost/runtimehost-core db (JdbcBusinessConceptStore rollup aggregation), JSON column binding on H2
detail: |
  1. Every write to WidgetCatalogEntry answers 500: its rollup highestSlotRow = max(ShelfSlot.row) is computed as
     `SELECT MAX(npdev_base.row) ... FROM shelf_slots` and H2 refuses the reserved word unquoted
     ("Syntax error in SQL statement ... expected identifier"). 8 occurrences in one run; it takes down every probe that
     creates a catalog entry (field.required, field.access, conceptAccess.public, rollups, precision/scale ...).
  2. Two writes fail with org.h2 "Data conversion error converting JAVA_OBJECT to JSON" (a Java object bound to a JSON
     column instead of its serialized text).
  The h2local run stopped after 63 of 133 probes (54 pass, 9 fail).
resolution: >-
  Done when the rollup aggregation quotes column identifiers through the dialect and JSON columns bind serialized
  JSON, so the full h2local suite runs to the end (it stopped after 63 of 133 probes). Narrowed 2026-10-24 when the
  complete run exposed seven further, unrelated JDBC-only divergences -- filed as REG-306, not hidden here.
guard:
  kind: test
  ref: NPDevRuntimeHost/src/test/java/com/finalexec/db/ConceptAggregateReservedWordColumnTest.java
  asserts: >-
    max/min/sum, a direct groupBy and a groupBy join over H2 reserved-word columns (row, value, key) run on H2. The
    second defect's guard is its sibling test PostgresPersistenceCapabilityAdapterJsonNodeBindTest (persistence-postgres):
    a flow payload's Jackson NullNode binds as SQL NULL and an ObjectNode is stored as a JSON object, not a quoted string
  provenRed: true
note: >-
  2026-10-24: FIXED. (1) JdbcBusinessConceptStore.aggregate spliced column names raw: aggregated columns, direct and
  joined groupBy columns, and the join's table / foreign-key / id columns now go through sqlId (dialect.identifier).
  Red: `MAX(npdev_base.row)` -> H2 syntax error. (2) The JAVA_OBJECT writes were the ConfirmWidgetOrder flow saving
  widget_orders through PostgresPersistenceCapabilityAdapter with a Jackson NullNode in a file field, bound raw
  (Java-serialized). JsonNode values now bind as JSON (null -> SQL NULL), and Map/List JSON now binds as UTF-8 bytes
  like JdbcBusinessConceptStore -- a bound String was stored by H2 as a JSON string value. Red: both new tests failed
  with the production error. Full h2local suite: 137 probes run to the end, 0 JAVA_OBJECT / 0 syntax errors.
  2026-10-28 (QUAL-61): the guard's two unit tests witness the two defects, not the done-when's last clause ("the full
  h2local suite runs to the end"). That clause is a live-run claim and is recorded as one: a fresh
  `pwsh -NoProfile -File scripts/quality/run-behavior-probes.ps1 -StorageVariant h2local` ran all probes to the end --
  138/138 passed, 3 skipped (live1-add-optional-field-to-running-app, live1-reload-refuses-a-field-on-a-satellite,
  rename-by-uid-and-renamedFrom-keeps-rows-across-restart: other variants), 0 known failures, 464s. NOT a gate: the
  cadence entry enf-behavior-probes records the InMemory default run only, so nothing re-runs the h2local suite
  automatically, and a regression of this clause would not be caught until someone runs it by hand.
