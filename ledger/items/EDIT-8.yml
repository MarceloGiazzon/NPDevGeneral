  asserts: >-
    clicking a bar segment in a dashboard gadget navigates the SAME grid, in place, to exactly the
    clicked slice's rows (measured: 3 -> 2 for the Engineering slice, 3 -> 1 for the Sales slice, with
    both presence and absence of the excluded rows asserted) -- through the EXISTING R7.3 `where` DSL
    riding the EXISTING hash-based deep link, with the applied filter visible in the grid's own
    column-filter row, not just a silent server-side narrowing.
  provenRed: true
  provenRedNote: >-
    Two distinct real reds, not a hypothetical: (1) source-read confirmed the pre-R7.5
    kpi/bar/line/table renderers had zero click handlers and the aggregate query response carried no
    `concept`/`groupBy` -- an observation, not an inference. (2) A live run against this item's OWN
    mid-implementation state (drill-down click handlers and server fields already added, but BEFORE
    the `setContext` fix below) genuinely failed: `waitForSelector` for the chart svg timed out at
    30s because `document.body.dataset.guidePage` read back as "Default" instead of "UserDashboard"
    -- confirmed by an `evaluate` step dumping live DOM/CSS state, not by reasoning about the code.
    That failure was diagnosed to its root cause (setContext clobbering the just-applied GuidePage)
    and fixed in the template; the immediately following run, with no other change, went green.
