    r7-5-dashboard-drilldown.json -- run with `npdev explore run --app-dir <generated app> --file
    <routine> --credential apiKey=<key>`. Evidence copied out to
    D:\WorkSpace\NPDev\NPDev_General__OutsideRepo\r7-5-evidence\ (run.json, the routine, and the
    exploration-config.json console-error override) because a generated app's `_ops/` -- unlike
    `data`/`logs`/`secrets` -- is NOT spared across regeneration. DELIBERATELY `manual`: the routine
