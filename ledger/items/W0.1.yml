id: W0.1
title: >-
  Extension inventory has no category for a hand-authored web/ companion page or theme.css, so an
  app can ship arbitrary HTML/JS and honestly report zero untrusted extensions
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-09-12
closed: 2026-09-12
verification: UNIT_TESTED
source: >-
  NPDEV_ROADMAP_2026-09-12.md, Wave 0 (W0.1): the extension inventory covered untrustedExtensionAsset,
  javaHook, inProcessController and pluginPackage, but not definition/pages.json hand-authored
  companion pages nor an app-owned web/theme.css that shell.js loads at runtime.
surface: generator/extension-inventory
files:
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/emitters/ExtensionInventoryEmitter.java
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/api/GeneratorFacade.java
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/GeneratorMain.java
  - NPDevGenerator/generator/src/test/java/com/npdev/generator/emitters/ExtensionInventoryEmitterTest.java
  - NPDevSamples/scripts/generate-sample-app.ps1
