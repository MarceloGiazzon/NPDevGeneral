id: STOR-32
title: >-
  A refusal's residue is now an enumerated record with a retry verdict: every lifecycle step is
  journalled write-before-execute with idempotency as a declared step property, every refusal
  message carries the committed-steps block (B7:refusal_residue:), and the same answer is readable
  without booting via `npdev db explain-refusal` and GET .../last-refusal (boundary B7 -> LIFTED)
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-09-07
closed: 2026-09-07
source: >-
  POSTURAL_LIFT_PLAN_2026-09-07.md package P4 (Wave 2). B7.yml's own residue, verbatim: "This row
  describes a property of every OTHER refusal -- a refusal can happen after an idempotent Flyway
  step already ran -- rather than a refusal of its own, so there is no dedicated code path, no
  ValidationDiagnostic and nothing for a boundaryId to attach to."
surface: >-
  com.finalexec.db (new BootResidueJournal + RefusalResidue + SchemaRefusal + ExplainRefusalMain,
  step-journal wrapping and refusal decoration in SchemaLifecycleExecutor, bootId threading into
  BackfillPass + ConversionHookRunner), the controlpanel package (GET .../last-refusal), and
  npdev_cli.py (`db explain-refusal`).
