source: Investigated while closing F5-R1, 2026-07-28; typed half shipped docs/CORPUS_INTEGRITY_PLAN.md C8, 2026-07-29; cross-reference shipped docs/FINAL_OPEN_ITEMS_PLAN.md F9, 2026-07-29
