  2026-09-19 (A7 attempted full browser save, corrected verdict): tried to complete the A7 claim
  ("Salvar Movto saves and exits edit mode in one action") by actually building and saving a
  balanced MVL draft on MovimentoWorkbench.html?id=new against the live wmsoffice-browser (:8084) --
  entidade=Warehouse A, produto=Produto Demo 1 (codigo 323), one item (qty 10), one Origem posicao
  and one Destino posicao (qty 10 each, different local_armazenagems). "Recalcular Saldos" correctly
  reported balanced (empty .msg, no error -- OrigemDestinoBalance only checks Origem==Destino sums).
  Clicking Save then failed: "Failed: Aggregate Movimento invariant(s) violated: PosicaoDentroDoMaximo
  -- A quantidade de uma posicao nao pode exceder a quantidade disponivel no local" -- the workbench
  never reached a saved/exited-edit-mode state, so A7 is NOT confirmed as declared. Root cause is an
  ENVIRONMENT-DATA gap, not (yet) a proven platform bug: OcupacaoDisponivelQuery (the lookupField
  MovimentoItemPosicao.maxQuantity resolves through) returns 0 rows for every localArmazenagemId in
  this wmsoffice-browser instance -- there is no seeded occupancy/stock anywhere, so ANY posicao
  (Origem or Destino, any quantity) fails PosicaoDentroDoMaximo unconditionally. This means the prior
  S8 "flagship... returns 'Balanced.'" evidence was Recalcular-Saldos-only (a real result, but it
  never implies a save would succeed -- checkBalances and the aggregate's own onValidate/invariants
  are separate server calls, confirmed from the template source: checkBalancesAction hits
  POST .../check-balances/{names}; Save hits the aggregate commit path with its own onValidate
  procedure + invariants). A7 cannot be genuinely browser-verified in this environment until real
  stock exists at some location -- which itself depends on a working Recebimento (2.3) commit,
  scoped as this sweep's next screen. Re-verdict: A7 -> BLOCKED (data), not PASS-by-declaration;
  the underlying save/lifecycle mechanism (dirty-chip clears, EDITABLE recomputed from the response's
  situacao) was never exercised to completion. One incidental positive: PosicaoDentroDoMaximo's
