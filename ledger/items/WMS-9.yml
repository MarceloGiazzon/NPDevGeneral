detail: |
  Each screen below is scored against its checklist section. Verdict per screen: what the declared
  declarative surface already covers (PASS by declaration), what is blocked, and which checklist
  lines remain browser-unverified (the S9 done-when's other half, same as S8: needs the app
  generated + booted + verify-in-browser).

  2.2 ALTERACAO DE ENDERECAMENTO (A1-A13). Declared: OcupacaoLocalPanel (/locais/ocupacao, query
  TodasOcupacoes, table of local/lote/quantidade) + the Movimento workbench's SugerirOrigem/
  SugerirDestino + Recalcular Saldos actions. The PerfilAlocacao/RankingRua concepts back the
  allocation rules (P12 surface). PASS by declaration: A4 (recalc verb), A7 (Salvar e sair via
  workbench commit). BLOCKER (b): the dedicated per-rua allocation editor the original screen IS
  (edit-mode toggle P1, zero-to-remove P3, dynamic CD option P12) is not a declared panel -- the
  OcupacaoLocalPanel is read-only table + workbench covers movement, not per-rua addressing. Record
  as screen-level blocker: P1/P3/P12 per-rua editing surface absent. A1-A3, A5-A6, A8-A13 remain
  browser-unverified (declaration gap recorded above).

  2.3 RECEBIMENTO (R1-R23). Declared: RecebimentoWorkbench (aggregate Recebimento -> lotes,
  ParseNfeProcedure/import actions), ConferenciaRecebimentoPanel (/recebimentos/conferencia, query
  RecebimentosPendentes, table+conference fields). Concepts Recebimento/RecebimentoLote carry
  estagio/situacao stages. PASS by declaration: R1 (menu target), R15-R16 (estagio-driven
  alloc pipeline via RecebimentoWorkbench), R22 (estagio transition). BLOCKER (b): the item-level
