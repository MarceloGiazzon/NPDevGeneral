detail: |
  Each screen below is scored against its checklist section. Verdict per screen: what the declared
  declarative surface already covers (PASS by declaration), what is blocked, and which checklist
  lines remain browser-unverified (the S9 done-when's other half, same as S8: needs the app
  generated + booted + verify-in-browser).

  2.2 ALTERACAO DE ENDERECAMENTO (A1-A13). Declared: OcupacaoLocalPanel (/locais/ocupacao, query
  TodasOcupacoes, table of local/lote/quantidade) + the Movimento workbench's SugerirOrigem/
  SugerirDestino + Recalcular Saldos actions. The PerfilAlocacao/RankingRua concepts back the
  allocation rules (P12 surface). PASS by declaration: A4 (recalc verb), A7 (Salvar e sair via
  workbench commit). BLOCKER (b): the dedicated per-rua allocation editor the original screen IS
  (edit-mode toggle P1, zero-to-remove P3, dynamic CD option P12) is not a declared panel -- the
  OcupacaoLocalPanel is read-only table + workbench covers movement, not per-rua addressing. Record
  as screen-level blocker: P1/P3/P12 per-rua editing surface absent. A1-A3, A5-A6, A8-A13 remain
  browser-unverified (declaration gap recorded above).

  2.3 RECEBIMENTO (R1-R23). Declared: RecebimentoWorkbench (aggregate Recebimento -> lotes,
  ParseNfeProcedure/import actions), ConferenciaRecebimentoPanel (/recebimentos/conferencia, query
  RecebimentosPendentes, table+conference fields). Concepts Recebimento/RecebimentoLote carry
  estagio/situacao stages. PASS by declaration: R1 (menu target), R15-R16 (estagio-driven
  alloc pipeline via RecebimentoWorkbench), R22 (estagio transition). BLOCKER (b): the item-level
  wizard (R6-R12: Adicionar Itens selection panel P2, default-1-position P9, row clone P8,
  duplicate-product refusal P7, computed Total P6) is not declared on RecebimentoWorkbench --
  Record: P2/P6/P7/P8/P9 editing sub-panel absent on Recebimento. R4-R5, R13-R14, R17-R21, R23
  remain browser-unverified.

  2.4 EXPEDICAO (E1-E18). Declared: ExpedicaoWorkbench (aggregate Expedicao -> itens), 
  ExpedicaoDemandaPanel (/expedicoes/demanda, query ExpedicoesPendentes, ConfirmarSaida flow
  action, Estagio transition). PASS by declaration: E1 (menu target), E7 (Gerar Demanda via
  workbench transition), E15 (Confirmar Saida via ExpedicaoDemandaPanel action). BLOCKER (b):
  E17-E18 (CrossDocking interlock -- cancel refusal / confirm-wait until receipt conferida) has a
  ConcluirCrossDockingProcedure/CancelarCrossDockingProcedure but no cross-aggregate precondition
  the panel enforces -- the interlock is procedure-side only. Record: P11 cross-aggregate
  precondition not exposed as a UI refusal on Expedicao. E2-E6, E8-E14, E16 remain
  browser-unverified.

  2.5 CROSSDOCKING (C1-C10). Declared: CrossDockingConsolePanel (/crossdocking), flujos
  ConcluirCrossDockingProcedure/CancelarCrossDockingProcedure + CrossDocking concept + fiscal
  capability (DocumentoFiscalAggregateWorkbench for NF-e/Romaneio import). PASS by declaration:
  C1-C4 (import surfaces via workbenches), C9 (procedures exist). BLOCKER (b): C6-C7 (CD option
  appears when a matching outbound exists, and routing bay-to-bay) and C10 (cancel restores both
  records) are procedure+capability territory with no declared UI affordance -- Record: P12 dynamic
  CD option + cross-record restore not surfaced declaratively. C5, C8 remain browser-unverified.

  2.6 INVENTARIO INICIAL (I1-I8). Declared: InventarioArquivoAggregateWorkbench (import wizard:
  gerarTemplate procedure, Importar Contagem procedure, export/download resultAs), 
  InventarioHistoricoPanel (/inventario/historico). Concepts InventarioArquivo/InventarioArquivoLinha
  with divergente flag (I7). PASS by declaration: I3-I6 (rua selection, arquivo gen, upload grid,
  review), I7 (divergente per-row). I1-I2, I8 browser-unverified (print PDF is a hand task; I8
  commit via workbench).

  2.7 NOVO ARMAZEM (N1-N8). Declared: seed machinery (warehouse-a-small.json is a 1:1 port of
  web/novo-estabelecimento.html's default topology: 1 entidade, 1 armazem, 5 areas, 13 ruas,
  ~190 positions, 15 products, 1 profile, 7 ranking rows) + Google sign-in + Novo-Armazem.html
  PAGE (hand-rolled, verdict (b) in WMS-7). PASS by declaration: N1 (seeded environment), N7
  (seeds browsable). N2-N6, N8 remain browser-unverified; the first-run UI (N2/N3/N5) is still the
  hand-rolled PAGE -- Browser-verify N1/N7 and treat N2-N6/N8 as the S9-note design review.

  2.8 RESET (Z1-Z6). Declared: nothing (no Reset panel or procedure in the model; the hand-rolled
  web has no reset.html either -- Reset was a GeneXus-era dev action). BLOCKER (b): Z1-Z6 have no
  declared surface; destructive reset is a deliberate-op only. Record: Reset surface absent -- needs
  a Dev-console panel with double-confirm (Z2 semantics) if pursued in a later sweep.

  2.9 RELATORIOS (out of the roadmap's S9 checklist -- from WMS-7's (b) inventory; web/relatorios
  .html, PAGE "Consultas > Relatorios", still hand-served). Declared: nothing; four reports mirror
  the Phase-6 declared queries (LotesEmEstoque, ProdutosAtivos, divergencias de inventario, + 1).
  BLOCKER (b), named by the screen itself: relatorios.html's comment claimed declared queries' WHERE
  clauses are NEVER evaluated server-side, so it fetches the full concept list over generic CRUD and
  filters/sorts in JS. RESOLVED (2026-09-18, WMS-12 follow-up): the premise was STALE -- the app
  corpus predates the generator-emitted query-execution endpoint:
  GET /api/queries/{queryName} (business-ui-query-controller.mustache, Move 10 B1) routes through
  ConceptGateway.query/aggregate with full tenant/permission/row scoping since commit e917c628.
  The endpoint's REAL gaps were closed in this phase's change: (1) v2 grammar (or/in/contains/
  startsWith) via compileToConceptQueryFilters -- a v2-only predicate previously threw
  UnsupportedPredicateException -> 500; (2) declared :param binding from the request query-string
  (X0: unbound declared parameter -> 400, never an unfiltered 200); (3) offset/limit pagination
  (capped at ConceptQuery.MAX_LIMIT, echoed in the response). Template contract test
  (GeneratedQueryControllerTemplateContractTest, 6 tests) green; LIVE-verified on :8084 with the
  ADMIN JWT, 18/18 checks: ProdutosAtivos total=15 + offset/limit echo (back-compat), limit=5 &
  offset=5 paginate disjoint pages, v2-only OR query (ProdutosPorCodigoOr) returns exactly
  codigo 323/324 (pre-upgrade 500), ProdutosAtivosPorFlag?flag=true -> 15 / flag=false -> 0 /
  missing flag -> 400, unknown query -> 404. relatorios.html can now drop its full-concept-fetch +
  client-side filter for /api/queries/{LotesEmEstoque|ProdutosAtivos|...} directly (a (a)-conversion
  follow-up, still on the WMS-7 table); the tenant-permission row-scoping concern it carried is
  gone since the endpoint scopes every row through the gateway.

  2.9 (a)-CONVERSION DONE (2026-09-19): web/relatorios.html rewritten -- all four report loaders
  (loadLotesEmEstoque/loadProdutosAtivos/loadDivergenciasInventario/loadHistoricoMovimentacao) now
  call GET /api/queries/{name}?limit=1000 and render body.rows/body.total instead of fetching the
  full concept list and filtering/sorting in JS; only the produto/local/movimento id->name join
  lookups still use generic CRUD (a legitimate denormalization use, not the filtering concern the
  blocker named). Synced into the Build\wmsoffice-browser clone, app regenerated + bootJar rebuilt +
  reboot on :8084, BROWSER-VERIFIED via ScrapForAI (job_SiPYkik3neBq): real login.html sign-in ->
  relatorios.html renders status "ok", "Produtos Ativos 15 de 15 produto(s)" with correct columns
  (Nome/NCM/Caixas per Pallet/Dias Validade Padrao) sourced from /api/queries/ProdutosAtivos, and
  the three currently-unseeded reports (Lotes/Divergencias/Historico) correctly show their empty
  hint text -- screenshot confirms. Next queue item 2 (WMS-9/handoff): analytics.html,
  mapa-armazem.html, seed-data.html (a)-conversions remain.

  2026-09-19 (partial browser verification, roadmap sweep): confirmed live against
  wmsoffice-browser (:8084) as a byproduct of WMS-7/WMS-8's own verification pass (screenshots in
  those items' notes) -- these specific PASS-by-declaration lines are now browser-verified, not
  just declared:
  - 2.5 CROSSDOCKING C1-C4: CrossDockingConsolePanel renders real CROSSDOCKINGS/EXPEDICOES/PRODUTOS
    data with working Ativar/Marcar-Concluido actions (crossdocking.png).
  - 2.2 ALTERACAO DE ENDERECAMENTO A4/A7: the Movimento workbench's Recalcular Saldos action
    genuinely executes and returns "Balanced." (after-recalcular.png); A7 (Salvar e sair via
    workbench commit) has the Save button present and wired (not itself clicked/committed this
    pass).
  - 2.5/2.6 import surfaces (part of C1-C4/I3-I6): DocumentoFiscalAggregateSelection,
    RomaneioAggregateSelection, InventarioArquivoAggregateSelection all render their
    New/ROWS shell correctly (docfiscal-selection.png, romaneio-selection.png,
    inventario-selection.png).
  Also found and fixed in passing (REG-215): the generic aggregate-root "New" button (a SEPARATE
  surface from the dedicated workbench pages these screens use) 500'd on click platform-wide for
  any aggregate; the follow-on UX fix (route it to the workbench's own working empty-shell page) is
  REG-216, not yet done.
  NOT attempted this pass: the remaining dozens of individual checklist lines (A1-A3/A5-A6/A8-A13,
  R1-R23, E1-E18, C5/C8, I1-I2/I8, N1-N8, Z1-Z6) -- this is deliberately scoped as its own
  multi-hour sweep, not rushed alongside WMS-7/8's closure, per this item's own "highest-yield gap
  detector" framing (each line deserves a real look, not a rubber stamp).

  2026-09-19 (A7 attempted full browser save, corrected verdict): tried to complete the A7 claim
  ("Salvar Movto saves and exits edit mode in one action") by actually building and saving a
  balanced MVL draft on MovimentoWorkbench.html?id=new against the live wmsoffice-browser (:8084) --
  entidade=Warehouse A, produto=Produto Demo 1 (codigo 323), one item (qty 10), one Origem posicao
  and one Destino posicao (qty 10 each, different local_armazenagems). "Recalcular Saldos" correctly
  reported balanced (empty .msg, no error -- OrigemDestinoBalance only checks Origem==Destino sums).
  Clicking Save then failed: "Failed: Aggregate Movimento invariant(s) violated: PosicaoDentroDoMaximo
  -- A quantidade de uma posicao nao pode exceder a quantidade disponivel no local" -- the workbench
  never reached a saved/exited-edit-mode state, so A7 is NOT confirmed as declared. Root cause is an
  ENVIRONMENT-DATA gap, not (yet) a proven platform bug: OcupacaoDisponivelQuery (the lookupField
  MovimentoItemPosicao.maxQuantity resolves through) returns 0 rows for every localArmazenagemId in
  this wmsoffice-browser instance -- there is no seeded occupancy/stock anywhere, so ANY posicao
  (Origem or Destino, any quantity) fails PosicaoDentroDoMaximo unconditionally. This means the prior
  S8 "flagship... returns 'Balanced.'" evidence was Recalcular-Saldos-only (a real result, but it
  never implies a save would succeed -- checkBalances and the aggregate's own onValidate/invariants
  are separate server calls, confirmed from the template source: checkBalancesAction hits
  POST .../check-balances/{names}; Save hits the aggregate commit path with its own onValidate
  procedure + invariants). A7 cannot be genuinely browser-verified in this environment until real
  stock exists at some location -- which itself depends on a working Recebimento (2.3) commit,
  scoped as this sweep's next screen. Re-verdict: A7 -> BLOCKED (data), not PASS-by-declaration;
  the underlying save/lifecycle mechanism (dirty-chip clears, EDITABLE recomputed from the response's
  situacao) was never exercised to completion. One incidental positive: PosicaoDentroDoMaximo's
  refusal DID fire correctly and in business language, though the message does not name the specific
  product/location (relevant to H3's stricter wording, out of this item's declared scope).

  2026-09-19 (cross-cutting reachability finding, affects EVERY "reachable from Demandas -> X"
  checklist line, not just Recebimento): the checklist's premise that these screens are reached
  through a grouped "Demanda" menu (per definition/menu.json's BUSINESS-kind hierarchy with
  ordinals/groups, mirroring the original GeneXus screen's own menu) does NOT hold at runtime.
  Verified by querying the live wmsoffice-browser DB directly: GET /api/concepts/workspace_menus
  returns 0 rows (totalElements:0) -- the workspace::Menu table workspace-menu-seed.json feeds is
  completely empty. Traced to the generator source, not a stale-build artifact: WmsOffice's own
  generated workspace-menu-seed.json IS present but is a literal `[]` -- because
  BusinessUiEmitter.menuSeedJson() (NPDevGenerator/generator/.../emitters/BusinessUiEmitter.java:245)
  unconditionally `return "[]"`, by deliberate design (its own doc comment explains why: an earlier
  version auto-derived one Menu row per concept/panel, which DUPLICATED the native nav's own
  "every concept + every panel, unconditionally" listing -- confirmed live at the time, per that
  comment). workspace::Menu's real and ONLY job, by that same design, is an *overlay* for
  hand-authored PAGE-kind companion pages from definition/pages.json (written by
  Build-NpdevApp.ps1 into a SEPARATE seed file) -- never for BUSINESS-kind grouping. Net effect:
  definition/menu.json's "Demanda"/"Cadastros" grouping (ordinals, named groups, BUSINESS targets)
  is authoring-only decoration with NO generator consumer that turns it into runtime nav structure --
  it was written to mirror the GeneXus original's menu shape but nothing in the current platform
  wires it up. The REAL, current reachability path for every BUSINESS-kind screen (Recebimento,
  Expedicao, CrossDocking, Movimento, etc.) is the flat, ungrouped native nav business-ui-app.mustache
  always renders (confirmed live: GET /npdev-business-ui/ sidenav dump lists "Recebimento" under a
  flat "DADOS" heading and "Conferencia de Recebimento" under "PAINEIS" -- present and clickable,
  just never grouped under "Demanda"). Corrected verdict: R1 (and every sibling "Reachable from
  Demandas -> X" line: A-screen's own menu framing, E1, and 2.7's menu-adjacent items) -> PASS for
  bare reachability (the target IS in the nav), but the checklist's literal "-> Demandas ->" menu
  PATH does not exist as a runtime feature for BUSINESS targets -- this is either (a) a platform gap
  worth its own item if grouped BUSINESS-kind menus are wanted, or (b) the checklist's own wording
  should be read as "reachable from the main nav" rather than literally through a Demanda submenu.
  Not filing a new REG/platform item for this yet -- recording here since it reframes the "PASS by
  declaration" verdict basis for this whole reachability class rather than describing a new defect.

  AGGREGATE S9 VERDICT: 2.6 Inventario is the strongest (wizard already declared, mostly PASS by
  declaration). 2.2/2.3/2.4/2.5 share the same recurring blocker -- the wizard-grade editing
  sub-panels (P2 selection-add, P8 row clone, P9 default-on-add, P10 per-field-group stage locks,
  P11 cross-aggregate interlock, P12 computed option set) are not declared for the per-screen
  editors; the single Screen-2.1/2.2 balancing path (S8's work) is the exception. 2.7/2.8 are
  first-run/destructive ops needing dedicated surfaces (Novo Armazem has the seed half done).
  Browser verification of the PASS-by-declaration halves remains, same as S8.

  2026-09-19 (A7 ROOT CAUSE CORRECTED -- real bug found, not an environment-data gap): seeded real
  occupancy to retest A7 properly. Created a Lote (produto codigo 323, id
  47caecb3-9943-4c6d-b0fa-14d55e479733) via POST /api/concepts/lotes, then registered
  LocalArmazenagemLote occupancy of quantidade=20 at BOTH local_armazenagem ids the A7 draft uses --
  00860991-27fb-45d2-98f2-6ab707ce4645 (Origem) and 0387d2a3-3fb6-498c-8a71-1addd394a10c (Destino) --
  via POST /api/concepts/local_armazenagem_lotes. Confirmed live via GET
  /api/queries/OcupacaoDisponivelQuery that both rows are genuinely present with quantidade=20.
  Re-ran the exact A7 browser flow (ScrapForAI, job_5eq8HQG56Byh): entidade=Warehouse A, one
  MovimentoItem (produto codigo 323, qty 10), Origem posicao at 00860991... qty 10, Destino posicao
  at 0387d2a3... qty 10. "Recalcular Saldos" -> "Balanced." (as before). Save -> STILL FAILED, same
  message: "Aggregate Movimento invariant(s) violated: PosicaoDentroDoMaximo -- A quantidade de uma
  posicao nao pode exceder a quantidade disponivel no local" -- and the screenshot
  (r06_02_after_recalcular.png) shows BOTH posicao rows' (readonly) maxQuantity column rendering
  BLANK despite real quantidade=20 rows existing at both referenced locations. This disproves the
  prior "BLOCKED (data)" verdict -- the failure is NOT missing stock.

  Root-caused in source, not just observed: Movimento.itens.posicoes declares lookupField
  maxQuantity as { query: OcupacaoDisponivelQuery, joinField: localArmazenagemId, valueField:
  disponivel } (model.json:217-224). OcupacaoDisponivelQuery (model.json:996-1002) is a BARE
  concept query over LocalArmazenagemLote with no select/computed fields -- its rows only ever carry
  LocalArmazenagemLote's own fields (id, localArmazenagemId, loteId, quantidade, version), confirmed
  live above -- there is no field named "disponivel" anywhere in that shape. The runtime lookup
  (AggregateRuntime.java:607-613, buildLookupIndex) does exactly what's declared:
  `fieldValue(queryRow, lookupField.valueField())` -> `record.data().get("disponivel")` ->
  always null, for every row, unconditionally. So MovimentoItemPosicao.maxQuantity resolves to null
  for EVERY posicao regardless of how much real stock exists, and the invariant expression
  `p.quantidade <= p.maxQuantity` never passes for any nonzero quantity. This is a WmsOffice corpus
  MODEL AUTHORING BUG (the runtime is doing exactly what the declaration says), not a platform
  runtime defect -- but it means A7's underlying save/lifecycle mechanism has never been exercisable
  in ANY environment, seeded or not, since the field this lookupField depends on was never declared
  by its own source query.

  Not a one-line rename either: renaming valueField to "quantidade" would fix ORIGEM semantics
  (can't remove more than what's currently there) but is semantically wrong for DESTINO (whose real
  max should be remaining CAPACITY at that bin, i.e. some pallet/slot capacity minus quantidade --
  LocalArmazenagem.json has no capacity field at all; the only capacity-shaped value in this corpus
  is Produto.qtdCaixasPorPallet, used by AllocationCapability.alocarRecebimento's greedy allocator,
  never joined into this query). The single shared lookupField cannot correctly serve both roles
  without either a real computed "disponivel" (capacity-aware) field or a role-conditional
  maxQuantity source -- a small design decision, not just a typo fix. Filing as a corpus-model defect
  under WMS-9 rather than a new REG (same class as the menu-grouping finding above: reframes a verdict
  rather than describing a fresh platform gap) -- flag for the item owner if a dedicated fix item is
  wanted. Re-verdict: A7 -> BLOCKED (model defect, root-caused), superseding the prior BLOCKED (data).
  Real stock (Lote 47caecb3.../two LocalArmazenagemLote rows) is left seeded in wmsoffice-browser for
  any follow-up retest once the lookupField is fixed.

  2026-09-19 (Recebimento R15/R16/R22 browser-verified): created a real Recebimento
  (id=3f1b79f9-49ee-47ef-868b-43773adc6aa2, entidade=Warehouse A) with one RecebimentoLote row
  (loteId=47caecb3..., qty 10) via RecebimentoWorkbench.html?id=new (ScrapForAI job_rcNe3ULUsCbZ),
  using the same data-fkey convention Movimento uses: h:<field> for header, s:itens:<rowId>:<field>
  for the flat lotes collection. R15 CONFIRMED: at PreRecebimento (chip visible top-of-page) the
  workbench shows no allocation info anywhere on the page -- there is none to show, matching the
  checklist claim by simple absence. Save also revealed the workbench DOES carry a generic
  lifecycle-transition button after all (missed in the prior declaration-only read) -- "-> Enderecado"
  appeared once saved. R22 CONFIRMED live (job_dM1bv5AvqCwX): clicking "-> Enderecado" flipped
  estagio and the chip/button set updated to Enderecado/"-> Conferido"; clicking that flipped again to
  Conferido/"-> Armazenado" -- both transitions succeeded with the exact success messages
  "-> Enderecado." / "-> Conferido." and the generic lifecycle guard correctly only ever offers the
  SINGLE next state (never lets you skip Enderecado -> Armazenado directly), matching
  lifecycle.transitions in Recebimento.json. R16 CORRECTED TO FAIL: verified via
  GET /api/concepts/local_armazenagem_lotes immediately after both transitions that
  totalElements stayed at 2 (my two manually-seeded rows, unchanged) -- clicking "-> Enderecado"
  is a BARE estagio field flip with no side effect; it does NOT call AlocarRecebimento or write any
  LocalArmazenagemLote row. R16's literal claim ("Enderecamento computes destination positions before
  goods arrive") has no implementation behind this button at all -- same shape as the menu-grouping
  and A7 findings above: a checklist line assumed a generated behavior that was never wired.
  Re-verdict: R15 PASS (browser-verified), R16 FAIL (no computation occurs, was wrongly marked PASS
  by declaration), R22 PASS (browser-verified, both transitions + guard behavior).
