id: EDIT-12
title: >-
  R10.3 is blocked: AuthoringApp's scaffolding/import-export studio has no replacement
type: GAP
severity: MEDIUM
status: PARTIAL
opened: 2026-08-19
source: >-
  R10.3 (Roadmap Collection 2026-08-18) attempted 2026-08-19. The frozen bundle was deleted, then
  restored after a proper per-chunk audit found a capability nothing else serves.
surface: editor/frozen-bundle
files:
  - NPDevGenerator/generator/src/main/resources/npdev-templates/static-react/assets/AuthoringApp.js
  - NPDevGenerator/generator/src/main/resources/npdev-templates/static-react-manifest.json
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/emitters/RuntimeApiEmitter.java
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/emitters/ModelAuthoringEmitter.java
  - NPDevGenerator/generator/src/main/resources/npdev-templates/model-authoring.mustache
