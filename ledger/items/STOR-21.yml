severity: MEDIUM
status: DONE
opened: 2026-09-03
closed: 2026-09-03
source: >-
  REAL_LIFT_PLAN_2026-09-03.md, Track A package A1 (B11) -- the plan's designated starting point:
  substrate for A2 (shadow-column backfill proof, which reuses this journal for its own phases), and
