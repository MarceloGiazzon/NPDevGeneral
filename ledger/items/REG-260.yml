id: REG-260
title: >-
  The execution monitor reports compensationStatus NONE and compensatedSteps 0 for an execution whose onFailure compensation did run
type: BUG
severity: MEDIUM
status: DONE
opened: 2026-10-20
closed: 2026-10-21
verification: VERIFIED_LIVE
source: >-
  ENF-1 behaviour probe fl-monitor-reports-compensated-execution (NPDevSamples/dsl-conformance-max/behavior-probes/20-flow.json), found while checking
  that the booted dsl-conformance-max app OBEYS what the DSL schema accepts.
surface: generated-app runtime (dsl-conformance-max)
detail: |
  KNOWN DEFECT (monitoring): after a compensated failure the execution monitor (GET
  /api/executions/history, documented 'COMPENSATED' when an onFailure block ran) should report
  compensationStatus COMPENSATED and compensatedSteps >= 1. ACTUAL: compensationStatus NONE,
  compensatedSteps 0 although the same execution's state holds compensationNotice. Likely cause
  (unverified): ExecutionMonitorService reads state['__npdev_compensatedSteps__'] from the redacted
  execution, where only state KEYS survive, so the Number check always fails. Forcing failure =
  ENF-1-generated-action-no-adapter.
resolution: >-
  Fix the runtime, then remove "knownFailure": "REG-260" from probe fl-monitor-reports-compensated-execution; the runner turns that probe red
  the moment it passes with the marker still set, so the marker cannot outlive the bug.
guard:
  kind: live
  ref: NPDevSamples/dsl-conformance-max/behavior-probes/20-flow.json
  asserts: >-
    behaviour probe fl-monitor-reports-compensated-execution: compensationStatus and compensatedSteps reflect the compensation that ran
  provenRed: true
