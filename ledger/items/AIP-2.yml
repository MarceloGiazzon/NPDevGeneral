id: AIP-2
title: One key store and one AI client for every developer and Manager feature (AI providers plan, Phase 2)
type: FEATURE
severity: MEDIUM
status: DONE
opened: 2026-10-22
closed: 2026-10-22
source: >-
  AI providers unification plan, revision 2 (2026-10-22), NPDev_General__OutsideRepo/AI_PROVIDERS_UNIFICATION_PLAN_2026-10-22.md (outside the repo), built on the AI contact-point inventory AI_CONTACT_POINTS_2026-10-22.md in the same folder. Findings F2, F3, F4, F7.
surface: cli/providers
detail: |
  Keys live in four places (npdev providers, the Manager's prompter/<id> keyring entries, manager.json
  api_key, a Windows-registry fallback) and each feature has its own HTTP client.
  2.1 npdev ai complete (--profile | --feature | --provider --model [--effort]) --json, with profile
  fallbacks. 2.2 a usage log under <Build>/ai-usage/usage.jsonl (no prompt, no key) + npdev ai usage.
  2.3 spend guard: paid providers need per-feature opt-in, optional monthly USD cap (D2).
  2.4 Manager Prompter calls npdev ai complete; the key never enters the Manager. 2.5 one-time
  migration of prompter/<id> keyring entries into npdev providers. 2.6 Scrap assistant on the same
  client, manager.json api_key removed. 2.7 generate-routine, the review and the tester resolve keys via
  npdev_providers.resolve_key; registry fallback dropped. 2.8 the Manager's own keyring uses Secret
  Service on Linux instead of the session keyring (lost at reboot).
  D5 (decided yes): several keys per provider as <provider>:<account>.
resolution: >-
  Done when api_key is gone from AssistantConfig, no Manager feature holds a provider key, and every
  developer feature resolves keys through npdev_providers.resolve_key.
files:
  - NPDevCli/npdev_ai_client.py
  - NPDevCli/npdev_providers.py
  - NPDevManager/src/main.rs
  - NPDevManager/src/secrets.rs
verification: UNIT_TESTED
guard:
  kind: test
  ref: NPDevCli/tests/test_ai_client.py#test_paid_is_refused_without_an_opt_in_and_nothing_is_sent
  asserts: >-
    a call to a paid provider/model with no per-feature opt-in and no --allow-paid is refused by the one client before
    any request leaves the machine. This is the spend guard (2.3) only; it does NOT witness the three clauses of the
    done-when, see the 2026-10-28 note
  provenRed: false
note: >-
  2026-10-22: 2.1-2.3 in 4571e89a (npdev ai complete, usage log, spend guard), 2.7 in d07d3210, 2.4/2.5/
  2.6/2.8 in 08f4034d (Prompter ai profiles + keyring migration, Scrap assistant ai default, Linux Secret
  Service). Not verified: any real AI call (no key, no local LLM on the machine that built it).
  2026-10-22: owner decision D2 (AIP-6) -- opt-in per feature stays; the monthly cap now defaults to $10
  (DEFAULT_MONTHLY_CAP_USD; `npdev ai spend cap off` writes null = no cap), test_ai_config
  test_monthly_cap_defaults_to_ten_dollars_and_null_turns_it_off.
  2026-10-28 (QUAL-61): re-read against the code. The guard proves the spend guard and nothing of the done-when.
  What the code shows today, none of it test-witnessed: (1) "api_key is gone from AssistantConfig" is not literally
  true -- NPDevManager/src/state.rs still has `AssistantConfig.api_key`, kept deliberately as a read-only legacy
  field that migrate_legacy_assistant_key moves into the OS credential store and blanks, and as the fallback for the
  legacy "http" kind in assistant_generate (main.rs). (2) "no Manager feature holds a provider key": the "ai" kind
  passes no key (the CLI resolves it); the legacy "http" kind still hands a user-typed key from the OS credential
  store to the CLI as NPDEV_AI_API_KEY. (3) Direct key reads outside resolve_key remain on purpose:
  `npdev ai generate-routine --provider http` reads NPDEV_AI_API_KEY for a raw endpoint of the user's own, and
  tester_agent.py reads NPDEV_TESTER_ANTHROPIC_API_KEY, the hand-off that npdev_cli sets after resolve_key.
  Whether the legacy "http" kind and its api_key field should now be deleted is an owner decision, left open here.
  2026-10-28 (AIP-7, owner decision (b)): the legacy kind stays. This item's done-when is narrowed to the "ai" kind --
  clauses (1) and (2) are intentionally not true for the legacy "http" kind.
