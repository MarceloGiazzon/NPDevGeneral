id: STOR-23
title: >-
  A2: shadow-column proof-of-safety for REVIEWABLE expression-default backfills -- prove safety by
  running the expression twice, not by classifying its text (B2, REAL_LIFT_PLAN_2026-09-03)
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-09-03
closed: 2026-09-03
source: >-
  REAL_LIFT_PLAN_2026-09-03.md Track A package A2 (B2) -- depends on A1 (STOR-21) only in the sense the
  plan's own §3 framing anticipated ("built on A1's journaled phases"); in practice this package needed
  no journal at all, since a shadow proof is two in-memory evaluations plus one direct write, not a
  multi-statement resumable sequence -- noted as a premise correction, not a deviation.
surface: runtimehost-core (db/backfill), B2 registry (ledger/boundaries, accepted-boundaries.json,
  docs/ACCEPTED_BOUNDARIES.md)
files:
  - NPDevRuntimeHost/runtimehost-core/src/main/java/com/finalexec/db/ExpressionBackfillShadowProof.java
  - NPDevRuntimeHost/runtimehost-core/src/main/java/com/finalexec/db/ExpressionBackfillPreview.java
  - NPDevRuntimeHost/runtimehost-core/src/main/java/com/finalexec/db/BackfillPass.java
  - NPDevRuntimeHost/src/test/java/com/finalexec/db/ExpressionBackfillShadowProofTest.java
  - NPDevRuntimeHost/src/test/java/com/finalexec/db/ExpressionBackfillShadowProofIntegrationTest.java
  - NPDevRuntimeHost/src/test/java/com/finalexec/db/SchemaLifecycleExecutorRequiredFieldBackfillTest.java
