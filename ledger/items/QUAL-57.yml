id: QUAL-57
title: >-
  ConversionHookRunner.loadHooks() loads every hook.json TWICE under the RuntimeHost integrationTest
  task, because its Spring `classpath*:` resource scan matches the SAME db/conversion-hooks/ fixture
  tree on two separate classpath roots (sourceSets.test.output and sourceSets.integrationTest.output,
  both built from the same unfiltered src/test/resources); STOR-34's
  ConversionHookRunnerCollectiveRollbackTest is the first scenario to select a hook whose convert.sql
  is not idempotent, so QUAL-56's fix (routing that test to integrationTest, where it can finally run
  against real Postgres) surfaced this pre-existing double-load as a real test failure
type: BUG
severity: MEDIUM
status: DONE
opened: 2026-09-08
closed: 2026-09-08
resolution: >-
  Fixed at the consuming end: `ConversionHookRunner.loadHooks()` now de-duplicates the
  `PathMatchingResourcePatternResolver` results by `Hook::id` (first occurrence wins) before
  returning, via a `LinkedHashMap<String, Hook>` instead of a plain `ArrayList`. `classpath*:`
  legitimately returning more than one match per logical resource across overlapping classpath
  roots is expected Spring behavior -- not something the sourceSet wiring itself needed to prevent
  -- so this is the more targeted fix of the two candidates the OPEN write-up named, with zero
  changes to `integrationTest`'s classpath/resources composition (no regression surface across the
  other ~49 integrationTest scenarios). VERIFIED FOR REAL: pushed (commit fb218aad) and watched the
  next CI run (34281980149, both jobs green). Downloaded that run's uploaded JUnit XML
  (npdev-linux-maturity-validation-evidence artifact,
  TEST-com.finalexec.db.ConversionHookRunnerCollectiveRollbackTest.xml) directly -- `failures="0"`,
  the hook-selection skip-listing now prints ONCE (not twice), and the console reads "running 2
  conversion hooks in ONE collective transaction" (not 4), exactly matching the test's own intent.
  STOR-34's collective-rollback proof passes against real Postgres for the first time since it was
  written. `run-runtimehost-gate.ps1` also re-run locally post-fix (H2 path): clean, confirming the
  dedup is a no-op where there was never duplication. NOT DONE HERE, left as the "open question" the
  original write-up flagged: whether `SchemaLifecycleExecutorPostgresProofMatrixTest` (the corpus's
  only other integrationTest resident) was ALSO silently affected by the pre-fix duplication in some
  subtler, non-failing way -- this fix protects it going forward regardless, but its PRE-fix
  behavior was never specifically audited.
source: >-
  Immediate follow-on from QUAL-56 (commit 99f9cc08, pushed to main): once
  ConversionHookRunnerCollectiveRollbackTest actually ran on Linux CI's `integrationTest` task
  against real Postgres for the first time ever, it failed -- not with the CI-crash QUAL-56 fixed,
  but with a genuine assertion failure, confirmed via the run's uploaded JUnit XML
  (TEST-com.finalexec.db.ConversionHookRunnerCollectiveRollbackTest.xml, run 34277642866, job
  "Linux post-Beta0 maturity validation").
surface: NPDevRuntimeHost/runtimehost-core/src/main/java/com/finalexec/db/ConversionHookRunner.java (loadHooks)
files:
  - NPDevRuntimeHost/runtimehost-core/src/main/java/com/finalexec/db/ConversionHookRunner.java
detail: |
  OBSERVED (from the JUnit XML, not speculation): the test's own console output shows the
  hook-selection skip-listing (all 20 non-matching corpus hooks, "claims nothing in the current
  unresolved diff; skipping") printed TWICE, back-to-back, identically -- followed by exactly ONE
  "NPDev schema lifecycle: running 4 conversion hooks in ONE collective transaction" line. The test's
  own manifest declares exactly 2 unresolved columns (p75_order.col_a, p75_verifyfail.status), which
  match exactly 2 corpus hooks by claim (p75-order-1-a, p75-verifyfail) -- so a correct run should
  select and log 2, not 4. The test then failed with:

    AssertionFailedError: the refusal names the hook that failed: B12:collective_rollback: Conversion
    hook 'p75-order-1-a' failed executing its convert SQL: ERROR: column "col_a" of relation
    "p75_order" already exists -- refusing the boot. Collective set of 2 hook(s) failed ...

  i.e. p75-order-1-a's OWN convert.sql (a plain, non-idempotent `ALTER TABLE ... ADD COLUMN col_a`,
  no verify) failed because col_a already existed -- which only happens if p75-order-1-a itself ran
  TWICE inside the one collective transaction, the second attempt colliding with the first's own
  successful ADD COLUMN. This is a completely different failure mode than the test's INTENDED
  scenario (p75-verifyfail's verifySql/verifyExpect mismatch causing the rollback), so it is a defect
  in the harness the test runs under, not evidence the test's own scenario doesn't hold.

  ROOT CAUSE, confirmed by reading the code (not guessed):
  `ConversionHookRunner.loadHooks()` (runtimehost-core, ~line 644) scans hooks via
  `new PathMatchingResourcePatternResolver().getResources("classpath*:db/conversion-hooks/*/hook.json")`.
  Spring's `classpath*:` prefix deliberately enumerates EVERY classpath root that contains a
  matching path, not just the first -- by design, for finding fragments contributed by multiple
  jars/dirs. `NPDevRuntimeHost/build.gradle`'s (and its `build.gradle.template` twin's)
  `integrationTest` sourceSet declares `resources { srcDir 'src/test/resources' }` with NO
  file-level filter (unlike its sibling `java { ... generatedRuntimeIntegrationTestSources.each
  { include it } }`, which DOES allowlist-filter which .java sources compile into that sourceSet).
  So `sourceSets.integrationTest.output` gets its OWN full, unfiltered copy of
  `src/test/resources/db/conversion-hooks/` under `build/resources/integrationTest/`. Separately,
  `integrationTest`'s own `compileClasspath += sourceSets.main.output + sourceSets.test.output + ...`
  and `runtimeClasspath += output + compileClasspath` put `sourceSets.test.output`'s OWN,
  independently-built copy of the SAME unfiltered `src/test/resources` tree
  (`build/resources/test/db/conversion-hooks/`) on the SAME runtime classpath too. Two classpath
  roots, same resource path, `classpath*:` finds both -- every one of the 22 corpus hooks loads
  twice under `integrationTest`, not just the two this test happens to select.

  WHY THIS WENT UNNOTICED UNTIL NOW: this is the first `integrationTest`-tagged scenario that (a)
  calls a hook-selecting code path (`ConversionHookRunner.run`, directly or via
  `SchemaLifecycleExecutor.beforeMigrate`) AND (b) selects a hook whose `convert.sql` is a plain,
  non-idempotent DDL statement with no verify guard, in a way that makes a second identical
  execution visibly fail rather than silently no-op. `SchemaLifecycleExecutorPostgresProofMatrixTest`
  (the sourceSet's only other integrationTest resident that touches this corpus) has been running
  under this same doubled-hook-loading the whole time -- unconfirmed whether its own scenarios
  happen to tolerate the duplication (idempotent-shaped convert.sql, or verify-guarded hooks where a
  second run's verify simply re-passes) or whether it has a latent, so-far-unobserved exposure to
  the same defect. NOT YET AUDITED -- flagged here as an open question for whoever fixes this, not
  claimed either way.

  NOT YET FIXED. Two candidate directions, neither attempted: (a) de-duplicate `loadHooks()`'s
  result by hook `id` (defensive, fixes the symptom wherever `classpath*:` legitimately returns
  duplicates, but treats a real build-wiring redundancy as normal); (b) narrow
  `integrationTest`'s `resources` block the same way its `java` block is already narrowed (remove
  `sourceSets.test.output` from its classpath, or give `resources` its own `include` filter mirroring
  `generatedRuntimeIntegrationTestSources`), which is the more architecturally honest fix but touches
  a sourceSet wired the same way in the generated-app `build.gradle.template` twin, and changes
  what's on the classpath for all ~50 integrationTest scenarios, not just this one -- real regression
  surface, needs the full RuntimeHost integrationTest suite re-verified on real Postgres (Linux CI;
  this repo's local machine has Postgres disabled per local-test-profile.json) before landing either
  way.

  FIX (2026-09-08): direction (a) taken. `loadHooks()` builds a `LinkedHashMap<String, Hook>` keyed
  by `Hook::id` from the resolver's results (`byId.putIfAbsent(hook.id(), hook)`, first occurrence
  wins) and returns `List.copyOf(byId.values())` instead of the raw, possibly-duplicated list. See
  `resolution:` above for the real-Postgres CI proof.
guard:
  kind: test
  ref: NPDevRuntimeHost/src/test/java/com/finalexec/db/ConversionHookRunnerCollectiveRollbackTest.java#twoHookSetRollsBackAsOneUnitWhenTheSecondHooksVerifyFails
  asserts: >-
    NOT locally re-runnable (Postgres is CI-only for this repo). Pre-fix, this test's own real CI
    run (34277642866) failed with `failures="1"` and the "already exists" collision described above
    -- the exact JUnit XML was downloaded and inspected, not summarized secondhand. Post-fix, the
    immediate next CI run (34281980149, pushed as commit fb218aad) was watched to completion and its
    JUnit XML re-downloaded and re-inspected: `failures="0"`, single (not doubled) hook-selection
    skip-listing, "running 2 conversion hooks" (not 4). Both the red and the green state were
    observed directly from CI-produced evidence in this same session, not assumed from either
    commit's intent.
  provenRed: true
