id: PACK-12
title: Three composition mechanisms (`packs[]`, `contexts[]`, `fragments[]`) with no stated difference,
  and three fragment schemas that nothing reads -- one of which documents a restriction that does not
  exist
type: GAP
severity: LOW
status: DONE
opened: 2026-08-17
source: XREF_EPHEMERAL_PACKS_PLAN-2026-08-17.md measurement M8. `model-fragment.schema.json` declares
  no `concepts` property, yet a fragment carrying concepts composes fine (`FragmentBornConcept` arrived;
  the only diagnostic was an unrelated presentation-label warning). Grepping all Java and Python finds
  zero code references to `model-fragment.schema.json`, `concept-fragment.schema.json`, or `pack-fragment.schema.json`.
surface: dsl/pack-composition
