id: PACK-12
title: >-
  Three composition mechanisms (`packs[]`, `contexts[]`, `fragments[]`) with no stated difference,
  and three fragment schemas that nothing reads -- one of which documents a restriction that does
  not exist
type: GAP
severity: LOW
status: OPEN
opened: 2026-08-17
source: >-
  XREF_EPHEMERAL_PACKS_PLAN-2026-08-17.md measurement M8. `model-fragment.schema.json` declares no
  `concepts` property, yet a fragment carrying concepts composes fine (`FragmentBornConcept`
  arrived; the only diagnostic was an unrelated presentation-label warning). Grepping all Java and
  Python finds zero code references to `model-fragment.schema.json`,
  `concept-fragment.schema.json`, or `pack-fragment.schema.json`.
surface: dsl/pack-composition
files:
  - NPDevContract/schemas/authoring/model-fragment.schema.json
  - NPDevCli/npdev_cli.py
  - content/npdev-concepts-deep-dive.yml
detail: |
  Two deliverables.

  (a) Name the difference. Measured capabilities:

  | | `packs[]` | `contexts[]` | `fragments[]` |
  |---|---|---|---|
  | Purpose | distributable Library | in-project Module | file split |
  | Namespaced | yes (`pack::X`, `as` alias) | yes (`context::X`) | no -- flat merge |
  | Versioned | semver + `npdev.lock` | no | no |
  | Remote | `git+https` / `oci` | no | no |
  | Boundary enforcement | `requires`/`provides` | `imports[]`, acyclic, compile error | none |
  | Physical DB isolation | no | `physicallyIsolate` | no |

  `contexts[]` IS the GeneXus-Module answer and already exists, with compile-enforced import
  boundaries -- the part that actually matters for internal organization. The gap is that nothing
  says so.

  (b) Fix or delete the three unread schemas. `model-fragment.schema.json` is actively wrong.
  Recommendation is to wire them up rather than delete: `resolve_split_model` already knows every
  fragment path it visited (`collect_sources`), and validating each against its schema is a small
  change that turns a typo'd fragment key from a deep Java parser failure into a named error at the
  file that has it.
