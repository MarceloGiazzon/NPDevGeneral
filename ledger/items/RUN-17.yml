id: RUN-17
title: >-
  No inbound door existed for the flow docs' own "payment confirmation" use case -- a third party
  would have needed NPDev auth and envelope shape; add model-declared webhooks[] generating
  POST /api/hooks/{source}, HMAC-verified, publishing into the same event store awaitEvent reads
type: GAP
severity: HIGH
status: DONE
opened: 2026-08-19
closed: 2026-08-19
verification: VERIFIED_LIVE
source: >-
  Roadmap Collection 2026-08-18 (npdev-roadmap-collection.md), R6 item R6.2 -- "the inbound half of
  app-to-app eventing," R6.1's (RUN-14) sibling. Confirmed against real code before starting: no
  controller in NPDevRuntimeHost appended an EventEnvelope from an unauthenticated request, and the
  only inbound door (DirectExecutionGatewayController) requires NPDev auth AND rejects any flow with
  no capability-call step (webhook-driven awaitEvent flows have none) with ARCHITECTURE_BYPASS_REJECTED.
  R2.5 (RUN-11, done same collection) and R2.1 (RUN-6, prerequisite, done) were re-verified live in
  this session's own proof, not merely cited: a durable awaitEvent parks, survives the resume sweep's
  backoff, and completes once a matching event exists.
surface: dsl/schema, kernel/events, runtimehost/api
