  CLINIC BENCH 2026-11-27 ("a clinic app from packs only, under 2k output tokens"): harness catalog_bench.py (NPDev_General__OutsideRepo/NPDEV_FORM_PLAN_2026-11-13/impl/tools) gained the set `clinic` (one brief: scheduling, LGPD consent, Pix payments
