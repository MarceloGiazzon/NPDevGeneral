  BigDecimal(160.00) differed from a resent 160.0; it now compares numbers by value (BigDecimal, trailing zeros stripped). New test DefaultConceptGatewayFieldAccessTest.aProtectedDecimalResentWithAnotherScaleOrNumberTypeIsNotAChange: RED on the old code
