id: REG-361
title: >-
  None of the 19 wave-1 workshop pack versions passes the platform's validator any more (written for DSL 1.0 and the keywords the 22 Nov shrink removed) while the workshop table still showed "secure", and the
  feedback built for the authoring AI named no error for 13 of them (the validator answered in Portuguese and the extractor kept the closing brace)
type: GAP
severity: MEDIUM
status: PARTIAL
opened: 2026-11-25
source: >-
  REG-356 item D (two more packs `probed`; the wave-2 request that reuses pix-charge), followed up on the owner's instruction of 2026-11-25 to do everything that does not need them. `npdev pack workshop test cep`
  was REJECTED already at the first rung, which prompted re-testing the whole workshop.
surface: pack-workshop, contract/dsl, cli/pack
files:
  - NPDevCli/npdev_pack_workshop.py
  - NPDevCli/npdev_pack_populate.py
  - NPDevCli/tests/test_pack_workshop_test.py
  - NPDevCli/tests/test_pack_populate.py
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/cli/PackUpdateMain.java
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/cli/PackAddMain.java
  - NPDevContract/dsl/src/test/java/com/npdev/dsl/v1/cli/CliEnglishLocaleTest.java
detail: |
  MEASURED 2026-11-25 (every pack@version in the workshop re-tested with `npdev pack workshop test`, 2 min in total, workshop root PackWorkshop next to the Build root, outside the repo): all 19 are REJECTED today
  (17 at compose, 2 at static: nfe-issuer@1.0.0 and pix-charge@1.0.0). The table before showed `secure` as the highest rung for 12 of them (6 more were `delivered`, one `valid`); those verdicts predate the 22 Nov keyword shrink and the 3.0.0 line.
  CAUSES, read from the verdicts: (1) `dslVersion` 1.0.0 against the constant 3.0.0 (6 packs report it at static or compose); (2) keywords the shrink removed: `domainTypes[].validation.pattern` is now `regex`,
  `domainTypes[].ui.helpText` is gone (cep, cpf-cnpj, phone-br, pix-key); (3) `customCapabilities` was merged into `capabilities` on 18 Nov (nfe-issuer, pix-charge) and inside it the schema `enum` is now `enumValues`
  (not yet reached: the validator stops at the root key); (4) the 13 module packs (audit-log, documents, leads, messaging, multi-company, payables, quotes, two versions of several) compose a model that still carries
  `autoPanels`, `truthLevel`, `invariants[].expression` and the old `lifecycle`/`ui`/concept shape (read in full for leads@1.0.1; the others fail the same compose rung and were not read one by one). (4) is a rewrite, not a rename.
  NOT TOUCHED: no delivered pack was edited. The workshop's own rule is that a delivered version is immutable and a fix ships as a HIGHER version in a new zip; that re-authoring is the authoring AI's (or the owner's) step.
  FIXED HERE, two defects that made the feedback useless: (a) PackUpdateMain, PackAddMain and five sibling CLIs (PackSeal, PackSign, ModelCanonicalize, PackWhy, PackList) did not pin Locale.ENGLISH, which ModelValidatorMain and
  four others do, so on this pt-BR machine `npdev pack update` answered in Portuguese and, through the Windows console, with corrupted accents; PackUpdateMain calls PackAddMain.run directly, so the pin is at the start of
  every main AND run. CliEnglishLocaleTest (2 tests) was RED on the old code ("PackUpdateMain must pin the English locale ... expected: <en> but was: <pt...>") and is green; the whole dsl cli package passes (23 classes,
  105 tests). (b) npdev_pack_workshop kept the LAST line of the refusal (the closing brace) and called it "the dependencies could not be resolved together"; it now reads the JSON `error`, turns each schema problem into a
  `where - what - how to fix` line, and keeps the old sentence only as a fallback. test_a_schema_refusal_reaches_the_authoring_ai_with_its_real_problems was RED on the old code ("1 != 3 : ['pack.json packs - the
  dependencies could not be resolved together - }']") and is green; the workshop suite passes (61 tests).
  FEEDBACK TEXT for the authoring AI, regenerated with `npdev pack workshop feedback <batch>` after both fixes, in the workshop's feedback folder (outside the repo): w1-foundations__20261125.md and w1-modules__20261125.md.
  IMPACT ON WAVE 2: the delivery request reuses pix-charge (REG-356 item 8). pix-charge@1.0.0 is rejected at the first rung, so a wave-2 pack that requires it cannot compose until a higher pix-charge version exists.
  The owner decides whether the request asks for that fix first or carries it in the same batch; the request was NOT sent.
  OWNER DECISIONS 2026-11-25 (asked in the session): (a) the six foundation packs are fixed on this side; (b) the seven module packs are rewritten by the authoring AI TOGETHER WITH wave 2.
  DONE 2026-11-25 (a): cep, cpf-cnpj, phone-br, pix-key, nfe-issuer and pix-charge are re-issued as 1.0.1 (the 1.0.0 folders untouched) through the workshop's own path -- a zip with batch.json + handoff.json,
  `npdev pack workshop ingest`, then `npdev pack workshop test`: ALL SIX reach `secure` (static, compose, access-lint pass; behavior-probes SKIPPED because a data-type or contract-only pack has none to derive).
  The conversion is mechanical and recorded in the script that did it (outside the repo, with the zip it produced: NPDev_General__OutsideRepo/reg361-reissue/convert_wave1_foundations.py, run as `python convert_wave1_foundations.py <workshop packs root> <out dir> "<validator evidence text>"`, then zipit.py): dslVersion 3.0.0; validation.pattern -> regex; ui.helpText -> ui.description; customCapabilities -> capabilities; a capability
  property `type: string` + `enum` -> `type: enum` + `enumValues`; capabilityOperation.sideEffects dropped (removed 22 Nov, acted on by nothing); the few Portuguese words that the English-only lint now sees
  (it reads ui.description, which helpText never was) rewritten ("Chave Aleatória", "Carta de Correção", "Inutilização", "devolução", "Pix Automático"). Three of the six (pix-key, nfe-issuer, pix-charge) needed the last
  three rules (English-only, enum, sideEffects), found only by running the ladder after the first fix, not by reading the feedback: a pack rejected at one rung reports only that rung, so the feedback for the
  seven modules is a FIRST list, not the whole list; expect a second round.
  NOT DONE (b): the seven module packs (audit-log@1.0.1, documents@1.0.1, leads@1.0.1, messaging@1.0.0, multi-company@1.0.1, payables@1.0.1, quotes@1.0.1) fail in their SHAPE (concept access/fields/ui/indexes/lifecycle,
  invariants[].expression -> expr, autoPanels, rollups), not by a rename; they are in the revised wave-2 request (reworkFromWave1, second zip with batchId w1-modules), which is still the owner's to send.
  2026-11-26, WAVE 2 ROUND 1: the authoring AI (Gemini, browser) delivered the w2-delivery zip but never the w1-modules one; Claude re-issued vehicle-plate, delivery and food-delivery as 1.0.1 (owner order:
  delivered-but-rejected packs are fixed on this side), so all seven wave-2 sector packs are `secure`. WHY THE AI FAILED, measured: one message carried 182 KB (rules 32 + seven example packs 79 + the whole roadmap 37)
  and asked for 12 packs in one answer; Gemini errored on the second such request and one Claude Free request used the whole free quota. OWNER ORDER: one pack per message.
  BUILT 2026-11-26: `npdev pack workshop slice <pack>` (NPDevCli/npdev_pack_slice.py) writes ONE task per message -- prompt.txt + a compact slice.json (the roadmap entry, the required packs' concepts, the concept-owner
  list, the ONE closest built-in as example, and for a fix the previous pack.json + only that pack's checker feedback) -- next to the shared rules file (guide/NPDEV_PACK_RULES.md, 33 KB, built outside the repo by
  build_guide.py --rules-only). Measured: 46-48 KB in per slice for multi-company, messaging and audit-log, against 182 KB. `take <answer file>` turns the chat's one JSON block into batch.json + handoff + probes +
  the zip, ingests and tests it (the chat never runs code or makes a zip).
  MEASUREMENT = THE AI BENCH (owner order 2026-11-26: add to the existing mechanism, no parallel log; a first trials.jsonl was removed). New arm scripts/ai/bench/pack_slice_arm.py sends the SAME slice bytes
  through the bench backends, repairs in the same chat, scores with the workshop ladder in a scratch copy of the workshop, and writes <BuildRoot>/ai-bench/<run>/ in run_bench's shape (arm pack-slice), so
  `run_bench.py matrix|compare|mine` include it (matrix: 75 runs, 28 pack-slice); `take` records a browser answer the same way (backend kind browser). `npdev pack workshop trials` = official chat limits
  (NPDevCli/chat-ai-limits.json) + API facts (ai-providers.json) + every pack-slice run with its promptSha12.
  BENCH 2026-11-26 (free APIs only, 28 runs, prompt v1 -> v5): gemini-3.6-flash never answered (3x HTTP 503 overload, then 429 quota); groq gpt-oss-120b free = HTTP 413 (8,000 tokens/min < ~14k per slice);
  nemotron-3-ultra (nvidia) and nemotron-3.5-lightning:free (openrouter) answered every time in 150-350 s. On prompt v5: audit-log PASSED on both (lightning reached `probed`, ultra `secure`), each after
  ONE repair round; multi-company reached `secure` (lightning, probe expectations wrong) and messaging `valid` (both). Rules gaps the bench found and fixed (GUIDE_TEMPLATE.md, outside the repo): the guide
  said invariants use `expression` (DSL 3.0.0 accepts only `expr`); probe user names, experience names and the probe `json` shape were shown but never stated; capability `enum` vs `enumValues`;
  `replaces` belongs to batch.json; requiredPacks now carry the exact `packsEntry`. Workshop defects fixed: `requires` of the wrong shape crashed test_pack (now a compose rejection); a one-sentence
  `npdev pack update` refusal came back as "could not be resolved together - }" again (now passed through); a handoff enum error now names the allowed values; a broken answer JSON now gets line,
  column and the text around it (a repair then fixed it on the first try); the probe schema refuses '-' in /api paths. Bench mechanism: max_tokens and retry patience reach the shared backends; new
  infra kinds too-large (HTTP 413) and output-cap (a thinking model spent the whole budget, 0 characters). Tests: workshop 111, bench 126, all pass.
  The three v5 slices wait in the workshop's slices folder for the owner's browser run.
  2026-11-26 EVENING (owner: "advance without me for the next hours, simulating human use"; the API arm stood in for the browser, Claude never drove the owner's chat sessions or quota; real workshop backed up first to
  NPDev_General__OutsideRepo/backups/PackWorkshop__before-autonomous-20261126-1520.tar): ALL SEVEN wave-1 module packs are now `probed` in the REAL workshop, booted consumer included: audit-log@1.0.2,
  documents@1.0.2, leads@1.0.2, messaging@1.0.1, multi-company@1.0.2, payables@1.0.2, quotes@1.0.3 (done_when asked for `secure`). Authored by nemotron-3.5-lightning (openrouter free) from the slices, ingested from the bench zips;
  Claude's part, stated plainly: the probes of documents, leads, payables, quotes and messaging (update steps) and multi-company (two expectations) were WRITTEN OR CORRECTED BY CLAUDE (the model's own probes read rows
  they never created, sent invented reference ids, used PATCH and expected 403 against the pack's own documented rule), and quotes@1.0.3 is the 1.0.2 answer plus ONE line (rollups[].from "quotes::QuoteLine") re-issued by Claude.
  `promote` still needs the owner's review of each probed pack. Bench v6/v7 (openrouter, nvidia): messaging PASS, multi-company PASS first answer in 117 s, leads PASS, payables/quotes reached secure/valid only after Claude
  fixes; OpenRouter free day limit (50 requests) ran out; nemotron-ultra answered nothing inside 290 s on documents (infra:unreachable). WORKSHOP/BENCH DEFECTS FOUND AND FIXED (tests: workshop 58, bench 126, probe + validator pass):
  (1) the probe consumer's H2 file from the PREVIOUS test of the same pack survived regeneration (`data` is spared) and the next boot was refused as a destructive migration -> assemble_consumer wipes App/data;
  (2) AppGen/generator-runtime/current dated 2026-11-21 predated the implicit id, so messaging and multi-company probes were SKIPPED ("exactly 1 id field") -> restaged with prepare-npdev-generator-runtime.ps1 (job k8kecz);
  (3) the Java validator's one-of noise (twelve lines about the branch the author did not write) -> npdev_jsonschema.py now follows if/then/else and the workshop prints the REAL reason with the pack's own paths (_explain_one_of);
  (4) probe failures: the app's own answer text, "405 = PUT with the whole row, not PATCH", "${var} used before any step saved it" now says what to do; (5) non-cp1252 characters crashed `test` after the ladder ran (stream errors=replace);
  (6) fix slices carry the dependency constraints of today's built-ins (payables kept `contacts ^1.0` through two repair rounds); (7) static check for a key a concept does not know (`queries` inside a concept) and how-to-fix hints for
  enum/type, one-of input/output, invariant `unique`, `packs[]` entries. Rules file (OutsideRepo GUIDE_TEMPLATE.md, rebuilt twice) gained: input/output shape, queries are top-level, rollup shape and pack-qualified `from`, probe
  creates its own rows, ${rand} is one value per run, PUT not PATCH. Slices for the owner's browser test were regenerated with the final rules (folders *__20261126-1829 and later); the 1002 ones are the old prompt.
  2026-11-26 NIGHT: EXPOSURE-MATRIX RUNG WIRED (it was `skipped`: "the matrix logs in with passwords; the probe consumer uses static API keys"). scripts/quality/exposure_matrix.py gained an `ApiKey` credential (X-Api-Key header,
  no login), `--user-key name:KEY`, and its read/write scan moved into `scan(...)` returning (matrix, violations, warnings); the CLI behaves as before. The workshop (`_default_exposure`, `test_pack(exposure=...)`) loads that
  script by path (the same repo-relative reach as Build-NpdevApp.ps1) and runs it AFTER the probes pass and BEFORE the consumer stops, every probe identity on its own key, ADMIN-role identities exempt from expectations. A violation
  (any identity reading a system concept, a typed /api/identity_* route answering 2xx) => `rejected` with `exposure matrix - ... - tighten access.read` feedback; a non-admin reading a concept whose NAME merely looks
  sensitive (session/token/...) is a `(warning)`, never a rejection (a scheduling pack may own a `Session`). A matrix that cannot run (no routes, tool missing, crash) is a `skipped` rung with the reason, never a crash.
  Evidence: runs/<pack>@<ver>/<stamp>/exposure-matrix.json. MEASURED on the REAL consumer (scratch copy of the workshop, so no verdict of the owner's changed): leads@1.0.2 PROBED, exposure-matrix PASS in 2.2 s -- 5 concept routes
  x 4 identities, reps read their rows, the role-less identity got 403 everywhere, 4 system routes (400) and 4 typed routes (404) closed to everyone incl. admin. Tests: 5 new in test_pack_workshop_test (clean pass runs while the
  app is up, violation rejects + still stops the app, name-only heuristic is a warning, a crashing matrix is skipped, and the real default matrix against a local HTTP server that answers only to each identity's own X-Api-Key);
  workshop suites 87 pass. NOT yet re-run on the other six probed packs (the owner's `promote` review is the moment; a re-test writes a new run folder and could move a verdict).
  2026-11-26 NIGHT, PROVIDERS: OpenRouter free still `infra:quota` (0 tokens, 61 s); Gemini `infra:unreachable` (the call exceeded the 240 s budget with --max-tokens 32000); nvidia ultra needs more than the 290 s the 5-minute
  rule allows. No new pack (scheduling, tasks, consent-lgpd, payments) could be authored tonight. Both infra runs are on the results page (98 runs).
  2026-11-26 NIGHT, REVIEW OF EVERYTHING UNCOMMITTED (code-review high over the 13 modified + 5 new files, every finding re-read against the code before acting; 1 judged not a bug, 9 fixed with a test each):
  (a) the exposure rung on the OTHER SIX packs, real boots in a scratch copy of the workshop (no verdict of the owner's moved): audit-log@1.0.2 (7 routes), documents@1.0.2 (8), messaging@1.0.1 (4), multi-company@1.0.2 (8),
  payables@1.0.2 (5), quotes@1.0.3 (11), plus leads@1.0.2 (5) -- ALL SEVEN stay PROBED and exposure-matrix PASS, no violation, no warning (so the rung rejects nothing that is good). (b) FIXED: `run_bench.py matrix` died on a half-written batch record or a
  hand-edits.json entry without pack/version (it always succeeded before) -> `optional_page_data` + tolerant readers; `embed()` now also escapes `<!--` (script-escaped-state); `--patience` reached only the --provider path, now ProfileBackend too;
  `_explain_one_of` also deleted `$.packs[0] ...` lines WITH their packsEntry hint (it dropped noise for arrays the mini validator never reads) -> only for the arrays it explained; a cut `pack update` refusal kept JSON escapes (`\"`) in the lines sent
  to the AI; `extract_answer` closed a fenced block at the first inline ``` (a Markdown example inside a JSON string) and has a first-`{`..last-`}` fallback; two probe names collapsing to one zip entry now refuse BEFORE a zip exists and the handoff
  lists the file names that are in the zip; `trials`/`bench_rows` and `list_slices` skip one half-written result.json/meta.json with a warning; `assemble_consumer` no longer ignores a failed delete of the old consumer data (a java process still
  holding the H2 file) -- it skips the rung with the reason instead of booting on the stale schema. NOT A BUG: "a pack that owns a concept routed `credentials`/`user_sessions` is rejected" -- a pack concept's route is pack-prefixed
  (`<pack>_credentials`), only the identity pack's system concepts own the bare names. (c) The non-ASCII lint said "translate it" for a NON-BREAKING HYPHEN (audit-log@1.0.2 carries six U+2011 in its text, from the authoring AI) and stopped at the first
  character; it now reports each distinct character and, for typographic punctuation, says "replace all N with the plain ASCII '-'". audit-log@1.0.2 was not re-issued that night (the warning is cosmetic: English text with a typographic glyph); the owner answered yes
  on 2026-11-27, see the next entry. Tests: workshop/probe 281, bench 132, all pass.
  2026-11-27, audit-log@1.0.3 RE-ISSUED at the owner's yes, through the workshop's own path: a zip (NPDev_General__OutsideRepo/reg361-reissue/npdev-packs__w1-modules__audit-log-1.0.3.zip) built by a script that replaces ONLY
  U+2011 by an ASCII hyphen (9 occurrences, 6 in pack.json and 3 in handoff.json) and raises the version; pack.json, handoff.json and probes/access.json are identical to 1.0.2 after that swap (diffed). Backup of the workshop first
  (NPDev_General__OutsideRepo/backups/PackWorkshop__before-audit-log-103-20261127.tar). `ingest`, then `npdev pack workshop test audit-log@1.0.3` = PROBED, all five rungs PASS (static, compose with identity 14.2 s, access-lint,
  behavior-probes 8 steps 54.7 s, exposure-matrix 7 routes read as 4 identities 1.6 s), lint_pack 0 warnings (1.0.2 had 1). 1.0.2 stays in the workshop untouched; hand-edits.json and the review sheet are updated, the promote is the owner's.
  2026-11-27, SECOND STRETCH (the owner gave autonomy). (a) NEW PACKS scheduling@1.0.0 and tasks@1.0.0 authored by nemotron-3.5-lightning (openrouter free, quota renewed after 00:00 UTC) through the API arm, one repair
  round each, both PROBED in the real workshop with five green rungs (bench runs pack-slice-api-openrouter-scheduling-20261127 and -tasks-20261127, on the results page; 26k tokens in, 26k to 46k out each, 11 and 13 minutes under load).
  The ladder is green but both are thin and neither is recommended for promote: scheduling promises double-booking prevention with nothing enforcing it; tasks is ADMIN-only and two of its three concepts have no access rule.
  The model's own probe cannot see that, which is the lesson. (b) REVIEW BY BOOT of the wave-1 packs, extra probe steps in a throw-away copy of the workshop outside the repo, real boots, status code plus a GET after each step.
  MEASURED holes: payables@1.0.2 an apClerk approves their own payable (200, the GET shows APPROVED) but cannot pay; quotes@1.0.3 the preparing rep edits the header of an APPROVED quote and approves their own quote;
  messaging@1.0.1 an agent forges (201) and rewrites (200) an InboundMessage. (c) FIXED as NEW VERSIONS, never edits of delivered ones: payables@1.0.3 (guard on DRAFT to APPROVED) and quotes@1.0.4 (Quote.write locked in the
  terminal states), each carrying probe steps that prove the fix, both PROBED in the real workshop; zips and a workshop backup (PackWorkshop__before-fixes-and-new-packs-20261127.tar) in NPDev_General__OutsideRepo, hand-edits.json
  updated. Left to the owner because they are design choices: messaging (the agent also writes readByAgent) and whether a rep may approve their own quote. (d) PLATFORM GAP fixed in NPDevContract/dsl PackRoleBindingRewriter.java:
  role('x') was bound only inside read, write, visibleWhen, enabledWhen and readonlyWhen, so inside a lifecycle guard it stayed literal and the guard refused EVERY user, the manager included (first payables 1.0.3 run);
  guard joins the list; two new tests in PackRoleBindingRewriteTest fail on the old code (5 run, 2 red) and pass now; the generator runtime was restaged; payables 1.0.3 re-run PROBED with 12 steps. (e) The authoring guide now asks
  for plain ASCII punctuation (scheduling repeated the U+2011 habit), guide and rules rebuilt. The owner's review, one verdict per pack, is reg361-review/wave1-modules-claude-review__20261127.md in the evidence directory.
  2026-11-27, THIRD STRETCH (owner: "Continue"): slices for consent-lgpd and payments built (they need --batch w1-modules: no batch holds a pack that has no version yet). (a) consent-lgpd@1.0.0: nemotron-3.5-lightning reached `secure` in two repair
  rounds (run pack-slice-api-openrouter-consent-lgpd-20261127, 12 min, 93k tokens) but its own probe failed; a boot with extra REVIEW steps in the throw-away copy measured four holes (an ACCEPTED consent could not be withdrawn, a data subject
  read another subject's request, a data subject resolved their own request, a manager hard-deleted a consent record) and Claude fixed them (ACCEPTED -> WITHDRAWN, own-row read, a request lifecycle with guards, softDelete); the model's version was NEVER
  ingested: the real workshop holds only this fixed 1.0.0, PROBED with five green rungs and 23 steps (hand-edits.json says so; builder and zip in NPDev_General__OutsideRepo/reg361-reissue, backup PackWorkshop__before-consent-lgpd-20261127.tar). MEASURED
  PLATFORM FACT: an `access.write` row rule is evaluated on the NEW row, so `status != 'WITHDRAWN'` refused the withdrawal itself (ROW_SCOPE_DENIED); a terminal-state lock only works for a role that never makes the final transition (quotes 1.0.4's rep).
  Left in the pack's reviewNotes: a manager can still edit or soft-delete a withdrawn grant. (b) payments: three bench runs on the same slice, NONE passed (compose `valid` each time, a different failing layer per round, one `infra:output-cap`);
  the best answer is thin (PixCharge/Refund readable only by ADMIN, no refund-amount rule, pixProvider unused), so no payments version exists in the workshop. What the failures changed in the REPO: the slice prompt (NPDevCli/npdev_pack_slice.py) now says `requires` is
  an object, never a list of pack ids, and how a required pack's domain type is written; `_with_shape_hint` (NPDevCli/npdev_pack_workshop.py) answers "reference target not found: <pack>::<Name>" with the domain-type reading, or the own-pack spelling
  with the hyphen when the model dropped it; two tests (test_pack_workshop_slice, 73 workshop tests pass). Fresh payments slice: PackWorkshop/slices/payments@1.0.0__20261127-1811.
  2026-11-27, FOURTH STRETCH (owner answered: consent-lgpd limit "Ok", and "Termine o servico" = decide and build what was left to them). Claude decided and built, each as a NEW version, each PROBED in the REAL workshop (five rungs green):
  messaging 1.0.2 (field-level access.write on the InboundMessage content fields, ADMIN or $user.isSystem: an agent can no longer forge or rewrite an inbound message but still flips readByAgent; 14 steps), quotes 1.0.5 (guard on SENT to APPROVED,
  salesManager or ADMIN: a rep cannot approve their own quote; 13 steps), audit-log 1.0.4 and multi-company 1.0.3 (wording only), scheduling 1.0.1 (UNIQUE index on Booking resource+start, honest wording, 10 steps) and tasks 1.0.1 (roles taskManager /
  taskUser, owner on all three concepts, parentField on items, 17 steps) over the model's thin 1.0.0, and payments 1.0.0 WRITTEN BY CLAUDE (nemotron-3.5-lightning x3 and nemotron-3-ultra x1 never composed; best answer thin): three roles, guards so an
  operator cannot confirm their own payment/charge/refund, field locks on the money fields, parentField on charge/refund writes, PixKey domain type, 39 steps. Builders and zips in NPDev_General__OutsideRepo/reg361-reissue (build_reissue_20261127b.py,
  build_reissue_20261127c.py, build_payments.py, build_consent_lgpd.py), review-by-boot in the throw-away copy review-probe-ws, entries in hand-edits.json, verdict sheet reg361-review/wave1-modules-claude-review__20261127.md (FINAL section).
