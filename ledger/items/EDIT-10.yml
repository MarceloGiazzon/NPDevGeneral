  ref: >-
    D:\WorkSpace\NPDev\AppGen\apps\payment-webhook-rehearsal\explorations\
    r7-9-keyboard-workbench-create-edit.json -- run with `npdev explore run --app-dir <generated app>
    --file <routine> --engine-port <port of an engine started with SCRAPFORAI_API_KEY set> --api-key
    <that engine key> --credential apiKey=<app's own X-Api-Key, from secrets/api-key.env>`. Evidence
    (run.json, the routine, exploration-config.json) copied to
    D:\WorkSpace\NPDev\NPDev_General__OutsideRepo\r7-9-evidence\ because a generated app's `_ops/` --
    unlike `data`/`logs`/`secrets` -- is NOT spared across regeneration (MON-19). DELIBERATELY
    `manual`: the routine lives with an AppGen app, which CLAUDE.md defines as source-of-truth layer 2
    ("not a git repo"), so no repo-rooted path can name it -- same reason EDIT-5/6/7/8/9's guards are
    manual.
  asserts: >-
    a routine drives a complete create-then-edit of an aggregate's header and one owned collection
    entirely via keyboard events (press/fill, never click) -- typing, Enter-commit-and-advance between
    fields/cells, arrow-key cell-to-cell navigation respecting caret boundaries, Enter at the grid's
    last cell adding a row rather than doing nothing, and the add-row/delete-row controls (previously
    unreachable `<span onclick>`) both being genuinely Tab-and-Enter operable -- and the save actually
    commits (asserted via the success message, and independently via the server's own request log
    showing the exact keystrokes as the persisted payload).
  provenRed: true
  provenRedNote: >-
    Two distinct real reds, each diagnosed to root cause rather than guessed, neither simulated: (1)
    the FIRST live run failed with a genuine 503 on Save ("Failed saving concept ProductBatch to JDBC
    store") -- traced to `AggregateRuntime.resolveId` never substituting a fresh UUID for a client
