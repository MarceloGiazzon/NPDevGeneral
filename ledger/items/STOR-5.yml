id: STOR-5
title: >-
  The schema-realization script is written in Postgres/H2 guarded-DDL idioms (IF NOT EXISTS), which
  MySQL supports only partly and SQL Server not at all -- so NPDev's own V1 migration cannot run
type: GAP
severity: HIGH
status: DONE
opened: 2026-08-08
closed: 2026-08-09
verification: VERIFIED_LIVE
surface: generator/dbconfig/SchemaRealizationEmitter, kernel/storage-dialect
source: >-
  storage/FULL_SUPPORT_PLAN.md gap A / exit criteria E3+E4. Uncovered one construct at a time by the
  application-level probe, once STOR-4's missing JDBC driver stopped hiding everything behind it.
detail: >-
  `SchemaRealizationEmitter` writes `V1__npdev_schema_realization.sql`, the Flyway script that
  creates NPDev's own internal tables and the app's business tables. It is written in the guarded-DDL
  dialect of Postgres and H2:

      CREATE TABLE IF NOT EXISTS ...
      CREATE INDEX IF NOT EXISTS ...
      ALTER TABLE ... ADD COLUMN IF NOT EXISTS ...

  MEASURED, one CI round each, against real containers:

    run 31273275129  MySQL      error 1170 -- BLOB/TEXT column 'execution_id' used in key
                                specification without a key length          [FIXED: STOR-4 / keyableTextColumnType]
    run 31279857141  MySQL      error 1064 -- syntax error near 'IF NOT EXIST...'
                                (MySQL has no CREATE INDEX IF NOT EXISTS)    [THIS ITEM]
    run 31279857141  SQL Server "Incorrect syntax near 'probe_reserveds'"
                                (T-SQL has no CREATE TABLE IF NOT EXISTS)    [THIS ITEM]

  WHY IT SURFACED ONLY NOW, AND WHY THAT IS THE POINT

  Every layer below this was green and stayed green: Tier A (78 assertions, four engines), Tier B
  (14/14 behavioural vectors per engine against REAL containers, zero skips), and the whole
  configuration path. None of them ever asks the engine to run NPDev's OWN generated DDL, because
  none of them generates an app. This is gap A restated concretely for a second time -- STOR-4 was
  the first -- and it is the reason the plan ranks "a generated app boots" above everything else.

  The failures are also strictly ordered: each fix reveals the next construct, because Flyway stops
  at the first statement it cannot run. That makes the remaining work bounded and visible rather
  than open-ended, but it does mean one CI round per construct until the seam is complete.

  WHAT THE FIX LOOKS LIKE

  This belongs in `SqlDialect`, beside `guardedConstraintDdl` which already exists for exactly this
  reason -- a Postgres `DO $$ ... $$` block that MySQL and SQL Server have no equivalent for. The
  same treatment is needed for the three idioms above:

    Postgres / H2   native IF NOT EXISTS
    MySQL           CREATE TABLE IF NOT EXISTS is supported; CREATE INDEX IF NOT EXISTS and
                    ADD COLUMN IF NOT EXISTS are not -- they need an information_schema guard around
                    a PREPARE/EXECUTE, or Flyway callbacks
    SQL Server      none are supported -- each needs an IF OBJECT_ID(...) IS NULL / IF NOT EXISTS
                    (SELECT ... FROM sys.*) wrapper

  `check-dialect-sites.py` should grow patterns for these three constructs at the same time, so the
  next one written inline fails the gate rather than a CI job.

  DO NOT let this be worked around in the workflow (for instance by pre-creating tables). The point
  of the probe is that a USER's first boot runs this script.
resolution: |
  DONE -- and this record was STALE, which is the part worth recording. It sat OPEN at HIGH,
  asserting that MySQL and SqlServer "remain EXPERIMENTAL", while the code had shipped and the CLI
  had already moved both to `supported`. A top-severity item arguing against your own release claim
  is how people stop trusting all the records.

  WHAT SHIPPED

  Three guarded-DDL idioms became dialect methods -- guardedCreateTable, guardedCreateIndex,
  guardedAddColumn -- joining the guardedConstraintDdl that already existed. Postgres and H2 keep
  their native keyword insertion and are byte-identical to before; MySQL uses an INFORMATION_SCHEMA
  probe with PREPARE/EXECUTE, and SQL Server IF OBJECT_ID / sys.indexes / IF COL_LENGTH blocks. Every
  one is idempotent, which is mandatory: R__npdev_schema_additive_columns.sql is a REPEATABLE
  migration (REG-38).

  VERIFIED, re-checked at ce57541 rather than taken on trust:

    - all four guarded idioms route through engine.dialect() in SchemaRealizationEmitter
      (lines 1128, 1597, 1604, 1611)
    - the only remaining `IF NOT EXISTS` outside a comment is PROSE inside a string the emitter
      writes as a comment INTO the generated script -- not an emitted construct
    - run-engine-app-proof.py lints every generated script with --generated-for immediately after
      generation, and CI run 31296993259 is green on postgres, mysql AND sqlserver

  THE TRAP, since the next person will re-run the linter: scoped to the whole repo it reports ~41,340
  occurrences across 316 scripts. Those are historical Build-root artifacts -- apps generated months
  ago for H2, which legitimately contain TEXT and TIMESTAMP and will never run on SQL Server. Always
  pass --generated-for <engine> and scope to a script generated FOR that engine, or the tool
  manufactures an emergency.

  FOUR MORE DEFECTS STOOD BEHIND THIS ONE, each invisible until it was cleared: STOR-7 (a text column
  has three roles), STOR-9 (a row lock is a table hint on SQL Server), STOR-10 (five two-engine
  assumptions), STOR-12 (a Postgres-only SQLSTATE). That is the shape worth remembering -- fixing the
  first blocker does not reveal the last one, it reveals the second.
