id: REG-240
title: >-
  GeneratedCrudRuntimeSupport.identityTables is derived once at construction -- REG-235 converted
  this class's lookup sites to a live Supplier but left both of its constructor-time derivations
type: BUG
severity: MEDIUM
status: DONE
opened: 2026-09-22
closed: 2026-09-23
source: >-
  Exhaustive B28 residual sweep run to answer "is the residual list finally complete?" (it was not;
  see also REG-241, REG-242 and `ledger/boundaries/B28.yml`'s 2026-09-22 entry). REG-235 converted
  `GeneratedCrudRuntimeSupport` to hold a `Supplier<CompiledModel>` and read it live at its 7
  internal LOOKUP sites, and the class was thereafter treated as fixed -- which is precisely why
  this was missed: holding a Supplier is not sufficient when the constructor calls `.get()` once and
  caches the DERIVED result.
  `NPDevKernel/adapters/runtime-support/.../GeneratedCrudRuntimeSupport.java:403` does exactly that:
  `this.identityTables = IdentityPackTableNames.tryResolve(modelSupplier.get())`.
surface: NPDevKernel/adapters/runtime-support/src/main/java/com/npdev/runtime/support/GeneratedCrudRuntimeSupport.java
detail: |
  IMPLEMENTED 2026-09-23, the fresh-lookup shape this item proposed (not the cache-shape
  alternative it also offered). The `identityTables` field is gone; `identityTables()` is now a
  private method (`GeneratedCrudRuntimeSupport.java:2707`) that calls
  `IdentityPackTableNames.tryResolve(modelSupplier.get())` fresh on every call, read live at both
  consuming sites (the role-lookup permission check and the tokenVersion revocation check). No
  `ModelReloadListener` wiring was needed for this one -- unlike REG-241's EventBus subscriptions,
  this is a pure lookup, so `modelSupplier` alone (already held by the class since REG-235) is
  sufficient; the caching bug was purely "resolves once and keeps the derived `Optional` forever,"
  not "the Supplier itself is stale."

  Verified: `:adapters:runtime-support:test --rerun-tasks` BUILD SUCCESSFUL, both
  `GeneratedCrudRuntimeSupportModelReloadTest` tests pass with skipped=0. RED-PROVEN, not assumed:
  temporarily reintroduced the exact original bug shape (a field caching the FIRST resolved
  `Optional` on first call, i.e. `if (cache == null) { cache = tryResolve(...); } return cache;`)
  and confirmed BOTH `identityTablesComposedByAReloadAreHonored` and `anIdentityTableRenameIsFollowed`
  fail while the unrelated third test in that file
  (`aConceptAddedAfterConstructionIsVisibleWithoutRebuildingTheInstance`) stays green -- exactly the
  two tests this item's two failure modes predict, no more and no less. The stub was restored and
  its absence verified by grep before commit.

  Duplication note from this item's original text still applies as historical record: REG-239 fixed
  the analogous derivation on `DefaultExecutionAuthorizationPolicy`'s side by folding it into that
  class's reload-swapped `ModelDerivedState`, a different mechanism (swap-on-reload) from this
  fix's (read-live-every-time). Two shapes for one kind of problem now exist in the platform: worth
  a twin-pair registry rule if a third case turns up, not worth generalizing for two.

  Also fixed alongside in the same session (REG-241, HIGH, this class's orchestration subscribers):
  see that item.
guard:
  kind: test
  ref: >-
    NPDevKernel/adapters/runtime-support/src/test/java/com/npdev/runtime/support/GeneratedCrudRuntimeSupportModelReloadTest.java#identityTablesComposedByAReloadAreHonored
  asserts: >-
    constructs the adapter against a model with no identity pack (identityTables resolves to
    empty, must not throw), then reloads with a model that DOES compose identity::User, and
    confirms the resolution becomes present with the correct usersTable -- the more severe of the
    two failure modes, since an empty result silently hands an empty role set to every
    generated-CRUD permission check and unconditionally reports tokenVersion as not revoked. Sibling
    anIdentityTableRenameIsFollowed covers the second failure mode: an identity table RENAMED by a
    reload (not composed/decomposed) must be followed immediately rather than read from a name
    cached at construction, which would otherwise split login (re-resolves per request) from CRUD
    authorization (would keep reading the old table) onto two different tables.
  provenRed: true
