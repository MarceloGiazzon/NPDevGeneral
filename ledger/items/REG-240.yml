id: REG-240
title: >-
  GeneratedCrudRuntimeSupport.identityTables is derived once at construction -- REG-235 converted
  this class's lookup sites to a live Supplier but left both of its constructor-time derivations
type: BUG
severity: MEDIUM
status: OPEN
opened: 2026-09-22
source: >-
  Exhaustive B28 residual sweep run to answer "is the residual list finally complete?" (it was not;
  see also REG-241, REG-242 and `ledger/boundaries/B28.yml`'s 2026-09-22 entry). REG-235 converted
  `GeneratedCrudRuntimeSupport` to hold a `Supplier<CompiledModel>` and read it live at its 7
  internal LOOKUP sites, and the class was thereafter treated as fixed -- which is precisely why
  this was missed: holding a Supplier is not sufficient when the constructor calls `.get()` once and
  caches the DERIVED result.
  `NPDevKernel/adapters/runtime-support/.../GeneratedCrudRuntimeSupport.java:403` does exactly that:
  `this.identityTables = IdentityPackTableNames.tryResolve(modelSupplier.get())`.
surface: NPDevKernel/adapters/runtime-support/src/main/java/com/npdev/runtime/support/GeneratedCrudRuntimeSupport.java
detail: |
  NOT IMPLEMENTED. Field declared at `:273`, derived at `:403`, consumed at `:2645-2647` and
  `:2663-2666`.

  Two distinct observable failures after a hot reload:

  1. The identity pack is COMPOSED by the reload. An app that booted without `identity::User` keeps
     `Optional.empty()` forever, so `:2645` hands an empty role set to every generated-CRUD
     permission check (`IdentityRoleLookup.rolesFor` is never called) and DB-stored role grants are
     ignored; and `:2663` returns `false` unconditionally from the revocation check, so a
     `tokenVersion` bump STOPS LOGGING ANYONE OUT of the CRUD surface.
  2. An identity concept's `tableName` changes. This class keeps querying the OLD table while every
     other `tryResolve` caller re-resolves per request and uses the NEW one (LoginController,
     IdentityAwareContextResolver, ChangePasswordController, CreateUserController,
     PasswordResetController, BootstrapAdminController, the two ControlPanel user controllers,
     OAuthGoogleAuthService). Login then succeeds against the new table while CRUD authorization
     reads roles from the old one -- a silent split brain.

  Fix shape: fresh-lookup. The class already holds `modelSupplier`, so replace the field with a
  private `identityTables()` helper over `modelSupplier.get()`. `tryResolve` is four `findConcept`
  calls -- the same per-request cost the ten RuntimeHost callers above already pay. If `:2645` is
  judged too hot for that, use `LiveConceptGatewaySemanticPolicy`'s identity-compare cache shape
  (REG-236) instead. A `ModelReloadListener` is NOT directly available here: this is a `:kernel`
  adapter and cannot import `ModelHolder`, so a listener-based fix would need REG-239's `setModel`
  idiom with the registration living in `NpdevCapabilityBindingConfig`.

  Note the duplication this leaves today: REG-239 fixed this exact derivation on the other side, by
  folding `identityTables` into `DefaultExecutionAuthorizationPolicy`'s reload-swapped
  `ModelDerivedState`. The platform currently holds two copies of one derivation, one reload-aware
  and one not. Worth considering a twin-pair registry rule rather than just fixing the second copy.
