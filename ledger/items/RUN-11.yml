id: RUN-11
title: >-
  A flow can wait for an approval but cannot escalate -- there is no way to express "wait, but
  time out after N hours and do something else"
type: GAP
severity: HIGH
status: DONE
opened: 2026-08-18
closed: 2026-08-18
verification: VERIFIED_LIVE
source: >-
  Roadmap Collection 2026-08-18 (npdev-roadmap-collection.md), R2 item R2.5 -- "the single biggest
  missing automation primitive... every approval workflow with a deadline; the flow demo that
  separates NPDev from CRUD generators." Blocked by R2.1 (RUN-6), which landed earlier the same day.
surface: kernel/flow-steps, dsl/schema
files:
  - NPDevKernel/kernel/src/main/java/com/npdev/kernel/AwaitEventStep.java
  - NPDevKernel/kernel/src/main/java/com/npdev/kernel/ResumeCoordinator.java
  - NPDevKernel/kernel/src/main/java/com/npdev/kernel/FlowStateCodec.java
