id: REG-209
title: >-
  A stable uid resolves a concept/field rename by identity, on any editing path including a raw
  hand-edit -- no journal, no inference (boundary B1 -> LIFTED)
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-09-06
closed: 2026-09-06
source: >-
  ALL_HITTABLE_LIFT_PLAN_2026-09-05.md package P7 (Wave 3, last and alone -- the only package that
  can break every generated app at once). B1.yml's own residue: "The one genuinely uncaptured case
  is a raw hand-edit of model.json through none of the above, which no journal design (new or old)
  can capture on an edit path it never sees." Correct for a journal -- a journal records the edit,
  so it must see it happen. Identity is different: it lives in the file the hand-editor is already
  editing.
surface: >-
  NPDevContract/dsl (schema mirrors, AST/compiled/canonical-JSON/resolver chain), runtimehost-core
  (persistence + rename-by-identity resolution), NPDevGenerator (manifest emission, authoring
  stamping, authoring-diff protection), NPDevCli (the assign-uids codemod), and
  NPDevSamples/dsl-conformance-max (corpus coverage).
