id: ACC-1
title: >-
  Manager accessibility preferences (text size, motion, focus, spacing, links, colour-blind safe) in Appearance
type: FEATURE
severity: MEDIUM
status: DONE
opened: 2026-11-03
closed: '2026-11-03'
source: >-
  Manager UX plan 2026-10-31 (NPDev_General__OutsideRepo/NPDEV_MANAGER_UX_PLAN_2026-10-31/PLAN.md); owner asked
  on 2026-11-03 to implement the whole plan.
surface: manager/ui
detail: Preferences UI persisted in Appearance.a11y and applied by applyA11y; a11y.css linked last.
resolution: >-
  The Appearance screen carries the six preferences (text size 90-150 %, motion, keyboard focus, text spacing, links,
  colour-blind safe status colours), persisted in manager.json (a11y) and applied by NPDevTheme.applyA11y; a11y.css
  is linked last in index.html. The Rust side refuses values outside the engine's allowed lists.
files:
- NPDevManager/ui/appearance.js
- NPDevManager/ui/a11y.css
- NPDevManager/ui/index.html
- NPDevManager/src/themes.rs
verification: UNIT_TESTED
guard:
  kind: manual
  ref: scripts/quality/check-manager-ui-render.mjs
  asserts: >-
    after selecting 130 % / reduce / always / wide / underline / colour-blind safe the document carries --np-text-scale
    1.3 and the matching data-np-* attributes, the status colour actually changes, and the saved appearance carries
    the values.
  provenRed: false
note: >-
  2026-11-03: the render check proves the attributes and the colour change, not that the 130 % zoom looks right
  on every screen -- that needs a pass in the real window.
