id: PACK-5
title: >-
  A pack cannot depend on a pack, so variations cannot build on a base
type: GAP
severity: HIGH
status: DONE
opened: 2026-08-12
closed: 2026-08-13
verification: UNIT_TESTED
source: >-
  Full-repo maturity audit 2026-08-12 (PACK-ROADMAP.md §1 ground truth, card PK-3). pack.schema.json
  has no `packs` property -- a pack depending on a pack is impossible by schema, confirmed this
  session (both pack.schema.json copies read in full: $ref remote-scheme patterns are also forbidden).
surface: dsl/pack-composition
files:
  - NPDevContract/dsl/src/main/resources/schema/pack.schema.json
  - NPDevContract/schemas/pack.schema.json
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/parser/PackDependencyGraphWalker.java
detail: |
  Closed by MASTER-ROADMAP.md Step 8 (PK-3, branch step8-pack-depth). pack.schema.json now declares
  `packs: [{"pack": "user", "version": "^2.0"}, ...]`; new PackDependencyGraphWalker recursively
  discovers a pack's own transitive dependencies (packId-keyed, deduping a diamond -- e.g.
  `app -> crm -> user`, `app -> billing -> user` -- to exactly one merged `user`), refusing by name
  on a real cycle, a depth/fan-out DoS cap, or an MVS version conflict. `npdev.lock` records the
  resolved graph, only enforced once a real transitive dependency exists (every pre-existing
  pack/app in the repo has none, proven as an explicit no-op regression). `allowSideBySide` lets a
  direct app import deliberately coexist with a different-file collision. Still local files only,
  per the card's own v1 scope -- no registry/network (PK-5's own remote-`$ref` restriction stays
  exactly as measured when this item was opened).
guard:
  kind: script
  ref: "./gradlew :NPDevContract:dsl:test --tests com.npdev.dsl.v1.PackTransitiveDependencyResolutionTest"
  asserts: "a 3-level diamond (app -> crm -> user, app -> billing -> user) resolves to one merged user pack; a cycle refuses naming the path; a cross-major conflict refuses naming both requirers"
  provenRed: false
