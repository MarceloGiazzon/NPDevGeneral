id: STOR-24
title: >-
  A3: run compatibly instead of refusing -- explicit column projection (never select *) + a
  compatibility verdict so an older build boots and serves traffic against a newer, additively-ahead
  database (B5 reclassified to LIFTED for the additive case, REAL_LIFT_PLAN_2026-09-03)
type: FEATURE
severity: MEDIUM
status: DONE
opened: 2026-09-03
closed: 2026-09-04
source: >-
  REAL_LIFT_PLAN_2026-09-03.md Track A package A3 (B5) -- the plan's own framing: "the single most
  operationally expensive refusal left in the platform," hit by every rolling deploy, blue-green
  cutover, and rollback.
surface: runtimehost-core (db/schema-state, persistence), kernel adapters (persistence-postgres), B5
