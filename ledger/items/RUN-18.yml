  ref: >-
    NPDevKernel/adapters/mail-smtp/src/test/java/com/npdev/adapters/mail/smtp/ScheduledReportEndToEndTest.java#aCronScheduledFlowRendersAConceptListToPdfAndEmailsItWithTheAttachment
  asserts: >-
    A model.json declaring documentRender/mail capabilities+bindings and a schedule.cron flow
    compiles through the real DSL parse/validate/compile path; executing that flow via a real
    KernelRunner against real DocumentRenderInProcAdapter + SmtpMailCapabilityAdapter (GreenMail
    sink) completes OK and delivers exactly one multipart/mixed MIME message whose alternative part
    carries the flow-supplied HTML body and whose attachment part is a real, non-empty, well-formed
    PDF (%PDF- signature) byte-identical to what the renderer produced. Sibling tests in
    SmtpMailCapabilityAdapterTest/InProcMailCapabilityAdapterTest/DocumentRenderInProcAdapterTest/
    DocumentRenderStubAdapterTest cover the individual pieces (HTML-only multipart/alternative,
    attachment-only multipart/mixed, single-map attachment auto-wrap, documentRender invoke()
    success/failure/unsupported-operation paths) in isolation.
  provenRed: true
  provenRedNote: >-
    Forced `hasAttachments = false && !rendered.attachments().isEmpty()` in
    SmtpMailCapabilityAdapter.populateContent (a one-line, temporary, in-session edit) and re-ran
    ScheduledReportEndToEndTest alone: FAILED at the multipart/mixed assertion (org.opentest4j
    .AssertionFailedError at ScheduledReportEndToEndTest.java:169) because the message degraded to
    multipart/alternative with the attachment silently dropped -- exactly the class of defect this
    item closes. Reverted the change and re-ran the full 4-module suite (mail-smtp, mail-inproc,
    document-render-inproc, document-render-stub): 31/31 green, 0 skipped, including the same guard
    test. :kernel:test (the shared kernel/ports changes) also run clean as a safety check. Both
    gradle runs executed live this session, not simulated.
