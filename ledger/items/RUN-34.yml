id: RUN-34
title: >-
  FinalAppAssembler.stageRuntimeHostLibsIntoApp copies source runtimehost-libs jars into the app's
  libs/npdev-runtime with REPLACE_EXISTING but NEVER deletes a jar that used to exist -- after a
  module rename, the old jar sits next to the new one, both define the same classes, and Gradle
  resolves them nondeterministically: scattered "cannot find symbol" compile errors that look like
  intermittent staleness but are a fixed consequence of the duplicate
type: BUG
severity: HIGH
status: DONE
closed: 2026-09-16
opened: 2026-09-14
source: >-
  Found while live-verifying Session 2's AILoop (NPDEV_MEGA_ROADMAP.md) -- this was the actual root
  cause behind hours of seemingly-random generated-app build failures. Both the Manager's AppData
  cache and the verification app had accumulated orphaned jars after module renames:
  dsl-0.1.0.jar (old) beside npdev-dsl-0.1.0.jar (current) -- both define com.npdev.dsl.v1.compiled.
  {CompiledDocument,CompiledModel,...}, but the old classes lack methods current generated code calls
  (aggregate(), bands(), logo(), findWebhookBySource(...), getLabelLocales(), labelLocales()); an
  old expression-cel-0.1.0.jar also bundled its own stale GeneratedCrudRuntimeSupport (5-arg
  auditCrudMutation) beside the current runtime-support-0.1.0.jar. Not the same bug as RUN-32
  (build-finalapp's 3 failed bundled tests) -- do not conflate; both live in the under-tested
  "runtimehost-libs handling" area.
surface: NPDevGenerator/generator/src/main/java/com/npdev/generator/assembly/FinalAppAssembler.java (stageRuntimeHostLibsIntoApp, ~line 984), any generated app's libs/npdev-runtime
detail: |
  stageRuntimeHostLibsIntoApp lists every .jar in the source runtimehost-libs and copies each into
  <app>/libs/npdev-runtime with Files.copy(..., REPLACE_EXISTING). A jar that used to be in the
  source but no longer is (module renamed) is never removed from the destination, because the copy
  loop has no delete/diff pass. When two jars define the same class, whichever javac/Gradle sees
  first wins -- and it does not consistently favor the newer jar, so different runs produce
  different "cannot find symbol"/"method cannot be applied" errors. The symptom is deterministic,
  not intermittent; it masquerades as cache staleness.

  Verify a cache is clean:
    ls <cache-dir> | grep -i dsl                      # ONLY npdev-dsl-0.1.0.jar, never dsl-0.1.0.jar
    jar tf <cache-dir>/expression-cel-0.1.0.jar | grep GeneratedCrudRuntimeSupport   # EMPTY

  Fixed this session as a MANUAL WORKAROUND only (fully deleted, not just overwrote, the AppData
  cache and the app's libs/npdev-runtime, then regenerated from the cleaned shared cache -- the
  re-confirmation build is pending provider flakiness). Not fixed in code.

  Real fix: delete the destination directory's contents (or diff and remove orphans) before the
  copy in stageRuntimeHostLibsIntoApp. This can silently corrupt ANY generated app's build, not
  just this verification app.
  Done when: stageRuntimeHostLibsIntoApp removes orphaned jars from libs/npdev-runtime before
  copying (unit-tested or verified by generating with a stale dsl-0.1.0.jar planted in the source
  cache and asserting the app gets ONLY npdev-dsl-0.1.0.jar).

  2026-09-16 (fix session): FIXED in code, both mechanisms. The root chain is now fully mapped:
  Sync-NPDevJars (sync-runtimehost-libs.ps1) copies source build outputs into the runtimehost-libs
  cache and collects jars that are "external or missing" (orphans a module rename left behind) under
  the sync report's externalOrMissing -- but NEVER deletes them, and the fresh manifest it writes
  each run declares ONLY the current jars (requiredStagedJars, derived from the just-discovered
  source outputs). stageRuntimeHostLibsIntoApp then copied every *.jar in the cache verbatim, so a
  stale dsl-0.1.0.jar beside npdev-dsl-0.1.0.jar (same classes) landed in every app generated from
  that cache.
  Changes (FinalAppAssembler.java, stageRuntimeHostLibsIntoApp): (1) when the staging manifest
  exists, the copy is now FILTERED to requiredStagedJars -- a stale cache jar the manifest no longer
  declares is never staged, which is what makes a fresh app correct even when the cache itself is
  never cleaned (the done-when's exact scenario); manifest-absent keeps the legacy copy-everything
  behavior (verifyNpdevRuntimeHostLibs already fails loud about that state). (2) Before the copy,
  any *.jar already in the app-owned libs/npdev-runtime that is not about to be restaged is deleted
  -- this closes the deleteBeforeMount=false regeneration path, where the destination dir survives
  and a jar that is no longer staged would otherwise sit beside the current one forever.
  VERIFIED: new unit test stagesOnlyManifestDeclaredJarsAndDropsOrphanedAppOwnedJars in
  FinalAppAssemblerTest replays the done-when (dsl-0.1.0.jar planted in the source cache with a
  manifest declaring only npdev-dsl-0.1.0.jar -> the app gets ONLY npdev-dsl-0.1.0.jar) and the
  destination half (orphan planted in the app-owned dir, deleteBeforeMount=false regeneration
  removes it while the current jar survives). Both FinalAppAssemblerTest and
  FinalAppAssemblerRegenerationConflictTest classes green (:generator:test, Gradle 9.5.1). The
  packaged-app proof suite (:generator:packagedProofTest) exercises the same method against the real
  machine cache in CI and was not run locally (gated, unchanged env contract). RUN-33's AppData
  cache (a stale cache with MISSING jars) is a separate, still-open item; note the manifest filter
  also mitigates RUN-33's missing-jar symptom for generated apps whose source cache manifest is
  fresh, but does not restage the Manager's own AppData copy.
guard:
  kind: test
  ref: >-
    NPDevGenerator/generator/src/test/java/com/npdev/generator/assembly/FinalAppAssemblerTest.java#stagesOnlyManifestDeclaredJarsAndDropsOrphanedAppOwnedJars
  asserts: >-
    stageRuntimeHostLibsIntoApp stages ONLY the jars the staging manifest declares (a stale
    dsl-0.1.0.jar planted in the source cache is never copied) and deletes an orphaned jar already
    sitting in the app-owned libs/npdev-runtime before a deleteBeforeMount=false regeneration --
    exactly this item's done-when
  provenRed: true