id: W1.7
title: >-
  Seven browser routines existed and none covered a list, a detail, a workbench, a long-running
  flow, or a permission-denied path -- every Wave 1 exit criterion ("a non-technical user can
  complete core tasks") was an assertion, not a test result.
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-09-13
closed: 2026-09-13
verification: VERIFIED_LIVE
source: >-
  NPDEV_ROADMAP_2026-09-12.md, Wave 1 (W1.7): "Five golden browser scenarios, in a gate."
  Depends on W1.5 (shared global states), which depends on W1.4 (design tokens) -- all three
  closed in this same session.
surface: NPDevSamples (browser-routines corpus, dsl-conformance-max model), scripts/quality (new
  gate script), scripts/policy + scripts/quality/verification-cadence.json (wiring)
files:
  - NPDevSamples/scripts/browser/browser-routines/list-verify-routine.json
  - NPDevSamples/scripts/browser/browser-routines/detail-verify-routine.json
  - NPDevSamples/scripts/browser/browser-routines/workbench-verify-routine.json
  - NPDevSamples/scripts/browser/browser-routines/longrunning-flow-verify-routine.json
  - NPDevSamples/scripts/browser/browser-routines/permission-denied-verify-routine.json
  - scripts/quality/run-shell-scenarios.ps1
  - scripts/quality/verification-cadence.json
  - scripts/policy/script-invocation-declarations.json
  - CLAUDE.md
