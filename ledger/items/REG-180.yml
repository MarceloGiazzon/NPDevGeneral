id: REG-180
title: >-
  RuntimeControllerAllowlistConfig's ControlPanel-endpoint enforcement only activates on Spring's
  reserved "default" profile, which no real launcher ever uses -- a dormant landmine, not currently
  exploitable via any documented launch path
type: GAP
severity: LOW
status: DONE
opened: 2026-08-15
closed: 2026-08-20
verification: UNIT_TESTED
source: >-
  Found incidentally while investigating a reported com.finalexec.controlpanel 404 (see REG-179's
  own source note -- that 404 did not reproduce; this is a different thing found along the way
  while ruling out "is the allowlist stripping these controllers" as the cause).
surface: runtimehost/controller-allowlist
files:
  - NPDevRuntimeHost/runtimehost-core/src/main/java/com/finalexec/config/RuntimeControllerAllowlistConfig.java
  - NPDevRuntimeHost/src/main/resources/npdev/runtime-supported-controllers.json
  - NPDevRuntimeHost/src/main/resources/application-default.properties
detail: |
  `RuntimeControllerAllowlistConfig` would strip every `com.finalexec.controlpanel.*` controller --
  none of them appear in `allowedControllers`/`deferredControllers` in
  `runtime-supported-controllers.json`. Its enforcement bean is gated
  `@ConditionalOnProperty(havingValue="true")` on `npdev.runtime.supported-surface-enforced`, which
  is only set `true` in `application-default.properties`. Per that file's own R7 Stage B comment,
  Spring's reserved `default` profile (and this properties file) only activates on a FULLY
  UN-PROFILED boot. Every real launcher checked (`Run-FinalApp.ps1`, `Build-NpdevApp.ps1`, sample
  apps' own `run-sample-app.ps1`) passes an explicit `--spring.profiles.active=dev,...`, so
  `application-default.properties` never loads and the allowlist postprocessor bean is never
  created on any real, documented boot path today.

  Confirmed live: booted `superuser-admin-console` with its normal `dev,trial` profile and hit
  `com.finalexec.controlpanel.*` endpoints with DEBUG-level Spring MVC routing logs on -- the
  routes registered and were reached normally, consistent with the enforcement bean never having
  activated.

  This is a real, currently-DORMANT landmine, not a live bug: if anyone ever boots an app
  un-profiled, or if a future change ports the "supported surface enforced" flag onto an explicit
  profile (dev/trial/prod) rather than the reserved default one, every ControlPanel endpoint would
  silently start 404ing with no error anywhere pointing at the cause -- exactly the "a suite that
  silently skips its most valuable [thing] is exactly how a gate stops running without anyone
  noticing" pattern this repo's own CLAUDE.md warns about elsewhere (re: packaged-proof tests).

  Likely fix, not designed further here: either (a) explicitly add `com.finalexec.controlpanel.*`
  to `allowedControllers` in `runtime-supported-controllers.json` so it's correct regardless of
  which profile the enforcement flag ever gets moved onto, or (b) confirm this enforcement mechanism
  is intentionally profile-scoped (e.g. only meant to matter for some deployment mode that always
  uses the true Spring default profile) and document that explicitly rather than leaving it to be
  rediscovered.

  **2026-08-15: option (a) tried and reverted -- it breaks a real, separately-enforced invariant.**
  `scripts/quality/run-runtime-surface-evidence.ps1` fails the RuntimeHost gate for any
  `allowedControllers` entry whose source file is not under `com/finalexec/api` (CLAUDE.md: "A new
  supported controller belongs in `com.finalexec.api`... three enforcement points read that
  manifest and only that package satisfies all three"). `com.finalexec.controlpanel.*` controllers
  are NOT under that package, so adding them to `allowedControllers` reproduces immediately in CI
  (`NPDev segmented CI validation`'s "Runtime surface evidence" step, "Runtime surface evidence
  failed: allowlist"). Confirmed live, reverted the same day. Option (a) as originally scoped is
  not actually available without ALSO either moving ControlPanel controllers into
  `com.finalexec.api` (a real package move, its own can of worms -- ControlPanel is SUPERUSER-admin
  surface, not the generic runtime API) or adding a second, `com.finalexec.api`-independent
  allowlist mechanism for non-API packages that also need enforcement-profile-independence. Neither
  attempted here. Option (b) (confirm/document as intentionally profile-scoped) is now the more
  likely real fix, not yet done.

  **2026-08-15, same day: a third option tried and reverted before shipping -- `matchIfMissing=true`
  on the enforcement bean's `@ConditionalOnProperty`.** Proposed by
  `third-person-readiness-2026-08-15/PLAN.md` (T5/C4) on the theory that it would just close the
  dormant un-profiled-boot gap and align with `NpdevObservabilityConfig`'s `@Value(...:true)` default
  for the same property. Traced through `RuntimeSurfaceManifest.allowsController` before merging:
  `npdev.runtime.surface-profile` is set ONLY by `application-default.properties`, so on every REAL
  launch profile (dev/prod/trial -- none of which set it) `allowsController` falls back to the
  manifest's `defaultSurfaceProfile` ('supported-core') and strips every controller not in
  `allowedControllers`, which per this item's own finding above is ALL SIX
  `com.finalexec.controlpanel.*` controllers. So `matchIfMissing=true` does not narrowly close the
  un-profiled gap -- it makes the enforcement bean active on every profile, and since
  `npdev.runtime.surface-profile` is unset everywhere except the one profile file nobody loads, the
  practical effect is identical everywhere: the entire ControlPanel/SUPERUSER admin surface would
  silently 404 on every real boot, not just the dormant one. Never shipped; caught by tracing the
  manifest logic before running the plan's own verification build, not found live. Confirms this
  needs real design (option (b), or a companion allowlist mechanism for non-`com.finalexec.api`
  packages) -- there is no longer-missing default value in either direction that fixes this safely.

  Per `ANALYSIS.md`'s own T5 finding (same plan): this item's severity should be reconsidered now
  that R7 Stage B moved the un-profiled boot from "impossible" to "the shortest command a third party
  might try" (a bare `java -jar ... ` with no `--spring.profiles.active` flag). Re-rating deferred to
  whoever next picks this up with full context -- not changed here alongside an unrelated plan.

  2026-08-20 (fix, option (b) -- owner decision accepted): confirmed the enforcement is INTENTIONALLY
  profile-scoped and documented that in RuntimeControllerAllowlistConfig.java and
  application-default.properties, with the history of both reverted quick-fixes recorded. Pinned by a
  new run-runtime-surface-evidence.ps1 check ("enforcement-scoped-to-default-profile-only") that fails
  the gate if any application*.properties other than application-default.properties sets
  npdev.runtime.supported-surface-enforced=true -- so the landmine cannot silently arm on a real launch
  profile. Severity stays LOW (dormant, not exploitable via any documented path); the re-rating
  question remains open for whoever designs the companion non-API allowlist mechanism.
guard:
  kind: script
  ref: scripts/quality/run-runtime-surface-evidence.ps1
  asserts: >-
    The "enforcement-scoped-to-default-profile-only" check fails the gate if any application*.properties
    other than application-default.properties sets npdev.runtime.supported-surface-enforced=true -- the
    documented intentional scoping that keeps the ControlPanel admin surface from being stripped on a
    real launch profile.
  provenRed: false
  provenRedNote: >-
    Both "quick fixes" were already reproduced as RED and reverted before this item's closure (an
    allowlist add breaks the runtime-surface invariant in CI; matchIfMissing=true was traced to 404 the
    whole admin surface before ever shipping). The scoping guard is a static gate check, so no new
    failing run was captured at fix time -- the RED history is the two reverted attempts above.
