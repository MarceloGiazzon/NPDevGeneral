  asserts: >-
    Assembled sample app's RuntimeHost test-result counts stay 4/1 (api/controlpanel) with zero
    failures through Stages 2/4/5, total test-result files 110 -> 119, and the full
    run-runtimehost-gate.ps1 passes end to end
