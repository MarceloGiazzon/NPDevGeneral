id: REG-279
title: >-
  Re-committing an existing aggregate re-runs the root's defaultExpression nextNumber(), so a generated number such as orderNumber changes on every commit
type: BUG
severity: LOW
status: DONE
opened: 2026-10-21
closed: 2026-10-22
source: >-
  Side observation from the REG-277 probe fixture (WidgetOrder in dsl-conformance-max): ORD-2026-0016 became ORD-2026-0017 for the same order after a second commit.
surface: NPDevRuntimeHost/runtimehost-core/src/main/java/com/finalexec/npdev/service/AggregateRuntime.java (commitInternal) and the default-expression allocation for the root
detail: |
  A defaultExpression is meant to fill a field when a row is CREATED. commitInternal applies the root's defaults on every commit, including an update of an existing root, and nextNumber() allocates a fresh counter value each time, so the identifier a customer was given changes silently and the counter burns a number per edit.
resolution: >-
  Apply the root's defaultExpression fields only when the root id is new (the persisted row does not exist yet); keep the stored value on a re-commit. Add a probe that commits twice and asserts orderNumber is unchanged.
note: >-
  Fixed in ConfiguredConceptGatewaySemanticPolicy.applyDefaultsAndDerivedValues: a blank field with a defaultExpression keeps the stored value on update and the expression is not evaluated. Unit test defaultExpressionIsKeptOnUpdateNotRecomputed; probe field-default-expression-kept-on-recommit (85-lifecycle probes 19/19).
  2026-10-28 (QUAL-61): the guard used to cite defaultExpressionIsKeptOnUpdateNotRecomputed, a kernel unit test on a plain
  concept with a `$user.id` default -- not the aggregate-root nextNumber() path the item is about, and the item asked
  for a probe that commits twice. That probe exists and is now the guard. It passed in a local behaviour-probe run on
  2026-10-27 (scripts/reports/out, gitignored); not re-run this session. Not proven red against the pre-fix code, so
  provenRed stays false. The unit test remains a valid but narrower check of the same rule.
  2026-10-28 (QUAL-61), supersedes "not re-run this session" above: the guard probe field-default-expression-kept-on-recommit
  PASSED in a fresh full run of `run-behavior-probes.ps1 -StorageVariant h2local` (138/138 passed, 3 skipped, 0 known
  failures; the skips are the two live1-* probes and the restart probe, which need other variants). That run is on the
  JDBC variant; the 2026-10-27 pass above was the InMemory default.
guard:
  kind: live
  ref: NPDevSamples/dsl-conformance-max/behavior-probes/85-lifecycle-flows-roles.json
  asserts: >-
    behaviour probe field-default-expression-kept-on-recommit: committing the same WidgetOrderAggregate twice returns
    the orderNumber the first commit allocated (nextNumber() on the root is not re-run on the second commit)
  provenRed: false
