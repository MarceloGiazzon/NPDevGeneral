id: RUN-23
title: >-
  Effective-dated values -- concept.temporal + an asOf query param resolve which row of a
  multi-row concept (price lists, tax rates, assignments) is effective on a given date
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-08-19
closed: 2026-08-19
verification: VERIFIED_LIVE
source: >-
  Roadmap Collection 2026-08-18, R5.8 -- "Price lists, tax rates, assignments -- the survey's one
  true differentiator versus CRUD generators, and precisely the schema-shape change that becomes a
  production-data migration after 1.0. Decide the model shape (validFrom/validTo + as-of resolution)
  and prove it thin: one flagged concept, as-of read parameter, on one sample. Full UI/editing depth
  can trail; the shape cannot." Explicitly a DESIGN TRACK (CLAUDE.md): a bounded design phase
  producing a concrete decision record, not a speculative essay, followed by the thin implementation
  slice in the same session. Blocked-by: none.
surface: dsl/schema, dsl/compiled-model, dsl/validation, generator/emitters, generator/templates,
  samples/dsl-conformance-max, samples/temporal-pricing-r58, scripts/quality/dsl_coverage
