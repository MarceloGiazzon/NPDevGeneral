id: RUN-21
title: >-
  Audit trail gains a real field-level before/after diff on create/update/soft-delete/restore, and
  the inert `queries[].auditPolicy`/`procedures[].auditPolicy` knob is retired by codemod
type: GAP
severity: HIGH
status: DONE
opened: 2026-08-19
closed: 2026-08-19
verification: VERIFIED_LIVE
source: >-
  Roadmap Collection 2026-08-18, R5.1 -- "'Who changed what, when' is a hard ERP requirement -- and
  the pieces already exist unconsumed (AuditLogStore port, audit-inproc/audit-postgres adapters).
  Record create/update/delete with actor, timestamp, and before/after field diff in the gateway write
  path; emit a generated history endpoint + panel. The schema-declared auditPolicy knob is consumed
  by nothing -- enforce it or remove it by codemod so no inert knob ships in 1.0."
surface: kernel/gateway-persistence-path, dsl/schema, dsl/compiled-model, generator/templates,
  samples/corpus-migration, cli/migration-codemod
