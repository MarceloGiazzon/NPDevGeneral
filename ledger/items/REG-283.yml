id: REG-283
title: >-
  Invariant uniqueness/conflict/scope checks answer "no duplicate, no conflict, not found" when no lookup is wired -- the flow engine's invariant engine wires none, and the CRUD factory drops the compound-unique lookup
type: BUG
severity: HIGH
status: DONE
opened: 2026-10-23
closed: 2026-10-23
source: >-
  REG-282 (X0-11 audit of the runtime-support expression engine), 2026-10-23.
surface: NPDevKernel/adapters/runtime-support (CelInvariantEngine, ReloadableInvariantEngine); NPDevRuntimeHost NpdevCapabilityBindingConfig (invariantEngine + runtimeInvariantEngineFactory beans); NPDevKernel/kernel ports/RuntimeInvariantEngineFactory
detail: |
  CelInvariantEngine's NO_UNIQUE_CHECKER / NO_COMPOUND_UNIQUE_CHECKER / NO_CONFLICT_CHECKER / NO_SCOPE_CHECKER
  all return false. Each is a default ANSWER, not an error:
    - unique / compound unique  -> "no duplicate"        -> the invariant passes
    - !conflicts(...)           -> "no conflict"         -> passes
    - scope.exists(...)         -> "not found"           -> fails, with a message blaming the data
    - !scope.exists(...)        -> "not found"           -> passes
  Where the defaults are live in a generated app:
    1. The `invariantEngine` bean (ReloadableInvariantEngine) is built with CelInvariantEngine.fromCompiledModel(model)
       -- no checkers at all. KernelRunner / InvariantCheckStep (flow checkInvariants) use this bean, so a flow step
       that names a unique, conflict or scope invariant gets one of the answers above without anything being looked up.
    2. The `runtimeInvariantEngineFactory` bean overrides only the 2- and 3-argument create(...). The 4-argument
       create(..., CompoundUniqueValueLookup) that GeneratedCrudRuntimeSupport.validateEntityDetailed calls falls to the
       port's default, which DISCARDS the compound lookup ("Defaults to no compound checking (always 'not a duplicate')").
       So the generated service's existsUniqueCompoundInConceptStore is built and never called. A composite UNIQUE
       index still backs most engines (SchemaRealizationEmitter, LIFT-UNIQUE-P2), so the usual outcome is a raw
       constraint error instead of the 409 unique_integrity_failed a single-field unique gets -- but for a softDelete
       concept on H2/MySQL the emitter deliberately creates NO unique index and documents existsUnique as the SOLE
       enforcement (StorageCapability.PARTIAL_UNIQUE_INDEX), so there a compound unique invariant is not enforced at all.
  No corpus model declares a compound unique invariant (dsl-conformance-max has only single-field ones), which is why
  no probe has seen it.
  Also in the same class: evaluate(String entityName, Object payload) returns no violations for an unknown entity,
  while the request-shaped overload returns INVARIANT_REF_UNKNOWN for the same input.
guard:
  kind: test
  ref: NPDevKernel/adapters/runtime-support/src/test/java/com/npdev/runtime/support/CelInvariantEngineUncheckableLookupTest.java#uniqueRuleWithNoLookupIsUncheckableNotAPass
  asserts: >-
    A CelInvariantEngine with no unique lookup reports unique(email) as INVARIANT_UNCHECKABLE (missingLookup=unique)
    instead of passing it; the same for conflict and scope in the sibling tests. Flow side:
    ReloadableInvariantEngineTenantLookupTest (tenant from state, refused without one); CRUD compound side:
    NpdevCapabilityBindingConfigInvariantLookupsTest.crudFactoryBeanRefusesADuplicateCompoundPair.
  provenRed: true
resolution: >-
  Done when (a) the RuntimeHost factory overrides the 4-argument create and passes the compound lookup through
  (a test proves a duplicate compound pair is refused by validateEntityDetailed through the real bean), (b) a
  CelInvariantEngine built without a lookup reports a unique/conflict/scope rule it is asked to evaluate as an
  uncheckable violation (a distinct code, naming the missing lookup) instead of answering, with a must-error test,
  and either the flow engine's invariantEngine bean is given real lookups or that violation is what a flow sees,
  (c) evaluate(entityName, payload) agrees with the request overload on an unknown entity, and X0-11 / X0-13 in
  scripts/quality/x0-evaluator-registry.json move to FIXED with their testMarkers.
note: >-
  2026-10-23: filed by the REG-282 audit. Not fixed in the same commit: (b) changes what a flow that names a
  unique invariant does today (passes silently -> fails loudly), which needs a look at which shipped flows do that.
  2026-10-23: (b) is NOT a "fail loudly" change after all. Six tracked models have a flow whose invariant check names
  the unique invariant EmailUnique (NPDevSamples/simple-user-registry, NPDevSamples/user-minimal,
  NPDevGenerator/test-models/user-minimal, NPDevContract/tests/golden/phase0 and the two official-samples copies of
  simple-user-registry). Through the lookup-less invariantEngine bean that check passes without looking anything up today;
  making it an uncheckable violation would fail every one of those flows. The fix is real lookups for the flow
  engine's bean (ConceptStore.existsUnique / the scope and conflict lookups the CRUD path already has), which needs
  a tenant for the lookup: InvariantEvaluationRequest carries state but UniqueValueChecker does not receive it, so
  the tenant must come from the request state or an ambient execution context -- decide that before coding, a
  wrong-tenant uniqueness lookup is a cross-tenant existence oracle.
  2026-10-23: DONE. Owner decision: the tenant for a flow lookup is the flow state's tenantId (seeded by KernelRunner
  from the caller's ExecutionContext), refused when absent -- never an ambient context. (a) the RuntimeHost
  runtimeInvariantEngineFactory bean overrides the 4-argument create and passes the compound lookup
  (NpdevCapabilityBindingConfigInvariantLookupsTest.crudFactoryBeanRefusesADuplicateCompoundPair, through
  GeneratedCrudRuntimeSupport.validateEntityDetailed). (b) CelInvariantEngine's no-lookup defaults throw
  LookupUnavailableException, reported as INVARIANT_UNCHECKABLE with missingLookup (CelInvariantEngineUncheckableLookupTest);
  ReloadableInvariantEngine binds Lookups.fromConceptStore per request to state.tenantId
  (ReloadableInvariantEngineTenantLookupTest), wired in the RuntimeHost invariantEngine bean and in the CLI's
  CliRuntimeFactory (its EmailUnique flows went INVARIANT_UNCHECKABLE until it was). Flows have no conflict lookup:
  a conflicts()/overlapsProvider() rule in a flow check is INVARIANT_UNCHECKABLE (no tracked flow names one).
  (c) evaluate(entityName, payload) reports an unknown entity. X0-11 / X0-13 FIXED. The CRUD path's own scope and
  conflict lookups are not tenant-scoped -- filed as REG-287.
  2026-10-28 (QUAL-61): red-run evidence for the cited guard. With CelInvariantEngine.Lookups.unavailable()'s unique
  lookup changed to answer "no duplicate" instead of throwing LookupUnavailableException,
  CelInvariantEngineUncheckableLookupTest#uniqueRuleWithNoLookupIsUncheckableNotAPass FAILED (the only other failure in
  that run was REG-286's, below); restored, green. Only the unique branch was mutated: the conflict and scope siblings,
  ReloadableInvariantEngineTenantLookupTest and NpdevCapabilityBindingConfigInvariantLookupsTest are named in the
  guard's asserts but were not mutation-checked, and no test was found for clause (c), evaluate(entityName, payload)
  agreeing with the request overload on an unknown entity.
