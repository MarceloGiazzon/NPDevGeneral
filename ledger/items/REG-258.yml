id: REG-258
title: >-
  Soft-deleted rows cannot be restored: POST /{id}/restore answers 404 right after the delete
type: BUG
severity: MEDIUM
status: DONE
opened: 2026-10-20
closed: 2026-10-21
verification: VERIFIED_LIVE
source: >-
  ENF-1 behaviour probe cf-softdelete-restore-brings-row-back (NPDevSamples/dsl-conformance-max/behavior-probes/10-concept-field.json), found while checking
  that the booted dsl-conformance-max app OBEYS what the DSL schema accepts.
surface: generated-app runtime (dsl-conformance-max)
detail: |
  The generated restore action (POST /api/widget_suppliers/{id}/restore) must make a soft-deleted row
  visible again. The runtime answers 404 for a row that was just deleted (204): 'softDelete' is
  accepted as reversible but restore cannot find the deleted row. Evidence: POST supplier -> 201;
  DELETE -> 204; POST .../restore -> 404 (empty body); expected 204 and GET by id -> 200.
resolution: >-
  Fix the runtime, then remove "knownFailure": "REG-258" from probe cf-softdelete-restore-brings-row-back; the runner turns that probe red
  the moment it passes with the marker still set, so the marker cannot outlive the bug.
