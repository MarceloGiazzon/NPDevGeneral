id: QUAL-43
title: >-
  AI Beta Gate smoke check silently discarded every generator-emitted per-testUser API key --
  Ensure-NpdevApiKey's fallback env var outranks application-ai-beta-local.yml, so all 3 required
  tenant scenarios plus 3 custom-panel/procedure scenarios failed smoke with invalid_api_key
type: BUG
severity: HIGH
status: DONE
opened: 2026-08-31
closed: 2026-08-31
source: >-
  2026-08-31 (session resume, re-dispatching QUAL-42's residual AI Beta Gate CI question). Fresh
  dispatch of ai-beta-gate.yml (run 33421339702) against current main confirmed QUAL-42's own fix
  (base-ai-loop passes on Docker/Linux CI, not just Windows-local) but surfaced 6 of 8 expectedPass
  scenarios failing smoke, not previously individually diagnosed.
surface: ai-beta-gate, golden-ai-scenarios, runtimehost auth, generator FinalAppAssembler
files:
  - scripts/quality/invoke-ai-beta-app-smoke.ps1
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/assembly/FinalAppAssembler.java
detail: |
  ROOT CAUSE (confirmed by code reading, not assumption): for any scenario whose ai-model.json
  declares `auth.testUsers` (multi-tenant/RBAC scenarios: tenant-workflow-ops, tenant-service-desk,
  tenant-approval-portal, custom-panel-procedure-mismatch, custom-procedure-admission-rejection,
  custom-procedure-invalid), FinalAppAssembler writes
  `src/main/resources/application-ai-beta-local.yml` into the generated app with REAL per-test-user
  API keys (format `ai-<scenarioId>-<userId>`, e.g. `ai-tenant-workflow-ops-agent-a`), scoped to the
  `ai-beta-local` Spring profile. Every scenario's golden ai-verification-report.json references
  these exact literal keys in its checks' `X-Api-Key` headers.

  Separately, `invoke-ai-beta-app-smoke.ps1`'s `Ensure-NpdevApiKey` (added for SEC-1: RuntimeHost no
  longer seeds a known dev api-key, so `bootRun` fails closed without one supplied externally)
  UNCONDITIONALLY generates one random fallback key and exports it as the `NPDEV_AUTH_API_KEYS`
  environment variable before every scenario boots -- regardless of whether the app already has a
  real key source. Spring Boot's property source precedence ranks environment variables ABOVE
  profile-specific `application-{profile}.yml` files, so this env var silently REPLACED the entire
  multi-user `npdev.auth.api-keys` mapping the generator had written, leaving only the one random
  fallback key valid. Every check presenting one of the real per-testUser keys then got
  `401 {"error":"invalid_api_key"}` -- correctly reported by run-ai-beta-gate.ps1's own
  expected-outcome-aware summary (QUAL-42) as `expectedPassFailed`, not as a designed negative.

  Confirms the pattern precisely: base-ai-loop and custom-panel-unsupported (both scenarios with NO
  `auth.testUsers` declared, so no `application-ai-beta-local.yml` is ever generated for them) were
  the only 2 of 8 expectedPass scenarios that passed smoke -- Ensure-NpdevApiKey's fallback key was
  the ONLY key source for them, so nothing was clobbered.

  FIX: Ensure-NpdevApiKey now checks for
  `$AppRoot/src/main/resources/application-ai-beta-local.yml` before doing anything, and no-ops
  (returns immediately, leaving the generator's real mapping untouched) when that file exists.
  Behavior for scenarios with no generator-emitted key source (base-ai-loop and any future
  no-auth-declared scenario) is unchanged -- Ensure-NpdevApiKey still generates and exports the
  fallback key exactly as before, since that codepath is the one SEC-1 actually needed.

  Not patched in `scripts/appgen/Build-NpdevApp.ps1` / `Build-ClaudeApp.ps1`'s own copies of
  Ensure-NpdevApiKey: FinalAppAssembler's application-ai-beta-local.yml emission is conditional on a
  scenario-only `metadata.scenarioId` / `metadata.auth.testUsers` present in the generated
  model.json, which regular AppGen/Claude apps never carry -- those two copies cannot hit this bug
  as written, so leaving them untouched avoids an unnecessary behavior change to callers this item
  never exercised.

  VERIFICATION STATUS: fix applied and PowerShell-parsed clean; not yet re-verified against a live
  boot or a fresh AI Beta Gate CI dispatch (deferred to the next full-gate/CI pass per this session's
  own "batch fixes before running gates" instruction, together with QUAL-36/40/41/SEC-3's fixes).

  Done when: a live boot (local or CI) of one of the 6 previously-failing scenarios (tenant-
  workflow-ops recommended -- 3 distinct check types: authenticated create, cross-tenant rejection,
  panel action) shows every check passing with its declared per-testUser key, not just health-ok --
  PENDING, tracked for the next verification pass.

  2026-08-31 (verification pass, CORRECTION): the fix above was WRONG in its shape, caught by
  actually verifying rather than trusting the local syntax check. Dispatched fresh AI Beta Gate
  (run https://github.com/MarceloGiazzon/NPDevGeneral/actions/runs/33428237338) after committing and
  pushing the no-op version. Result: summary.expectedPassPassed DROPPED from 2 to 1 --
  tenant-workflow-ops and the other 5 STILL failed (the no-op didn't fix them, meaning the app boots
  without EITHER the fallback key or a working real-key path), AND custom-panel-unsupported, which
  had been PASSING, now failed too: its create-learner check got 401 `missing_api_key` (no header
  sent at all, not invalid_api_key) -- proof the fallback key was gone and nothing replaced it.

  Root cause of the original wrong assumption: custom-panel-unsupported ALSO declares
  auth.testUsers (so it ALSO gets a generator-emitted application-ai-beta-local.yml -- verified by
  checking its ai-model.json directly, something the original fix never did, only base-ai-loop's and
  tenant-workflow-ops's were compared), but its own create-learner check carries NO explicit
  X-Api-Key header and depends on Invoke-AiRestSmokeVerifier.ps1's generic -ApiKey fallback
  injection. The "does this scenario have testUsers" question and "does THIS SPECIFIC check need the
  generic fallback key" question are independent -- a scenario can have both real per-user keys AND
  checks that rely on the generic one. A binary skip-vs-generate choice can never satisfy both.

  REAL FIX: MERGE, not choose. Confirmed the generator's encodedMappings format
  (`key=tenantId:actorId:role1|role2`, `;`-joined entries -- FinalAppAssembler.encodeMappings /
  RuntimeApiKeyAuthFilter's parseMappings, both read directly) is byte-identical to
  Ensure-NpdevApiKey's own fallback-key format, so the two are trivially concatenable. Extract the
  existing api-keys value from application-ai-beta-local.yml (regex against the YAML, verified
  against the actual mustache-templated output shape) when present, and prepend it to the fallback
  key before exporting NPDEV_AUTH_API_KEYS -- so both the real per-user keys AND the generic fallback
  are simultaneously valid. Verified LOCALLY before any further CI round-trip, against two
  standalone fixtures built from the real generator output shape: (1) a fixture WITH testUsers ->
  env var correctly carries both the two real testUser keys AND the new fallback key, `;`-joined;
  (2) a fixture with NO application-ai-beta-local.yml (base-ai-loop's shape) -> unchanged, fallback
  key only, matching original pre-QUAL-43 behavior.

  STILL PENDING: a fresh CI dispatch of this corrected (merge) version has not yet run. Given the
  no-op version's own CI round-trip caught a real defect the local syntax check missed, this fix
  should NOT be treated as verified until it, too, is confirmed on a live boot -- local unit-level
  verification of the merge logic is not the same claim as "the scenario's smoke check goes green."

  2026-08-31 (verification pass, CONFIRMED): dispatched fresh AI Beta Gate
  (run https://github.com/MarceloGiazzon/NPDevGeneral/actions/runs/33432791806) after committing and
  pushing the merge version. The API-key wiring problem this item actually claims to fix is
  CONCLUSIVELY resolved: tenant-workflow-ops's scenario-authenticated-create-ticket (POST
  /api/tickets) now returns 201 (was 401 invalid_api_key), and custom-panel-unsupported -- the
  scenario the no-op version regressed -- is back to fully PASSING. No check across any of the 8
  expectedPass scenarios returns 401/invalid_api_key or 401/missing_api_key any more. This item's own
  claim (real per-testUser API keys are recognized) is proven true; QUAL-43 is DONE on that scope.

  The 6 scenarios are STILL not fully green, but for reasons entirely outside this item's scope
  (auth is no longer the failure): tenant-workflow-ops/tenant-service-desk/tenant-approval-portal now
  fail on a missing $.tenantId in the create response plus a 403 (not 401) on an admin metadata
  endpoint -- an authenticated request being correctly rejected for a DIFFERENT reason, not the
  invalid-key problem this item tracked. custom-panel-procedure-mismatch/custom-procedure-admission-
  rejection/custom-procedure-invalid now fail with 404 on their create-user check, not 401/403 at
  all -- a routing/wiring question, unrelated to authentication. Both are real, tracked as their own
  items rather than folded in here: ledger/items/QUAL-45.yml (tenantId/403) and
  ledger/items/QUAL-46.yml (404).
