id: REG-244
title: >-
  Phase 4A research spike: a safety design for provisioning a brand-new CONCEPT (table + CRUD +
  UI manifest) live via /model-reload, with no runtime DDL code path today
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-09-22
closed: 2026-09-24
guard:
  kind: manual
  ref: >-
    ledger/items/REG-245.yml, ledger/items/REG-246.yml, ledger/items/REG-247.yml
  asserts: >-
    This item has no deliverable of its own -- it is a research-spike design record. Its DONE claim
