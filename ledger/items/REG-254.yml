id: REG-254
title: >-
  field.maxLength is not enforced: an over-long value is accepted and stored in full
type: BUG
severity: HIGH
status: OPEN
opened: 2026-10-20
closed: null
source: >-
  ENF-1 behaviour probe cf-field-max-length-enforced (NPDevSamples/dsl-conformance-max/behavior-probes/10-concept-field.json), found while checking
  that the booted dsl-conformance-max app OBEYS what the DSL schema accepts.
surface: generated-app runtime (dsl-conformance-max)
detail: |
  REAL DEFECT: ApprovalRequest.title declares maxLength 200 (pack approvals) but a 201-character title
  is accepted and stored in full. Evidence: POST /api/concepts/approvals_approval_requests {title: 'x'
  * 201, status: 'PENDING'} -> 200 with the full 201-char title; expected a 4xx validation error. A
  200-character title is the accepted control.
resolution: >-
  Fix the runtime, then remove "knownFailure": "REG-254" from probe cf-field-max-length-enforced; the runner turns that probe red
  the moment it passes with the marker still set, so the marker cannot outlive the bug.
