id: REG-228
title: >-
  App/wmsoffice-keys/ (the directory npdev.auth.jwt.private-key-path/public-key-path resolve into
  for wmsoffice, via NPDEV_WMSOFFICE_KEYS_DIR default ./wmsoffice-keys) is not one of the three
  regeneration-spared directories (data/logs/secrets) -- every regeneration wipes the JWT keypair,
  so the very next boot fails outright with NoSuchFileException on jwt-private-pkcs8.pem, for every
  JWT-mode app, not just wmsoffice.
type: BUG
severity: HIGH
status: DONE
opened: 2026-09-20
source: >-
  Hit live while regenerating wmsoffice for WMS-9 C6 (wiring a procedure-bound dataSource into
  CrossDockingConsolePanel): ran Build-NpdevApp.ps1 -AppFolder .../WmsOffice -Upgrade (regeneration
  only, no keypair touched intentionally), rebuilt the jar successfully, then Start-App.ps1 reported
  "Started PID ..." but the JVM crashed immediately after -- app-*.log showed
  `BeanCreationException: Error creating bean with name 'changePasswordController' ...
  Caused by: java.nio.file.NoSuchFileException: .\wmsoffice-keys\jwt-private-pkcs8.pem`. This is the
  SAME failure REG-220's own follow-up note (2026-09-19, REG-217 session) already documented and
  explicitly left unfixed: "App/wmsoffice-keys/ is a separate directory from secrets/, not one of
  the three regeneration-spared directories ... Worked around by generating a fresh local dev-only
  RSA keypair directly (openssl genpkey/rsa -pubout into App/wmsoffice-keys/), not fixed at the
  platform level ... flagging for whoever next owns the rebuild-wrapper / spared-directories
  contract." This item exists because that flag had no ledger id of its own and the same failure
  was about to be hit a third time with nothing tracking it. Applied the identical documented
  workaround here (openssl genpkey RSA 2048 + rsa -pubout into App/wmsoffice-keys/) to unblock this
  session's own verification; every prior JWT session on that app is now invalidated by the new
  keypair, same tradeoff REG-220's workaround already accepted.
surface: >-
  NPDevRuntimeHost/src/main/resources/application-wmsoffice.yml (public-key-path/private-key-path,
  `${NPDEV_WMSOFFICE_KEYS_DIR:./wmsoffice-keys}/jwt-{public,private-pkcs8}.pem`) -- likely mirrored
  per-app for every other JWT-mode app's own application-<app>.yml, not wmsoffice-specific. The
  spared-directory list itself lives in THREE seams per CLAUDE.md: Build-NpdevApp.ps1 /
  Build-ClaudeApp.ps1's own $SparedInsideApp, and FinalAppAssembler.PRESERVED_APP_DIRECTORIES
  (Java layer, runs LAST, wins if the lists disagree).
detail: |
  FIXED 2026-09-20: chose candidate (2), auto-provisioning, over candidate (1) (adding the key
  directory to the three-seam regeneration-spared list) for the reason already on record here --
  the key directory's name is app-configurable (NPDEV_WMSOFFICE_KEYS_DIR-style), not fixed across
  apps, and auto-provisioning also covers a FIRST-ever generation, not just regeneration of an app
  that once had a keypair.

  Implementation: new `com.finalexec.auth.JwtKeyPairEnvironmentPostProcessor`
  (NPDevRuntimeHost/runtimehost-core/src/main/java/com/finalexec/auth/), registered in that
  module's own META-INF/spring.factories as a second
  `org.springframework.boot.env.EnvironmentPostProcessor` alongside the existing
  H2LocalBootLockEnvironmentPostProcessor (same precedent, same reasoning: this Spring Boot SPI
  runs once the Environment is fully resolved -- profile YAML like application-wmsoffice.yml
  already merged in -- but strictly BEFORE any bean, including LoginController/
  ChangePasswordController, is created, which is the one seam early enough to provision the files
  before anything tries to read them). When npdev.auth.mode=jwt and BOTH the resolved
  public-key-path and private-key-path point at non-classpath files that do not yet exist, it
  generates a throwaway RSA-2048 keypair (PKCS8 private / X.509 public, matching exactly what
  JwtSigner.loadPrivateKey and JwtBearerAuthFilter.loadPublicKey each already parse) and writes
  both PEM files, logging a WARNING that any token minted under a previous keypair is now invalid.
  A blank path (verify-only deployment, REG-9) or a classpath: path is left untouched; one key
  present and the other missing is treated as a real misconfiguration and left alone rather than
  silently replaced.

  Regression coverage: JwtKeyPairEnvironmentPostProcessorTest (6 tests) -- apikey-mode no-op,
  blank-path no-op, classpath-path no-op, half-present-pair no-op, a genuine sign-with-private/
  verify-with-public round trip proving the generated pair is real and matched (not just two
  independently well-formed files), and a second-run idempotency check (an already-provisioned
  pair is never regenerated). All 6 pass; full runtimehost-core `test` task run both before and
  after this change to confirm no regression (196 tests, same 4 pre-existing OAuthGoogleControllerTest
  failures either way -- filed separately as REG-230, unrelated to this fix, confirmed via
  git-stash isolation).

  LIVE-VERIFIED 2026-09-20 against wmsoffice: deleted App/wmsoffice-keys/ entirely (exact REG-228
  repro), restaged runtimehost-libs (scripts/appgen/Rebuild-And-Restage.ps1 -SkipGeneratorRuntime),
  rebuilt and booted -- app reached `App is UP at http://localhost:8100/actuator/health` instead of
  crashing with BeanCreationException/NoSuchFileException. Confirmed a genuine fresh keypair was
  written (App/wmsoffice-keys/jwt-{public,private-pkcs8}.pem, both timestamped from this rebuild).
  Confirmed BOTH halves are actually usable by the real app, not just present: an unauthenticated
  request with a bogus Bearer token returned a clean 401 {"error":"missing_bearer_token"} /
  signature-rejection (not a 500 public-key-parse crash), proving JwtBearerAuthFilter successfully
  loaded the auto-generated public key; and the app booted at all (LoginController/
  ChangePasswordController constructors eagerly parse the private key via
  JwtSigner.loadPrivateKey, which would have thrown BeanCreationException on a malformed key).

  BLAST RADIUS (resolved): every JWT-mode app (npdev.auth.mode=jwt) now self-heals a missing
  signing keypair on boot instead of crashing outright -- covers both a wiped regeneration and a
  first-ever generation. Previously blocked two different sessions (REG-217's, 2026-09-19, and the
  one that filed this item, 2026-09-20) doing otherwise-unrelated work.
guard:
  kind: local
  ref: >-
    Unit: NPDevRuntimeHost\runtimehost-core\gradlew.bat --project-dir NPDevRuntimeHost\runtimehost-core
    --no-daemon --console=plain test --tests "com.finalexec.auth.JwtKeyPairEnvironmentPostProcessorTest".
    Live: delete App/wmsoffice-keys/ entirely, rebuild via
    scripts/appgen/Rebuild-And-Restage.ps1 -AppFolder <WmsOffice model dir> -SkipGeneratorRuntime,
    boot, then GET /actuator/health and send a bogus Bearer token to any /api/* route.
  asserts: >-
    Originally reproduced live 2026-09-20 against wmsoffice at
    D:\WorkSpace\NPDev\Build\generated-finalapps\wmsoffice -- app-20260920T143734Z.log showed the
    BeanCreationException/NoSuchFileException chain for ChangePasswordController's constructor
    reading .\wmsoffice-keys\jwt-private-pkcs8.pem (matches REG-220's own prior repro one day
    earlier). Fixed and reverified the SAME day: unit test suite green (6/6, including a genuine
    sign-with-private/verify-with-public round trip); live rebuild after fully deleting
    wmsoffice-keys/ reached `App is UP` instead of crashing, a fresh matched keypair was written,
    and a bogus-Bearer-token request returned a clean 401 (proving the public key parses) rather
    than a 500 (which a malformed auto-generated key would have caused).
  provenRed: false
  provenGreen: true
