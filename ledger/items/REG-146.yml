id: REG-146
title: >-
  Workbench i18n string map key order is nondeterministic, breaking check-deterministic-generation.ps1 for dsl-conformance-max
type: BUG
severity: MEDIUM
status: DONE
opened: 2026-08-13
closed: 2026-08-15
verification: VERIFIED_LIVE
resolution: >-
  Three independent `Map.copyOf(x)` call sites, all discarding the LinkedHashMap insertion order
  JDK's `ImmutableCollections` deliberately randomizes per JVM run (JEP 269 hash-flood mitigation):
  `PlatformStrings.DEFAULTS`, `SettingsAst.getStrings()` (both found in the original investigation),
  plus a THIRD site found while re-verifying the fix -- `WorkbenchActionApplyToAst.map` (a workbench
  action's `applyTo.map` field, e.g. `{"sku": "$resultado.id", "quantity": "1"}` in
  dsl-conformance-max's model) -- still reproduced the exact same class of failure
  (compiled-model.json content-differs between two back-to-back generations) even after the first two
  sites were fixed, because `ModelCompiler`'s `sortByKey(...)` normalization at line ~1604 does not
  apply to this field. All three fixed identically: swap `Map.copyOf(x)` for
  `Collections.unmodifiableMap(new LinkedHashMap<>(x))` (or, where a private field was already a
  defensive LinkedHashMap copy, just `Collections.unmodifiableMap(field)`) -- preserves real
  insertion order while staying just as immutable. The other ~60 `Map.copyOf`/`Set.copyOf` sites
  found by the same grep remain untriaged, tracked separately as REG-175 (this fix's existence is the
  template for closing any of those confirmed to be similarly affected).

  Re-verified live 2026-08-15: `check-deterministic-generation.ps1 -SampleId dsl-conformance-max`
  reproduced RED on the pre-fix tree, then GREEN 3 consecutive times after all three sites were
  fixed (SHA-256 of compiled-model.json identical across back-to-back generations each time).
source: >-
  Found incidentally during MASTER-ROADMAP.md Step 6 (PK-2) verification, while running
  check-deterministic-generation.ps1 -SampleId dsl-conformance-max as an additional regression check
  (this sample carries real pack imports, unlike the default simple-contact-intake sample). Confirmed
  NOT caused by PK-2's own changes: reproduces identically on a clean, unmodified main checkout
  (commit ff2711d6), stash-tested directly -- git stash the PK-2 working tree, rebuild, rerun the
  check, same 8 files flagged, then git stash pop to restore.
surface: generator/workbench-emission
files:
  - NPDevGenerator/generator/src/main/resources/npdev-templates/workbench-page.html.mustache
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/compiled/PlatformStrings.java
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/ast/SettingsAst.java
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/ast/WorkbenchActionApplyToAst.java
detail: |
  check-deterministic-generation.ps1 -SampleId dsl-conformance-max fails reproducibly (not
  intermittently -- reproduced 3 times in a row): src/main/resources/npdev/compiled-model.json,
  src/main/resources/npdev/support/generated-folder.signature.properties, and both
  WidgetOrder*Workbench.html files differ between two back-to-back generations of the identical
  input model.

  Root cause isolated to the Workbench HTML's embedded i18n string JSON blob: the SAME key/value set
  (action.new, action.select, workbench.readOnly, workbench.header, etc.) appears in a DIFFERENT
  order between runs, e.g.:
    run 1: ..., workbench.header, action.new, action.select, workbench.readOnly
    run 2: action.new, action.select, workbench.readOnly, ..., workbench.header
  This is a classic HashMap/HashSet-iteration-order symptom -- something feeding
  workbench-page.html.mustache's i18n block collects keys into an unordered Map/Set instead of a
  LinkedHashMap or a sorted one. Not yet traced to the exact Java collection site (out of scope for
  the session that found this; templates/emitters that build the workbench i18n map were not
  otherwise touched). compiled-model.json's own diff and the generated-folder signature diff are
  downstream symptoms of the same root cause (the signature hashes the whole tree; compiled-model.json
  may embed the same i18n data or a derived ordering).

  Confirmed NOT related to PK-2, R5, or any other change landed this session -- reproduces on
  unmodified main. The default check-deterministic-generation.ps1 sample (simple-contact-intake) does
  NOT exercise this path (no Workbench usage), which is why this has been invisible to every prior T1
  fast-gate run; only -SampleId dsl-conformance-max surfaces it.
guard:
  kind: manual
  ref: "pwsh -NoProfile -File scripts/hygiene/check-deterministic-generation.ps1 -SampleId dsl-conformance-max"
  asserts: two back-to-back generations of dsl-conformance-max produce byte-identical output; currently fails on unmodified main
  provenRed: true
