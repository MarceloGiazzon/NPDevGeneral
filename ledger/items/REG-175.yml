id: REG-175
title: >-
  Map.copyOf/Set.copyOf is used ~60 times across the DSL AST/compiled layers and the generator's
  trusted-action templates to "freeze" a map/set built from a LinkedHashMap -- every one of those
  call sites discards deterministic iteration order the same way PlatformStrings.DEFAULTS and
  SettingsAst.getStrings() did (REG-146), and any of them COULD be a latent second instance
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-08-15
closed: 2026-08-15
verification: UNIT_TESTED
source: >-
  Found while root-causing REG-146 (Workbench i18n key-order nondeterminism). The actual defect was
  two specific `Map.copyOf(...)` call sites (PlatformStrings.DEFAULTS, SettingsAst.getStrings()) --
  JDK's ImmutableCollections implementation deliberately randomizes iteration order for maps/sets
  built via Map.copyOf/Set.copyOf/Map.of/Set.of (a JEP 269 hash-flood mitigation), discarding
  whatever LinkedHashMap insertion order the caller built. `grep -rn "Map\.copyOf\|Set\.copyOf"`
  across NPDevContract/dsl and NPDevGenerator/generator turned up ~60 more call sites with the
  identical shape (`x = x == null ? Map.of() : Map.copyOf(x)`), none audited here.
surface: dsl/determinism
files:
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/ast
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/compiled
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/emitters
detail: |
  `check-deterministic-generation.ps1` reports 0 differing files as of its last measured run
  (2026-08-09, 786 files), so none of these ~60 other sites are CURRENTLY known to produce
  observably different generated output between two back-to-back generations of any tested sample.
  That is weaker evidence than it sounds: REG-146 itself was invisible to the DEFAULT
  check-deterministic-generation.ps1 sample (`simple-contact-intake`, no Workbench usage) and was
  only found because a DIFFERENT sample (`dsl-conformance-max`, real pack imports) happened to
  exercise the one code path where the randomized order became visible in emitted output. A site
  whose map (a) has 2+ entries in some real model AND (b) gets serialized/iterated into
  order-sensitive output (JSON, generated source text, a hash/fingerprint) is a candidate for the
  same defect; a site whose map is always empty/singleton in practice, or whose consumer sorts/
  re-orders before use, is not actually affected regardless of the randomization.

  NOT triaged site-by-site here -- that is real work (~60 sites, each needs its actual downstream
  consumer traced to know if order is observable), and REG-146's own fix (swap the two confirmed
  sites from `Map.copyOf`/an unordered wrapper to `Collections.unmodifiableMap` over the existing
  LinkedHashMap, preserving immutability with zero behavior change for every other caller) is the
  template for fixing any site this triage confirms is really affected.

  Likely fix, not designed further: (a) triage the ~60 sites for whether their map/set is ever
  iterated into order-sensitive output before their process reaches any hashing/serialization step,
  fixing the confirmed ones with the same swap REG-146 used; or (b) a repo-wide policy/checker (a
  new `check-*.py`, mirroring `check-dialect-sites.py`'s "no dialect-bound construct outside one
  package" enforcement) that flags any `Map.copyOf`/`Set.copyOf` call whose argument's static type
  wasn't already `Map.of()`/`Set.of()` (i.e. a genuine "freeze a mutable map" call, not a
  no-op-on-an-already-immutable-value one) as needing an explicit determinism review -- the second
  option is more durable (catches the NEXT one before it ships) but is real new-checker work, not a
  quick sweep.
guard:
  kind: manual
  ref: >-
    for each Map.copyOf/Set.copyOf call site found by `grep -rn "Map\.copyOf\|Set\.copyOf"` across
    NPDevContract/dsl/src/main/java and NPDevGenerator/generator/src/main/java, trace whether its
    result is ever serialized/iterated into order-sensitive generated output, and whether the input
    can legitimately have 2+ entries in a real model
  asserts: >-
    every site whose map/set both (a) can have 2+ real entries and (b) reaches order-sensitive
    output uses an order-preserving immutable wrapper (Collections.unmodifiableMap/-Set), not
    Map.copyOf/Set.copyOf
  provenRed: false
resolution: >-
  **2026-08-15: complete site-by-site audit performed** (3 parallel research passes covering
  NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/ast, .../compiled + .../settings + .../parser +
  .../compiler + .../pack + .../schemaevolution + .../expr, and NPDevGenerator/generator/src/main/
  java) -- 79 call sites total (up from the "~60" first-grep estimate; the extra sites are settings/
  parser/pack/schemaevolution/expr locations the original grep count did not separately tally).

  **The audit found one dominant, load-bearing safety mechanism**: nearly every `metadata`/
  `explainability`/`params`/`data`/`set`/`select` field on a `Compiled*` DSL record is routed
  through `ModelCompiler.sortObjectMap()` (alphabetical) before ever reaching a `Compiled*` record,
  and `CompiledModelCanonicalJson.toObjectMap()` re-sorts via `TreeMap` again before JSON
  serialization -- both silently absorb whatever iteration-order randomization `Map.copyOf` produced,
  making 52 of the 79 sites SAFE regardless of the JEP 269 behavior REG-146 fixed. A further 8 sites
  in the generator are SAFE because their only consumers do keyed `.get()` lookups or explicitly
  sort before emitting. 0 sites were UNCERTAIN after tracing.

  **19 sites were AFFECTED** -- real instances of REG-146's exact defect shape, all sharing the same
  root cause: they bypass both safety nets (a raw `entrySet()`/`Map.copyOf` copy reaching
  serialized/emitted output with no sort anywhere in the chain). Fixed all 19, split across two
  ledger items since 7 of them turned out to be a materially different bug class:

  - **12 sites fixed under this item** (generation-time determinism, REG-175's original scope):
    `AutoPanelSurfaceAst.regions/visibleWhen/bandPickers/uiState` and `SelectorAst.returnMapping`
    (NPDevContract/dsl/.../ast/), `CompiledAutoPanelSurface.regions/visibleWhen/bandPickers/uiState`
    and `RenameResolution.Result.explainedRenames` (NPDevContract/dsl/.../compiled/ and
    .../schemaevolution/), and `AuthoringMergeGate.MergeResult.elementsFromOurs/elementsFromTheirs`
    (NPDevGenerator/.../authoring/). All swapped `Map.copyOf`/`Set.copyOf` for
    `Collections.unmodifiableMap/-Set(new LinkedHashMap/LinkedHashSet<>(x))`, REG-146's own fix
    pattern -- confirmed the full AutoPanelSurfaceAst -> ModelCompiler -> CompiledAutoPanelSurface ->
    CompiledModelCanonicalJson chain preserves order end-to-end after both AST- and Compiled-layer
    sites were fixed (ModelCompiler's own copy step already used order-preserving `LinkedHashMap`
    construction; only the two record constructors' own freezing calls needed the swap).
    `visibleWhen` is not theoretical: `NPDevSamples/dsl-conformance-max/Input/model.json` already
    declares 2 real keys ("lines", "lines.notes") for one surface, so this site produced
    observably different `compiled-model.json` bytes across generations before this fix.
    `regions`/`bandPickers`/`uiState` are mechanism-identical but dormant in the two real corpora
    checked (NPDevSamples, AppGen/apps/_official/WmsOffice) -- only ever authored with 1 entry
    today, so fixed defensively ahead of the first model that adds a 2nd.
  - **7 sites are a DIFFERENT bug class, filed and fixed separately as REG-178**: literal Java
    source TEXT emitted verbatim into every generated FinalApp
    (`TrustedActionSupportTemplates`/`TrustedFlowSupportTemplates`/`TrustedActionKernelRunnerTemplate`),
    where the `Map.copyOf` runs at the GENERATED APP's own runtime, not at generation time -- so the
    observable defect is a live app's REST response field order changing across restarts, not a
    generation-time text diff. See REG-178 for the full writeup; not enumerated further here to keep
    this item's own scope (generation-time determinism) clean.

  **Verification**: `NPDevContract/dsl` (`compileJava` + full `test`) and `NPDevGenerator/generator`
  (`compileJava` + full `test`, 345 tests) both green after all 12 of this item's edits.
  `scripts/hygiene/check-deterministic-generation.ps1` re-run post-fix (2026-08-15). Not captured:
  a live BEFORE/AFTER pair specifically isolating `AutoPanelSurfaceAst.visibleWhen`'s confirmed-real
  nondeterminism (the audit traced it statically with high confidence -- unsorted entrySet iteration
  plus a real 2-entry corpus model -- but did not additionally run dsl-conformance-max generation
  twice pre-fix to capture the differing bytes before applying the fix), so `guard.provenRed` stays
  `false` honestly rather than claiming a RED state that was reasoned about, not reproduced.
