id: REG-354
title: >-
  Code a browser AI writes (a JS page, a Java capability, a conversion hook) is refused outright: there is no safe way yet to accept it, show it, mark where it came from, or remove it in one click
type: FEATURE
severity: MEDIUM
status: PARTIAL
opened: 2026-11-21
source: >-
  Split out of REG-323 by the owner's decision of 2026-11-21 ("follow your suggestions"): the F4 answers that are DATA (fragments, element upserts, themes, hand-made
  HTML/CSS/SVG pages, menu, seeds, config proposals) are done and in the Manager; the part that is CODE is security-sensitive and was always meant to be designed WITH the owner, last.
surface: cli/relay, manager/browserai, security
files:
  - NPDevCli/relay-ingest-policy.json
  - NPDevCli/npdev_relay_pages.py
  - NPDevCli/npdev_relay_files.py
  - NPDevManager/ui/browserai.js
detail: |
  Today relay-ingest-policy.json (phase f4) lists as `quarantine`: capabilities/*, conversion-hooks/*, web/*.js|mjs. Quarantine means the file is NEVER written; the person is told why.
  An html page with <script>/on*=/javascript: and an svg/css with script-like content are quarantined by `markupScan` too. Nothing else exists. What a real acceptance needs (the browser-AI
  relay plan, section 8.1, six steps; each is a design decision for the owner):
  1. a pattern scan of the code (block / warn lists) with the findings shown in words;
  2. for Java: a bytecode inspector that refuses what it cannot prove harmless (the generator already has an untrusted-extension path: UntrustedExtensionEmitter);
  3. a strong acceptance: a ticked box AND a separate button, never the same click as Apply;
  4. provenance: every accepted program is marked `origin: browser-ai` where the app can show it;
  5. one-click removal of an accepted program (nothing deletes files from a chat today);
  6. a SECOND confirmation before a JS page becomes public (no sign-in needed to open it).
  Decide first whether a browser AI should ever add code at all, or only point at a reviewed pack that already has it; if "never", close this as WONTFIX and keep the quarantine as is.
  OWNER DECISION 2026-11-21: "we have to have a parameter to determine that. Default A; on my environment C (accept all)." BUILT 2026-11-21: ONE per-machine setting,
  `relay.codeFromBrowserAi` = never (default) | pages | all, read from the environment variable NPDEV_RELAY_CODE_MODE, else <NPDev home>/settings.json (LOCALAPPDATA/NPDev/settings.json on Windows);
  anything unreadable or unknown is `never`, so a broken setting can only make the relay stricter. `npdev ai relay code-mode [--set never|pages|all]` shows or changes it; THIS MACHINE IS SET TO `all`.
  The six safeguards, as built: (1) a scan that DESCRIBES what the code does (reads cookies/storage, talks to a server, runs text as code, loads more code, navigates, reads the sign-in key; for Java:
  starts programs, files, network, reflection, system) from relay-ingest-policy.json `codeScan`, with the sentence that no scan proves code safe; (2) for Java the platform's own PluginJavaSourcePolicy and
  bytecode inspector are the safeguard -- see REG-355, Java is not written yet; (3) every accepted file is a REQUIRED tick in the preview and apply refuses without it (`code:<kind>:<tag>`, tag = a
  short hash of the path because the Manager's Rust side only passes letters, digits and _ - : . >); (4) provenance: `browser-ai-code.json` beside the model (path, kind, origin browser-ai, conversation, time,
  sha256, what the scan found), written in the same all-or-nothing step so Undo removes it; (5) removal: `npdev ai relay remove-code --app <folder> [--path ...]` (never follows a recorded path out of
  the app); (6) a web file is served to anyone with its address, so it needs a SECOND tick (`code-public:...`). Only phase f4 (change/fix) accepts code; a new app never does. The f4 prompt gets one
  extra sentence ONLY when the setting is not `never` (so the default prompt is byte-identical). Tests: NPDevCli/tests/test_relay_codepolicy.py (18); test_relay_ingest and test_relay_pages now pin
  `never` for the default behaviour, so the owner's `all` can never leak into them.
  NOT done: Java capabilities and conversion hooks are accepted by the relay but NOT written (REG-355); a Manager control for the setting (it is a CLI/file setting for now) and a Manager button for
  remove-code; the tick boxes were not driven on the REAL Manager window (the generic needsConfirmation rendering and the Rust code check were read, not run); no real chat AI was asked for a JS page.
  DONE 2026-11-21 (real window): driven on the INSTALLED Manager 0.13.43 (throw-away webview profile, machine setting `all`, a scratch copy of the canary, scripted answer pasted): a change asking for web/hello.js
  showed TWO required boxes (code, public), Apply stayed off with none and with one ticked and came on with both, nothing was written before Apply, Apply sent both codes, web/hello.js was byte for byte
  and browser-ai-code.json recorded its sha256, Undo restored model.json byte for byte and removed the page and the record (tour: NPDev_General__OutsideRepo/reg354-355-tour/tour.mjs, 28 of 29 checks; the 29th
  is the generation check described in REG-355). NOT done: a real chat AI asked for a page.
  OWNER DECISIONS 2026-11-24 ("all recommended"): (12) the Manager gets a remove-code button ONLY; the relay.codeFromBrowserAi setting stays CLI/file, so opening code acceptance remains deliberate in a Manager
  made for non-experts. NOT built yet. (13) the real chat-AI round for a JS page is one pilot sitting with the owner (prepared prompt and steps, the owner pastes the answer back); it does not block anything.
guard:
  kind: test
  ref: NPDevCli/tests/test_relay_codepolicy.py
  asserts: >-
    the setting defaults to never and anything unreadable is never; with never code is quarantined and nothing is written; with pages a JS page needs two confirmations, is recorded with its sha256 and goes away with Undo; Java is sent back with a reason; code is never accepted outside phase f4; remove-code never follows a path out of the app.
  provenRed: false
verification: UNIT_TESTED
done_when: >-
  Either the owner decides code is never accepted from a browser AI (WONTFIX, the quarantine list stays), or the six steps are built and proven on the real window: a JS page with a `block`
  pattern and Java the inspector refuses cannot be accepted; an accepted program is marked origin: browser-ai and removable in one click; a JS page never goes public without the second confirmation.
