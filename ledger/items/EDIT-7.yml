source: >-
  Roadmap Collection 2026-08-18 (npdev-roadmap-collection.md), R7 item R7.4 -- "shareable team
  views; per-role landing defaults; daily-driver ergonomics." Blocked by R7.3, which landed earlier
  the same day (EDIT-6).
surface: generator/business-ui
