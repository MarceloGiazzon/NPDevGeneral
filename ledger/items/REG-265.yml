  assertAggregateInvariants/assertAggregateBalances). Request: draft with quantity 50 > disponivel 10.
  Actual: 503 {"message":"Aggregate StockTransferAggregate invariant(s) violated:
  PositionWithinAvailable -- ..."}. Expected: 4xx (400/409/422).
resolution: >-
  Fix the runtime, then remove "knownFailure": "REG-265" from probe qil-aggregate-veto-status-is-client-error; the runner turns that probe red
  the moment it passes with the marker still set, so the marker cannot outlive the bug.
