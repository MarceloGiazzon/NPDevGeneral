id: REG-284
title: >-
  A defaultExpression calling a function stores its own source text as the value, and an unregistered function in a default/derived expression passes validation and evaluates to text or null
type: BUG
severity: HIGH
status: PARTIAL
opened: 2026-10-23
closed: null
source: >-
  REG-282 (X0-11 audit of the runtime-support expression engine), 2026-10-23. Reproduced against the built
  kernel/dsl jars (Build/runtimehost-libs, 2026-10-18; neither evaluator has changed since).
surface: NPDevKernel/kernel concepts/ValueExpressionEvaluator; NPDevKernel/adapters/runtime-support crud/schemaexpr/SchemaExpressionSupport + GeneratedCrudRuntimeSupport.applySchemaValueBehaviors; NPDevContract/dsl validation/FieldValueValidation.analyzeValueBehaviorExpression
detail: |
  Three stacked silent defaults on the field-value path:
  1. ValueExpressionEvaluator.evaluate(expression, data) -- what ConfiguredConceptGatewaySemanticPolicy.evaluateFieldDefault
     (the governed policy GeneratedCrudRuntimeSupport and DefaultConceptGateway both use) calls -- tries
     ComputedExpression.evaluate(text, data) with an EMPTY function registry and, on ExpressionException, returns the
     raw expression TEXT. So every function call is "unparseable" there:
       ValueExpressionEvaluator.evaluate("concat(first, ' ', last)", {first:Ada, last:Lovelace}) -> "concat(first, ' ', last)"
       ValueExpressionEvaluator.evaluate("uppercse(first)", ...)                                   -> "uppercse(first)"
     Because that answer is non-null, GeneratedCrudRuntimeSupport's fallback to SchemaExpressionSupport (which DOES
     register concat/coalesce/trim/uppercase/lowercase) never runs. The documented concat/coalesce/trim/uppercase/
     lowercase defaults therefore write their source text into the row. Only nextNumber('x') (matched before this
     call) and $user.* (ValueExpressionEvaluator's $user overload, which registers ValueExpressionFunctions.base()) escape.
  2. SchemaExpressionSupport.evaluateSchemaExpression -- the derivedExpression path -- returns null for anything it
     cannot evaluate ("a malformed expression still yields null at record-save time instead of throwing"), and the
     caller REMOVES the field when the derived value is null. A typo'd function in a derivedExpression silently
     erases the field on every save.
  3. FieldValueValidation.analyzeValueBehaviorExpression accepts any call syntax: its javadoc says a call to a function
     the runtime does not register "evaluates to null at runtime (the existing lenient fallback)". So 1 and 2 are
     reachable from a model that validated clean.
  No corpus model has a function-call defaultExpression (dsl-conformance-max: nextNumber, $user.id, and a
  `quantity * unitPrice` derived), and no behaviour probe witnesses one.
resolution: >-
  Done when (a) the non-strict ValueExpressionEvaluator.evaluate resolves the same functions the runtime documents
  (ValueExpressionFunctions.base()) and never returns the expression's own text as a value -- an unevaluable
  expression is an error at write time; (b) evaluateSchemaExpression throws instead of returning null for an
  expression it cannot evaluate (a genuine null result -- coalesce of nulls -- stays null); (c) model validation
  refuses a defaultExpression/derivedExpression calling a function that is not registered for that kind
  (nextNumber only in defaultExpression), with the registered set pinned to the kernel's by a test or twin-pair
  rule; (d) a behaviour probe in dsl-conformance-max witnesses a concat(...) default and a derived function; and
  X0-14 / X0-15 in scripts/quality/x0-evaluator-registry.json move to FIXED with must-error testMarkers.
note: >-
  2026-10-23: filed by the REG-282 audit. (c) is a validation tightening: models that call an unregistered function
  stop validating -- they were storing text or null, so no codemod can recover an intended value; BREAKING.md entry
  without codemod, same shape as earlier validation tightenings.
  2026-10-23: PARTIAL -- (a), (b), (c) landed; (d) open. (a) ValueExpressionEvaluator.evaluate resolves the registered
  functions and an unevaluable expression throws (was: its own text); GeneratedCrudRuntimeSupport with no semantic
  policy evaluates defaults through it (was: now()/uuid()/function defaults silently skipped). (b) evaluateSchemaExpression
  throws instead of returning null. (c) com.npdev.dsl.v1.expr.ValueBehaviorFunctions.NAMES is the one set -- the kernel's
  ValueExpressionFunctions.VALUE_BEHAVIOR_FUNCTIONS reads it -- and FieldValueValidation refuses any other call, plus
  nested or derived now()/uuid(). Must-error tests proven red on the old code: ValueExpressionEvaluatorTest and
  SchemaExpressionSupportTest (X0-14, X0-15 FIXED); validation: DefaultsAndDerivedFieldsSupportTest. BREAKING.md entry,
  no codemod. No tracked model uses a refused form. Verified: full :NPDevContract:dsl:test, :kernel:test and
  :adapters:runtime-support:test. STILL OPEN (d): a dsl-conformance-max behaviour probe witnessing a concat(...) default
  and a function derived value -- it boots the app (T1/T2), which this Linux notebook does not run.
  2026-10-23: (d) AUTHORED, NOT YET RUN. NPDevSamples/dsl-conformance-max/behavior-probes/12-value-functions-events-audit.json
  probe cf-field-function-default-and-derived-evaluated, against new ShelfLayout fields displayTitle (defaultExpression
  concat('Shelf ', name)) and nameKey (derivedExpression uppercase(name)): asserts the stored default is the evaluated
  string (never the source text), the derived value is computed, overrides a client value and is recomputed on update.
  Awaits a T1 run (run-behavior-probes.ps1) on the Windows machine; close (d) only once it is green there.
