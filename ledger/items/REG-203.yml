source: >-
  BOUNDARY_LIFT_PLAN_2026-09-02.md work package 4.2 (B13), wave 4. The plan's own text named six
  candidate primitives to add two-per-wave -- concat, coalesce, case, cast, regex, normalize -- but
  by the time this package started, `merge` (S8 W1.2) already compiles to a portable `CONCAT(...)`
  and `convert` already compiles to a `CAST(...)`, so `concat`/`cast` as separately-named ops would
  have been pure duplication of existing semantics, not vocabulary growth. This package builds the
  two genuinely NEW primitives from that list instead: coalesce and case, both plain ANSI SQL
  (`COALESCE(...)` / `CASE WHEN...THEN...ELSE...END`) needing no dialect-specific emission.
