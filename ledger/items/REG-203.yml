detail: |
  Two new conversion ops, each reusing an existing sibling shape (the same discipline S8 W1.2 set
  for merge/convert) rather than inventing new JSON structure where an existing one already fits:

  **coalesce** reuses `merge`'s `mergeFrom` (2+ source fields, the array-shaped JSON `"from"`) + `to`
  shape, but compiles to `COALESCE(col1, col2, ...)` (first non-null source wins) instead of
  concatenating every source. Unlike merge, no "every source non-null" WHERE guard is emitted --
  COALESCE's whole point is tolerating NULLs among its arguments. A row where every source is NULL
  still yields NULL from COALESCE, and the closing `ALTER COLUMN ... SET NOT NULL` then fails the
  boot loudly on it -- same X0 discipline (a value the op cannot populate is a loud boot failure,
  never a silent partial conversion) every existing op already follows.

  **case** maps a source field's literal values to literal replacements: `from`/`to` (copy/convert's
  own shape) plus a new `when` array (1+ `{equals, then}` literal pairs, evaluated in declared order,
  first match wins -- new `ConversionCaseWhenAst`/`CompiledConversion.CompiledConversionCaseWhen`
  nested records) and an optional `else`/`elseValue` default (JSON key `else`; the Java accessor is
  `elseValue()` since `else` is a reserved word). Compiles to a portable `CASE WHEN col = 'x' THEN
  'y' ... ELSE 'z' END`. A row matching no `when` clause on a conversion declaring no `else` is left
  NULL by the bare `CASE ... END` (no ELSE clause emitted at all, proven by a dedicated generator
  unit test), and the closing SET NOT NULL fails the boot loudly on it -- same X0 discipline.

  Both ops are plain ANSI SQL (no `LIMIT`/`OFFSET`, no `ON CONFLICT`, no dialect-specific type
  syntax beyond what `portableSqlType`/`SqlDialect` already resolve for every other op), so
  `ConversionHookEmitter` needed no new dialect branching and stays inside STOR-1's single
  dialect-bound-SQL package.

  Threaded through every seam the existing five ops already use (`with`'s own precedent for a
  literal, non-field-reference conversion property): `JsonModelParser` (raw `when[]`/`else`/`then`
  reads, same "" != absent reasoning `with` already established) -> `ModelCompiler.compileConversions`
  (validation: coalesce needs 2+ mergeFrom fields "or that's just copy", same message shape merge's
  own check uses; case needs 1+ `when` clauses) -> `CompiledConversion` -> `ConversionHookEmitter`
  (SQL emission) -> `CompiledModelCanonicalJson`/`CompiledModelCanonicalJsonReader` (round-trip).
  `ModelResolver` needed no change (conversions[] already passes through it generically; this widens
  fields inside an existing array item, not a new top-level array, so the REG-108 four-seam rule for
  a brand-new top-level array does not apply here).

  Corpus coverage (`check-dsl-coverage.py`): `NPDevSamples/dsl-conformance-max` gained
  `0006-coalesce-customer-contact-email` and `0007-case-order-region-label` (two new fields each on
  `ConversionDemoCustomer`/`ConversionDemoOrder`), and `scripts/quality/dsl_coverage/features.py`
  gained `conversions.op.coalesce`/`conversions.op.case`, same per-op-tracked-separately discipline
  every existing op already has -- a regression to only five ops now zero-coverage-fails the build.

  Register updated across the bookkeeping seams (plan section 5): `ledger/boundaries/B13.yml` title
  + `codeLinkedNote` widened to seven ops; `NPDevContract/schemas/accepted-boundaries.json`'s B13
  `workaround` widened; `docs/ACCEPTED_BOUNDARIES.md`'s B13 row widened (5 ops -> 7 ops) with a new
  paragraph explaining both ops' design AND explicitly recording why `concat`/`cast` were skipped
  (already covered by merge/convert). B13's `classification` is UNCHANGED (HITTABLE) -- this widens
  the vocabulary, it does not lift the boundary (Java hooks are still out of scope).

  Test coverage, both layers every existing op already has: `ConversionHookEmitterDeclaredConversionsTest`
  gained SQL-shape assertions for both ops (happy path + unresolvable-field + insufficient-arity
  compile-error cases + a dedicated "no else omits the ELSE clause" shape test), and
  `ConversionHookRunnerDeclaredConversionsTest` gained real-H2 data-layer proof (three new fixture
  pairs under `s9-*`): coalesce picking a non-null fallback source + idempotent rerun, coalesce with
  every source NULL failing the boot loudly, case mapping both a matched value and an unmatched
  value (via `else`) + idempotent rerun, and case with no `else` on an unmatched value failing the
  boot loudly.
