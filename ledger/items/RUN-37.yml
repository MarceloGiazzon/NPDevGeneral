id: RUN-37
title: The Manager cannot find a database the user already runs in Docker -- adopting one means hand-typing --externally-provisioned, host, port and password
type: FEATURE
severity: LOW
status: DONE
opened: 2026-10-27
closed: 2026-10-28
source: >-
  Owner question during the AIP-4 4.5 session (2026-10-27): "what if I have Docker with the DB inside? How can we
  detect and manage this case?" Answered from the code: NPDev manages a container it created (the Monitor reads
  `docker ps -a` for the plan's containerName), and `npdev init --externally-provisioned` marks a database NPDev must
  never create or Reset -- but nothing discovers an existing container and offers it.
surface: manager/databases
detail: |
  What exists: npdev_monitor._docker_state(container) reports running / exited / unknown for the one container name an
  app's plan carries; doctor's `docker-present` is not required for an externallyProvisioned app (STOR-14);
  database-reachable / -credentials / -privileges / -charset (W5.2) probe host:port and work whether the server is in
  Docker or not; `npdev init --externally-provisioned` (STOR-15) is the only writer of the flag.
  The gap: a user who already runs Postgres / MySQL / SQL Server in a container has to know the flag exists and type
  host, port and credentials by hand, and the Monitor is blind to that container because no plan names it.
  Proposal, shaped like "Find local LLMs" (`npdev ai detect`): a `npdev db detect` that lists database containers from
  `docker ps` (known engine images and published ports) plus listeners on the engines' default ports, and a Manager
  "Find databases" button that, on pick, fills host/port and sets externallyProvisioned: true. It must never read or
  write a password into a plan, never start, stop or remove a container it did not create, and say "docker is not on
  PATH" rather than "none found" when Docker is unavailable.
resolution: >-
  Done when `npdev db detect --json` lists a running database container and its published port, the Manager offers it
  when creating an app, and picking it yields a db.definition.json with externallyProvisioned: true and no secret in
  the file; a unit test pins that the detector never reports an exited container as running (the selftest.rs lesson).
files:
  - NPDevCli/npdev_cli.py
  - NPDevCli/npdev_monitor.py
  - NPDevCli/npdev_engines.py
  - NPDevManager/ui/app.js
  - NPDevManager/src/npdev.rs
verification: VERIFIED_LIVE
guard:
  kind: test
  ref: NPDevCli/tests/test_db_discovery.py#test_exited_container_is_never_running_and_never_adoptable
  asserts: >-
    a container Docker reports as exited is never reported running and carries no initArgs, so neither the CLI nor
    the Manager's Find databases offers it for adoption (the selftest.rs lesson the done-when names). Proven red
    2026-10-28 by making the detector count exited as running: this and 3 sibling tests failed; restored, 30/30.
  provenRed: true
note: >-
  2026-10-27: filed, not started. Independent of AIP-4; do not fold it into that item's done-when.
  2026-10-27 (later): CLI half landed -- `npdev db detect [--json]` (NPDevCli/npdev_db_discovery.py, wired in
  npdev_cli.py `run_db_detect`) lists database containers from `docker ps -a` by image or default published port, plus
  default-port listeners, with the `npdev init --engine .. --db-host .. --db-port .. --externally-provisioned` arguments to
  adopt a running one. Running is decided from Docker's State field only; an exited container carries no adopt args;
  "docker is not on PATH"/"did not answer" is reported as such, never as none found; docker inspect is never called, so
  no password is read. tests/test_db_discovery.py (18) pins it, 4 go red if "running" ignores State. Verified live only
  on a machine with the Docker daemon stopped (honest "docker did not answer" path) -- NOT yet against a running
  container. REMAINING: the Manager "Find databases" button on app creation (NPDevManager/ui/app.js + src/npdev.rs),
  left alone because those files carry uncommitted Manager 0.5.2 work.
  2026-10-27 (Manager half, UNCOMMITTED with Manager 0.5.2): `run_db_detect` (npdev.rs), `detect_databases` command
  (main.rs), a "Find databases" button + "Use this" in the New-app connection form (index.html, app.js; fills engine,
  host, port and ticks externallyProvisioned, never a password), fixtures/db-detect.json. cargo test 54/54, node --check
  ok. NOT verified in a real window -- owner to click Find databases on the Create tab; needs a running container to see
  a "Use this" row.

  2026-10-28: correction -- the Manager half is COMMITTED, not uncommitted: run_db_detect, detect_databases, the Find
  databases button and fixtures/db-detect.json landed in c0a3ac6e (Manager 0.5.3). New live evidence: with a throwaway
  socket listening on 127.0.0.1:5432 (Docker daemon down on this machine), `npdev db detect --json` reported a listener
  entry (running true, engine postgres, port 5432, initArgs --engine postgres --db-host localhost --db-port 5432
  --externally-provisioned, a note that NPDev has not confirmed the engine, no password anywhere); the listener was
  closed afterwards; test_db_discovery 30/30. STILL NOT VERIFIED: a real running container (needs the Docker daemon,
  which local-test-profile.json keeps off here) and the "Use this" row in the actual Manager window -- both owner-side.
  2026-10-28 (owner asked: start Docker and check it). VERIFIED LIVE against a real container: Docker Desktop 29.9.2
  started, `docker run -d --name npdev-run37-pg -p 5432:5432 postgres:16-alpine`; `npdev db detect --json` reported it
  as source docker, matchedBy image, state running, running true, localhost:5432, initArgs --engine postgres --db-host
  localhost --db-port 5432 --externally-provisioned, and the postgres engine row as "already running here"; no password
  in the output. After `docker stop` the same container was reported state exited, running false, and the postgres
  engine row fell back to "Start-Environment creates the container". `npdev init <scratch-dir>` with exactly those initArgs
  wrote db.definition.json with externallyProvisioned true, host localhost, port 5432, password "" -- the container's
  password appears in no file of the app dir. Unit pins for the exited case exist
  (test_exited_container_is_never_running_and_never_adoptable, ..._with_published_port_still_not_adoptable). STILL NOT
  VERIFIED: only the "Use this" row in the real Manager window (app.js:945) -- container npdev-run37-pg was left
  running for that check.
