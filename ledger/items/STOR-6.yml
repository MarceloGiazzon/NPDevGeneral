id: STOR-6
title: >-
  The generator never quotes business identifiers, so a model field named after a reserved word
  (value, order, group) produces a schema script no engine will run -- conformance Q1, proven at the
  dialect layer and never exercised at application level
type: BUG
severity: MEDIUM
status: DONE
opened: 2026-08-08
verification: VERIFIED_LIVE
closed: 2026-08-09
surface: generator/dbconfig/SchemaRealizationEmitter, kernel/storage-dialect
source: >-
  storage/OPEN_ITEMS_PLAN.md W10. Found while unblocking Tier C: the p2-evolve probe declares a
  field called `value`, and the app it generates has never been able to boot.
detail: >-
  `SqlDialect.quoteIdentifier` exists, is implemented by all four dialects, and is asserted by
  conformance vector Q1 (Tier A) with this exact justification in its own javadoc:

      "A user will eventually name a field `order` or `group`."

  `SchemaRealizationEmitter` never calls it. Measured: zero occurrences of `quoteIdentifier`
  anywhere under `NPDevGenerator/generator/src/main`. Business column names go into the emitted DDL
  raw, so a model whose field is a reserved word produces a script the engine rejects:

      Syntax error in SQL statement "CREATE TABLE IF NOT EXISTS rows (
        id UUID NOT NULL,
        [*]value VARCHAR(255) NOT NULL, ..."; expected "identifier"   [H2 42001]

  The probe that found it -- `NPDevSamples/probes/p2-evolve`, which serves Tier C's E1 -- has
  therefore NEVER booted since it was written. That is why E7 has never been green, and the reason
  looked like a harness problem until the boot log was read.

  WHY IT SURVIVED THIS LONG

  The same shape as STOR-4 and STOR-5, a third time: the capability is correct at the layer that owns
  it and is never consulted by the layer that emits. Q1 passes on all four engines because it asks
  the DIALECT to quote a string. No corpus app happens to use a reserved word for a business field --
  the canary uses title/priority/status -- so nothing downstream ever exercised the path.

  It is MEDIUM rather than HIGH only because it fails loudly at first boot, on every engine, rather
  than silently. A user hits it the moment they model a field called `value`, `order`, `group`,
  `user` or `key` -- which is not an exotic thing to do.
resolution: >-
  OPEN. Not started; measured and scoped.

  The fix is to route business identifiers through `dialect.quoteIdentifier` in
  `SchemaRealizationEmitter` (and to check whether the CRUD/query paths need the same). It is NOT a
  one-line change: quoting alters every emitted table and column name, and PostgreSQL folds unquoted
  identifiers to lower case today, so quoting pins the case permanently and an already-deployed
  database would need its identifiers to match exactly. `foldsUnquotedIdentifiersToLowerCase()`
  exists on the dialect for precisely this question, and its answer decides whether the change is
  safe to apply to existing schemas or needs a migration.

  Because of that it is deliberately NOT bundled with STOR-5: one is "the DDL uses idioms the engine
  cannot parse", the other is "the DDL uses names the engine reserves", and mixing them would make a
  red run ambiguous.

  UNBLOCKED IN THE MEANTIME: p2-evolve's field was renamed `value` -> `label` so Tier C can run at
  all. That is a workaround for the PROBE, not for the platform, and the probe carries a comment
  saying so -- a fixture quietly shaped around a bug is how the bug stops being visible.
files:
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/dbconfig/SchemaRealizationEmitter.java
  - NPDevKernel/kernel/src/main/java/com/npdev/kernel/storage/sql/SqlDialect.java
  - NPDevSamples/probes/p2-evolve/v1/Input/model.json

closure: >-
  Conditional quoting shipped at THREE naming seams, not the two the plan named. `SqlDialect` gained
  `isReservedIdentifier(String)` (backed by `SqlReservedWords`, a per-engine word list read from
  `npdev/sql-reserved-words.properties`) and `identifier(String)`, which quotes ONLY when this engine
  reserves the name -- lowercasing first where the engine folds unquoted identifiers, so a column
  already deployed as `order` keeps matching.

  The seams:
    1. SchemaRealizationEmitter        -- emits the DDL (44 sqlId sites)
    2. JdbcBusinessConceptStore        -- reads and writes rows, plus the upsert text composed
                                          inside each dialect's UpsertStrategy
    3. SchemaLifecycleExecutor.quotedIdentifier -- the 40 schema-lifecycle sites across 13 classes

  The third was NOT in the plan, and no fresh-database test could have found it: the impact probe
  (`SELECT COUNT(*) FROM t WHERE order IS NOT NULL`) only runs when a column CHANGES on an existing
  database. A live H2 run against a pre-existing schema produced the syntax error; after the fix the
  same probe returns 0. `safeIdentifier` deliberately stays RAW and is still used where the name goes
  into a string LITERAL -- `information_schema` guards and SQL Server's `sp_rename` -- because a
  quoted name there searches for a column whose name contains backticks and silently never matches.

  Evidence:
    - Emitted-DDL diff over 4 models x 3 engines: 10 of 12 byte-identical; the 2 that moved are
      `rank` on MySQL (backticks) and `plan` on SQL Server (brackets) -- exactly the two collisions
      the corpus scan predicted, each moving from broken to working.
    - run-engine-app-proof.py: 5/5 assertions on postgres, mysql, sqlserver AND h2local, against
      real containers, including a new `reserved-identifier-round-trip` assertion. Booting proves
      the generator quoted; reading the row back proves the runtime did.
    - engine-probe now carries `order`, `value` and a concept realizing to the table `rows`, so the
      existing all-engine CI matrix covers this permanently at no extra cost.
    - Tier C on MySQL: 4/4 with p2-evolve restored to its original `Row`/`value` names -- the probe
      whose own model recorded that it "could never boot on either engine".
    - Twin-pair rule `sql-identifier-quoting-three-seams` pins all three, RED-proven by removing the
      token from one seam.
