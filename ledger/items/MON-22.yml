id: MON-22
title: >-
  Outside Docker's restart policy nothing restarted a crashed app or started one at boot -- add
  `Install-Service.ps1`/`Uninstall-Service.ps1` and their POSIX twins, wrapping the R9.4 guarded
  launchers rather than reimplementing them, idempotent and refusing a name conflict rather than
  clobbering it
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-08-19
closed: 2026-08-19
verification: VERIFIED_LIVE
source: >-
  Roadmap Collection 2026-08-18 (npdev-roadmap-collection.md), R9 item R9.6 -- "Emit and register a
  systemd unit or Windows service wrapper around the app's own emitted launcher; clean uninstall."
  Blocked-by premises (R9.3/RUN-11 and R9.4/MON-17, both DONE) verified against the ledger before
  starting, not assumed.
surface: generator/ops-emitters
files:
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/dbconfig/OperationalRunbookEmitter.java
  - NPDevGenerator/generator/src/test/java/com/npdev/generator/dbconfig/ServiceInstallEmitterTest.java
detail: |
  `OperationalRunbookEmitter` now writes four more files into every generated app's `App\_ops`:
  `Install-Service.ps1`, `Uninstall-Service.ps1`, `install-service.sh`, `uninstall-service.sh` --
  wrapping the R9.4 (MON-17) launchers rather than reimplementing java-launching, per the standing
  "supervise the existing launchers, do not write new ones" rule.

  **THE TWO PLATFORMS ARE DELIBERATELY NOT THE SAME MECHANISM, and the README says so.** systemd is a
  real init-system supervisor; Windows has no way to register an arbitrary script as a true SCM
  service without bundling a third-party wrapper binary (NSSM, WinSW, ...), which this platform does
  not. So:
    - Linux: `install-service.sh` writes a REAL `systemd` unit (`Type=simple`,
      `ExecStart=/bin/sh <app>/_ops/run-final-app.sh <profile>`, `Restart=always`, `RestartSec=5`,
      `StartLimitIntervalSec=300`/`StartLimitBurst=5` against a genuinely-broken restart loop) under
      `/etc/systemd/system/npdev-<appId>.service`, then `daemon-reload` + `enable` (+ `start` with
      `--start`). systemd tracks the process directly -- a crash is noticed immediately.
    - Windows: `Install-Service.ps1` registers a Scheduled Task (SYSTEM principal, `AtStartup` trigger
      plus a 1-minute repeating heartbeat) whose action is the ALREADY-GUARDED `Start-App.ps1` -- a
      no-op while the app is running, a start when it is not. **This is explicitly NOT a true Windows
      Service**: it will not appear in `services.msc`; worst-case crash-recovery latency is ~1 minute,
      not instant. Stated in the script's own `-DryRun` output and in `README_RUNBOOK.md`, not just in
      code comments, so an operator cannot mistake it for `sc.exe`-registered supervision.

  **`Restart=always`, not `on-failure`, and that is a real finding, not a stronger-than-needed
  default.** `run-final-app.sh`'s last pipeline stage is `tee`; POSIX `sh` has no `pipefail`, so a
  pipeline's exit status is its LAST command's status. Killing `java` out from under the pipe still
  lets `tee` exit cleanly on EOF, so the script reports exit 0 even though the app was killed --
  `Restart=on-failure` would trust that misleading success and never restart it. `Restart=always`
  restarts on ANY exit except an explicit `systemctl stop`, which is the correct semantics here and
  sidesteps the exit-code question entirely rather than patching `run-final-app.sh` (out of scope --
  that script is R9.4/MON-17's, already proven, and untouched here).

  **Idempotent and refuse-and-name-the-conflict, the MON-18/PACK-13 house style, on both platforms.**
  Re-running install against the SAME app is a documented no-op (matched by the systemd unit's own
  `# NPDEV_APP_ROOT=<path>` marker comment on the POSIX side, and by comparing the registered task's
  action path on the Windows side). A name collision with a DIFFERENT app's service/task is refused,
  naming both sides, never overwritten. `-DryRun` / `--dry-run` preview the exact registration with
  zero side effects and need no elevation; the real install path checks for Administrator/root
  explicitly and refuses with a plain message rather than an opaque permission error. Neither script
  touches `secrets/agent-proxy.env` or `secrets/api-key.env` directly -- the launchers they wrap
  already own that.

  **TWO REAL BUGS FOUND BY ACTUALLY RUNNING THE SCRIPT, not by reasoning about it.** First:
  `RUN_GROUP=$(id -gn)` under `set -e` aborted `install-service.sh` outright on this dev machine --
  `id -gn` fails with "cannot find name for group ID ..." for any account whose primary GID has no
  `/etc/group` entry (measured live; not exotic on minimal containers either), and a plain `X=$(cmd)`
  assignment IS subject to `errexit` when `cmd` fails. Second, after adding an `id -gn 2>/dev/null ||
  id -g` fallback: MSYS's `id -gn` was measured to print the numeric GID to stdout ANYWAY on this
  exact failure (unlike GNU coreutils, which prints nothing), so the `||` ran `id -g` a SECOND time
  and duplicated the line (`Group=197609` followed by a stray bare `197609` line in the emitted unit).
  Fixed by capturing `id -gn 2>/dev/null` with `|| true` (so a real failure cannot trip `-e`) and only
  falling back to `id -g` when the captured value is actually empty -- correct under both `id`
  behaviours, re-verified live after the fix (single correct `Group=` line).

  MEASURED, not assumed, using a real generated app (`NPDevSamples/simple-contact-intake`, regenerated
  fresh after every fix):
    - `Install-Service.ps1 -DryRun` run for real (this machine, no admin): printed the exact would-be
      task registration (executable, arguments, working dir, SYSTEM principal, AtStartup + 1-minute
      heartbeat triggers) and made zero changes -- confirmed via `Get-ScheduledTask -TaskName
      "npdev-*"` returning nothing afterward.
    - `Uninstall-Service.ps1` against a machine with no such task: "No scheduled task ... Nothing to
      do.", exit 0.
    - `install-service.sh --dry-run` on this real (non-systemd) machine: honest refusal, "systemctl
      not found -- this machine does not appear to run systemd. Cannot install a systemd unit.", exit
      1 -- a genuine, unforced degrade-path proof, not a simulated one.
    - `install-service.sh --dry-run --start` and `--dry-run --profile prod`, re-run with a harmless
      no-op `systemctl` shim placed on `PATH` (so the preview logic itself executes for real without
      ever calling a real `systemctl` or writing under `/etc`): printed the exact unit file content,
      including the `--profile` argument reaching `ExecStart`, and made zero writes.
    - `uninstall-service.sh` under the same shim, no unit present: "No unit at ... Nothing to do.",
      exit 0.
    - `sh -n` parses both POSIX scripts cleanly.
    - 6 new tests in `ServiceInstallEmitterTest` (content/structure assertions: both refusal messages
      name both sides of a conflict; both idempotent no-op messages; `Restart=always` present and
      `Restart=on-failure` absent with the reasoning pinned; the sanitized appId is baked as a literal
      token in the `.sh` twins since `sh` has no JSON parser; neither script references
      `agent-proxy`/`api-key.env`; two different apps get two different unit/task names) -- all green.
    - `check-deterministic-generation.ps1` passed TWICE (before and after the `id -gn` fix), so the
      four new emitted files are byte-identical across two generator runs.
    - `check-engine-parity.py`: 0 files branching on one server engine without its siblings --
      unaffected by design, since none of this branches on `plan.engine`/`profile.kind` at all.

  **DELIBERATELY NOT DONE, stated plainly.** No `npdev service install` CLI verb was added --
  `NPDevCli/npdev_cli.py` is out of this item's ownership (another agent is concurrently adding
  `npdev impact` there per this session's working agreement), so the four `_ops` scripts are reachable
  today only by running them directly from `_ops`, documented in `README_RUNBOOK.md`'s new step 3b;
  wiring a thin CLI verb over them is a follow-up for whoever owns `npdev_cli.py` next. No real system
  service or scheduled task was installed on any machine as proof -- every live check above is either
  a dry run, an idempotent no-op against nothing installed, or an honest refusal; the "kill -9 the app,
  watch it come back via the Monitor probe" end-to-end scenario the roadmap's own Done-When describes
  was therefore NOT executed and is not claimed here. The "refuse a same-name conflict pointed at a
  DIFFERENT app" branch is proven by code inspection plus the structural test assertions above, not by
  registering a real conflicting service/task on this machine and observing the refusal live -- kept
  out of scope deliberately rather than mutating a real Task Scheduler/systemd install list as a side
  effect of writing tests.
guard:
  kind: test
  ref: NPDevGenerator/generator/src/test/java/com/npdev/generator/dbconfig/ServiceInstallEmitterTest.java
  asserts: >-
    `OperationalRunbookEmitter` emits `Install-Service.ps1`/`Uninstall-Service.ps1` and
    `install-service.sh`/`uninstall-service.sh` into every generated app's `_ops`, wrapping the R9.4
    guarded launchers rather than reimplementing them; the systemd twin bakes `Restart=always` (not
    `on-failure`, with the tee-pipe exit-code reasoning pinned in a code comment) and the sanitized
    appId as a literal token; both platforms' installers document a same-app no-op and a
    different-app refusal that names both sides; neither script references the app's secrets files.
    Load-bearing platform behaviour (dry-run preview correctness, the honest non-systemd refusal, the
    Windows Scheduled Task registration/no-op path, and the id -gn duplicate-line regression) was
    proven live against a real regenerated sample app rather than only by this test file -- see the
    detail field for the exact commands and output.
  provenRed: false
  provenRedNote: >-
    The verb did not exist, so nothing about it could have failed before -- not a bug-fix item.
    Two REAL defects were caught live while implementing, both by actually running the emitted
    `install-service.sh` rather than by reasoning about it: `set -e` aborting the script on
    `id -gn`'s failure (reproduced live on this machine, whose current user's primary GID has no
    `/etc/group` name), and, after the first fix, a duplicated `Group=` line caused by MSYS's `id -gn`
    printing the numeric GID to stdout even on failure (unlike GNU coreutils). Both are described and
    fixed in the detail field; the final version was re-verified live after each fix.
