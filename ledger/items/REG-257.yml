id: REG-257
title: >-
  A concept index declared unique is not enforced: duplicate rows (single field and compound) are accepted with 201
type: BUG
severity: HIGH
status: DONE
opened: 2026-10-20
closed: 2026-10-21
verification: VERIFIED_LIVE
source: >-
  ENF-1 behaviour probe cf-index-unique-single-field-rejects-duplicate (NPDevSamples/dsl-conformance-max/behavior-probes/10-concept-field.json), found while checking
  that the booted dsl-conformance-max app OBEYS what the DSL schema accepts.
surface: generated-app runtime (dsl-conformance-max)
detail: |
  REAL DEFECT: StockLocation declares unique index ux_stock_location_local_id on [localId] but two
  rows with the same localId are stored. Evidence: POST /api/stock_locations
  {localId:'L',disponivel:1} -> 201 twice; expected the second to be refused (409 like a unique
  field).
resolution: >-
  Fix the runtime, then remove "knownFailure": "REG-257" from probe cf-index-unique-single-field-rejects-duplicate; the runner turns that probe red
  the moment it passes with the marker still set, so the marker cannot outlive the bug.
