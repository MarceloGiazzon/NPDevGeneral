detail: |
  VERIFIED BEFORE EDITING (per the task's own instruction): grep -n "NPDevShell.mount(" in
  shell.js.mustache found a real implementation (window.NPDevShell = { ..., mount: function
  (options) {...} }); grep -n "NPDevShell.mount(" in business-ui-app.mustache found a real call
  site inside bootstrap() (window.NPDevShell.mount({ deriveNativeGroups: deriveNativeGroups })).
  grep -i "topbar|top-bar|sidebar" in business-ui-app.mustache returned exactly one hit -- a
  comment naming shell.js's own renderSidebar() function, not any chrome-rendering code of its
  own. The collapse is real: business-ui-app.mustache owns zero chrome, shell.js owns all of it.

  WHAT WAS CHANGED (deliberately tiny, per the task's own warning not to touch rendering code):
  1. shell.js.mustache's header comment: deleted the "(not wired yet -- see
     business-ui-app.mustache)" clause and replaced it with what is actually true today -- the
     SPA host mode is wired and live, business-ui-app.mustache's bootstrap() calls it and
     delegates its own chrome here entirely.
  2. Added entry 5 to ledger/semantic/duplicate-lanes.yml (shell.js chrome vs business-ui-app
     chrome), verdict already-collapsed, matching the shape of the existing four
     inheritance-lane entries (mechanism/behavior/verdict/notes).

  NOT CHANGED: no rendering code, no runtime behavior, SHELL_VERSION not bumped -- exactly the
  task's own scope guard ("if your diff touches rendering code, stop -- you have misread the
  tree").
