id: QUAL-33
title: Five test classes are @Disabled because the infrastructure they need does not exist
type: GAP
severity: LOW
status: DONE
opened: 2026-08-23
closed: 2026-08-25
verification: VERIFIED_LIVE
source: 2026-08-23 platform audit; each annotation's own reason string names its missing dependency.
surface: testing/infrastructure
files:
  - NPDevRuntimeHost/src/test/java/com/finalexec/RuntimeHealthEndpointIT.java
  - NPDevKernel/adapters/runtime-validation/src/test/java/com/npdev/adapters/runtime/validation/RuntimeHealthIndicatorsTest.java
  - NPDevKernel/adapters/runtime-validation/src/test/java/com/npdev/adapters/runtime/validation/RuntimeRequestSizeFilterTest.java
  - NPDevKernel/adapters/runtime-validation/src/main/java/com/npdev/adapters/runtime/validation/RuntimeRequestSizeFilter.java
  - NPDevKernel/kernel/src/test/java/com/npdev/kernel/EventStorePerformanceRegressionTest.java
  - NPDevKernel/kernel/src/test/java/com/npdev/kernel/InMemoryEventStore.java
