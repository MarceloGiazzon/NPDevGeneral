id: QUAL-36
title: Two workflows (AI Beta Gate, NPDev Release Gate) have not completed in six days
type: PROCESS
severity: LOW
status: OPEN
opened: 2026-08-23
source: >-
  2026-08-23 platform audit (Wave 5 T5.12/F6). Neither workflow blocks a PR or a push, which is why
  neither had been looked at.
surface: ci/workflows
files:
  - .github/workflows/ai-beta-gate.yml
  - .github/workflows/npdev-release-gate.yml
detail: |
  Checked both directly via `gh run list` 2026-08-23:

  - **AI Beta Gate** last completed 2026-08-17T16:19:26Z with `conclusion: failure`; every run since
    (five of them, all `workflow_dispatch`) was `cancelled`. The real failure's log (run
    32045088383) shows the "Docker/Linux blocking proof" job failing inside
    `scripts/quality/run-docker-linux-proof.ps1` -- `docker-run-ai-beta-gate` exited 1 after 476s.
    The report artifact (`docker-linux-parity-report.json`) was uploaded but not inspected here --
    diagnosing a real Docker-on-Linux-CI failure needs its own session, not a few minutes inside an
    already-large wave.
  - **NPDev Release Gate** has no recent completed run at all -- every `workflow_dispatch` attempt
    since 2026-08-17 was cancelled, and the last REAL conclusion (`failure`) is from 2026-04-28, four
    months stale; that run's log has since expired (GitHub returns HTTP 410).

  Neither workflow is required by branch protection and neither runs on every push/PR, so a red or
  cancelled run here has never blocked anything -- which is exactly why both went unnoticed.

  Decision recorded here rather than left implicit: both stay wired and scheduled as-is for now.
  Fixing the Docker/Linux proof failure needs downloading and reading
  `docker-linux-parity-report.json` from a real CI run, which needs its own investigation pass;
  NPDev Release Gate needs a single real `gh workflow run` attempt (not a `workflow_dispatch` that
  gets immediately cancelled by something else queued) to even produce a current failure to diagnose.

  Done when: AI Beta Gate's Docker/Linux proof either passes or its failure is understood and
  tracked by its own item, AND NPDev Release Gate has produced one real (not cancelled) run in the
  current repo state, whatever it reports.

  2026-08-26 (remediation plan W4.4): both halves of the done-when have real evidence now, one fully
  met and one still open.

  AI Beta Gate -- MET. Dispatched fresh (run 32917370685, workflow_dispatch): completed for real
  (not cancelled) with `conclusion: failure`, docker-run-ai-beta-gate exiting 1 after 472s -- the
  same failing step, near-identical timing, as the last real conclusion on 2026-08-17 (476s),
  confirming this is one persistent issue, not new flakiness. The failure IS now understood, not
  just re-confirmed red: downloaded and read docker-linux-ai-beta-gate-report.json (previously left
  un-inspected). ~25 of 30 golden-ai-scenarios fail, in (at least) two distinct, concrete, unrelated
  ways -- a schema/fixture mismatch (auth-disabled-protected-endpoint's ai-model.json violates
  ai-model.schema.json's `/auth/mode` const and `/auth/testUsers` minItems) and a real 401
  invalid_api_key on POST /api/learners in the base-ai-loop scenario's smoke check, on an app that
  demonstrably booted fine (GET /actuator/health passed on the same run). Neither is Docker/Linux-
  environment-specific in nature (schema validation is pure JSON; the 401 is an app-level auth
  config mismatch) -- Linux CI is simply the only place anything runs this scenario suite for real.
  Tracked as its own item, ledger/items/QUAL-42.yml (HIGH, since it affects the majority of the
  scenario corpus), rather than fixed inline -- this item's own prior note already said that
  diagnosis needs its own session, and now that session has a concrete starting point instead of
  "still red."

  NPDev Release Gate -- NOT YET MET. Dispatched fresh (run 32917372613, workflow_dispatch) at the
  same time as the AI Beta Gate run above. Still `in_progress`, not cancelled, after 3+ hours (started
  2026-08-26T01:01:17Z), stuck on its "Run traceable Beta 0 release check" step the entire time --
  genuinely hung, not merely slow (every prior dispatch attempt since 2026-08-17 was cancelled within
  minutes; this is the first to run this long uncancelled). This is itself new, real signal (a
  workflow that hangs rather than completing or being cancelled is a different failure mode than
  either), but the done-when's letter ("has produced one real run") is not yet satisfied by a run
  still in progress. Left running rather than cancelled -- cancelling a currently-executing shared CI
  run is not a call to make unilaterally mid-session. If it eventually completes, record the result
  here; if it is still hung after a reasonable wait, that hang is itself the finding worth its own
  item.
