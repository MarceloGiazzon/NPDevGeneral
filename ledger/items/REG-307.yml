source: >-
  2026-10-24, ENF-1 planning for concept.satelliteOf: LiveFieldDiff's refusal text contradicted PackExtensionComposer
  (a satellite lives "in its own table") and the p6-satellite-extension probe (its own FK-linked table).
surface: NPDevRuntimeHost runtimehost-core db/LiveFieldDiff (refusal message + javadoc) and NewConceptSchemaProvisioner.outOfScopeReason
detail: |
  An operator told the field was refused because the concept is "stored on another concept's table" would look for
