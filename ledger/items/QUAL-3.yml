id: QUAL-3
title: >-
  Two apps in one folder became ONE database -- a shared `_ops` toolbox AND a shared appId, so
  container name and data root collided; resetting either destroyed the other's data
type: BUG
severity: HIGH
status: DONE
opened: 2026-08-09
closed: 2026-08-09
verification: VERIFIED_LIVE
surface: generator/dbconfig
source: >-
  storage/stabilize/STABILIZE_PLAN.md M14 (found while wiring the Manager's five database buttons),
  re-rated and closed under storage/stabilize/TAG_PLAN.md section 2.
detail: >-
  Re-rated MEDIUM -> HIGH on filing evidence, then found to be WIDER than filed.

  Two sites encoded "this belongs to the PARENT DIRECTORY, not to the app":

    1. OperationalRunbookEmitter.emit  ->  finalAppRoot.getParent().resolve("_ops")
    2. UserDatabaseDefinitionLoader.resolveAppId  ->  two directory levels up from db.definition.json

  Site 2 was NOT in the original filing and is the one that destroys data. Walking two levels up is
  right for the corpus layouts (`<App>/definition/...` and `<App>/Input/...`) and wrong for the
  `npdev init` layout, which writes the definition directly into the app directory -- so two levels
  up is the PARENT FOLDER, shared by every app in it.

  MEASURED RED (two apps really generated into one folder, not inferred):

      app-a: appId=qual3  container=npdev-qual3  dataRoot=Build/databases/qual3
      app-b: appId=qual3  container=npdev-qual3  dataRoot=Build/databases/qual3
      npdev db status --app <app-a>   ->   [qual3 | Postgres | .../app-b-app]

  So they were not two apps sharing a toolbox. They were one database with two front doors. Fixing
  only the `_ops` location would have left both apps pointed at one container and one data root, and
  Reset for either would still have destroyed the other's data -- the fix would have looked complete
  and changed nothing that mattered.

  Why HIGH, not MEDIUM: it destroys data and reports success (the class STOR-11 was rated HIGH for);
  two apps in one folder is what evaluating the product looks like, not an exotic setup; and the
  acknowledgement token cannot help, because the user types it correctly for the app they intend and
  different data is deleted. M14 had just made Reset a button, so the risk rose the day the toolbox
  got easier to reach.

  A THIRD and FOURTH site encoded the same assumption and had to move with it (the plan predicted
  only two): `scripts/quality/run-engine-toolbox-parity.py` read `output.parent / "_ops"`, and
  `scripts/appgen/Build-NpdevApp.ps1` writes its own separate toolbox at `$OutRoot/_ops`. The latter
  is per-appId by construction (`$OutRoot = $BuildRoot/$AppId`) so it cannot collide and was left
  alone; the former follows the emitter.
  A FIRST ATTEMPT AT SITE 2 WAS WRONG AND IS WORTH RECORDING. Keying identity on the directory NAME
  ("if it is not called `definition/`, that directory is the app") looked right and passed the new
  tests. Measured against the corpus, it was worse than the defect: 25 definitions live in a
  directory called `Input` with no manifest.json, and the rule collapsed all 25 onto `appId=Input`.
  T2 caught it as an unrelated-looking STOR-8 failure
  (`UserDatabaseDefinitionDeclaredConnectionTest`, "an h2FilePath that agrees with the derived path
  still loads") because that test's two temp definitions stopped resolving to one app. Path shape
  cannot distinguish an app directory from a wrapper directory; asking it to was the mistake.
remediation: >-
  DONE. `_ops` now lives INSIDE the FinalApp. Identity is DECLARED rather than inferred: `npdev
  init` writes a `manifest.json` naming the app, which `resolveAppId` already preferred over its
  directory-walking fallback -- so the fallback is unchanged and every corpus layout keeps its
  current identity. The reader
  (`_find_ops_root`) prefers the app-local toolbox, accepts both `<app>/_ops` and `<app>-app/_ops`,
  and falls back to the legacy shared location ONLY when no app-local one exists -- announcing it,
  because a silent fallback would hand a newly generated app the old shared plan and reintroduce the
  bug inside its own fix.

  Proven, RED first: with two real Postgres apps in one folder, `db reset` on app-b left app-a's
  container running and its canary row intact; identities are distinct on all four axes (appId,
  container, data root, database name); a regenerated app uses its own toolbox silently while an
  un-regenerated sibling still falls back and warns. Pinned in CI by
  `NPDevCli/tests/test_ops_toolbox_isolation.py` (6 tests, run by run-ai-knowledge-gate.ps1) and
  `AppIdentityIsolationTest` (2 tests, run by :generator:test), the latter also pinning that the
  AppGen layout is unchanged. BREAKING.md entry filed; no codemod is possible (no model content
  changes) so the reader carries the compatibility instead.
