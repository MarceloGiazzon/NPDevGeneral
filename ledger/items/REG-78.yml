detail: |
  Investigated, not fixed. The original `syncOcupacao` client logic (movimentacao-livre.html /
  centro-trabalho.html, WmsOffice) does, for each (localArmazenagemId, loteId) pair touched by a
  Movimento's posicoes: find the existing `LocalArmazenagemLote` row for that pair; if found,
  INCREMENT its quantidade by a signed delta (positive for Destino, negative for Origem); if not
  found (and the delta is positive), CREATE a new row. `patchConcept`'s new `createIfMissing`
  (REG-77) makes the "create if genuinely absent" half expressible -- but two more primitives are
  missing, confirmed by re-reading the executor directly rather than assumed:

  1. **No find-by-non-id-fields lookup composable with patchConcept.** `patchConcept`'s `id` is a
     direct primary-key lookup (`ConceptReadRequest(conceptName, id, tenantId)`) -- it has no
     "find where field=value" mode. Procedures do have `listConcepts`/`runQuery` steps that CAN
     filter by declared query criteria, but composing "runQuery to find candidate, extract its id
     via mapValue, THEN patchConcept with that id" requires a NAMED query declaration
     (`localArmazenagemId == ? && loteId == ?`) that does not exist for `LocalArmazenagemLote` today,
     plus an `ifThenElse` step to route "found" vs. "not found" -- itself only cleanly expressible
     if the found-id extraction and the not-found blank-id path can share one patchConcept call,
     which they can (createIfMissing tolerates a blank id) -- so this half is NOT a hard platform
     wall, just undeclared corpus/model work (a new query + forEach/ifThenElse composition), unlike
     point 2.
  2. **No arithmetic/accumulation primitive anywhere in the procedure step vocabulary.**
     `patchConcept`'s `set` values are literal-by-default or a direct state-ref copy
     (`DefaultProcedureExecutor.resolveSetValue`) -- never an expression, and never a function of the
     CURRENT value being overwritten. Computing `newQuantidade = existing.quantidade + delta` needs:
     read the existing value (via `readConcept` + a `mapValue` dotted-path extraction, both of which
     already work), then ADD a delta to it -- and no step type performs arithmetic. `mapValue` is
     copy-only. This is confirmed a genuine, independent gap: unlike point 1, no composition of
     EXISTING steps closes it. A `forEach` loop's own per-iteration state cannot accumulate a running
     total across iterations either (each iteration's `itemKey` binding is independent), so even a
     naive "sum all posicoes for this pair, then set absolute quantity" workaround does not compose
     from what exists today.

  **What this blocks, precisely**: SyncOcupacaoProcedure (M8/M9) only. Nothing else in Move 4 or
  Move 5 Wave 1 depends on this -- REG-75 (patchConcept/onCommit), REG-77-A (Ativar's flag-sync, this
  session) and the WmsOffice `crossDockingSync` capability deletion are all fully closed and do not
  need either primitive named here.

  **What would close it** (not attempted, scoped for a future session): point 1 needs only a
  declared query + procedure composition (no new platform code). Point 2 needs a genuinely new
  procedure step -- e.g. a `computeValue`/`arithmetic` step taking two refs (or a ref and a literal)
  and an operator (`add`/`subtract`, the minimum `syncOcupacao` needs), writing the result to a
  target key the same way `mapValue` already does. Shipping an absolute-overwrite instead (skipping
  the increment) was deliberately rejected: it would silently produce a wrong occupancy count for
  every position that already had stock, which is worse than not shipping `syncOcupacao` at all.

closure: |
  Both points closed, live-verified against a real generated WmsOffice boot (not just unit tests).

  **Point 2 (arithmetic primitive) -- shipped as a new `computeValue` procedure step**: operator
  ("add"/"subtract", the minimum this ledger item named) + `left`/`right` operands resolving via
  the SAME literal-vs-$ref convention `patchConcept`'s `set` and `mapList`'s `select` already use
  (reusing kernel's existing `operation`/`setValues`/`outputKey` fields -- zero new kernel fields,
  matching `mapList`'s own precedent). Operands coerced through `BigDecimal` so a "long" concept
  field added to a JSON integer literal doesn't round-trip through binary floating point; result
  normalized to a `Long` (whole) or `Double` (fractional). Full DSL threading (AST/compiled/
  canonical-JSON/validation/4 schema mirrors) + kernel unit tests (7, including operator/operand
  edge cases) + a DSL validation test (6 cases) + a `dsl-conformance-max` corpus fixture.

  **A real bug found and fixed while proving computeValue live** (see REG-83): `saveConcept`'s
  blank-idRef auto-generate fallback and `patchConcept`'s `createIfMissing` create half both
  resolved/generated a fresh id but never folded it into the write's own `data` map -- invisible in
  every kernel unit test up to this point (all wired with a permissive/noop semantic policy), but a
  real governed gateway (`ConfiguredConceptGatewaySemanticPolicy`, what every generated app actually
  runs) requires "id" present IN the data map since it is a required field on essentially every
  concept. This silently denied CONCEPT_FIELD_REQUIRED on any fresh-record write through either
  step against a real app -- caught only because this closure insisted on a real generated-app
  proof instead of stopping at green kernel tests.

  **Point 1 (find-by-non-id-fields lookup) -- composed from EXISTING steps, no new platform code,
  exactly as this ledger item predicted**: `listConcepts` (unfiltered) + `mapList` (reshapes
  ConceptRecords into plain maps, the same technique `ParseNfeProcedure` already established) +
  one small Java capability method (`encontrarOcupacao` on WmsOffice's existing `alocacao`
  capability) that does the actual (localArmazenagemId, loteId) equality scan. A genuinely deeper
  finding than this item's own original text assumed: procedures' `if` step has NO comparison-
  expression grammar at all -- `conditionRef` is a bare resolve+truthy check (confirmed by reading
  `DefaultProcedureExecutor.ifThenElse` directly), not a `left == right` evaluator -- so "declare a
  query + forEach/ifThenElse" alone would not have composed; the equality test itself has to happen
  in Java, same as `FiscalImportCapability`'s own dedup/auto-match logic already does.

  **Live proof (WmsOffice's new `SyncOcupacaoProcedure`, `OcupacaoLocalPanel.SincronizarOcupacao`
  action)**: built a real Entidade/Armazem/Area/Rua/LocalArmazenagem/Produto/Lote chain via REST,
  then 4 real calls against the live generated app -- (1) delta=10, no existing row -> CREATE,
  quantidade=10, confirmed via a direct GET; (2) delta=5, existing row found -> INCREMENT to 15;
  (3) delta=-3 -> DECREMENT to 12; (4) delta=-100 (would go negative) -> REJECTED by
  LocalArmazenagemLoteQuantidadeNonNegative (the concept's own invariant), quantidade correctly
  UNCHANGED at 12 afterward. That last case is a deliberate, documented divergence from the
  original client-side `syncOcupacao()`'s own `Math.max(0, ...)` silent clamp -- a server-side
  authoritative write rejecting a would-be-negative result with a real error is more honest than
  masking what could be a real shipping/allocation bug, and was a design decision made explicitly,
  not a limitation discovered by accident.
