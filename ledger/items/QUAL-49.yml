id: QUAL-49
title: >-
  run-runtime-surface-evidence.ps1 fails at HEAD (daccc569) with zero code changes -- contradicts
  SEC-3 step 2/3's own same-session claim that "runtime-surface-evidence checks passed both times"
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-09-01
closed: 2026-09-01
source: >-
  2026-09-01, SEC-3 Model B step 4 (per-OS plugin resource limits) verification. A full
  run-runtimehost-gate.ps1 run failed at its last step ("Runtime surface evidence failed:
  classification, footprint") after both real test suites (the assembled sample app's own gradle
  test task, including all new step-4 tests, and runtimehost-core's own gradle test task) had
  already passed BUILD SUCCESSFUL. Before assuming step 4's own new classes caused it, isolated the
  cause: `git stash push -u` (removing every step-4 file, back to committed HEAD daccc569) and reran
  `scripts/quality/run-runtime-surface-evidence.ps1` directly -- it failed IDENTICALLY
  ("classification, footprint") with zero working-tree changes applied. `git stash pop` restored the
  step-4 work afterward, verified via `git status`.
surface: scripts/quality/run-runtime-surface-evidence.ps1, NPDevRuntimeHost/src/main/resources/npdev/runtime-supported-controllers.json
files:
  - scripts/quality/run-runtime-surface-evidence.ps1
  - NPDevRuntimeHost/src/main/resources/npdev/runtime-supported-controllers.json
  - scripts/reports/out/runtime-surface-classification-report.json
  - scripts/reports/out/runtime-footprint-report.json
detail: |
  NOT ROOT-CAUSED. This item exists to record the discrepancy and the concrete failing checks, not to
  explain the mechanism -- that is next-session work.

  The discrepancy: SEC-3's own ledger entry for step 2 (2026-09-01, this session, commit 63bc3e57)
  and step 3 (commit daccc569) both explicitly state "coverage-floor + runtime-surface-evidence
  checks passed both times" as part of their full-gate verification. HEAD is still daccc569 --
  no commit has landed between that claim and this one. Yet running the exact same script against
  that exact same commit, with SEC-3 step 4's own new files stashed away entirely, reproduces the
  failure. Either the step 2/3 claim was inaccurate (the check was not actually reached, or its
  result was not actually inspected), or this check is nondeterministic/order-dependent (e.g.
  sensitive to some prior build/report-file state on the machine that a clean `git stash` does not
  reset, since generated files under scripts/reports/out/ and NPDevSamples/*/Output/ are gitignored
  and were NOT touched by the stash). Both are worth ruling in/out before fixing anything.

  The concrete failing checks (from scripts/reports/out/runtime-surface-classification-report.json
  and runtime-footprint-report.json, captured during isolation):
  - `service-buckets-are-exclusive`: 21 services (e.g. CanonicalSourceArtifactStore,
    PublicationExecutorService, TenantRegistryService) match BOTH "supported-core" (via an exact-name
    entry in runtime-supported-controllers.json's supportedCoreServiceComponents) and
    "internal-but-needed" (via a nonDefaultServicePatterns pattern like `CanonicalSource*` or
    `Tenant*Service`) simultaneously -- the manifest's own exact list and pattern list disagree with
    each other for the same class names.
  - `service-namespace-convergence-is-clean` / `service-namespaces-match-convergence-buckets`: 39
    services declared in a `com.finalexec.npdev.service.internal` (or similarly `.internal`-suffixed)
    Java package have an `expectedBucket` of `supported-core` (from the exact-name list) but a
    `packageBucket` of `internal-but-needed` (from Get-PackageBucket's package-name check) --
    i.e. these classes were organized into an `.internal` subpackage at some point without their
    manifest classification being updated to match, or vice versa. 14 more report as
    "unexpected-package" entirely.
  - `controller-namespace-convergence-is-clean` / similar: the identical shape for 17 controllers
    under `com.finalexec.api.internal` (BetaOnboardingController, FlowBuilderController,
    PublicationExecutorController, etc.) -- named in `allowedControllers` (supported-core) but
    packaged under `.internal`.
  - `supported-controller-footprint-is-smaller-than-inventory` /
    `supported-controller-footprint-stays-minority`: consequently, ALL 38 discovered controllers
    classify as "supported" (supportedControllers=38; totalControllers=38) -- the footprint checks
    that expect "supported" to be a proper minority of the total inventory now see 100%, since the
    exact-name allowlist alone (ignoring the namespace mismatches above) matches everything.

  Done when: root-caused (why did step 2/3's own claim differ from this reproduction? is the check
  flaky/order-dependent, or was the earlier claim wrong?) and either the manifest
  (runtime-supported-controllers.json) is reconciled with the actual package layout, or the actual
  package layout is reconciled with the manifest -- whichever is the intended source of truth -- so
  `run-runtime-surface-evidence.ps1` passes cleanly and `run-runtimehost-gate.ps1` can complete
  end-to-end again. Not attempted here: unrelated to SEC-3's plugin-process-isolation work, and the
  17+39 affected classes are a separate, unbounded-scope investigation of their own.

  ROOT-CAUSED and RESOLVED 2026-09-01 (Track B of the SEC-3/QUAL-49/QUAL-50 implementation plan).
  The "contradiction" was neither flakiness nor a wrong earlier claim -- it was an invocation
  mismatch. `run-runtimehost-gate.ps1` (line 176) has always invoked this script WITH `-PendingOk`,
  which downgrades 8 formally-retired convergence/footprint checks (GATE-OBS-1a, REG-5, 2026-07-21)
  to advisory. This item's own isolation run invoked the script directly, WITHOUT that switch --
  a genuinely different check. Run the way the gate actually runs it
  (`-PendingOk`), only 2 of the 17+39+21-class drift this item catalogued were ever blocking:
  `services-classified` / `service-inventory-fully-classified` reporting `unclassifiedServices=2`
  for two classes -- `JavaSourceRuntimeRefManifest` and `JavaSourceRuntimeRefManifestLoader`. Both
  were added by commit 866c4fb1 (the SEC-3 step-3 follow-up landed the same session as this item was
  filed); replaying the classification check across history confirmed 0 unclassified at daccc569 and
  03b123ce, 2 at 866c4fb1 -- a fresh regression from the most recent commit, not the old drift this
  item's own detail catalogues (that drift is real but was already advisory-by-design under
  `-PendingOk`, per GATE-OBS-1a; a genuine reconciliation of it stays out of scope, see below).

  Fix: added `"JavaSourceRuntimeRef*"` to `supportedCoreServicePatterns` in
  NPDevRuntimeHost/src/main/resources/npdev/runtime-supported-controllers.json (same precedent
  SEC-3 step 4 already set for its own new `Plugin*`-named classes). Verified this pattern collides
  with nothing in supportedCoreServiceComponents/nonDefaultServicePatterns/experimentalServicePatterns.
  `run-runtime-surface-evidence.ps1 -PendingOk` now exits 0 (classification/footprint both
  `overallStatus: warning`, not `failed`).

  Also fixed the recurrence mechanism itself, not just this instance: `run-runtime-surface-evidence.ps1`
  made the `-PendingOk` advisory behavior the DEFAULT (added `-IncludeRetiredConvergenceChecks` to
  opt back into the old strict behavior for a deliberate audit; `-PendingOk` is kept as an
  accepted-but-now-redundant no-op so every existing call site -- run-runtimehost-gate.ps1,
  .github/workflows/npdev-ci-validation.yml -- keeps working unchanged). A bare hand-run of the
  script (no flags) now also gets advisory treatment of the 8 retired checks instead of reading them
  as real failures, which is exactly the mistake that produced this item.

  Verified live: `run-runtime-surface-evidence.ps1` (bare, `-PendingOk`, and
  `-IncludeRetiredConvergenceChecks`) all behave as expected (advisory/advisory/strict
  respectively); full `run-all-gates.ps1 -Only runtimeHost` passed end-to-end in ~571s with
  "Runtime surface evidence reports generated" and "ALL 1 GATES GREEN."

  Not attempted, still out of scope: genuinely reconciling the pre-d0bf41b 17+39-class drift
  (moving classes' actual packages, or the manifest's buckets, so the 8 retired checks pass for
  real instead of staying advisory) -- a surface-governance owner's decision, not a bugfix. The full
  arithmetic (17 controllers, 21 overlapping services, 25 misaligned services) is preserved outside
  the repo per this repo's own process-document policy, not in a committed script.
guard:
  kind: script
  ref: pwsh -NoProfile -File scripts/quality/run-runtime-surface-evidence.ps1 -PendingOk
  asserts: >-
    Exits 0; classification and footprint reports both show overallStatus "warning" (not "failed").
    Full run-all-gates.ps1 -Only runtimeHost completes end-to-end. Verified live 2026-09-01: exit 0,
    ~571s, "Runtime surface evidence reports generated", "ALL 1 GATES GREEN."
  provenRed: true
