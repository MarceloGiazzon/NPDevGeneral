id: REG-205
title: >-
  B16 Step 1: AND-compose field.picker/bandPickers filters with a $root.<field> reference, and
  AND/OR-compose transaction.visibleWhen's $ui/$root predicates
type: GAP
severity: LOW
status: DONE
opened: 2026-09-03
closed: 2026-09-03
source: >-
  BOUNDARY_LIFT_PLAN_2026-09-02.md work package 4.3 (B16), wave 4 -- the last remaining Wave 4
  package. The plan's own text described this as "extend today's single-clause field == literal
  grammar -- shared by field.picker filter, visibleWhen, and query.where -- with AND/OR composition
  and parameterization by the current record's fields, in ONE grammar implementation so all three
  surfaces gain it together". Re-verifying that premise against live code (this session, before
  writing anything) found it stale in the same way section 1 of the plan document itself had already
  found eight OTHER premises stale: there are four separate, independently-implemented grammars, not
  one shared one, and two of the three named surfaces were already further along than the plan
  assumed. `query.where` (QueryPredicateGrammar) already had a v2 grammar (OR-groups, AND, IN,
  contains/startsWith, is-null, reference-path joins) wired end-to-end at both authoring-time
  validation and runtime execution since commit ef168b12 (2026-08-19), predating this plan --
  nothing to do there. Field-level `ui.visibleWhen`/`enabledWhen`/`readonlyWhen`/`requiredWhen`
  (business-ui-app.mustache's `evaluateWhen()`) already had a full OR/AND/parens grammar with
  sibling-field parameterization -- nothing to do there either. The two real gaps were
  `field.picker.filter`/`bandPickers.filter` (genuinely single-clause, zero parameterization by any
  other record -- the `$row.` prefix it accepted names the picker's OWN target row, not a reference
  to any other record) and `transaction.visibleWhen`'s `$ui`/`$root` predicates (genuinely
  single-predicate only, unlike the field-level grammar). Step 1 closes both.
surface: dsl/compiler+validation (query, compiler, validation packages), generator/emitters, generated-app client JS (2 mustache templates), schema, corpus, boundary register
