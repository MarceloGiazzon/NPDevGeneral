id: SEC-5
title: >-
  PluginIpcChildProcessPool now serves real production capability dispatch for plugin:java-source
  mounts -- SEC-4's design decision, implemented and live-fire verified
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-09-01
closed: 2026-09-01
source: >-
  SEC-4's own design-question resolution (2026-09-01, ledger/items/SEC-4.yml): both open design
  questions SEC-4 was filed to answer are resolved and recorded there (scope to plugin:java-source
  mounts only -- plugin:java-controller was considered and ruled OUT: a java-controller mount is a raw
  Spring @RestController wired directly by DispatcherServlet, with no CapabilityCall interception point
  at all, so it cannot be routed through this pool by this mechanism; productionize
  ManifestDrivenJavaSourcePluginHandler's shape rather than invent something new). SEC-4 closed DONE on
  that basis, with implementation carried forward here as separate, explicitly scoped work -- the user
  then chose to proceed with it the same session ("Go for SEC-4" -> design answered -> "Implement SEC-5
  now").
surface: runtimehost, plugin-execution, java-source plugin dispatch, NPDevGenerator RuntimeApiEmitter
files:
  - NPDevRuntimeHost/runtimehost-core/src/main/java/com/finalexec/npdev/service/pluginipc/PluginIpcChildProcessPool.java
  - NPDevRuntimeHost/runtimehost-core/src/main/java/com/finalexec/npdev/service/pluginipc/PluginIpcChildProcess.java
  - NPDevRuntimeHost/runtimehost-core/src/main/java/com/finalexec/npdev/service/pluginipc/PluginIpcChildProcessMain.java
  - NPDevRuntimeHost/runtimehost-core/src/main/java/com/finalexec/npdev/service/pluginipc/PluginIpcCapabilityHandler.java
  - NPDevRuntimeHost/runtimehost-core/src/main/java/com/finalexec/npdev/service/pluginipc/ManifestDrivenJavaSourcePluginHandler.java
  - NPDevRuntimeHost/runtimehost-core/src/main/java/com/finalexec/npdev/service/ArtifactLocalJavaSourceCapabilityHandler.java
