id: IMP-GAPS-1
title: >-
  The importer recovers about half the hand-built WmsOffice concepts, most enums (after IMP-2) but few field names and few references; what remains is a rename policy, entity merging and a second, non-GeneXus source (IMP-4)
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-10-21
closed: 2026-10-24
source: >-
  IMP-3 scorecard: npdev import score, draft from the 56-table WmsOffice DDL (WmsLabs_CreateTables.html loaded into H2) against
  AppGen/apps/_official/WmsOffice/definition/model.json. Numbers as measured, importer not tuned to the oracle.
surface: NPDevGenerator/generator importer, NPDevCli import score
detail: |
  Measured 2026-10-21, importer not tuned to the oracle (npdev import score, draft from the 56-table WmsOffice DDL;
  enriched by npdev import genexus against the two GeneXus exports).
  After IMP-1 (database only): concepts 14 matched of 56 drafted / 26 in the oracle (precision 0.25, recall 0.54);
  fields of matched concepts recall 0.06 exact, 0.36 with prefix matching (the importer keeps the legacy column
  prefix, armNome, where the hand-built model says nome); references 12 of 22 between matched concepts (52 in the
  oracle); enums 0. 12 oracle concepts have no counterpart: the hand-built model merged, split or renamed legacy tables
  (CrossDocking, DocumentoFiscal, Romaneio, ...), which neither the database nor the GeneXus export can say.
  After IMP-2 (npdev import genexus): concepts, field and reference numbers unchanged (it does not touch names or
  keys). Enums: 9 of the 12 oracle enum fields in matched concepts are found by field name, 4 of those with identical
  value sets, mean value recall 0.737; the draft makes 82 enum fields against 17 in the oracle (the legacy model
  enumerates far more domains than the hand-built one kept). Captions: 643 of 646 columns got a ui.label, the
  validator's warnings went 695 -> 3 (the 3 left are a concept and two fields with no GeneXus counterpart).
  Transactions: 32 of 34 map to tables (74 levels, 72 mapped; SisArqTemp and Momentum have no table with their key
  set). Domains: 87 in the export, 64 enumerated, 82 fields converted, 0 skipped. Rules: 150 statements, 124 are
  parameter binding or screen behaviour (dropped by design), 3 invariant candidates translated (unverified), 3
  source-only, 3 default candidates, 17 manual. Manual-port inventory with source attached: 241 procedures, 92 web
  panels, 68 SDTs, 11 queries (40 subtype groups counted only).
  Not done in IMP-2, on purpose: web-panel STUBS (the inventory lists the 92 panels with their event source; a stub
  needs bindings the export does not carry); rule candidates are never applied to the model. An enum field stores
  the NAME while the legacy column stores the CODE, so a data load must translate (legacyCodes in the report).
  Also found: the platform's technology-neutrality rule (ExpressionValidation.FORBIDDEN_TECH_KEYWORDS) rejects a name
  that merely CONTAINS rest/jpa/smtp/..., so ordinary words such as Portuguese "Restricao" fail validation; the importer
  works around it by splitting the word (ruaRecRe_stricao) and listing it under namingAdjustments. The rule itself is
  arguably too blunt (substring, not word); changing it is an owner decision.
  IMP-4 (2026-10-22), second source, two public non-GeneXus databases, DDL only, loaded into H2: Northwind (Postgres dump, 14 tables:
  90 of 92 columns mapped, 3 composite-key tables left for a human identity decision, model validates with 0 errors and generates)
  and Sakila (MySQL, 16 tables: 87 of 89 columns mapped, 2 composite-key tables, 0 errors, generates). What generalized: tables,
  columns, types, foreign keys to references, nullability. What did not: a native ENUM column is reported unmapped instead of
  becoming an enum field (film.rating, REG-280) and a BLOB column is unmapped; every concept and field still lacks a ui label
  (about 90 validator warnings each); composite keys need a decision. Sources and outputs: NPDev_General__OutsideRepo/imp4-sources.
  Validated on one GeneXus export plus (IMP-4) two public sample databases, which is still a small sample.
resolution: >-
  A field-prefix rename policy (propose the readable name, keep the legacy one in an alias) closes the field-name gap;
  entity merging stays a human decision; IMP-4 (a non-GeneXus source) and the owner's technology-neutrality ruling remain.
  Re-run npdev import score after each and record the new numbers here. IMP-2 itself (captions, enums, rule candidates,
  manual-port inventory) is done.
guard:
  kind: test
  ref: NPDevGenerator/generator/src/test/java/com/npdev/generator/importer/ImportRenamePolicyTest.java#theWholeTableNameOrItsSingularIsStrippedAtAnyLength
  asserts: >-
    a column spelling the whole table name (PerfilAlocacaoNome in PerfilAlocacao) or its singular, at any length, is
    stripped to the readable field name, and a table mixing both spellings (ExpedicaoItens / ExpedicaoItem) strips both
  provenRed: false
note: >-
  2026-10-22 owner rulings: the technology-neutrality name rule is now a warning (REG-281, done), so the importer keeps legacy names readable; a composite primary key gets a synthetic id plus a unique index on the original pair (done, DbIntrospectorTest). REG-280 native ENUM columns are now enum fields (done); audit columns (last_update, created_at ...) no longer make a link table look like it carries data (Sakila film_actor and film_category are pureLink proposals, auditFieldsIgnored in the report). Still open: field-prefix rename policy, entity merging (human). 2026-10-23 rename policy increment: npdev import db now applies ImportRenamePolicy (policy data in NPDevGenerator/generator/src/main/resources/npdev/importer/rename-policy.json, npdev-import-rename-policy.v1): the table's shared column prefix is stripped (first camel/underscore word on >= 60% and >= 3 non-FK columns, 2-6 letters, an in-order abbreviation of the table name), a single-column primary key is id, the only FK from a table to another table is {target}Id with the target concept singularized (Entidades -> entidadeId), several FKs to one target or a self-FK only lose the prefix; a collision, leading digit, empty or reserved result keeps the legacy name. renames[] {table, column, legacyField, field, rule} and counts.fieldsRenamed in the report; --rename-policy <file> / --no-rename (byte-identical to the previous draft) on IntrospectDbMain and npdev import db. GeneXusEnricher joins by the columns map, so captions, enums and rule translation follow the renamed fields (GeneXusEnricherTest). Proven by ImportRenamePolicyTest, DbIntrospectorTest, IntrospectDbMainTest. Not yet re-measured: npdev import score on the WmsOffice DDL needs the Windows machine; record the new field recall here. Still open after that: entity merging (human). 2026-10-24 (Windows): re-measured on the WmsOffice DDL (OutsideRepo imp5..imp7, sources D:/WorkSpace/WmsOffice/OriginalArtifacts). With the 2026-10-23 policy, fields of matched concepts went recall 0.06 -> 0.205 exact (0.36 -> 0.385 with affix): the 2-6 letter prefix guard skipped every column that spells the WHOLE table name (EntidadeNome, ProdutoNome, RecebimentoSituacao) and stripped only the first word of a two-word table (PerfilAlocacaoNome -> alocacaoNome). New policy key fieldPrefix.tableName (on in the shipped policy, off when a user's own policy file omits it): the table name or its singular, ending at a word boundary, is the prefix at any length, both spellings counted together (ExpedicaoItens mixes ExpedicaoItensQuantidade with ExpedicaoItemSeq). Result: 444 fields renamed (was 355), recall 0.346 exact / 0.397 with affix, precision 0.199; concepts 14/26, references 12/22 and enums unchanged; draft validates with 0 errors (same 3 warnings). Northwind and Sakila re-imported: 0 errors, no prefix renames (their columns share no table prefix). ImportRenamePolicyTest theWholeTableNameOrItsSingularIsStrippedAtAnyLength. What the remaining field misses are: hand-built names with no legacy column (ativo, crossDockingAtivo, pesoGramas, senhaHash) or deliberate renames, i.e. modelling, not naming. Closed per the resolution: the field-name gap has its policy, IMP-4 and the neutrality ruling are done, and entity merging (12 oracle concepts that merge, split or rename legacy tables) stays a human modelling decision the database and the GeneXus export cannot express -- not an importer task.
