id: PORT-4
title: >-
  The two documents a newcomer reads FIRST both linked to a five-release-old Manager installer, and
  the link still worked -- so anyone following the front page installed a build from 2026-08-06 and
  hit defects that were already fixed
type: BUG
severity: MEDIUM
status: DONE
opened: 2026-08-10
closed: 2026-08-10
verification: VERIFIED_LIVE
surface: docs/first-contact
source: >-
  Found while answering "what is the current state for a third party trying NPDev seriously" --
  by reading the install instructions as a stranger would, rather than by any gate.
detail: >-
  Same third-person family as PORT-1/2/3: a defect that costs the author nothing and costs a
  newcomer their first ten minutes.

    README.md:17        releases/download/beta1.7/NPDev.Manager_0.1.0_x64-setup.exe
    docs/MANAGER.md:59  the same URL, inside the numbered install steps

  `beta1.7` was published 2026-08-06 and was five releases behind (beta1.8 ... beta1.13) by the time
  this was found.

  WHY IT SURVIVED FIVE RELEASES: the link WORKS. GitHub serves an asset from an old tag forever, so
  there is no error, no 404, no signal of any kind. A newcomer installs an old Manager, hits defects
  that have since been fixed -- the tag-listing rate-limit crash, the java-home-agreement false
  failure, `db test-connection` reporting a wrong password as usable -- and concludes those are what
  NPDev is. Nothing in the product or the page tells them otherwise. A broken link would have been
  better, because someone would have reported it.

  This is not fixable by discipline. A version-pinned download link goes stale BY CONSTRUCTION on the
  very next release, and the release process has no reason to open prose files. Expecting whoever
  cuts a tag to also remember two markdown links is the same bet this repo has already lost on
  file-size claims, branch-freshness claims, and blocker citations -- each of which now has a gate.

  TWO MORE STALE CLAIMS in docs/MANAGER.md, found in the same read and fixed in the same change:
    * a note saying the Linux AppImage was "Not yet published as of 2026-08-07" -- beta1.12 and
      beta1.13 each ship a 79 MB `.AppImage` asset.
    * "Docker and PowerShell are never required" in the doctor's warn-row explanation. True for the
      three EMBEDDED engines; false for Postgres/MySQL/SQL Server, which NPDev runs as containers.
      A reader picking MySQL on that sentence's authority cannot start their database.
remediation: >-
  Both links now point at `/releases/latest`, which is correct forever and needs no editing. The
  AppImage note is replaced by the real caveat (verified in a container, not in a desktop session).
  The Docker row now states exactly which engines need it, with a new "The one prerequisite" section
  naming the three container images.

  The durable half: `scripts/quality/check-pinned-download-links.py` (AI-knowledge gate step 41/42)
  fails on any `releases/download/<tag>` or `releases/tag/<tag>` URL in README.md or docs/**.md.
  `/releases/latest` is explicitly not a pin -- it is the remedy. docs/RELEASE_PROCESS.md,
  BREAKING.md and docs/archive/** are excused because naming a specific release is their job.
  Calibrated: a pinned link fires, `/releases/latest` stays quiet, RELEASE_PROCESS.md is excused,
  and the generated defect register may quote the defect.

  THAT LAST CONTROL EXISTS BECAUSE THE CHECK FAILED ON THIS ROW. Minutes after being wired into the
  gate, it fired on docs/OPEN_ITEMS.md:380 -- the generated register, quoting the very URL this item
  forbids. PROSE ABOUT A DEFECT IS NOT THE DEFECT, and that sentence had to be learned three times
  in one day: twice by check-out-of-tree-generation.ps1 (a gradle.properties comment and a
  Create-Environment.ps1 comment, each explaining why a path must not be hardcoded) and once here.
  Any checker that greps for a bad string will eventually flag the document explaining why the
  string is bad. The fix is to excuse the record explicitly and say why -- never to make the record
  lie so a linter stays quiet.
files:
  - README.md
  - docs/MANAGER.md
  - scripts/quality/check-pinned-download-links.py
