id: REG-323
title: >-
  Use a browser AI, F4: answers that carry more than model.json -- fragments, element upserts for big models, themes, hand-made
  pages, config proposals, quarantined code -- are accepted by the policy but not by apply, undo or the composer
type: GAP
severity: LOW
status: OPEN
opened: 2026-11-10
source: >-
  Browser-AI relay plan (D:/WorkSpace/NPDev/NPDev_General__OutsideRepo/BROWSER_AI_RELAY_PLAN_2026-11-09/impl/TASKS.md, F4) after F0-F3
  landed; nothing here was started except T4.6's CLI half (REG-322).
surface: cli/relay, manager/browserai
files:
  - NPDevCli/relay-ingest-policy.json
  - NPDevCli/npdev_relay_apply.py
  - NPDevCli/npdev_relay_engine.py
  - NPDevCli/npdev_relay_files.py
  - NPDevCli/npdev_relay_themes.py
  - NPDevCli/npdev_theme_validate.py
  - NPDevCli/npdev_config_defaults.py
  - NPDevCli/npdev_relay_pages.py
  - NPDevCli/npdev_relay_seeds.py
  - NPDevCli/npdev_relay_config.py
  - NPDevCli/relay-config-allowlist.json
  - NPDevCli/npdev_relay_prompts.py
  - NPDevCli/relay-prompts.json
  - NPDevCli/relay-prompts-f4.json
  - NPDevCli/npdev_relay_preview_pt.py
  - NPDevManager/ui/browserai.js
detail: |
  Where things stand: relay-ingest-policy.json already lists the `f4` phase (allowed: npdev-elements.json, npdev-config-proposal.json,
  fragments/*.json, contexts/*.json, themes/*.json, web/*.html|css|svg; quarantine: capabilities/*, conversion-hooks/*, web/*.js|mjs),
  and a session carries a `phase` (default `mvp`; the Manager never passes another). What is missing is everything behind the list:
  - npdev_relay_apply.py writes ONE file (model.json) with ONE backup (the model as the AI was shown it) and undo restores that one
    file: a multi-file answer needs an all-or-nothing write and an undo of every file;
  - (DONE 2026-11-12, see below) there was no expander for `npdev-elements.json`, and the composer could not choose "whole file" vs
    "upsert" by `len(base model) > target outputBudgetChars * 0.6`; relay-prompts.json is BENCH-MEASURED: changing prompt text means
    re-measuring, and the bench compiles the generator from the repo, so never edit platform code while a bench run is on;
  - quarantined code (JS pages, Java capabilities) needs PLAN section 8.1's six steps: pattern scan, bytecode inspector, a strong
    acceptance (checkbox and a separate button), provenance `origin: browser-ai`, one-click removal, a second confirmation before a JS
    page becomes public. This is the security-sensitive part: do it last, with the owner.
  2026-11-11 T4.1 LANDED (apply, undo and validation of fragments/*.json + contexts/*.json): NPDevCli/npdev_relay_files.py holds the
  all-or-nothing write (plan -> save backup list -> run; a failure restores every file already touched, ABSENT = delete), the staged
  folder + the CLI's own composer the gate and the preview read, and the backup list undo reads (round entry `backupManifestPath`).
  Not done by T4.1: the composer still shows the AI model.json only -- for a split app the fragments' content is NOT in the prompt, so
  the AI cannot yet edit them; the briefing does not yet say fragments exist (relay-prompts.json is bench-measured: its own item); the
  Manager never passes phase f4; quarantined code is still never written. A multi-file apply is NOT needed by T4.2 (an upsert expands
  into one model.json).
  2026-11-12 T4.2 LANDED (the expander and its place in the pipeline; the composer's CHOICE is not done, see below):
  NPDevCli/npdev_relay_elements.py is a pure `expand(base, elements, policy, composed=None)`; an `npdev-elements.json` answer
  (phase f4, change/fix) is expanded in `npdev_relay_engine._expand_elements` into a synthetic model.json BEFORE desire paths, so
  validation, the authoring gate, the preview, apply and undo see an ordinary model and an upsert answer equals the whole-file
  answer (test). What may be upserted is the `elements` section of relay-ingest-policy.json: 20 root arrays whose elements REQUIRE
  `name` in model.schema.json (confirmed key by key; test_relay_elements pins the lists to the schema and fails when a new root
  array is not decided); 8 are whole-file-only with the reason shown to the AI (bindings, conversions, seeds, webhooks, autoPanels,
  contexts, fragments, packs). Cases absorbed, each with a finding and a test: key in the singular/another case, one element as an
  object, same element twice (last wins), unchanged element, an element that shrank to under half (an AI that thinks upsert
  merges; the gate still decides about removed fields), removal of a missing name (no-op), remove+upsert of one name (replace),
  rename with content / rename only / already applied / source missing / onto an existing name, an element kept in a fragment
  file (refused with the way out, never duplicated), a base that moved since the AI was shown it (BASE_MOVED, nothing guessed),
  both model.json and elements sent (the whole model wins, `elements-ignored`). Removals and renames of concepts are copied into the
  npdev-submission.json the gate reads, under whatever the AI sent; removing a concept still needs the owner's confirmation.
  NOT done by T4.2: (b) an element that lives in a fragment file cannot be upserted (the composer below shows the AI the fragment
  FILES instead, and the answer returns the whole changed file); (c) a field-level upsert inside a concept is not offered, by
  design (the schema says to upsert the whole concept); (d) the Manager never passes phase f4, so nothing user-visible changed.
  2026-11-12 COMPOSER LANDED (the second half of T4.1 and the CHOICE in T4.2): a phase-f4 change/fix now tells the AI what to send
  back. `npdev_relay_engine.f4_briefing` picks the mode and `start` returns it as `answerMode`: `files` (the app is made of several
  files: every fragments/ and contexts/ file is shown as it is, with how to return the changed ones; `modelChars`/`wholeFileFits` then
  describe the LARGEST single file; a reachable file that cannot be changed from here is named and left out), `upsert` (one file above
  60% of the answer budget: ask for npdev-elements.json instead of model.json, with the list names read from the policy), `whole`
  (everything else: no file list; since 2026-11-12 every f4 change/fix also gets `more`). The text is in its OWN file, NPDevCli/relay-prompts-f4.json, so relay-prompts.json -- bench-measured,
  its sha256 recorded by the bench -- is untouched and every prompt outside phase f4 is byte-identical to the measured one (test). The
  briefing is stored as base-f4.txt in the session folder so a fresh-chat prompt carries the same one. **THE f4 TEXT IS NOT MEASURED**:
  run the relay bench arm on a split app and on a model above the budget before the Manager ever passes phase f4 (and never edit
  platform Java while the bench runs).
  2026-11-12 T4.5 LANDED (config proposals): every imagined knob was LOCATED first and none lives outside model.json -- default language
  = settings.locale/settings.strings, date format = settings.ui.dateFormat, rows per page = settings.ui.pageRows, currency =
  presentationMetadata.currency, guide-page theme = guidePage.theme, time zone = a properties[] entry (no built-in setting),
  app display name = scenario.name, which is the app's IDENTITY and never changes from a chat; config.schema.json itself holds
  nothing a person would ask a chat AI to change. CORRECTED 2026-11-12 (found while doing T4.3a): the APP-WIDE theme choice is NOT
  in model.json -- `ui.theme.name` / `ui.theme.choices` are flat keys of config.json's `defaults` envelope (model.schema.json's
  settings.ui takes only pageRows and dateFormat); the `located` list now says so. They still earn no allowlist entry: no CLI command
  writes `defaults`. So NPDevCli/relay-config-allowlist.json had `entries: []` BY FINDING until T4.5b below (a knob needs
  an existing CLI writer: no writer, no knob), with the `located` list pinned to model.schema.json by test and the `neverAllowed`
  globs pinned against every sensitive leaf of config.schema.json. npdev_relay_config.evaluate sorts each change of an
  npdev-config-proposal.json into `suggestion` ("you can do that in Settings"), `refused` (never from a chat: value not echoed,
  nothing offered) or `applicable` (reserved; cannot occur while there are no entries); `result["configProposals"]` carries them, a
  `config-not-applied` finding per change, and NOTHING is ever written to the app (test: the app's file set is unchanged after
  apply). A malformed proposal is a warning and never blocks the model it came with. NOT built, on purpose: the apply step, the owner's
  tick on a preview line, the writer and its undo -- they are built WITH the first allowlisted knob, which needs a CLI command
  that writes it first. The proposal's Portuguese preview sentence is not translated (T2.2b: preview text is English-only today).
  2026-11-12 T4.3a LANDED (themes): `themes/*.json` is applied and undone like a fragment (npdev_relay_files.SUPPORTED) after
  npdev_relay_themes.check gives it the generator's own rules -- one file per theme named <id>.json, at most 20,000 bytes, valid
  JSON, not a built-in id, structure + WCAG contrast of the theme AS USED after basedOn (depth <= 3, no cycle), the failing colour
  pair named -- because ThemeEmitter fails generation of the whole app on one bad theme. The Python validator now lives in
  NPDevCli/npdev_theme_validate.py (one copy: scripts/quality/check-themes.py imports it; twin-pair rule
  theme-allowed-keys-four-place names it). A model.json that tries `settings.ui.theme` is sent back with the way out. A theme-only
  answer (model.json identical) is a change, not "nothing changed" (proved against the real Gradle gate). WHICH theme the app uses is
  config.json defaults ui.theme.name, which no chat can write: an unselected theme is saved with a `theme-not-selected` warning
  naming the setting, and `theme-added` / `theme-replaced` info findings say what happens. NOT done: (a) selecting the theme -- DONE
  by T4.5b right below; (b) pages `web/*.html|css|svg` -- DONE by T4.3b right below; (c) seed data
  (`seeds/*.json`) -- DONE by the seeds + menu slice below -- and translations (`settings.strings` already
  travels inside model.json: nothing to apply). The Manager never passes phase f4.
  2026-11-12 T4.5b LANDED (the first allowlisted knobs, with the apply step, the owner's tick and undo): `npdev config set-default`
  (NPDevCli/npdev_config_defaults.py, verb in npdev_cli.py) writes one flat key of config.json `defaults`; its PURE half
  `set_default_text` is the one writer the relay registers (`WRITERS["config-default"]`), so the relay never writes a file by itself.
  relay-config-allowlist.json now has two entries, `ui.theme.name` (type themeId: a theme that exists -- built-in, the app's, or in
  the same answer) and `ui.theme.choices` (themeIds: `*` or a comma list). An allowlisted proposal is `applicable` with a
  `confirmCode` (`config:<property>`); apply writes it ONLY when that code is confirmed (`--confirm-warning`), re-checking the value
  against the allowlist and the themes that exist NOW (the stored result is data, not authority), as one more op of the same
  all-or-nothing transaction -- order: fragments/themes, config.json, model.json last -- so the backup and undo already cover it.
  Unconfirmed = not applied, reported as `configSkipped` (not-confirmed / no-longer-allowed / no-config-file); a config.json that
  cannot take the change refuses the whole apply BEFORE any write (`config-write-refused`). An answer that only selects a theme is a
  change (authoring `_files_changed`). Works for change/fix and for a brand-new app (the scaffold's config.json). A proposal
  selecting a theme counts as the theme being selected (no `theme-not-selected`). The Portuguese preview sentence is not
  translated (preview text is English-only, T2.2b). NOT done: the Manager tick (the Manager never passes phase f4); other knobs
  (each needs its own entry, type and test); `ui.theme.mode`/`ui.density` are config defaults too and could get entries the same way.
  2026-11-12 T4.3b LANDED (hand-made pages): `web/*.html|css|svg` and `pages.json` are applied and undone like a fragment after
  npdev_relay_pages.check -- a web file named like a platform file (FinalAppAssembler's RESERVED_WEB_ASSET_FILES / _DIRECTORIES, which
  FAIL GENERATION of the whole app; the names are in relay-ingest-policy.json `pages` and pinned by twin-pair rule
  web-asset-reserved-names-two-place) is sent back naming the rule; a pages.json entry whose page was not sent is an error; a new
  page nobody links, a role the model does not declare, a page that loads from another site and a web/theme.css (restyles every
  screen) are warnings. pages.json is MERGED by path with the app's file at apply time (`pages_mod.prepare`, against the disk NOW; the
  AI usually sends only its new entry; the existing entries and any keys they carry are kept; an unreadable existing file stops the
  apply before any write: `pages-write-refused`). `web/orders.html` in an entry's path and a missing label are understood. A
  page-only answer is a change (`_files_changed`). CODE is still never accepted: ingest quarantined html with <script>/on*=/javascript:
  already, but an .svg was NOT scanned (a script in it walked past the JS quarantine) -- now `markupScan` covers svg and css
  (`expression(`, `-moz-binding`, `behavior:`, `javascript:`), reason `<kind>-has-script`. MOUNT: no caller mounted <app>/web by
  convention -- `generate app` only with --web-assets, and `_generate_phase_captured` (what `npdev dev` and `run` use, i.e. the
  Manager's way) never -- so `resolve_web_assets_root` now mounts `<model folder>/web` when the flag is absent in BOTH paths (a
  mistyped flag is still an error; the five NPDevSamples web folders were checked for reserved-name collisions: none). PROVED on a
  real `generate app` of a relay-made app (create + page + pages.json + theme + confirmed ui.theme.name): static/orders.html is in the
  app, workspace-menu-pages-seed.json has the PAGE entry, themes/index.json default is the chosen theme. NOT done: removing a page or
  a menu entry from a chat (nothing deletes files yet); watching web/, themes/ and pages.json in `npdev dev` (a relay apply rewrites
  model.json last, so it rebuilds anyway, but a hand edit of a page does not); `menu.json` (groups and nesting) and seed data (`seeds/*.json`) were not in the allowlist
  then -- both DONE by the next entry; running JS is T4.4. The Manager never passes phase f4.
  2026-11-12 F4 seeds + menu LANDED (sample data and the menu tree): `seeds/<id>.json` and `menu.json` are applied and undone like a
  fragment (npdev_relay_files.SUPPORTED, f4.allowed; phase mvp still denies both). SEEDS -- NPDevCli/npdev_relay_seeds.py checks them
  with seed.schema.json's and SeedDataService's own rules BEFORE any write: the `id` must equal the file name and a `label` must be
  there (an id that differs fails generation of the WHOLE app in stage_seeds_into_final_app), flat under seeds/, no unknown key (file or
  record), kind smart|raw, the concept must exist in the model (an error when the model is self-contained; a `seed-concept-unchecked`
  warning when packs/fragments/contexts may supply it), `seed-field-unknown` warning, a `$ref:` needs an alias declared EARLIER, a
  `$gen:` generator must exist and a `ref-pick-random` concept must be saved earlier, a raw seed cannot template (alias/repeatOver/
  count/$ref/$gen), `$file:` is refused (a chat cannot send the file), the bulk rules (repeatOver xor count, needs data, no alias/id),
  at most `seeds.maxExpandedRecords` rows (10000) and `maxFileBytes` (200000) in relay-ingest-policy.json. The lists there are pinned to
  seed.schema.json and to SeedDataService's switch by test_relay_seeds. Findings: seed-added / seed-replaced / seed-on-demand (it runs
  from "Load sample data", not at start). A seed-only answer is a change (JSON compare: re-indenting is not a difference). MENU --
  `menu.json` lives in npdev_relay_pages (is_page_file now includes it; the same check/changed/prepare seams, so apply/undo needed no
  new wiring): it is MERGED, never replaced, by the emitter's own node identity (kind + target, or kind + label for a header; a PAGE
  target compares without `web/`): a node already in the app is updated in place (keys the AI did not send are kept, children merged
  the same way), new nodes come last. Checked: kinds GROUP|BUSINESS|PAGE (INTERNAL is the seeder's marker row and is refused), a label,
  a PAGE/BUSINESS target, a PAGE node's page must be sent or already exist (error), a key the emitter ignores (`url`, `items`: warning),
  a BUSINESS target that is neither a concept nor a panel (warning, skipped when a pack/fragment/auto panel may supply it), a role the
  model does not declare (warning), depth <= 6 and <= 200 nodes (policy `pages.menu`); `web/orders.html` targets and a lower-case kind are
  understood (info `menu-normalized`); a page linked by menu.json, the answer's or the app's own, is no longer `page-not-in-menu`; an
  unreadable existing menu.json refuses the apply before any write (`pages-write-refused`, the pages reason). FOUND AND FIXED ALONG
  THE WAY: `npdev dev` and `run` (`_generate_phase_captured`, the Manager's way) never staged seeds at all -- only `generate app` did,
  the same trap `web/` had -- so they now call stage_seeds_into_final_app too, and a seed that is not JSON stops the phase with the
  reason instead of crashing it. Seeds are staged from the folder of config.json, which is the model folder for every app the relay
  makes. PROVED on a real `generate app` of a relay-made folder (model + config + seeds/demo.json + a nested menu.json + web/orders.html):
  data-seeds/demo.json + index.json are in the app, workspace-menu-pages-seed.json holds GROUP Shop -> BUSINESS Customer + PAGE
  orders.html (target normalised), static/orders.html is there. The app was NOT booted: "Load sample data" was never clicked and the
  menu never opened in a browser. Tests: test_relay_seeds (34) and test_relay_menu (30); 20 mutations each turned a test red (one survivor
  was found and its test fixed). NOT done: removing a menu node, page or seed from a chat; type-checking seed field VALUES (the write path does it and names the field);
  detecting that a seed repeats records already loaded (running one twice adds twice, by design).
  F4 PROMPT + MANAGER TICK (2026-11-12): the f4 prompt now teaches the files that are not the model. relay-prompts-f4.json gained `more`
  (themes/<id>.json with basedOn, web/*.html|css|svg with pages.json, menu.json, seeds/<id>.json, and npdev-config-proposal.json as the
  way to SELECT a theme) and `examples`; every f4 change/fix carries it after the files/upsert briefing (whole mode too: a small f4
  model's prompt is now the measured prompt PLUS `more`, and nothing else; mvp/create stay byte-identical). tests/test_relay_prompts_f4.py
  runs every example through the real checker (theme, config, pages+menu, seed), pins that every path the f4 policy allows is named in
  the text, and that the generator list and the 10,000-row cap are read from the policy. THE TEXT IS STILL UNMEASURED: the relay bench
  has not run on it, and the Manager still never passes f4. The Manager tick: ingest's `configProposals[]` items gain `text` (the
  sentence in the person's language: npdev_relay_preview_pt.config_item_text, English = `preview`); the browser-AI preview shows an
  applicable item as ONE OPTIONAL box (unticked, never gates Apply), a suggestion/refusal as a plain line, and Apply sends the ticked
  `config:<property>` codes through the existing --confirm-warning list (the Rust side already accepted that shape). The done sentence
  says the settings were applied when `configApplied` is non-empty. Tested: 5 new check-manager-ui-render.mjs checks, 3 new
  test_relay_config tests, 16 test_relay_prompts_f4 tests. NOT proved: Apply of a config change on the REAL Manager window (the render
  test stubs the CLI), and nothing was booted.
  F4 PROMPT MEASURED (2026-11-12): new bench arm scripts/ai/bench/relay_f4_arm.py (the relay arm only creates apps) plays the person
  for an f4 CHANGE through the real engine.start/ingest, 5 cases (whole / split / above-budget upsert x a look+page+menu+seed ask, a
  look-only ask, a data-only ask), each with and without the `more` text. ONE model (nvidia/nemotron-3-ultra-550b-a55b, free), ONE run
  per cell: a smoke test, not a pass rate. Result on the final text (f4-run-5): 4/5 complete in round 1, the upsert case READY without
  the theme selection. Control (previous f4 prompt, f4-run-4): no AI ever sent a theme/page/menu/seed, the look went into model.json,
  3/5 never READY. FOUND BY THE BENCH AND FIXED: (1) a repair follow-up in f4 said `files=2`, 'the COMPLETE corrected files' and, for
  PARTIAL, 'send model.json and npdev-submission.json, do not send other files' -> an AI fixing a theme contrast error resent only the
  theme and lost its page/menu/seed (now relay-prompts-f4.json `repair`/`repairPartial`, only for an f4 change/fix; every other phase is
  byte-identical); (2) for an app too big to send whole, a change that is only a look/page/menu/seed had no valid answer (the prompt
  forbade model.json and an empty npdev-elements.json was refused) -> `expand(allow_empty=)`: empty elements are accepted when the
  answer's other files are the change; (3) the AI invented theme colours (accentHover) and picked a status yellow at 3.04:1 -> the text
  lists the 13 colour names and says to send only the colours that change. Bench artifacts: <BuildRoot>/ai-bench/relay-f4/f4-run-{4,5}.
  NOT measured: another model, a chat UI, a second run, a non-English ask. The Manager still never passes phase f4.
  Suggested order (each its own commit, each behind phase f4): T4.2 element upsert (DONE above), T4.1 fragments (DONE, incl. composer),
  T4.5 config proposals (DONE, allowlist empty by finding), T4.3 themes/pages/seed/translations, T4.4 code quarantine (with the owner).
resolution: >-
  Done per impl/ACCEPTANCE.md section F4: fragment and upsert answers expand to the same model as the equivalent whole-file answer
  (test); a JS page with a `block` pattern and Java the bytecode inspector refuses cannot be accepted; an accepted program is marked
  origin: browser-ai and removable in one click; a JS page never goes public without the second confirmation; a config proposal for a
  property outside the allowlist is shown as "you can do that in Settings" and never applied; one large corpus app is changed through the
  relay without truncation and one hand-made page is created through it; T2 gates green.
