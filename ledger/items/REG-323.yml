id: REG-323
title: >-
  Use a browser AI, F4: answers that carry more than model.json -- fragments, element upserts for big models, themes, hand-made
  pages, config proposals, quarantined code -- are accepted by the policy but not by apply, undo or the composer
type: GAP
severity: LOW
status: OPEN
opened: 2026-11-10
source: >-
  Browser-AI relay plan (D:/WorkSpace/NPDev/NPDev_General__OutsideRepo/BROWSER_AI_RELAY_PLAN_2026-11-09/impl/TASKS.md, F4) after F0-F3
  landed; nothing here was started except T4.6's CLI half (REG-322).
surface: cli/relay, manager/browserai
files:
  - NPDevCli/relay-ingest-policy.json
  - NPDevCli/npdev_relay_apply.py
  - NPDevCli/npdev_relay_engine.py
  - NPDevCli/npdev_relay_files.py
  - NPDevCli/npdev_relay_themes.py
  - NPDevCli/npdev_theme_validate.py
  - NPDevCli/npdev_relay_prompts.py
  - NPDevCli/relay-prompts.json
detail: |
  Where things stand: relay-ingest-policy.json already lists the `f4` phase (allowed: npdev-elements.json, npdev-config-proposal.json,
  fragments/*.json, contexts/*.json, themes/*.json, web/*.html|css|svg; quarantine: capabilities/*, conversion-hooks/*, web/*.js|mjs),
  and a session carries a `phase` (default `mvp`; the Manager never passes another). What is missing is everything behind the list:
  - npdev_relay_apply.py writes ONE file (model.json) with ONE backup (the model as the AI was shown it) and undo restores that one
    file: a multi-file answer needs an all-or-nothing write and an undo of every file;
  - (DONE 2026-11-12, see below) there was no expander for `npdev-elements.json`, and the composer could not choose "whole file" vs
    "upsert" by `len(base model) > target outputBudgetChars * 0.6`; relay-prompts.json is BENCH-MEASURED: changing prompt text means
    re-measuring, and the bench compiles the generator from the repo, so never edit platform code while a bench run is on;
  - quarantined code (JS pages, Java capabilities) needs PLAN section 8.1's six steps: pattern scan, bytecode inspector, a strong
    acceptance (checkbox and a separate button), provenance `origin: browser-ai`, one-click removal, a second confirmation before a JS
    page becomes public. This is the security-sensitive part: do it last, with the owner.
  2026-11-11 T4.1 LANDED (apply, undo and validation of fragments/*.json + contexts/*.json): NPDevCli/npdev_relay_files.py holds the
  all-or-nothing write (plan -> save backup list -> run; a failure restores every file already touched, ABSENT = delete), the staged
  folder + the CLI's own composer the gate and the preview read, and the backup list undo reads (round entry `backupManifestPath`).
  Not done by T4.1: the composer still shows the AI model.json only -- for a split app the fragments' content is NOT in the prompt, so
  the AI cannot yet edit them; the briefing does not yet say fragments exist (relay-prompts.json is bench-measured: its own item); the
  Manager never passes phase f4; quarantined code is still never written. A multi-file apply is NOT needed by T4.2 (an upsert expands
  into one model.json).
  2026-11-12 T4.2 LANDED (the expander and its place in the pipeline; the composer's CHOICE is not done, see below):
  NPDevCli/npdev_relay_elements.py is a pure `expand(base, elements, policy, composed=None)`; an `npdev-elements.json` answer
  (phase f4, change/fix) is expanded in `npdev_relay_engine._expand_elements` into a synthetic model.json BEFORE desire paths, so
  validation, the authoring gate, the preview, apply and undo see an ordinary model and an upsert answer equals the whole-file
  answer (test). What may be upserted is the `elements` section of relay-ingest-policy.json: 20 root arrays whose elements REQUIRE
  `name` in model.schema.json (confirmed key by key; test_relay_elements pins the lists to the schema and fails when a new root
  array is not decided); 8 are whole-file-only with the reason shown to the AI (bindings, conversions, seeds, webhooks, autoPanels,
  contexts, fragments, packs). Cases absorbed, each with a finding and a test: key in the singular/another case, one element as an
  object, same element twice (last wins), unchanged element, an element that shrank to under half (an AI that thinks upsert
  merges; the gate still decides about removed fields), removal of a missing name (no-op), remove+upsert of one name (replace),
  rename with content / rename only / already applied / source missing / onto an existing name, an element kept in a fragment
  file (refused with the way out, never duplicated), a base that moved since the AI was shown it (BASE_MOVED, nothing guessed),
  both model.json and elements sent (the whole model wins, `elements-ignored`). Removals and renames of concepts are copied into the
  npdev-submission.json the gate reads, under whatever the AI sent; removing a concept still needs the owner's confirmation.
  NOT done by T4.2: (b) an element that lives in a fragment file cannot be upserted (the composer below shows the AI the fragment
  FILES instead, and the answer returns the whole changed file); (c) a field-level upsert inside a concept is not offered, by
  design (the schema says to upsert the whole concept); (d) the Manager never passes phase f4, so nothing user-visible changed.
  2026-11-12 COMPOSER LANDED (the second half of T4.1 and the CHOICE in T4.2): a phase-f4 change/fix now tells the AI what to send
  back. `npdev_relay_engine.f4_briefing` picks the mode and `start` returns it as `answerMode`: `files` (the app is made of several
  files: every fragments/ and contexts/ file is shown as it is, with how to return the changed ones; `modelChars`/`wholeFileFits` then
  describe the LARGEST single file; a reachable file that cannot be changed from here is named and left out), `upsert` (one file above
  60% of the answer budget: ask for npdev-elements.json instead of model.json, with the list names read from the policy), `whole`
  (everything else: NOTHING is added). The text is in its OWN file, NPDevCli/relay-prompts-f4.json, so relay-prompts.json -- bench-measured,
  its sha256 recorded by the bench -- is untouched and every prompt outside phase f4 is byte-identical to the measured one (test). The
  briefing is stored as base-f4.txt in the session folder so a fresh-chat prompt carries the same one. **THE f4 TEXT IS NOT MEASURED**:
  run the relay bench arm on a split app and on a model above the budget before the Manager ever passes phase f4 (and never edit
  platform Java while the bench runs).
  2026-11-12 T4.5 LANDED (config proposals): every imagined knob was LOCATED first and none lives outside model.json -- default language
  = settings.locale/settings.strings, date format = settings.ui.dateFormat, rows per page = settings.ui.pageRows, currency =
  presentationMetadata.currency, guide-page theme = guidePage.theme, time zone = a properties[] entry (no built-in setting),
  app display name = scenario.name, which is the app's IDENTITY and never changes from a chat; config.schema.json itself holds
  nothing a person would ask a chat AI to change. CORRECTED 2026-11-12 (found while doing T4.3a): the APP-WIDE theme choice is NOT
  in model.json -- `ui.theme.name` / `ui.theme.choices` are flat keys of config.json's `defaults` envelope (model.schema.json's
  settings.ui takes only pageRows and dateFormat); the `located` list now says so. They still earn no allowlist entry: no CLI command
  writes `defaults`. So NPDevCli/relay-config-allowlist.json has `entries: []` BY FINDING (a knob needs
  an existing CLI writer: no writer, no knob), with the `located` list pinned to model.schema.json by test and the `neverAllowed`
  globs pinned against every sensitive leaf of config.schema.json. npdev_relay_config.evaluate sorts each change of an
  npdev-config-proposal.json into `suggestion` ("you can do that in Settings"), `refused` (never from a chat: value not echoed,
  nothing offered) or `applicable` (reserved; cannot occur while there are no entries); `result["configProposals"]` carries them, a
  `config-not-applied` finding per change, and NOTHING is ever written to the app (test: the app's file set is unchanged after
  apply). A malformed proposal is a warning and never blocks the model it came with. NOT built, on purpose: the apply step, the owner's
  tick on a preview line, the writer and its undo -- they are built WITH the first allowlisted knob, which needs a CLI command
  that writes it first. The proposal's Portuguese preview sentence is not translated (T2.2b: preview text is English-only today).
  2026-11-12 T4.3a LANDED (themes): `themes/*.json` is applied and undone like a fragment (npdev_relay_files.SUPPORTED) after
  npdev_relay_themes.check gives it the generator's own rules -- one file per theme named <id>.json, at most 20,000 bytes, valid
  JSON, not a built-in id, structure + WCAG contrast of the theme AS USED after basedOn (depth <= 3, no cycle), the failing colour
  pair named -- because ThemeEmitter fails generation of the whole app on one bad theme. The Python validator now lives in
  NPDevCli/npdev_theme_validate.py (one copy: scripts/quality/check-themes.py imports it; twin-pair rule
  theme-allowed-keys-four-place names it). A model.json that tries `settings.ui.theme` is sent back with the way out. A theme-only
  answer (model.json identical) is a change, not "nothing changed" (proved against the real Gradle gate). WHICH theme the app uses is
  config.json defaults ui.theme.name, which no chat can write: an unselected theme is saved with a `theme-not-selected` warning
  naming the setting, and `theme-added` / `theme-replaced` info findings say what happens. NOT done: (a) selecting the theme -- it
  needs the first allowlisted knob, i.e. a CLI command that writes config.json `defaults`, then the apply step, the owner's tick on
  the preview line and the undo (T4.5b); (b) pages `web/*.html|css|svg`: NO caller of `npdev generate app` mounts <app>/web by
  convention (R10 made --web-assets explicit-only; only Build-NpdevApp.ps1 passes it), the page also needs a pages.json entry to
  reach the menu, and `themes/` is a reserved directory name of web assets -- so T4.3b is a mount decision first; (c) seed data
  (`seeds/*.json`, staged by the CLI from the model folder, not in the f4 allowlist) and translations (`settings.strings` already
  travels inside model.json: nothing to apply). The Manager never passes phase f4.
  Suggested order (each its own commit, each behind phase f4): T4.2 element upsert (DONE above), T4.1 fragments (DONE, incl. composer),
  T4.5 config proposals (DONE, allowlist empty by finding), T4.3 themes/pages/seed/translations, T4.4 code quarantine (with the owner).
resolution: >-
  Done per impl/ACCEPTANCE.md section F4: fragment and upsert answers expand to the same model as the equivalent whole-file answer
  (test); a JS page with a `block` pattern and Java the bytecode inspector refuses cannot be accepted; an accepted program is marked
  origin: browser-ai and removable in one click; a JS page never goes public without the second confirmation; a config proposal for a
  property outside the allowlist is shown as "you can do that in Settings" and never applied; one large corpus app is changed through the
  relay without truncation and one hand-made page is created through it; T2 gates green.
