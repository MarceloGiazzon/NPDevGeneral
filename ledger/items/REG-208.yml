id: REG-208
title: >-
  Every direct CompiledModel injection converted to ModelHolder; the standalone CompiledModel bean
  deleted so a stale-model regression now fails to wire at startup (boundary B28 -> LIFTED, PARTIAL)
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-09-05
closed: 2026-09-05
source: >-
  ALL_HITTABLE_LIFT_PLAN_2026-09-05.md package P4 (Wave 2, sequenced with P5 -- both rewire bean
  construction). B28.yml's own residue: only ModelHolder.get() consumers observed a reloaded model;
  every singleton constructed with a directly-injected CompiledModel at application-context startup
  kept the old one, a split-brain state the reload endpoint's own hard-stop javadoc warned against.
  The plan estimated 22 holder classes; real code held at least 35+ (both undercounted stale-list
  entries -- IdentityPackDriftItem/SchemaImpactFacade turned out to be pure functions needing no
  change -- and genuinely missing ones the plan's own file list never named, including
  SchemaLifecycleExecutor, FileUploadController, FileOrphanSweepService, and most ControlPanel/auth
  controllers).
surface: >-
  runtimehost-core + NPDevRuntimeHost app tree (config/controllers/services), plus a SEPARATE and
  previously unaudited surface: NPDevGenerator's own mustache templates for per-app GENERATED
  classes (com.npdev.generated.runtime.service.KernelFacade,
  com.npdev.generated.controllers.GeneratedQueryController) -- found only after the RuntimeHost
  gate's first clean pass against the fully-converted STATIC template still failed to boot, with a
  NoSuchBeanDefinitionException for CompiledModel four Spring constructor-resolution frames deep.
