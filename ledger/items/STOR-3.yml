id: STOR-3
title: >-
  MySQL and SQL Server dialects pass 13/13 Tier B vectors against REAL containers -- but neither is
  supported until that run is repeatable rather than a one-off manual dispatch
type: GAP
severity: MEDIUM
status: PARTIAL
opened: 2026-08-08
verification: VERIFIED_LIVE
surface: kernel/storage-dialect, generator/dbconfig, ci/storage-dialect-conformance
source: storage/PLAN.md S4b, S5 and S4a.
detail: >-
  MySqlDialect and SqlServerDialect are implemented, registered in SqlDialects, wired to new
  DatabaseEngine values (MYSQL, SQL_SERVER -- new VALUES on the existing storageMode axis, not a
  parallel concept), given JDBC URLs, drivers and default ports, and pinned at boot by
  StorageDialectInitializer from npdev.database.engine.

  That last piece matters more than it looks: without it, registering MySQL would have changed
  NOTHING. Every store falls back to SqlDialects.active(), which defaults to Postgres, so an app
  generated for MySQL would have booted happily and emitted Postgres SQL -- the silent-wrong-answer
  failure the whole seam exists to prevent, arriving through the back door.

  WHAT IS PROVEN
    - Tier A, 78 assertions, all four engines: clause text, declared parameter order, quoting,
      auto-increment spelling, capability declarations, and every refusal. Zero skips.
    - Tier B, 52 executions, 12 skipped with printed reasons: behaviour against a real connection --
      upsert idempotence, page non-overlap, JSON round-trip, reserved-word columns, DML rollback,
      auto-increment monotonicity, enforced uniqueness.
    - PostgresDialectGoldenSqlTest, 24 assertions (STOR-1).

  WHAT THE FIRST REAL RUN PROVED (2026-08-08, run 31264977219 at commit 5814886)

  The suite was dispatched manually for the first time. Read from the uploaded JUnit XML, per
  dialect -- NOT from the job status, which was red for all three jobs:

      dialect      passed  failed  seconds
      mysql            13       0     23.7    <- real MySQL 8.4 with utf8mb4
      postgres         13       0      8.3    <- no regression from the S1 seam
      sqlserver        12       1     21.4    <- one failure, a TEST defect (see below)
      h2                0      13      0.1    <- harness: no container exists for h2
                                     0 skipped

  The seconds column is what separates "the harness broke" from "the engine ran": h2 fails in 0.1s
  (an immediate throw, no database) while mysql spends 23.7s (container time). The failure TYPES say
  the same thing independently -- IllegalArgumentException for all 13 h2 cases,
  AssertionFailedError for the one sqlserver case.

  ZERO SKIPS. The twelve vectors that print a skip reason on the local H2 backend all executed,
  including T2 (DDL transactionality), Q2 (case sensitivity) and J2 (charset fidelity). That was the
  entire purpose of the workflow and it worked on the first run.

  J2 on SQL Server is the one real finding, and it is the vector's own bug: it hand-wrote
  VARCHAR(4000) in its DDL, and SQL Server's VARCHAR is non-Unicode, so 'cafe [coffee emoji]' came
  back as 'cafe ?' -- silent per-character loss. SqlServerDialect.portableColumnType already returned
  NVARCHAR(4000) and was never asked. The general lesson is bigger than the line: a conformance
  vector that writes its own DDL is testing its own SQL, which is exactly the trap PLAN.md §6 named
  for probe apps and Tier B then walked into.

  WHY THIS IS STILL PARTIAL

  The results are good; the PROCESS is not yet support:

    - the workflow is workflow_dispatch-only, so nothing re-verifies MySQL when a dialect changes --
      the next regression is found by a user
    - the container images are moving tags (mssql/server:2022-latest), so a future red cannot be
      told apart from "the image changed"
    - E1, E2, I2 and I3 need a realized schema (Tier C + the probe apps) and cannot run here at all
    - the MySQL DDL-implicit-commit decision (STOR-2) was reasoned about and is now exercised by T2,
      but T2 asserts the DECLARATION matches the engine -- the schema engine's behaviour under a
      half-applied migration is still unmeasured, and that is the one that corrupts data rather than
      failing loudly

  Two known gaps that are recorded rather than fixed:
    - SqlServerDialect.rowLimit() THROWS. SQL Server has no suffix row cap (TOP is a prefix; the
      suffix form needs an ORDER BY an existence probe has none of). The two probe call sites in
      PostgresPersistenceCapabilityAdapter must move to existsProbe() before SQL Server can run.
    - ConversionHookEmitter.portableSqlType() emits the H2/Postgres COMMON form because the emitter
      has no DatabaseEngine. That was already true; it stops being safe with a third engine (MySQL
      has no native UUID), and threading the engine in is a signature change MySQL cannot ship
      without.
resolution: >-
  PARTIAL.

  DONE (2026-08-08, storage/CONFORMANCE_FIX_PLAN.md):
    F0  corrected BREAKING.md and this item -- both said "never executed", which was true when
        written and had become false. A record that is wrong about its own evidence is worse than
        one that is merely incomplete, and this one was wrong in the UNDER-claiming direction.
    F1  the Tier B parameter source is backend-aware, so h2 is not asked for a container it has no
        image for. The throw in containerFor() STAYS as the backstop for a dialect someone registers
        and forgets to give an image -- that is the bug it was written for.
    F2  each CI job runs only its own engine (-Dnpdev.dialect.only), so a job's red/green finally
        means something about the engine in its name, and container work drops ~3x.
    F3  J1 and J2 take their column type from dialect.portableColumnType() instead of hand-writing
        VARCHAR(4000), plus an audit of every hand-written CREATE TABLE in the suite.
    F4  a per-dialect table is written to the job summary, so a run whose headline is red no longer
        hides a 13/13 pass inside an artifact.
    F5  DialectTestSupport prints one line per container start, so "did it really use a container?"
        stops being an inference.

  STILL OPEN, and what actually gates DONE:
    1. Promote the workflow to push triggers on the paths it already lists.
    2. Pin the container images to digests or fixed versions.
    3. Tier C: E1, E2, I2, I3 against the probe apps (NPDevSamples/probes, already built).
    4. Decide the two recorded engine gaps -- SqlServerDialect.rowLimit() throws, and
       ConversionHookEmitter has no DatabaseEngine to ask.
    5. Measure the MySQL DDL-implicit-commit behaviour against the real engine (STOR-2).
