id: STOR-3
title: >-
  MySQL, PostgreSQL and SQL Server each pass 13/13 Tier B vectors against REAL containers -- but
  none is supported until that run is repeatable rather than a manual dispatch of unpinned images
type: GAP
severity: MEDIUM
status: PARTIAL
opened: 2026-08-08
verification: VERIFIED_LIVE
surface: kernel/storage-dialect, generator/dbconfig, ci/storage-dialect-conformance
source: storage/PLAN.md S4b, S5 and S4a.
detail: >-
  MySqlDialect and SqlServerDialect are implemented, registered in SqlDialects, wired to new
  DatabaseEngine values (MYSQL, SQL_SERVER -- new VALUES on the existing storageMode axis, not a
  parallel concept), given JDBC URLs, drivers and default ports, and pinned at boot by
  StorageDialectInitializer from npdev.database.engine.

  That last piece matters more than it looks: without it, registering MySQL would have changed
  NOTHING. Every store falls back to SqlDialects.active(), which defaults to Postgres, so an app
  generated for MySQL would have booted happily and emitted Postgres SQL -- the silent-wrong-answer
  failure the whole seam exists to prevent, arriving through the back door.

  WHAT IS PROVEN
    - Tier A, 78 assertions, all four engines: clause text, declared parameter order, quoting,
      auto-increment spelling, capability declarations, and every refusal. Zero skips.
    - Tier B, 52 executions, 12 skipped with printed reasons: behaviour against a real connection --
      upsert idempotence, page non-overlap, JSON round-trip, reserved-word columns, DML rollback,
      auto-increment monotonicity, enforced uniqueness.
    - PostgresDialectGoldenSqlTest, 24 assertions (STOR-1).

  WHAT THE REAL RUNS PROVED (2026-08-08)

  Three dispatches. Every figure below is read from the uploaded JUnit XML, never from job status --
  which is the lesson the first run taught, since it was red on all three jobs while containing the
  best news of the day.

      run 31264977219 (commit 5814886) -- FIRST EVER, jobs red
      dialect      passed  failed  seconds
      mysql            13       0     23.7    <- real MySQL 8.4 with utf8mb4
      postgres         13       0      8.3    <- no regression from the S1 seam
      sqlserver        12       1     21.4    <- one failure, a TEST defect (see below)
      h2                0      13      0.1    <- harness: no container exists for h2
                                     0 skipped

      run 31268402414 (commit bec03b5) -- after F0-F5, ALL JOBS GREEN
      mysql            13       0     23.8
      postgres         13       0     10.8
      sqlserver        13       0     19.5
                                     0 skipped, h2 no longer selected

  39 vectors, three real engines, zero failures, zero skips. One engine per job (13 tests, not 52).

  The seconds column is what separates "the harness broke" from "the engine ran": h2 fails in 0.1s
  (an immediate throw, no database) while mysql spends 23.7s (container time). The failure TYPES say
  the same thing independently -- IllegalArgumentException for all 13 h2 cases,
  AssertionFailedError for the one sqlserver case.

  ZERO SKIPS. The twelve vectors that print a skip reason on the local H2 backend all executed,
  including T2 (DDL transactionality), Q2 (case sensitivity) and J2 (charset fidelity). That was the
  entire purpose of the workflow and it worked on the first run.

  J2 on SQL Server was the one real finding, and it was the vector's own bug: it hand-wrote
  VARCHAR(4000) in its DDL, and SQL Server's VARCHAR is non-Unicode, so 'cafe [coffee emoji]' came
  back as 'cafe ?' -- silent per-character loss. SqlServerDialect.portableColumnType already returned
  NVARCHAR(4000) and was never asked. Fixed in F3, along with J1, which had the identical defect and
  was passing only because its document is ASCII. The general lesson is bigger than the line: a
  conformance vector that writes its own DDL is testing its own SQL, which is exactly the trap
  PLAN.md §6 named for probe apps and Tier B then walked into.

  WHY THIS IS STILL PARTIAL

  The results are now unambiguous; the PROCESS is not yet support:

    - the workflow is workflow_dispatch-only, so nothing re-verifies any engine when a dialect
      changes. A green run is a snapshot, not a guarantee, and the next regression is found by a user
    - the container images are moving tags (mssql/server:2022-latest), so a future red cannot be
      told apart from "the image changed". This is now the PRIMARY reason the trigger has not been
      promoted -- pinning comes first
    - E1, E2, I2 and I3 need a realized schema (Tier C + the probe apps) and cannot run here at all
    - the MySQL DDL-implicit-commit decision (STOR-2) is now exercised by T2 against a real MySQL,
      and T2 passed -- but T2 asserts the DECLARATION matches the engine. The schema engine's
      behaviour under a half-applied migration is still unmeasured, and that is the one that
      corrupts data rather than failing loudly

  BOTH RECORDED ENGINE GAPS ARE NOW CLOSED (storage/FULL_SUPPORT_PLAN.md W1.3), fixed rather than
  accepted as boundaries -- so there is nothing to add under ledger/boundaries/:

    - SqlServerDialect.rowLimited() is a PREFIX rewrite (SELECT -> SELECT TOP n). The plan offered
      two options and said to find out which call sites need it before choosing. Measured: FOUR --
      two existence probes in PostgresPersistenceCapabilityAdapter, two first-by-order reads in
      JdbcEventStore -- and all four want "at most n rows", not a suffix. Suffix-vs-prefix is the
      engine's business, which is precisely what a dialect is for; pushing the question out to the
      call sites would have MOVED the engine switch rather than removed it, which SqlDialect's own
      javadoc names as the thing this seam must never become. rowLimit() -- the SUFFIX primitive --
      still throws, and that stays correct: there genuinely is no suffix form there. TOP is placed
      after DISTINCT (T-SQL's grammar is SELECT [ALL|DISTINCT] [TOP n]) and a CTE is REFUSED rather
      than mis-capped, since no string surgery can find its final select.

    - ConversionHookEmitter now takes the DatabaseEngine, threaded from GeneratorFacade, which
      already held the GeneratedDatabasePlan two lines above the call. The claim that this was a
      signature change MySQL could not ship without was right; the claim that it was structurally
      hard was not. It had been asking H2 unconditionally -- the narrower of the only two engines
      that existed -- and that stops being safe with a third (MySQL has no native UUID), in code
      that runs during a migration, on data.
resolution: >-
  PARTIAL.

  DONE (2026-08-08, storage/CONFORMANCE_FIX_PLAN.md):
    F0  corrected BREAKING.md and this item -- both said "never executed", which was true when
        written and had become false. A record that is wrong about its own evidence is worse than
        one that is merely incomplete, and this one was wrong in the UNDER-claiming direction.
    F1  the Tier B parameter source is backend-aware, so h2 is not asked for a container it has no
        image for. The throw in containerFor() STAYS as the backstop for a dialect someone registers
        and forgets to give an image -- that is the bug it was written for.
    F2  each CI job runs only its own engine (-Dnpdev.dialect.only), so a job's red/green finally
        means something about the engine in its name, and container work drops ~3x.
    F3  J1 and J2 take their column type from dialect.portableColumnType() instead of hand-writing
        VARCHAR(4000), plus an audit of every hand-written CREATE TABLE in the suite.
    F4  a per-dialect table is written to the job summary, so a run whose headline is red no longer
        hides a 13/13 pass inside an artifact.
    F5  DialectTestSupport prints one line per container start, so "did it really use a container?"
        stops being an inference.

  All six fixes verified in CI, not just locally: run 31268124428 proved F1/F2/F3 (three green jobs,
  one engine each, sqlserver 13/13), and run 31268402414 proved F5 after it turned out to have
  produced nothing at all the first time -- the container line was written, captured into the JUnit
  XML, and invisible in the log, because Gradle does not forward a forked test JVM's stdout.

  DONE SINCE (2026-08-08, storage/FULL_SUPPORT_PLAN.md) -- four of the five gating steps:
    1. Images PINNED to digests, in DialectTestSupport and in the workflow's own PINNED_* block,
       held together by check-container-images-pinned.py. Proven in run 31269774692. Two defects
       found doing it: `repo:tag@sha256:` is unparseable by Testcontainers 1.21.4, and MCR served a
       schema-1 manifest whose digest modern Docker cannot pull.
    2. Trigger PROMOTED to push/pull_request on the listed paths. Proven by run 31272122462, whose
       event is `push` and which nobody dispatched. The promotion carried its own trap: every matrix
       step was guarded on `github.event.inputs.engine`, which is EMPTY on a push -- the jobs would
       have skipped their real step and reported green having run nothing.
    4. BOTH engine gaps CLOSED (see above) -- not accepted as boundaries.
    5. MySQL's DDL-implicit-commit behaviour MEASURED at the shape a migration actually has:
       conformance vector T3, run 31271016482, 14/14 per engine with zero skips. The first attempt
       measured NOTHING on MySQL -- the plan's proposed failing statement (a NOT NULL column with no
       default, on a table with rows) SUCCEEDS there -- and only the vector's own guard caught it.

  STILL OPEN, and it is no longer a process objection:
    3. Tier C (E1, E2, I2, I3) has a driver and a CI job but has not passed: its seeding endpoint
       returns 404 for the p2 probe, which is a probe-shape question rather than an engine one.
    6. NEW, and the real blocker: STOR-5. The application-level probe -- the thing that had never
       run -- showed that no generated app could execute NPDev's own V1 schema-realization script on
       MySQL or SQL Server. Two causes are already fixed (STOR-4's missing JDBC drivers,
       keyableTextColumnType for indexed TEXT columns); the third, the Postgres/H2 guarded-DDL
       idioms in that script, is STOR-5 and is what now gates calling either engine supported.

  PostgreSQL IS proven at application level in the same run (31279857141): boots, non-BMP unicode
  round trip, filtered+ordered+paginated query, rows surviving a restart, and all six npdev doctor
  database checks green against a real engine.
