id: PACK-4
title: >-
  Pack version is declared and read by nothing
type: GAP
severity: HIGH
status: DONE
opened: 2026-08-12
closed: 2026-08-13
verification: UNIT_TESTED
source: >-
  Full-repo maturity audit 2026-08-12 (PACK-ROADMAP.md §1 ground truth, card PK-3). A pack.json's
  `version` field is schema-valid but only dslVersion equality is actually checked anywhere in the
  resolution pipeline -- version is inert data today.
surface: dsl/pack-versioning
files:
  - NPDevContract/schemas/pack.schema.json
  - NPDevContract/dsl/src/main/resources/schema/pack.schema.json
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/pack/PackVersion.java
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/pack/PackVersionConstraint.java
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/pack/MinimalVersionSelector.java
detail: |
  Closed by MASTER-ROADMAP.md Step 8 (PK-3, branch step8-pack-depth). `version` is now fully
  load-bearing, not just schema-valid: `pack.schema.json`'s `version` field is tightened to require
  `major.minor.patch` (verified safe against every real pack.json in the repo); a pack's own
  version is parsed into a structured `PackVersion` and compared against every constraint any
  other pack in the transitive graph placed on it via Minimal Version Selection
  (`MinimalVersionSelector`) -- a local copy whose version doesn't satisfy every collected
  constraint refuses by name. `npdev.lock`'s `resolvedVersion` field records exactly this
  MVS-selected value, and its `digest` field (a SHA-256 of the pack.json's own bytes) catches
  drift even when `version` itself wasn't bumped. This is a strictly larger scope than this
  item's own title named ("declared and read by nothing" -- it's now the load-bearing input to a
  real dependency-resolution algorithm, not merely "read").
guard:
  kind: script
  ref: "./gradlew :NPDevContract:dsl:test --tests com.npdev.dsl.v1.pack.MinimalVersionSelectorTest"
  asserts: a pack's own version is compared against every graph-wide constraint via MVS, refusing when unsatisfied
  provenRed: false
