id: PACK-6
title: >-
  A multi-hop pack upgrade skips intermediate renamedFrom declarations and destroys data
type: BUG
severity: P0
status: DONE
opened: 2026-08-12
closed: 2026-08-13
verification: VERIFIED_LIVE
source: >-
  Full-repo maturity audit 2026-08-12 (PACK-ROADMAP.md card PK-4). Filed at P0 deliberately -- it is
  the only entry in this batch that can destroy a user's data, and it will look like a successful
  migration when it does: a 1.0 -> 3.0 pack upgrade that skips replaying the 1.0->2.0 and 2.0->3.0
  renamedFrom chains produces a drop-and-add instead of a rename, silently losing every row in the
  affected column.
surface: dsl/pack-migration
detail: |
  See __OutsideRepo/strategy-2026-08-12/PACK-ROADMAP.md card PK-4 (npdev pack diff publish gate +
  migration chains). This absorbs ROADMAP.md's R12 (F3, MASTER-ROADMAP.md): the proof that a
  multi-hop upgrade replays the chain and preserves a real row IS the first checker that boots a
  generated app. MASTER-ROADMAP.md spine S5 (Step 11, milestone PM3 -- "a pack upgrade cannot destroy
  data", the guarantee the whole platform sells). Depended on PK-3 (Step 8) and R3/execution
  coverage (Step 9), both merged first.

  Closed 2026-08-13 (MASTER-ROADMAP.md Step 11, branch step11-pack-migration-chain) by PK-4 Stages
  C+D: `com.npdev.dsl.v1.pack.PackMigrationChain`/`PackMigrationComposer`/
  `PackMigrationChainSynthesizer` compose whatever hops separate an app's last-tracked pack version
  (`npdev.lock`'s new `migratedVersion`) from its target version and synthesize the `renamedFrom`
  markers the schema engine already consumes, wired into the real generate path
  (`PackDependencyGraphWalker.applyMigrationChains`).

  Proven live, not just unit-tested: `scripts/proofs/run-pk4-migration-chain-proof.py` runs a real
  generate->build->boot->seed->regenerate->build->boot->verify cycle against
  `NPDevSamples/probes/p5-migration-chain` (a real pack, not a plain model) -- `renamechain@1.0.0`
  with `Doc.code`, generated and booted, a row seeded through the real CRUD endpoint, then
  regenerated DIRECTLY to `@3.0.0` (skipping `@2.0.0` entirely, never generating it) -- and the row
  is readable as `Doc.docCode` afterward, its value intact. Plus the card's own RED control: delete
  the `1.0.0 -> 2.0.0` chain entry and regenerate again -- refuses, naming the exact missing hop,
  rather than silently dropping the column. All 4 combinations (2 phases x {H2, real Postgres
  container}) pass.

  Two real, previously-undiscovered bugs were found and fixed by this proof, neither catchable by
  JSON-level unit tests: (1) PK-2 bakes a pack's own major version into every concept's physical
  table name, and since a rename is BREAKING (Stage A) and BREAKING requires a major bump (Stage B),
  every rename-bearing hop ALSO crosses a table-identity boundary a field-level renamedFrom alone
  can't explain to the schema engine -- fixed by also synthesizing a qualified, table-level
  renamedFrom and giving `SchemaRealizationEmitter.conceptTableRename` a third trigger to consume
  it. (2) An untracked packId must not default to "already current" (that would silently skip
  replaying real history for a pre-existing database) -- fixed via
  `PackMigrationChain.earliestFromVersion()`. See the closing commit on step11-pack-migration-chain
  for full detail on both.

  Known, narrower, deliberately out-of-scope residual: if an UNTRACKED app's pack has a chain whose
  OWN earliest hop is itself missing/altered (as opposed to a middle hop, which correctly refuses),
  `earliestFromVersion()` can compute a later-than-true starting point and under-compose rather than
  refuse -- filed separately as REG-151, not blocking this closure since the roadmap's own RED
  control (a TRACKED app's chain losing a middle hop) is what's demanded and proven above.
guard:
  kind: script
  ref: "python scripts/proofs/run-pk4-migration-chain-proof.py --engine h2local"
  asserts: >-
    renamechain@1.0.0 -> @3.0.0 (skipping @2.0.0) preserves a real seeded row's value under its new
    column name after a real build+boot+regenerate+build+boot cycle, and deleting the chain's
    1.0.0 -> 2.0.0 entry makes the regenerate refuse naming the gap rather than silently drop the
    column -- both proven on H2 locally; the same script with --engine postgres (a real container)
    proved the identical result, the card's own two-engine requirement.
  provenRed: true
