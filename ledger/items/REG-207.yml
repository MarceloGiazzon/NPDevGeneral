id: REG-207
title: >-
  H2Local (embedded file) boot lock -- the last multi-process boot gap, closed with an OS-level
  file-lock sidecar (new boundary B31)
type: GAP
severity: LOW
status: DONE
opened: 2026-09-05
closed: 2026-09-05
source: >-
  REAL_LIFT_PLAN_2026-09-03.md's own final line item (section 6.1/1.1, "B4 -- nothing left to lift...
  close REG-7.2 and fix the row"), the last remaining piece of that plan per the user's standing
  directive to finish it in full. Re-verifying that instruction against live code (this session) found
  its own label was a red herring: REG-7.2 (Flyway's "found non-empty schema but no history table"
  error) and its documented residue are about a bookkeeping ROW going unwritten on a first-ever
  boot -- already fully reasoned through and explicitly decided NOT to need a sidecar (REG-200,
  2026-09-03, same day, "not worth a new file-lock sidecar... because MIGRATE_ONLY is the actual
  mitigation"). The REAL, still-open gap sits one layer earlier and is unrelated to REG-7.2: H2Local
  (embedded file, jdbc:h2:file:...) has zero multi-process boot protection, unlike every other
  engine/mode. This is genuinely new work, not a stale-premise no-op like this session's earlier two
  packages (C1/REG-206, C2/EDIT-18).
surface: runtimehost-core (db), B31 registry (ledger/boundaries, accepted-boundaries.json,
  docs/ACCEPTED_BOUNDARIES.md), NPDevCli boot-log classifier
