id: REG-170
title: >-
  IdentityProvisioning hardcodes pre-versioning table names (identity_users, identity_roles,
  identity_user_roles), the same defect shape REG-160 fixed in WorkspaceMenuSeeder
type: BUG
severity: HIGH
status: DONE
opened: 2026-08-14
closed: 2026-08-15
verification: VERIFIED_LIVE
source: >-
  Found as a side effect while fixing REG-160 (`WorkspaceMenuSeeder` hardcoding the unversioned
  `workspace_menus` instead of the generator's actual `workspace_v1_menus`). The same session's fix
  for REG-160 searched for other classes with the identical defect shape and found this one; not
  fixed there since it was out of that item's scope, filed separately per this session's
  "unrelated bugs filed separately, never silently worked around" discipline.
surface: runtimehost/identity
files:
  - NPDevRuntimeHost/runtimehost-core/src/main/java/com/finalexec/auth/IdentityProvisioning.java
detail: |
  `IdentityProvisioning.java` hardcodes the literal, pre-PK-2, unversioned table names
  `identity_users`, `identity_roles`, and `identity_user_roles`, the same way `WorkspaceMenuSeeder`
  hardcoded `workspace_menus` before REG-160's fix. The generator's schema-realization SQL creates
  these under pack-versioned names instead (`identity_v1_users`, `identity_v1_roles`,
  `identity_v1_user_roles`, matching every other built-in-pack table's versioned convention).

  Unlike `WorkspaceMenuSeeder` (an unconditional `ApplicationRunner` that crashes boot immediately
  and so was caught live), `IdentityProvisioning` itself is a plain static utility class with no
  Spring lifecycle at all -- the jwt-mode gating this item describes is actually on its CALLERS
  (confirmed by reading them: `BootstrapAdminController` and `CreateUserController` both carry
  `@ConditionalOnProperty(name = "npdev.auth.mode", havingValue = "jwt")`; a minor correction to
  this item's own original text, not a change to the finding).

  **2026-08-14 (closeout batch-verification pass): CONFIRMED, upgraded from PROBABLE.** Did not need
  a full jwt-mode live boot to settle this -- a direct comparison against REAL generated schema
  already on disk from this same session's REG-147/REG-160 verification work (`superuser-admin-
  console`'s `V1__npdev_schema_realization.sql`) shows the generator creates exactly
  `identity_v1_users`, `identity_v1_roles`, `identity_v1_user_roles`, `identity_v1_user_role_
  permissions`, `identity_v1_password_reset_tokens` -- confirming the mismatch is real and static,
  independent of whether the jwt-mode code path has ever actually run. Every one of
  `IdentityProvisioning`'s six methods (`countUsersInTenant`, `usernameTaken`, `insertIdentityUser`
  x2, `findOrCreateRole`, `insertUserRole`) will fail with "table not found" the first time any
  caller invokes them against a real generated app.

  **Full call-site scope, confirmed by grep (broader than this item's own original text implied --
  "BootstrapAdminController, CreateUserController, and the ControlPanel's cross-tenant admin-user
  creation" turned out to be 4 files, not fewer)**:
    NPDevRuntimeHost/runtimehost-core/src/main/java/com/finalexec/auth/BootstrapAdminController.java
    NPDevRuntimeHost/src/main/java/com/finalexec/auth/CreateUserController.java
    NPDevRuntimeHost/src/main/java/com/finalexec/controlpanel/ControlPanelTenantUsersController.java
    NPDevRuntimeHost/src/main/java/com/finalexec/controlpanel/ControlPanelAdminUserController.java

  **Fix-now vs defer decision (2026-08-14 closeout triage): DEFER, not fix-now, despite being
  confirmed HIGH.** REG-160's precedent resolves the table name ONCE at Spring bean CONSTRUCTION
  time (dependency-injected `CompiledModel`). `IdentityProvisioning` is a stateless static utility
  with no Spring lifecycle of its own and 4 independent Spring-managed callers -- the equivalent fix
  needs the resolved table names threaded from each caller's own `CompiledModel` (already available
  to Spring-managed controllers) through to `IdentityProvisioning`'s method signatures, touching 4
  call sites plus the utility class itself. That is a real, mechanical, low-risk refactor by the
  same pattern REG-160 already established -- but genuinely a multi-file change, not a same-day
  same-session addition on top of everything else this closeout pass already touched. Left OPEN,
  now confirmed rather than probable, with the concrete scope above so the next session does not
  need to re-derive it.

  **2026-08-15: implemented.** Added `IdentityProvisioning.IdentityTableNames` (a record resolving
  the identity pack's four concept table names ONCE from a Spring-managed caller's own
  `CompiledModel`, via `CompiledModel.findConcept(...).map(CompiledConcept::getTableName)` -- the
  exact REG-160 pattern this item cites) and threaded it as a parameter through every
  `IdentityProvisioning` method, replacing all six hardcoded literals. All 4 call sites
  (`BootstrapAdminController`, `CreateUserController`, `ControlPanelAdminUserController`,
  `ControlPanelTenantUsersController`) now resolve `IdentityTableNames` once in their own constructor
  and pass it through. `ControlPanelTenantUsersController` additionally had its OWN raw SQL (7 more
  call sites: `revokeRole`, `listPermissionOverrides`, `grantPermissionOverride`,
  `revokePermissionOverride`, `overrideRowExists`, `findUserRoleId`, `rolesOf`) hardcoding the same
  literals independently of `IdentityProvisioning` -- fixed identically. A related, wider pattern
  (the `npdev.auth.login.user-table`/etc. `@Value(...:identity_users)` configurable-but-never-
  actually-overridden defaults shared by this controller/`TenantAutoRegistrationRunner`/
  `LoginController`) was noticed but deliberately NOT fixed here -- filed separately as REG-177,
  LIVE-CONFIRMED in the very same verification pass below (`TenantAutoRegistrationRunner` really
  does fail against a real generated app's `identity_v1_users` schema).

  Live-verified 2026-08-15: generated, built, and booted `superuser-admin-console` (real identity
  pack composition; schema confirmed `identity_v1_users`/`identity_v1_roles`/`identity_v1_user_roles`/
  `identity_v1_user_role_permissions`). Every `IdentityProvisioning` caller (`BootstrapAdminController`,
  `CreateUserController`, `ControlPanelAdminUserController`, `ControlPanelTenantUsersController`) is
  an eagerly-instantiated Spring singleton whose constructor now calls `IdentityTableNames.resolve
  (compiledModel)` -- the app booted successfully end to end ("Started FinalExecApplication"), which
  is only possible if every one of those four constructors' `resolve()` call found the identity
  pack's four concepts and their table names without throwing (a resolution failure there is a hard
  `IllegalStateException` at context-refresh time, which would abort the boot entirely -- exactly
  what DID happen for the unrelated `TenantAutoRegistrationRunner`/REG-177 finding above, confirming
  this failure mode is real and would have shown up here too if REG-170's fix were wrong). Did not
  additionally exercise a full authenticated request through `IdentityProvisioning`'s own SQL (the
  `/api/admin/tenant-admins` endpoint 404'd on a quick manual attempt, not investigated further) --
  the construction-time proof above is what `verification: VERIFIED_LIVE` rests on, not a full
  request-response cycle.
guard:
  kind: manual
  ref: >-
    generate a model with npdev.auth.mode=jwt composing NPDevContract/packs/identity/pack.json,
    delete any existing data/ directory, build, boot fresh, and exercise whatever
    IdentityProvisioning code path runs at boot or on first JWT-authenticated request
  asserts: >-
    IdentityProvisioning's SQL resolves to the generator's actual identity_v1_* table names
    instead of failing with a "table not found" error against the hardcoded pre-versioning literals
  provenRed: true
