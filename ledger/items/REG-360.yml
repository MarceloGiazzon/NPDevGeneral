detail: |
  Evidence: 16 PNGs of the first capture and the verification routines (make_verify.py, verify-reg360-*.json, the per-job result.json) in NPDev_General__OutsideRepo/ride-hailing-gallery (not in the repo). Every fix below was
  SEEN in a live ride-hailing app (run-ride-hailing.ps1 -Stages setup,offer,pay -KeepRunning, fresh generate + build + boot, 42 PASS / 0 FAIL each time), read through a browser routine or the REST API.
  (b) Payment.amountCents showed 1039.2474. CAUSE: fareFor returned `(300 + 120 * km + 25 * minutes) * surge` with no rounding and Ride.fareCents, then Payment.amountCents, inherit it (it is sent to the payment
     provider as `amountCents`). FIX: `round((300 + 120 * km + 25 * minutes) * surge, 0)` in the sample. PROOF: drive_s2.py stage pay asserts "Payment.amountCents is a whole number of cents"; on the pre-fix model passed
     through -ModelFile (tracked job bvqyjv) that check FAILS with 1039.2474 and is the only failure (41 PASS); on the fixed model 42 PASS (job 1d3qb8). The list now shows 1039.
  (f) The Rider create form offered Rating Avg, Rides Requested, Cancels By Rider (rollup targets) and Cancel Rate (a derivedExpression field) as inputs. CAUSE: BusinessUiEmitter marked a field read-only only for the id
     (`readOnly = field.isId()` at two sites), and the browser's formFields() -- shared by the create/edit form, the CSV import and the bulk edit -- filters on that flag. FIX: isReadOnlyInForms() also answers true for a
     derivedExpression field and for any field named by the concept's rollups[]; lists and detail views are not affected. PROOF: BusinessUiEmitterSystemKeptFieldsTest, 2 tests, red on the old emitter ("a rollups[] target is
     kept by the platform, not typed ==> expected true but was false") and green on the new; and live, the Rider form's controls are now exactly name, phone, account, paymentToken.
  (a) and (c) share ONE cause. A reference field with no declared label shows the target's first three filterable non-id fields (BusinessUiEmitter.effectiveReferenceDisplayFields). For Ride.rider that was name, account,
     paymentToken -- a credential-shaped value in a label (a). For Payment.ride and RideOffer.ride it was cancelledBy, currentOfferId, distanceMethod -- so the "Ride" cell of a payment showed the id of the OFFER
     (be72085e-... / road), which is why it matched none of the listed Ride ids (c); the data was right, the label was built from system fields. FIX: `reference.previewFields` in the sample (the keyword lives in the
     `reference` object of model.schema.json, not in `picker`): Ride.rider ["name","account"], Payment.ride and RideOffer.ride ["riderAccount","status"]. LIVE: the Rides list shows "Rider1 / rider1", a payment's Ride
     cell "rider1 / COMPLETED", an offer's "rider2 / NO_DRIVER". NOT changed: the inference itself still picks the first three filterable fields for any model that declares nothing; a rule "a label must not carry a
     payment token" has no check.
  (e) One list mixed "...Z" and "...-03:00" for the same kind of instant, and the single-record read disagreed with the list (list "12:33:11.08068-03:00", item "15:33:11.08068Z", same row). CAUSE: H2Dialect did not
     override readValue, so the list path handed back the OffsetDateTime exactly as the driver read it, and H2's TIMESTAMP WITH TIME ZONE keeps the offset a row was written with (a row written one way comes back in the
     JVM's -03:00, one written another way in Z); the single-record path normalises to UTC. Which write path produced which offset was NOT identified; the fix does not need it. FIX: H2Dialect.readValue respells every
     OffsetDateTime in UTC (same instant). PROOF: H2DialectReadValueTest, 3 tests, including a real in-memory H2 that writes one row with -03:00 and one with Z, shows the driver returns them with different offsets, and
     shows both read back in UTC. Not run red (the default readValue is the identity, so the first test cannot pass without the override). LIVE: for Ride and RideOffer, list and item are now identical and all in Z.
     SQL Server, MEASURED AND FIXED 2026-11-25 (owner away, "do what is needed"): SqlServerDialectReadValueTest builds the REAL mssql-jdbc class (microsoft.sql.DateTimeOffset.valueOf, no container) and shows the driver
     keeps the offset it is given (-180 min comes back as -03:00); the normalisation test was RED on the old dialect ("offset -180 min ==> expected Z but was -03:00") and is green after SqlServerDialect.readValue
     respells it in UTC (3 tests, same instant). Postgres and MySQL were not touched (MySQL's zoneless DATETIME is already restored as UTC; Postgres's driver was not measured). The Created At cell still shows the
     raw ISO string; formatting it for the reader is a separate UI matter.
  (d) The top-bar title said "Drivers" on the Rides, Payments and RideOffers pages of the dispatcher, and "Riders" on the Rider page of the admin. CAUSE: shell.js painted the logo from document.title, which the host rewrites to
     "<page> - <app>" on every render, at shell mount (a render that ran first fixed the wrong page into the logo) AND again in applyStaticTranslations() after the catalogue loads. FIX: business-ui-app.mustache passes
     `appName: state.manifest.appName` to NPDevShell.mount; shell.js keeps it and uses it at both places, falling back to document.title only when no host named the app (a hand-written page). PROOF: BusinessUiEmitterShellLogoTest,
     2 tests (content of the emitted assets); and live, a first build with only the mount-time half still showed "Drivers" (the second writer undid it), the complete fix shows "sample.ridehailing" on every page for both users.
     The name shown is manifest.appName, which BusinessUiEmitter (line 492) always sets from the model's namespace ("sample.ridehailing" for the sample). No model keyword sets a display name for the shell; a role
     experience's theme.logoText overrides the logo text (shell.js), which was not tried. A display-name keyword would be a DSL feature (it costs a keyword and a corpus example), NOT done and not decided.
  Checks: check-ui-i18n OK (957 ids, no new literal), twin-pair 60/60, check-done-item-guards and ledger freshness clean, portable-tooling check passed. BREAKING.md has the entry.
