id: REG-360
title: >-
  Six things seen in the ride-hailing gallery screenshots (2026-11-24): a payment amount in fractional cents, system-kept fields offered as form inputs, a payment token and an offer id used as record labels,
  a top-bar logo that named the wrong page, and one datetime spelled two ways in one list -- all six fixed and each seen fixed in a live app
type: GAP
severity: LOW
status: DONE
opened: 2026-11-25
closed: 2026-11-25
verification: VERIFIED_LIVE
source: >-
  REG-356 item C, owner decision 7 (2026-11-24): the en/pt gallery was captured locally from a live ride-hailing app and six oddities were seen in the PNGs and left uninvestigated. REG-356's done_when
  says each leftover is "done and verified or recorded in its own item with a reason"; this item recorded them, and the owner then asked to finish the topic ("continue until finished") on 2026-11-25. Letters (a)-(f) are the ones used in REG-356.
