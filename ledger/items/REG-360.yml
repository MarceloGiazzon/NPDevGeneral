id: REG-360
title: >-
  Six things seen in the ride-hailing gallery screenshots (2026-11-24): a payment amount in fractional cents (fixed in the model), system-kept fields offered as editable inputs (cause found, platform fix not made),
  a payment token used as a record label, a stale top-bar title, mixed date formats and a Payment pointing at a Ride id not in the list (the last three not investigated)
type: GAP
severity: LOW
status: PARTIAL
opened: 2026-11-25
source: >-
  REG-356 item C, owner decision 7 (2026-11-24): the en/pt gallery was captured locally from a live ride-hailing app and six oddities were seen in the PNGs and left uninvestigated. REG-356's done_when
  says each leftover is "done and verified or recorded in its own item with a reason"; this is that item. Letters (a)-(f) are the ones used in REG-356.
surface: samples/ride-hailing, generator/business-ui, contract/dsl
files:
  - NPDevSamples/ride-hailing/Input/model.json
  - NPDevSamples/ride-hailing/drive_s2.py
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/emitters/BusinessUiEmitter.java
detail: |
  Evidence: 16 PNGs in NPDev_General__OutsideRepo/ride-hailing-gallery/artifacts (not in the repo). Each letter says what is MEASURED and what is only a HYPOTHESIS.
  (b) FIXED AND VERIFIED LIVE 2026-11-25. Payment.amountCents showed 1039.2474. Cause (read from the model): the function fareFor returned `(300 + 120 * km + 25 * minutes) * surge` with no
     rounding, Ride.fareCents is derived from it, and the flow copies it into Payment.amountCents, which is then sent to the payment provider as `amountCents`. Now `round((300 + 120 * km + 25 * minutes) * surge, 0)`
     (round(decimal, integer), half away from zero, is a stdlib function; surgeFactor already uses it). The model validates (run-fast-gate.ps1 -Tier T0 -ModelPath, tracked job wvx8cx, passed). The one
     acceptance check that recomputes the fare (drive_s2.py ~389) allows a difference below 1, and rounding moves it by at most 0.5, so it still passes.
     LIVE PROOF (run-ride-hailing.ps1 -Stages setup,offer,pay, each from a fresh generate + build + boot; each run took 3 to 4 minutes, not the 35 of the earlier all-stage run): drive_s2.py stage pay now
     asserts "pay: Payment.amountCents is a whole number of cents". With the fixed model (tracked job 1d3qb8, exit 0) 42 checks PASS, 0 FAIL. With the pre-fix model passed through -ModelFile (job bvqyjv,
     exit 1) 41 PASS and exactly one FAIL, that check, with the value 1039.2474 -- the number seen in the screenshots; the committed model was restored afterwards (git diff empty). So the check
     goes red on the defect and green on the fix. Only the pay-stage amount was proven; the price stage's fare formula check allows a difference below 1 and was not run.
  (f) CAUSE FOUND, PLATFORM FIX NOT MADE. The Rider create form offers Rating Avg, Rides Requested, Cancels By Rider (rollup targets) and Cancel Rate (a derivedExpression field) as editable inputs. The
     generator marks a form field read-only only for the id: BusinessUiEmitter.java lines 453 and 759 are `readOnly = field.isId()`. So a field the platform computes (derivedExpression, or the target of a
     concept `rollups[]` entry) is shown as an input a person can type into. What the server does with a value typed there was NOT checked. Proposed: read-only when the field has a derivedExpression or is a
     rollup target; it touches the emitter, the generated form, the UI contract and the generator tests, so it is its own change.
  (a) CAUSE FOUND, FIX NOT APPLIED. The Ride list's Rider column and the Payment source show "Rider1 / rider1 / tok_ok", a credential-shaped value in a label. BusinessUiEmitter.effectiveReferenceDisplayFields
     uses the field's picker previewFields, then the selector's displayFields, and otherwise the target's search fields, which default to the first three filterable non-id fields (here name, account,
     paymentToken). Ride.rider declares none of them. Proposed: `picker.previewFields: ["name"]` on Ride.rider (the keyword is in the field `picker` object of model.schema.json). The token in the model is a
     demo value ("tok_ok") and the field's description says a real app stores the provider's customer id, so this is a sample defect, not a leak; but the rule "a label must not carry a payment token" has no
     check. Not verified in a running app, so not applied.
  (c) NOT INVESTIGATED: the Payment's Ride label id (be72085e-...) is not one of the two Ride ids listed in the same capture. Possibilities, none checked: the list is scoped or paged, the label shows another
     field, or the capture mixed two runs.
  (d) NOT INVESTIGATED: in the Dispatcher (disp1) captures the top-bar title still says "Drivers" on the Rides and Payments pages (correct in the admin captures). Looks like a navigation or title-update
     path that depends on the role; needs a live repro in generated business-ui.
  (e) NOT INVESTIGATED: "Created At" mixes "...Z" and "...-03:00" in one list. createdAt has `defaultExpression: now()`; where the other form comes from (a flow write, the browser, the seed) is not known.
  Also still unexercised: the flaky acceptance check "driver2 stayed OFFLINE" (drive_s2.py ~559, stage experience), see REG-356 item C.
done_when: >-
  (b) is DONE (live proof above); (f) either the generator renders derived and rollup fields read-only (with a test) or the owner decides it stays; (a) the
  Ride list shows a name, not the payment token; (c), (d) and (e) are each reproduced and fixed, or shown not to be defects.
