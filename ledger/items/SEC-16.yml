id: SEC-16
title: >-
  Row-level write rule is evaluated against the PREVIOUS row only -- a coordinator can reassign a row out of
  their own scope, or create a child row under another coordinator's parent
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-10-29
closed: 2026-10-30
source: >-
  OWN-2 section 5.2 domain-fit simulation, 2026-10-28/29: a fresh agent given only the public docs and a
  clinical-trial site-visit scheduler (a domain never modelled here), not told what to build. Evidence:
  NPDev_General__OutsideRepo/evidence/2026-10-28-own2-sim/
surface: authz/row-level
detail: >-
  Simulation: with access.write = coordinatorUsername == $user.id, alice could update her visit to bob's
  coordinatorUsername (handing it away) and create a Visit attached to bob's Participant. The write check
  reads the stored row, not the row being written, and does not consult the referenced parent.
resolution: >-
  Done when the write rule is also evaluated against the NEW row on create/update (and a declared parent-scope
  rule is possible), with behaviour probes for both cases -- or an owner decision that records the posture.
files:
  - NPDevKernel/kernel/src/main/java/com/npdev/kernel/concepts/ConfiguredConceptGatewaySemanticPolicy.java
  - NPDevKernel/kernel/src/main/java/com/npdev/kernel/concepts/ConceptGatewaySemanticPolicy.java
  - NPDevKernel/kernel/src/test/java/com/npdev/kernel/concepts/ConfiguredConceptGatewaySemanticPolicyTest.java
  - NPDevSamples/dsl-conformance-max/behavior-probes/10-concept-field.json
  - docs/reference/ROW_LEVEL_AUTHORIZATION.md
  - BREAKING.md
verification: VERIFIED_LIVE
guard:
  kind: test
  ref: NPDevKernel/kernel/src/test/java/com/npdev/kernel/concepts/ConfiguredConceptGatewaySemanticPolicyTest.java#ownerCannotReassignARowOutOfTheirOwnWriteScope
  asserts: >-
    with access.write = "text == $user.id", alice saves a row owned by alice, then saves the same id with text
    "bob": the save is refused with ROW_SCOPE_DENIED and the stored row still says alice. Siblings: an edit that
    keeps the row in scope still succeeds, and a partial update that omits the owner field is judged on the row
    it produces (stored owner kept; an explicit foreign owner denied).
  provenRed: true
note: >-
  2026-10-29 reassign half DONE; parent-scope half OPEN. Not reproduced by the lead at filing (agent's report);
  reproduced here as a unit test first: isRowWritable used previousRecord().orElse(request.data()), so on an
  update the incoming data was never looked at, and the two new tests failed on exactly that (assertThrows at the
  reassign, assertFalse at the foreign-owner partial update). Fix: on update the rule must hold for the stored row
  AND for the stored row overlaid with the payload (the REST layer already passes the merged row, other callers a
  patch); create (payload) and delete (stored row) unchanged. Kernel suite green (28 policy tests, no failures in
  96 suites). Live: run-behavior-probes -Only 10-concept-field 27/27, including the new
  cf-concept-access-write-denies-reassigning-a-row-out-of-scope (403 ROW_SCOPE_DENIED, row unchanged, in-scope
  edit 200). The old probe cf-concept-access-read-hides-rows-outside-scope showed read-hiding by handing an order
  over with a PUT -- asserting the hole -- so it now uses a second identity (key_alice) instead. A scan of every
  corpus and AppGen model found no concept-level access.write rule that tests a field an update itself changes
  (all are role- or ownership-based), so nothing else needed changing. BREAKING.md entry and the
  ROW_LEVEL_AUTHORIZATION.md write bullet carry the new meaning. REMAINING: a child created under another
  coordinator's parent (Visit under bob's Participant, with the child's own coordinator field set to alice)
  still passes, because the rule reads one row. That needs a rule that can name the parent -- the cross-concept
  rules gap REG-317 already tracks -- or an owner decision that records the posture; close this item when either
  lands. Not run after the change: run-all-gates, RuntimeHost RowLevelAuthorizationAttackTest (needs the full
  RuntimeHost gate).
  2026-10-30 parent-scope half DONE -> item closed. parentField('ref','field') is now available in access.write
  (ConfiguredConceptGatewaySemanticPolicy.parentFieldsOf + UserScopedExpressions.ParentFields; model-time checks in
  ParentFieldValidation: quoted names, first a reference field of the concept, second a field of its target;
  refused in access.read and field-level rules). Fail closed on an unset/unknown parent. Tests:
  ConfiguredConceptGatewaySemanticPolicyTest (5 new, 2 proven red on old code), ParentFieldValidationTest (8 new, 6
  proven red without the wiring). Live: run-behavior-probes -Only 10-concept-field 28/28 including
  cf-concept-access-write-parent-scope-denies-child-under-another-owners-parent (403 ROW_SCOPE_DENIED for a
  second user on ShelfLayoutNote under the developer's shelf, nothing stored, keeper accepted, orphan refused). First
  probe design was wrong: the parent had access.read, so the reference check (run under the caller's read scope)
  gave 422 bond_target_not_found before the write rule; the example now hangs off ShelfLayout, readable by all.
  Docs: ROW_LEVEL_AUTHORIZATION.md, EXPRESSIONS.md, BREAKING.md.
