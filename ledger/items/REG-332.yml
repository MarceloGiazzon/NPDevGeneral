id: REG-332
title: >-
  A browser AI cannot use the NPR packs: an answer whose model imports a pack by `from` failed validation (no npdev.lock) and the
  briefing told the AI not to try
type: FEATURE
severity: MEDIUM
status: DONE
opened: 2026-11-11
source: >-
  Ride-hailing S2 plan, objective 9 (relay consumption of NPR packs); TASKS.md P1 + P2. Owner decision 2026-11-11: accept unsigned
  packs from the owner's own NPR temporarily (until 2027-02-28) so a chat AI can import them.
surface: cli/relay, cli/pack-trust, docs/authoring-for-ai
detail: |
  P1 (30a5f3ca): NPDevCli/pack-trust-defaults.json + _classify_pack_signature -- an unsigned pack whose source starts with a rule's
  `match` is accepted without --allow-unsigned until `until`; the lock records signature.acceptedBy; `enforce` apps still refuse.
  P2: the relay's staging step (npdev_relay_engine._validation_model_path) runs the CLI's own `pack update` INTO the staged folder when
  the answer's packs[] has a remote `from` the staged lock does not already cover, with allow_unsigned False -- only a real signature
  or the P1 rule lets a pack in. The resulting npdev.lock rides in the round's result as a `generated` file (answer_files returns it),
  so apply writes it beside the model inside the same all-or-nothing write and undo removes it. Failures are a plain NEEDS_FIX: no
  internet -> "This answer imports packs and NPDev could not download them (no internet)...", unknown/invented pack -> names it,
  unsigned outside the rule -> says it is not trusted (never mentions --allow-unsigned, the AI cannot pass flags).
  Briefing: the hand-pasted pack list and the "do NOT use packs[]" rule are gone from docs/content/authoring-for-ai.yml; the relay
  bundle gets a "Pack catalog" section generated from the NPR catalog (live fetch, else the local cache, else no section) by
  npdev_relay_engine.with_pack_catalog. Size: compact bundle 24,275 chars before, 23,650 after the contract edit, +1,498 for the
  generated 13-pack list = 25,149 chars (+874).
  STAND-IN ROUND 2026-11-18 (a free-tier Gemini plays the chat AI; the REAL relay engine composes, ingests, stages and validates; scripts in
  OutsideRepo/reg332-real-round): the prompt carried the generated Pack catalog (live fetch). With a generic "use the catalog parts" ask the AI ignored the
  `sales` pack and modelled everything itself (READY in 2 rounds, no packs[]). With the pack NAMED it copied the exact coordinate
  (git+https://github.com/MarceloGiazzon/NPR.git//packs/sales@sales-1.0.0) -- and the relay answered "NPDev could not download the pack(s) sales", after which the
  AI dropped the pack and was READY at round 3 without it. REAL CAUSE (reproduced with `npdev pack update`): the download works; the published sales-1.0.0
  pack.json fails the current schema ($.dslVersion must be '3.0.0'). The local NPDevContract/packs are migrated and newer (sales 2.0.0, approvals 1.2.1,
  contacts 1.1.0, helpdesk 1.2.0, identity 1.5.0, inventory 2.0.0, leave 1.2.1, purchasing 2.0.0, ...) but the public NPR still serves the old tags, so NO catalog pack
  can be imported through the relay today. FIXED here: the relay's message for that case (npdev_relay_files._pack_failure) now says the published copy does not match this
  NPDev's model format yet instead of "could not download" (test_relay_packs.py, 20/20). NOT fixable by a session: publishing the current packs to the public NPR
  (owner confirms each `npdev pack push --confirm-public <id>@<version>`; no local NPR clone exists on this machine). Until then done_when below cannot be met.
  PUBLISHED 2026-11-18 (owner: "pode publicar"): contacts-1.1.0, identity-1.5.0, products-1.0.0, sales-2.0.0, inventory-2.0.0, purchasing-2.0.0 are now
  on the public NPR (main synced with origin). `npdev pack push` needed a fix first: its probe app staged only the pack itself, so a pack with `packs[]`
  dependencies (sales, inventory, purchasing) failed ("cannot find packs/contacts"), then "no npdev.lock", then unbound role('x'); notification and
  tracing failed on an unprovided capability / undeclared property scope. npdev_relay_pack.stage_probe now copies the dependency packs from the pack's
  sibling folder, writes the npdev.lock (resolved version + sha256 of the bytes), binds every role('x') the staged packs name, and probe_model declares
  provides.capabilities / propertyScopes the pack needs. STILL UNPUBLISHED (need a version bump first, the local copy changed but kept the version the
  public tag already holds): workspace 1.1.0, tracing 1.0.2, notification 1.0.0 (patch bump), approvals 1.2.1 / helpdesk 1.2.0 / leave 1.2.1 (the gate
  says BREAKING, a major bump to 2.0.0 is required). project-tracker-demo 1.0.0 is unchanged.
  PUBLISHED 2026-11-18 (second batch, owner "Sim" to the bumps): workspace-1.1.1 (+ no-op migration "1.1.0 -> 1.1.1": [] -- the chain must reach the
  version), tracing-1.0.3, notification-2.0.0 (customCapabilities 'mailer' removed = BREAKING), approvals-2.0.0, helpdesk-2.0.0, leave-2.0.0; sample copies
  (dom-approvals, dom-helpdesk, dom-leave, path-a workspace) and the path-a / pigmentampas locks follow the new versions. Only project-tracker-demo stays at
  1.0.0 (unchanged). PROVEN against the real public NPR (scratchpad npr-import): a model importing contacts-1.1.0, products-1.0.0 and sales-2.0.0 by `from`
  runs `pack update` (lock written) and validates with 0 errors. NEW FINDING that still blocks done_when: importing ONLY sales by `from` fails with
  "packs/contacts/pack.json: path not found" -- a pack's own packs[] dependency resolves only from <model dir>/packs/<id>/pack.json, never from the
  catalog (documented in npdev_cli.py near _add_pack_from_catalog). So the relay briefing / pack catalog must make an AI list every dependency of a pack it
  imports (contacts + products for sales), or the relay must add them; neither exists yet.
  DEPENDENCIES 2026-11-19: (1) `pack build-catalog` / `pack publish --push` now write `needs: [ids]` on an index entry whose pack.json
  has packs[] (npdev_cli._scan_pack_catalog_entries); (2) the briefing's Pack catalog line then reads `- sales 2.0.0 [also import: contacts,
  products] - ...` with the rule once above the list (npdev_relay_engine.pack_catalog_text); (3) when the answer still misses one, the
  failure is no longer "could not download": npdev_relay_files._pack_failure names the missing ids and tells the AI to add each to
  packs[] -- a one-round fix. Reproduced against the real public NPR (model importing only sales-2.0.0): `pack update` fails with
  `...\packs\contacts\pack.json (<OS-localized "cannot find the path">)`, so the ids are taken from the `packs/<id>/pack.json` paths in
  the failure that do not exist beside the staged model, never from English wording. Tests: test_relay_packs.py (+2),
  test_pack_catalog.py (+1). THE PUBLIC INDEX STILL LACKS `needs` until the owner regenerates and pushes it (`pack publish --push`),
  so today only (3) is live.
  INDEX PUBLISHED 2026-11-19 (owner: "faça como se fosse eu"): NPR main 1613798 carries needs[] on inventory, purchasing, sales, user (verified
  through `gh api`). BUT FOUND: the NPR repo is PRIVATE (`gh repo view` -> PRIVATE; anonymous https://raw.githubusercontent.com/MarceloGiazzon/NPR/main/
  catalog-index.json -> 404). `pack search`, the relay's live catalog fetch (DEFAULT_PACK_CATALOG_URL, urllib, no credentials) therefore fall back to
  the local cache: a fresh relay briefing still lists the OLD index (approvals 1.0.0, no `[also import: ...]`). `git clone` of a pack works only with
  the owner's own git credentials, so no outside user could import an NPR pack today. Needs an owner decision: make NPR public (irreversible exposure),
  or serve the index/packs from somewhere anonymous. Stand-in Gemini round 2026-11-19 hung >12 min on one call and was killed (no result).
  NPR MADE PUBLIC 2026-11-19 (owner: "Tornar o NPR público"; content scanned first: only pack.json files, README, catalog-index.json, no credentials).
  Anonymous raw index -> 200 with 4 needs entries; a fresh relay briefing now lists the current catalog (approvals 2.0.0, sales 2.0.0
  `[also import: contacts, products]`, 5 markers). Remaining for done_when: the real chat-AI round on the owner's machine.
  STAND-IN ROUNDS 2026-11-19 after the public flip (Gemini free tier, real relay; it hangs >4 min on ~half the calls, runs killed by a watchdog):
  the AI imported sales + contacts + products together (needs[] works, pack downloaded and locked). NEW DEFECT found and fixed: the composer
  refuses ONE unbound pack role per run (salesManager, then salesRep, then accountant), so the AI spent a round per role. npdev_relay_engine.
  _unbound_roles_hint now appends one sentence naming EVERY role('x') the locked packs use that the answer does not bind
  (test_relay_packs.py UnboundRolesHintTests, 4 tests). Verified live: round 1 listed accountant/salesManager/salesRep, round 2 had them
  bound. The runs still ended NEEDS_FIX at 3 rounds (round 2: concept access rules; round 3: the weak model invented `sales::PriceList`),
  so READY through the relay is NOT yet shown even with the stand-in.
  BRIEFING IMPROVED 2026-11-19: the index entries now carry `concepts` (the pack's real concept names) and `roles` (the role('x') names it
  uses) -- npdev_cli._scan_pack_catalog_entries; the briefing line reads `- sales 2.0.0 - ... [also import: contacts, products]
  [concepts: Customer, SalesItem, ...] [roles: accountant, salesManager, salesRep]` and the section states three rules once (name concepts
  `<pack>::<Name>` exactly as listed; bind every listed role in provides.roleBindings in one answer; give every imported concept an access
  rule). Index republished to NPR (8087536). Section grew 921 chars (2,293 -> 3,214). Tests: test_pack_catalog (+1), test_relay_packs (+1).
  Stand-in round after this (session 5XSP, Gemini free tier, real relay): round 1 was a truncated reply, round 2 READY -- answer imported
  contacts + sales + products, the relay generated and accepted the npdev.lock (trust-defaults:own-npr-2026-11). One run only; the app was not
  built from it. Still needed for done_when: a real chat AI on the owner's machine and the app building with the pack.
  NOT done: `pack update` always clones (a cached pack is not reused offline) -- offline therefore fails with the sentence above
  even when the pack is cached; the catalog list itself does fall back to its cache. The real relay round with a real chat AI on the
  owner's machine (P2 "Verify") has not been run.
  REAL ROUND 2026-11-20 (owner's machine, Manager 0.13.40, "Use a browser AI" > Create a new app `SalesTest1`, ask naming the `sales` pack): chat AI =
  Gemini ("Hydrogen", medium effort), ONE round, READY on the first answer. NOTE: that chat had NPDev tools attached (the model's own account lists
  ~42,000 chars of NPDev tool calls/returns), so it may have iterated on its own before answering; the relay itself saw one answer. The proposal
  imported sales 2.0.0 + contacts 1.1.0 + products 1.0.0 with all three roles (salesRep, salesManager, accountant) bound in one answer plus one
  local concept (SalesTarget). Apply generated and built the app; "Open the app" opened http://localhost:8080/npdev-business-ui/ signed in as
  developer (ADMIN), menu showing Sales orders, Order lines, Customers, Price list, Invoices, Products, Organizations, Contacts, Addresses and
  Sales targets (owner screenshot). done_when met.
files:
  - NPDevCli/npdev_relay_files.py
  - NPDevCli/npdev_relay_engine.py
  - NPDevCli/tests/test_relay_packs.py
  - NPDevCli/pack-trust-defaults.json
  - docs/content/authoring-for-ai.yml
verification: VERIFIED_LIVE
guard:
  kind: test
  ref: NPDevCli/tests/test_relay_packs.py
  asserts: >-
    an answer with a remote pack is READY and carries the generated lock, apply writes it beside the new model, no internet /
    invented pack / unsigned outside the rule are NEEDS_FIX with the plain sentence, a model without packs never calls the pack
    machinery; a real git+file:// fixture through the real Gradle `pack update` is refused without the trust rule and accepted
    (acceptedBy recorded) with it.
  provenRed: false
done_when: >-
  A real chat AI's answer importing an NPR pack is READY through the relay on the owner's machine and the app builds with it.
