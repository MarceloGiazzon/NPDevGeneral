id: QUAL-2
title: >-
  Ten unclosed Files.list/walk/lines streams in NPDevRuntimeHost production services -- the same
  leaked-directory-handle defect that made the local generator gate permanently red
type: BUG
severity: MEDIUM
status: OPEN
opened: 2026-08-09
verification: NOT_VERIFIED
surface: runtimehost/services
source: >-
  storage/stabilize/STABILIZE_PLAN.md S1. Found by sweeping for the family after fixing the
  instance: ConversionHookEmitterTest line 128 called `Files.list(hooksOut).count()` without
  closing the returned Stream, which on Windows left the directory DELETE-PENDING and made JUnit's
  @TempDir teardown fail -- reported for long enough that it was believed to be "a Windows file-lock
  in the harness, not the test body". It was the test body.
detail: >-
  `Files.list`, `Files.walk`, `Files.find` and `Files.lines` all return a Stream backed by an open
  OS handle, and all four javadocs say the Stream must be closed (try-with-resources). The one in
  the generator test was fixed under S1; the sweep that followed found ten more, all in
  NPDevRuntimeHost MAIN source rather than tests:

      service/experimental/TemplateLibraryManagementService.java:54          Files.list
      service/FileRuntimePluginExecutionSummaryStore.java:94                 Files.lines
      service/internal/SemanticBehaviorWriteBackCanonicalizationService.java:57  Files.list
      service/internal/SemanticBehaviorWriteBackService.java:451             Files.list
      service/internal/TenantNativeGovernanceService.java:57                 Files.list
      service/internal/TenantOperationalAdministrationService.java:75        Files.list
      service/internal/TenantOperationalAdministrationService.java:221       Files.list
      service/internal/TenantOperationalAdministrationService.java:250       Files.list
      service/internal/WorkingDraftSystemService.java:440                    Files.list
      tenant/TenantPartitionRealityVerifier.java:63                          Files.walk

  Why this is worth an item rather than a quiet fix: the symptom is PLATFORM-DEPENDENT and delayed.
  POSIX permits unlinking a directory that is still open, so on Linux CI these leak a file
  descriptor and nothing else observable; on Windows the directory becomes undeletable (or
  delete-pending, which blocks its PARENT from being removed and names the parent in the error, not
  the leaked path). A generated app that runs long enough on Windows can therefore fail to clean up
  a tenant or draft directory for a reason whose error message points somewhere else entirely --
  which is exactly how the generator instance got misdiagnosed as a harness problem for so long.

  Deliberately NOT fixed in the same pass. STABILIZE_PLAN.md S4 freezes main from the release tag
  until the second machine reports, and states that anything discovered which does not block that
  machine goes to the backlog unfixed -- the point of the freeze being that the second machine
  tests one thing rather than a moving target. None of these ten is on the path a first-run user
  walks (create an app, build it, boot it, change a field): they are tenant-administration,
  working-draft and template-library services.
remediation: >-
  Wrap each in try-with-resources. Then consider whether a check belongs in the AI-knowledge gate:
  the family is mechanically detectable (a `Files.list|walk|find|lines` receiver whose enclosing
  statement is not a resource declaration), and this is now the second time it has been found by
  hand after causing a misattributed failure.
