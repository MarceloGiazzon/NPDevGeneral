id: REG-181
title: >-
  sync-runtimehost-libs.ps1 can leave a stale npdev-dsl-0.1.0.jar staged after a "successful"
  -BuildLocalJars restage, because NPDevContract/dsl is built and named two different ways by two
  different Gradle projects and the sync script's own jar-discovery only reliably tracks one of them
type: BUG
severity: MEDIUM
status: DONE
opened: 2026-08-15
closed: 2026-08-25
verification: VERIFIED_LIVE
source: >-
  Found while investigating a reported com.finalexec.controlpanel 404 (see REG-179's source note).
  Getting a real app to boot with REG-177's new IdentityPackTableNames class actually present
  required working around this bug by hand (building NPDevContract/dsl's own standalone gradlew jar
  directly) -- a normal `sync-runtimehost-libs.ps1 -BuildLocalJars` restage was not sufficient.
  Reopened 2026-08-25 (remediation plan W4.1): the 2026-08-15 fix was a mechanical patch to the sync
  script only, its own repro was never run, and the naming duality itself -- the item's own stated
  root cause -- was untouched.
surface: build-tooling/runtimehost-libs-sync
files:
  - scripts/runtimehost/sync-runtimehost-libs.ps1
  - NPDevContract/dsl/build.gradle
detail: |
  `NPDevContract/dsl`'s sources are compiled into a jar by TWO different, independent Gradle
  projects with two different DEFAULT artifact names: `NPDevKernel`'s and `NPDevGenerator`'s own
  `:dsl` subproject reference (`include 'dsl'` in each `settings.gradle`) falls back to the
  SUBPROJECT's own name ("dsl") for jar naming, producing `dsl-0.1.0.jar`, while
  `NPDevContract/dsl`'s OWN standalone build (`rootProject.name = 'npdev-dsl'`, its
  `settings.gradle`) produces `npdev-dsl-0.1.0.jar`. Two names for one artifact meant
  `sync-runtimehost-libs.ps1`'s jar-discovery scan could track one name's freshness while a stale
  copy sat unnoticed and unrefreshed under the other.

  2026-08-15 fix (kept, still correct): `-BuildLocalJars` also runs `NPDevContract/dsl`'s OWN
  standalone `gradlew jar` before the kernel/generator builds, guaranteeing `npdev-dsl-0.1.0.jar` is
  rebuilt from current source on every restage. This alone closes the STALENESS symptom but leaves
  the ROOT CAUSE (two names) in place -- both `dsl-0.1.0.jar` and `npdev-dsl-0.1.0.jar` still get
  discovered and staged side by side, duplicate classes on the classpath, and the class of bug
  remains latent for any future consumer that does not happen to get the standalone-build-first
  treatment.

  2026-08-25 fix (this pass, the item's own originally-flagged "deeper alternative"):
  `NPDevContract/dsl/build.gradle` now sets `base { archivesName = 'npdev-dsl' }` unconditionally.
  This is read by Gradle's `jar` task regardless of HOW the project is included -- standalone (where
  it was already the default via `rootProject.name`) or as a subproject (where it previously fell
  back to the subproject's own name). Verified directly: building `:dsl:jar` via
  `NPDevKernel/gradlew` now also produces `npdev-dsl-0.1.0.jar` (not `dsl-0.1.0.jar`) under
  `<build-root>/gradle/npdev-kernel/dsl/libs/`. There is now only ONE name for this artifact,
  produced identically by every build context that compiles it.

  LIVE-VERIFIED end to end (the guard that was never run in the 2026-08-15 pass): added a temporary
  canary method to `SemanticValidator.java` with a unique fingerprint string, confirmed via
  `unzip -p ... | grep` that it was ABSENT from the currently-staged `npdev-dsl-0.1.0.jar`, ran
  `sync-runtimehost-libs.ps1 -BuildLocalJars` with NO other manual `NPDevContract/dsl` build step,
  then confirmed via the same extraction method that the fingerprint WAS present in the freshly
  staged jar. Repeated with a second, differently-fingerprinted edit for an unambiguous result. The
  canary was then removed and the workspace restaged to a clean state (`git diff` on
  `SemanticValidator.java` confirms no net change).

  HONEST NOTE on method: an early verification attempt used `grep -a` directly against the (zip-
  compressed) `.jar` file, which can false-negative on a compressed entry -- corrected by extracting
  the `.class` entry first (`unzip -p ... > file.class`) before grepping its raw, uncompressed bytes.
  Recorded here because it produced a confusing false failure mid-verification before being caught.
guard:
  kind: manual
  ref: >-
    modify a class in NPDevContract/dsl (or add one), run `sync-runtimehost-libs.ps1
    -BuildLocalJars` with NO other manual NPDevContract/dsl build step, then extract
    `com/npdev/dsl/v1/.../<Class>.class` from the staged `npdev-dsl-0.1.0.jar`
    (`D:\WorkSpace\NPDev\Build\runtimehost-libs\npdev-dsl-0.1.0.jar`) via `unzip -p` and grep the
    raw bytes for the change -- grepping the `.jar` file directly is NOT reliable (compressed
    entries can hide a literal string match)
  asserts: >-
    the staged npdev-dsl-0.1.0.jar's class bytecode reflects the source change -- sync-runtimehost-
    libs.ps1 alone (no manual workaround) staged a truly current jar, and only ONE jar name
    (npdev-dsl-0.1.0.jar) is ever produced for this artifact regardless of build context
  provenRed: true
  provenRedNote: >-
    Measured directly, twice (two different fingerprint strings): before the sync-script run, the
    staged jar's extracted class bytes did not contain the new method/string; after running
    `sync-runtimehost-libs.ps1 -BuildLocalJars` alone, they did. The naming-unification half was
    separately measured RED-then-GREEN by building `:dsl:jar` via NPDevKernel's gradlew before and
    after the `archivesName` change (dsl-0.1.0.jar before, npdev-dsl-0.1.0.jar after).
resolution: >-
  Superseded by this item's own `detail` field above (2026-08-25 W4.1 closes what the 2026-08-15
  mechanical patch left open: the naming duality itself, plus the live end-to-end guard that patch's
  own `verification: NOT_VERIFIED` admitted was never run).
