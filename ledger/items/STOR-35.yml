guard:
  kind: test
  ref: NPDevRuntimeHost/src/test/java/com/finalexec/db/MigrationKillMidPhaseCrashResumeTest.java#aKilledMigrationResumesThroughTheDefaultSplitModeWithNoPropertySet
  asserts: >-
    A real child JVM is killed with Runtime.halt(137) mid-migration (phase 0 of the p75-multi mixed
    hook committed, the DML backfill never ran), and the next boot -- with NO mixedDdlVerify property
    set at all, asserted null both in the test JVM and in the forked child -- reaches split mode
    purely through the new default, runs exactly the 2 unfinished phases, skips the completed one
    (ran=2, resumedSkipped=1), and leaves every row backfilled with no data loss. This is the
    default-flip safety proof: the crash-resume claim holds for the default, not just the opt-in.
    The sibling H2Test pair #defaultModeFallsBackToWarnWhenTheSplitterBlocks /
    #explicitSplitStillRefusesWhenTheSplitterBlocks pins the fallback-vs-refusal design, and
    DialectConformanceTierATest#guardedDropColumnProducesAnIdempotentGuard pins the four engine
    syntaxes.
  provenRed: true