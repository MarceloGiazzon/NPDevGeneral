id: STOR-35
title: >-
  Mixed-DDL conversion hooks are split and journalled BY DEFAULT: npdev.schema.conversionHooks.
  mixedDdlVerify defaults to split (the splitter's vocabulary grew to DROP INDEX and DROP COLUMN via
  a new SqlDialect.guardedDropColumn), a splitter-blocked statement under the NON-explicit default
  falls back to the previous warn-and-proceed behavior with the named line B11:split_blocked_fell_
  back_to_warn: while an explicit =split still refuses (B11:mixed_ddl_verify_refused:), the
  crash-resume proof now runs with NO property set, the escape hatch
  -Dnpdev.schema.conversionHooks.mixedDdlVerify=warn restores the previous behaviour byte-for-byte
  (BREAKING.md entry shiped), and B11.4 was asked and answered by the owner (boundary B11 -> LIFTED)
