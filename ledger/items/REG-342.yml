id: REG-342
title: >-
  The top-level procedures[] array and its schema family are still in the DSL although every in-repo procedure became a flow
type: FEATURE
severity: LOW
status: DONE
opened: 2026-11-18
closed: 2026-11-19
source: >-
  FORM P3-T5c stage 6 / P3-T7 (2026-11-16..18). Every procedure in the in-repo corpus was rewritten as a flow and DefaultProcedureExecutor was cut to the
  eight concept steps, but procedures[] stays in model.schema.json because two untrusted-extension apps under AppGen/apps (WmsOffice, WmsOfficePackTest)
  still declare it.
surface: dsl/procedures, contract/model.schema.json, kernel/procedures
detail: |
  On a bare CI checkout (no AppGen/apps) check-dsl-coverage.py sees no model declaring procedures[], so the feature and the four procedure.* step
  features are carried by reviewed entries in scripts/quality/dsl-coverage-allowlist.json that cite this item. They go away together with the schema family.
  DONE 2026-11-19 (one change, see BREAKING.md): procedures[] and $defs procedure/procedureVariable/procedureStep removed from the four model.schema.json
  copies, both pack.schema.json copies and model-fragment.schema.json (procedureParameter -> queryParameter, still used by queries[].parameters); ModelAst and
  CompiledModel lost the positional constructor parameter (168 files; a generics-aware audit against HEAD found no wrong-argument drops); the parser refuses
  a root `procedures` with LEGACY_PROCEDURES_ROOT_KEY; ModelCompiler, the canonical JSON writer/reader pair, ModelResolver, ModelSourceResolver (MODEL_ARRAY_KEYS
  and the procedure rewrite kind), ReferenceIndex (SITE_PROCEDURE_STEP_*), PackValidation (the whole validateProcedures chain), AggregateValidation,
  PanelValidation, ExternalAiValidation, CompiledPluginRequirementGraphBuilder, PackDiffEngine, the metadata catalog (procedures.manifest.json, the runtime
  /metadata/procedures endpoint, catalogs.procedures: 13 -> 12 catalogs) and the generator (untrusted-extension manifest kind `procedure`, the procedure
  actionDescriptor path, AuthoringDiffGate) all cleaned; a screen/hook/aggregate `procedure` reference now names a flow only. Deleted: ProcedureAst,
  ProcedureStepAst, ProcedureVariableAst, CompiledProcedure*, GeneratedActionDescriptorAst, CompiledGeneratedActionDescriptorSpec,
  ComputeValueOperandValidation and 17 procedure-only DSL tests; the inline test models became flows. CLI: `npdev add procedure`, `npdev migrate
  procedure-args-order` and the Java `list-procedures` are gone; Normalize-AiContract.ps1 maps an ai-model.v1 procedure to a flow. The five
  dsl-coverage-allowlist entries are deleted; the keyword budget fell 802 -> 757 (baseline slots, meanings data, layout and DSL_KEYWORD_REFERENCE.md regenerated).
  KEPT ON PURPOSE: the kernel's com.npdev.kernel.procedures package (DefaultProcedureExecutor etc.) -- since FORM P3-T7 it is the concept-step engine flows run
  through (ProcedureFlowStep), not a procedures[] feature; renaming it is cosmetic. Verified: DSL 1469 tests green, generator 791/792 (the one red,
  PigmentampasSampleTest, is a pack-cache digest mismatch in the previous session's UNCOMMITTED pack-version sync, not this change), runtimehost-core 704/704,
  kernel + adapters, CLI add/migration/xref tests, keyword budget/reference, twin-pair, schema-mirror, dsl-coverage, concept-map and the paperwork checks.
  NOT run: the assembled RuntimeHost root suite (run-runtimehost-gate.ps1), enf-behavior-probes, jrn-journeys, the browser scenarios and the full T2 gates.
  Plan task: P4-T5 (rung 4, code capabilities), which merges customCapabilities into capabilities[] and needs the owner present (D14).
  PROGRESS 2026-11-18 (owner chose option A: a hash-pinned Java class binds to a FLOW). DONE: flows[].metadata (untrustedExtensionEntrypoint) in the four
  model.schema.json copies, FlowAst/CompiledFlow/parser/resolver/compiler/canonical JSON writer+reader; the generator pairs a flow's entrypoint with an
  untrusted-extension-manifest.json entry of kind `flow` (UntrustedExtensionManifest/Emitter; role from the manifest entry; test
  UntrustedExtensionEmitterFlowKindTest 4/4); admission record scripts/policy/dsl-keyword-admissions/flow-metadata.json (+1 slot, frozenCount 802; the
  procedure family removal below takes far more than that back). WmsOffice and WmsOfficePackTest (AppGen, layer 2) migrated: customCapabilities ->
  capabilities[], their two trusted procedures -> flows, the stale trusted-source-manifest.json (never read by the generator; their procedure/panel
  entries were missing from the live manifest, so those apps could not have generated) folded into untrusted-extension-manifest.json. WordLab's
  customCapabilities migrated too. WmsOffice and WordLab validate with 0 errors; WmsOfficePackTest only lacks the pack cache on this machine.
  STILL OPEN (measured, not started): remove procedures[] and the procedure $def family (procedure, procedureVariable, procedureStep; procedureParameter
  is also used by query.parameters -- rename it queryParameter) from the four model schemas + pack.schema.json (2 copies) + model-fragment.schema.json;
  then ~170 call sites in ~28 main files (dsl: CompiledModel, ModelAst, PackValidation, ModelCompiler, ReferenceIndex, AggregateValidation,
  JsonModelParser, the three canonical JSON classes, ComputeValueOperandValidation, ExternalAiValidation, CompiledPluginRequirementGraphBuilder,
  PanelValidation, ModelSourceResolver's "procedures" rename map -- panel `procedure` refs must resolve against flows -- , PackDiffEngine; generator:
  AuthoringDiffGate, PackExtensionComposer, BuiltinPackComposer, RuntimeApiEmitter, GeneratorFacade, the manifest kind `procedure`, TrustedProcedure
  naming; kernel: procedures/ (DefaultProcedureExecutor + 10 tests), ProcedureFlowStep; runtimehost: ProcedureRunner, MetadataHotSwapController,
  RuntimeMetadataService catalog; cli: dsl_v2_migration, npdev_cli known-names, npdev_pack_sheet) and ~12 DSL Procedure*ValidationTest classes plus
  the ai-scenarios fixtures. Refuse a legacy root `procedures` with LEGACY_PROCEDURES_ROOT_KEY like customCapabilities. Do it as one commit.
files:
  - NPDevContract/schemas/model.schema.json
  - scripts/quality/dsl-coverage-allowlist.json
verification: UNIT_TESTED
guard:
  kind: test
  ref: NPDevContract/dsl/src/test/java/com/npdev/dsl/v1/ContractSurfaceSupportTest.java#rejectsRemovedRootProceduresWithTheFlowReplacement
  asserts: >-
    a model carrying the root key `procedures` is refused with a message that names `flow` as the replacement.
  provenRed: false
done_when: >-
  model.schema.json (all four copies) has no procedures[] and no procedure $def family, no corpus model declares it, and the five procedures entries in
  scripts/quality/dsl-coverage-allowlist.json are deleted.
