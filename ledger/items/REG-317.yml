id: REG-317
title: >-
  Domain fit: no cross-concept rules or access and no rows-from-template -- study membership, staff-role
  requirements and per-visit-type schedules need hand-copied fields
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-10-29
closed: 2026-10-30
source: >-
  OWN-2 section 5.2 domain-fit simulation, 2026-10-28/29: a fresh agent given only the public docs and a
  clinical-trial site-visit scheduler (a domain never modelled here), not told what to build. Evidence:
  NPDev_General__OutsideRepo/evidence/2026-10-28-own2-sim/
surface: dsl/domain-fit
detail: >-
  Rules cannot read another concept, so 'investigators see their studies' needed the investigator copied onto
  every Participant and Visit, with nothing keeping copies in sync; 'this visit type needs a pharmacist' and
  'the assigned person has the right staff role' cannot be enforced; conflicts() covers one resource per rule,
  so staff double-booking across slots cannot be checked; nothing creates one Visit per VisitType on
  enrolment. Also (from SEC-16, the half left open): an access.write rule reads one row, so a child created
  under another coordinator's parent passes when the child's own fields pass (alice attaches a Visit, with
  coordinatorUsername alice, to bob's Participant). Closing it needs a rule that can name the parent, or the
  reference check running under the caller's own read scope (a behaviour change for system and flow callers);
  either is a design decision, not a patch.
resolution: >-
  Done when each gap is either delivered (with a corpus example) or recorded as an owner decision / accepted
  boundary.
verification: VERIFIED_LIVE
guard:
  kind: test
  ref: NPDevKernel/kernel/src/test/java/com/npdev/kernel/concepts/ConfiguredConceptGatewaySemanticPolicyTest.java#childCannotBeCreatedUnderAnotherCoordinatorsParent
  asserts: >-
    with access.write = "parentField('participantId', 'coordinator') == $user.id", alice creating a child whose parent
    row names bob as coordinator is refused with ROW_SCOPE_DENIED; siblings cover the caller's own parent
    (create and edit succeed), moving a child under another coordinator's parent, an unset or missing parent
    (denied) and a parent in another tenant (does not count). The live probe
    cf-concept-access-write-parent-scope-denies-child-under-another-owners-parent proves it end to end.
  provenRed: true
note: >-
  2026-10-30 closed by owner decision "build parent-scope only": the access.write parent-scope gap (from SEC-16)
  is delivered as parentField('ref','field') with corpus example ShelfLayoutNote and a live probe (SEC-16). The
  other gaps are recorded as accepted POSTURAL boundaries: B33 (no cross-concept rule reads), B34 (no parent in
  access.read), B35 (conflicts() covers one resource per rule), B36 (no rows-from-template).
