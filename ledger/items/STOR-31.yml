id: STOR-31
title: >-
  Surplus constraints are classified and reported advisory-only at boot; an operator can drop a
  FOREIGN-classified one explicitly, itemized and token-gated, and nothing else is droppable by any
  path (boundary B3 -> LIFTED)
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-09-07
closed: 2026-09-07
source: >-
  POSTURAL_LIFT_PLAN_2026-09-07.md package P3 (Wave 1). B3.yml's own residue, verbatim: "every one
  of them only ADDS an advisory section. There is no refusal, no ValidationDiagnostic and no drop
  path, so there is no diagnostic identity for a boundaryId to attach to."
surface: >-
  the schemastate package (ConstraintSurplusDropPlan, a new classifyLiveByName on the classifier),
  com.finalexec.db (SurplusDropSupport + ConstraintSurplusDropExecutor + a SURPLUS_DROPPED history
  label), the dialect package (SqlDialect.guardedDropConstraint + four implementations),
  SchemaAcknowledgmentController (surplus preview/drop endpoints), and npdev_cli.py (`db surplus`).
