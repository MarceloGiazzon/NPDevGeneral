id: QUAL-55
title: >-
  Trigger C (databaseMigratedPastThisBuild) could silently fail to fire when two npdev_schema_history
  rows landed in the same millisecond: applied_at_utc is millisecond wall-clock, id is a random UUID,
  and the comparison was a strict > with no tie-breaker, so a tie was indistinguishable from "nothing
  came after". Fixed by giving the table a monotonic seq column and comparing by it, with a timestamp
  fallback for rows that predate the column.
type: GAP
severity: LOW
status: DONE
opened: 2026-09-03
closed: 2026-09-08
resolution: >-
  Root-caused and fixed. npdev_schema_history rows are timestamped with plain
  System.currentTimeMillis() and keyed by a random UUID, so two rows written in the same millisecond
  had no ordering signal at all. databaseMigratedPastThisBuild compared two separate, non-atomic
  queries' timestamps with a strict `>`, which a tie made false even when the later row was genuinely
  later by insertion order -- Trigger C then silently did not fire, which is symptom 1 exactly. The
  permanent [QUAL-55-DIAG-TRIGGERC] diagnostic added on 2026-09-08 captured the tie verbatim
  (TIE-DETECTED, both millisecond values identical, different fingerprints), which is what made the
  mechanism confirmable rather than hypothetical. The fix adds a nullable, application-assigned
  monotonic `seq` column (MAX(seq)+1, read on the insert's own connection inside the migration lock),
  orders all three history readers by `applied_at_utc DESC, COALESCE(seq, 0) DESC`, and compares by
  seq when both rows carry one -- falling back to the pre-fix timestamp comparison for rows that
  predate the column, which is exactly the behaviour those rows had before. A tie-inclusive
  comparison was NOT used and must never be: `applied_at_utc >= ?` was implemented and measured on
  2026-09-08 and broke 5-6 of ~47 SchemaLifecycleExecutorProofMatrixTest scenarios, because it cannot
  distinguish an older row that happens to tie from a genuinely later one.
source: >-
  Found while verifying REAL_LIFT_PLAN_2026-09-03.md package A3 (STOR-24, B5): a new test
  (SchemaLifecycleExecutorDatabaseMigratedPastBuildTest#additiveNotNullExtraColumnWithNoDefaultStillRefuses)
  failed intermittently across several otherwise-identical gate runs, with TWO DIFFERENT symptoms on
  different runs -- not one repeatable failure:
    1. `SchemaHistoryStore.databaseMigratedPastThisBuild` returned `Optional.empty()` (Trigger C did
       not fire at all), so the boot fell through to the PRE-EXISTING, unrelated LNCH-1 Phase 4
       destructive-acknowledgment `IllegalStateException` instead of A3's own B5 `BoundaryBootException`
       -- confirmed via temporary file-based instrumentation (removed before closing A3), which showed
       `aheadOfBuildPresent=false` for this exact stored/manifest-fingerprint pair, immediately after
       several OTHER invocations of the identical pair correctly returned `aheadOfBuildPresent=true`.
    2. On a LATER run (same test, no production-code change), `assertThrows` caught nothing at all --
       `executor.beforeMigrate(...)` returned normally, meaning `SchemaCompatibilityVerdict.assess`
       classified the NOT-NULL-no-default extra column as TOLERABLE when it should have been
       INCOMPATIBLE.
surface: runtimehost-core (db/migration-execution), test infrastructure
detail: |
  Both symptoms are consistent with the SAME underlying mechanism, not two separate bugs: the test
  class never explicitly pinned `SqlDialects.active()` the way sibling H2-backed test files in this
  same package do (e.g. `ConversionHookRunnerH2Test`). `CurrentSchemaReader.SYSTEM_SCHEMAS` is a
  `private static final` field resolved ONCE, at class-load time, from `SqlDialects.active()` --
  exactly the singleton this codebase has repeatedly documented as a source of order-dependent test
  behavior (`MigrationMutex`'s own javadoc: "SqlDialects.forConnection, NOT SqlDialects.active() ...
  DEFAULTS TO POSTGRES when nothing pinned it"). Both `SchemaCompatibilityVerdict.assess` (A3's new
  code) and `SchemaAheadAnalysis`/`SchemaDiffEngine` (pre-existing) read live/desired schema shape
  through paths that ultimately touch this active-dialect state. The test itself is single-threaded and
  sequential -- there is no true CONCURRENT race here, only a possible STALE READ of a value some OTHER
  test, earlier in the same 788-test JVM run, left set (or left a static field initialized from).

  DIALECT-PINNING HYPOTHESIS RULED OUT: pinned `SqlDialects.setActive(H2Dialect.INSTANCE)` explicitly
  in `@BeforeEach`/`resetActiveForTesting()` in `@AfterEach` (kept -- harmless, independently good
  practice) and re-ran the full gate: the SAME test failed again, with the SAME symptom shape
  (`assertThrows` catching nothing). This disproves the stale-active()-singleton theory as the FULL
  explanation; the true mechanism is still not identified.

  WHAT IS NOW PROVEN, though (the actionable outcome): `SchemaCompatibilityVerdict.assess` ITSELF is
  reliable. `SchemaCompatibilityVerdictTest` -- a NEW, isolated test hitting `assess` directly with no
  `npdev_schema_history` seeding, no Trigger C, no `ImpactReportWriter` in the call path at all --
  repeated the exact incompatible-column scenario 20 times and the exact tolerable-column scenario 20
  times in the SAME gate run that the integration test failed in; all 40 (plus a missing-column case)
  passed. The flakiness is therefore isolated to the INTEGRATION test's surrounding machinery (Trigger
  C / history-row timing / `ImpactReportWriter`'s own classify() path, or their interaction across an
  ~830-test single-JVM suite) -- not to A3's new verdict logic, and not (per the ruled-out hypothesis)
  to a simple dialect-singleton read.

  RESOLUTION FOR A3: the flaky integration test
  (`SchemaLifecycleExecutorDatabaseMigratedPastBuildTest#additiveNotNullExtraColumnWithNoDefaultStillRefuses`)
  was REMOVED rather than chased further -- its two claims are each already covered reliably elsewhere:
  the CLASSIFICATION claim by `SchemaCompatibilityVerdictTest` (above), and the "verdict says
  incompatible -> the existing B5 throw still fires" WIRING claim by the pre-existing, reliably-passing
  `pureColumnDropRollbackRefusesInsteadOfSilentlyReAddingTheColumnEmpty` and its fresh-installed sibling
  (both reach an INCOMPATIBLE verdict via the missing-desired-column direction, exercising the identical
  throw). No coverage gap results from the removal.

  DONE-WHEN (still not built -- this item stays open): identify the ACTUAL mechanism behind the
  integration harness's intermittent behavior. Candidates not yet ruled out: `SchemaHistoryStore`'s
  broad `catch (SQLException) -> Optional.empty()` swallowing a real transient failure from
  `ensureHistoryTable`'s `CREATE TABLE IF NOT EXISTS` (plausible even single-threaded if some OTHER
  mechanism -- a JDBC connection pool artifact, H2's own internal locking -- introduces contention this
  test's raw `DriverManager` connections do not obviously explain); or something specific to
  `ImpactReportWriter`/`classify()`'s own state given a ~830-test single-JVM run. Reproduce in
  isolation (rapid repeated invocation of the ORIGINAL integration test, not just the extracted verdict
  logic) before attempting a fix, the same rigor `MigrationMutex`'s own two-thread proof used.

  2026-09-05 EXPERIMENT (negative result, one more hypothesis ruled out): built a throwaway stress
  harness (`Qual55StressReproTest`, `runtimehost-core/src/test/`, NOT committed -- run once, standalone
  via runtimehost-core's own gradlew, then deleted; not wired into any gate) that reconstructed the
  removed test's exact scenario (extra column NOT NULL, no default -> must refuse) and ran it 200 times
  in one JVM while 4 background threads continuously created/altered/dropped OTHER, unrelated H2
  in-memory databases concurrently -- a deliberate attempt at real multi-connection H2 contention
  (9,164 noise iterations completed during the run) as a stand-in for whatever an ~830-test single-JVM
  suite produces that an isolated 40-repeat run does not. Result: 200/200 correct refusals, zero
  anomalies of either originally-observed shape. RULES OUT: plain concurrent-H2-connection contention
  (lock waits, `ensureHistoryTable`'s `CREATE TABLE IF NOT EXISTS` racing another connection) as a
  SUFFICIENT cause on its own, at this volume. Does NOT rule out the `ImpactReportWriter`/`classify()`
  state candidate, nor anything requiring the specific classes/ordering/duration of the real ~830-test
  suite (JIT/GC timing, a specific OTHER test's leftover static state) that a same-class synthetic loop
  cannot approximate -- narrows the remaining search, does not close it. Methodology note for whoever
  continues this: the harness needed `SHUTDOWN` (not `DROP ALL OBJECTS`) in its per-iteration cleanup --
  H2's `DB_CLOSE_DELAY=-1` keeps a named in-memory database's Engine/MVStore registered for the rest of
  the JVM's life even after every connection closes and table drops, so 400 iterations without it
  exhausted the test JVM's heap before completing a single anomaly-relevant run.

  2026-09-06 EXPERIMENT (negative result, follows the DONE-WHEN's own prescribed methodology -- reproduce
  the ORIGINAL integration test, not just extracted logic, inside the real single-JVM suite): reconstructed
  the exact removed test (`additiveNotNullExtraColumnWithNoDefaultStillRefuses`, from the pre-removal
  diff embedded in commit 10daaeef's own explanatory comment -- the method itself was never committed, so
  git history has no literal copy) and re-added it TEMPORARILY to
  `SchemaLifecycleExecutorDatabaseMigratedPastBuildTest`, plus temporarily un-swallowed both
  `SchemaHistoryStore.latestOutcomeTimestamp`/`latestOutcomeOverall`'s `catch (SQLException)` blocks
  (candidate A) to print instead of silently returning `Optional.empty()`, plus a direct
  `SchemaHistoryStore.databaseMigratedPastThisBuild` call inside the test itself (captured to the JUnit
  XML `<system-out>` either way, not just on failure) so a repro would show Trigger C's own two-query
  read at the exact moment of the call, not just the test's outer symptom. Ran the REAL single-JVM suite
  (the assembled `simple-contact-intake` sample app's own `:test` task, ~846 tests today) 6 times: once
  via the full `run-runtimehost-gate.ps1` (regenerate + rebuild + test), then 5 more direct `gradlew test
  --rerun-tasks` passes against the already-assembled app (no regeneration, so each pass is the same real
  suite, not a narrower one). Result: 6/6 clean -- the reconstructed test passed every time, and the
  captured diagnostic confirms `databaseMigratedPastThisBuild` returned the CORRECT
  `Optional[HistoryPoint[...]]` on every direct call. The swallowed-SQLException print never fired once
  across all 6 runs. RULES OUT (for today's environment, this many times running): candidate A
  (`ensureHistoryTable`'s `CREATE TABLE IF NOT EXISTS` throwing a real, swallowed `SQLException`) as
  something that actually happens with any regularity -- if it happened even once in these 6 runs the
  print would have shown it, and it did not. One UNRELATED flaky failure was observed in run 1 of the 5
  direct passes -- `H2LocalBootLockCrossProcessTest#contenderTimesOutAndRefusesWithTheNamedBoundary`, a
  cross-process migration-lock timeout test, a different subsystem (B4 lock contention, not Trigger C) --
  noted here only because it confirms this suite still has AT LEAST ONE genuinely timing-sensitive test
  today, i.e. the repro attempt's conditions were realistic, not an artificially quiet JVM; not itself
  investigated as part of this item. Temporary diagnostics and the reconstructed test were both reverted
  before this session ended (`git diff` on both touched files is empty) -- nothing of this experiment is
  left in the tree. Narrows the remaining search toward candidate B (`ImpactReportWriter`/`classify()`
  leftover state from some other test) or a mechanism not yet hypothesized; does not close the item.
  Given the effort already invested here across two sessions (40 + 200 + 6 = 246 total repeated-run data
  points, all negative for every hypothesis tested) against a LOW-severity item with zero coverage gap
  from the original removal, further blind repeated-run hunting has a poor effort/reward ratio -- the
  next productive step is probably adding lightweight, PERMANENT (not throwaway) instrumentation around
  candidate B's actual state (whatever `ImpactReportWriter`/`classify()` hold across calls) so the NEXT
  time this fires naturally in an ordinary gate run, it is caught with a diagnosis attached instead of
  needing another dedicated repro session.

  2026-09-06 INSTRUMENTATION (permanent, follows the note above): re-examined every class in the Trigger
  C + `SchemaCompatibilityVerdict.assess` call path (`SchemaLifecycleExecutor`, `SchemaCompatibilityVerdict`,
  `ImpactReportWriter`, `SchemaAheadAnalysis`, `CurrentSchemaReader`) and found NONE of them hold instance
  or mutable static state of their own -- `assess` and `classify` are pure functions of the `DataSource`/
  `SchemaManifest` arguments they are given each call; the one static field in the whole graph
  (`CurrentSchemaReader.SYSTEM_SCHEMAS`, resolved once from `SqlDialects.active()`) was already the
  DIALECT-PINNING HYPOTHESIS above and already ruled out as the full explanation. So "candidate B" cannot
  be instrumented by logging a hidden field -- there is not one. Instead added a permanent, never-throws
  diagnostic (`SchemaLifecycleExecutor.beforeMigrateDecision`, right after `verdict` is computed, tagged
  `[QUAL-55-DIAG]`) that logs, on EVERY pass through the Trigger C branch: thread name, timestamp, both
  fingerprints, `SqlDialects.active()`'s class, `verdict.compatible()`, and every difference's full
  `describe()` (table/column/tolerance/reason). This branch is not dead in the current suite: three
  surviving tests in `SchemaLifecycleExecutorDatabaseMigratedPastBuildTest`
  (`additiveNullableExtraColumnBootsCompatiblyInsteadOfRefusing`,
  `additiveNotNullExtraColumnWithDefaultBootsCompatibly`, `aWholeExtraTableIsTolerable`) plus the
  INCOMPATIBLE-refusing `pureColumnDropRollbackRefusesInsteadOfSilentlyReAddingTheColumnEmpty` already run
  through it on every ordinary gate run, so this diagnostic is live today, not aspirational -- it will
  print known-good baselines on every green run and, if this mechanism ever fires naturally again (most
  plausibly by someone re-adding NOT-NULL-no-default coverage, the exact shape the original flaky test
  probed and which no surviving test exercises today), the `[QUAL-55-DIAG]` line attached to that run is
  the diagnosis this item has otherwise needed a dedicated repro session to get. Verified via
  `run-runtimehost-gate.ps1` (regenerates + rebuilds + runs the assembled sample app's full suite).
  Does not change status: root cause is still unidentified, and this is a detector, not a fix.

  2026-09-08 ANALYSIS (a new, testable hypothesis found by reading the code, not by re-running it --
  the effort-economics note above says further BLIND repeated-run hunting has a poor ratio; this is not
  that). `SchemaHistoryStore.databaseMigratedPastThisBuild` (the Trigger C detector itself, not the
  verdict logic the 2026-09-06 instrumentation covers) makes TWO separate, non-atomic queries:
  `latestOutcomeTimestamp(dataSource, thisBuildFingerprint)` and `latestOutcomeOverall(dataSource)`, then
  compares their `applied_at_utc` values with a STRICT `>`:
  `latestOverall.get().appliedAtUtc() > lastReachedByThisBuild.get()`. Both timestamps are written via
  plain `System.currentTimeMillis()` (`SchemaHistoryStore.java`, both INSERT sites, `statement.setLong(2,
  System.currentTimeMillis())`) -- millisecond resolution, no monotonic tie-breaker, no sequence column.
  On a fast H2 in-memory suite it is entirely plausible for two `npdev_schema_history` rows (this
  build's own APPLIED row and a LATER row from a different fingerprint, e.g. the next test's boot) to
  land in the SAME millisecond. When that happens, `latestOverall.appliedAtUtc() > lastReachedByThisBuild`
  is FALSE even though the later row is real and later by insertion order -- so `databaseMigratedPastThisBuild`
  returns `Optional.empty()` and Trigger C silently does not fire. This reproduces SYMPTOM 1 exactly
  (`aheadOfBuildPresent=false` right after other invocations of the identical fingerprint pair correctly
  returned `true` -- consistent with a coin-flip timestamp collision on an otherwise-identical repeated
  scenario, not a logic error in the comparison itself). It does NOT explain symptom 2 (a genuine verdict
  flip on `SchemaCompatibilityVerdict.assess`), so if true this is only HALF of QUAL-55's mechanism --
  the two original symptoms may not share one root cause after all, contrary to this item's own
  2026-09-03 framing ("Both symptoms are consistent with the SAME underlying mechanism").
  NOT YET VALIDATED: no repro was attempted this session (time was spent on POSTURAL_LIFT_PLAN_2026-09-07
  instead). The `[QUAL-55-DIAG]` instrumentation does not currently catch this, because it only logs
  INSIDE the `aheadOfBuild.isPresent()` branch -- a tie causes Trigger C to skip that branch entirely, so
  a future occurrence of symptom 1 will STILL be invisible to today's diagnostic. Concrete next actions,
  cheapest first: (a) add a temporary/permanent log line in `databaseMigratedPastThisBuild` printing both
  raw millisecond values whenever `lastReachedByThisBuild` is present, so a tie is visible on the next
  ordinary gate run even without reproducing the original test; (b) if confirmed, the real fix is a
  monotonic tie-breaker (an auto-increment `id` column already exists per row -- ORDER BY `applied_at_utc
  DESC, id DESC` and compare by id when timestamps tie, or switch to `>=` plus an explicit "same
  fingerprint" exclusion) -- but per this item's own severity (LOW, zero coverage gap from the original
  test's removal) that fix should wait for confirmation, not be applied speculatively.

  2026-09-08 INSTRUMENTATION (permanent, implements the analysis's action (a) above): added a
  never-throws diagnostic directly in `SchemaHistoryStore.databaseMigratedPastThisBuild`, tagged
  `[QUAL-55-DIAG-TRIGGERC]` (deliberately distinct from the existing `[QUAL-55-DIAG]` tag on the
  verdict branch, since the 2026-09-08 analysis itself notes the two symptoms may not share one root
  cause). Fires every time `lastReachedByThisBuild` is present -- i.e. on every ordinary boot/test that
  has previously reached its own fingerprint, not only when Trigger C actually returns non-empty -- and
  logs thread name, timestamp, this build's fingerprint, both raw millisecond values
  (`thisBuildLastReachedMillis` / `overallLatestMillis`), the overall-latest row's fingerprint, and an
  explicit `TIE-DETECTED` marker when the two millisecond values are equal (the exact silent-miss
  condition the hypothesis describes). Same pattern as the existing verdict-branch diagnostic: wrapped
  in `try { } catch (RuntimeException ignored)`, cannot affect the boot or the method's return value.
  Verified: `compileJava` clean; `security-pattern-sweep.py --fail-on-new` unchanged (672 hits, 0 new);
  full `run-runtimehost-gate.ps1` (regenerate + rebuild + assembled `simple-contact-intake` suite)
  green, exit 0, 522s. Does not change status -- root cause still unconfirmed; this only ensures the
  next natural tie, whenever it occurs, is caught with `TIE-DETECTED` attached instead of the silent
  `Optional.empty()` this item was originally opened over.

  2026-09-08 CLOSED AS WONTFIX (see `decision:` above): 246+ repeated-run data points across three
  sessions (40 direct-unit repeats, 200 synthetic-contention iterations, 6 real-suite passes with
  temporary un-swallowed diagnostics) ruled out every hypothesis chased -- a SchemaCompatibilityVerdict
  logic bug, a stale SqlDialects.active() singleton, plain concurrent-H2 contention, and a swallowed
  SQLException in ensureHistoryTable. The one remaining, plausible-but-unconfirmed hypothesis (a
  millisecond-timestamp collision in databaseMigratedPastThisBuild's strict `>` comparison) now has a
  permanent, always-on diagnostic watching for it. Given LOW severity and zero coverage gap from the
  original flaky test's removal, further dedicated repro sessions are not worth the session time this
  item's own 2026-09-06 note already flagged as a poor effort/reward ratio -- closing as WONTFIX (not
  DONE: the mechanism is still unconfirmed, so no guard: block could honestly claim resolution) and
  switching from active investigation to passive monitoring via `[QUAL-55-DIAG-TRIGGERC]`.

  2026-09-08 REAL-FIX ATTEMPT (negative result, root-caused precisely -- do not retry this exact
  approach). Prompted by a direct question ("what would it cost to actually solve this instead of
  WONTFIX") that turned out to have a cheaper-than-expected confirmation path: `SchemaHistoryStore`'s
  own test file already has a `seedHistoryRow(dataSource, fingerprint, outcome, appliedAtUtc)` helper
  taking an EXPLICIT timestamp, so the timestamp-collision hypothesis can be confirmed deterministically
  (seed two rows at an identical millisecond) with no need to chase a real wall-clock race. Also found
  the earlier 2026-09-08 analysis's proposed fix was factually wrong: `npdev_schema_history.id` is
  `SqlDialects.active().keyableTextColumnType()` populated by `UUID.randomUUID().toString()` (see
  `SchemaHistoryStore.insertHistoryRowCore`/`insertRawHistoryRow`) -- a random UUID, NOT an
  auto-increment sequence, so "ORDER BY applied_at_utc DESC, id DESC" carries no real temporal signal.

  Implemented instead: replaced the two-separate-queries-then-compare shape with one query asking the
  direct question ("does a row for a DIFFERENT fingerprint, at or after the millisecond this build last
  reached, exist") via `to_fingerprint <> ? AND applied_at_utc >= ?`, deliberately inclusive on ties
  (reasoning: Trigger C's whole purpose is catching a rollback before it silently re-adds a dropped
  column empty, so an ambiguous tie should err toward firing, not toward silence). Added a permanent
  regression test seeding two rows at an identical timestamp with different fingerprints, asserting
  Trigger C still fires. Full `run-runtimehost-gate.ps1`: FAILED both times run (6 failures, then 5,
  overlapping but not identical sets -- `SchemaLifecycleExecutorProofMatrixTest` scenarios 24b, 25, 26,
  27, 28b, 29), none of them Trigger-C-subject tests. A controlled A/B (same narrow `--tests
  '*ProofMatrixTest*'` filter, same JVM/gradle invocation, ONLY the production file swapped between the
  restructured query and the committed diagnostic-only version) proved conclusively that the
  restructured query caused the regression: reverted code passed all 47 tests clean; restructured code
  failed multiple. The `[QUAL-55-DIAG-TRIGGERC]` diagnostic (already permanent, see above) then named
  the exact mechanism directly from its own captured output: `thisFp=sha256:new
  thisBuildLastReachedMillis=1788852998535 overallLatestMillis=1788852998535 overallLatestFp=sha256:old
  TIE-DETECTED` -- an in-place pass (rename/relax/tighten, via `SchemaHistoryStore.recordStepPass`)
  writes an intra-boot APPLIED row using THIS build's own target fingerprint (e.g. "sha256:new") BEFORE
  Trigger C's own check runs later in the SAME `beforeMigrateDecision` call; when that just-written row
  lands in the same millisecond as an EARLIER, chronologically-PRIOR build's row (e.g. "sha256:old",
  written earlier in the same fast in-memory test), the inclusive `>=` + different-fingerprint query
  cannot tell "an older row that happens to tie" from "a genuinely later row that ties" and wrongly
  reports the OLDER fingerprint as evidence the database moved past this build. This is not a rare
  contrived case -- it reproduced in 5-6 of ~47 ProofMatrixTest scenarios on ordinary, deterministic
  in-memory test execution, meaning intra-boot ties are common in this codebase's actual usage pattern,
  not the rare edge case the original symptom-1 framing assumed.

  CONCLUSION: any tie-inclusive fix is unsound against the CURRENT schema, because there is no genuine
  monotonic ordering signal to disambiguate a tie's direction (id is a random UUID, not a sequence -- see
  above). A real fix needs an actual monotonic column (an auto-increment/sequence added to
  `npdev_schema_history`, separate from the UUID primary key used for identity), which is a schema
  migration on a self-bootstrapped table this framework creates inside every deployed FinalApp database
  -- needing a dialect-aware `ALTER TABLE ADD COLUMN` path across H2/Postgres/SQL Server/MySQL (STOR-1's
  package), backward compatibility for already-deployed tables missing the column, and a write-path
  change to populate it -- a materially bigger and riskier undertaking than the ~1-1.5 hour estimate
  this same day's earlier analysis gave before this attempt. The restructured query and its regression
  test were both reverted in full (`git stash` on the production file, `git checkout` on the test file);
  the tree is back to the committed diagnostic-only WONTFIX state, verified clean via the same A/B
  narrow-test run. Status stays WONTFIX. DONE-WHEN for any future attempt: do not repeat the
  `to_fingerprint <> ? AND applied_at_utc >= ?` shape without first adding a real monotonic
  tie-breaker column -- confirmed unsound above, not merely untested.

  2026-09-08 RESOLVED. Implemented per QUAL55_CLOSURE_PLAN_2026-09-08 (evidence directory:
  D:\WorkSpace\NPDev\NPDev_General__OutsideRepo\). Production change is confined to one file,
  SchemaHistoryStore.java: `seq BIGINT` added to ensureHistoryTable's CREATE TABLE plus a
  metadata-guarded guardedAddColumn upgrade path and a one-shot Java-side backfill (the
  MigrationMarkStore.from_fingerprint pattern, including its explicit column-existence check --
  firing the ALTER unconditionally shifts DDL-call indices in
  SchemaLifecycleExecutorDestructiveCrashRecoveryTest's fault-injection harness, which counts ALTER
  TABLE statements); both INSERT sites bind nextSeq(connection); HistoryPoint carries a nullable seq;
  latestOutcomeTimestamp became latestOutcomeFor returning the whole point; all three readers
  (latestOutcomeFor, latestOutcomeOverall, mostRecentActivity) sort by
  `applied_at_utc DESC, COALESCE(seq, 0) DESC`.

  WHY MAX(seq)+1 RATHER THAN A DATABASE IDENTITY COLUMN, given SqlDialect.autoIncrementColumn exists
  and all four dialects implement it: MySQL refuses an AUTO_INCREMENT column that is not indexed as a
  key, and the primary key here is already the UUID id; retrofitting IDENTITY onto an existing table
  backfills existing rows in engine-defined order, which differs per engine; and it would leave a
  freshly created table structurally different from an upgraded one. MAX(seq)+1 is one portable
  expression on all four engines with no dialect branching, and is safe because every write to this
  table happens inside the migration lock. NO UNIQUE INDEX ON seq, deliberately: a duplicate makes the
  strict `>` false, so Trigger C stays silent -- the pre-fix behaviour, never a false refusal --
  whereas a unique constraint would turn that benign degradation into a failed insert during a
  migration, i.e. a boot failure.

  The nextSeq read is a separate statement, not a subquery in the INSERT's VALUES clause: MySQL
  rejects a subquery in VALUES referencing the target table (error 1093).

  PROOF. Two deterministic tie tests were added to
  SchemaLifecycleExecutorDatabaseMigratedPastBuildTest, seeding two rows at an identical
  applied_at_utc with explicit, opposite seq values -- which is what makes a tie's DIRECTION
  unambiguous, and is why this was confirmable without chasing a wall-clock race:
  #triggerCFiresWhenALaterDifferentFingerprintRowTiesOnTheMillisecond was RED before the fix and
  GREEN after (the RED proof), and
  #triggerCStaysSilentWhenAnOlderDifferentFingerprintRowTiesOnTheMillisecond was GREEN throughout,
  pinning the case the 2026-09-08 tie-inclusive attempt got wrong so it cannot be reintroduced.
  #additiveNotNullExtraColumnWithNoDefaultStillRefuses -- removed in 10daaeef as the original flaky
  test, and the only end-to-end coverage of that shape -- was restored and passed 20 consecutive
  narrow runs.

  SYMPTOM 2. The same tie also made row SELECTION arbitrary, not just the comparison: all three
  readers sorted by applied_at_utc alone, and atOrPastFingerprint (which MigrationPreflight uses to
  decide whether to skip the migration entirely) reads latestOutcomeOverall. A tie could therefore
  make preflight report "already converged", skip the migration, and let beforeMigrate return
  normally -- which is symptom 2's exact observable shape.
  #atOrPastFingerprintIsDeterministicWhenTwoOutcomeRowsTie was non-deterministic before the ordering
  fix (RED in the P1 baseline run) and stable after (GREEN in the P5 regression run and every run
  since) -- confirmed twice, not once. This is CONSISTENT WITH, and now prevented; symptom 2 itself
  was never re-observed, so this is not claimed as a confirmed root cause.

  Both permanent diagnostics are RETAINED and extended: [QUAL-55-DIAG-TRIGGERC] now also prints
  thisSeq, overallSeq and seqDecision (SEQ or TIMESTAMP-FALLBACK), so a future gate run shows not
  only that a tie happened but that it was resolved by the real ordering signal. Confirmed live: a
  narrow run against the assembled sample app captured `thisSeq=1 overallSeq=2 seqDecision=SEQ
  TIE-DETECTED` on the RED-proof scenario, and `seqDecision=TIMESTAMP-FALLBACK` on every row pair
  where either side predates the seq column -- exactly the designed fallback behaviour.

  TWIN-PAIR. Eight places create or insert into npdev_schema_history -- the production
  ensureHistoryTable plus seven test files that hand-roll their own inline CREATE TABLE. A test file
  missing the seq column does not fail: production's guardedAddColumn adds it, the seeded rows land
