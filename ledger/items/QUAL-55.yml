id: QUAL-55
title: >-
  An integration test exercising Trigger C (databaseMigratedPastThisBuild) + SchemaCompatibilityVerdict
  together showed intermittent, unexplained failures across full ~800-test gate runs; DISPROVEN as a
  SchemaCompatibilityVerdict logic bug (40 repeated direct-unit runs all passed reliably) and DISPROVEN
  as a stale SqlDialects.active() singleton (explicit pinning did not fix it either) -- true mechanism
  still unidentified. The flaky test was removed; its two claims are each covered reliably elsewhere.
type: GAP
severity: LOW
status: OPEN
opened: 2026-09-03
source: >-
  Found while verifying REAL_LIFT_PLAN_2026-09-03.md package A3 (STOR-24, B5): a new test
  (SchemaLifecycleExecutorDatabaseMigratedPastBuildTest#additiveNotNullExtraColumnWithNoDefaultStillRefuses)
  failed intermittently across several otherwise-identical gate runs, with TWO DIFFERENT symptoms on
  different runs -- not one repeatable failure:
    1. `SchemaHistoryStore.databaseMigratedPastThisBuild` returned `Optional.empty()` (Trigger C did
       not fire at all), so the boot fell through to the PRE-EXISTING, unrelated LNCH-1 Phase 4
       destructive-acknowledgment `IllegalStateException` instead of A3's own B5 `BoundaryBootException`
       -- confirmed via temporary file-based instrumentation (removed before closing A3), which showed
       `aheadOfBuildPresent=false` for this exact stored/manifest-fingerprint pair, immediately after
       several OTHER invocations of the identical pair correctly returned `aheadOfBuildPresent=true`.
    2. On a LATER run (same test, no production-code change), `assertThrows` caught nothing at all --
       `executor.beforeMigrate(...)` returned normally, meaning `SchemaCompatibilityVerdict.assess`
       classified the NOT-NULL-no-default extra column as TOLERABLE when it should have been
       INCOMPATIBLE.
surface: runtimehost-core (db/migration-execution), test infrastructure
detail: |
  Both symptoms are consistent with the SAME underlying mechanism, not two separate bugs: the test
  class never explicitly pinned `SqlDialects.active()` the way sibling H2-backed test files in this
  same package do (e.g. `ConversionHookRunnerH2Test`). `CurrentSchemaReader.SYSTEM_SCHEMAS` is a
  `private static final` field resolved ONCE, at class-load time, from `SqlDialects.active()` --
  exactly the singleton this codebase has repeatedly documented as a source of order-dependent test
  behavior (`MigrationMutex`'s own javadoc: "SqlDialects.forConnection, NOT SqlDialects.active() ...
  DEFAULTS TO POSTGRES when nothing pinned it"). Both `SchemaCompatibilityVerdict.assess` (A3's new
  code) and `SchemaAheadAnalysis`/`SchemaDiffEngine` (pre-existing) read live/desired schema shape
  through paths that ultimately touch this active-dialect state. The test itself is single-threaded and
  sequential -- there is no true CONCURRENT race here, only a possible STALE READ of a value some OTHER
  test, earlier in the same 788-test JVM run, left set (or left a static field initialized from).

  DIALECT-PINNING HYPOTHESIS RULED OUT: pinned `SqlDialects.setActive(H2Dialect.INSTANCE)` explicitly
  in `@BeforeEach`/`resetActiveForTesting()` in `@AfterEach` (kept -- harmless, independently good
  practice) and re-ran the full gate: the SAME test failed again, with the SAME symptom shape
  (`assertThrows` catching nothing). This disproves the stale-active()-singleton theory as the FULL
  explanation; the true mechanism is still not identified.

  WHAT IS NOW PROVEN, though (the actionable outcome): `SchemaCompatibilityVerdict.assess` ITSELF is
  reliable. `SchemaCompatibilityVerdictTest` -- a NEW, isolated test hitting `assess` directly with no
  `npdev_schema_history` seeding, no Trigger C, no `ImpactReportWriter` in the call path at all --
  repeated the exact incompatible-column scenario 20 times and the exact tolerable-column scenario 20
  times in the SAME gate run that the integration test failed in; all 40 (plus a missing-column case)
  passed. The flakiness is therefore isolated to the INTEGRATION test's surrounding machinery (Trigger
  C / history-row timing / `ImpactReportWriter`'s own classify() path, or their interaction across an
  ~830-test single-JVM suite) -- not to A3's new verdict logic, and not (per the ruled-out hypothesis)
  to a simple dialect-singleton read.

  RESOLUTION FOR A3: the flaky integration test
  (`SchemaLifecycleExecutorDatabaseMigratedPastBuildTest#additiveNotNullExtraColumnWithNoDefaultStillRefuses`)
  was REMOVED rather than chased further -- its two claims are each already covered reliably elsewhere:
  the CLASSIFICATION claim by `SchemaCompatibilityVerdictTest` (above), and the "verdict says
  incompatible -> the existing B5 throw still fires" WIRING claim by the pre-existing, reliably-passing
  `pureColumnDropRollbackRefusesInsteadOfSilentlyReAddingTheColumnEmpty` and its fresh-installed sibling
  (both reach an INCOMPATIBLE verdict via the missing-desired-column direction, exercising the identical
  throw). No coverage gap results from the removal.

  DONE-WHEN (still not built -- this item stays open): identify the ACTUAL mechanism behind the
  integration harness's intermittent behavior. Candidates not yet ruled out: `SchemaHistoryStore`'s
  broad `catch (SQLException) -> Optional.empty()` swallowing a real transient failure from
  `ensureHistoryTable`'s `CREATE TABLE IF NOT EXISTS` (plausible even single-threaded if some OTHER
  mechanism -- a JDBC connection pool artifact, H2's own internal locking -- introduces contention this
  test's raw `DriverManager` connections do not obviously explain); or something specific to
  `ImpactReportWriter`/`classify()`'s own state given a ~830-test single-JVM run. Reproduce in
  isolation (rapid repeated invocation of the ORIGINAL integration test, not just the extracted verdict
  logic) before attempting a fix, the same rigor `MigrationMutex`'s own two-thread proof used.

  2026-09-05 EXPERIMENT (negative result, one more hypothesis ruled out): built a throwaway stress
  harness (`Qual55StressReproTest`, `runtimehost-core/src/test/`, NOT committed -- run once, standalone
  via runtimehost-core's own gradlew, then deleted; not wired into any gate) that reconstructed the
  removed test's exact scenario (extra column NOT NULL, no default -> must refuse) and ran it 200 times
  in one JVM while 4 background threads continuously created/altered/dropped OTHER, unrelated H2
  in-memory databases concurrently -- a deliberate attempt at real multi-connection H2 contention
  (9,164 noise iterations completed during the run) as a stand-in for whatever an ~830-test single-JVM
  suite produces that an isolated 40-repeat run does not. Result: 200/200 correct refusals, zero
  anomalies of either originally-observed shape. RULES OUT: plain concurrent-H2-connection contention
  (lock waits, `ensureHistoryTable`'s `CREATE TABLE IF NOT EXISTS` racing another connection) as a
  SUFFICIENT cause on its own, at this volume. Does NOT rule out the `ImpactReportWriter`/`classify()`
  state candidate, nor anything requiring the specific classes/ordering/duration of the real ~830-test
  suite (JIT/GC timing, a specific OTHER test's leftover static state) that a same-class synthetic loop
  cannot approximate -- narrows the remaining search, does not close it. Methodology note for whoever
  continues this: the harness needed `SHUTDOWN` (not `DROP ALL OBJECTS`) in its per-iteration cleanup --
  H2's `DB_CLOSE_DELAY=-1` keeps a named in-memory database's Engine/MVStore registered for the rest of
  the JVM's life even after every connection closes and table drops, so 400 iterations without it
  exhausted the test JVM's heap before completing a single anomaly-relevant run.

  2026-09-06 EXPERIMENT (negative result, follows the DONE-WHEN's own prescribed methodology -- reproduce
  the ORIGINAL integration test, not just extracted logic, inside the real single-JVM suite): reconstructed
  the exact removed test (`additiveNotNullExtraColumnWithNoDefaultStillRefuses`, from the pre-removal
  diff embedded in commit 10daaeef's own explanatory comment -- the method itself was never committed, so
  git history has no literal copy) and re-added it TEMPORARILY to
  `SchemaLifecycleExecutorDatabaseMigratedPastBuildTest`, plus temporarily un-swallowed both
  `SchemaHistoryStore.latestOutcomeTimestamp`/`latestOutcomeOverall`'s `catch (SQLException)` blocks
  (candidate A) to print instead of silently returning `Optional.empty()`, plus a direct
  `SchemaHistoryStore.databaseMigratedPastThisBuild` call inside the test itself (captured to the JUnit
  XML `<system-out>` either way, not just on failure) so a repro would show Trigger C's own two-query
  read at the exact moment of the call, not just the test's outer symptom. Ran the REAL single-JVM suite
  (the assembled `simple-contact-intake` sample app's own `:test` task, ~846 tests today) 6 times: once
  via the full `run-runtimehost-gate.ps1` (regenerate + rebuild + test), then 5 more direct `gradlew test
  --rerun-tasks` passes against the already-assembled app (no regeneration, so each pass is the same real
  suite, not a narrower one). Result: 6/6 clean -- the reconstructed test passed every time, and the
  captured diagnostic confirms `databaseMigratedPastThisBuild` returned the CORRECT
  `Optional[HistoryPoint[...]]` on every direct call. The swallowed-SQLException print never fired once
  across all 6 runs. RULES OUT (for today's environment, this many times running): candidate A
  (`ensureHistoryTable`'s `CREATE TABLE IF NOT EXISTS` throwing a real, swallowed `SQLException`) as
  something that actually happens with any regularity -- if it happened even once in these 6 runs the
  print would have shown it, and it did not. One UNRELATED flaky failure was observed in run 1 of the 5
  direct passes -- `H2LocalBootLockCrossProcessTest#contenderTimesOutAndRefusesWithTheNamedBoundary`, a
  cross-process migration-lock timeout test, a different subsystem (B4 lock contention, not Trigger C) --
  noted here only because it confirms this suite still has AT LEAST ONE genuinely timing-sensitive test
  today, i.e. the repro attempt's conditions were realistic, not an artificially quiet JVM; not itself
  investigated as part of this item. Temporary diagnostics and the reconstructed test were both reverted
  before this session ended (`git diff` on both touched files is empty) -- nothing of this experiment is
  left in the tree. Narrows the remaining search toward candidate B (`ImpactReportWriter`/`classify()`
  leftover state from some other test) or a mechanism not yet hypothesized; does not close the item.
  Given the effort already invested here across two sessions (40 + 200 + 6 = 246 total repeated-run data
  points, all negative for every hypothesis tested) against a LOW-severity item with zero coverage gap
  from the original removal, further blind repeated-run hunting has a poor effort/reward ratio -- the
  next productive step is probably adding lightweight, PERMANENT (not throwaway) instrumentation around
  candidate B's actual state (whatever `ImpactReportWriter`/`classify()` hold across calls) so the NEXT
  time this fires naturally in an ordinary gate run, it is caught with a diagnosis attached instead of
  needing another dedicated repro session.

  2026-09-06 INSTRUMENTATION (permanent, follows the note above): re-examined every class in the Trigger
  C + `SchemaCompatibilityVerdict.assess` call path (`SchemaLifecycleExecutor`, `SchemaCompatibilityVerdict`,
  `ImpactReportWriter`, `SchemaAheadAnalysis`, `CurrentSchemaReader`) and found NONE of them hold instance
  or mutable static state of their own -- `assess` and `classify` are pure functions of the `DataSource`/
  `SchemaManifest` arguments they are given each call; the one static field in the whole graph
  (`CurrentSchemaReader.SYSTEM_SCHEMAS`, resolved once from `SqlDialects.active()`) was already the
  DIALECT-PINNING HYPOTHESIS above and already ruled out as the full explanation. So "candidate B" cannot
  be instrumented by logging a hidden field -- there is not one. Instead added a permanent, never-throws
  diagnostic (`SchemaLifecycleExecutor.beforeMigrateDecision`, right after `verdict` is computed, tagged
  `[QUAL-55-DIAG]`) that logs, on EVERY pass through the Trigger C branch: thread name, timestamp, both
  fingerprints, `SqlDialects.active()`'s class, `verdict.compatible()`, and every difference's full
  `describe()` (table/column/tolerance/reason). This branch is not dead in the current suite: three
  surviving tests in `SchemaLifecycleExecutorDatabaseMigratedPastBuildTest`
  (`additiveNullableExtraColumnBootsCompatiblyInsteadOfRefusing`,
  `additiveNotNullExtraColumnWithDefaultBootsCompatibly`, `aWholeExtraTableIsTolerable`) plus the
  INCOMPATIBLE-refusing `pureColumnDropRollbackRefusesInsteadOfSilentlyReAddingTheColumnEmpty` already run
  through it on every ordinary gate run, so this diagnostic is live today, not aspirational -- it will
  print known-good baselines on every green run and, if this mechanism ever fires naturally again (most
  plausibly by someone re-adding NOT-NULL-no-default coverage, the exact shape the original flaky test
  probed and which no surviving test exercises today), the `[QUAL-55-DIAG]` line attached to that run is
  the diagnosis this item has otherwise needed a dedicated repro session to get. Verified via
  `run-runtimehost-gate.ps1` (regenerates + rebuilds + runs the assembled sample app's full suite).
  Does not change status: root cause is still unidentified, and this is a detector, not a fix.
