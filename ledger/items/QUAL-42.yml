detail: |
  CORRECTION (2026-08-27, ledger remediation session): the original finding below was largely wrong
  about the SCENARIO half of this item. Verified directly against the corpus and the harness code
  before any fixture was touched:

  - All 30 scenarios were enumerated; 22 declare `expectedOutcome: "fail"` (negative/safety tests:
    procedure-raw-shell, panel-arbitrary-javascript, role-tenant-bypass, trusted-source-path-
    traversal, five command-policy-* scenarios, etc.) and only 8 declare `expectedOutcome: "pass"`.
  - The item's worked example, auth-disabled-protected-endpoint, is DESIGNED to fail AI schema
    validation: its own manifest declares `"expectedOutcome": "fail", "expectedFailureStage":
    "ai-model-schema"` and its expected-behavior declares FAIL_AI_MODEL_SCHEMA. Its ai-model.json
    violating the schema's /auth/mode const and /auth/testUsers minItems is the scenario working as
    designed, not fixture drift.
  - The harness provably accounts for expectedOutcome, by direct code reading (not assumption):
    run-ai-schema-validation.ps1 marks a negative scenario `passed` when its actual failure stage
    matches the declared expectedFailureStage, and run-ai-beta-gate.ps1 has explicit branches for
    terminal negatives (ai-model-schema / ai-config-schema / verification-schema / scope-policy),
    command-policy negatives, and smoke-verification negatives -- all of which skip the pipeline and
    score the scenario `passed` with expectedFailureMatched=true. The ~25-of-30 count came from
    reading the report artifact's per-stages evidence (raw `schemaValidation.schemas[N].status:
    failed`) without cross-referencing the scenario's manifest intent -- a reporting-legibility
    problem, not a scenario defect. VERDICT: (a), not (b) -- there is no fixture/schema drift to
    fix, and editing the 22 designed-negative fixtures would destroy the safety corpus.

  What SURVIVES this correction, and it is real: base-ai-loop (`kind: positive`, `expectedOutcome:
  pass`) schema-validates clean and its app boots and serves traffic (GET /actuator/health passes on
  the same run), yet its create-learner smoke check (POST /api/learners) draws 401
  `{"error":"invalid_api_key"}`. That is an auth-wiring mismatch between what the smoke verifier
  sends (scripts/ai/Invoke-AiRestSmokeVerifier.ps1 injects X-API-Key/X-NPDEV-API-Key from -ApiKey,
  which scripts/quality/invoke-ai-beta-app-smoke.ps1 derives from Ensure-NpdevApiKey's generated
  key) and what an app on profiles dev,step0,ai-beta-local accepts (NpdevAuthConfig wires
  ${npdev.auth.api-keys:} into RuntimeApiKeyAuthFilter; SEC-1 removed the seeded dev-key fallback).
  It has nothing to do with schemas or fixtures -- the app's own boot means StartupValidator saw a
  mapping and the filter rejected the exact key the verifier presented.

  ORIGINAL FINDING (2026-08-26, kept as the record; superseded by the correction above):

  Read the real report, not just the pass/fail headline. Two DISTINCT, unrelated failure patterns
  account for the vast majority of the 30 scenarios' red:

  1. SCHEMA/FIXTURE MISMATCH (~14 scenarios: 4,5,6,7,15,16,18,19,20,24,25,26,27,29 by index --
     everything whose stage 3 shows `schemaValidation.schemas[1]: failed`). Concretely, for
     `auth-disabled-protected-endpoint`:
       - `golden-ai-scenarios/auth-disabled-protected-endpoint/ai-model.json`'s `/auth/mode` does not
         equal the schema's required constant `"generated-test-token"`.
       - the same file's `/auth/testUsers` has fewer than the schema's required `minItems: 2`.
     This is a genuine drift between `schemas/ai/ai-model.schema.json`'s current constraints and the
     golden-ai-scenarios fixtures -- NOT a Docker-vs-Windows environment difference (schema
     validation is pure JSON, no OS-sensitive behavior). Whichever side is correct, the OTHER 13
     scenarios sharing this pattern were not individually inspected -- this item's own detail is
     scoped to what was actually read, not extrapolated.

  2. AUTH/API-KEY MISMATCH (multiple scenarios including scenario index 1, "base-ai-loop"): the
     REST smoke check's `create-learner` step (`POST /api/learners`) gets 401
     `{"error":"invalid_api_key"}` where 201 is expected. `health-ok` (`GET /actuator/health`) passes
     on the SAME running app, so the app itself boots and serves traffic -- this is specifically an
     API-key/auth-mode configuration mismatch between what the scenario's smoke verifier sends and
     what the generated app (profiles `dev,step0,ai-beta-local`) accepts, not a boot failure. The
     `appSmoke.boot: stopped` status seen alongside this is the harness's OWN deliberate shutdown
     after the smoke run ("Generated app process stopped after verification"), not a crash --
     correctly distinguished here from a real boot failure, which this is not.

  NOT a new regression from the 2026-08-25 remediation plan session: this run's dispatch predates
  nearly all of that session's commits reaching main (dispatched early, queued/ran independently),
  and the failure signature (472s in docker-run-ai-beta-gate, same step) matches the LAST real
  conclusion on 2026-08-17 (476s) closely enough to be the same underlying, persistent issue, not a
  new one this session introduced.

  LIVE VERIFICATION (2026-08-27): the complete single-scenario pipeline was run locally against the
  CURRENT tree -- sync-runtimehost-libs -> Normalize-AiContract(base-ai-loop) ->
  generator(--assembleFinalApp) -> invoke-ai-beta-app-smoke.ps1 (-Profiles dev,step0,ai-beta-local,
  fresh port), reproducing run-ai-beta-gate.ps1's exact per-scenario path. RESULT:
  build passed, health 200 UP, create-learner POST /api/learners -> **201** (not 401), smoke
  passed, exit 0. The 401 does NOT reproduce on the current tree. The app built and booted from
  today's source differs from the failing CI artifact's code only by an environment axis: the
  artifact came from the Docker/Linux container run (run 32917370685) on 2026-08-25/26 -- 606d8acc
  touched the smoke script only as a comment rename, so the auth chain is functionally identical to
  what that run had. Conclusion recorded: the create-learner 401 is either fixed by the 2026-08-23
  Ensure-NpdevApiKey wiring (977dbc9a) in a way the CI artifact's pre-commit snapshot did not
  reflect at dispatch time, or it is Docker/Linux-container-specific; it is NOT reproducible
  on Windows with today's tree. ACTION REQUIRED to close the docker thread definitively: re-dispatch
  the AI Beta Gate workflow (ubuntu docker-linux job) and read the fresh
  docker-linux-ai-beta-gate-report.json's summary block (expected-fail as-designed /
  expected-pass) -- a Windows machine cannot run a Linux-container proof (the docker daemon here is
  Windows-container mode; run-docker-linux-proof.ps1 itself records skips for that, exit 3).

  Done when: (1) the gate's verdict provably accounts for expectedOutcome (satisfied 2026-08-27 by
  code reading; verdict (a) recorded above), (2) the gate report reads in those terms -- a summary
  that states expected-fail (all as designed) / expected-pass (X passed, Y failed) instead of a bare
  failure count, (3) base-ai-loop's create-learner smoke check goes green against a live boot on
  profiles dev,step0,ai-beta-local with the root cause of the 401 wired correctly (verifier key vs
  app mapping) -- satisfied 2026-08-27: live boot returned 201; the residual docker-container
  question is tracked under the re-dispatch action above -- and (4) this item records which of
  (a)/(b) was true -- (a), done above.