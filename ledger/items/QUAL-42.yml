id: QUAL-42
title: >-
  AI Beta Gate report: a bare per-scenario failure count misreads designed-negative scenarios as
  defects (22 of 30 golden-ai-scenarios declare expectedOutcome fail); the one real, user-visible
  defect is base-ai-loop's create-learner smoke check drawing 401 invalid_api_key from a healthy app
type: GAP
severity: HIGH
status: OPEN
opened: 2026-08-26
source: >-
  2026-08-25 remediation plan W4.4 (closing QUAL-36): dispatched a fresh AI Beta Gate run
  (workflow_dispatch, run 32917370685) to get real, current signal after 6 days of cancelled
  dispatches. It completed (not cancelled) with `conclusion: failure` after 472s in the
  docker-run-ai-beta-gate step -- real signal, downloaded and read (docker-linux-ai-beta-gate-report.json,
  docker-linux-parity-report.json), not left as "still red, cause unknown" the way QUAL-36 found it.
surface: ai-beta-gate, golden-ai-scenarios, ai schema validation, runtimehost auth
files:
  - golden-ai-scenarios/auth-disabled-protected-endpoint/scenario.manifest.json
  - golden-ai-scenarios/auth-disabled-protected-endpoint/ai-model.json
  - golden-ai-scenarios/base-ai-loop/ai-verification-report.json
  - schemas/ai/ai-model.schema.json
  - scripts/quality/run-ai-beta-gate.ps1
  - scripts/quality/run-ai-schema-validation.ps1
