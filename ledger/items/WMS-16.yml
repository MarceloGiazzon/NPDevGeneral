verification: VERIFIED_LIVE
source: >-
  WMSOFFICE_SCREEN_PARITY_CHECKLIST.md 2.3 lines R6-R12 (Recebimento) and its Expedicao analogue,
  originally flagged as a BLOCKER declaration gap in WMS-9 (2026-09-18/20: "the item-level wizard
