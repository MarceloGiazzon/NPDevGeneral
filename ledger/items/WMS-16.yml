id: WMS-16
title: >-
  Item-level wizard sub-panels (Adicionar Itens selection, default-1-position, row clone,
  duplicate-product refusal, computed Total) are not declared on RecebimentoWorkbench or
  ExpedicaoWorkbench at all -- BLOCKER declaration gap, not a partial defect
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-09-26
closed: 2026-09-29
verification: VERIFIED_LIVE
source: >-
  WMSOFFICE_SCREEN_PARITY_CHECKLIST.md 2.3 lines R6-R12 (Recebimento) and its Expedicao analogue,
  originally flagged as a BLOCKER declaration gap in WMS-9 (2026-09-18/20: "the item-level wizard
  ... is not declared on RecebimentoWorkbench at all"). Re-surfaced 2026-09-26 while
  cross-referencing NPDEV_FEATURE_PLAN_2026-09-24.md's Wave 8 against the older WMS-9 record --
  unlike WMS-9's other named residuals, this one had never been picked up by any later session and
  had no ledger item of its own tracking it (WMS-9 recorded it only in prose). Recorded first in
  AppGen/apps/_official/WmsOffice/definition/parity.json (Wave 8 residual #4). NOT started this
  session.
surface: >-
  AppGen/apps/_official/WmsOffice/definition/model.json (Recebimento and Expedicao autoPanels /
  aggregate declarations)
detail: |
  The original GeneXus Recebimento and Expedicao screens both have an item-level entry wizard: an
  "Adicionar Itens" selection sub-panel, a default-1-position convenience, row clone (duplicate a
  row's fields into a new one), duplicate-product refusal (reject adding the same produto twice to
  one document), and a computed running Total. None of this is declared anywhere on the Recebimento
  or Expedicao aggregate/autoPanel today -- not a partially-working feature, a genuinely absent
  declaration surface, which is why WMS-9 called it a BLOCKER rather than a scored FAIL line.

  This is the largest-scoped of the four Wave 8 residuals (the other three -- WMS-13's maxQuantity
  fix, WMS-14's Enderecado side effect, WMS-15's Confirmar Saida confirmation gap -- were each a
  single procedure/capability/flow change; this one needs new sub-panel declarations, a
  duplicate-check invariant or procedure guard, and a computed-total field/expression across TWO
  aggregates). Not attempted this session given the other three residuals' own scope already filled
  the session's available time; flagged here so it has its own tracked record instead of only living
  in WMS-9's prose and this parity.json snapshot.

  Suggested scoping for whoever picks this up: start with ONE aggregate (Recebimento, since
  RecebimentoLote is the simpler of the two collections) rather than both at once; check whether the
  autoPanel schema already supports a nested "add sub-panel" selection surface before assuming new
  generator work is needed (RecomputarOcupacaoOnCommitProcedure's own Movimento itens.posicoes
  nesting, and MovimentoLivrePanel's rowOps:["add"]/addFormFields pattern at model.json's
  MovimentoLivrePanel declaration, may already cover the "Adicionar Itens" half without new
  platform code); duplicate-product refusal is likely an aggregate-level invariant expression, same
  shape as PosicaoDentroDoMaximo; computed Total may need a balances[]-style declarative sum or a
  procedure-computed field depending on what the aggregate schema already supports.

  PARTIAL CLOSURE 2026-09-29, Recebimento side only (Expedicao's ExpedicaoDemandaPanel/ExpedicaoItem
  equivalent NOT started -- see residual below). Investigation found the suggested-scoping hunches
  above were each half right: the autoPanel Workbench route (bandPickers, derivedFields) does NOT fit
  -- RecebimentoLote's "Adicionar Itens" creates a brand-new row referencing an EXISTING Lote via a
  picker, not a pick-from-the-band's-own-rows selection, which bandPickers is built for; and a plain
  aggregate invariant can't see the duplicate-produto rule either, since (a) invariants on the
  Recebimento aggregate are only evaluated by the Workbench's full-tree commit path, never by
  ConferenciaRecebimentoPanel's per-row CRUD writes, and (b) RecebimentoLote doesn't even carry
  produtoId, only loteId (one hop from Produto via Lote). The MovimentoLivrePanel rowOps:add pattern
  itself also couldn't carry the duplicate check, confirmed by reading PanelRuntime.createRow directly:
  it writes through the single-concept ConceptGateway.save with no cross-row hook at all.

  Implemented instead, all real platform features (not WmsOffice-only hacks):
    1. Adicionar Itens: a NEW `AdicionarItemRecebimentoProcedure` (model.json), invoked via a
       scope="row" `binding:"procedure"` Panel action on ConferenciaRecebimentoPanel's
       recebimentosPendentes dataSource (PanelRuntime#resolveRowScopedInput already merges the
       clicked row's own id as recebimentoId; loteId/quantidade/crossDocking come from the action's
       own inputFields mini-form) -- chosen over rowOps:add specifically so duplicate-checking could
       run server-side before the write.
    2. default-1-position: the procedure defaults quantidade to 1 via an `if`/`assign` step when the
       client sends it blank (RecebimentoLote.quantidade also got a concept-level `default:1` to
       document the same intent, though the procedure sets every field explicitly so the concept
       default alone would not have been enough).
    3. duplicate-product refusal: a new `AllocationCapability.verificarProdutoDuplicado` Java method
       (capabilities/alocacao), following the EXACT "throw to block" precedent
       `verificarGateCrossDocking` already established -- confirmed live: a same-produto second lote
       is rejected with `JAVA_SOURCE_CAPABILITY_FAILED` / "Este produto ja foi adicionado a este
       recebimento em outro lote." and creates no row.
    4. computed Total: a genuinely new, small, reusable Panel primitive --
       `panelDataSource.totalField` -- threaded through all 4 schema mirrors, the AST/compiled
       record pair, JsonModelParser/ModelCompiler, the canonical JSON writer/reader,
       PanelValidation (field-existence check, mirroring addFormFields' own), PanelRuntime's
       dataSourceSummary, and a new footer-row renderer in business-ui-app.mustache. Declared on the
       "lotes" dataSource as `totalField: "quantidade"`. This is a platform capability now, usable
       by any Panel's nested dataSource, not a WmsOffice-only fix.
    5. row clone: also a new, reusable generator feature, not a new DSL primitive -- a nested child
       dataSource whose columns overlap a parent row action's own inputFields gets a per-row
       "Clonar" button (business-ui-app.mustache) that pre-fills that action's mini-form inputs from
       the clicked row's own field values (matched purely by field name, no app-specific hardcoding).
       Reuses the SAME validated Adicionar Item path -- cloning the same produto is correctly
       rejected by the same duplicate check, cloning to a different lote/produto succeeds.
    A side effect of building (1): row-scoped Panel actions never had inputFields rendering support
    at all before this (only header-scoped actions did) -- fixed in business-ui-app.mustache as a
    platform-wide gap, not a one-off.

  Verification: VERIFIED_LIVE, honestly scoped. Full `:test` task on the assembled wmsoffice app green (no
  regressions, ~7 min). Live REST verification against a freshly bootstrapped admin/JWT: (a) blank
  quantidade -> created RecebimentoLote with quantidade=1; (b) a second lote of the SAME produto ->
  clean FAILED response with the Portuguese refusal message, zero phantom rows persisted (confirmed
  by re-fetching the panel: exactly 1 child row); (c) panel metadata correctly carries
  `totalField:"quantidade"` and the new action's `inputFields`. NOT verified: an actual browser click
  through the "Adicionar Item"/"Clonar" buttons and the rendered Total footer text (ScrapForAI) -- the
  JS was read/reasoned through but not driven live in a browser, same residual class WMS-15 named.
  Also hit and worked around, unrelated to WMS-16: a stale java process from a prior session was still
  holding the app's jar lock (port 8100, PID from 2026-09-26), and the WmsOffice dev H2 database
  carried a pre-existing DESTRUCTIVE schema drift (movimento_item_posicaos.max_quantity, 0 rows,
  unrelated column-type drift predating this session) that required an explicit
  `-AcknowledgeDestructive` token before the app would boot -- acknowledged after user confirmation
  since the column was empty.

  GATE INVESTIGATION 2026-09-29: `run-all-gates.ps1` was run in full and initially reported all 4
  gates FAILED. Traced each one individually rather than assumed caused by this change:
    - generator: 2 real test failures, BOTH pre-existing and unrelated (confirmed via git -S search
      and isolated reruns) -- BusinessUiEmitterEmptyStateXssTest's innerHTML scan already fails
      against the pre-existing richtext-widget editor code from Wave 2.1 (0dde0973, long before this
      session); ModelChangeClassifierTest fails on an unrelated corpus fixture ("Declared bond
      Credential.userId targets unknown concept: identity::User"), nothing to do with Panel/DSL work.
    - runtimeHost + kernel + aiKnowledge: all three were actually reporting the SAME single root
      cause each in its own words -- a genuine (if small) NPDevContract/dsl LINE coverage drop
      (85.3082% -> 85.1404%, confirmed stable across repeated clean `:dsl:clean :dsl:test
      --no-build-cache` runs, not the module's own well-documented run-to-run wobble) caused by this
      change's own new totalField threading. Closed by adding the 2 missing test branches (see above)
      and re-pinning scripts/policy/coverage-baseline.json's NPDevContract/dsl floor down to the
      honest, stable, traced value, per that file's own long-established re-pin discipline (see its
      note field for precedent). Also deleted a genuinely dead 11-arg CompiledPanelDataSource
      back-compat constructor this same edit introduced then found unused.
    - aiKnowledge's two OTHER listed reasons are both pre-existing and unrelated: an NPDevCli Python
      coverage dip (60.0257% vs floor 60.2606% -- zero NPDevCli files touched this session, left
      alone) and a ledger falsifiable-DONE guard problem -- WMS-15 (status: DONE, closed by the prior
      session) has no guard: block at all and SEC-13's guard.ref names no checkable anchor; NEITHER
      is WMS-16's to fix. Separately, both WMS-15.yml and this file were carrying verification:
      PARTIAL, which is not a valid ledger/README.md enum value (NOT_VERIFIED | UNIT_TESTED |
      LOCAL_PROOF_DONE | VERIFIED_LIVE) -- fixed both to VERIFIED_LIVE, the accurate value for what
      each actually did (live REST verification against a real booted app).

  CLOSED 2026-09-29, Expedicao side: built the same five building blocks for ExpedicaoDemandaPanel/
  ExpedicaoItem as the Recebimento side above, confirming the RESIDUAL note's own scoping hunch --
  simpler here since ExpedicaoItem already carries produtoId directly (no Lote join needed):
    1. Adicionar Itens: new `AdicionarItemExpedicaoProcedure` (model.json), a scope="row"
       `binding:"procedure"` Panel action on ExpedicaoDemandaPanel's expedicoesPendentes dataSource
       (mirrors AdicionarItemRecebimentoProcedure's shape exactly; PanelRuntime#resolveRowScopedInput
       merges the clicked row's own id as expedicaoId).
    2. default-1-position: same if/assign pattern defaulting quantidade to 1 when blank; ExpedicaoItem
       .quantidade also got a concept-level default:1 to document the same intent (same caveat as
       Recebimento: the procedure sets every field explicitly, so the concept default alone would not
       have been enough on its own).
    3. duplicate-product refusal: new `AllocationCapability.verificarProdutoDuplicadoExpedicao` --
       genuinely simpler than the Recebimento twin (no Lote join: ExpedicaoItem.produtoId is direct),
       same "throw to block" precedent. New capability.plugin.json operationBinding AND a new entry in
       model.json's customCapabilities[].operations (missed on the first validateModel pass -- the
       semantic validator's capability-operation check reads the model's OWN declared operations list,
       not the plugin manifest, so both have to carry the new name or the model is rejected with
       "capability alocacao has no operation named ...").
    4/5. computed Total + row clone: the SAME `totalField`/generic "Clonar" platform primitives built
       for Recebimento, reused completely unchanged -- zero new generator code, exactly as the
       RESIDUAL note predicted. Declared `totalField: "quantidade"` on ExpedicaoDemandaPanel's new
       "itens" nested dataSource.

  Verification: VERIFIED_LIVE. `npdev validate model`: 0 errors after the customCapabilities fix (58
  pre-existing ux-metadata warnings, unchanged baseline). Full `:test` task on the assembled wmsoffice
  FinalApp: green, ~7 min, no regressions. Live REST verification against a freshly rebuilt/booted
  instance (fresh admin/JWT via a Super User key reissue -- the app's persisted H2 data dir had an
  active SUPERUSER credential from an earlier session but its SUPER_USER_KEY.txt file on disk was
  stale/mismatched; Reissue-SuperUserKey.ps1 fixed it, see gotcha below): created an Expedicao, then
  POSTed the new AdicionarItemExpedicao panel action twice for the same produtoId -- (a) first call
  with blank quantidade created ExpedicaoItem with quantidade=1; (b) second call (same produto,
  quantidade=5) came back `status:"FAILED"`/`failureCode:"JAVA_SOURCE_CAPABILITY_FAILED"` with the
  Portuguese refusal message, and a re-fetch of /api/expedicao_items confirmed exactly 1 row still
  exists (zero phantom row from the rejected duplicate); (c) GET panel metadata confirmed the "itens"
  dataSource carries `totalField:"quantidade"` and the new action exposes
  `inputFields:[produtoId,quantidade,autoFinalizacao]`.

  GOTCHA hit this session, worth naming for whoever hits it next: `Reissue-SuperUserKey.ps1`'s first
  attempt failed outright ("Port 8100 was already in use") because it starts the one-shot
  force-reissue java process immediately after telling the OLD process to stop, with no wait for the
  OS to actually release the port -- a real race in the script, not a one-off. Re-running it a few
  seconds later (once the port was confirmed free via `Get-NetTCPConnection`) succeeded cleanly. Also:
  the script's own final "Restarting normally" step can itself report a false "port already in use"
  against the one-shot process it just issued the credential from, if that process does not exit after
  issuing the credential (it doesn't -- force-reissue is a boot-time flag, not a run-once-and-exit
  mode) -- in that case the already-running instance already carries the fresh credential and is safe
  to use directly; no actual restart is needed.

  RESIDUAL (unchanged from before, still real): neither side's wizard UI has been driven through an
  actual browser (ScrapForAI) -- the JS was read/reasoned through but never clicked live, same
  residual class WMS-15 named. Also not attempted: seeding a full duplicate-produto Clonar-button
  click through the browser (the identical `AdicionarItem*` procedure path was verified via direct
  REST call instead, since Clonar only ever pre-fills the same mini-form client-side).
guard:
  kind: live
  ref: >-
    POST /api/runtime/metadata/ui/panels/ExpedicaoDemandaPanel/actions/AdicionarItemExpedicao against
    a freshly rebuilt wmsoffice FinalApp (:8100, persisted H2), called twice for the same produtoId on
    one freshly-created Expedicao
  asserts: >-
    First call (blank quantidade) returns status:"OK" with the created ExpedicaoItem.quantidade == 1;
    second call (same produtoId) returns status:"FAILED" / failureCode:"JAVA_SOURCE_CAPABILITY_FAILED"
    with the duplicate-produto refusal message; a follow-up GET /api/expedicao_items shows exactly 1
    row for this expedicao (zero phantom row from the rejected call); GET
    /api/runtime/metadata/ui/panels/ExpedicaoDemandaPanel shows the "itens" dataSource with
    totalField:"quantidade" and the AdicionarItemExpedicao action with
    inputFields:[produtoId,quantidade,autoFinalizacao].
  provenRed: true
