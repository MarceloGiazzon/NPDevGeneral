id: REG-162
title: >-
  Rebuild-And-Restage.ps1's two cache-refresh steps silently build from/stage to the wrong
  directory when run from a git worktree, leaving the app's actual jar/generator cache stale
type: BUG
severity: HIGH
status: DONE
opened: 2026-08-14
closed: 2026-08-14
verification: VERIFIED_LIVE
source: >-
  Found while verifying RUN-1/R8a (a kernel + generator-template change) from an isolated git
  worktree (`.claude/worktrees/<id>`), following CLAUDE.md's own recommended workflow
  (`pwsh -File scripts/appgen/Rebuild-And-Restage.ps1 -AppFolder <appFolder>`, the "rebuild-app"
  skill). The rebuilt app compiled against STALE code twice over -- once for the generator
  templates, once for the kernel jar -- both times reporting success.
surface: appgen/rebuild-pipeline
files:
  - scripts/appgen/Rebuild-And-Restage.ps1
  - scripts/runtimehost/sync-runtimehost-libs.ps1
detail: |
  Two independent, compounding defects, both reproduced live on 2026-08-14 while rebuilding
  `simple-product-h2local` from worktree `D:\WorkSpace\NPDev\NPDev_General\.claude\worktrees\
  agent-ae322a63a08acbc26` (not the canonical `D:\WorkSpace\NPDev\NPDev_General` checkout):

  1. GENERATOR ROOT hardcoded, not threaded through. `AppGen\generator-runtime\
     prepare-npdev-generator-runtime.ps1` (lives OUTSIDE this repo, so its own file cannot be fixed
     here) defaults `-ProductRepo` to the LITERAL string `'D:\WorkSpace\NPDev\NPDev_General'` --
     exactly the REG-144 anti-pattern ("never hardcode D:\WorkSpace\... as a default"), just in a
     script this repo does not own. `Rebuild-And-Restage.ps1`'s step 2 calls it as
     `& $prepare -RuntimeRoot $GeneratorRuntimeRoot` with NO override for the source-repo location,
     so every invocation from a worktree (or any differently-located checkout) silently builds and
     packages the generator distribution from the WRONG source tree, reporting
     "Runtime pack prepared successfully" with zero error. Verified: after editing three
     `npdev-templates/*.mustache` files in the worktree and running the full wrapper, the refreshed
     `generator-0.1.0.jar` at `AppGen\generator-runtime\current\lib\` contained the OLD, unedited
     template text -- confirmed by extracting `npdev-templates/controller-base.mustache` from the
     jar and diffing against both trees. Manually re-running
     `prepare-npdev-generator-runtime.ps1 -ProductRepo <worktree path> -RuntimeRoot <same>` produced
     the correct jar.
  2. KERNEL/RUNTIMEHOST-CORE JAR STAGING lands in a worktree-scoped shadow directory even when
     `-RuntimeHostLibsDir` is passed explicitly. `Rebuild-And-Restage.ps1` threads ONE consistent
     `-RuntimeHostLibsDir` (default `D:\WorkSpace\NPDev\Build\runtimehost-libs`) to both
     `sync-runtimehost-libs.ps1` (step 1) and `Build-NpdevApp.ps1` (step 3) specifically to avoid
     the already-known `runtimehost-libs-dir-mismatch` class of bug. That part worked as designed --
     but the resulting app STILL compiled against a stale kernel jar
     (`ConceptGateway.listCapped`/`ConceptListSlice` from a same-session R8a edit were reported as
     "cannot find symbol"). Investigation: `D:\WorkSpace\NPDev\Build\runtimehost-libs\kernel-0.1.0.jar`
     stayed at its pre-session timestamp/size even though the sync step logged
     "Copied 2 local jar(s); 44 already current. Path: D:\WorkSpace\NPDev\Build\runtimehost-libs" --
     i.e. it reported writing to the CORRECT, explicitly-passed directory, but a freshly built
     kernel-0.1.0.jar (right size, contains the new classes, confirmed via `jar tf`) was found
     instead sitting in `D:\WorkSpace\NPDev\NPDev_General\.claude\worktrees\Build\runtimehost-libs`
     -- a worktree-scoped shadow path that is never what any caller asked for. Same for
     `runtimehost-core-0.1.0.jar`/`-sources.jar`. Root cause NOT fully isolated (this session did not
     have budget to trace it through `sync-runtimehost-libs.ps1`'s "already current" staleness check
     vs. its `Get-NPDevBuildRoot`-derived `$externalBuildRoot` jar-discovery path -- see that
     script's lines ~26-57), only the reproducible symptom: the explicitly-requested target
     directory is left stale while a correct copy silently lands somewhere else. Worked around by
     manually copying the freshly built jars over the stale ones.

  Net effect: `Rebuild-And-Restage.ps1` -- the wrapper CLAUDE.md itself recommends ("prefer this
  one wrapper") specifically to prevent "my change had no effect" -- produces exactly that failure,
  silently, with a fully green exit code, whenever run from a git worktree (or any checkout other
  than the literal `D:\WorkSpace\NPDev\NPDev_General` path). Given this session's own working
  arrangement (an isolated worktree per agent) is evidently a normal way this platform's sessions
  run, this is not an edge case.

  Not fixed here (found while verifying RUN-1/R8a's own kernel + template change, unrelated to
  either R8a's or R8b's actual defects) -- flagging per this session's own instructions rather than
  scope-creeping a fix into an unrelated PR. A real fix needs: (a) `prepare-npdev-generator-runtime.ps1`
  gaining a way to receive the calling repo's root (or `Rebuild-And-Restage.ps1` doing its own
  copy-templates-first workaround), and (b) tracing `sync-runtimehost-libs.ps1`'s staleness
  comparison end-to-end under a worktree to find where it diverges from the directory it reports.

  --- Fix pass addendum (2026-08-14): sub-issue 1 fixed, sub-issue 2 root-caused + mitigated ---

  Both sub-issues addressed in `fix/reg-162-rebuild-worktree-staleness`, working from the SAME
  worktree class this item was filed against. Full real rebuild-and-restage end-to-end verification
  (the actual proof that a worktree edit reaches a running generated app) was deliberately deferred
  to a later consolidated pass per this session's own instructions -- everything below is either a
  code-read argument, an isolated PowerShell parse/logic check, or a live empirical dry-run of just
  the path-resolution functions involved, run from this session's own real worktree
  (`.claude\worktrees\agent-a03b49b98b37b7bd5`) and cross-checked against the canonical checkout and
  a simulated CI-style nested checkout. No `gradlew` build was run.

  SUB-ISSUE 1 -- FIXED. `Rebuild-And-Restage.ps1` already computed its own repo root correctly
  (`$repoRoot = (Resolve-Path (Join-Path $PSScriptRoot '..\..')).Path`, the same PSScriptRoot-relative
  pattern REG-144 established) but never passed it on to the external prepare script. Step 2 now
  calls `& $prepare -ProductRepo $repoRoot -RuntimeRoot $GeneratorRuntimeRoot` instead of
  `& $prepare -RuntimeRoot $GeneratorRuntimeRoot` -- so the external script's own hardcoded
  `'D:\WorkSpace\NPDev\NPDev_General'` default can never win regardless of where this repo is
  checked out. (Read, but did not modify, `prepare-npdev-generator-runtime.ps1`'s own
  `$ExternalBuildRoot` resolution at its lines 100-105: with no `-ProductRepo` override it falls back
  to `$ProductRepo`'s own parent directory, which for a worktree lands on the SAME shadow
  `<worktree>\..\Build` path sub-issue 2 chases below -- but that variable is only used there to
  RE-DISCOVER where Gradle's OWN `:generator:installDist` just wrote its output, using the SAME
  Parent-based logic NPDevGenerator's own build.gradle uses with no override passed either, so the
  two sides still agree with each other even when both land on the shadow path -- confirmed by
  reading NPDevGenerator/build.gradle's `resolveNpdevBuildRoot`. This makes the external script's own
  scratch/intermediate build location a stray-disk-usage concern at worst, not a correctness bug --
  the `-RuntimeRoot` final destination is untouched by it. Not proven live; not in scope to prove
  live this session.)

  SUB-ISSUE 2 -- ROOT CAUSE FOUND, FIX APPLIED, PLUS A SAFETY NET (defense-in-depth, since the exact
  end-to-end mechanism that landed a jar specifically at the literal path
  `...\.claude\worktrees\Build\runtimehost-libs` the original session reported was not traced
  100% of the way through a live rebuild).

  Root cause: `Get-NPDevBuildRoot` (scripts/npdev-common.ps1) walks UP from a workspace root looking
  for the first ancestor directory that contains NPDevContract + NPDevGenerator + NPDevKernel, then
  returns THAT ancestor's PARENT + "Build". A git worktree checked out under this repo
  (`.claude\worktrees\<id>`) is a full checkout -- it legitimately contains its own copies of those
  three directories, so it satisfies the predicate at the WORKTREE'S OWN root, one level earlier than
  intended. Empirically confirmed live (no build; pure path resolution) from this session's own
  worktree, BEFORE any fix:

    Get-NPDevWorkspaceRoot(<worktree>\scripts\runtimehost) -> <worktree> itself (correct, expected --
      the worktree IS a valid workspace root by the same predicate, and source code for a build must
      come from here, not the canonical checkout, or a worktree's own edits would never be used)
    Get-NPDevBuildRoot(<worktree>) -> D:\WorkSpace\NPDev\NPDev_General\.claude\worktrees\Build

  That second line matches the original session's reported shadow path byte-for-byte. Since
  `sync-runtimehost-libs.ps1` never threads `-WorkspaceRoot` through from `Rebuild-And-Restage.ps1`
  and so resolves its own default the same way, this WRONG value becomes `$externalBuildRoot`,
  gets passed as `-PnpdevBuildRoot=<shadow>` to the kernel/generator/runtimehost-core local jar
  builds, AND gets written into `$env:NPDEV_BUILD_ROOT` (sync-runtimehost-libs.ps1 line 59) for the
  rest of the PowerShell session -- an env var multiple build.gradle files (NPDevKernel,
  NPDevGenerator, runtimehost-core; confirmed by reading all three) explicitly check as a fallback
  BEFORE their own directory walk, and `NPDEV_RUNTIMEHOST_LIBS_DIR` (a sibling env var,
  runtimehost-core/build.gradle's `resolveNpdevRuntimeLibsDir`, REG-137) is checked BEFORE the `-P`
  gradle property even when one is passed explicitly. This gives a concrete, code-confirmed pathway
  for a later, env-var-unaware Gradle invocation in the same session to silently land jars in the
  shadow location -- but the individual gradle invocations THIS script itself makes were re-read and
  found to pass explicit `-P` overrides consistently, so the exact call that produced the originally
  reported literal `...\runtimehost-libs\kernel-0.1.0.jar` shadow copy was not pinned down to one
  single line; it is very plausibly a downstream consumer of the leaked `$env:NPDEV_BUILD_ROOT`
  and/or a stale `$env:NPDEV_RUNTIMEHOST_LIBS_DIR` left over from an earlier command in that session's
  shell, neither of which this fix pass could reproduce without the deferred full rebuild.

  Fix: `Get-NPDevBuildRoot` now keeps climbing PAST a matching ancestor instead of stopping at the
  first one, and returns the OUTERMOST match's parent + "Build". A worktree nested under the
  canonical checkout has exactly one further matching ancestor above it (the canonical checkout
  itself), so climbing to it recovers the single shared `D:\WorkSpace\NPDev\Build` by construction,
  under any worktree name or depth -- no "am I a worktree" special-casing needed. `Get-NPDevWorkspaceRoot`
  itself was deliberately left UNCHANGED: it must keep resolving to the INNERMOST match (the worktree)
  so that source-code paths (NPDevKernel, NPDevGenerator, NPDevContract) are read from the worktree's
  own edited tree, not the canonical checkout -- only the shared BUILD OUTPUT location needed to widen
  its search.

  Verified live (path resolution only, no build) after the fix:
    Get-NPDevBuildRoot(<worktree>)           -> D:\WorkSpace\NPDev\Build            (was: shadow, now FIXED)
    Get-NPDevRuntimeHostLibsDir(<worktree>)  -> D:\WorkSpace\NPDev\Build\runtimehost-libs (FIXED)
    Get-NPDevBuildRoot(<canonical checkout>) -> D:\WorkSpace\NPDev\Build            (unchanged, no regression)
    Get-NPDevBuildRoot(<simulated CI checkout nested as .../NPDevGeneral/NPDevGeneral,
      REG-144's own no-name-match case>)     -> .../NPDevGeneral/Build             (unchanged, matches
                                                 REG-144's already-fixed expectation)

  Safety net (added regardless of the above, since the full causal chain to the ORIGINAL session's
  exact reported symptom was not conclusively closed): `sync-runtimehost-libs.ps1` now re-verifies,
  right after staging, that every required jar actually sitting in `$runtimeHostLibs` is
  byte-identical (SHA-256, size-checked first) to the source file `Sync-NPDevJars` itself recorded as
  authoritative for that name. Any mismatch throws immediately with the jar name and both paths named
  in the error -- non-zero exit, no silent "already current" success against a stale target. This
  catches the exact reported failure shape (staged file quietly stays stale while the script reports
  success) regardless of which upstream mechanism produced the divergence, including any leaked-env-var
  path this session did not manage to reproduce directly. Unit-tested in isolation (matching-content
  and stale-content cases both behave correctly); not exercised inside a real `-BuildLocalJars` run
  this session.

  **2026-08-14 (closeout batch-verification pass): the deferred full rebuild-and-restage proof now
  run for real**, from an actual `EnterWorktree`-created worktree
  (`.claude\worktrees\reg162-verify`), against a real AppGen app
  (`D:\WorkSpace\NPDev\AppGen\apps\simple-user-registry-inmemory`):

  1. Path resolution, standalone: sourced `scripts/npdev-common.ps1` from inside the worktree and
     called `Get-NPDevBuildRoot`/`Get-NPDevRuntimeHostLibsDir` directly with no override env var
     set. Both resolved to the correct SHARED paths (`D:\WorkSpace\NPDev\Build` /
     `D:\WorkSpace\NPDev\Build\runtimehost-libs`), not the `.claude\worktrees\Build\...` shadow path
     the original session reported -- confirming sub-issue 2's fix holds for the exact scenario
     this item's `guard:` names.
  2. Full wrapper run: added a one-line marker comment to
     `NPDevGenerator/generator/src/main/resources/npdev-templates/controller-base.mustache`
     (`// REG162-WORKTREE-PROBE-MARKER`) inside the worktree, then ran `Rebuild-And-Restage.ps1
     -AppFolder <the app> -GenerateOnly` from the worktree. Step 1 (`sync-runtimehost-libs.ps1
     -BuildLocalJars`) logged `Path: D:\WorkSpace\NPDev\Build\runtimehost-libs` (the correct shared
     directory, not a shadow path) and reported `0 local jar(s) copied; 47 already current` (no
     kernel/runtimehost-core source changed in this worktree, so the safety net's SHA-256 check
     correctly found nothing stale). Step 2 (`prepare-npdev-generator-runtime.ps1`) ran against the
     worktree's own tree. The marker string was then found, live, in the generated app's actual
     assembled output (`Build\generated-finalapps\simple-user-registry\App\npdev-generated\src\main
     \java\com\npdev\generated\controllers\UserControllerBase.java`) -- proving the worktree's own
     edited template, not the canonical checkout's, is what reached the generated app. Marker
     reverted (`git checkout --`) before the worktree was removed; no change kept from this probe.

  This closes the residual uncertainty the safety net was added to cover: both sub-issues are now
  confirmed live, not just by code-reading, for the exact worktree scenario this item describes.

  Files changed (absolute):
    D:\WorkSpace\NPDev\NPDev_General\scripts\appgen\Rebuild-And-Restage.ps1
    D:\WorkSpace\NPDev\NPDev_General\scripts\npdev-common.ps1
    D:\WorkSpace\NPDev\NPDev_General\scripts\runtimehost\sync-runtimehost-libs.ps1
guard:
  kind: manual
  ref: >-
    from a real git worktree of this repo (e.g. via EnterWorktree), with no NPDEV_BUILD_ROOT /
    NPDEV_RUNTIMEHOST_LIBS_DIR override set: (1) source scripts/npdev-common.ps1 and call
    Get-NPDevBuildRoot / Get-NPDevRuntimeHostLibsDir with the worktree as WorkspaceRoot; (2) run
    scripts/appgen/Rebuild-And-Restage.ps1 -AppFolder <any AppGen app> against a template edited
    inside the worktree, then check whether the edit reached the assembled app's generated output
  asserts: >-
    Get-NPDevBuildRoot/Get-NPDevRuntimeHostLibsDir resolve to the canonical checkout's shared
    D:\WorkSpace\NPDev\Build (not a path nested inside the worktree's own .claude\worktrees tree),
    sync-runtimehost-libs.ps1 stages to that same shared path, and a template edit made inside the
    worktree is what reaches the generated app's assembled output
  provenRed: true
