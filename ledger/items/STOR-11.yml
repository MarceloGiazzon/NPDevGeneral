id: STOR-11
title: >-
  On MySQL a create that violates a unique constraint returns 200 and OVERWRITES the row that held
  the value, because ON DUPLICATE KEY UPDATE reacts to every unique index -- the dialect's own
  javadoc said no NPDev schema could produce this shape, and any `unique: true` field does
type: BUG
severity: HIGH
status: DONE
opened: 2026-08-08
closed: 2026-08-09
verification: VERIFIED_LIVE
surface: kernel/storage-dialect (MySqlUpsertStrategy)
source: >-
  storage/OPEN_ITEMS_PLAN.md W10, Tier C vector I3 against a REAL MySQL 8.4 container. Every other
  Tier C vector (E1, E2, I2) passed in the same run.
detail: |
  MySQL has no "on conflict with THIS key". `INSERT ... ON DUPLICATE KEY UPDATE` fires on a clash
  with ANY unique index on the table, so an upsert keyed on the id updates a row the caller never
  named. Postgres and H2 say `ON CONFLICT (id)`, which reacts only to the primary key and raises on
  any other unique violation.

  MEASURED, not inferred:

      POST /api/concepts/accounts {email: X, region: R}   -> 200   (row created)
      POST /api/concepts/accounts {email: X, region: R}   -> 200   <-- must be >= 400
      SHOW INDEX FROM accounts   ->  ux_accounts_email  Non_unique = 0   (the index IS there)
      SELECT ... FROM accounts   ->  2 rows, both emails distinct       (nothing duplicated)

  The constraint exists and is correct. The engine simply treats the violation as an instruction to
  update. So a user creating a record whose unique field collides with someone else's does not get
  an error -- they overwrite that person's row, with their own values, and are told it succeeded.

  WHY IT SURVIVED, AND WHY THAT PART MATTERS MOST

  This divergence was KNOWN. `MySqlUpsertStrategy`'s javadoc described it exactly, and then closed
  with:

      "Nothing in NPDev's generated schema puts a second unique index on a table it also upserts by
       id today, and the divergence is recorded here rather than discovered later."

  That sentence was false when it was written. Any model field declaring `unique: true` produces
  precisely that shape, and `unique: true` is an ordinary thing to declare. The record was correct
  about the ENGINE and wrong about NPDEV, which is the more dangerous half -- it turned a real
  hazard into a closed question, and the assumption was never tested because no corpus app had ever
  run on MySQL at all.

  The javadoc has been corrected in the same commit that filed this. The behaviour has not.
resolution: |
  DONE. **UPDATE-then-INSERT**, per storage/parity/ENGINE_PARITY_PLAN.md P0's decision, and the
  alternatives were weighed rather than skipped: refusing `unique: true` on MySQL was REJECTED (an
  ordinary declaration an engine cannot honour makes that engine second-class, which is the thing
  the parity workstream exists to prevent), and INSERT-first-then-UPDATE-on-1062 was DEFERRED, not
  rejected -- it saves a round trip on the create path but puts vendor error-code branching in the
  write path to save a cost nobody has measured.

  The operation is now a PLAN rather than a statement: new `UpsertPlan` carries the steps AND the
  columns each one binds, with one execution rule stated once -- run in order, STOP after the first
  step that affects a row. Engines whose native upsert can name its conflict target keep their
  single ATOMIC statement and are byte-identical to before; only MySQL gets two steps. Bind order
  travels with each statement for the same reason `PaginationClause` exists: UPDATE binds values
  then key, INSERT binds every column in declaration order, and a caller assuming one order for both
  would write the id into a value column -- silently, since both are strings.

  THE SECOND HALF, which the measurement forced and the plan demanded: "identical status code and
  response body", not merely "an error on both". Fixing the overwrite made MySQL return 500 while
  Postgres returned 409. The cause was NOT the engine -- `GeneratedCrudRuntimeSupport.isUniqueViolation`
  decided by substring-matching the driver's message:

      contains("duplicate key") || contains("unique constraint")
          || contains("already exists") || contains("violates unique")

  Those are Postgres's four phrases. Measured, same request per engine:

      Postgres     duplicate key value violates unique constraint "..."   match    -> 409
      SQL Server   Cannot insert duplicate key row ... unique index       match    -> 409
      MySQL        Duplicate entry 'x' for key 'accounts.ux_...'          NO match -> 500
      H2           Unique index or primary key violation                  NO match -> 500

  **Half the engines were wrong, including H2 -- the DEFAULT.** Two matched by luck of phrasing. It
  now asks `SqlDialect.isUniqueViolation` (SQLSTATE + vendor code, STOR-12) first and keeps the
  message test only as a fallback for callers that wrap a non-SQL failure. `isForeignKeyViolation`
  had the same shape and was widened to MySQL's 1451/1452 and SQL Server's 547.

  MEASURED, against real containers on the pinned digests:

      MySQL       Tier C 4/4 AND app proof 4/4; I3 duplicate -> 409, body
                  {code=unique_integrity_failed, invariant=database_unique_constraint} -- the
                  SAME body Postgres writes
      SQL Server  Tier C 4/4 (report artifact), no regression
      Postgres    I3 -> 409, unchanged
      H2          I3 -> 409, up from 500 -- a second parity gap closed on the default engine

  Tier A vector U3 asserts the plan shape per engine, including that the three atomic engines are
  NOT split (a race they never had) and that the two bind orders are exactly right.
