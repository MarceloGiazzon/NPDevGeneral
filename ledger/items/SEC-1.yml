id: SEC-1
title: >-
  Every generated app ships two published ADMIN API keys and boots on that profile
type: BUG
severity: HIGH
status: DONE
opened: 2026-08-12
closed: 2026-08-13
verification: VERIFIED_LIVE
source: >-
  Full-repo maturity audit 2026-08-12 (MASTER-ROADMAP.md, ROADMAP.md card R7). Cleaning
  application-dev.yml alone changes nothing observable -- the real fix is
  npdev-templates/npdev-runtime-api-key-auth-filter.mustache, whose generated auth filter has an
  ADMIN fallback. curl -H "X-Api-Key: dev-key" returns 200 against any generated app today.
surface: runtimehost/auth
files:
  - NPDevGenerator/generator/src/main/resources/npdev-templates/npdev-runtime-api-key-auth-filter.mustache
  - NPDevRuntimeHost/src/main/resources/application-dev.yml
  - NPDevRuntimeHost/src/main/resources/application.properties
  - NPDevRuntimeHost/src/main/resources/application-prod.properties
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/dbconfig/OperationalRunbookEmitter.java
detail: |
  See __OutsideRepo/strategy-2026-08-12/ROADMAP.md card R7 (Wave 3, milestone M2) for the 4-stage,
  16-step, 4-session spec: fail closed (auth-filter fallback), profiles (real application-prod,
  explicit -Pprofile), key generation (per-app random key in secrets/), migration surface (grep
  api-dev/dev-key repo-wide -- 22 browser routines, 13 sample configs in 3 mirrored trees). Decisions
  D4/D5 already recorded: one ADMIN key for v1, printed once on first launch. MASTER-ROADMAP.md
  Step 12 (Stages A+B+C only; Stage D is its own later step, gated on A+B+C).

  **Stage A (fail closed) DONE 2026-08-13**, branch step12-r7-stage-a. The real vulnerability,
  confirmed by direct code reading before touching anything: `RuntimeApiKeyAuthFilter`'s
  `DEFAULT_API_KEY_MAPPINGS` constant silently activated in TWO cases -- no `npdev.auth.api-keys`
  value at all, OR a value that parsed to zero valid entries (a malformed config, e.g.
  `"garbage=notarealmapping"`, which passes `StartupValidator.validateAuth()`'s crude
  `.contains("=")` check but yields nothing usable) -- meaning ANY misconfigured deployment, not
  just `dev`, silently granted ADMIN via `api-dev`/`dev-key`. `FinalAppAssembler.
  writeAiBetaLocalProfile` independently hardcoded the identical pair a second time into
  `application-ai-beta-local.yml`.

  Fixed: the mustache template's fallback (both trigger sites) and `FinalAppAssembler`'s hardcoded
  seed pair are both removed -- a misconfigured/empty/malformed mapping now correctly parses to an
  EMPTY map, so every API key request 401s as `invalid_api_key` rather than silently authenticating
  as an administrator. `application-dev.yml`'s dead `npdev.security.*` duplicate block (nothing in
  the repo binds that prefix, confirmed by grep) is also removed.

  **Deliberately NOT touched in Stage A**: `application-dev.yml`'s live `npdev.auth.api-keys` value
  (still `api-dev=dev:developer:admin;dev-key=dev:developer:admin`) -- blanking it now, before
  Stage C's real per-app key generator exists, would hard-fail EVERY app's boot via
  `StartupValidator.validateAuth()` (confirmed: `npdev.auth.enabled` defaults to `true`, so this
  check genuinely runs on every boot including `dev`). The roadmap's own "sequence Stage C before
  Stage B" warning is read as covering this too -- `dev`'s own known key is an accepted, separately
  documented risk (CLAUDE.md: "the dev profile ships a known key and is not for their real data"),
  not what Stage A's "fail closed" goal targets. Stage A's real, complete, self-contained value is
  closing the CODE-LEVEL backdoor that worked regardless of profile.

  Verified LIVE, not just unit-tested: generated a real app, built it, booted it twice.
  (1) Normal dev boot: `dev-key` still returns 200 (proving the live YAML value was correctly left
  alone). (2) Same app rebooted with `--npdev.auth.api-keys=garbage=notarealmapping` (a config that
  passes StartupValidator but previously triggered the ADMIN fallback): `dev-key` and `api-dev` now
  both return 401 `invalid_api_key` -- confirmed via curl against a live process, not assumed.
  `GeneratorApiVersioningContractTest` updated to assert the fallback's absence from generated
  source (was asserting its presence). Full DSL (1695/1695) and generator (319/319) suites green.

  Two additional exposures found by this stage's research but explicitly out of scope for it,
  flagged for Stage B/C: (1) a second, independent launcher pipeline (`scripts/appgen/
  Build-NpdevApp.ps1`/`Build-ClaudeApp.ps1`) defaults BOTH the Spring profile (`dev,step0,trial`)
  AND the API key (literal `dev-key`) via PowerShell parameter defaults -- a different mechanism
  from the ones this stage touches; (2) `application-dev.properties` (a sibling, non-conflicting
  file, confirmed to carry no auth-related keys) and an `optional:classpath:
  application-npdev-auth.properties` import (confirmed not to exist anywhere in the repo) were
  checked and ruled out as additional hidden defaults.

  Stage B (profiles) and Stage C (per-app random key generation) remain OPEN, to be picked up as
  their own step(s) continuing MASTER-ROADMAP.md's ordering. This item stays OPEN until the full
  card (A+B+C) closes -- Stage A alone does not yet make `dev`'s own known key stop working, only
  the misconfigured/production-adjacent fallback.

  **Stage C (per-app random key generation) DONE 2026-08-13**, branch step12-r7-stage-c, sequenced
  BEFORE Stage B per the roadmap's own "sequence Stage C before Stage B or every app stops booting"
  warning. New idempotent PowerShell function `Ensure-NpdevApiKey`
  (`OperationalRunbookEmitter.java`, sibling to `SECRETS_ENV_LOADER`, not a generalization of it --
  that loader is agent-proxy-specific and the generator must never write the file it reads; this one
  the launcher may). First call for an app with no `secrets/api-key.env`: generates a
  `RandomNumberGenerator`-backed (not `Get-Random`, which is not a CSPRNG) key, writes ONE line
  (`NPDEV_AUTH_API_KEYS=<key>=dev:developer:admin` -- the exact `key=tenantId:actorId:roles` shape
  `RuntimeApiKeyAuthFilter.PrincipalClaims.parse` expects), and prints it once (D4/D5). Every call
  loads that line into `$env:`, so it is safe to call from any script needing the key regardless of
  order. Wired into `runFinalAppScript()` (before the `java -jar` launch) and `smokeTestScript()`
  (which now resolves its own header key via the same function instead of the generation-time
  `$plan.apiKey`, making it correct standalone or right after a fresh boot).

  **Confirmed via direct code reading, not assumed**: `$env:NPDEV_AUTH_API_KEYS` binds onto
  `npdev.auth.api-keys` through Spring Boot's standard relaxed env-var binding. Because that
  property is a single String (not a List/Map), `RuntimeApiKeyAuthFilter.parseMappings` never merges
  sources -- the env var (highest precedence) REPLACES `application-dev.yml`'s value outright. **Net
  effect: `dev-key`/`api-dev` stop authenticating on every regenerated app the moment this lands**,
  closing the "dev profile ships a known key" gap Stage A explicitly deferred -- as a side effect of
  Stage C, not something Stage B needed to separately fix.

  `NPDevCli/npdev_monitor.py`'s `probe_app()` (`record["apiKey"]`) redirected to prefer the live
  `secrets/api-key.env` value over the now-generation-time-only `plan.apiKey`, via new helper
  `_read_live_api_key`. `redact()`'s existing `api[_-]?key` regex needed no change -- confirmed the
  field name is unchanged, closing the pending item Stage A flagged.

  Verified LIVE: generated a fresh app with no pre-existing `secrets/api-key.env`, booted via
  `_ops\Run-FinalApp.ps1` -- banner printed exactly once, file created with the expected shape;
  `curl -H "X-Api-Key: dev-key"` now 401s; `curl -H "X-Api-Key: <printed key>"` returns 200; stopped
  and restarted WITHOUT deleting the secrets file -- banner did not reprint, the same key still
  authenticated; `_ops\Smoke-Test.ps1` run standalone against the running app resolved the key
  itself and reported PASS. Full DSL and generator regression suites green, zero regressions.

  **Explicitly deferred, filed separately as REG-152**: `Build-NpdevApp.ps1`/`Build-ClaudeApp.ps1`
  are a second, fully independent launch-script generator (own `Test-App.ps1`/`New-AppConsole.ps1`,
  never wired to `--npdev.auth.api-keys` at all -- their `'dev-key'` default only ever worked by
  coincidence). Once an app is launched through that pipeline, its own smoke test and console will
  send a now-stale key. Not fixed here per this session's "unrelated bugs filed separately"
  discipline; needs its own scoped step.

  **Stage B (profiles) DONE 2026-08-13**, branch `step12-r7-stage-b`, completing MASTER-ROADMAP.md
  Step 12's A+B+C scope (Stage D -- the migration surface: 22 browser routines, 13 sample
  `config.json` files, `GeneratorApiVersioningContractTest`'s literals, etc. -- is its own later
  step per the roadmap's own "Stage D is its own later step, gated on A+B+C" framing, not part of
  this item's scope).

  Three changes, traced against real config-resolution behavior before touching anything (the same
  discipline Stage A/C used): (1) `application.properties`'s `spring.profiles.default=dev` is
  removed -- an un-profiled boot now activates Spring's OWN reserved `default` profile
  (`application-default.properties`: governed execution mode, no seeded auth keys) instead of
  silently becoming `dev`. Confirmed by direct code/config reading first: every supported launcher
  already passed an explicit profile before this change (`Build-NpdevApp.ps1`/`Build-ClaudeApp.ps1`:
  `--spring.profiles.active=dev,step0,trial`; the two packaged-app proof tests
  `HardenGcDeleteReplaceCascadePackagedGeneratedAppRuntimeProofTest`/`HardenObjstoreFileUpload...`:
  same; `FinalAppAssembler`'s generated README: `--spring.profiles.active=dev`; every
  `@SpringBootTest` in `NPDevRuntimeHost/src/test`: explicit `@ActiveProfiles`) -- `_ops/
  Run-FinalApp.ps1` (`OperationalRunbookEmitter.runFinalAppScript()`) was the ONLY caller relying on
  the implicit default, confirmed by grep for `spring.profiles.default`/`spring.profiles.active`
  repo-wide. (2) `NPDevRuntimeHost/src/main/resources/application-prod.properties` now exists --
  `DockerDeploymentEmitter` has named `SPRING_PROFILES_ACTIVE=prod`(`,postgres`) in every generated
  `docker-compose.yml`/`.env.example` since LNCH-7 with no backing file. Deliberately minimal:
  no storage mode (that stays the `postgres` Spring profile + env vars' job) and no seeded admin
  key -- `npdev.auth.api-keys` is left unset so `StartupValidator.validateAuth()` fails closed
  until one is supplied (`NPDEV_AUTH_APIKEYS`/`NPDEV_AUTH_API_KEYS` env var or Stage C's
  `secrets/api-key.env`), exactly matching what `docker-compose.yml` already enforces
  (`${NPDEV_AUTH_APIKEYS:?...}`). (3) `_ops/Run-FinalApp.ps1` gained a `-Profile` parameter
  (default `'dev'`, so today's "just run this generated app locally" workflow is unchanged byte-
  for-byte) that is now passed through as `--spring.profiles.active=$Profile` -- the java
  invocation used to pass no profile flag at all.

  **A real, live-caught bug in this session's own first draft, not shipped**: an initial
  `application-prod.properties` also set `npdev.runtime.deployment-profile=prod` (by analogy with
  `application-dev.properties`/`application-warning.properties`, which both set it). Live boot
  crashed instead: `RuntimePluginProfileResolver` resolves that property either by convention
  (classpath `npdev/bindings/<name>.bindings.json` + `npdev/plugins/<name>.plugin-manifest.json`,
  how `dev` resolves -- both files are generated per-app) or against a small HARDCODED fallback map
  containing only `{default, warning}` -- `prod` matches neither, so boot failed with
  `IllegalStateException: Unknown deployment plugin profile 'prod'`. Fixed by leaving
  `npdev.runtime.deployment-profile` unset (Java-level default `"default"`, which resolves via the
  hardcoded fallback map to the same bindings/plugin-manifest pair `application-default.properties`
  already uses) -- inventing a fourth deployment-plugin-profile variant would be unrelated
  plugin-package policy, out of scope for this card. `npdev.runtime.execution-environment=prod` is
  kept: it is a separate, pre-existing, string-only label with no fallback-map coupling --
  `CapabilityAdapterResolver#activeEnvironment`'s own `preferredOrder` array already lists
  `{dev, test, stage, prod, default}`.

  Verified LIVE end to end, not assumed, using a freshly generated `npdev-canary` app (this
  session's own platform worktree, H2Local engine): (1) normal dev boot via
  `_ops\Run-FinalApp.ps1` (no `-Profile` argument) -- `Active profiles: [dev]` logged, Stage C's
  `Ensure-NpdevApiKey` banner printed the generated key once, `dev-key`/`api-dev` both 401, the
  generated key 200, `_ops\Smoke-Test.ps1` run standalone reported PASS -- proving the everyday
  local workflow is unchanged. (2) `_ops\Run-FinalApp.ps1 -Profile prod` -- `Active profiles:
  [prod]` logged, health UP, `dev-key`/`api-dev`/the Docker `.env.example` placeholder `change-me`
  all 401, the SAME `secrets/api-key.env` key 200 -- proving Stage C's key mechanism is correctly
  reused for a local `prod` boot rather than inventing a second one. (3) `prod` profile launched
  directly via `java -jar ... --spring.profiles.active=prod` with the `NPDEV_AUTH_API_KEYS`/
  `NPDEV_AUTH_APIKEYS` env vars explicitly cleared (bypassing `Ensure-NpdevApiKey` entirely) --
  boot refused with `IllegalStateException: npdev.auth.api-keys must define at least one mapping
  when auth is enabled`, proving `prod` fails closed rather than falling back to anything
  insecure. (4) `java -jar ...` with NO `--spring.profiles.active` flag at all -- logged `No active
  profile set, falling back to 1 default profile: "default"` (proving `dev` is no longer the
  implicit default, the core Stage B claim) and then failed closed the same way as (3), since
  `application-default.properties` also seeds no key. Full DSL (1695/1695, 3-way split across this
  machine's parallel Gradle build-root caches, 0 failures/errors in each) and generator (319/319, 0
  failures/errors) regression suites green, zero regressions.

  **Two unrelated findings from this session's own live testing, filed separately rather than
  fixed here or ignored**: `REG-154` (docs/CONFIGURATION.md's `NPDEV_AUTH_APIKEYS` "gotcha" claims
  the underscored `NPDEV_AUTH_API_KEYS` form -- Stage C's own actual spelling -- silently no-ops;
  live testing on this session's machine shows BOTH spellings authenticate correctly, so the doc's
  blanket claim is false at least on Windows) and `REG-155` (`Get-NPDevBuildRoot` resolves to a
  wrong-but-plausible nested path, `<repo>\.claude\worktrees\Build\runtimehost-libs`, when the
  workspace root is a git worktree living inside the canonical checkout -- exactly this session's
  own operating mode -- worked around per-command with `$env:NPDEV_RUNTIMEHOST_LIBS`, not fixed,
  since it is a pre-existing resolver gap unrelated to R7's auth/profile scope).

  Card CLOSED: with Stage B done, no generated app ships a published ADMIN key that still works
  (Stage A/C) and no generated app boots on `dev` implicitly (Stage B) -- both halves of this
  item's title are now false, live-verified. Stage D (the migration surface) remains its own,
  separately scoped, not-yet-started future step per the roadmap.
