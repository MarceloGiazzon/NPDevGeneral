source: >-
  NPDEV_MEGA_ROADMAP.md Session 11 done-when: "an operator completes a full MVL entry -- multi-
  origin, multi-destination, rebalanced -- keyboard-only, without a validation message that names a
  field path instead of a business term."
surface: >-
  NPDevGenerator/generator/src/main/resources/npdev-templates/workbench-page.html.mustache
  (the emitted aggregate workbench) + the S8 balance/lookup declarations in the WmsOffice model.
detail: |
  Inventory of what the emitted workbench template ALREADY delivers against S11's bullet list
  (all pre-existing, verified by reading workbench-page.html.mustache -- R7.9 keyboard-first grid
  navigation, C8 per-region revert, R7.9/R7.10 focus management):

  - Inline editing that does not lose focus/scroll on recalculation: the activeFocusKey/
    restoreFocus mechanism restores the caret to the cell being edited after a debounced
    recompute-triggered re-render (lines ~258-259, 1147-1152); the change-listener patch path
    re-renders with restoreFocus=true (line ~396).
  - Validation messages in business language: S8 (WMS-8) added the balance rule message ("Faltam
    {delta} unidade(s) do produto {produtoId} no destino") and the invariant message ("A quantidade
    de uma posicao nao pode exceder a quantidade disponivel no local") -- both name the product /
    the location, not a field path.
  - Keyboard-first grid entry: cellKeydown/gridCellKeydown/headerCellKeydown navigate cells with
    arrows, Enter adds a row and lands in its first cell, Shift+Arrow is left to the browser,
    Tab is native DOM order (lines ~261-371); the band picker is a real role=dialog modal with a
    focus trap and Escape (lines ~1162-1268).
  - Undo on destructive row actions: per-region revert (regionRevert, C8) restores a section/band
    to baseline; deleteRow/editBandRow are staged in the draft store (baseline snapshot, line ~160)
    and revertible before commit.
  - Bulk selection: the band picker's multi-select modal (lines ~1277-1311) covers the
    "select many" case; row-level drag/bulk-select beyond that was not a manual requirement.

  Remaining (browser verification, same half as S8/S9 -- requires the app generated + booted +
  verify-in-browser, which does NOT depend on Google credentials):

  - Prove the keyboard-only multi-origin/multi-destination MVL run end-to-end in a real browser:
    the S8 declarations (checkBalances action, origemTotal/destinoTotal derived fields) plus the
    template keyboard paths above must be exercised for the checklist P4/P5 verbs with the balance
    banner and the maxQuantity read-only column visible and refusing over-quantity.
  - Commit-time business messages: verify the server-side invariant refusal surfaces verbatim (the
    template renders server-composed messages through textContent), not as a field-path string.
  - The optimistic-feedback rollback visual (a failed commit leaves the draft intact) is
    structural in the draft-store design; confirm the visible behaviour in browser.

  2026-09-19 (partial browser verification, roadmap sweep): the underlying page this item's
  mechanisms are attached to is now LIVE-PROVEN functional (see WMS-8, DONE): the dedicated
  MovimentoWorkbench page loads its empty shell, "+ add row" reveals the depth-2 itens/posicoes
  bands, and "Recalcular Saldos" returns "Balanced." with no console/network errors. This confirms
  the template these keyboard/focus/revert mechanics live in is genuinely reachable and working end
  to end, not just present in source. A direct arrow-key/Enter keyboard-navigation probe was
  attempted (click a grid cell, press ArrowRight, inspect document.activeElement) but the initial
  cell selector (`table input[type=text]`) did not match the actual grid markup -- not retried this
  session (time-boxed; the selector needs to be derived from the real DOM, e.g. via an evaluate
  dump of the itens grid's actual input elements, before a `press` step can target it correctly).
  Retried with a corrected selector (`table input >> nth=0`, since the grid's inputs have no
  literal `type="text"` attribute for the earlier selector to match): the click landed, but the
  ArrowRight press result was AMBIGUOUS -- `document.activeElement` after the key stayed on an
  INPUT whose value was unchanged ("new-awrsn9v4", the same id-field value), which is consistent
  with either "the custom grid-navigation handler is not active in this state" or "arrow-right just
  moved the text caret within the same field" -- cannot distinguish from outside without reading
  cellKeydown's actual activation condition. The following Enter press did not visibly add a new
  itens row (count stayed "1 rows"). NOT recorded as a pass or a fail -- genuinely inconclusive,
  reported honestly rather than claimed either way. Time-boxed rather than pursued further this
  session (risk of chasing an unfamiliar 4300+-line generated JS file blind).

  Still NOT done: a full keyboard-only multi-origin/multi-destination MVL entry (this item's actual
  done-when bar) was not completed. Remaining: read cellKeydown's real activation condition (does
  grid-arrow-nav require a prior Escape/select-mode step distinct from a fresh click?), then drive
  a real keyboard-only populate-and-commit run; verify the commit-time business message and
  optimistic-rollback visual.
