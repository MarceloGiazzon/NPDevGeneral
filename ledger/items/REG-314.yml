id: REG-314
title: >-
  CONFIGURATION.md documents API-key mappings as key=tenantOrRole; the working format is key=tenant:actor:ROLE
  (sets $user.id), found only in a sample probe
type: BUG
severity: HIGH
status: DONE
opened: 2026-10-29
closed: 2026-10-29
source: >-
  OWN-2 section 5.2 domain-fit simulation, 2026-10-28/29: a fresh agent given only the public docs and a
  clinical-trial site-visit scheduler (a domain never modelled here), not told what to build. Evidence:
  NPDev_General__OutsideRepo/evidence/2026-10-28-own2-sim/
surface: docs/auth
detail: >-
  docs/CONFIGURATION.md:85 says npdev.auth.api-keys 'must contain at least one key=tenantOrRole mapping'.
  Row-level rules need $user.id, which only the three-part form key=tenant:actorId:ROLE (entries separated by
  ;) sets. The agent found that form only in NPDevSamples/dom-leave's probe; the historical
  docs/beta/beta1-vision-spine-status-and-handoff.md:108 records the same format.
resolution: >-
  Done when CONFIGURATION.md documents the real grammar (all accepted forms, separator, what each sets) with
  an example, checked against NpdevAuthConfig / the api-key resolver.
files:
  - docs/CONFIGURATION.md
  - NPDevGenerator/generator/src/test/java/com/npdev/generator/ApiKeyMappingGrammarContractTest.java
  - NPDevGenerator/generator/src/main/resources/npdev-templates/npdev-runtime-api-key-auth-filter.mustache
verification: UNIT_TESTED
guard:
  kind: test
  ref: NPDevKernel/kernel/src/test/java/com/npdev/kernel/ports/ApiKeyMappingsTest.java#parsesTheDocumentedExample
  asserts: >-
    the one parser of npdev.auth.api-keys (ApiKeyMappings, shared by StartupValidator and the generated
    RuntimeApiKeyAuthFilter since REG-319) splits entries on ';', takes the key at the first '=', the mapping on ':'
    and roles on '|', upper-cases roles, defaults an omitted role to USER, drops an entry lacking tenant or actor, and
    carries the actor part as actorId -- the exact grammar docs/CONFIGURATION.md documents. Behavioural, replacing
    the textual template pins this guard carried until 2026-10-30 (ApiKeyMappingGrammarContractTest now only pins
    that the filter has no grammar of its own). Proven red 2026-10-30 by changing the entry separator to ',' in
    ApiKeyMappings (the assertion named that entry); restored, green.
  provenRed: true
note: >-
  2026-10-29: lead verification confirmed the doc line and the three-part format via the beta note. Fixed by reading
  the real parser (the generated RuntimeApiKeyAuthFilter, template npdev-runtime-api-key-auth-filter.mustache --
  NpdevAuthConfig only passes the string through) and rewriting the CONFIGURATION.md entry with the grammar table, a
  working example and the identity-pack role override. Found while reading: an entry with fewer than two ':'-parts
  (the shape the page used to describe) parses to nothing and is dropped silently while StartupValidator only checks
  for an '=', so the app boots and 401s every request -- filed as REG-319 (validator is not changed here).
  Not booted: the claim that tenant/actor/role are carried is read from the parser and the dom-leave probe's use of it.
