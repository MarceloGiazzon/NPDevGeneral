id: REG-356
title: >-
  Follow-ups owed after the convention-visibility and domainType-convention work (2026-11-22), plus the single-source model.schema.json the owner wants soon
type: GAP
severity: MEDIUM
status: PARTIAL
opened: 2026-11-22
source: >-
  Owner, 2026-11-22: "2) OK, logo vemos isso. Deixe marcado para ser feito em breve" and "7) Fonte unica. Deve ser implementado em breve. Anotar junto com a sessao 2".
  The list is the one given to the owner at the close of the convention-visibility step; nothing here has a design decision pending except where a line says so.
surface: contract/dsl, contract/schemas, manager, generator/business-ui, samples/ride-hailing
files:
  - NPDevContract/schemas/model.schema.json
  - NPDevContract/schemas/authoring/model.schema.json
  - NPDevContract/dsl/src/main/resources/schema/model.schema.json
  - NPDevContract/dsl/resources/Schemas/model.schema.json
  - scripts/quality/check-schema-mirror-consistency.py
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/parser/JsonModelParser.java
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/parser/FieldConventionExpansion.java
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/cli/ModelValidatorMain.java
  - NPDevSamples/ride-hailing/drive_s2.py
detail: |
  A. SINGLE-SOURCE model.schema.json (owner: soon; was "deferred", now approved to implement). Today the schema exists as four copies (the two under NPDevContract/schemas, the DSL jar resource,
     the legacy NPDevContract/dsl/resources/Schemas copy that also carries canonicalSchema/deprecated keys) and every schema edit is made four times and then compared semantically by
     check-schema-mirror-consistency.py (done by hand for `fieldConvention.defaults.domainType` on 2026-11-22). Goal: ONE file edited by hand, the others generated or read from it, the
     CLAUDE.md "duplicated in 4 places" paragraph deleted, the checker reduced or removed. Pre-users setting: paths may change freely; migrate every reader (Gradle, Python tools, the Manager, jars) in the same commit.
  B. Convention notes (info diagnostics FIELD_CONVENTION_APPLIED, IMPLICIT_ID_ADDED): (1) check whether and how the Manager shows an `info` diagnostic and rebuild it if it hides or mangles one;
     (2) the note texts are English only -- confirm that is allowed for validator output against scripts/policy/ui-i18n-policy.json; (3) a field that declares a domainType but no type still fails with
     "declares no type" -- decide whether it should take the type from the domain type's baseType; (4) measure what teaching "omit type / id, and a convention may name a domainType" adds to the AI briefing
     before adding it (the 5k tokens-per-app target is the constraint).
  C. ride-hailing: re-run the app after the `lower(status)` driver-list label (validated only at T0); re-check Zone showing `none`, lat/lng boxes in the rider form and English labels in a Portuguese session;
     capture en/pt screenshots and publish the gallery if that is an outward action the owner must click; investigate the flaky acceptance check "driver2 stayed OFFLINE" in drive_s2.py (~line 559):
     it failed once and passed on re-run, cause unknown.
  D. Packs: two more built-in packs to reach `probed` on a real booted app (only `leave` has); the wave-2 delivery request still has two owner questions (`payments`, `kitchen`); bench step "clinic app from
     packs only, under 2k output tokens" has no record of being run and depends on wave 2 and on provider quota (bench-023 on Gemini is blocked by quota).
  E. Verification owed to the freshness ledger before the single commit: the twelve checks the T1 gate listed as overdue on 2026-11-22 (budget, reference, concept-map, ui-i18n, doc-references, adr,
     experience-client, manager-version-bump, dsl-test-touched-area, model-validate-touched, f6-showcase-browser, jrn-journeys) run through the ledger-recording path, plus run-shell-scenarios and the i18n-pt browser routine.
  DONE 2026-11-22 (A, single source): `NPDevContract/schemas/{model,pack,config}.schema.json` is the ONE hand-edited file of each group; `python scripts/quality/check-schema-mirror-consistency.py --fix`
     writes the other copies from it (three of the four model copies were already byte-identical; the legacy copy keeps only its `deprecated`/`canonicalSchema` provenance lines; two config copies
     that differed only in formatting were normalised). Without --fix the script still checks and now tells the author what to run. CLAUDE.md paragraph, the AI-knowledge gate's failure text and
     a concept-map note were rewritten to match. NOT done: Gradle building the jar resource from the source (the on-disk copies stay because 57 files name their paths); that would remove the
     generated copies from git entirely -- an owner call, since IDEs and every Python reader then need the build to have run.
  FOUND 2026-11-22 (B1, the Manager and an info diagnostic): the Prompter pane (NPDevManager/ui/prompter.js ~725) lists every diagnostic with its severity chip, muted for `info`, so the convention
     notes are visible. But Studio (NPDevManager/ui/studio.js:279) builds its "the change has a problem" sentence with `severity !== "warning"`, so when a model FAILS validation the `info`
     notes (FIELD_CONVENTION_APPLIED, IMPLICIT_ID_ADDED) are listed as problems. FIXED 2026-11-22 in Manager 0.13.45 (`(d.severity || "error") === "error"`; version moved in Cargo.toml, Cargo.lock,
     tauri.conf.json and main.rs); the render-check scenario "Studio: a failed check lists the errors, not the info notes or the warnings" fails on the old line (403/404) and passes on the new one
     (404/404). REBUILT 2026-11-23: Build\manager-target\release\npdev-manager.exe is now 0.13.45 (cargo build --release, 3m17s, nothing running so no rename was needed; the render checker passed 404/404 against the repo ui). B2-B4 untouched.
  PAUSED BY THE OWNER until 2026-11-25: the kernel coverage-floor root cause (floor 73.4185 -> 73.4139) -- "ignore this problem completely for the next 3 days"; do not investigate or let that ratchet drive work before then.
  OWNER DECISIONS 2026-11-24 ("all recommended" to the open questions of this item), with what was done the same day:
     3. kernel coverage floor: the pause ends 2026-11-25; pick it up first thing that day. NOT started (not before the date).
     4. single-source schema, last step: NO. The generated copies stay in git, refreshed by check-schema-mirror-consistency.py --fix, so item A is complete.
     5. B3 DONE: a field that names a domainType and no type takes the type from the domain type's baseType (FieldConventionExpansion.expand; an explicit type is never touched; an unknown domain type is
        the error "domain type not found: X"; the info note FIELD_CONVENTION_APPLIED says where the type came from). FieldConventionsTest 14/14, two of them new. NOT added to the AI briefing: the B4
        measurement (tokens per app) is still owed before teaching it.
        B4 MEASURED 2026-11-24 (build_core_context.build_bundle(detail="standard") = 21,431 bytes; bench-023 on nvidia: 10,780 prompt tokens, so ~2 bytes/token for this JSON-heavy text). (a) "omit id" is ALREADY
        taught, at 0 extra cost: Non-negotiable 2 says "Every concept has exactly one id field, and you do NOT write it". But the three golden examples still WRITE 6 explicit `{"name":"id","type":"uuid",
        "id":true,"required":true}` fields (1 in golden-contact-intake, 2 in golden-expense-approval, 3 in simple-workorder-workflow; 53 bytes each, ~318 B, ~160 tokens, 1.4% of a bench-023 run) -- the examples
        contradict the rule and cost bytes; removing them saves tokens and teaches by demonstration. (b) "a field naming a domainType needs no type" would be NEW: the bundle mentions domainType 0 times, so the
        144-byte sentence (~72 tokens, 0.6% of 11,247) is meaningless without a definition (>= ~300 B, ~150 tokens, 1.3%), and the saving only exists for models that use domain types; bench-023 produced just
        467 completion tokens, so there is little to save. RECOMMENDATION: do NOT add (b); do (a) as a separate small change (it touches the golden example models the bundle is built from -- check what else reads them first). Nothing changed in the bundle.
     6. B2 DONE: validator output stays English only; recorded as englishOnlyDiagnostics in scripts/policy/ui-i18n-policy.json (check-ui-i18n OK).
     7. ride-hailing gallery (C): capture the en/pt screenshots LOCALLY only and publish nothing. DONE 2026-11-24, nothing published: 16 PNGs in NPDev_General__OutsideRepo\ride-hailing-gallery\artifacts
        (en + pt x admin: Driver/Zone/Rider list, Ride list, Rider create form; x disp1 (Dispatcher): Driver/Ride/Payment lists) from a live app (run-ride-hailing.ps1 -ReuseBuild -Stages setup,offer,pay
        -KeepRunning; setup 20/20, drive passed), driven by make_routines.py + capture.ps1 in that folder; artifacts-setup-only-run1 holds the earlier empty-state set. The C re-checks: the Zone list shows no
        `none`; the Rider form has no lat/lng boxes; the Driver label renders ("Driver 1 / driver1 / ABC-1001b6", status "Offline"/"Completed"); the English left in a pt session is model field and concept names
        ("Payment Token", "Riders") = the English-labels policy. TRAPS: (1) admin sees EMPTY Driver and Ride lists ("seu perfil so ve os registros que pertencem a ele"), so a gallery needs the disp1 login;
        (2) the locale picker offers the SHIPPED tags en / pt-BR -- a bare localStorage "pt" renders Portuguese but the picker shows "Automatico" (the repo's i18n-pt routine does that too, harmlessly).
        OBSERVED IN THE SCREENSHOTS, NOT INVESTIGATED: (a) the Ride list's Rider column and the Payment "Source" show the payment token ("Rider1 / rider1 / tok_ok") -- a credential-shaped value in a label;
        (b) Payment "Amount Cents" = 1039.2474, a fractional cent amount; (c) the Payment's Ride label id (be72085e-...) is not one of the two Ride ids listed; (d) the top-bar title still says "Drivers" on the
        Rides and Payments pages in the disp1 captures (correct in the admin captures); (e) "Created At" mixes "...Z" and "...-03:00" formats; (f) the Rider create form offers the system-kept stats
        (Rating Avg, Rides Requested, Cancels By Rider, Cancel Rate) as editable inputs. NOT exercised: the flaky "driver2 stayed OFFLINE" check (stage experience, drive_s2.py ~559 -- stages run were setup,offer,pay).
     8. wave-2 delivery request (D): payments -> reuse pix-charge, the kitchen requirement is dropped; applied to wave2-delivery-request.json and roadmap.json in
        NPDev_General__OutsideRepo/PACK_AUTHORING_BROWSER_AI_2026-11-12 (delivery requires shipping, person, pix-charge; food-delivery requires delivery). Sending the request to a chat AI stays the owner's step.
     9. bench-023 (blocked on the Gemini quota): run it on another free provider, as the T12 bench did with nemotron. DONE 2026-11-24 on nvidia (run_bench.py run --prompt bench-023 --provider nvidia, run id
        20261124T045844 under Build\ai-bench): PASSED on the FIRST attempt, no repair loop, 204 s wall; author 6 s, validate 0 errors (6 warnings), generate 41 s, build 98 s, boot 53 s, acceptance probes 6 of 6 and
        rules 4 of 4. Tokens: 10,780 prompt + 467 completion = 11,247, i.e. about twice the 5k-per-app target (the prompt, i.e. the AI bundle, is 96% of it); the target was met only on Gemini (about 5.0k).
        So bench-023 no longer waits on the Gemini quota, but it does not show the 5k target met on nvidia.
     10. overdue freshness checks (E): small batches of 15 min or less across sessions. DONE 2026-11-24 for everything that can be recorded on its own: run-fast-gate.ps1 -Tier T1 PASSED (406 s);
        run-weekly-paperwork-checks.ps1 PASSED (177 s; records check-adr-decision-implementation + check-doc-references); check-twin-pair-consistency 60/60 (a --changed-from run checks 0 rules when no
        rule is touched, so the full run was recorded); run-journeys.ps1 PASSED (471 s); run-f6-showcase.ps1 PASSED (244 s). T1 blocking-overdue went 13 -> 8. The 8 left are all T0 `every-run`
        checks (concept-map, keyword-budget, keyword-reference, manager-version-bump, ui-i18n, schema-mirror, dsl-test-touched-area, model-validate-touched): their window is 5 min, so they count only
        when run by their invoker (run-ai-knowledge-gate.ps1) right before the report -- recording them alone proves nothing. FOUND: check-schema-mirror-consistency passes at the START of a T1
        gate and shows overdue at its END, because cadence_state.py STALENESS_TO_TIMEDELTA["every-run"] = 5 min while a T1 run takes ~6.8 min (the code comment says no T0 pass spans 5 min).
        OWNER CALL, not changed: widen that window to ~15 min, or have the gate record its T0 checks last.
done_when: >-
  The four schema copies are one source and check-schema-mirror-consistency.py is gone or trivial; each of B-E is either done and verified or recorded in its own item with a reason; the paused kernel
  item is picked up on or after 2026-11-25.
