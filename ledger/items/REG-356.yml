id: REG-356
title: >-
  Follow-ups owed after the convention-visibility and domainType-convention work (2026-11-22), plus the single-source model.schema.json the owner wants soon
type: GAP
severity: MEDIUM
status: PARTIAL
opened: 2026-11-22
source: >-
  Owner, 2026-11-22: "2) OK, logo vemos isso. Deixe marcado para ser feito em breve" and "7) Fonte unica. Deve ser implementado em breve. Anotar junto com a sessao 2".
  The list is the one given to the owner at the close of the convention-visibility step; nothing here has a design decision pending except where a line says so.
