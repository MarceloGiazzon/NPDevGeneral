id: EDIT-1
title: >-
  Editor bundle IO drops 17 of 34 root DSL sections and cannot open a model.json
type: BUG
severity: HIGH
status: DONE
opened: 2026-08-12
closed: 2026-08-14
source: >-
  Full-repo maturity audit 2026-08-12 (MASTER-ROADMAP.md F1 -- live hazard, ROADMAP.md card R6).
  Confirmed live this session: bundleIoService.ts's toCanonicalModelDocument/toInternalModelDocument
  are hardcoded 16-key object literals with no spread -- packs (and 17 other schema-valid root keys
  out of model.schema.json's 34) are silently dropped on every export and import. Live today:
  AppGen/apps/_official/WmsOffice/definition/model.json declares packs and would lose them on save.
surface: editor/bundle-io
files:
  - NPDevEditor/ui-react/src/authoring/io/bundleIoService.ts
detail: |
  See __OutsideRepo/strategy-2026-08-12/ROADMAP.md card R6 and MASTER-ROADMAP.md prelude card 0.4
  (cannot be reduced -- the loss-detector test is the whole point). Fix: replace the allowlists with
  an ordered pass-through mirroring modelDocumentService.ts's normalizeDocument `...document` spread
  pattern. MASTER-ROADMAP.md Step 3, this session's scope.

  2026-08-14 (ledger-currency sweep): status was still OPEN despite the fix having shipped days
  earlier -- commit `74501683` ("fix(editor): bundleIoService loses 17 of 34 schema root sections on
  save (R6)", PR #11) landed on main 2026-08-12. Confirmed live on the current checkout, not just by
  the commit existing: `toCanonicalModelDocument` now opens with `...document` (line 36) instead of a
  hardcoded object literal, and both guard files exist
  (`bundleIoService.schemaLossDetector.test.ts`, `importExportRoundTrip.test.ts`). The vitest run
  itself was not re-executed this pass (`node_modules` not installed in this checkout) -- closed on
  source-level + commit-history evidence, not a fresh test run.

  2026-08-17: NPDevEditor was parked out of this repository (see BREAKING.md). The files and guard
  below name paths that no longer resolve here; they resolve in the parked tree. This item stays
  DONE -- the fix shipped and was verified before the move -- but its guard can no longer be re-run
  from this repo.
guard:
  kind: manual
  ref: >-
    NOT RE-RUNNABLE FROM THIS REPOSITORY as of 2026-08-17 -- the schema-driven loss-detector test
    that guarded this item travelled with the editor module when it was parked out (see
    BREAKING.md). It existed and was verified before the move; it is recorded here as history, and
    deliberately names no repo-rooted path, because naming one that cannot resolve would be a
    dangling claim rather than a guard.
  asserts: every model.schema.json root key present in a real packs-bearing model.json (dsl-conformance-max) survives export+import
  provenRed: true
