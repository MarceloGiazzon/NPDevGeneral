id: EDIT-18
title: >-
  C2 (boundary B16 Step 2): field.picker.selectorRef / bandPickers.selectorRef finally wire
  PACK-11's own "referenced by grids/fields via picker" claim for selectors[] -- true for the first
  time, lifting B16 by construction
type: GAP
severity: LOW
status: DONE
opened: 2026-09-05
closed: 2026-09-05
source: >-
  REAL_LIFT_PLAN_2026-09-03.md Track C package C2 (boundary B16) -- the user directed the whole plan
  be finished; C1 (boundary B1, REG-206) closed first. The plan's own §5 C2 draft proposed building a
  brand-new top-level selectors[] array from scratch and threading it through the REG-108 four-place
  discipline. Re-verifying that premise against live code (three parallel Explore passes, this
  session, before writing anything) found it stale in the same shape section 1 of the plan document
  itself had already found nine other premises stale: selectors[] already existed (PACK-11, commit
  1f2fbeb7, 2026-08-18) as a top-level model/pack array (SelectorAst: name/concept/multiSelect/
  filters/columns/returnMapping/metadata), already schema-declared across all 4 model.schema.json
  copies, already pack-composable (ModelSourceResolver.MODEL_ARRAY_KEYS), already validated
  (PanelValidation.validateSelectors), already corpus-covered (dsl-conformance-max's
  WidgetCatalogPicker), and already carrying its own twin-pair rule (selector-expansion-four-place)
  naming AutoPanelExpander.expandSelector as its fourth place -- selectors don't round-trip through
  CompiledModelCanonicalJson because ModelCompiler EXPANDS each one into a standalone routed picker
  panel (/select/<name>) at compile time, per PACK-11's own resolution note.

  What PACK-11 never built: SelectorAst's own class javadoc has claimed since day one that a selector
  is "a named multi- or single-select picker over a concept, referenced by grids/fields via picker"
  -- but field.picker's schema ({filter, multiSelect}, additionalProperties:false) had no way to name
  one. That claim was aspirational, not descriptive, from the moment PACK-11 shipped. This IS
  boundary B16's exact gap -- not a new concept to invent, but PACK-11's own stated intent, finally
  finished. Building a second, competing selectors[]-shaped array (as the plan's draft implied) would
  have collided with this one by name and duplicated its plumbing for zero additional lift.
surface: dsl/ast, dsl/parser, dsl/compiler, dsl/compiled, dsl/validation, generator/emitters,
  generated-app client JS (2 mustache templates), schema, corpus, dsl coverage, boundary register
