guard:
  kind: test
  ref: NPDevContract/dsl/src/test/java/com/npdev/dsl/v1/validation/ComputeValueOperandValidationTest.java#addingADayOffsetToADateFieldIsRejected
  asserts: >-
    a computeValue whose operand is $p.enrolmentDate, p being a readConcept of a concept that declares enrolmentDate
    as a date, is refused with COMPUTE_VALUE_INVALID_OPERAND naming left, Participant.enrolmentDate and date; sibling
    tests cover datetime/boolean fields, non-numeric literals ("2026-10-01", true, the "$$5" escape), nested
    branches, and the no-false-positive cases ($input.*, string fields, undeclared fields, a target bound twice).
  provenRed: true
note: >-
  The largest domain-fit gap the simulation found: 'enrol on day 0, get your dated windows' is the core of the
  domain. Not reproduced by the lead; agent's repro.
  2026-10-29 part (a) DONE, part (b) OPEN pending an owner decision. Reproduced the agent's repro first: its model
  (evidence/2026-10-28-own2-sim/model.json, PlanVisitProc step 2, add($p.enrolmentDate, $vt.dayOffset)) validated
  with 0 errors. After the fix the same model reports exactly 1 error at steps[2] (the later steps read
  $targetDate, a computeValue output, which is numeric). New ComputeValueOperandValidation walks one procedure,
  maps readConcept targets to concepts and refuses an operand that is provably non-numeric: a non-numeric literal,
  or $step.field where the field is date/datetime/boolean/uuid/object/array/file. Conservative on purpose --
  $input.*, string fields (may hold digits), undeclared fields and a target bound to two concepts are left to the
  runtime. The message carries the kernel's own COMPUTE_VALUE_INVALID_OPERAND code, and ValidationDiagnosticNormalizer
  lifts it into the structured code field (compute_value_invalid_operand, was the generic semantic_validation_error
  for every procedure-step error). Proven red: the 6 rejection tests failed with [] (validator accepted) before the
  class existed. The structured-code test was written against the generic code the repro report showed and not run
  red separately. No false positives: the full dsl suite is green, and the 3 corpus models that use computeValue
  (dsl-conformance-max, AppGen WmsOffice, WmsOfficePackTest) validate with 0 COMPUTE_VALUE_INVALID_OPERAND.
  Not covered: operands from conceptCreate/query-row/loop-item variables (only readConcept targets are typed), and
  nested paths ($p.a.b).
  2026-10-29 part (b): owner chose to BUILD it (not defer). Slices, each tested + pushed on its own:
  (1) DONE DateFunctions (DSL, one pure implementation: today/addDays/daysBetween, UTC calendar dates, total -- bad
  operand => null) registered for field defaultExpression/derivedExpression + the gateway invariants via
  ValueBehaviorFunctions.NAMES; evaluateStrict (backfill) pins today() to 1970-01-01 like now(). (2) DONE the
  CelInvariantEngine registry (rules). (3) DONE procedures: computeValue operations addDays/daysBetween/today
  (ProcedureStep.computeValue no longer NPEs on an absent operand -- ProcedureRunner and the CLI both build steps
  through it), PackValidation operator set + 'today takes no operands', and ComputeValueOperandValidation is
  operator-aware (date vs number vs whole-number slots). (4) DONE query parameters: a defaultExpression on a
  query parameter (`addDays(today(), -7)`; a caller can still override). model.schema.json x4 (pack schema needs
  nothing: the def is nested), ProcedureParameterAst, parser, compiler, CompiledProcedureParameter, canonical
  JSON writer+reader (key emitted only when declared, so no existing model's canonical JSON changes), validator
  (query-only: a procedure parameter default is refused because nothing would evaluate it; no field refs; only
  value functions; not combinable with required:true), NamedQueryBinding (single binding rule for the REST
  endpoint and documents), and OpenApiDocumentBuilder (advertised optional, default named). (5) DONE
  dsl-conformance-max: ShelfLayout date fields + derived windowLength/windowClosesOn + defaulted reviewBy + the
  WindowNotBackwards invariant, query ShelfLayoutsReviewDue, PlanShelfReviewProcedure/Flow; four behaviour probes
  in 13-date-functions.json, ALL PASS LIVE (139/139 probes, 0 known failures). Lesson recorded: a flow declaring
  `input: {concept, mode: update}` IS that concept's update handler -- my first PlanShelfReviewFlow did that and
  turned every ShelfLayout PUT into a 500 (two old probes went red); an execute-only flow uses mode query or no
  input. And a procedure's conceptCreate takes a dataRef, not an inline data map; patchConcept createIfMissing
  has the literal-or-$ref set convention.
  Known gaps, deliberately not hidden: no arity check at validation (addDays(x) validates then yields null, same as
  concat today); no per-app time zone (today() is UTC); addDays/daysBetween only, no addMonths/startOfMonth.
