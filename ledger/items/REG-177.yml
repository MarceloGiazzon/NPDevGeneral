detail: |
  `LoginController.java:127` hardcodes `"SELECT id, active, token_version FROM identity_users WHERE
  username = ? AND tenant_id = ? "` as a raw string literal -- not even behind a configurable
  `@Value` default the way `ControlPanelTenantUsersController`'s own `userTable`/`usernameColumn`
  fields are (`@Value("${npdev.auth.login.user-table:identity_users}")`, itself only a fallback
  default, never actually overridden anywhere in the generator/mustache templates per a repo-wide
  grep -- see this item's "related, deferred" note below). The generator's schema-realization SQL
  creates the identity pack's tables under pack-versioned names instead (`identity_v1_users`,
  matching every other built-in-pack table's versioned convention, per REG-160/REG-170's own
  confirmed findings against real generated schema).

  This is the actual LOGIN path (`LoginController` is what a real user's login POST hits), not an
  admin-provisioning-only path like REG-170's four call sites -- arguably higher real-world exposure
  than REG-170, since every JWT-mode app's login flow depends on this exact query resolving.

  Table-naming is CONFIRMED conditional, not universal -- checked two different real generated apps'
  own `V1__npdev_schema_realization.sql` on this machine: `superuser-admin-console` (REG-170's own
  cited evidence) creates `identity_v1_users`, but `reg39-healthy-control` creates plain
  `identity_users` (unversioned) for the identical identity pack concept. So this literal is
  ACCIDENTALLY correct for some apps and silently wrong for others, depending on which identity pack
  major version was actually composed -- worse than a uniformly-wrong literal, since it would pass
  casual testing against whichever app happens to compose the version that matches the hardcoded
  name.

  Related, wider pattern -- CONFIRMED LIVE, not just reasoned about (upgraded from the original
  "deferred, noticed but not filed" note below): the `npdev.auth.login.user-table`/`username-column`/
  `credential-table`/etc. `@Value(...:default)` properties shared across `LoginController`,
  `ControlPanelTenantUsersController`, and `TenantAutoRegistrationRunner` all fall back to pre-PK-2
  unversioned literal defaults (`identity_users`, `username`, `usuarios`, ...) with no generator/
  mustache-template wiring found anywhere in the repo that ever actually overrides them for a
  pack-versioned deployment. Live-reproduced 2026-08-15 while verifying REG-170: generated, built,
  and booted `superuser-admin-console` (real identity pack composition, schema confirmed
  `identity_v1_users`) with a real API key -- the app started, but logged
  `[TenantAutoRegistrationRunner] Skipped: could not reconcile tenant registry (Table
  "identity_users" not found; ...)` at startup, a real, live, reproduced instance of this exact
  defect shape in a THIRD file REG-170's own scope never touched. `TenantAutoRegistrationRunner`
  degrades non-fatally (logs and skips, per its own "belt-and-suspenders" design -- see
  `IdentityProvisioning.ensureTenantRegistered`'s javadoc), which is why the app still boots
  successfully despite the error; `LoginController`'s own instance (this item's main scope) does NOT
  degrade gracefully -- a real login attempt would fail outright.
guard:
  kind: manual
  ref: >-
    generate a model with npdev.auth.mode=jwt composing NPDevContract/packs/identity/pack.json,
    build, boot fresh, and POST valid credentials to the login endpoint
  asserts: >-
    LoginController's user lookup resolves against whatever pack-versioned table name the compiled
    model actually reports for identity::User, not a hardcoded literal that is only accidentally
    correct for apps composing the specific pack version that happens to match it
  provenRed: false
resolution: >-
  **2026-08-15: implemented -- scope grew significantly during investigation.** Fixing
  `LoginController` alone surfaced two MORE files with the identical defect shape, both more
  severe than `LoginController` itself: `IdentityRoleLookup.java` (`NPDevKernel/adapters/
  expression-cel`) is, by its own javadoc, "THE single revocation decision point" for role
  resolution and token-revocation on EVERY authenticated request (called from both RuntimeHost's
  `IdentityAwareContextResolver` and the generated-CRUD kernel path's `GeneratedCrudRuntimeSupport`),
  and `IdentityPermissionOverrideLookup.java` (`NPDevKernel/adapters/authz-default`) is the same
  shape for fine-grained permission overrides, called from `DefaultExecutionAuthorizationPolicy`.
  Both hardcoded `identity_users`/`identity_roles`/`identity_user_roles`/
  `identity_user_role_permissions` -- meaning role-based authorization silently degraded to
  claim-roles-only (empty identity-backed roles, `token_version` always 0, no permission overrides
  ever applied) for ANY app whose identity pack is version-qualified, on EVERY request, with no
  error anywhere.

  Added `IdentityPackTableNames` (`NPDevContract/dsl`, not `NPDevRuntimeHost`) as the one shared
  resolver every caller can reach without a wrong-direction module dependency -- two of the callers
  are `NPDevKernel` adapters that cannot depend on `NPDevRuntimeHost`. Replaces
  `IdentityProvisioning`'s own nested `IdentityTableNames` record from REG-170 (now a thin
  `import` at all 8 of that item's call sites). Two resolution modes: `resolve()` (throws,
  unchanged from REG-170 -- for callers only ever active when the identity pack is guaranteed
  present) and a new `tryResolve()` (returns `Optional`, for callers that run on EVERY request
  regardless of whether an app composes the identity pack at all -- `internal.tables=false` is a
  normal, supported configuration, not an error). `IdentityRoleLookup`/
  `IdentityPermissionOverrideLookup`'s static methods now take table names as parameters (built
  into their SQL via `String.formatted(...)` templates) instead of hardcoding literals;
  `GeneratedCrudRuntimeSupport`/`IdentityAwareContextResolver`/`DefaultExecutionAuthorizationPolicy`
  each resolve `Optional<IdentityPackTableNames>` ONCE at construction (not per-request) and fail
  open (empty roles/no revocation/no overrides) exactly as before when absent.
  `TenantAutoRegistrationRunner` dropped its own semantically-wrong
  `@Value("${npdev.auth.login.user-table:identity_users}")` default entirely (that property was
  never actually about the built-in identity pack's own table -- it was conflating it with a
  DIFFERENT, legitimate configuration point, an app's separately-bondable credential table).

  Verifying this surfaced one further real bug, fixed in the same pass: the security-pattern
  sweep's own `swallowed-security-exception` rule correctly caught `IdentityPackTableNames.
  tryResolve`'s `catch (IllegalStateException)` silently returning empty for a genuinely
  inconsistent, partially-composed identity pack (distinct from the normal, silent "pack not
  composed at all" case) -- fixed by logging SEVERE first, matching REG-39's established posture
  used everywhere else in this exact codebase.

  **Verification, precisely what was and wasn't proven live:** every affected module compiles and
  its full test suite passes -- `:dsl:test`, `:adapters:expression-cel:test`,
  `:adapters:authz-default:test`, `runtimehost-core`'s own test suite, and the full assembled-app
  `gradlew test` (557 tests) against `simple-contact-intake`. `TenantAutoRegistrationRunner`'s own
  fix is LIVE-PROVEN: generated, built, and booted `superuser-admin-console` (real identity pack
  composition, schema confirmed `identity_v1_users`) -- the previously-observed
  `[TenantAutoRegistrationRunner] Skipped: could not reconcile tenant registry (Table
  "identity_users" not found...)` boot-log error is GONE. `LoginController`/`IdentityRoleLookup`/
  `IdentityPermissionOverrideLookup`'s own fixes were NOT additionally re-proven via a live HTTP
  request in this pass (a full jwt-mode boot + login POST, or a real role/permission-override
  round-trip against `superuser-admin-console`'s live `identity_v1_*` tables) -- the unit-test
  coverage exercises the exact same SQL against a real H2 schema matching real generated table
  names, which is strong but not identical evidence to an end-to-end HTTP proof. Attempting the
  live HTTP check separately surfaced an UNRELATED, pre-existing 404 on `com.finalexec.controlpanel`
  routes (also observed identically during REG-170's own live verification) -- not chased further,
  out of this item's scope.
