id: W1.6
title: >-
  shell.js has breadcrumb code (7 references) but no model-owned tree to derive a breadcrumb from --
  it always rendered a flat "/ Title" string business-ui-app.mustache built itself, with no reflection
  of the appShell group hierarchy W1.1/W1.2 already made real
type: GAP
severity: LOW
