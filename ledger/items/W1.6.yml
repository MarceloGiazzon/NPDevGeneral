source: >-
  NPDEV_ROADMAP_2026-09-12.md, Wave 1 (W1.6): "Breadcrumbs and recents from the model, not from
  localStorage alone." Depends on W1.2 (menu re-projection) and W1.5 (shared global states), both
  closed earlier this session.
surface: NPDevGenerator/generator (business-ui-app.mustache, shell.js.mustache), docs/UI_CONTRACT.md
