id: REG-176
title: >-
  npdev-pr-gate.yml's "PR gate" job fails on a clean dispatch of main itself (100 compile errors,
  ControlPanel controllers cannot resolve runtimehost-core classes) -- pre-existing, unrelated to
  any recent PR, found incidentally while verifying two unrelated PRs
type: BUG
severity: HIGH
status: DONE
opened: 2026-08-15
closed: 2026-08-15
verification: VERIFIED_LIVE
source: >-
  Found while verifying PR #91 (a Batch-1 backlog fix touching only Python/PowerShell/docs/
  .gitattributes -- zero Java/generator files). Its "PR gate (DSL/kernel/generator/RuntimeHost
  smoke, Linux)" check failed with 100 Java compile errors, reproduced identically on a rerun.
  Isolated to main itself, not the PR: `gh workflow run npdev-pr-gate.yml --ref main` (a plain
  workflow_dispatch, no PR diff at all) reproduced the SAME failure on main alone.
surface: ci/runtimehost-core-classpath
files:
  - .github/workflows/npdev-pr-gate.yml
  - NPDevRuntimeHost/build.gradle.template
  - NPDevRuntimeHost/runtimehost-core
detail: |
  The job generates `simple-contact-intake` and runs `gradlew compileJava` (or equivalent) against
  the assembled app. 100 errors, all "cannot find symbol" / "package X does not exist", concentrated
  in `com.finalexec.controlpanel.*` (ControlPanelSchedulesController, SchemaAcknowledgmentController,
  SchemaImpactController) and `com.finalexec.api.internal.*` (RollbackExecutionController,
  PublicationTransactionRecordController, PublicationRollbackExecutorController,
  SourceMutationAuditRecordController) plus `com.finalexec.execution.DirectExecutionGateway`.
  Missing packages named directly in the errors: `com.finalexec.db` (and its nested
  SchemaLifecycleExecutor, PendingSchemaAcknowledgmentStore, MigrationMarkStore,
  SchemaDropSnapshotRestorer, CrossEngineDataPromotion), `com.finalexec.scheduler`,
  `com.finalexec.npdev.dto`, `com.finalexec.npdev.service.internal`.

  Confirmed NOT a controller-allowlist exclusion (`unsupportedRuntimeHostControllerSources` in
  `build.gradle.template` only scans `src/main/java/com/finalexec/api/**/*Controller.java` --
  `com.finalexec.controlpanel.*` is a different package, never touched by that filter; ControlPanel
  controllers are always compiled, no allowlist gate). Confirmed NOT a service-allowlist exclusion
  either (`unsupportedRuntimeHostServiceSources` only scans `src/main/java/com/finalexec/npdev/
  service`, and none of the missing packages -- `com.finalexec.db`, `com.finalexec.scheduler`,
  `com.finalexec.npdev.dto` -- live under that root).

  `SchemaLifecycleExecutor.java` (confirmed via `find`) lives in
  `NPDevRuntimeHost/runtimehost-core/src/main/java/com/finalexec/db/` -- the PRECOMPILED-JAR module
  (BT-1: "244 files now ship as a precompiled runtimehost-core jar"), not the app's own
  source-copied tree. The job's `sync-runtimehost-libs.ps1 -BuildLocalJars` step reported "Copied 0
  local jar(s); 44 already current" -- meaning it DID rebuild from current source (per
  `-BuildLocalJars`) and its own safety-net comparison (REG-162) found the result byte-identical to
  what was already staged, so the persisted jar is not simply stale relative to source. Whether the
  runtimehost-core JAR itself fails to package `com.finalexec.db`/`com.finalexec.scheduler`/
  `com.finalexec.npdev.dto`/`com.finalexec.npdev.service.internal` (a packaging/build-script gap in
  runtimehost-core's own build.gradle), or whether the assembled app's generated build.gradle simply
  doesn't declare the jar as a compile-scope dependency correctly, was NOT determined -- root cause
  not isolated past this point.

  Practical impact: `npdev-pr-gate.yml`'s "PR gate" job fails for ANY PR today, regardless of that
  PR's own diff (confirmed by reproducing on a bare `main` dispatch with zero code changes). This is
  a DIFFERENT job from `npdev-ci-validation.yml`'s "Linux post-Beta0 maturity validation" (which IS
  currently green on `main`, confirmed 2026-08-15 via a real push-triggered run) -- so this is not a
  second instance of the REG-171/172/173 masking pattern, but a separate, real gap specific to
  npdev-pr-gate.yml's own build path.

  Likely fix, not designed further here: (1) diff runtimehost-core's build.gradle output jar
  contents (`jar tf kernel-0.1.0.jar` / the runtimehost-core jar) against what
  `classify_runtimehost_sources.py`'s app-independent classification expects, to confirm whether
  `com.finalexec.db`/`com.finalexec.scheduler`/`com.finalexec.npdev.dto`/
  `com.finalexec.npdev.service.internal` are supposed to be in it at all; (2) if they are, trace why
  this specific CI environment's build/packaging step omits them; (3) if the classpath wiring is the
  actual gap, check the assembled app's generated `build.gradle`'s `dependencies { }` block for a
  missing/misscoped runtimehost-core jar reference.

  2026-08-15 follow-up (PR #91's run, job 94940834236): pinned the failure to the LAST step,
  "RuntimeHost generated-app test suite" (`./gradlew test -PnpdevRuntimeHostLibsDir=.../
  NPDev_General__OutsideRepo/runtimehost-libs`) -- confirmed `com.finalexec.db`/
  `com.finalexec.scheduler`/`com.finalexec.npdev.*` all genuinely live under `runtimehost-core/src/
  main/java/com/finalexec/` (no build.gradle sourceSet exclusion), so the module's own OWN jar
  build is not intentionally omitting them, and a local `runtimehost-core` build+jar in this exact
  working tree DOES include them (verified via `:compileJava` succeeding, all classes present).
  The preceding "Sync RuntimeHost libs" step logged "Copied 0 local jar(s); 44 already current" --
  suspicious on what GitHub Actions documents as an ephemeral fresh-VM-per-job runner, UNLESS
  `actions/setup-java@v4`'s `cache: gradle` (line 70 of this workflow) restored a stale `~/.gradle`
  build-cache entry for runtimehost-core's `:jar` task from a PRIOR run predating some source change,
  and `sync-runtimehost-libs.ps1`'s own staleness check then judged the destination copy
  "already current" against that stale artifact rather than the true current source. Traced the
  `-PnpdevRuntimeHostLibsDir` override through `build.gradle.template`'s `resolveNpdevRuntimeLibsDir`
  (REG-137: env var checked first, then `gradleProperty`) -- `NPDEV_RUNTIMEHOST_LIBS_DIR` is not set
  anywhere in this workflow, so the explicit `-P` SHOULD win over whatever `FinalAppAssembler#
  appendRuntimeHostLibsDirDefault` baked into the generated app's own gradle.properties (which
  resolves to a DIFFERENT directory, `$NPDEV_BUILD_ROOT/runtimehost-libs`, since no
  `NPDEV_RUNTIMEHOST_LIBS_DIR` env var is set at generation time either) -- standard Gradle CLI-vs-
  file property precedence, not verified against a live CI repro. The Gradle-cache-staleness
  hypothesis is the strongest lead not yet tested; a live repro would need either a cache-cleared CI
  rerun (`gh cache list`/`gh cache delete` for this repo, then re-dispatch) or removing
  `cache: gradle` temporarily to see if the failure disappears -- neither attempted here to keep this
  investigation scoped, since REG-176 is not one of the user's requested 16-item backlog and further
  chase risks scope creep away from that actual ask.

  2026-08-15 further update: the SAME job ("PR gate (DSL/kernel/generator/RuntimeHost smoke, Linux)")
  came back GREEN on PR #92 (run 31859706350, 7m15s) with no changes to the workflow file or to
  runtimehost-core/build.gradle.template between that run and the RED one on PR #91 -- confirming
  this is INTERMITTENT, not a stable, always-reproducing failure (which weakens, but does not
  disprove, the Gradle-cache-staleness hypothesis above: a cache hit/miss would plausibly vary
  run-to-run). Still unresolved which run is the "true" state; downgrading urgency accordingly since
  it is not blocking every PR after all, but the underlying cause (why a cache/build artifact would
  sometimes omit `com.finalexec.db`/`com.finalexec.scheduler`/`com.finalexec.npdev.*`) remains
  unexplained and could recur unpredictably.
guard:
  kind: manual
  ref: gh workflow run npdev-pr-gate.yml --ref main
  asserts: >-
    the "PR gate (DSL/kernel/generator/RuntimeHost smoke, Linux)" job succeeds on a bare main
    dispatch with no PR diff
  provenRed: true
resolution: >-
  **2026-08-15: this item's own guard command was re-run live** (`gh workflow run npdev-pr-gate.yml
  --ref main`, run 31867215020) -- completed SUCCESS in 7m44s, including the exact
  "RuntimeHost generated-app test suite" step this item pinned as where the original 100 compile
  errors occurred. The original compile-error/Gradle-cache-staleness hypothesis does NOT reproduce
  today; it stays an open question (this fix does not explain or rule it out) rather than a closed
  one -- if it recurs, it needs its own new ledger item, since nothing here addresses that specific
  symptom.

  **A DIFFERENT, clearly-reproducing failure in the SAME job was found and fixed instead.** While
  verifying PR #93 (an unrelated identity-pack fix, REG-177), its fresh CI run failed on BOTH
  `npdev-pr-gate.yml`'s "PR gate" job AND `npdev-ci-validation.yml`'s "Generator gate" job -- same
  commit, same three tests
  (`HardenGcDeleteReplaceCascadePackagedGeneratedAppRuntimeProofTest`,
  `TrustedSourceEmitterPackagedGeneratedAppRuntimeProofTest`,
  `HardenObjstoreFileUploadPackagedGeneratedAppRuntimeProofTest`), same failure shape
  (`waitForHealth`/`java.net.ConnectException` -- the packaged app never became healthy within its
  own 6-minute per-test deadline). Root cause: `NPDevGenerator/generator/build.gradle`'s shared
  `test` task runs these three packaged-app-boot proofs (each packages and boots a real FinalApp
  under Testcontainers/MinIO) at `maxParallelForks = 2`, so two of the three contend for CPU/Docker/
  port resources on the same CI runner. A bare `main` dispatch at a quieter moment (this item's own
  guard, above) passed clean, and re-running the exact failing commit a second time (still on PR
  #93's branch, no code change yet) reproduced the identical failure again on both jobs --
  confirming this is systematic contention under real CI load, not one-off noise.

  Fix: isolated the three `@Tag("packaged-proof")` tests into a new `packagedProofTest` Gradle task
  (mirroring the existing `behaviorTest` isolation pattern) with `maxParallelForks = 1`, so they run
  serially instead of contending with each other. The shared `test` task now always excludes the
  `packaged-proof` tag (previously conditionally included it under `CI`/`-PincludePackagedProofs`).
  Wired `:generator:packagedProofTest` into both `npdev-pr-gate.yml` and `npdev-ci-validation.yml`'s
  "Generator unit tests" step (raised `npdev-pr-gate.yml`'s step timeout 20->30min for the added
  serial wall-clock) and into `NPDevGenerator/build.gradle`'s `generatorQualityGate` (so
  `run-generator-gate.ps1`'s local T2 gate keeps the same coverage, still gated by the same
  `onlyIf { packagedProofsIncluded }` it always had). Verified
  `scripts/quality/check-test-task-coverage.py` accepts the new task as CI-reachable, ran
  `:generator:test` locally to confirm the fast suite still excludes packaged-proof and passes, and
  ran one packaged-proof test through the new `:generator:packagedProofTest -PincludePackagedProofs`
  task locally to confirm the wiring executes correctly end-to-end. Not yet re-verified against a
  live CI run with real GitHub Actions load (the next PR push against this branch is that proof).

  **2026-08-15 follow-up: that live CI run found the fix was incomplete.** After this fix merged to
  `main`, PR #93's branch merged `main` in and re-ran CI -- `:generator:packagedProofTest` (the new
  serial task) failed with ALL 3 tests failing together (worse than the original 2-of-3), not the
  0 expected. Root cause: `NPDevGenerator/gradle.properties` sets `org.gradle.parallel=true`, and
  both workflow steps invoked `:generator:test :generator:behaviorTest :generator:packagedProofTest`
  as THREE top-level tasks in a SINGLE `gradlew` command -- Gradle is free to schedule independent
  top-level tasks concurrently under `--parallel`, so `packagedProofTest`'s own internal
  `maxParallelForks=1` serialization did not stop it from running AT THE SAME TIME as `:generator:
  test`'s own forked JVMs (`maxParallelForks=2`), which is arguably worse contention than the
  original bug (up to 3 concurrent JVMs competing for boot resources instead of 2). Fixed by
  splitting both workflow steps into two separate `gradlew` invocations -- the fast suite first,
  then a wholly separate `./gradlew :generator:packagedProofTest` call after it completes,
  guaranteeing no other Gradle task can be scheduled concurrently with the packaged-app boots. This
  is a reasoned fix from a plausible, evidenced mechanism (Gradle's own documented cross-task
  parallelism under `org.gradle.parallel=true`), not a repeat live confirmation that this exact
  mechanism was the failure's cause -- the next CI run is what actually proves it.

  **2026-08-15 second follow-up: the isolated-invocation fix ALSO did not clear CI.** The next run
  (fully isolated `./gradlew :generator:packagedProofTest`, nothing else in that invocation) still
  failed with all 3 tests timing out on `waitForHealth`. This rules out cross-task Gradle
  parallelism as the (sole) cause. Cross-checked against a bare `main` dispatch made earlier the
  same session (05:32, before any of these changes existed) that completed the WHOLE "PR gate" job,
  packaged-app boots included, in 7m44s -- and against running one of the same three tests locally
  on this exact combined code state (`HardenGcDeleteReplaceCascade...`, full REG-170/156/166/163/
  177/179/175/176/178 changes present), which passed cleanly. Both together point at CI-runner
  boot/IO performance varying over the course of this session (healthy early, degraded on every
  later run checked) rather than a code regression in any of this session's changes -- but this is
  inferred from the pattern, not independently proven (e.g. by directly inspecting a GitHub Actions
  status-page incident for this window).

  Applied one more, more conservative hardening as a result: raised each of the three tests' own
  health-check deadline (6min -> 8min for `HardenGcDeleteReplaceCascade`/`TrustedSourceEmitter`'s
  named `HEALTH_TIMEOUT`; 2min -> 8min for `HardenObjstoreFileUpload`'s own inline deadline, which
  was a full 4 minutes shorter than its two siblings' and the more likely reason it was consistently
  the last/worst of the three to fail) and raised both workflow files' "Generator unit tests" step
  budget (30->45min) and `npdev-pr-gate.yml`'s own job-level timeout (60->90min) so a genuine
  worst-case across all three tests' new ceilings still fits. This raises the ceiling the tests are
  allowed to wait against slow infrastructure; it does not fix a specific proven root cause, because
  none was proven past "not test-level contention, not a code regression" -- if failures persist
  after this, the next step is checking GitHub's own status history for this time window rather than
  further test/workflow changes.
