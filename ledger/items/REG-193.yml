id: REG-193
title: >-
  REG-40's CREATE-TABLE self-heal was given to business tables only; internal tables stay V1-only, so
  a platform-added internal table never reaches an already-migrated app's database
type: BUG
severity: HIGH
status: DONE
opened: 2026-08-19
closed: 2026-08-19
verification: VERIFIED_LIVE
source: >-
  Found by the R2.7 (RUN-15) implementation while adding `npdev_cron_fire_claim` to
  NpdevInternalTables. Flagged there as out of scope and confirmed independently against
  SchemaRealizationEmitter by the orchestrator.
surface: generator/schema-realization
files:
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/dbconfig/SchemaRealizationEmitter.java
  - NPDevGenerator/generator/src/test/java/com/npdev/generator/dbconfig/SchemaRealizationEmitterInternalTableCreateTest.java
detail: |
  `CREATE TABLE IF NOT EXISTS` for internal tables is emitted ONLY into
  `V1__npdev_schema_realization.sql`. Flyway runs a versioned migration exactly once, so on any app
  whose database has already migrated, V1 never runs again. The repeatable
  `R__npdev_schema_additive_columns.sql` does run every boot, and it does touch internal tables --
  but only via `appendInternalTableAdditiveColumns` (line ~189) and
  `appendInternalTableAdditiveIndexes` (line ~203). Neither emits CREATE TABLE. So a NEW internal
  table added to `NpdevInternalTables.all()` is created on fresh databases and silently absent on
  existing ones.

  **This is not an oversight -- it is a stated scope boundary whose premise has now expired.** The
  emitted SQL header says so in its own words (SchemaRealizationEmitter.java:163-165):

      -- ... (REG-40 tactical hotfix). Scope boundary: internal tables stay
      -- V1-only (platform-fixed, not model-driven); column/table removal and type changes
      -- remain structural changes handled by the schema-fingerprint destructive-recreate path.

  REG-40 (DONE 2026-07-24, "Additive migration never emitted CREATE TABLE -- a new concept on an
  existing DB failed to boot") fixed exactly this defect for BUSINESS tables, and deliberately left
  internal tables out on the reasoning that the internal set is platform-fixed and therefore never
  grows after deployment. **R2.7 (RUN-15) is the counterexample**: the platform itself added
  `npdev_cron_fire_claim`. Any app generated before that change, upgraded to a jar built after it,
  boots against a database with no claim table -- and `CronFireClaimStore` runs on every cron tick,
  so scheduled flows are the blast radius, not a cosmetic surface.

  Note the interaction with the column path: internal tables DID gain a column-evolution path (the
  comment at line 182 records that they previously had none). So the half-fix is specifically
  CREATE TABLE, not column drift.

  **Why no existing gate catches this**: every gate builds a FRESH database, where V1 runs and the
  table exists. Reproducing it requires an EXISTING migrated database plus a platform version that
  adds an internal table -- the precise combination no fresh-boot test can reach.

  **CONFIRMED LIVE 2026-08-19, independently, by an agent that was not looking for it.** While
  browser-verifying R7.9 (EDIT-10), an unrelated workstream hit exactly this: an app whose database
  had already run its one-time V1 migration met a platform build carrying newly-registered internal
  tables, and the additive-columns script failed trying to ALTER a table that did not exist --
  surfacing as a runtime **HTTP 503**, not a clear migration error. It blocked verification across
  THREE separate app/config combinations before that agent worked around it with a scratch database.
  That upgrades this item's evidence from "read from the emission structure" to measured, and its
  practical severity with it: the failure mode is a 503 on a working app after a platform upgrade,
  which reads as an outage rather than a schema gap.
  Note the workaround used there (a fresh database) is exactly what HIDES the bug, which is why it
  survived this long.

  THE FIX, AS APPLIED -- the two details below were established by reading the code before touching
  it, and both shaped what was implemented:

  1. `appendTable` (line ~401, the V1 internal-table emitter) IS safe to re-run. Its raw string is a
     bare `CREATE TABLE`, but it is emitted through `appendGuardedCreateTable(...)` at line 426, and
     its indexes through `appendGuardedCreateIndex(...)` at 437 -- both produce engine-appropriate
     existence guards. So idempotency is not the obstacle, and the header comment at line 182 that
     calls it "CREATE TABLE IF NOT EXISTS" is accurate in effect even though the literal string is
     not.

  2. **Do NOT simply call `appendTable` from the R__ block.** It emits CREATE TABLE *and* indexes
     together, which would (a) duplicate the index emission that
     `appendInternalTableAdditiveIndexes` already performs in R__ section 3, and (b) break the
     ordering rule the file documents at line 167-170 (all CREATE TABLE -> all ADD COLUMN -> all
     constraints) by placing internal indexes before the additive-column step -- so an index over a
     newly added internal column would run before that column exists.
     The correct shape is a create-table-only variant called from R__ section 1, mirroring exactly
     how `appendBusinessTableShape` is the shape-only half of `appendBusinessTable` (lines 173-179
     for business tables). That split already exists on the business side and is the pattern to copy.

  WHAT SHIPPED: a new shape-only `appendTableShape` (the internal-table analogue of
  `appendBusinessTableShape`), called from R__ section 1 ahead of the additive-column step, with its
  javadoc recording both hazards above so the split is not re-merged later. `appendTable` now
  delegates to it and adds the indexes, so V1 emits byte-identically as before.

  HOW IT IS PROVEN, given no fresh-boot test can reach the failure: the guard's second test builds a
  real H2 database that PREDATES the table, asserts it is absent, then runs the repeatable migration
  and shows it self-heal. That reproduces the essential precondition -- an existing database missing
  a newly-registered internal table -- at SQL level, so it runs in a gate, which the live failure
  never could.

  Affects every internal table added after an app's first deployment, not only R2.7's -- currently
  ~15 internal tables exist, and the failure was dormant for all of them until the platform added one.

  LIVE FULL-APP-BOOT PROOF (2026-08-19, AppGen/apps/_scratch/reg193-proof, H2Local, port 8393,
  outside this repo per the source-of-truth layering), run end to end by this item's own closer, in
  addition to R7.9/EDIT-10's independent field observation above -- three phases against the SAME
  database file:

  PHASE 1: generated and booted a throwaway app with ONE internal table temporarily removed from
  `NpdevInternalTables.all()` (simulating the platform version before R2.7/RUN-15 added
  `npdev_cron_fire_claim`). V1 migrated for real (Flyway recorded it), and a real business row was
  created via `POST /api/widgets` (`Phase1-Widget`) to establish genuine pre-existing data in the H2
  file. App stopped.

  PHASE 2 (RED, self-observed): restored `npdev_cron_fire_claim` to `NpdevInternalTables.all()` (its
  real, current registration) with the FIX TEMPORARILY REVERTED, then regenerated and rebuilt against
  the SAME database file and started it. The app crashed during startup with a real
  `org.springframework.beans.factory.BeanCreationException` wrapping
  `org.flywaydb.core.internal.exception.FlywayMigrateException: Script
  R__npdev_schema_additive_columns.sql failed`, caused by
  `org.h2.jdbc.JdbcSQLSyntaxErrorException: Table "npdev_cron_fire_claim" not found` on an
  `ALTER TABLE` statement -- logged in full in the app's own `App/logs/app-20260819T101014Z.log`.
  `Application run failed`; the process exited and the port never bound (`curl` returned connection
  refused, http_code 000) -- a harder failure than R7.9's HTTP 503, consistent with it being the same
  defect hit through a different request path (R7.9 evidently hit an already-running instance's
  later reconciliation attempt rather than the initial boot).

  PHASE 3 (GREEN, self-observed): restored the fix, regenerated and rebuilt against the SAME database
  file (untouched since PHASE 2's crash) and started it. Flyway applied the repeatable migration with
  ZERO errors this time (`Successfully applied 1 migration`); the app started
  (`Started FinalExecApplication in 26.9 seconds`) and `GET /actuator/health` returned 200.
  `GET /api/widgets` returned the PHASE 1 row (`Phase1-Widget`) untouched, and a new
  `POST /api/widgets` (`Phase3-Widget`) succeeded -- no data loss, no destructive recreate. The app
  was then stopped and `npdev_cron_fire_claim` was queried DIRECTLY against the stopped H2 file (via
  `org.h2.tools.RunScript` against `INFORMATION_SCHEMA.TABLES`/`.COLUMNS`, matching the JDBC URL's
  real `MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE` params): the table exists with all six declared
  columns (`flow_name`, `tenant_id`, `scheduled_fire_time`, `created_at`, `claimed_by`,
  `claimed_until`).

  FRESH-INSTALL REGRESSION CHECK: the same app's database directory was wiped and rebooted against a
  brand-new, empty database with the CURRENT (fixed) code. Flyway applied both migrations cleanly
  (`Successfully applied 2 migrations ... now at version v1`, zero errors) -- the redundant guarded
  `CREATE TABLE IF NOT EXISTS` that R__ now also emits for internal tables is a correct no-op after
  V1 already created them, exactly as REG-40 already established for business tables. `V1__`'s own
  text was also checked directly: exactly one `CREATE TABLE` statement per internal table (18 total
  for this proof's model: 17 internal + 1 business), never a duplicate.

  Full regression: `:NPDevKernel:kernel:test` and `:NPDevGenerator:generator:test` both green on the
  final restored code (kernel's `NpdevInternalTables.java` diffs clean against HEAD -- the PHASE 1/2
  temporary edit used to stage the RED was fully reverted). `scripts/hygiene/check-deterministic-generation.ps1`
  passed byte-identical across two consecutive runs.
guard:
  kind: test
  ref: NPDevGenerator/generator/src/test/java/com/npdev/generator/dbconfig/SchemaRealizationEmitterInternalTableCreateTest.java#internalTableSelfHealsOnADatabaseThatPredatesItsAddition
  asserts: >-
    a platform-added internal table reaches an already-migrated app's database on regeneration, the
    same way REG-40 made a newly-added business concept reach one. Two tests carry it:
    newInternalTableCreateTextAppearsInTheAdditiveMigration asserts the R__ additive script now
    contains `CREATE TABLE IF NOT EXISTS npdev_cron_fire_claim` AND that it precedes any ALTER TABLE
    for that same table -- the ordering hazard this item's diagnosis named; and
    internalTableSelfHealsOnADatabaseThatPredatesItsAddition (the guard.ref anchor) builds a real H2
    database that predates the table, asserts the precondition "table must be absent before the R__
    run", then proves the repeatable migration self-heals it AND that a write against the newly
    created table round-trips. That second test is the existing-database proof at SQL level, gate-
    runnable without an app boot -- complementary to, not a substitute for, the live full-app-boot
    proof narrated in this item's detail above.
  provenRed: true
  provenRedNote: >-
    Watched live, twice, by two different mechanisms: (1) UNIT LEVEL --
    internalTableSelfHealsOnADatabaseThatPredatesItsAddition run against the code with the R__ fix
    temporarily reverted failed with a real
    `org.h2.jdbc.JdbcSQLSyntaxErrorException: Table "NPDEV_CRON_FIRE_CLAIM" not found` thrown from a
    real H2 connection executing the real emitted SQL (not a mock) -- captured verbatim in the Gradle
    test-results XML before the fix was restored and the test re-run green. (2) LIVE APP-BOOT LEVEL --
    the three-phase proof narrated above: a real Spring Boot application, built and started from a
    real jar against a real, previously-migrated H2 database file carrying real pre-existing business
    data, crashed at startup with `FlywayMigrateException` / the identical H2 "table not found" error,
    and the port never bound (connection refused). Restoring the fix and repeating the exact same
    regenerate-rebuild-reboot cycle against the SAME database file made it boot clean, self-heal the
    missing table, and serve both the old and new data. Both REDs are independent of, and in addition
    to, R7.9/EDIT-10's own field-observed HTTP 503 (recorded earlier in this item's detail) -- that
    one is cited as prior, independently-discovered evidence of real-world impact; the two above are
    this item's own closing verification, watched directly rather than inferred.
