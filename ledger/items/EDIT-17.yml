id: EDIT-17
title: >-
  A band picker without a panel -- filter/multiSelect only -- now resolves a real projection against
  the band's own collection concept, lifting B19's "panel is required" refusal by construction
type: GAP
severity: LOW
status: DONE
opened: 2026-09-02
closed: 2026-09-02
source: >-
  BOUNDARY_LIFT_PLAN_2026-09-02.md work package 1.1 (B19), wave 1. B19's own docs/ACCEPTED_BOUNDARIES.md
  row named the exact revisit trigger: "A no-panel fetch path targeting the band's own concept
  directly becomes a real authoring need -- would be new work (a fetch mechanism, not a validation
  relaxation)". `WorkbenchBandPickerAst`'s own class javadoc had already floated this same no-panel
  path as a future direction without it ever being built.
surface: NPDevContract/dsl (compiler, validation, schema), NPDevGenerator (BusinessUiEmitter,
