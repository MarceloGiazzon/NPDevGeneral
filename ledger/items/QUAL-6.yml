id: QUAL-6
title: >-
  No execution-based code coverage measured in any language
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-08-12
closed: 2026-08-13
verification: VERIFIED_LIVE
source: >-
  Full-repo maturity audit 2026-08-12 (MASTER-ROADMAP.md, ROADMAP.md card R3). No JaCoCo on any of
  the 4 Java builds, no @vitest/coverage-v8 for the editor, no coverage.py for NPDevCli, no ratchet
  baseline file anywhere.
surface: quality/coverage
files:
  - scripts/policy/coverage-baseline.json
  - scripts/quality/check-coverage-ratchet.py
  - NPDevContract/dsl/build.gradle
  - NPDevGenerator/build.gradle
  - NPDevKernel/build.gradle
  - NPDevRuntimeHost/build.gradle.template
  - scripts/quality/run-runtimehost-gate.ps1
  - scripts/quality/run-ai-knowledge-gate.ps1
  - NPDevEditor/ui-react/vitest.config.ts
  - NPDevEditor/ui-react/package.json
  - NPDevEditor/ui-react/package-lock.json
  - scripts/requirements.txt
  - .gitignore
detail: |
  See __OutsideRepo/strategy-2026-08-12/ROADMAP.md card R3 (Wave 1). run-frontend-gate.ps1 hard-fails
  on a "coverage" directory inside ui-react -- vitest output must be pointed outside ui-react or the
  gate goes red the moment coverage works. Land R1 Stage 1 first so the RuntimeHost coverage baseline
  is honest rather than showing R1's exclusions as data. Start the ratchet at 0.0 with
  measuredOn: null. MASTER-ROADMAP.md batches this into Step 9 (a hard prerequisite for PK-4,
  Step 11).
resolution: |
  DONE (2026-08-13), Java portion only -- editor (vitest coverage-v8) and NPDevCli (coverage.py) are
  explicitly deferred to a future Track C follow-up (ROADMAP.md card C8), not silently dropped.

  JaCoCo wired into all 4 Java builds:
    - NPDevContract/dsl, NPDevGenerator (:generator + :tools:npdev-cli), NPDevKernel (:kernel + all
      36 :adapters:* subprojects): unconditional `id 'jacoco'` / `apply plugin: 'jacoco'`, since none
      of these ship into a generated FinalApp -- only compiled jars are staged via
      npdevRuntimeHostLibsDir.
    - NPDevRuntimeHost/build.gradle.template (the file FinalAppAssembler.materializeRootTemplate
      actually copies into every generated app, NOT the plain build.gradle, which is a separately-
      drifting copy used only for a direct bare-checkout GATE-H2/GATE-PG run): gated behind
      `project.hasProperty('enableCoverage')` (`-PenableCoverage=true`), so JaCoCo does NOT ship
      inside generated FinalApps by default. run-runtimehost-gate.ps1 passes the property on its own
      throwaway verification build and copies the resulting report to
      scripts/reports/out/runtimehost-jacoco-test-report.xml before its own build-cache cleanup step
      deletes the assembled app's build/ directory.

  scripts/policy/coverage-baseline.json: one entry per module (NPDevContract/dsl,
  NPDevGenerator/generator, NPDevKernel/kernel [aggregate: true, summed across :kernel + all 36
  adapters], NPDevRuntimeHost), each starting at coveragePercent 0.0 / measuredOn null as specified,
  so the first real CI measurement sets the floor rather than blocking a merge.

  scripts/quality/check-coverage-ratchet.py: static (builds nothing itself), reads whatever fresh
  JaCoCo XML report an EARLIER step in the same run-all-gates.ps1 invocation already produced,
  ratchets the recorded floor up on improvement, fails only on a real regression, treats a missing
  report as not-measured (never a failure). Wired into run-ai-knowledge-gate.ps1 as step [43/43]
  (renumbered from 42) and declared `ci-gate` in script-invocation-declarations.json. 7-control
  --calibrate self-test covers regression detection, ratchet-up, not-measured, and the kernel
  aggregation math (sum of covered/missed across reports, not an average of percentages).

  Two hazards from the card, both verified live rather than assumed:
    1. run-frontend-gate.ps1's Find-GeneratedResidue "coverage"-directory hard-fail: not triggered --
       this card adds no frontend/vitest coverage (explicitly out of scope, see above).
    2. :generator's packaged-proof test exclusion + custom URLClassLoader-based tests
       (TrustedSourceEmitterGeneratedActionTest et al.): verified live, not just reasoned about.
       Ran `:generator:test --tests AdapterRegistrationConsistencyTest --tests
       TrustedSourceEmitterGeneratedActionTest` with JaCoCo enabled -- BUILD SUCCESSFUL,
       jacocoTestReport produced real, plausible, non-zero, non-100% counters (LINE 393 covered /
       7304 missed from just 2 test classes). The custom-classloaded throwaway harness classes are
       invisible to the report (compiled outside src/main/java), exactly as documented -- not a
       report defect, and not a silent 0%.

  Also live-verified: dsl (`:test` with a single test class, JaCoCo agent confirmed attached via
  `-javaagent:...jacocoagent.jar`, real XML produced) and a FULL, unfiltered RuntimeHost gate run
  (`pwsh scripts/quality/run-runtimehost-gate.ps1`, genuinely green end-to-end) which produced a real
  9.9463% LINE coverage report, auto-discovered by check-coverage-ratchet.py's reportGlobs with no
  manual path override needed, and correctly ratcheted the (throwaway, not committed) baseline up.
  coverage-baseline.json itself was reset to the clean 0.0/null starting state before commit, per the
  card's own explicit instruction -- these runs proved the MECHANISM, they are not meant to be the
  first official measurement.

  Known, pre-existing gap NOT closed by this card: no CI gate invokes kernelQualityGate at all (it is
  an orphan Gradle task, unrelated to this card), so NPDevKernel/kernel's baseline stays at
  0.0/null until either a future gate wires it in or a developer runs it locally.

  ---

  Track C card C8 (2026-08-14) closed the deferred piece: editor + Python coverage, SAME ratchet
  file/schema/gate step, no parallel system. check-coverage-ratchet.py now dispatches on a
  per-module `reportFormat` (jacoco-xml / istanbul-json-summary / coverage-py-json) since neither
  tool emits JaCoCo's XML shape -- ratchet SEMANTICS (not-measured vs regression vs ratchet-up)
  are byte-for-byte identical across all three; only the parser differs. --calibrate grew from 7 to
  9 controls (2 new: istanbul-json-summary and coverage-py-json each parse a known covered/total
  fixture to the expected percentage) -- all 9 pass.

  Editor: added `@vitest/coverage-v8` + vitest.config.ts `coverage` block (provider v8, reporter
  ["text","json-summary"], `all: true` + explicit include so every src/**/*.{ts,tsx} file counts in
  the denominator even if untouched -- mirrors the Gradle jacoco plugin's classDirectories default).
  reportsDirectory points at scripts/reports/out/vitest-coverage (gitignored, outside ui-react) --
  the exact trap this card's own text named (run-frontend-gate.ps1's Find-GeneratedResidue AND
  NPDevEditor/build.gradle's cleanUiReactGenerated both hard-fail on a "coverage" dir inside
  ui-react). package.json's "test" script now runs `vitest run --coverage` unconditionally (matches
  the Java modules' "unconditional, nothing here ships into a generated FinalApp" precedent -- only
  RuntimeHost's JaCoCo needed a flag). Verified live: ran `pwsh scripts/quality/run-frontend-gate.ps1`
  end-to-end (real npm ci, vitest, vite build, cleanUiReactGenerated, editor-complexity-check) --
  passed, residueCheck clean, coverage-summary.json survived the cleanup at its gitignored path.
  13 test files / 79 tests, real measured floor 23.6074% LINE (623/2639).

  NPDevCli: run-ai-knowledge-gate.ps1 step [18/35] (already running `unittest discover -s
  NPDevCli/tests`, REG-110) now wraps that SAME invocation in `coverage run --source=NPDevCli
  --omit=NPDevCli/tests/*,NPDevCli/tests/fixtures/*` and writes `coverage json` to
  scripts/reports/out/python-coverage/npdevcli-coverage.json, read by [35/35] via reportFormat
  "coverage-py-json". `coverage>=7.0` added to scripts/requirements.txt (same "refuse to silently
  skip a missing validator" stance as the existing jsonschema entry). Verified live: 145 tests, all
  pass. NPDevCli is the one coverage module measured for real even in the standalone,
  never-builds-anything ai-knowledge-gate.yml CI job, since its test suite already runs there.

  Real, CI-caught finding: the first commit recorded a Windows-measured floor (30.2947%, 1768/5836)
  and PR #81's own "AI knowledge substrate gate" CI job (Linux) immediately failed with a genuine
  regression -- 30.1576% (1760/5836). NOT a flake, not REG-164 (the pre-existing Windows-only
  pack-lock CRLF bug, which never fires on Linux CI and did not appear in this run's failure list).
  NPDevCli has dozens of `os.name == "nt"` branches (npdev_cli.py, dev_loop.py, npdev_monitor.py,
  npdev_explore.py); the same 145 tests legitimately execute a few more lines on Windows than on
  Linux. Fixed by pinning the committed floor to the Linux CI job's own measurement (30.1576%,
  1760/5836) rather than a local dev machine's, with a note on the entry itself warning against
  re-measuring by hand on any OS other than CI's. General lesson for any future coverage floor: this
  ratchet is enforced by ONE specific CI environment (ai-knowledge-gate.yml, ubuntu-latest) -- the
  floor must come from THAT environment's own measurement, not whichever machine happens to run the
  suite first.

  NPDevMcp and scripts/ (the rest of "the Python tooling," per this card's own framing): investigated
  and found NEITHER has a dedicated automated test suite anywhere in the repo -- NPDevMcp/server.py
  is git-tracked alone with just a README, and scripts/'s ~150 check-*.py files each carry their own
  ad-hoc --calibrate self-test mode instead (a different testing paradigm, not wired to coverage.py).
  Deliberately NOT folded into NPDevCli's --source: a handful of scripts/ files DO get incidentally
  imported by NPDevCli/tests (e.g. test_engines.py imports check-config-schema.py directly), but
  lumping the other ~150 largely-untested files into that denominator would dilute NPDevCli's real,
  meaningful floor toward a near-frozen near-zero number. Both get their own honestly-labelled
  0.0/null placeholder entry instead -- same shape of pre-existing, not-fabricated gap as kernel's
  own placeholder above, not silently dropped.

  One unrelated bug found while live-testing the ratchet mechanism, filed separately: REG-168 (this
  worktree's shared external Build directory carried leftover JaCoCo XML reports from unrelated
  parallel Track C work; running check-coverage-ratchet.py with no arguments auto-discovered and
  would have silently ratcheted the dsl/generator/kernel floors up from THAT stale, wrong-checkout
  data had it not been caught and manually reverted before commit -- the script has no mechanism
  tying a discovered report to the currently checked-out source).
guard:
  kind: manual
  ref: pwsh -NoProfile -File scripts/quality/run-runtimehost-gate.ps1 (produces
    scripts/reports/out/runtimehost-jacoco-test-report.xml); pwsh -NoProfile -File
    scripts/quality/run-frontend-gate.ps1 (produces scripts/reports/out/vitest-coverage/coverage-summary.json);
    python -m coverage run --source=NPDevCli --omit=NPDevCli/tests/*,NPDevCli/tests/fixtures/* -m
    unittest discover -s NPDevCli/tests -p test_*.py && python -m coverage json -o
    scripts/reports/out/python-coverage/npdevcli-coverage.json; python
    scripts/quality/check-coverage-ratchet.py --calibrate
  asserts: the RuntimeHost gate run produces a real JaCoCo XML report with a non-zero LINE counter,
    the frontend gate run produces a real non-zero vitest json-summary report AND leaves no residue
    inside ui-react, the NPDevCli suite (145 tests) passes under coverage.py and produces a real
    non-zero coverage.json, and the ratchet script's 9 self-test controls (7 original + 2 for the
    new formats) all pass
  provenRed: true
