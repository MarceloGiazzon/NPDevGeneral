  kind: test
  ref: NPDevRuntimeHost/src/test/java/com/finalexec/db/SchemaLifecycleExecutorConversionHookIntegrationTest.java#hookResolvedDestructiveDropIsRecordedAsSanctionedDestruction
  asserts: >-
    The p76-drop-legacy scenario (a destructive column drop fully resolved by a hook under the
    default audit-only mode) boots safe-additive AS BEFORE -- the pinned test
    hookResolvedDestructiveDropNeedsNoAcknowledgmentTokenAndBootSucceeds passes unchanged -- AND now
    leaves exactly one npdev_schema_history row with classification SANCTIONED_DESTRUCTION, outcome
    APPLIED, items_json naming the item's stable string (DROP_COLUMN:p76_widgets:legacy_flag...) and
    the claiming hook id (p76-drop-legacy). The sibling tokenRequiredModeGatesAHookResolvedDestructiveItem
    pins the corrected gate: under token-required, a boot with no token refuses with
    B14:sanctioned_destruction_requires_token: BEFORE any hook runs (the column survives the
    refusal), and booting with the pre-hook token through the static manifest field proceeds and
    drops the column.
  provenRed: true