detail: |
  **What changed.** ADR-0008 is owner-approved with no conditions and its revisit trigger has not
  fired, so the DEFAULT did not change: authoring the conversion hook remains the acknowledgment.
  What the package changed is that the policy no longer operates invisibly, in the plan's three
  parts. (a) BEFORE it happens: the pre-hook destructive report (SchemaDeltaReport.generate on the
  live state, before ConversionHookRunner.run) feeds a sanctioned-destruction preview -- every
  destructive item a hook on the classpath claims, with the claiming hook id -- rendered as a
  sanctionedDestruction section by both renderers (text + JSON), wired into every pre-boot surface
  (-ImpactOnly / REPORT_ONLY, npdev db verify, GET .../impact) via a shared
  SchemaImpactFacade.sanctionedOf(ImpactReport). Never affects verdict, exactly like the surplus
  section. (b) AFTER it happens: the boot writes one SANCTIONED_DESTRUCTION history row per
  sanctioned item (via SchemaHistoryStore.insertRawHistoryRow), naming the item's stable string and
  the hook -- so history can now distinguish "a hook dropped orders.legacy_total under sanction"
  from "an acknowledged surgical drop". (c) GATEABLE BY CHOICE:
  -Dnpdev.schema.destructive.sanctioned=audit-only|token-required (default audit-only, resolved with
  the same typo-to-default shape as resolveMixedDdlVerifyMode). Under token-required the plan's
  step-4 ordering was implemented with a MEASURED CORRECTION (see below): the gate fires BEFORE
  ConversionHookRunner.run, not after the report re-introspection.

  **What was measured, not assumed.** The sanctioned set is computed as the plan's formula (pre-run
  unresolved keys, intersected with the destructive kinds, minus what the post-hook report still
  contains) but over the pre-hook REPORT rather than the raw key set, because the token is computed
  over preHookReport.stableStrings() and a reconstructed key set cannot reproduce a pre-hook
  Unknown item -- an unsatisfiable token is worse than an extra introspection, so the plan's cheaper
  "reuse run()'s keys" fallback was rejected and the reason recorded. The plan directed SANCTIONED
  rows to be written at the report.isEmpty() branch; they are written for the sanctioned set in BOTH
  flows (all-resolved and mixed), since "minus whatever report still contains" applies to both, and
  a mixed boot (some items sanctioned, others still unclaimed) legitimately needs its audit rows too.

  **Premise that proved FALSE, found by running, worth more than the package.** The plan's step-4
  placement -- refuse with B14: at the post-hook report branch -- was wrong in a way the first gate
  run caught live: the token-required integration test failed because the hook had ALREADY dropped
  the sanctioned column by the time the refusal fired. A gate that fires after the sanctioned item
  vanished is a gate that gates nothing, which is exactly the "plausible wrong answer" failure mode
  the plan itself names. The gate now fires BEFORE ConversionHookRunner.run: pending sanctions are
  computed from the same claims index the runner selects against (loadClaimIndex) intersected with
  the pre-hook report's destructive items, the token is checked through the SAME two channels (static
  manifest field / PendingSchemaAcknowledgmentStore), and the refusal truthfully states "Refused
  BEFORE the hooks ran -- nothing has been executed or applied." The plan's token-required test
  ("asserting the refusal ... and that supplying the token lets it through") is satisfied under the
  corrected ordering; the test additionally asserts the column survives the refusal, which is what
  makes the correction observable.

  **What was deliberately NOT done, and why.** ADR-0008 stands unchanged under the default -- no
  attempt to condition it (the plan forbids that). The mixed-case behavior (post-hook report still
  non-empty after sanctions) is documented, not engineered further: after the pre-hook token is
  accepted, the normal post-hook refusal applies to what remains, and the two itemizations are each
  named in their own refusal. The pre-hook report is one extra live introspection on every boot
  reaching the hook section (the plan accepted this; the sanctioned set / token / audit rows all
  describe the report an operator actually saw).

  **Residual statement (goes verbatim into ledger/boundaries/B14.yml too).** Under the default,
  ADR-0008 stands unchanged -- authoring the hook is the acknowledgment. What changed is that it is
  no longer invisible, and no longer the only option: the sanctioned set is previewed before the
  boot, itemized in history after it, and an operator can require the itemized token instead.
verification: >-
  runtimehost-core compile + runtimehost-core test task in the full runtimehost gate: 854 tests
  total on the first (red) run -- the one failure was the newly-added
  SchemaLifecycleExecutorConversionHookIntegrationTest#tokenRequiredModeGatesAHookResolvedDestructiveItem,
  which is the measured premise defect above, fixed by moving the gate pre-hook; the re-run after
  the fix is the green evidence for this package. ImpactReportRenderersTest's two new sanctioned
  section tests (empty list adds nothing; advisory section never changes verdict) run in the same
  suite. Postgres arm: none needed -- P5 has no engine-shaped claim.
