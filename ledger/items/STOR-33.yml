surface: >-
  SchemaLifecycleExecutor.beforeMigrateDecision (pre-hook SchemaDeltaReport + mode resolver +
  pre-run B14 gate + SANCTIONED_DESTRUCTION audit rows), ConversionHookRunner (run now returns
  HookRunOutcome carrying preRunUnresolvedKeys + claimedItemToHookId), SchemaImpactFacade / impact
  report (new sanctionedOf() + renderers' sanctionedDestruction section), SchemaImpactController /
  SchemaVerifyMain / ImpactReportWriter wired to it, and the new SanctionedDestruction record.
