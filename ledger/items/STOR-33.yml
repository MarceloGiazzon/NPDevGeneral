id: STOR-33
title: >-
  Sanctioned destruction is now visible and gateable by choice: the pre-hook destructive items a
  conversion hook will resolve are previewed before any boot (-ImpactOnly / impact report
  sanctionedDestruction section), recorded per item in npdev_schema_history after it
  (SANCTIONED_DESTRUCTION rows naming item + hook), and -Dnpdev.schema.destructive.sanctioned=
  token-required gates them with the itemized token before the hooks run (B14:sanctioned_
  destruction_requires_token:) while the default audit-only keeps ADR-0008 byte-for-byte (boundary
  B14 -> LIFTED)
