id: QUAL-54
title: >-
  NPDevContract/dsl coverage measurement wobbles again (85.0558% vs 85.0518%, ~0.004pp) after
  QUAL-48's fix -- a different nondeterministic line, not yet identified
type: GAP
severity: LOW
status: OPEN
opened: 2026-09-02
source: >-
  Surfaced running run-all-gates.ps1 during BOUNDARY_LIFT_PLAN_2026-09-02.md wave 1 (EDIT-17's real
  DSL edits: AutoPanelExpander/PanelValidation/ModelCompiler/SqlIdentifierSupport, plus a rewritten
  AutoPanelWorkbenchTypedSurfaceValidationTest). Two coverage measurements within ONE run-all-
  gates.ps1 execution (:dsl:test running twice, once per gate that touches it) read 85.0558% then
  85.0518% against identical source between the two runs -- the coverage ratchet correctly reported
  the second as a DROP against the first's auto-raised floor.
surface: NPDevContract/dsl test suite, scripts/policy/coverage-baseline.json
files:
  - scripts/policy/coverage-baseline.json
detail: |
  QUAL-48 (DONE, 2026-08-25/2026-09-01) already root-caused and fixed ONE source of exactly this
  symptom: PackSignatureTest's unseeded Ed25519 keypair generation made PackSigner's catch-block
  coverage depend on which random signature byte a tamper test happened to flip. Verified fixed --
  two independent post-fix :dsl:clean :dsl:test --no-build-cache runs measured byte-for-byte
  identical 85.0422% both times.

  This is a DIFFERENT recurrence: the observed values today (85.0558%/85.0518%) are not close to
  85.0422% at all, consistent with genuinely new DSL code changing the total line/branch denominator
  (EDIT-17 added real production code this session) rather than QUAL-48's mechanism resurfacing. The
  ~0.004pp gap between the two same-session measurements is small (order of 1-2 lines out of
  ~21500+), the same shape QUAL-48's own detail described before it was diffed and attributed.

  Re-pinned by hand to 85.0518% (the lower, safely-cleared-by-both value) in
  scripts/policy/coverage-baseline.json rather than left to auto-ratchet, matching this file's own
  standing discipline for exactly this class of oscillation (see its own NPDevContract/dsl `note`
  field for the full history). Not blocking wave 1 -- both observed values are real, non-regressed
  measurements of genuinely new, tested code, not evidence of an actual coverage loss.

  Done when: the actual nondeterministic line(s) are identified, using QUAL-48's own proven method
  (`:dsl:clean :dsl:test --no-build-cache` from NPDevGenerator, twice, diff every (package,
  sourcefile, line) covered/uncovered flip between the two jacocoTestReport.xml files) -- and either
  made deterministic or the floor is set to a value proven stable across N consecutive real runs.
guard:
  kind: manual
  ref: scripts/policy/coverage-baseline.json
  asserts: >-
    Not yet guarded by a test -- the root cause is unidentified. Once found (via QUAL-48's diff
    method), the fix should get the same shape of guard QUAL-48's own
    PackSignatureTest#malformedSignatureLengthIsRejectedWithoutThrowing did: a new deterministic
    test exercising whichever branch was flapping.
  provenRed: false
