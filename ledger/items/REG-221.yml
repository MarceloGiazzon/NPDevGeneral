  asserts: >-
    acceptsInMemoryBufferPassedAsAbstractStreamParameter (new) proves ByteArrayInputStream passed to
    an InputStream-typed parameter now passes; refusesFileInputStreamPassedAsAbstractStreamParameter
    (new) proves a real FileInputStream upcast to InputStream is still refused; all pre-existing tests
    in the class (including the REG-219 regression pair) remain green
  provenRed: true
