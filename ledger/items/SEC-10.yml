id: SEC-10
title: >-
  A plugin child process runs on a restricted classpath, denies host/escape classes at load time,
  and (Linux) gets a real OS network/filesystem sandbox (boundary B30 -> LIFTED)
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-09-05
closed: 2026-09-06
source: >-
  ALL_HITTABLE_LIFT_PLAN_2026-09-05.md package P5 (Wave 2, sequenced after P4 -- both rewire bean
  construction, though in practice this package touched no ModelHolder code). B30.yml's own
  residue: "Static analysis at both ends is still the ONLY admission gate -- a proxy class
  elsewhere on the app classpath that performs a forbidden capability on the plugin's behalf ... is
  still outside what either the bytecode inspector or the OS ceiling catches." Traced to one line:
  PluginIpcChildProcessPool.java:57 defaulted a pooled worker's classpath to
  System.getProperty("java.class.path") -- the host's own full runtime classpath.
surface: >-
  runtimehost-core's pluginipc package (child classpath computation, restricted classloader,
  containment logging), NpdevPluginConfig (wiring), the Linux/Windows resource limiters (OS
  sandbox), plus a load-bearing fix in a DIFFERENT boundary's own mechanism (H2LocalAutoServer,
  STOR-27/B31) found only because this package's own proof exercises a REAL H2Local boot for the
  first time since STOR-27 shipped.
