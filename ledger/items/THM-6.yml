id: THM-6
title: Generated apps -- theme settings (ui.theme.name/choices, ui.a11y.menu), emitted theme files, generation-time validation
type: FEATURE
severity: MEDIUM
status: DONE
opened: 2026-11-03
closed: '2026-11-03'
source: Manager UX plan 2026-10-31 (NPDev_General__OutsideRepo/NPDEV_MANAGER_UX_PLAN_2026-10-31/PLAN.md); owner asked on 2026-11-03
  to implement the whole plan.
surface: generator/themes
detail: New NpdevSettings keys, static/npdev-theme.js, static/themes/*.json and index.json, manifest theme.name/choices; an
  invalid theme fails generation.
resolution: New settings ui.theme.name / ui.theme.choices / ui.a11y.menu; ThemeEmitter validates every owned theme (structure
