  + index.json, npdev-theme.js (the Manager's own engine file), npdev-a11y.css, npdev-display.js, and the manifest theme block.
  ThemeEmitterTest 13/13 (invalid theme names file+pair, hostile values refused, determinism); run-generator-gate.ps1 green
  incl. check-deterministic-generation (796 files, no local paths).
verification: UNIT_TESTED
