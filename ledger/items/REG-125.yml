id: REG-125
title: "PROJECT_DIGEST.md names scripts/quality/run-box-vision-doc-check.ps1 as its own 'Phase 0 validation script' (expected to write scripts/reports/out/box-vision-doc-check-report.json), but neither the script nor any equivalent under a different name was ever built -- a real, never-fulfilled commitment, not a stale path"
type: GAP
severity: LOW
status: DONE
closed: 2026-08-03
opened: 2026-08-03
verification: VERIFIED_LIVE
surface: docs/quality-gates
source: |
  Found while triaging Move 15 Phase C item C2 (REG-123, doc-entrypoint-validation's stale-reference
  backlog). PROJECT_DIGEST.md §"Phase 0 validation" reads:

    Phase 0 validation script:
    scripts/quality/run-box-vision-doc-check.ps1
    Expected report:
    scripts/reports/out/box-vision-doc-check-report.json

  A repo-wide search (case-insensitive, for "box-vision" and "box_vision" in any form) found zero
  matches anywhere other than this one PROJECT_DIGEST.md reference -- the script was never written,
  under this name or any other. Unlike the sibling finding in
  docs/architecture/NPDEV_GENERATOR_ADAPTER_CONTRACT.md (three report references that doc's own text
  explicitly frames as "Phase 10 is a contract phase... does not implement full production generator
  integration" -- i.e. deliberately-future-by-design), PROJECT_DIGEST.md's wording ("Phase 0 validation
  script:" followed by a bare path) does not read as an explicit future-phase disclaimer -- it reads
  like a real, if small, planned validation tool (presumably: does the digest's own Box/Object/Truth
  doctrine text stay consistent with docs/architecture/NPDEV_BOX_OBJECT_TRUTH_VISION.md and its
  ADRs) that was simply never picked up.
files:
  - PROJECT_DIGEST.md
  - scripts/policy/doc-entrypoint-classification-policy.json
detail: |
  Not fixed here, deliberately -- this item's own scope (REG-123) is the validator's false-positive
  and stale-path backlog, not building new tooling. Classified scripts/quality/run-box-vision-doc-check.ps1
  as "future-non-release" and its report as "future-non-release-report" in
  scripts/policy/doc-entrypoint-classification-policy.json (mirroring the existing
  scripts/doctor/npdev-doctor.ps1 / doctor-report.json precedent) so doc-entrypoint-validation stops
  blocking on it while this real gap is tracked here, rather than either silently building a rushed
  checker or silently allowlisting the reference away with no record.

  Recommended next step for whoever picks this up: decide whether this Phase 0 doc-consistency check
  is still wanted (PROJECT_DIGEST.md's own doctrine section is short and has not visibly drifted from
  NPDEV_BOX_OBJECT_TRUTH_VISION.md/its ADRs in practice) -- if yes, build it (likely a simple
  keyword/section presence diff, not a large tool); if the digest doc is considered stable enough not
  to need one, retire the "Phase 0 validation script" section from PROJECT_DIGEST.md instead and close
  this as "intentionally not built."

resolution: |
  DONE (Move 16 Phase A3, 2026-08-03). Chose removal, per this item's own recommendation: nothing in
  this session's own work, nor anything found while investigating, actually needs a Box/Object/Truth
  doctrine-consistency checker, and PROJECT_DIGEST.md's "## Phase 0 validation" section had not been
  touched since it was written -- building a real checker now would be scope invention, not fixing
  this gap.

  Removed PROJECT_DIGEST.md's entire "## Phase 0 validation" section (the script path, the expected
  report path, and the section heading itself) -- it was the last content in the file, so no other
  section needed renumbering or relinking.

  Left the two scripts/policy/doc-entrypoint-classification-policy.json entries in place (did not
  delete them) after confirming why they are still needed: docs/OPEN_ITEMS.md is GENERATED from
  ledger/items/*.yml and, per its own generator, keeps CLOSED items in a permanent historical section
  rather than pruning them -- so REG-125's own title/source text (which quotes the dead path verbatim,
  as the honest record of what was found) will keep re-appearing in that generated doc forever. Removing
  the classification entries after fixing PROJECT_DIGEST.md made run-doc-entrypoint-validation.ps1 fail
  fresh (confirmed live: "docs/OPEN_ITEMS.md:42 references missing release-relevant script
  scripts/quality/run-box-vision-doc-check.ps1" and 6 sibling failures, all pointing at OPEN_ITEMS.md's
  own generated text, not PROJECT_DIGEST.md). Re-added both entries with their reason text updated to
  describe the NEW state accurately (the path is dead everywhere, PROJECT_DIGEST.md's own reference is
  gone, only the generated ledger doc's permanent historical record still names it) rather than leaving
  stale reasoning that would have described a state (PROJECT_DIGEST.md still names it) that no longer
  holds.

  Live-verified: pwsh -File scripts/quality/run-doc-entrypoint-validation.ps1 -- overallStatus "passed",
  0 failures, after both the PROJECT_DIGEST.md removal and the classification-policy reason-text update.

  Files changed (absolute):
    D:\WorkSpace\NPDev\NPDev_General\PROJECT_DIGEST.md
    D:\WorkSpace\NPDev\NPDev_General\scripts\policy\doc-entrypoint-classification-policy.json
