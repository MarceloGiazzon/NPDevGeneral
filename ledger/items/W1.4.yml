id: W1.4
title: >-
  shell.css declares 31 --np-* tokens (with prefers-color-scheme + data-np-theme support) but
  business-ui-style.mustache only consumed 12 of them and would have declared its own competing
  :root; theme mode was reachable only through a GuidePage's own theme.mode (never a config
  default); there was no density axis at all.
