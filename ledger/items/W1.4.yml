detail: |
  WHAT WAS BUILT:
  1. Density axis (shell.css.mustache): --np-density-scale plus the row/control tokens it actually
     drives (--np-row-pad-v, --np-row-pad-h, --np-row-font-size, --np-control-h, --np-pad). The
     :root baseline IS "comfortable"; body[data-np-density="compact"] is the only variant rule, so
     an explicit data-np-density="comfortable" is a no-op by design.
  2. Theme mode as a first-class, config-driven setting: two new NpdevSettings entries,
     ui.theme.mode (default "system") and ui.density (default "comfortable"), resolved through the
     normal defaults/overrides envelope and emitted into generated-ui-manifest.json's new top-level
     `theme` block (BusinessUiEmitter.appThemeNode). shell.js's new applyAppTheme() applies it on
     every boot, BEFORE any GuidePage is resolved.
  3. Fixed a real bug this surfaced: BusinessUiEmitter.guidePageThemeNode unconditionally defaulted
     an unset GuidePage theme.mode to "light" and theme.density to "comfortable" -- meaning EVERY
     page visit silently forced light/comfortable regardless of the app-wide config default, making
     a "system" or "dark" or "compact" default structurally unreachable. Now left null when the
     GuidePage doesn't declare them, so the app-wide default actually wins for any page that hasn't
     opted into its own override -- proven by shell.js's applyGuidePage still overriding correctly
     when a GuidePage DOES declare its own theme.mode/theme.density.
  4. mode="system" is applied as the ABSENCE of the data-np-theme attribute (removed, not set to
     the literal string "system") -- shell.css's existing prefers-color-scheme escape hatch
     (":root:not([data-np-theme=\"light\"])") already handles that correctly with zero CSS changes.
  5. business-ui-style.mustache converted from 12 to 22 unique consumed tokens -- reusing existing
     shell tokens (--np-border, --np-surface, --np-radius, --np-text-muted, --np-shadow) plus the
     three new density tokens, on .side-nav/button/.records/.bulk-actions-bar/.filter-row -- rather
     than declaring a second, competing token set.
  6. Documented the full token contract (density + theme-mode cascade order) in docs/UI_CONTRACT.md
     as a public surface an app's own theme.css overrides against.
