id: REG-192
title: >-
  Two smaller verification-path defects found during EDIT-7: engine_start_env hardcodes
  ALLOW_EVALUATE=false, and r7-2's routine searches for seed-button text that REG-189 changed
type: BUG
severity: LOW
status: OPEN
opened: 2026-08-19
source: >-
  Found while browser-verifying EDIT-7 (R7.4). Both confirmed against real source/behaviour; neither
  fixed, as `NPDevCli` was held by a concurrent workstream and the routine belongs to another item.
surface: cli/monitor, verification/routines
files:
  - NPDevCli/npdev_monitor.py
  - AppGen/apps/simple-user-registry-h2local/explorations/r7-2-empty-state-seed-cta.json
detail: |
  **(a) `engine_start_env()` hardcodes `ALLOW_EVALUATE: "false"`** (`npdev_monitor.py:889`, confirmed
  by the orchestrator). A routine therefore cannot use `evaluate` steps when the engine is started
  through `npdev monitor` -- which blocks stubbing `window.prompt`/`window.confirm`, and headless
  Chromium has no OS dialog to answer, so any UI whose action goes through a native dialog is
  undrivable that way. EDIT-7's verification had to start the engine manually to get around it.
  Worth deciding deliberately rather than leaving hardcoded: `evaluate` is genuinely powerful, so the
  honest options are an opt-in flag on `engine-start`, or per-app config, not a silent `false`.

  **(b) `r7-2-empty-state-seed-cta.json` is now stale**, and REG-189's fix is why. That routine
  asserts on button text `"Demo users"`. When the app had two seed files the CTA rendered one button
  per seed with its label; now that REG-189 made a single-seed manifest work correctly and
  `simple-user-registry-h2local` legitimately has exactly ONE seed, the button reads
  **"Load sample data"** with no suffix. So a routine written to prove R7.2 no longer matches the UI
  R7.2 produces -- through no fault of either item.

  This is a small but real instance of a general hazard worth noting: **a routine that asserts on
  rendered text is coupled to data shape**, and a fix elsewhere (REG-189) can invalidate it silently.
  Preferring the emitter's deterministic selectors (`#concept-<Name>`, `[name=field]`, action-button
  ids) over visible text is the durable answer, and is what MON-15's coverage matching and R3.3's
  generated routines already rely on.
guard:
  kind: manual
  ref: >-
    (a) grep ALLOW_EVALUATE in NPDevCli/npdev_monitor.py -- currently the literal "false".
    (b) Run r7-2-empty-state-seed-cta.json against simple-user-registry-h2local (now one seed) --
    it looks for "Demo users" while the CTA renders "Load sample data".
  asserts: >-
    (a) a routine can opt into evaluate steps through a supported path rather than needing the engine
    started by hand; (b) r7-2's assertion matches the CTA the app actually renders for a one-seed app
  provenRed: false
