id: EDIT-2
title: >-
  Editor "Add panel"/"Add rule profile" emit schema-invalid keys
type: BUG
severity: MEDIUM
status: DONE
opened: 2026-08-12
closed: 2026-08-14
source: >-
  Full-repo maturity audit 2026-08-12 (MASTER-ROADMAP.md, ROADMAP.md card R6). Confirmed live this
  session against the real schema: the panel $def (additionalProperties: false) has no
  concept/dataSource field, only dataSources (array); the ruleProfile $def (additionalProperties:
  false) has no concept/permissionRequirements field at all, and its `name` is a controlled enum of
  profile kinds (always/interactive/headless/...), not a free identifier. PanelsEditorSection.tsx and
  RuleProfilesEditorSection.tsx write these invalid keys today.
surface: editor/panels-ruleprofiles
files:
  - NPDevEditor/ui-react/src/authoring/editors/panels/PanelsEditorSection.tsx
  - NPDevEditor/ui-react/src/authoring/editors/ruleProfiles/RuleProfilesEditorSection.tsx
  - NPDevEditor/ui-react/src/authoring/editors/modelValidation.ts
detail: |
  See __OutsideRepo/strategy-2026-08-12/ROADMAP.md card R6. Fix: stop writing the invalid keys, retire
  them from AuthoringModelDocument's panel/ruleProfile authoring types, fix modelValidation.ts's
  panel.route-or-panel.concept check to match the real schema shape. MASTER-ROADMAP.md Step 3, this
  session's scope (bundled with EDIT-1's fix, same card).

  2026-08-14 (ledger-currency sweep): status was still OPEN despite shipping alongside EDIT-1 in
  commit `74501683` (PR #11, landed 2026-08-12). Confirmed live on the current checkout: grepping
  `PanelsEditorSection.tsx` and `RuleProfilesEditorSection.tsx` for the specific invalid keys this
  item named (a bare `dataSource`/`concept` field on a panel, a `permissionRequirements` field on a
  rule profile) finds zero matches -- neither file writes them anymore. No dedicated automated guard
  test exists for this specific check (the roundtrip loss-detector test covers EDIT-1's scope, not
  this one), so this is closed on direct source inspection, not a test run.

  2026-08-17: NPDevEditor was parked out of this repository (see BREAKING.md). The files and guard
  below name paths that no longer resolve here; they resolve in the parked tree. This item stays
  DONE -- the fix shipped and was verified before the move -- but its guard can no longer be re-run
  from this repo.
guard:
  kind: manual
  ref: >-
    grep NPDevEditor/ui-react/src/authoring/editors/panels/PanelsEditorSection.tsx and
    RuleProfilesEditorSection.tsx for a bare `dataSource:`/`concept:` field on a panel or a
    `permissionRequirements` field on a rule profile
  asserts: >-
    neither file writes a key outside model.schema.json's panel/ruleProfile $def
    (additionalProperties: false), matching the schema's real shape
  provenRed: false
