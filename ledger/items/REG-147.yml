id: REG-147
title: >-
  Composite-unique-constraint guard DDL for a 3+ column unique is missing a semicolon, breaking Postgres boot
type: BUG
severity: HIGH
status: DONE
opened: 2026-08-13
closed: 2026-08-14
verification: VERIFIED_LIVE
source: >-
  Found incidentally during MASTER-ROADMAP.md Step 6 (PK-2) verification, while running the real
  two-engine (H2 + Postgres) generate->build->boot proof required by that card. The H2 half of the
  proof succeeded; the identical model failed to boot on real Postgres. Confirmed NOT caused by PK-2's
  own changes: reproduces identically with PK-2's source changes fully stashed (unmodified main,
  commit ff2711d6).
surface: generator/schema-realization-ddl
files:
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/dbconfig/SchemaRealizationEmitter.java
detail: |
  A model importing the built-in `identity` pack (NPDevContract/packs/identity/pack.json) and
  generating for real Postgres fails Flyway migration at boot with:
    org.postgresql.util.PSQLException: ERROR: syntax error at or near "END"
  The emitted DO $$ ... END $$; guard block for the identity pack's UserRolePermission concept
  (composite unique on tenant_id, user_role_id, permission -- 3 columns) is missing a semicolon
  after its ALTER TABLE statement:

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS
        WHERE CONSTRAINT_NAME = 'uqx_auth_user_role_permissions_ux_user_role_permission'
          AND TABLE_NAME = 'auth_user_role_permissions'
          AND TABLE_SCHEMA = current_schema()
      ) THEN
        ALTER TABLE auth_user_role_permissions ADD CONSTRAINT
          uqx_auth_user_role_permissions_ux_user_role_permission
          UNIQUE (tenant_id, user_role_id, permission)
      END IF;              <-- missing ";" on the ALTER TABLE line above this
    END $$;

  Every other unique-constraint guard emitted in the same file (2-column and single-column uniques)
  has the semicolon and works correctly -- this is specific to whatever code path builds the ALTER
  TABLE statement text for a 3+ column composite unique constraint, likely a string-join/template
  branch in SchemaRealizationEmitter that forgets the trailing terminator only on that arm. Not yet
  isolated to the exact line (out of scope for the session that found it -- PK-2 does not touch DDL
  emission at all). Blocks boot entirely on Postgres (Flyway runs the whole migration file as one
  transaction, so one broken statement fails the whole app) for ANY model using the identity pack's
  UserRolePermission concept, or any other concept with a 3+ column unique constraint, on Postgres.
  H2 is unaffected (H2's more permissive statement parser apparently tolerates or the guard shape
  differs there -- not confirmed which).
guard:
  kind: manual
  ref: "generate a model importing NPDevContract/packs/identity/pack.json for real Postgres, build, boot -- currently fails Flyway migration with a syntax error at V1__npdev_schema_realization.sql's UserRolePermission unique-constraint guard"
  asserts: the identity pack's UserRolePermission composite-unique guard is valid, executable Postgres DDL
  provenRed: true
correction: |
  2026-08-14 (horizontal fix pass): root-caused. The bug is NOT in SchemaRealizationEmitter.java as
  originally guessed -- that file only builds the raw `ALTER TABLE ... ADD CONSTRAINT ...
  UNIQUE (...)`/`FOREIGN KEY (...)` text, deliberately WITHOUT a trailing semicolon, at all six of
  its addConstraintIfMissing() call sites (appendAdditiveColumns' bond FK,
  appendBusinessTableConstraints' connectable-anchor unique AND its LIFT-UNIQUE-P2 compound-unique,
  appendExplicitIndexes' indexes:[]-declared unique, and appendBondConstraints'/
  appendJunctionTableShapes' two FK sites) -- every one of the six relies on
  `engine.dialect().guardedConstraintDdl(...)` to add the terminator, exactly the way H2Dialect,
  MySqlDialect and SqlServerDialect's own guardedConstraintDdl methods each do
  (`ddlStatement.endsWith(";") ? ddlStatement : ddlStatement + ";"`, or MySQL's `.strip()`
  variant). **Only PostgresDialect.guardedConstraintDdl
  (NPDevKernel/kernel/src/main/java/com/npdev/kernel/storage/sql/PostgresDialect.java, the method
  starting at line 292) was missing that one line.** Confirmed by git archaeology: the pre-STOR-5
  addConstraintIfMissing (SchemaRealizationEmitter.java, before commit 2ed5c3ae) had exactly one
  shared normalization line
  (`addConstraintSql.endsWith(";") ? addConstraintSql : addConstraintSql + ";"`) feeding BOTH the
  H2 and the Postgres DO $$ arms. STOR-5 ("feat(storage): introduce SqlDialect and route all 41
  dialect-bound sites", 2026-08-08) split that one method into four per-dialect methods and
  correctly re-added the line to H2Dialect/MySqlDialect/SqlServerDialect, but dropped it from
  PostgresDialect -- the DO $$ block's `%s` placeholder was wired straight to the unmodified
  `ddlStatement` parameter.

  **This makes the bug wider than the ledger's original framing.** It is not narrowly "3+-column
  composite uniques" -- the PL/pgSQL `IF ... THEN <stmt> END IF;` block requires a semicolon
  terminator on ANY statement inside it regardless of column count or constraint kind (UNIQUE or
  FOREIGN KEY), and none of the six emitter call sites supply one. The identity pack's 3-column
  UserRolePermission unique was simply the specific case the PK-2 two-engine proof happened to hit
  first; a 1- or 2-column unique constraint, or any bond's FK constraint added via the
  additive-migration path, reads as equally broken by this same code trace -- unconfirmed by a
  fresh real-Postgres boot (deferred per this session's batch-verification plan), but not something
  the original ledger text above should be read as having ruled out.

  Also explains why no existing test caught it:
  `PostgresDialectGoldenSqlTest.guardedConstraintDdlIsUnchanged` (NPDevKernel) passes an input
  ddlStatement that ALREADY carries a trailing semicolon, so it never exercised the normalization
  path; a sibling H2-only test, `guardedDdlTerminatesTheStatement`, checks H2's auto-termination
  but had no Postgres counterpart. `DialectConformanceTierATest.guardedConstraintDdl`
  (parameterized across all four dialects) passes a semicolon-less input but only asserts
  `guarded.contains(ddl)`, which is true whether or not a semicolon follows.

resolution: |
  Fixed (2026-08-14, horizontal fix pass) -- status stays OPEN, see below for why.

  Added the same `ddlStatement.endsWith(";") ? ddlStatement : ddlStatement + ";"` normalization to
  PostgresDialect.guardedConstraintDdl, matching H2Dialect/MySqlDialect/SqlServerDialect exactly --
  zero behavior change for any caller that already supplied a semicolon (none of
  PostgresDialectGoldenSqlTest's existing assertions moved), and it now semicolon-terminates a bare
  statement the same way H2/MySQL/SQL Server already did.

  Test coverage added (DB-free, Tier A / golden-SQL style, no real database): a new
  `postgresGuardedDdlTerminatesTheStatement` test in PostgresDialectGoldenSqlTest, symmetric with
  the existing H2 one, closing exactly the coverage gap noted above. Ran narrowly (not the full
  suite): `./gradlew.bat -p NPDevKernel --no-daemon :kernel:test --tests
  "com.npdev.kernel.storage.sql.PostgresDialectGoldenSqlTest" --tests
  "com.npdev.kernel.storage.sql.DialectConformanceTierATest"` -- BUILD SUCCESSFUL, the new test
  plus all 125 DialectConformanceTierATest cases and every existing PostgresDialectGoldenSqlTest
  case passed (0 failures, 0 errors).

  Files changed (absolute):
    D:\WorkSpace\NPDev\NPDev_General\NPDevKernel\kernel\src\main\java\com\npdev\kernel\storage\sql\PostgresDialect.java
    D:\WorkSpace\NPDev\NPDev_General\NPDevKernel\kernel\src\test\java\com\npdev\kernel\storage\sql\PostgresDialectGoldenSqlTest.java

  **2026-08-14 (closeout batch-verification pass): the deferred live-Postgres proof now run for
  real.** Regenerated `NPDevSamples/superuser-admin-console` with `db.definition.json`'s `database.
  engine` set to `Postgres` (temporarily, for this proof only -- the sample's checked-in definition
  stays `H2Local`), confirmed the emitted `V1__npdev_schema_realization.sql` now carries the exact
  `DO $$ ... END $$;` guard block this item describes for `identity_v1_user_role_permissions`'
  composite unique (`tenant_id, user_role_id, permission`), semicolon present after the `ALTER
  TABLE` line. Ran the app's real `integrationTest` suite (`-Dspring.profiles.active=test,postgres`,
  `AbstractScenarioIntegrationTest`'s `@Testcontainers`-managed real Postgres instance, not H2) --
  BUILD SUCCESSFUL, 40/40 tests green, meaning Flyway actually executed this exact DO $$ block
  against a real Postgres server as part of every one of those 40 test classes' context boot.
  This is a stronger proof than the guard's own literal "generate, build, boot" ask (an
  `@SpringBootTest` context boot IS a real boot, and 40 independent contexts each re-ran the full
  migration). Confirmed this genuinely exercises the fixed code path, not a false negative: an
  identical run against the SAME app generated with the H2Local engine (this sample's normal,
  checked-in configuration) also passed 40/40 -- but inspection showed H2Local's schema SQL uses a
  completely different, dialect-specific `DROP CONSTRAINT IF EXISTS` + `ADD CONSTRAINT` shape with
  no `DO $$` block at all (H2's own `guardedConstraintDdl`, a different code path from Postgres'),
  so that first run, while genuinely green, would NOT have exercised `PostgresDialect
  .guardedConstraintDdl` at all -- confirming why the Postgres-engine regeneration above was
  necessary rather than assuming the profile swap alone was sufficient.
