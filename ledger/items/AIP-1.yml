id: AIP-1
title: One AI catalogue (providers, models, profiles, bindings) as the single source of truth (AI providers plan, Phase 1)
type: FEATURE
severity: MEDIUM
status: DONE
opened: 2026-10-22
closed: 2026-10-22
source: >-
  AI providers unification plan, revision 2 (2026-10-22), NPDev_General__OutsideRepo/AI_PROVIDERS_UNIFICATION_PLAN_2026-10-22.md (outside the repo), built on the AI contact-point inventory AI_CONTACT_POINTS_2026-10-22.md in the same folder. Finding F5.
surface: cli/providers
detail: |
  Endpoints, models and prices are repeated in several places (npdev providers' catalogue,
  build-review-pack.py VENDOR_PROFILES, the tester, the Java external-ai-http factories).
  1.1 schemas/ai/ai-config.schema.json with four sections: providers (id, name, kind, protocol, baseUrl,
  keyEnvVar, authStyle, needsKey, appVendor, signupUrl), models, profiles, bindings.
  1.2 restructure the shipped catalogue into those sections (per-model prices and effort levels;
  default profiles fast/deep/offline). 1.3 layering: a per-machine ai.json ("mine") adds or overrides any
  shipped field, or disables an entry (D6: per machine, no export/import). 1.3b npdev ai detect probes
  local LLM servers (Ollama, LM Studio, llama.cpp, vLLM, Jan) on loopback and adds the picked models.
  1.4 the review script and the tester read the catalogue. 1.5 twin-pair rule: Java vendor profiles
  match the catalogue.
resolution: >-
  Done when VENDOR_PROFILES is gone from build-review-pack.py, the schema validates both the shipped
  catalogue and ai.json, and breaking either side of the Java/catalogue pair fails
  check-twin-pair-consistency.py.
files:
  - schemas/ai/ai-config.schema.json
  - NPDevCli/ai-providers.json
  - NPDevCli/npdev_ai_config.py
  - NPDevCli/npdev_ai.py
  - NPDevCli/npdev_ai_discovery.py
  - scripts/quality/twin-pair-registry.json
verification: UNIT_TESTED
guard:
  kind: test
  ref: NPDevCli/tests/test_ai_config.py#test_the_review_pack_keeps_no_private_vendor_table
  asserts: >-
    scripts/external-review/build-review-pack.py no longer defines VENDOR_PROFILES and reads its vendors through
    npdev_ai_config
  provenRed: true
note: >-
  2026-10-22: all steps landed -- 1.1/1.2/1.3/1.3a/1.3d/1.3f in c205b1d0 (schema, catalogue v1, overlay,
  effort table, npdev ai CLI), 1.3e in 4571e89a, 1.3b/1.3c in f3bc9d66 (detect, models refresh), 1.4 in
  d07d3210 (VENDOR_PROFILES deleted), 1.5 in aedd13da (twin-pair rule ai-protocols-three-place).
  2026-10-28 (QUAL-61): the guard used to cite the overlay-layering test, which is not what this item closed on. The
  first clause of the done-when now has its own test, red against build-review-pack.py as it was before d07d3210
  (VENDOR_PROFILES present, no npdev_ai_config import) and green now. The other two clauses are witnessed elsewhere
  and are NOT what this guard asserts: the schema validating the shipped catalogue and itself is
  test_ai_config.py#test_shipped_catalogue_validates_against_the_schema_and_itself, and the overlay is checked by
  test_write_refuses_an_inconsistent_overlay_and_leaves_the_file; the Java/catalogue pair is twin-pair rule
  ai-protocols-three-place, enforced by check-twin-pair-consistency.py in the aiKnowledge gate (not re-proven here).
