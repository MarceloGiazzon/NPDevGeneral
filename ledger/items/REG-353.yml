id: REG-353
title: >-
  A generated app is now translatable end to end, but five edges still show English in a Portuguese session: the language switch, model and pack labels, server text, the developer pages and the picker label
type: GAP
severity: LOW
status: DONE
opened: 2026-11-20
closed: 2026-11-24
source: >-
  REG-349 closing notes (owner decision 2026-11-20: a supported language is supported integrally, except field names, commands and docs).
surface: generator/business-ui, contract/dsl, runtimehost
files:
  - NPDevGenerator/generator/src/main/resources/npdev-templates/static-assets/business-ui/views/locale.js
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/emitters/BusinessUiEmitter.java
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/compiler/AutoPanelExpander.java
  - scripts/policy/ui-i18n-policy.json
detail: |
  1. The language switch (views/locale.js) only appears when the model declares labels in two or more languages (manifest.locales). An English-only
     app gives a visitor no way to choose Portuguese for the platform text, although the catalogue has it. Decide: always offer the shipped
     languages (en, pt), which makes labels from the model the only mixed part.
  2. Model labels (concept, field, enum option, panel, menu) and pack labels come from the model/pack: an English pack (sales, ratings) shows English
     names inside a Portuguese chrome. Packs need label maps per language (the label-map mechanism exists) or the relay briefing must ask for them.
  3. Text the server sends (validation messages, error bodies, batch row messages, kernel/flow messages) is English; the client only wraps it.
  4. Developer pages stay English by decision (info page, model surface, model authoring, operator console npdev-ui-*, widget catalog): the
     `englishOnlyDeveloperTools` list in scripts/policy/ui-i18n-policy.json. Revisit if the operator console is meant for non-developers.
  5. Typed pickers default to action.select baked at compile (AutoPanelExpander) like New/Save/Delete did; only the action buttons carry labelKey
     today. Dates and numbers follow the browser locale, not NPDevI18n.language().
  OWNER ROUND 2026-11-20 on a rebuilt SalesTest1 (model locale pt-BR, pack `sales`): every platform text was Portuguese (Novo, Atualizar, Limpar, Exportar CSV/Excel,
  Importar CSV, Imprimir, Tabela/Quadro/Calendário, Filtrar, Buscar, contém, Qualquer, Anterior/Próxima, Chave de API, Conectado como, Sair). English left: only the
  pack's labels (point 2) -- the page title and breadcrumb "Sales order", the column headers Order number / Customer / Order date / Status -- and, because the
  platform sentences embed the concept label, "Nada de Sales order para mostrar" and "Criar sales order". The sidebar says "Pedidos de Venda" (the model's own
  navigation label) while the page title says "Sales order": one concept, two names. No language dropdown was visible (point 1).
  OWNER DECISIONS 2026-11-21 ("follow your suggestions"): (1) always offer the language switch; (2) translate model and pack labels, with a label map per language in the pack; (3) translate the
  common server messages only; (4) the developer pages stay English (already in ui-i18n-policy `englishOnlyDeveloperTools`, nothing to build); (5) translate the picker label and make dates and
  numbers follow the app language.
  DONE 2026-11-21: (1) BusinessUiEmitter.declaredLocales adds the shipped languages (en, pt-BR) to whatever the model declares (an `en` or `pt` already declared is not duplicated), so
  the dropdown is offered for every app; BusinessUiEmitterLocaleManifestTest pins [en, pt-BR] for a model with no label maps and [en, es, pt-BR] for one declaring es + pt-BR; checked on a
  real generated app (SalesTest1 manifest: locales [en, pt-BR]). (5, dates and numbers) eleven places that used the browser's locale now pass NPDevI18n.language(): the business UI
  (last-saved, stale-list and print stamps), the shell clock and number cell, the bell, tasks, executions and declared-panel run times, and the dashboard number tile.
  DONE 2026-11-21 (2) labels per language in the packs, by the PLATFORM and not inside the pack: a pack stays English on disk (REG-347; a published version is immutable and every sample's
  npdev.lock pins its bytes), so NPDevContract/dsl/src/main/resources/pack-i18n/<packId>.pt-BR.json holds 228 Portuguese labels (the 13 built-in packs with labels, plus the owner's
  ratings) keyed by the label's path, with the English text recorded beside each; ModelSourceResolver.loadPackJson calls PackLabelTranslations.apply, which turns `label: "Sales order"`
  into `{default: "Sales order", "pt-BR": "Pedido de venda"}` only when the path is in the catalogue AND the English still matches (a reworded newer pack stays English), never
  overwrites an author's own map, and ignores flow-task labels (model.schema.json allows only plain text there). Because a concept's name was baked into the UI manifest as English
  `displayName`, the emitter now also writes `displayNameLocales` and the client picks one with NPDevI18n.pick. Guards: PackLabelTranslationsTest (every label of every built-in
  pack has a pt-BR entry), BusinessUiEmitterLocaleManifestTest. PROVED on SalesTest1 in a Portuguese headless browser: title "Pedido de venda", columns Organizacao/Tipo/Cidade/Pais/
  Limite de credito/Numero da fatura/Cliente/Valor/Vencimento/Preco unitario. A third-party pack with no catalogue stays English; adding a label to a built-in pack fails the test until
  its pt-BR entry is added.
  WAS STILL OPEN, done below: (3) the common server messages (validation, error bodies, batch row messages); (5, picker) the typed picker's default `Select` is baked at compile (AutoPanelExpander line ~736) and needs a
  labelKey like the action buttons got, plus the client reading it.
  DONE 2026-11-21 (5, picker) AutoPanelExpander no longer bakes the generation-time "Select" into a typed picker: it writes `label` only when the model declares one, and the workbench page
  already falls back to its own S('action.select') (NPDevI18n), so the button follows the visitor's language. (3) NPDevI18n.server(text) (npdev-i18n.js, shared by every page) translates the
  fourteen common field-validation sentences the runtime builds (required, unique single and compound, maxLength, minLength, below min, above max, ISO date, ISO datetime, enum, number, whole number,
  boolean, UUID) through the catalogue ids common.server.* (en + pt); a sentence it does not know -- every model author's invariant message, every flow message -- is shown as the server sent it, and
  English is never touched. Wired at the three places that show server text: the business UI's errorMessage and fieldViolations, and the experience client's fieldErrors. Guards: check-ui-i18n
  (each id is a literal NPDevI18n.t call whose English equals the catalogue), BusinessUiEmitter/Experience/PageI18n generator tests, AutoPanel dsl tests. Exercised in node against sample server
  sentences. NOT done: error bodies other than field validation (admin controllers' "... is required."), batch-row messages beyond what fieldViolations already carries, and the server's
  flow/kernel messages -- by the 2026-11-21 decision only the common ones are translated; and NOT yet seen in a browser (the i18n-pt browser routine was not run after these edits).
  OWNER DECISION 2026-11-24 ("all recommended"): run the i18n-pt browser routine, then close this item as done; the remaining server texts (admin-controller error bodies, batch rows beyond field validation,
  flow/kernel messages) stay English by the 2026-11-21 decision. ATTEMPT 2026-11-24: `run-shell-scenarios.ps1 -Only i18n-pt` did NOT reach a verdict -- its generator step failed with "the file is being used
  by another process: D:\WorkSpace\NPDev\Build\samples\dsl-conformance-max\App\shell-scenarios-boot.stdout.log", held by ANOTHER session's run-shell-scenarios.ps1 (pwsh pid 21640, started 00:21, still alive
  and writing 3 h later, its app on the same sample). Not a product failure. Re-run once that process is gone; then close this item.
  CLOSED 2026-11-24: that run was hung (13 h, vs ~9 min normally) and the owner told me to stop it; stopped (python digest pid 7016 + pwsh 21640 + the app below it, no survivors). Then
  `run-shell-scenarios.ps1 -Only i18n-pt` PASSED (231 s): i18n-pt-verify-routine green, 26 steps, 0 page/console/external errors; accessibility baseline unchanged
  (critical 0, serious 0, moderate 1, minor 0); "All five golden browser scenarios green against dsl-conformance-max". NOTE the harness lists 173 non-strict network failures, all same-origin
  (0 external): 102 are 401s (44 on /api/v1/runtime/metadata/ui/bundle, 8 on /api/queries/ShippedUnitsByWarehouseMonth, ...), 59 aborted, 10 are 404s (4 the documented-benign /theme.css, plus
  /api/admin/seeds, /api/workspace_menus, /api/queries/ShellCompanyName), 2 are 503 on /api/admin/promotion. NOT compared with an earlier run -- if a future reader wants to know whether the bundle
  401s are new, diff the evidence JSON at Build\samples\dsl-conformance-max\RunOutput\browser\i18n-pt-verify-routine.json against an older one. The remaining server texts stay English (decision above).
guard:
  kind: script
  ref: scripts/quality/check-ui-i18n.py
  asserts: >-
    every platform text a generated app shows is a catalogue id with English AND Portuguese (accented) and the English in the call equals the catalogue entry (aiKnowledge gate step 57); the
    i18n-pt-verify-routine browser routine (run-shell-scenarios.ps1 -Only i18n-pt) shows no English platform text in a Portuguese session -- it passed 2026-11-24, 26 steps, 0 errors.
  provenRed: false
done_when: >-
  The owner decides each of the five (translate, or declare English-only); the translated ones are covered by check-ui-i18n.py or the
  i18n-pt-verify-routine browser routine.
