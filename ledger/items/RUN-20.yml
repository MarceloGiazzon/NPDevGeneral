id: RUN-20
title: >-
  Zero soft-delete support -- concept.softDelete:true now flips deletedAt instead of a physical
  DELETE, every read excludes a deleted row, restore exists, and uniqueness applies among live rows
  only, with the additive migration reaching an ALREADY-migrated app
type: GAP
severity: HIGH
status: DONE
opened: 2026-08-19
closed: 2026-08-19
verification: VERIFIED_LIVE
source: >-
  Roadmap Collection 2026-08-18, R5.4 -- "Physical deletes are wrong for most business records...
  concept.softDelete:true adds a deletedAt column (the schema lifecycle must classify it on
  regeneration of an EXISTING app, not boot-once); delete flips the timestamp; queries/pickers/
  reference resolution exclude deleted rows; a restore action exists; uniqueness applies among live
  rows only." Blocked-by premise (R5.2/RUN-16, "unique-among-live-rows must reuse that pushdown's
  decided semantics") verified DONE before any change and reused exactly: existsUnique's trim/
  case-insensitive/cross-type/tenant-scoping semantics are untouched; this item only adds a
  "deleted_at IS NULL" predicate alongside them.
surface: dsl/schema, dsl/compiled-model, generator/schema-lifecycle, generator/emitters,
  generator/templates, kernel/storage-sql, kernel/ports, runtimehost/db, samples/dsl-conformance-max
