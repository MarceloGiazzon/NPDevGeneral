id: PACK-9
title: >-
  Packs can hardcode app roles; there is no declared-interface/binding mechanism
type: GAP
severity: MEDIUM
status: OPEN
opened: 2026-08-12
source: >-
  Full-repo maturity audit 2026-08-12 (PACK-ROADMAP.md card PK-3, "requires.roles" binding). A pack
  today has no way to declare "I need a role that means admin" and let the consuming app map its own
  role onto that interface -- it can only reference concrete role names, which collide or hardcode
  assumptions about the consuming app.
surface: dsl/pack-role-binding
detail: |
  See __OutsideRepo/strategy-2026-08-12/PACK-ROADMAP.md card PK-3's `requires` binding mechanism.
  Related open question from PK-1 (this session's Step 4): should `roles` be namespaced like other
  non-concept members, with `requires`/binding as how an app maps a pack role onto its own?
  Recommendation there was yes. MASTER-ROADMAP.md spine S3 (Step 8); not in this session's scope
  (Steps 1-4) beyond the namespacing groundwork PK-1 lays.

  2026-08-13 (Step 8, PK-3): the DECLARATION and PRESENCE/BINDING half of this is now done -- a
  pack can declare `requires: {roles, capabilities, network}`, the composing app declares what it
  satisfies via a root `provides` object, and composition refuses (naming the pack, its path, and
  the exact unbound key) when a requirement has no matching provides entry
  (PackRequiresBindingTest.java). What's still open, and is this item's real remaining scope: a
  pack's own INTERNAL code (role checks inside its own flows/rules/procedures) still only
  references concrete role names it hardcodes itself -- there is no mechanism yet for a pack to
  write "requires role admin" once and have that reference resolve, at the point of use, to
  WHATEVER concrete role name the composing app actually mapped onto "admin". Rewriting the
  pack's own internal references to consume the app's binding is the remaining work.

  2026-08-15 scoping pass (research only, no code changes -- deliberately NOT implemented in this
  session's 16-item batch-fix pass; this item needs a design conversation first, not a mechanical
  fix): role-name strings appear in two structurally different shapes, both needing to be covered --
  (1) STRUCTURED fields, a small closed set (`RoleAst`/`CompiledRole`, `PanelAst.visibility`'s
  existing `"role:ADMIN"` convention parsed by `TrustedSourceManifest.requiredRoleFromVisibility()`,
  `ActionMetadataAst.permissionHint`); (2) EXPRESSION-EMBEDDED, open-ended and NOT machine-
  enumerable -- `ConceptAccessAst.access.read/write` and any `visibleWhen`/`enabledWhen` condition
  can embed a role check as a free-form string in the model's expression language (evaluated against
  `$user.roles`), with no dedicated "role literal" token to find/rewrite mechanically. The generator
  derives a THIRD layer purely for codegen (`TrustedProcedure/TrustedPanel/.../ManifestEntry.
  requiredRole` in `NPDevGenerator/.../trustedsource/model/`), consumed at runtime by exactly one
  real sink: `ExecutionContext.hasRole(String)` (`NPDevKernel/kernel/.../ExecutionContext.java:100`).

  The EXISTING `requires.roles`/`provides.roles` mechanism
  (`ModelSourceResolver.checkPackRequirements`) is a pure PRESENCE check -- `Set<String>` exact-match,
  refusing when a required name has no matching provides entry. There is NO `Map<String,String>`
  (logical name -> app's concrete name) anywhere in the resolution/compiled pipeline; a real binding
  table would need to be built from scratch, not reused. No existing DSL syntax distinguishes a
  binding-reference from a literal role name anywhere in the codebase (the closest thing, `visibility`'s
  `"role:X"` prefix, still has `X` be a literal, no indirection) -- new syntax would need inventing for
  both the structured-field case and, separately, an expression-language function (e.g. a `role('admin')`
  call) for the free-form case. `PACK-ARCHITECTURE.md` P13 (`__OutsideRepo/strategy-2026-08-12/`)
  designed only the presence/refusal half already shipped; no design exists yet for the internal-
  rewrite half.

  **Verdict: NOT small/mechanical.** Two separable problems (rename a structured field vs. rewrite
  literals inside free-form expressions), no reusable binding table, no syntax convention to build on
  -- genuinely needs new DSL syntax plus a real design decision (how a pack author writes a binding
  reference, how the expression language distinguishes it from a literal, how/when the rewrite pass
  runs relative to compilation) before implementation, not a quick pass alongside smaller items.

  2026-08-19 (R8.9, this session): the DSL-side half landed and is solid --
  `PackRoleBindingRewriter`/`PackRoleBindingRewriteTest` (both in
  `NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/parser/`), the `role('name')` token, and
  `packs[].provides.roleBindings`, wired through `ModelSourceResolver`/`PackDependencyGraphWalker`/
  `PackValidation`, all pre-existed this session, committed and green. Attempted to close the item
  against its own done-when (two apps binding the same pack's `role('approver')`-equivalent token to
  different concrete roles, live-verified enforcing correctly in both; an unbound role refusing at
  composition naming the pack and key) and got a SPLIT result:

  - **Item 2 (unbound refusal) is fully proven, live, not just by unit test.** Ran the real generator
    (`:generator:run`, not a mocked resolver) against a throwaway model importing the `labeling` pack
    with NO `provides.roleBindings` declared. It failed at composition with exactly:
    `pack 'labeling' (via app -> labeling) references role('curator'), which the app does not declare
    in provides.roleBindings.'curator' -- composition refuses (an unbound role must fail at
    composition, never silently reach runtime)` -- names both the pack (`labeling`) and the unbound
    key (`curator`), plus the exact JSON path to fix. `PackRoleBindingRewriteTest.
    unboundRoleTokenRefusesNamingThePackAndTheKey` covers the same shape and still passes (verified
    this session, `:dsl:test --tests PackRoleBindingRewriteTest`, 3/3 green).

  - **Item 1 (two-app live enforcement) could NOT be proven, and the reason is outside this item's own
    surface.** Built two new fixture apps, `NPDevSamples/pack9-role-binding-a` and `-b` (repro-case,
    `scripts/quality/corpus-roles.json`), both composing the exact same `labeling` pack
    (`dsl-conformance-max`'s copy, byte-identical) but binding `curator` to a different concrete role
    each (`CURATOR_A` / `CURATOR_B`). Generated, built, and booted BOTH as real FinalApps (H2Local,
    apikey auth) on ports 8410/8411 -- `npdev-canary` was not used as the base since it is explicitly
    frozen ("do not add features"); these two are plain siblings of it instead. Confirmed the
    compile-time half worked perfectly first: each app's own `compiled-model.json` carries its own
    literal (`CURATOR_A` / `CURATOR_B`) exactly 4 times, zero leftover `role('curator')` tokens, in
    both apps.

    Then drove real HTTP traffic (`POST /api/concepts/labeling_labels`, the labeling pack's generated
    CRUD endpoint) with actors holding each concrete role. Every combination was DENIED on BOTH apps,
    including the case that should have succeeded (an actor holding the app's own correctly-bound
    role). Root cause, confirmed by reading `ConfiguredConceptGatewaySemanticPolicy.evaluateAccessRule`
    (`NPDevKernel/kernel/.../concepts/`) and reproduced live via stack trace
    (`ConceptGatewayAccessDeniedException: Concept Gateway denied row-level write access`): it calls
    `ComputedExpression.evaluateBoolean(expression, scope)` with an EMPTY `FunctionRegistry`, so the
    labeling pack's `access.write` rule -- `$user.roles.contains(role('curator'))`, the ONLY existing
    corpus usage of this idiom -- throws `"unknown function: contains"` on every evaluation, which the
    method's own catch block turns into a silent `false` (fail-closed by design, but here masking a
    permanently-broken rule rather than a genuinely denied actor). **This is a pre-existing NPDevKernel
    defect, not something the PACK-9 rewrite mechanism itself got wrong** -- filed as `REG-195` (new
    this session) rather than fixed here, per this item's explicit ownership boundary
    (`NPDevKernel/**` is out of scope; ownership belongs to a separate workstream this session).

  **Because item 1's own explicit non-negotiable ("enforces correctly at runtime in both,
  live-verified") could not be met** -- the only mechanism the DSL layer offers for a pack to express
  "does the actor hold role X" inside a row-level rule is currently inert at runtime, independent of
  which concrete role the app bound -- **PACK-9 stays OPEN.** Re-attempt once REG-195 is fixed (a real
  `FunctionRegistry` threaded into `ConfiguredConceptGatewaySemanticPolicy.evaluateAccessRule`,
  registering at least `contains`); the two fixture apps and their live-boot recipe above should
  reproduce cleanly against a fixed kernel with no DSL-side changes needed.
