id: REG-224
title: >-
  ProcedureStepAst's constructor wraps every Map<String,Object> step field (set/data/args/
  metadata/select) via Map.copyOf(...), which throws NullPointerException on any null VALUE --
  so a procedure step whose JSON legitimately declares an explicit null (e.g. patchConcept.set
  clearing a reference field back to null) crashes model parsing with an opaque
  "NullPointerException" diagnostic instead of a proper structural error, or working at all.
type: BUG
severity: MEDIUM
status: DONE
opened: 2026-09-19
closed: 2026-09-20
source: >-
  Found while building WMS-9 Z1-Z6 (Reset de Ambiente): a new ResetarAmbienteTransacionalProcedure
  needed to clear Romaneio.expedicaoId back to null (patchConcept.set: {"expedicaoId": null,
  "situacao": "Importado"}) before deleting the Expedicao it restrict-references. Full semantic
  validation (`:NPDevContract:dsl:validateModel`) failed with a bare "NullPointerException" and no
  stack trace (ModelValidatorMain.safeMessage falls back to the exception's simple class name when
  getMessage() is null/blank, which it was here). Bisected by removing just the null literal --
  the model then validated cleanly (0 errors) -- confirming the null value was the cause, not
  deleteConcept or the forEach/listConcepts shapes used alongside it (both already validate fine
  elsewhere in this exact procedure).
surface: >-
  NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/ast/ProcedureStepAst.java (compact constructor,
  lines 36-46): `set = set == null ? Map.of() : Map.copyOf(set);` -- and the identical pattern for
  `data` (line 37), `args` (38), `metadata` (42), `select` (45). `Map.copyOf`/`Map.ofEntries`
  (java.util.Map, JDK) explicitly forbid null keys AND null values, throwing NPE with no message
  via `Objects.requireNonNull` inside `ImmutableCollections.MapN`'s constructor -- this is a JDK
  contract these five fields never accounted for. Confirmed by temporarily adding
  `parseError.printStackTrace()` to ModelValidatorMain.parseCollectingDiagnostics's catch block
  (NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/cli/ModelValidatorMain.java:133, reverted
  immediately after capture -- no diagnostic code was left in place) and re-running validateModel:

    java.lang.NullPointerException
    	at java.base/java.util.Objects.requireNonNull(Objects.java:208)
    	at java.base/java.util.ImmutableCollections$MapN.<init>(ImmutableCollections.java:1186)
    	at java.base/java.util.Map.ofEntries(Map.java:1668)
    	at java.base/java.util.Map.copyOf(Map.java:1734)
    	at com.npdev.dsl.v1.ast.ProcedureStepAst.<init>(ProcedureStepAst.java:43)
    	at com.npdev.dsl.v1.parser.JsonModelParser.parseProcedureSteps(JsonModelParser.java:1271)
    	at com.npdev.dsl.v1.parser.JsonModelParser.parse(JsonModelParser.java:593)

  `JsonModelParser.parseObjectMap`/`parseJsonValue` (JsonModelParser.java:1983-1994, 3038-3071)
  themselves handle a JSON `null` correctly (produce a Java `null` value in the map, no crash) --
  the bug is entirely in `ProcedureStepAst`'s own immutability wrapping, one layer downstream.
detail: |
  FIXED 2026-09-20 (picked up from the WMS-9 sweep's own recorded backlog). Applied the fix this
  item's own prior session already identified, plus one thing that prior pass didn't check: the
  SAME Map.copyOf-rejects-null-values bug exists one layer downstream in CompiledProcedureStep
  (the compiled-model twin ModelCompiler and CompiledModelCanonicalJsonReader both build a step
  into), for the exact same four fields (data/metadata/set/select -- `args` on that record was
  already null-tolerant, fixed earlier for CompiledProcedureStepArgsOrderTest's unrelated ordering
  reason). Fixing only ProcedureStepAst would have let a null survive PARSING only to re-crash with
  the identical NPE at COMPILE time instead -- validateModel's own pipeline runs parse then compile,
  so the original repro would have kept failing even after a parser-only fix.

  FIX: both `ProcedureStepAst` (NPDevContract/dsl/.../ast/ProcedureStepAst.java) and
  `CompiledProcedureStep` (NPDevContract/dsl/.../compiled/CompiledProcedureStep.java) now copy
  data/metadata/set/select via `Collections.unmodifiableMap(new LinkedHashMap<>(x))` instead of
  `Map.copyOf(x)` -- the exact null-tolerant pattern `ConceptRecord.copyData` already used, and the
  same pattern `args` already used on both records for its own (different) ordering reason.
  `ModelValidatorMain.safeMessage`'s "bare NullPointerException with no context" diagnostic gap was
  NOT touched -- separable from this fix, left as a residual since the underlying NPE this bug
  produced is gone.

  TWIN-PAIR REGISTRY: registered a new rule, `procedure-step-null-tolerant-maps`, in
  scripts/quality/twin-pair-registry.json (kind `field-in-all-files`, token
  `npdev-procedure-step-null-tolerant-maps` in both files' comments) so a future edit that
  reverts one of the two records back to `Map.copyOf` without its twin fails
  `check-twin-pair-consistency.py` instead of silently reintroducing this exact bug one layer down.

  REGRESSION TESTS (3 new files, all green): `ProcedureStepAstNullSetValueTest` (ast-level,
  constructs the record directly with a null-valued `set` entry, asserts no throw + the null and
  immutability both survive); `CompiledProcedureStepNullSetValueTest` (same shape, compiled-model
  twin); `ProcedurePatchConceptNullSetValueTest` (end-to-end: a real model.json string with
  `patchConcept.set: {"expedicaoId": null}`, parsed then compiled via the exact
  `JsonModelParser`+`ModelCompiler` pair `:NPDevContract:dsl:validateModel` itself uses, asserting
  neither stage throws and the null value reaches the compiled step). Verified no regression: the
  existing `CompiledProcedureStepArgsOrderTest` (args iteration-order guarantees) and
  `ProcedurePatchConceptCreateIfMissingValidationTest` (REG-89) both still green, plus the full
  `:NPDevContract:dsl:test` suite.
guard:
  kind: script
  ref: >-
    NPDevContract/dsl: gradlew :NPDevContract:dsl:test --tests
    com.npdev.dsl.v1.ast.ProcedureStepAstNullSetValueTest --tests
    com.npdev.dsl.v1.compiled.CompiledProcedureStepNullSetValueTest --tests
    com.npdev.dsl.v1.validation.ProcedurePatchConceptNullSetValueTest, plus
    scripts/quality/check-twin-pair-consistency.py for the new registry rule.
  asserts: >-
    All 3 new test classes green (0 failures). check-twin-pair-consistency.py: "OK: all 38
    registered twin-pair rule(s) are consistent" (was 37, this fix added the 38th). No regression:
    CompiledProcedureStepArgsOrderTest, ProcedurePatchConceptCreateIfMissingValidationTest, and the
    canonical-JSON round-trip suite (CanonicalJsonIdempotenceTest,
    CanonicalJsonRoundTripCompletenessTest, CompiledModelCanonicalJsonReaderTest,
    CompiledModelCanonicalJsonTest) all still green after the CompiledProcedureStep change.
  provenRed: true
