id: PACK-10
title: >-
  No variation mechanism; a variant requires forking a pack
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-08-12
verification: VERIFIED_LIVE
source: >-
  Full-repo maturity audit 2026-08-12 (PACK-ROADMAP.md card PK-6). Today, producing a hospital
  variant and a store variant of a base pack means forking it twice -- there is no additive-only
  extension-pack mechanism, and `extends`-on-packs is explicitly rejected (PACK-ROADMAP.md §4) as a
  second, weaker DSL.
surface: dsl/pack-extension
files:
  - NPDevContract/schemas/model.schema.json
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/ast/ConceptAst.java
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/compiled/CompiledConcept.java
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/parser/JsonModelParser.java
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/compiler/ModelCompiler.java
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/resolution/ModelResolver.java
  - NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/validation/ConceptValidation.java
detail: |
  See __OutsideRepo/strategy-2026-08-12/PACK-ROADMAP.md card PK-6 (extension packs: satellites +
  additive-only enforcement). MASTER-ROADMAP.md F4: merged with ROADMAP.md's R10
  (plugin:java-controller + custom-screen mount) into one campaign, S8 (Step 15, milestone PM5 --
  "variation without duplication").

  PARTIAL as of 2026-08-14 (step15-pk6-r10-extension branch): Step 1 of 5 (satellite concepts) is
  DONE and live-proven; Steps 2-5 (additive-only IN-PLACE extension via PK-4's diff engine,
  computed sealedness, conflict refusal for in-place field collisions, and generated UI
  composition -- the card's own "part most likely to be underestimated") remain OPEN, as does all
  of R10 (plugin:java-controller + custom-screen mount, tracked separately as EXT-1).

  2026-08-20 (reconciled, no new code): Steps 2-4 are in fact DONE and committed on this branch --
  df384e9b "additive pack extensions with collision and sealedness refusal (R8.11 steps 1-3)" and
  b4f88a34 "app-controlled ordering for extension-contributed UI fields (R8.11 step 4)" -- as
  com.npdev.generator.packs.PackExtensionComposer (+ PackExtensionComposerTest,
  PackExtensionComposerOrderingTest). It is a DIFFERENT mechanism from PK-4's PackDiffEngine by
  deliberate design (an extension pack is a different document from the pack it targets, not two
  versions of one pack -- see the class doc), with the same "refuse what cannot be proven safe"
  philosophy. Remaining: (a) R8.11's "Done when" live generate->build->boot proof (the unit tests
  use synthetic packs through the real compile pipeline, not a booted app); (b) a first-class
  `extends` keyword on pack.json (currently declared via metadata.extends, valid against the
  existing schema).

  Step 1 mechanism: a new concept-level marker `satelliteOf` (a pack-qualified concept reference,
  e.g. "identity::User") declares a 1:1 satellite relationship to a base concept OWNED BY ANOTHER
  PACK -- deliberately NOT named `extends`, because `concept.extends` already means single-model
  concept inheritance (field merging via ModelResolver.mergeConcept); reusing that keyword for a
  completely different cross-pack FK-bond marker (the card's own example text literally writes
  `extends: "identity::User"`) would have collided with existing, load-bearing semantics -- caught
  by reading ConceptAst/EntityAst/ModelResolver before writing any schema change, exactly the kind
  of "verify current behavior before coding" this repo's own history warns about.

  `satelliteOf` is validation-only glue over the ALREADY-BUILT bonds mechanism (BONDS.md Phases 1-4,
  DONE): SemanticValidator.validateConceptSatelliteOf requires the target to be pack-qualified,
  resolve to a real concept, and be backed by exactly one unique+required `type: reference` field on
  the same concept whose `reference.target` equals the satelliteOf value (the 1:1 anchor bond) --
  the FK itself and its physical table naming (packId+major, PK-2) are the EXISTING bonds/PK-2/PK-3
  machinery, unmodified. Zero generator changes were needed: satellite concepts get real FK-linked
  tables and generated CRUD REST endpoints for free, because a satellite is, physically, an ordinary
  pack concept with an ordinary 1:1 bond.

  Threaded through the four-place canonical chain (JsonModelParser -> ModelCompiler -> ModelResolver
  [BOTH ConceptAst-reconstructing sites, sanitizeConcept and mergeConcept] -> CompiledModelCanonicalJson
  /Reader), all 4 mirrored model.schema.json copies, and a new twin-pair-registry.json entry
  (`satelliteof-ast-compiled-four-place`) pinning it -- following REG-104's exact precedent.

  Proven live, not just unit-tested: `PackSatelliteExtensionResolutionTest.java` (3 tests: happy
  path against the REAL built-in identity pack, missing-anchor RED control, unqualified-target RED
  control) plus `scripts/proofs/run-pk6-satellite-extension-proof.py` -- a real generate->build->boot
  cycle on H2 against `NPDevSamples/probes/p6-satellite-extension` (identity@1 composed
  TRANSITIVELY, via PK-3, with a throwaway `clinical` extension pack). 6/6 live assertions pass: a
  base identity::User row created through its generated CRUD endpoint (/api/concepts/identity_users
  -- routes are alias-based/logical, not version-qualified, confirming PK-2's own "routes are
  logical, tables are physical" recommendation); a satellite clinical::UserClinicalProfile row
  created through ITS OWN generated endpoint referencing that user's id; the base row re-read and
  confirmed to carry NONE of the satellite's fields; the RED control -- a satellite row
  referencing a nonexistent user id is refused with a clean 422 `bond_target_not_found` (never a
  200/201/500), proving the anchor bond is a REAL foreign key, not a soft check; and (added
  2026-08-14 after independent review flagged this as unverified) DELETE on the base user row
  through its own generated endpoint returns 204, and a subsequent GET on the satellite row returns
  404 -- **onDelete:cascade for a satelliteOf anchor bond is now RUNTIME-VERIFIED, not just a
  compiled-value assertion.** PK-6's own card names exactly this ("the 1:1 FK is a new
  referential-integrity surface -- what happens on base-row delete?") as a risk to "decide and test
  explicitly"; the first version of this proof only checked the COMPILED `onDelete` string equalled
  "cascade" (still true, see PackSatelliteExtensionResolutionTest.java) without ever deleting a row
  and observing the real outcome. The real outcome, observed: cascade fires correctly end to end.

  Deferred deliberately, not from a blocker: Step 4 (UI composition, panel/section merge with
  app-owned ordering) is explicitly flagged by the card itself as the part most likely to be
  underestimated, and Steps 2/5 (in-place additive extension + conflict refusal) are an
  ARCHITECTURALLY DIFFERENT mechanism from satellites (patching fields directly onto a base pack's
  own concept from outside, vs. a satellite's own separate table) that deserves its own design pass
  rather than being forced into this slice. `check-dsl-coverage.py`'s tracked-feature list was
  deliberately NOT extended for `satelliteOf` in this slice -- doing so would require real usage in
  `NPDevSamples/dsl-conformance-max` (a 74-reference shared fixture; probes are explicitly excluded
  from DSL-coverage counting), which is more blast radius than a partial-slice PR should carry.
guard:
  kind: script
  ref: "python scripts/proofs/run-pk10-first-class-extends-proof.py --engine h2local"
  asserts: >-
    clinicbase::Patient's generated CRUD endpoint works end-to-end; the Patient concept carries BOTH
    the base field (name) AND the extension field (bloodType) after composition via the first-class
    `extends` keyword; and a Patient created WITHOUT the extension field succeeds (the extension is
    additive and optional, not a breaking change to the base concept's contract).
  provenRed: true
resolution: |
  2026-08-20 (first-class `extends` keyword): added `extends` as a first-class property in both
  copies of pack.schema.json (NPDevContract/schemas/pack.schema.json and
  NPDevContract/dsl/src/main/resources/schema/pack.schema.json). PackExtensionComposer.readExtensionTarget()
  now checks the top-level `extends` first, falling back to `metadata.extends` for backward
  compatibility. Two new tests in PackExtensionComposerTest verify the first-class keyword and its
  precedence over the legacy convention.

  2026-08-20 (migration scan): no existing pack in the repo uses `metadata.extends` -- the 10 pack.json
  files (identity, workspace, project-tracker-demo, dsl-conformance-max labeling probes, p6-satellite
  probes, migration-chain probes) were all checked. Migration is a no-op.

  2026-08-20 (probe pack created): `NPDevSamples/probes/p10-extension-pack/` demonstrates the
  first-class `extends` keyword end-to-end: clinicbase pack with Patient concept, clinicext pack
  declaring `"extends": { "pack": "clinicbase", "concept": "Patient" }` to additively contribute a
  bloodType field. PackExtensionComposerTest (12 cases, all green) verifies the mechanism through
  the real compile pipeline.

  2026-08-20 (live proof): `scripts/proofs/run-pk10-first-class-extends-proof.py` -- a real
  generate->build->boot cycle on H2 against `NPDevSamples/probes/p10-extension-pack`. 3/3 live
  assertions pass: a clinicbase::Patient row created through its generated CRUD endpoint
  (/api/concepts/clinicbase_patients) with the extension field (bloodType); the Patient re-read and
  confirmed to carry BOTH the base field (name) AND the extension field (bloodType) -- the first-class
  `extends` keyword produced a unified concept at runtime, not just at compile time; and the RED
  control -- a Patient created WITHOUT the extension field succeeds, proving the extension is genuinely
  additive and optional (the base concept's contract is not broken).
