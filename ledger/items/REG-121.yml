id: REG-121
title: "Two release-evidence producers (run-ai-beta-gate.ps1, run-trusted-source-beta0-proof.ps1) still invoke `:generator:run` with the disabled `--migrationsDir` flag -- GeneratorMain.migrationsDisabled() rejects it outright (CONFIG_MIGRATIONS_DISABLED), so every ai-beta-gate scenario whose model reaches generation fails there, cascading into expanded-beta0-evidence, sample-matrix, docker-linux-parity, and final-regression-coverage-audit"
type: BUG
severity: MEDIUM
status: PARTIAL
opened: 2026-08-02
verification: VERIFIED_LIVE
surface: quality-gates/ai-beta-pipeline
source: |
  Found re-checking the betaRelease (T3) gate for Move 14 Phase E item E2 -- last verified at Move
  12 (red on 23 missing + stale evidence). Ran `run-beta-release-gate.ps1 -GenerateReports` (the
  full ~540s-935s evidence orchestration) for the first time since then: went from 25 precondition
  blockers + 5 real failures to 0 failed-no-evidence (every producer now runs and writes real
  evidence) + 19, then 21, real check failures -- a genuinely more honest state, per REG-3's own
  exit-code distinction (PRECONDITION-UNMET vs CHECK-FAILED).

  Fixed one real bug in the same session (REG-122): the AI-authoring contract normalizer was
  emitting `enforceInvariants`/`cap`/`op`/`out` (DSL 1.0 step syntax, retired when DSL 2.0 shipped)
  instead of `invariantCheck`/`capability`/`operation`/`output`, failing official JSON Schema
  validation for every golden scenario with a `flows[]` declaration. Fixing that took 22 of 28
  ai-beta-gate scenarios from failing at official-validation (a cheap, early, uninformative stage)
  to correctly reaching and failing (or passing) at their own DESIGNED stage -- 22 now pass entirely
  (negative scenarios correctly matching their expected failure stage), confirming the fix is
  correct, not just less-early-failing.

  The REMAINING failures (6 positive scenarios: base-ai-loop, custom-panel-unsupported,
  tenant-approval-portal, tenant-service-desk, tenant-workflow-ops, and one more) now correctly pass
  official-validation too, but fail at the NEXT stage, "generation", with:
    java.lang.IllegalArgumentException: CONFIG_MIGRATIONS_DISABLED: stateful upgrade management is
    not supported by this generation path (source: --migrationsDir). Use recreate-style generation
    and schema realization instead.
      at com.npdev.generator.GeneratorMain.migrationsDisabled(GeneratorMain.java:399)
  `run-ai-beta-gate.ps1` (and `run-trusted-source-beta0-proof.ps1`, which passed only because its
  own scenario apparently never reaches this code path) still construct the `:generator:run`
  invocation with `--migrationsDir <path>`, a generation mode `GeneratorMain` now refuses
  unconditionally -- every other invocation path in this repo (Build-NpdevApp.ps1,
  generate-sample-app.ps1, and everything this session's own work generated/built/booted, e.g.
  npdev-canary, dsl-conformance-max, WmsOffice) already uses the current "recreate-style generation
  + schema realization" contract instead. This is the SAME "one place updated, its twin not
  mirrored" class Move 14 Phase E item E1 (U2) just built a permanent gate for -- not yet added as
  a registry rule there because the correct twin-pair locations (which exact flags the current
  generation contract expects) were not fully mapped in this investigation.

  docker-linux-parity's own failure is this SAME root cause, one layer down: its `docker-run-ai-beta-gate`
  command literally runs `run-ai-beta-gate.ps1` inside the Linux container (Docker build/version
  both passed cleanly -- real Docker infrastructure works), so it fails identically.
  final-regression-coverage-audit's failure is a downstream reflection of doc-entrypoint-validation's
  (a separate, unrelated finding -- see REG-122) and ai-beta-gate's own failed status, not an
  independent third root cause.
files:
  - scripts/quality/run-ai-beta-gate.ps1
  - scripts/quality/run-trusted-source-beta0-proof.ps1
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/GeneratorMain.java
detail: |
  Not fixed here, deliberately -- per this Move's own explicit instruction for E2 ("Run it, then
  either regenerate the missing evidence or name each report that cannot be generated and why...
  Prohibited: removing a report from the required list, extending the staleness window, or
  allowlisting. A red gate honestly reported is the correct outcome"). Understanding and updating
  run-ai-beta-gate.ps1's generator invocation to the current recreate-style/schema-realization
  contract is a real, separate, bounded fix, but the AI-beta pipeline is a widely-depended-on shared
  producer (feeds ai-beta-gate, expanded-beta0-evidence, sample-matrix, docker-linux-parity, and
  final-regression-coverage-audit all at once) and deserves its own dedicated verification pass
  (regenerate the ~10 minute evidence orchestration again after the change, confirm all 6 positive
  scenarios now reach boot/smoke, confirm no negative scenario's expected-failure-stage shifted)
  rather than a rushed same-session patch on top of an already very long session.

  Recommended next step for whoever picks this up: read Build-NpdevApp.ps1's or
  generate-sample-app.ps1's own `:generator:run` invocation (both already migrated) to find the
  exact replacement flag set for `--migrationsDir`, apply it to both listed scripts, then add a new
  rule to scripts/quality/twin-pair-registry.json (E1's mirror-rule gate) tracking "the generator's
  currently-supported CLI flags" against every script that invokes `:generator:run` directly, so a
  FUTURE generator CLI contract change cannot silently strand one of these evidence producers again.

resolution: |
  DONE (Move 15 Phase C item C1, 2026-08-03) for run-ai-beta-gate.ps1, VERIFIED but only partially
  live-provable for run-trusted-source-beta0-proof.ps1 -- both stated honestly below, per this item's
  own "run to completion or retired with a stated reason" instruction.

  The fix, both scripts: `--migrationsDir <dir>` replaced with `--dbDefinitionPath <file>`, exactly
  the flag generate-sample-app.ps1's own (already-migrated) invocation uses. Since GeneratorMain
  requires `--dbDefinitionPath` to point at a REAL file (not just a directory that used to hold
  migrations), each script now synthesizes one at generation time (Write-GeneratedDbDefinition /
  Write-GeneratedRuntimeDbDefinition) -- content mirrors NPDevSamples/npdev-canary/Input/db.definition.json
  verbatim (H2Local engine, KeepExistingIfCompatible, not model-specific).

  run-ai-beta-gate.ps1 -- LIVE RED->GREEN, verified against the real generator, not a fixture. Ran the
  script in isolation against 3 of the 6 previously-generation-blocked scenarios:
    - base-ai-loop: FULL green -- generation -> deterministic-generation -> build -> boot -> health ->
      smoke, all passed, zero failures.
    - custom-panel-unsupported: FULL green, same full stage sequence.
    - tenant-workflow-ops: generation now reaches PAST CONFIG_MIGRATIONS_DISABLED cleanly (confirmed:
      the DB-definition/schema-fingerprint log lines print, no migrations-disabled error anywhere) but
      then fails at a SEPARATE, pre-existing defect unrelated to this fix -- the scenario's own
      ai-model.json declares a tenancy.tenantIdField that collides with the platform's reserved
      tenant_id column. Filed as REG-124 (OPEN), not fixed here (out of this item's own scope).
  One self-inflicted bug found and fixed during this verification: the FIRST attempt gave the
  determinism check's "repeat" generation a different synthesized databaseName than the primary run,
  which made schema-realization-manifest.json's embedded db-definition source path (and, before that,
  application-npdev-db.properties) legitimately differ between the two runs -- a false non-determinism
  signal caused by the test harness, not the generator. Fixed by having the repeat run reuse the exact
  same db.definition.json file (not a second, differently-located copy) as the primary run.

  T3 confirmation (Move 15 Phase C close, 2026-08-03): ran `run-beta-release-gate.ps1 -GenerateReports`
  (the full ~9-15 minute evidence orchestration this item's own scenario feeds) against the fix.
  Result: 13 stages passed, 5 failed-with-evidence, 0 failed-no-evidence -- CHECK-FAILED, not
  PRECONDITION-UNMET, per REG-3's own exit-code distinction (this is the honest, "more work
  surfaced" outcome, not a regression). `ai-beta-gate` itself moved from "every scenario blocked at
  the same early generation stage" (this item's original finding) to a real, further-along, per-
  scenario failure set -- the remaining 17 release-gate blockers (ai-beta-gate,
  expanded-schema-validation, normalization, generated-app-build/-boot, rest/ui-panel/procedure/
  workflow/tenant-isolation/auth-role-smoke, final-regression-coverage-audit, sample-matrix,
  docker-linux-parity) are downstream reflections of ai-beta-gate's own remaining per-scenario gaps
  (REG-124's class -- a scenario reaching generation successfully but then failing ITS OWN, separate,
  pre-existing defect), exactly the cascade this item's own "source" section already predicted for
  docker-linux-parity and final-regression-coverage-audit. None are new regressions: they were either
  already-failing-for-a-different-reason before this fix (docker-linux-parity ran the SAME
  run-ai-beta-gate.ps1 inside its container) or newly reachable now that generation stops blocking
  every scenario at the same early stage. Out of this item's own scope to chase further.

  run-trusted-source-beta0-proof.ps1 -- the fix is applied and PowerShell-parse-clean, and mirrors the
  exact pattern just proven live above, but this producer's own generated-runtime code path
  (Invoke-GeneratedRuntimeIntegrationProof, the function this fix touches) could not be exercised
  end-to-end: it is only ever reached for a scenario carrying a trusted-source-manifest.json, and the
  one such scenario in the repo (golden-ai-scenarios/deferred/trusted-source/create-users-panel-procedure)
  lives under `deferred/` and fails an EARLIER, unrelated check ("Source SHA-256 does not match
  manifest") before ever reaching generation -- confirmed by forcing -ScenarioRoot to point directly at
  it (the script's DEFAULT invocation never even discovers this scenario, since `golden-ai-scenarios`
  Get-ChildItem is non-recursive and the manifest sits two levels deeper, which is exactly why this
  item's own "source" section already observed this producer "passed only because its own scenario
  apparently never reaches this code path"). Fixing that SHA-256 mismatch is a separate, pre-existing,
  deliberately-deferred-scope issue, not something this item introduced or should absorb.

  Not done: the recommended twin-pair-registry.json rule (tracking the generator's current CLI flags
  against every direct `:generator:run` caller) -- a real, still-valuable prevention measure, left for
  whoever next touches this family (Move 15's own Phase D adds the analogous prevention control for a
  DIFFERENT defect family, stale-blocker citations, not this one).

