id: REG-301
title: >-
  Four DSL keywords are accepted, compiled and carried in canonical JSON but never read at runtime:
  query.permissionRequirements, query.tracePolicy, aggregateCollection.via, flowStep.data
type: GAP
severity: MEDIUM
status: OPEN
opened: 2026-10-23
closed: null
source: >-
  ENF-1 witness work (scripts/policy/dsl-behavior-witness.json allowlist) and a read-only scout on 2026-10-23, spot-checked
  by grep the same day.
surface: NPDevContract/dsl (QueryAst, CompiledQuery, CompiledAggregateCollection, JsonModelParser flow steps); NPDevGenerator RuntimeApiEmitter, TrustedActionRegistryTemplate; NPDevRuntimeHost/runtimehost-core AggregateRuntime
detail: |
  Each keyword is in model.schema.json, parsed by JsonModelParser, compiled by ModelCompiler and written by the canonical
  JSON writer, so a model declaring it validates cleanly -- and then nothing downstream reads it:
  - query.permissionRequirements: RuntimeApiEmitter reads permissionRequirements of procedures and panel actions only; a
    query declaring one is served to any caller its other rules admit. This one is security-relevant.
  - query.tracePolicy: only procedure descriptors carry tracePolicy into TrustedActionRegistryTemplate; a query's is
    dropped.
  - aggregateCollection.via: CompiledAggregateCollection keeps it, but no runtime class (AggregateRuntime, PublicReadService,
    OpenApiDocumentBuilder, AgentToolCatalog) calls via(); referenced ownership through a named field is unimplemented.
  - flowStep.data: JsonModelParser parses it into the flow step AST; no flow-step reader was found in the kernel or the
    generator (procedure-step data is a different keyword and IS read by ProcedureRunner).
resolution: >-
  Done when each keyword is either enforced at runtime with a behaviour probe witnessing it (and removed from the
  dsl-behavior-witness allowlist, frozenCount lowered) or refused by validation with a migrate codemod and BREAKING.md
  entry. query.permissionRequirements first: a caller lacking the requirement must be refused.
note: >-
  2026-10-23: opened. Not yet fixed; no fixture query declares permissionRequirements or tracePolicy and no collection
  declares via, so the dsl-conformance-max corpus must gain a declaring example before a probe can witness it.
