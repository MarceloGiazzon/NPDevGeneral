id: REG-301
title: >-
  Four DSL keywords are accepted, compiled and carried in canonical JSON but never read at runtime:
  query.permissionRequirements, query.tracePolicy, aggregateCollection.via, flowStep.data
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-10-23
closed: 2026-10-24
source: >-
  ENF-1 witness work (scripts/policy/dsl-behavior-witness.json allowlist) and a read-only scout on 2026-10-23, spot-checked
  by grep the same day.
surface: NPDevContract/dsl (QueryAst, CompiledQuery, CompiledAggregateCollection, JsonModelParser flow steps); NPDevGenerator RuntimeApiEmitter, TrustedActionRegistryTemplate; NPDevRuntimeHost/runtimehost-core AggregateRuntime
detail: |
  Each keyword is in model.schema.json, parsed by JsonModelParser, compiled by ModelCompiler and written by the canonical
  JSON writer, so a model declaring it validates cleanly -- and then nothing downstream reads it:
  - query.permissionRequirements: RuntimeApiEmitter reads permissionRequirements of procedures and panel actions only; a
    query declaring one is served to any caller its other rules admit. This one is security-relevant.
  - query.tracePolicy: only procedure descriptors carry tracePolicy into TrustedActionRegistryTemplate; a query's is
    dropped.
  - aggregateCollection.via: CompiledAggregateCollection keeps it, but no runtime class (AggregateRuntime, PublicReadService,
    OpenApiDocumentBuilder, AgentToolCatalog) calls via(); referenced ownership through a named field is unimplemented.
  - flowStep.data: JsonModelParser parses it into the flow step AST; no flow-step reader was found in the kernel or the
    generator (procedure-step data is a different keyword and IS read by ProcedureRunner).
resolution: >-
  Done when each keyword is either enforced at runtime with a behaviour probe witnessing it (and removed from the
  dsl-behavior-witness allowlist, frozenCount lowered) or refused by validation with a migrate codemod and BREAKING.md
  entry. query.permissionRequirements first: a caller lacking the requirement must be refused.
guard:
  kind: script
  ref: scripts/quality/run-behavior-probes.ps1 -Only 20-flow
  asserts: >-
    fl-emit-event-data-mapping-shapes-the-payload: the emitted WidgetOrderLineShaped payload carries exactly the
    flowStep.data-mapped keys (widgetOrderId, sku) and none of the input's own keys; the retired keywords are refused by
    ContractSurfaceSupportTest (rejectsRetiredQueryAndProcedureTracePolicy, rejectsRetiredAggregateCollectionVia)
  provenRed: false
note: >-
  2026-10-23: opened. Not yet fixed; no fixture query declares permissionRequirements or tracePolicy and no collection
  declares via, so the dsl-conformance-max corpus must gain a declaring example before a probe can witness it.
  2026-10-23 (later): query.permissionRequirements ENFORCED on GET /api/queries/{name} and on a kind:list document that
  names a query -- both call runtimehost-core NamedQueryPermissions (every requirement must be held, via the app's
  PermissionEvaluator; fail-closed with no evaluator), and RuntimeApiEmitter now grants each query requirement to the
  super-user in the permission manifest (before, nobody held it). Witnessed by probe 30
  query-permission-requirements-refuse-a-caller-lacking-them on fixture query AuditedCatalogEntries; allowlist 48 -> 47.
  2026-10-23 (later still): the two side doors are closed too -- a panel dataSource naming a guarded query
  (PanelRuntime.loadDataSource) and an aggregate lookup field's query (AggregateRuntime.runLookupQueries, on load and
  commit) now refuse with ConceptGatewayAccessDeniedException PERMISSION_DENIED (403 via ConceptAccessDeniedAdvice);
  PanelRuntimeQueryPermissionTest and AggregateRuntimeLookupQueryPermissionTest. Procedure runQuery steps are
  deliberately left under the procedure's own permissionRequirements. query.permissionRequirements is DONE; remaining
  keywords: query.tracePolicy, aggregateCollection.via, flowStep.data.
  2026-10-23 (owner decision: refuse both): query.tracePolicy AND procedure.tracePolicy RETIRED -- removed from all 4
  model.schema.json mirrors, the AST/compiled records and the canonical JSON; `npdev migrate dsl-2` strips them (run
  on 5 in-repo models + 13 AppGen definitions); BREAKING.md entry; ContractSurfaceSupportTest
  rejectsRetiredQueryAndProcedureTracePolicy. Witness allowlist 47 -> 46. actionDescriptor.tracePolicy is live and kept.
  Found on the way, NOT changed: procedureStep.trace and procedureStep.audit are also parsed but read by nothing at
  runtime (procedureStep is not a tracked witness family). Remaining keywords: aggregateCollection.via, flowStep.data.
  2026-10-23 (Windows session): flowStep.data was mis-filed -- it IS read: JsonModelParser parses it into the step's
  eventDataRefs and KernelRunner.buildEventPayload builds an emitEvent/scheduleEvent payload key by key from it.
  Witness added: fixture flow ShapeWidgetOrderLineEvent + event WidgetOrderLineShaped, probe
  fl-emit-event-data-mapping-shapes-the-payload in 20-flow.json (mapped keys present, input keys absent).
  aggregateCollection.via (owner decision: retire): removed from the 4 schema mirrors, AggregateCollectionAst,
  CompiledAggregateCollection and the canonical JSON; `npdev migrate dsl-2` strips it at any depth (no model in repo
  or AppGen declared it); BREAKING.md; ContractSurfaceSupportTest.rejectsRetiredAggregateCollectionVia. Allowlist
  46 -> 44. :NPDevContract:dsl:test green. NOT YET RUN: the new probe against a booted app (run-behavior-probes.ps1
  -Only 20-flow -- -Only matches FILE names, not probe ids) and the RuntimeHost aggregate tests after restaging jars.
  Close this item when both are green.
  2026-10-24: both green, item DONE. RuntimeHost libs restaged; runtimehost-core test (AggregateRuntimeBalanceTest,
  AggregateRuntimeReplaceChildrenTest) and run-runtimehost-gate.ps1 (assembled-app suite incl. AggregateRuntimeTest)
  pass. The first probe run FAILED, and not because flowStep.data is dead: the probe read the payload back from
  GET /api/events/by-name, which redacts every payload by design (DefaultEventRedactionPolicy: empty for a caller
  without DEBUG/ADMIN, allowlisted debug keys only otherwise). The execute response's emittedEvents carries the real
  payload -- exactly widgetOrderId + sku + _meta. Probe rewritten to assert there (fixed input values) and to check
  only persistence by GET /api/events/{id}; 20-flow 28/28 green.
