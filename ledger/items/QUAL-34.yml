detail: |
  Three separate, unrelated deferrals, filed as one item because they share the same root cause
  (prose recorded the decision, nothing machine-readable tracks it). All three now have something
  real to cite, per the item's own done-when:

  - D5 -- RESOLVED by W2.3 (2026-08-25 remediation plan): six previously code-less boundaries
    (B2, B4, B5, B8, B9, B10) gained real `enforcingDiagnosticCodes`, bringing HITTABLE boundaries
    with a machine-readable `boundaryId` from 1 of 11 to 10 of 11 (B19 was reclassified
    POSTURAL->HITTABLE with its own new code in the same wave, so it was never in the "missing"
    count to begin with). The one remaining gap (B28's hot-swap endpoint) is itself the DECISION
    being tracked, not an oversight.

  - D6 -- all three named checks now carry REAL recorded results, not `never-run`/stale prose:
    - `betaRelease`: run for real 2026-08-25, recorded `failed` with 54 concrete blockers (mostly
      stale `beta-release-evidence`, plus 4 genuine sub-report failures) -- see
      scripts/reports/out/beta-release-gate-report.json.
    - `scale-proof-ladder`: today's nightly CI run (R9 Nightly Scale Ladder, run 32809054980)
      succeeded on all 5 rungs including 260/520 -- the SCALE-2 JVM-255-param ceiling that had kept
      this ladder red every night since its first run is confirmed fixed. Recorded `passed`.
    - `beta-release-evidence`: the full ~9-minute (in practice ~2.6 HOURS this run, dominated by one
      producer -- see below), 18-producer orchestration was run for real for the first time.
      10 producers passed, 7 reported `failed-with-evidence` (real findings, not orchestration
      crashes) -- json-schema-validator-tests, direct-evidence-hardening-tests,
      controlled-command-runner-tests, ai-rest-smoke-verifier-tests, ai-contract-normalizer-tests,
      runtime-null-context-tests, runtimehost-staged-jar-preflight, report-schema-validation,
      ai-command-policy, docker-linux-parity all passed; ai-schema-validation, doc-entrypoint-
      validation, trusted-source-beta0-proof, ai-beta-gate, expanded-beta0-evidence, sample-matrix,
      final-regression-coverage-audit all failed with real evidence. `sample-matrix` alone took
      8927s (~2.5h) to fail -- the reason this run appeared stalled for hours; not a hang, a
      genuinely slow producer. Recorded `failed`. None of these 7 failures fixed here -- each is
      real signal now available where before there was none, and belongs to its own investigation
      (the largest, ai-beta-gate's, already has one: ledger/items/QUAL-42.yml).

  - D7 -- APPLIED: `npdev migrate label-locales --write` ran against `AppGen/apps` (34 model.json
    files widened to per-locale label form, tagged 'en', confirmed idempotent by re-running the
    dry-run afterward: 0 changed). SELF-CAUGHT REGRESSION during W3's later verification: the
    migration broke byte-identical consistency between two AppGen apps
    (simple-user-registry-h2local-freshdb, simple-user-registry-inmemory, both migrated since they
    are under AppGen/apps) and their engine-variant-family sibling `NPDevSamples/simple-user-registry`
    (NOT under AppGen/apps, so outside D7's original scope) -- caught live by
    check-engine-variant-families.py failing a full run-ai-knowledge-gate.ps1 pass. Fixed by applying
    the identical migration to the NPDevSamples sibling too, restoring family byte-identity
    (verified: check-engine-variant-families.py reports all 3 declared families clean).

  Two new follow-up items filed for real, ongoing gaps this closure surfaced rather than left as
  prose (matching this item's own "cite a tracked id" standard): QUAL-40 (kernel coverage floor has
  no plan to raise it) and QUAL-41 (RuntimeHost coverage floor, same shape). QUAL-42 tracks
  D6's largest real finding (AI Beta Gate's own two concrete failure causes) in detail.

  Done when: each of the three either has a tracked follow-up id it can cite (D5's boundary rows
  gain `boundaryId`s or an id tracks the gap; D6's stale cadence checks are run or their own item
  tracks why not; D7 gets its own migration item or is explicitly WONTFIX'd), and CONTRIBUTING.md's
  "cite a tracked id" rule has something real to point at for all three. MET for all three.
