source: >-
  BOUNDARY_LIFT_PLAN_2026-09-02.md work package 2.2 (B1), wave 2, depends on 2.1's shared diff
  surface. B1's own gap: a drop-plus-add pair that is really a rename could only be found by an
  operator reading the boot log's all-or-nothing same-type heuristic, then hand-editing model.json --
