id: REG-230
title: >-
  OAuthGoogleControllerTest fails 4 of 8 tests deterministically in runtimehost-core's own standalone
  `test` task -- every failure traces back to a genuine "identity_pack_schema_error" (an
  IdentityPackSchemaException) raised while running the OAuth signup/link/state-replay flow against
  the test's own H2 fixture, despite the fixture's identity_users table matching the compiled model's
  resolved table name exactly.
type: BUG
severity: MEDIUM
status: DONE
opened: 2026-09-20
closed: 2026-09-20
source: >-
  Found while verifying REG-228 (JWT signing-keypair auto-provisioning) did not regress
  runtimehost-core: ran the module's own standalone `test` task (196 tests) after adding
  JwtKeyPairEnvironmentPostProcessor, saw "196 tests completed, 4 failed, 3 skipped", all 4 in
  OAuthGoogleControllerTest. Isolated with `git stash` (removing every REG-228 file, including the
  new class, its test, and the spring.factories registration) and re-ran just
  OAuthGoogleControllerTest alone -- same 4 failures, same messages, confirming this is pre-existing
  and unrelated to REG-228's change. (Consistent with that: OAuthGoogleControllerTest is a plain
  hermetic unit test with no @SpringBootTest/@ExtendWith(SpringExtension) -- it never boots a real
  ApplicationContext, so an EnvironmentPostProcessor registered via spring.factories can never run
  during it at all.)
surface: >-
  NPDevRuntimeHost/runtimehost-core/src/main/java/com/finalexec/auth/OAuthGoogleAuthService.java
  (not yet read in detail -- the actual query/table access that raises IdentityPackSchemaException
  is unidentified). The test's own fixture
  (NPDevRuntimeHost/runtimehost-core/src/test/java/com/finalexec/auth/OAuthGoogleControllerTest.java,
  setUp()) creates identity_users/identity_external_identity by hand and declares a matching
  identityModel() (identity::User -> "identity_users", identity::ExternalIdentity ->
  "identity_external_identity") -- ruling out the REG-226 class of bug (a hardcoded table-name
  literal diverging from the resolved name), since here they already agree.
detail: |
  FIXED 2026-09-20. Root cause: a STALE TEST FIXTURE, not a production defect -- Google OAuth
  login/signup/link was never actually broken in any real generated app.

  `OAuthGoogleControllerTest.setUp()`'s hand-rolled `CREATE TABLE identity_external_identity (id,
  user_id, provider, provider_subject, linked_at, ...)` was missing a `tenant_id` column.
  `OAuthGoogleAuthService.insertLink` (production code) inserts `tenant_id` into that table --
  correctly: `SchemaRealizationEmitter` injects a `tenant_id VARCHAR(120) NOT NULL DEFAULT
  'default'` column into EVERY generated business table unconditionally (platform-reserved column,
  same treatment as `version` -- see SchemaRealizationEmitterTenantColumnTest, and
  NPDevContract/packs/identity/pack.json's ExternalIdentity concept, which likewise omits
  tenant_id from its own `fields[]` because it's injected separately, exactly like `identity_users`
  does for the same reason). The sibling test in the same package/directory,
  OAuthGoogleAuthServiceTest.java, already had the correct DDL (`tenant_id VARCHAR(120)` present)
  -- only OAuthGoogleControllerTest's own copy had drifted.

  So H2 genuinely threw "column tenant_id not found" (SQLState 42122) on the INSERT inside
  `insertLink`/`signUp` -- a REAL schema mismatch, just one confined to this one test's own
  hand-authored fixture, not to any real generated schema. `SqlSchemaErrors.isSchemaMismatch`
  correctly classified it as SQLState-42, `findUserByEmailOrUsername`/`findUserByUsername` (which
  ALSO run in some of these flows) correctly escalate a schema mismatch to
  IdentityPackSchemaException-shaped failure per their REG-39 posture, and the controller correctly
  reported `identity_pack_schema_error` -- every layer behaved exactly as designed; the fixture was
  just wrong. Traced by reading OAuthGoogleAuthService.java's full callback path (signInExistingUser/
  signUp/linkToAuthenticatedUser/insertLink/findUserBy*), finding `findUserByEmailOrUsername` and
  `findUserByUsername` are the two methods that escalate a schema-mismatch SQLException into an
  unchecked IdentityPackSchemaException-class failure (not `IdentityPackSchemaException` itself,
  which turned out to live only in PasswordResetController/ChangePasswordController/
  ControlPanelTenantUsersController -- the OAuth path uses its own equivalent
  "identity_pack_schema_error" string constant, thrown from 3 separate call sites in
  OAuthGoogleAuthService.java), then diffing the test's own CREATE TABLE against the pack's
  ExternalIdentity concept and the schema-realization contract test to find the missing column.

  FIX: added `tenant_id VARCHAR(120)` to OAuthGoogleControllerTest.setUp()'s
  `identity_external_identity` DDL, matching OAuthGoogleAuthServiceTest's already-correct copy and
  the real generator output.

  BLAST RADIUS (resolved, was never live): confined entirely to this one test file's own fixture.
  No production code changed. Google OAuth login/signup/link was never actually broken for any real
  generated app.
guard:
  kind: local
  ref: >-
    NPDevRuntimeHost\runtimehost-core\gradlew.bat --project-dir NPDevRuntimeHost\runtimehost-core
    --no-daemon --console=plain test --tests "com.finalexec.auth.OAuthGoogleControllerTest"
    (note: gradlew.bat does not cd into its own directory -- pass --project-dir explicitly or the
    ROOT NPDev_General settings.gradle, which wires only :NPDevContract:dsl, silently "wins" and
    reports a misleading "no tests found").
  asserts: >-
    RED, reproduced twice 2026-09-20, both with and without the REG-228 changeset present
    (git-stash isolated): "8 tests completed, 4 failed" both times, identical failure
    messages/line numbers. GREEN after the fix, same day: the same targeted command (digest-logs
    20260920T183427Z) is BUILD SUCCESSFUL, all 8 OAuthGoogleControllerTest tests pass; the full
    runtimehost-core `test` task (digest-logs 20260920T183506Z) is also BUILD SUCCESSFUL --
    tallied all 36 TEST-*.xml files directly (not just the console summary): 196 tests, 0
    failures, 0 errors, 3 skipped (pre-existing, unrelated).
  provenRed: true
  provenGreen: true
