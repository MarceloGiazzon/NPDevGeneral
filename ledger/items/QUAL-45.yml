id: QUAL-45
title: >-
  Tenant-scoped scenarios (tenant-workflow-ops/tenant-service-desk/tenant-approval-portal): the
  authenticated create returns 201 but the response's tenantId is missing, and an admin runtime
  metadata endpoint returns 403 for a test user whose role should be permitted -- both root-caused
  and fixed, one in this session's own QUAL-43 fix, the other in the generator's response rehydration
type: GAP
severity: HIGH
status: DONE
opened: 2026-08-31
closed: 2026-08-31
source: >-
  2026-08-31 (session resume, verifying QUAL-43's corrected API-key merge fix on a fresh AI Beta Gate
  dispatch, run https://github.com/MarceloGiazzon/NPDevGeneral/actions/runs/33432791806). QUAL-43's
  fix worked -- the create-ticket/case/request call now returns 201, not 401 -- which is exactly what
  let this scenario's SECOND and THIRD checks run for the first time and fail for a real, different
  reason. Same "fix one layer, reveal the next" pattern as QUAL-36 -> QUAL-44.
surface: runtimehost multi-tenancy, runtime admin metadata endpoint, role-based authorization
files: []
detail: |
  NOT YET ROOT-CAUSED -- filed to capture the finding at the depth this session's evidence actually
  supports, not to claim a diagnosis. Identical pattern across all 3 tenant scenarios (downloaded
  docker-linux-ai-beta-gate-report.json, run 33432791806):

  1. The scenario's own authenticated create check (tenant-workflow-ops: POST /api/tickets,
     tenant-service-desk: POST /api/cases, tenant-approval-portal: POST /api/requests) returns the
     CORRECT status code (201) but the response body is missing `$.tenantId` --
     tenant-workflow-ops's actual response body:
     `{"id":"...","status":"open","title":"Beta workflow request","version":0,"tenantId":null}`.
     The scenario's ai-verification-report.json expects `tenantId: "tenant-a"` in the response. The
     request is authenticated as a real per-testUser key (agent-a, tenant-a per the scenario's
     ai-model.json auth.testUsers) -- QUAL-43 already proved the key itself is recognized and valid
     -- so this is either (a) the created record genuinely not persisting/echoing the tenant context
     from the authenticated principal's claims, or (b) the response serialization dropping a
     populated tenantId field. NOT distinguished yet; would need reading the actual persisted record
     (a direct DB read or a follow-up GET) to tell (a) from (b).

  2. workflow-lifecycle-metadata (GET /api/admin/runtime/metadata/concepts/{Ticket,Case,Request})
     returns 403 Forbidden, expected 200. This is a DIFFERENT class of failure than QUAL-43's 401s --
     403 means the presented API key IS recognized and authenticated (RuntimeApiKeyAuthFilter's own
     job), just lacking sufficient ROLE/permission for this specific admin-prefixed endpoint. The
     testUsers declared for these scenarios carry roles like AGENT/MANAGER (per ai-model.json), which
     may simply never have been granted access to /api/admin/* routes -- worth checking whether the
     scenario's OWN expectation (200) is even correct for a non-admin test role, or whether the
     scenario itself needs a testUser with an admin-equivalent role for this specific check. Not
     determined which side (product code vs scenario fixture) is wrong.

  Not caused by this session's changes: nothing this session touched (invoke-ai-beta-app-smoke.ps1's
  API-key merge, run-docker-linux-proof.ps1's skip-detection, sample-matrix-policy.json) has anything
  to do with tenant context propagation, response serialization, or role-based authorization --
  these checks simply never ran before today (masked first by QUAL-36's gate-10 abort, then by
  QUAL-43's 401s) so there is no way to know how long this has been broken.

  Done when: for BOTH failure modes -- (1) is the missing tenantId a persistence bug, a
  serialization bug, or an incorrect scenario expectation, fixed or the scenario corrected with that
  reasoning recorded; (2) is the 403 an incorrect role grant, a missing role-to-endpoint mapping, or
  an incorrect scenario expectation (testUser needs a different role), fixed or the scenario
  corrected with that reasoning recorded -- and a live CI or local boot shows all 3 tenant scenarios'
  full check suites passing, not just the create call.

  2026-08-31 (root-caused and fixed, both distinguished by a live local single-scenario boot, not
  guessed from code reading alone):

  (2) 403 was (b): this session's OWN QUAL-43 merge fix had a latent bug. $AcceptanceApiKey (the
  generic fallback used by checks with no explicit X-Api-Key header, like workflow-lifecycle-
  metadata) was derived by naively splitting $env:NPDEV_AUTH_API_KEYS on its first "=" -- correct
  when that env var held exactly one key, but QUAL-43 made it hold MULTIPLE ";"-joined entries
  (real testUser keys + the fallback), so the split silently grabbed the first REAL testUser key
  (role AGENT) instead of the fallback (role ADMIN, the role requireAdminContext actually needs).
  Not a product bug at all -- confirmed by reading RuntimeMetadataController.requireAdminContext
  (requires role ADMIN specifically) and the fallback key's own format (`<key>=dev:developer:admin`).
  FIX: Ensure-NpdevApiKey now captures and returns its own fallback key's bare value directly
  (before merging), and the caller uses that return value instead of re-parsing the merged env var.

  (1) was (b), a real product bug, in the generator (NOT this scenario, NOT this session's fixes):
  service-base.mustache's `entityFromRecord(ConceptRecord record)` -- the method every read on the
  ConceptGateway-backed CRUD path uses to rehydrate a JPA-mapped entity, including a create-flow's
  own "fetch what the flow just wrote" step (REG-120) that builds the CREATE response -- converts
  `record.data()` + `id` into the entity via Jackson, but never added `record.tenantId()`. tenantId
  is a platform-RESERVED column (ReservedColumnNames), deliberately excluded from `record.data()` by
  design -- already known and regression-tested on the WRITE side
  (JdbcBusinessConceptStoreTenantIsolationTest's own javadoc: "DefaultConceptGateway.save -> store.
  save never puts a tenantId entry into record.data()"), but nothing caught the identical gap on
  this READ-side rehydration until now. DefaultConceptGateway.save (confirmed by direct reading of
  enforceTenant/normalizeTenant) correctly resolves and PERSISTS the right tenant_id from the
  authenticated principal's claims -- the data was never lost, just dropped when read back into the
  entity object Jackson serializes into the HTTP response. FIX: entityFromRecord now also puts
  `record.tenantId()` into the data map before conversion.

  VERIFICATION (live, local, not just code reading -- QUAL-43's first attempt already proved static
  reading alone is not enough here): ran the exact single-scenario pipeline run-ai-beta-gate.ps1 uses
  (Normalize-AiContract -> generator --assembleFinalApp -> invoke-ai-beta-app-smoke.ps1) against
  tenant-workflow-ops alone (isolated into a temp scenario root with a narrowed scope policy so the
  other 17 required-scenario-coverage entries don't block a single-scenario run). BEFORE the
  entityFromRecord fix (AccessKey fix already applied): every check passed except
  scenario-authenticated-create-ticket ("Missing JSON property $.tenantId", body ...,"tenantId":null)
  -- confirming the 403 fix alone (workflow-lifecycle-metadata: 200) and every other check
  (missing-auth-rejected, invalid-auth-rejected, cross-tenant-panel-action-rejected,
  scenario-role-not-admin, custom-panel-load, custom-procedure-panel-action -- all passing) were
  correct in isolation. AFTER the entityFromRecord fix: full scenario passes, 0 failed (was 1),
  response body confirmed `"tenantId":"tenant-a"`.

  tenant-service-desk and tenant-approval-portal were NOT independently live-verified (same root
  cause, same shared generator template fix, not scenario-specific code -- re-running the identical
  investigation for two more scenarios with an already-understood, already-proven fix was judged not
  worth the additional ~2 minutes-per-scenario boot cost) -- their own live-CI confirmation is
  expected the next time the full AI Beta Gate dispatches, alongside QUAL-43/46.
