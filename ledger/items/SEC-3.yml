  non-goal stated above) is the honest follow-up if/when process isolation is meant to protect
  ACTUAL traffic, not just prove the mechanism against a real plugin class.

  RESOLVED 2026-09-01 (Track A of the SEC-3/QUAL-49/QUAL-50 implementation plan) -- the Linux cgroup
  fork closes SEC-3's own stated problem (memory/CPU unbounded, no real containment).

  Live-fired the Linux path for the first time, inside a real Linux kernel (Docker Desktop's WSL2
  backend, `--privileged --cgroupns=private`), not just implemented and reviewed on Windows. Step
  A2's evidence (`scripts/quality/linux-plugin-proof/probe-cgroup-environment.sh`, run before and
  after cgroup delegation) CONFIRMED the predicted defect for real:
  `canCreateChildWithMemoryMax=false` even after delegation (the shipped code created the plugin
  cgroup as a CHILD of the JVM's own cgroup, which cgroup v2's "no internal process" rule forbids
  from ever exposing a `memory.max`), while `canCreateSiblingWithMemoryMax=true` proved a sibling
  placement works. Fixed `PluginLinuxCgroupResourceLimiter` (`delegatingParent()` /
  `delegatesRequiredControllers()`: walk up from the JVM's own cgroup to the nearest ancestor that
  already delegates `memory`+`cpu`, create the plugin cgroup there instead) -- the only production
  code change, matching the plan's own framing.

  The FIRST live-fire run of the strengthened test (raised ceiling 128MB -> 256MB, plus a new
  well-behaved-child test so a raw kill cannot be mistaken for a JVM-failed-to-boot false pass) still
  failed: the runaway-memory test timed out at 30s with NO kill at all. Root-caused live, not
  guessed: 2GiB of swap was available inside the container (`memory.swap.max` defaults to
  unlimited), so the kernel reclaimed the memory hog's pages to swap instead of invoking the OOM
  killer once `memory.max` was reached -- `memory.max` alone is not a hard ceiling without also
  capping swap. Fixed by writing `memory.swap.max=0` alongside `memory.max` in the raw-cgroup path,
  and applying the same fix (`MemorySwapMax=0` alongside `MemoryMax=`) to the `systemd-run` path for
  architectural consistency, even though the container proof does not exercise that branch (no
  systemd session in a minimal container). This second defect was NOT anticipated by the design doc,
  the original implementation, or this plan's own reference draft -- found only by actually running
  the proof and refusing to accept "it happened to complete" without checking the failure mode.

