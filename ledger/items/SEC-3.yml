  content, since stat() reports its size as 0, so the drain loop never ran at all until rewritten to
  check content instead of size; probe-cgroup-environment.sh; run-live-fire.sh, a plain script file
  rather than a second nested `bash -lc` string, avoiding double shell-quoting); the runnable test
  relocated+strengthened into runtimehost-core's own independently-buildable test source set
