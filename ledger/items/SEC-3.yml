detail: |
  2026-09-01 (Model B step 1, owner-authorized -- design doc's two headline decisions, IPC frame shape
  and the new callback allowlist, taken as confirmed by the owner's go-ahead to implement): landed the
  design doc's recommended first increment (section 6, step 1) -- "prototype the protocol and the
  callback allowlist alone, in-process, no process spawning yet." NOT a Model B ship and does NOT close
  this item: SEC-3's own done-when bar requires live-fired regression tests against a REAL isolated
  child process, which this step deliberately defers (that's step 2 of the doc's sequencing).

  What actually landed:
  - PluginIpcFrame (kernel-shaped: InvokeFrame/CallbackFrame/ResponseFrame, ResponseFrame nesting a
    ResponseError mirroring CapabilityError's code/message/kind/details) + PluginIpcFrameCodec
    (length-prefixed JSON frames over any InputStream/OutputStream pair -- Jackson, already a hard
    dependency, no new library) -- exactly the wire shape docs/architecture/PLUGIN_PROCESS_ISOLATION_DESIGN.md
    section 1 specifies.
  - PluginIpcJsonSafeValues: runtime enforcement of the "JSON-safe subset" args/value/contextState must
    be restricted to (primitives/String/Map<String,?>/List<?>/Jackson-roundtrippable records) -- the
    doc flagged this as a real, visible contract change for plugin authors; this is the runtime half
    (a generation-time PluginJavaSourcePolicy AST check is still open work, not attempted here).
  - PluginExecutionPolicyEvaluator.evaluateCallback + RuntimePluginAdapterRegistry.findDeclaredCallback:
    the NEW callback allowlist gate the doc calls "the actual security-critical piece" -- a plugin may
    only call back into capabilities its OWN manifest entry declares, checked against the SAME
    RegisteredAdapterContribution binding that authorized the original invoke, reusing
    PluginExecutionPolicyDecision rather than a second policy model. Deliberately NOT a reuse of
    TrustedSourceBytecodeInspector (that inspector has no visibility into a running child's IPC calls).
  - PluginIpcHostSession / PluginIpcChildRuntime / PluginIpcCallbackClient: the host and child
    orchestration primitives, parameterized on plain InputStream/OutputStream so step 2 (real child
    process) only has to swap PipedInputStream/PipedOutputStream for Process.getInputStream()/
    getOutputStream() -- no protocol rework.
  - Live-fired proof (PluginIpcRoundTripTest, entirely in-process over piped streams standing in for a
    child's stdin/stdout, host and child on separate threads): a real auditLog CapabilityAdapter
    handler calls back into its own declared capability, the host validates + executes it for real
    against an in-memory AuditLogStore, and the result round-trips end to end; a second test proves a
    plugin whose declared job is auditLog attempting a callback into an undeclared capability
    (persistence.dropAll) is DENIED (PLUGIN_CALLBACK_NOT_DECLARED) and never reaches the real store.
    Plus PluginIpcFrameCodecTest (wire-format round trips) and PluginExecutionPolicyEvaluatorCallbackTest
    (allowlist decision matrix: declared/undeclared/globally-denied/missing-capability).
  - Verified: full run-runtimehost-gate.ps1 green (assembled sample app's own test suite +
    runtimehost-core's own test task, both BUILD SUCCESSFUL) after one real fix mid-verification --
    the gate's still-enforced (non-advisory) "services-classified" check flagged the new
    JsonSafeValues class as unclassified against NPDevRuntimeHost's runtime-supported-controllers.json
    service patterns (the other 5 new classes auto-matched the existing "Plugin*" pattern); renamed it
    to PluginIpcJsonSafeValues to fit that established convention rather than editing the governance
    manifest. The namespace/package-convergence findings the same gate run also showed for the new
    `pluginipc` package are pre-existing-class advisory checks (GATE-OBS-1a, formally retired), not a
    new failure this step introduced.

  Next step per the design doc's own sequencing (section 6, step 2): a real ProcessBuilder child, one
  per invoke, no pool yet, wiring the REAL stdin/stdout pipes this step's classes already accept --
  that is what would start closing this item's actual done-when bar (System.exit / forbidden-operation
  live-fire tests against a process the host does not die with).

  MODEL A SHIPPED 2026-08-27 (ledger remediation session) -- "plugins are trusted; prevent accidents
  and casual misuse" is now REAL, with the boundary's honest residue recorded as B30:

  Mechanism (one shared denylist, two enforcement ends):
  - The constant-pool inspector moved out of the generator into NPDevKernel
    (com.npdev.kernel.security.TrustedSourceBytecodeInspector) so the generator AND the running app
    consume identical rule sets. Hardened from the original generator-only scanner for production-gate
    duty: the pool is now RESOLVED (Class/Methodref/Fieldref entries spliced back into owner /
    owner.name -- javac stores java/lang/System and exit as SEPARATE constants, so a raw-Utf8 scan
    can never see System.exit, which the original endsWith("exit") heuristic papered over at the cost
    of false positives on any constant ending in "exit"); exact owners are boundary-checked
    (RuntimeException is not refused by the java/lang/Runtime rule); java/util/concurrent/ is no
    longer banned wholesale -- only the executor/scheduler/async classes that can detach work that
    outlives the timeout (AtomicLong, which the shipped auditLog capability uses, stays legal);
    System.* methods match only the full owner.name reference. Known documented conservatism:
    java/lang/invoke/ is a banned prefix, so ANY lambda (lowered through LambdaMetafactory) is
    refused, and a plugin may not detach work at all (Thread + the curated concurrent set).
  - GENERATION gate: PluginJavaSourcePolicy (source-AST twin; its rule sets are DERIVED at class
    load from the kernel constants so the two can never drift) runs in RuntimeApiEmitter's
    emitJavaSourceFiles / emitJavaControllerFiles choke points and refuses emission of plugin source
    referencing the escapes, BEFORE anything is baked into an app.
  - BOOT gate: PluginBytecodeBootGate (NPDevRuntimeHost, a Spring bean) reads the generator-written
    per-app manifest npdev/plugin-bytecode/plugin-owned-classes.txt (npdev-plugin-bytecode-gate
    twin-pair token), inspects every listed class file's COMPILED bytecode plus its $-siblings
    (inner/anonymous classes are separate files a top-level listing cannot see), and refuses app
    start with BoundaryBootException carrying B30:plugin_bytecode_violation: (exit code 4 via
    FinalExecApplication; discoverable via `npdev why B30`). Registered B30: HITTABLE boundary,
    ledger/boundaries/B30.yml + docs/ACCEPTED_BOUNDARIES.md + accepted-boundaries.json.
  - The wall-clock timeout stays as defence-in-depth (unchanged).
  - Live-fire tests: 8 kernel inspector tests (System.exit / filesystem / socket / ProcessBuilder /
    detached-async refused; lambda refused; RuntimeException neighbour + AtomicLong accepted),
    12 PluginJavaSourcePolicyTest cases (same vectors at source level; clean auditLog-like and
    Spring-controller-like sources accepted), 5 PluginBytecodeBootGateTest cases (boot refusal for
    System.exit / socket / inner-class escape with the B30 code; clean passes; absent manifest
    no-ops).
  - Honest residual, now the B30 boundary statement: static analysis catches DIRECT references only.
    MEMORY/CPU remain unbounded -- a plugin can allocate freely or spin an uninterruptible loop
    inside its wall-clock timeout, and future.get(timeout) still cannot kill a running thread. A
    proxy class elsewhere on the app classpath that performs a forbidden capability on a plugin's
    behalf is outside a constant-pool scan's view. The docs (NPDEV_USER_MANUAL / feature guide,
    model.schema.json adapter description) now state: a plugin runs in-process with the
    application's full privileges; trust it like your own code.

  2026-08-28 (CI calibration, engine-support E8): the first push's engine-support run surfaced three
  real-corpus collisions, all fixed by tightening the gates' PRECISION rather than relaxing their
  coverage: (1) java/io/PrintStream (System.out/System.err console output) is now an explicit
  exemption from the java/io/ prefix ban -- a PrintStream instance can only come from System.out/err
  or by wrapping a banned stream class, whose own references are still caught; (2) the identifier
  "Class" is no longer banned wholesale, because Class<?> in generic TYPE positions erases to
  Object and compiles no java/lang/Class owner reference -- TRUE reflective loading is refused by a
  dedicated member-select rule (any static access on the Class type: Class.forName, newInstance,
  getDeclared*, fully-qualified java.lang.Class.* included); (3) java/lang/invoke/ is no longer a
  PREFIX rule -- javac lowers ordinary string concatenation ('+') to invokedynamic through
  java/lang/invoke/StringConcatFactory (and emits MethodHandles$Lookup/MethodType/CallSite as mere
  CLASS REFS), so only the AUTHOR-CONTROLLABLE exact classes (MethodHandle, MethodHandles,
  MethodHandles$Lookup, MethodType, VarHandle, CallSite, MethodHandleInfo, Mutable/VolatileCallSite,
  LambdaMetafactory) are banned, matched on MEMBER-reference owners (what the plugin actually
  invokes), never on class-ref-only appearances. Consequence for the shipped corpus: the lib-probe's
  compileOnlyProbe operation (a compileOnly runtime-absence measurement done BY REFLECTION) could
  not coexist with the admission gates -- a denylist cannot distinguish a benign measurement from a
  hostile reflective load -- so the half was REMOVED from the probe (capability, model flow,
  run-library-probe.py), with the reason recorded there and in the probe's manifest; E8's own point
  (a user capability CALLS an external library at runtime) survives via sign(). A non-plugin
  mechanism would be needed to restore the compileOnly runtime-absence measurement. LAMBDAS remain
  refused (documented SEC-3 conservatism, via the LambdaMetafactory member owner). ALSO fixed in the
  same push: npdev_cli.py emitted verification.html against final_app_out.parent/_ops while the
  generator writes the runbook INSIDE the app root (final_app_out/_ops) -- a pre-existing PR #134
  regression (engine-support red since 50315e0f) that the E15 and engine-probe jobs died on at
  Resolve-Path; now App/_ops.

  ORIGINAL FINDING (2026-08-25, kept as the record; superseded by Model A above for the accident/
  casual-misuse threat model):

  Read the engine class directly (not inferred from the test file's own aspirational comments).
  Handler invocation runs in-process, on a thread from a plain Executors.newCachedThreadPool(), via
  reflection. The ONLY containment mechanism that exists at all is a bounded future.get(timeoutMs) --
  proven real by 6 tests already in TimeBoundedPluginExecutionEngineTest (happy path, error wrapping,
  timeout, interrupt safety, overload resolution, policy denial). Every other vector the class's
  ORIGINAL name ("Sandboxed") implied it covered was wide open to any plugin handler running in the
  same JVM:
    - Filesystem: no restriction: a plugin can read/write anything the app process can.
    - Network: no restriction: a plugin can make arbitrary outbound connections.
    - Memory/CPU: no bound beyond the wall-clock timeout -- a plugin can allocate freely or spin a
      CPU-bound (non-blocking) loop that the timeout cannot interrupt (future.get(timeout) does not
      forcibly stop a running thread; cancel(true) only sets an interrupt flag a tight CPU loop with
      no interruption check will never observe).
    - System.exit: uncontained -- a plugin calling System.exit() kills the whole app process,
      including every other tenant's in-flight request.
    - Reflection: uncontained -- a plugin can use reflection to reach outside its intended surface
      (e.g. setAccessible on a private field of an unrelated class).

  Why this was not fixed in the same session that found it: SecurityManager-based containment is
  deprecated-for-removal (JEP 411, and gone entirely as of JDK 24) and was never the right target
  regardless of this platform's own JDK 17 pin. The plan's own recommendation -- OS-level process
  isolation (spawn a child JVM per plugin invocation, communicate over a narrow IPC protocol, apply
  platform-specific resource limits: Linux cgroups/namespaces, Windows Job Objects) -- is a real,
  substantial security feature: new IPC/serialization surface, per-OS resource-limiting code, restart/
  crash handling for a killed child, and its own dedicated test matrix. That is a different-sized
  piece of work than reviving a disabled unit test, and a half-built containment layer would be worse
  than the current honestly-absent one (false confidence that malicious code is contained when it is
  not) -- so it was deliberately NOT attempted inline here. maliciousPluginVectorsRemainContained
  stays @Disabled, with its reason updated to point at this item instead of the vague original text.

  2026-08-27 (Model A shipped, above): the static-analysis admission barrier converts the five
  original vectors into REFUSED-AT-ADMISSION for direct references (filesystem, network,
  System.exit, reflection, and detached work) -- a plugin that would have exercised them is refused
  at generation or boot before any of it can run. What the barrier does NOT change is memory/CPU
  inside a running (admitted) plugin, so the original done-when below remains the bar for Model B.

  Done when: for the REMAINING gap (memory/CPU; hostile-plugin containment): a real process-
  isolation (or equivalent) containment layer exists for at least the System.exit and filesystem/
  network vectors, with its own live-fired regression tests (a plugin that actually calls
  System.exit and does NOT take down the host process; a plugin that actually attempts a forbidden
  file/socket operation and is actually blocked) -- not a design document. Model A has already
  closed those vectors' DIRECT-REFERENCE form at admission; the "live-fired" phrasing of this bar
  now targets a plugin running against a REAL agent, i.e. the Model B process isolation.

  2026-08-31 (owner-requested scoping pass, NOT an implementation attempt -- the done-when above is
  explicit that a design document does not satisfy it; this is recorded so a future session that
  actually commits to Model B starts from open questions instead of a blank page):

  Model B is a bigger shape-change than "spawn a child JVM and run the plugin there." Today
  TimeBoundedPluginExecutionEngine invokes the plugin class DIRECTLY in-process via reflection, with
  direct in-JVM access to whatever the host wires it to (capability dispatch, persistence, the
  auditLog primitive). Moving execution to a separate process means the plugin can no longer call
  those directly -- every capability invocation becomes a cross-process round trip, which is new
  surface, not a relocation of the existing one. Open questions a real attempt has to answer, in
  roughly the order they gate each other:

  1. IPC shape for the CALLBACK direction (child -> host, e.g. "read this record" / "invoke this
     capability"), not just the outbound invoke (host -> child, "run this plugin with this input").
     This is the crux: a plugin today can call arbitrary capabilities as ordinary Java calls; Model B
     needs a serialization boundary for every one of those calls, plus a way to enforce the SAME
     admission-time denylist (TrustedSourceBytecodeInspector) against what the child is allowed to
     ask the host to do on its behalf, or the isolation is decorative.
  2. Process lifecycle: cold JVM start per invocation (measured elsewhere in this platform at
     several hundred ms) is likely too slow for the existing timeout budget
     (npdev.runtime.plugin-timeout-ms, default 1000ms, already observed to occasionally miss under
     load per Move 14 Phase D item D1 in invoke-ai-beta-app-smoke.ps1). A warm-pool-of-child-
     processes design avoids the cold-start cost but adds its own state: pool sizing, idle recycling,
     and what happens to in-flight pool members when the host itself is redeploying.
  3. Per-OS resource limiting is genuinely two implementations, not one: Linux cgroups/namespaces vs
     Windows Job Objects, both needing their own test matrix given this platform's dual-OS CI (H2/
     SQLServer on Windows dev machines and Windows CI runners, Postgres/MySQL/Docker gated to Linux
     CI per scripts/policy/local-test-profile.json). A design that only proves out on one OS is not
     done.
  4. Crash/violation handling: a killed-for-resource-violation or OOM child process must surface as
     an ordinary CAPABILITY_FAILED to the caller (matching today's timeout-failure shape), not crash
     the host app or leave the pool in a bad state. Needs its own test: a plugin that intentionally
     exhausts memory/CPU is killed and the HOST keeps serving other requests without degradation.
  5. Where the trust boundary actually sits after Model B: the plugin still runs as the SAME OS user
     as the host (no container/VM boundary proposed here, matching the platform's existing single-
     tenant-process deployment model) -- process isolation stops a runaway plugin from taking down
     the host or exhausting host memory/CPU unboundedly, but does not by itself add a NEW privilege
     boundary beyond what OS process separation already provides. Worth stating explicitly so Model
     B is not oversold the way "Sandboxed" (the class's original name, SEC-3's own opening context)
     already was once.

  Recommended first step for whoever picks this up: prototype #1 (the callback IPC shape) alone,
  against a single capability (e.g. auditLog, already the simplest real one in the shipped corpus),
  before touching process spawning or resource limits at all -- it is the piece every other decision
  depends on, and the one most likely to reveal that the "different-sized piece of work" framing
  above is, if anything, still an underestimate.

  2026-08-31/09-01 (owner-requested full design pass, NOT an implementation attempt -- same caveat as
  the scoping pass above: a design document does not satisfy this item's own done-when bar, which
  requires live-fired regression tests against a real isolated child process):
  docs/architecture/PLUGIN_PROCESS_ISOLATION_DESIGN.md answers all 5 open questions from the scoping
  pass with concrete proposed decisions (not just options), grounded in the actual current interfaces
  (TimeBoundedPluginExecutionEngine.execute/invokeHandler, CapabilityCall/CapabilityResult's exact
  shapes, PluginExecutionPolicyEvaluator's decision model): length-prefixed JSON frames over the
  child's stdin/stdout for both the outbound invoke and the child->host callback direction (with a
  NEW runtime callback-allowlist gate, explicitly NOT a reuse of TrustedSourceBytecodeInspector's
  static bytecode scan -- that inspector cannot see what a running child asks the host to do over an
  IPC channel that doesn't exist yet); a fixed-size warm pool of fungible (not per-plugin) worker
  processes to meet the existing timeout budget; Linux cgroups v2 (systemd-run --scope) vs Windows Job
  Objects (new JNA/JNI binding, called out as genuinely new dependency surface) for per-OS resource
  limits, with an explicit no-mechanism-available degrade-to-timeout-only posture; a crash-handling
  sequence that reuses the EXISTING CapabilityResult.failure/CAPABILITY_FAILED shape rather than
  inventing new caller-visible behavior; and an explicit, deliberately bounded trust-boundary
  statement for after Model B ships (contained against resource exhaustion and accidental host
  crashes, NOT against a deliberately hostile plugin AUTHOR -- same OS user, no container/VM
  boundary). Also proposes a 5-step implementation sequence (protocol-in-process prototype -> real
  child process, no pool -> warm pool -> per-OS limits -> docs update), matching the recommended-
  first-step framing above but broken down further now that the protocol shape itself is decided.
  Every decision in the doc is still a PROPOSAL needing a maintainer's confirmation before code is
  written against it -- most load-bearing: the IPC frame shape (S1) and the new callback allowlist
  (also S1), since a wrong call there is the one most expensive to unwind after §2-5 are built on it.

  2026-09-01 (Model B step 2 -- design doc section 6, step 2: "real child process, no pool, no resource
  limits"): swapped the step-1 prototype's piped streams for a REAL OS process boundary. Still does NOT
  close this item -- no pool (step 3) and no per-OS resource limiting (step 4) yet, so memory/CPU stays
  genuinely unbounded; what this step buys is that a plugin crashing or misbehaving now only takes down
  its OWN throwaway process, proven live-fired rather than asserted.

  What landed:
  - PluginIpcChildProcessMain: the real child-process entry point (`public static void main`), spawned
    by ProcessBuilder as a separate `java` process. Reads exactly one invoke frame over its own
    System.in/System.out (the pipes ProcessBuilder gives every child for free) via the SAME
    PluginIpcChildRuntime step 1 already built -- no protocol rework, exactly as step 1's javadoc
    predicted. Resolves the plugin handler class by reflection (Class.forName + a public
    (PluginIpcCallbackClient) constructor) since a Java lambda -- what the step-1 prototype used for its
    handlerFactory -- cannot cross a process boundary. NOT yet wired to real plugin-JAR classloading
    (RuntimePluginPackageRealizationService); that dynamic-loading question is explicitly step 3's
    problem (the design doc's warm-pool section is where "which plugin class to load travels in the
    invoke frame itself" actually lives) -- step 2's scope is proving the process/crash-handling
    mechanics, which does not need it yet.
  - PluginIpcChildProcess: host-side ProcessBuilder spawner + AutoCloseable process handle. Delegates
    the wire protocol itself to PluginIpcHostSession unchanged (that class is deliberately
    stream-agnostic per its own step-1 javadoc); this class's only job is OS-process-specific: spawning
    with the right classpath/main class, and -- per design section 4's crash-handling sequence --
    telling apart an ordinary closed channel from a child that actually died mid-invoke, remapping
    PLUGIN_IPC_CHANNEL_CLOSED into a new PLUGIN_EXECUTION_PROCESS_KILLED (carrying the child's real exit
    code) once `Process.isAlive() == false` confirms it. close() does the grace-period-then-
    destroyForcibly() shutdown design section 2 specifies.
  - Real bug found and fixed mid-implementation, not just theorized: a raw `-cp <classpath>` argument
    hit Windows's CreateProcess error=206 ("the filename or extension is too long") against the
    assembled sample app's real runtime classpath (dozens of adapter jars) -- confirmed via a narrow
    --tests rerun surfacing the actual IOException (the full gate's own log only showed the summary).
    Fixed by writing the classpath to a `java @argfile` instead of passing it as a raw argument
    (PluginIpcChildProcess.writeClasspathArgFile), deleted only in close() once the process is confirmed
    dead (deleting any earlier would race java's own launcher, which reads the argfile during its own
    startup). This is a real constraint step 3's warm pool will also need to respect, not a one-off.
  - Live-fired proof (PluginIpcChildProcessTest, real ProcessBuilder children, not piped streams):
    (1) auditLogPluginCallsBackIntoItsOwnDeclaredCapabilityOverARealChildProcess -- the step-1 round
    trip, now over a real process boundary, still round-trips end to end into a real in-memory store;
    (2) aCallbackToACapabilityThePluginNeverDeclaredIsDeniedAcrossARealChildProcess -- the callback
    allowlist enforced for real across a process boundary, PLUGIN_CALLBACK_NOT_DECLARED, store untouched
    -- this is SEC-3's own done-when bar's "a plugin that actually attempts a forbidden operation and is
    actually blocked", per the design doc's explicit reinterpretation (section 4): Model B does not add
