  What landed:
  - PluginProcessResourceLimits (record: nullable memoryLimitMb/cpuRatePercent, static NONE) and
    PluginProcessResourceLimiter (interface: isAvailable/wrapCommand/attachAfterStart, static
    forCurrentOs() factory probing the real OS once and caching the result) -- the two attachment
    points exist because the two real mechanisms attach at different points in a process's lifecycle:
    Linux wraps the spawn COMMAND itself (the limit exists before the child's first instruction
    runs); Windows assigns an already-started process to a Job Object (no "start already inside a
    job" primitive on Windows short of a suspended-process trick this design doesn't need).
  - PluginWindowsJobObjectResourceLimiter: CreateJobObject -> SetInformationJobObject
    (JOBOBJECT_EXTENDED_LIMIT_INFORMATION for the memory ceiling + JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE,
    a hand-declared JOBOBJECT_CPU_RATE_CONTROL_INFORMATION struct for the CPU rate hard cap) ->
    AssignProcessToJobObject against the child's real PID (Process.pid()). Deliberately a
    self-contained, hand-declared kernel32 binding (5 exports, 4 struct shapes copied from winnt.h)
    rather than a dependency on jna-platform's own WinNT/Kernel32 mappings -- keeps this class
    independently verifiable against the real OS API instead of trusting an unfamiliar library's
    exact struct layout, and was in fact verified empirically (see below), not just reasoned about.
    64-bit JVMs only (this platform's own toolchain pin) -- no stdcall/cdecl distinction to declare.
    KILL_ON_JOB_CLOSE means an abrupt host death also reaps the child, a bonus beyond the ceiling
    itself: the job handle is held for the child's lifetime and closed in
    PluginIpcChildProcess#close().
  - PluginLinuxCgroupResourceLimiter: primary path wraps the spawn command with
    `systemd-run --user --scope -p MemoryMax=<n>M -p CPUQuota=<n>%`, probed once by actually launching
    a real no-op transient scope (the only way to know a usable systemd user session exists without
    guessing); falls back to direct cgroup v2 filesystem writes (create a child cgroup under this
    process's own cgroup, write memory.max/cpu.max, move the spawned child's PID in after
    ProcessBuilder.start()) when systemd is unavailable -- genuinely best-effort, since it depends on
    cgroup delegation an unprivileged process is not guaranteed to have; degrades to
    PluginNoOpResourceLimiter if neither mechanism proves out.
  - PluginNoOpResourceLimiter: the degrade-to-timeout-only posture (design section 3: "logged loudly
    as a posture warning ... never a silent downgrade") -- command/process pass through unchanged,
    warns exactly once (java.util.logging WARNING) the first time a caller actually requests a real
    limit this instance cannot enforce, never on construction alone (constructing/using this class
    with no requested limits is today's actual status quo -- nothing is wired to request limits yet
    -- so warning then would be noise, not signal).
