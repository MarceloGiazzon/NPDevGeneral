id: SEC-3
title: >-
  Plugin memory/CPU is unbounded and a hostile plugin is not contained -- plugins are now
  admission-checked (generation + boot bytecode gates, B30) but NOT sandboxed; in-process,
  full-privilege execution with only a wall-clock timeout plus the static-analysis barrier
type: GAP
severity: HIGH
status: OPEN
opened: 2026-08-25
source: >-
  2026-08-25 remediation plan W3.3 (QUAL-33), investigating the engine test's (then
  SandboxedPluginExecutionEngineTest, renamed TimeBoundedPluginExecutionEngineTest 2026-08-26) disabled
  maliciousPluginVectorsRemainContained. EXT-1 shipped plugin:java-controller and plugin:java-source,
  both of which let a model author ship COMPILED CODE that runs inside a generated app's own process
  -- the containment claim implied by "sandboxed" in the engine's ORIGINAL name was never built beyond
  the timeout, which is exactly why the class itself was renamed (not just this item's title): SEC-3
  stays open as the tracked upgrade path to real (e.g. process-isolation) containment.
surface: runtimehost, plugin-execution, security
