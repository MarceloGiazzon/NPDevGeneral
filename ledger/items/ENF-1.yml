id: ENF-1
title: >-
  Accepted implies enforced: the schema accepts DSL keywords the runtime may silently ignore, and nothing
  proved otherwise
type: GAP
severity: HIGH
status: PARTIAL
opened: 2026-10-20
closed: null
source: >-
  PLAN_PRODUCT_GAPS_2026-10-19 (W0). check-dsl-coverage.py proves each DSL feature appears in some model;
  it never proved the runtime obeys it. Nested onFailure, two-clause query filters and a 5-field cron were
  accepted and ignored for months.
surface: NPDevSamples/dsl-conformance-max/behavior-probes, scripts/quality/run-behavior-probes.ps1, scripts/policy/dsl-behavior-witness.json
detail: |
  Table-driven behaviour probes (scripts/quality/behavior_probes/run_probes.py) run against a booted
  dsl-conformance-max app on a wiped database. scripts/policy/dsl-behavior-witness.json maps each keyword of the
  high-risk schema families (`<$defs name>.<property>`) to the probe ids that witness it, or to a reasoned
  allowlist group; check-dsl-behavior-witness.py (aiKnowledge gate) fails on an unwitnessed keyword, a
  dangling probe id, or an allowlist that grew (frozenCount ratchet). A probe exposing a real defect carries
  knownFailure and is green only while it still fails.
resolution: >-
  Open until the allowlist is empty for the high-risk families (flow, query, invariant, lifecycle, role,
  field). Each session shrinks the allowlist and lowers frozenCount in the same commit.
note: >-
  2026-10-21: allowlist 130 -> 57 (frozenCount 57); probes 82 -> 111 (110 green, 1 expected live1 skip, 7 knownFailure). New defects filed:
  REG-273 (minLength/array constraints/nested object not enforced), REG-274 (domain-type normalization/minLength/regex ignored),
  REG-275 (lifecycle guard/requiredPayload/requires not enforced on REST), REG-276 (seed explicit id ignored), REG-277 (aggregateCollection.orderBy unread).
  Remaining 57 are identity/metadata/presentation keys plus items needing a DataSource or a fixture no model declares.
  2026-10-23: allowlist 54 -> 49 (frozenCount 49). New fixture rule FollowUpNewShelf (dsl-conformance-max: create WidgetSeedDemo +
  scheduleEvent with delayMs / delaySeconds / delayMinutes, events ShelfCheckDue*) and probe file 91-orchestration-actions-jdbc.json
  (requires jdbc, run with -StorageVariant h2local) witness orchestrationAction.concept/event/delayMs/delaySeconds/delayMinutes:
  the created row exists and each schedule's dueAt lands at its own offset. Its companion probe found REG-300 (cross-tenant
  schedule listing), fixed the same day. Probes run on the Linux notebook now (PORT-1); the probe runner restages stale
  RuntimeHost jars itself (LIBS-FRESH).
  2026-10-24: allowlist 44 -> 21 (frozenCount 21); 257 tracked keywords, 236 witnessed by 129 probes. The 14 structural
  keys (concept/field/flow/flowStep/query/queryLookup/aggregate/aggregateCollection name, steps, fields, access, lifecycle,
  collections) are now named by existing probes whose assertions depend on them (e.g. the forEach refusal message names the
  step, the lookup probe asserts the allTimeUnits column, the aggregate tree probe posts and reads items[].positions[]).
  New 87-served-metadata.json (5 probes) witnesses lifecycleState.label/metadata, lifecycleTransition.action/metadata/
  actionLabel, field.description, flow.action, flowStep.action and field.picker against their served values; the concepts
  catalog now serves states[] (value, label, labelLocales, initial, terminal, metadata -- CompiledMetadataCanonicalJson)
  so state labels/metadata have a runtime surface. Found: field.picker on a non-reference field is inert and validates
  clean (REG-302). Remaining high-risk 7: field.uid, field.renamedFrom, flow.uid, query.uid (need a LIVE-1 rename
  revision op on h2local), query.metadata (queries are in no served catalog), lifecycleState.allowedActions (not compiled
  into the runtime model), field.connectable (needs a via-anchored bond in the fixture). Allowlist reasons corrected:
  field.connectable is a bond anchor, not presentation.
  2026-10-24 (later, owner: follow the recommendations; no legacy users): allowlist 21 -> 14. flow.uid, query.uid and
  aggregate.uid RETIRED (read by nothing: schema x4, AST/compiled/canonical, assign-uids no longer stamps them,
  `npdev migrate dsl-2` strips them, BREAKING.md). lifecycleState.allowedActions ENFORCED on the server
  (AggregateRuntime.invoke refuses a workbench action the persisted root's state does not allow -> 422
  action_not_allowed_in_state; AggregateRuntimeAllowedActionsTest red without the guard) and witnessed by
  88-allowed-actions-and-anchors.json. field.connectable: anchors made unique PER TENANT with composite bond FKs, and
  the in-memory store now pre-checks every unique field (REG-303); witnessed in 88. query.metadata and domainType.ui
  served through two new admin catalogs (queries, domainTypes) and witnessed in 87. REG-302's picker check is now an
  error. Remaining high-risk: field.uid and field.renamedFrom only -- their behaviour (a rename that keeps the column
  and data) happens at boot on a physical database, and LIVE-1 model reload refuses renames by design, so the witness
  needs a two-boot restart-revision probe runner (plan: NPDev_General__OutsideRepo/enf1-plan.md, batch C).
