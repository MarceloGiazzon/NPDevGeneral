id: AIP-4
title: The Manager as the single AI control point -- AI Providers tab, profiles, per-app AI panel (AI providers plan, Phase 4)
type: FEATURE
severity: LOW
status: DONE
opened: 2026-10-22
closed: 2026-10-28
source: >-
  AI providers unification plan, revision 2 (2026-10-22), NPDev_General__OutsideRepo/AI_PROVIDERS_UNIFICATION_PLAN_2026-10-22.md (outside the repo), built on the AI contact-point inventory AI_CONTACT_POINTS_2026-10-22.md in the same folder.
surface: manager/ai-keys
detail: |
  4.1 the AI Keys tab shows which features use which provider, plus the month's usage and cost.
  4.2 rename to AI Providers, with Providers / Models / Profiles / Bindings sub-views over ai.json and a
  "Find local LLMs" button (npdev ai detect). 4.3 Prompter and Scrap assistant pick a profile instead of
  typing an endpoint. 4.4 a per-app AI panel: opted-in vendors, key availability, run-env start.
  4.5 look at the tab in a running Manager (fake mode, then real) and fix what the screenshots show --
  the AI Keys tab (245bb67f) has so far only passed cargo check.
resolution: >-
  Done when no known provider needs endpoint typing anywhere in the Manager and screenshots of a real
  run are filed in the evidence folder.
files:
  - NPDevManager/ui/providers.js
  - NPDevManager/ui/monitor.js
  - NPDevManager/src/npdev.rs
  - NPDevCli/npdev_ai.py
verification: VERIFIED_LIVE
guard:
  kind: test
  ref: NPDevCli/tests/test_providers.py#test_reports_per_vendor_readiness_without_any_key_value
  asserts: >-
    `npdev ai app` (the Monitor inspector's AI section) reports, per vendor of an app's model, whether the
    app will find a key -- a commented or empty line is not a key -- without ever emitting a key value
  provenRed: true
