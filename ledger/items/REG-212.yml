id: REG-212
title: >-
  The SEC-11 OAuth client-secret transport from the OS credential store to the app was
  unimplemented -- fixed 2026-09-17 (option a: launchers materialize secrets/oauth-google.env via
  a new --get-secret CLI), live-verified against the real Windows Credential Manager
type: BUG
severity: HIGH
status: DONE
opened: 2026-09-17
closed: 2026-09-18
verification: VERIFIED_LIVE
source: >-
  Found while completing the SEC-11 done-when leg "the client secret is in the OS credential store
  and never in manager.json/.env" (2026-09-17, after the M7 fake-Google proof). Grep over the whole
  repo finds exactly SEVEN references to oauth-google.env, all in NPDevGenerator's
  OperationalRunbookEmitter (the two launcher loaders + the javadocs + the .example). Nothing
  anywhere WRITES the real file: the emitted _ops/Run-FinalApp.ps1, Start-App.ps1 and
  run-final-app.sh contain only a Test-Path/-f loader that exports KEY=VALUE lines into the process
  env when the file exists; NPDevManager (Rust) has no oauth-google reference at all; and the
  Manager's headless CLI exposes --set-secret <profile_id> (secret on stdin) but no --get-secret or
  --delete-secret (get_secret exists only as an internal function used by other flows).
surface: >-
  NPDevGenerator/generator/src/main/java/com/npdev/generator/dbconfig/OperationalRunbookEmitter.java
  (OAUTH_SECRET_ENV_LOADER, OAUTH_SECRET_ENV_LOADER_SH, writeOauthGoogleExample),
  NPDevManager/src/main.rs --set-secret CLI, secrets.rs (service "NPDev Manager", account
  prompter/<profile_id>)
detail: |
  The SEC-11 architecture (decision 3: "the client id/secret live only in the OS credential store
  ... Never in manager.json, never in .env, never in the model") has a missing hop. What EXISTS:
  the storage side (secrets.rs set/get/delete/has + the --set-secret headless CLI) and the consumer
  side (both launchers export secrets/oauth-google.env into the app process env when the file is
  present). What is MISSING: any code path that reads the OS credential store and materializes
  secrets/oauth-google.env (or injects the env directly). Live-verified against the M7 proof app's
  own emitted _ops: the launchers never touch the keyring, and the generator never writes the real
  file (only .example). The emitted .example text AND the loader javadocs claimed "the launcher
  writes this file from it at boot" -- a false claim corrected in the same session (any regenerated
  app now says the file is operator-provisioned and that automated transport is not implemented).

  Two design questions this leaves open for the owner (recorded, not silently resolved):
  1. TRANSPORT: (a) add a headless --get-secret to the Manager and have the launcher materialize
     oauth-google.env when absent; (b) have the launcher read the keyring directly (pwsh CredRead /
     secret-tool) and set process env only -- the design's literal "never in .env"; or (c) accept
     the operator manual copy as the documented behavior and adjust the done-when wording.
  2. FILE vs DESIGN: SEC-11 decision 3 says "never in .env", but the implemented consumer contract
     PERSISTS an app-local secrets/oauth-google.env. Either the .env-file contract is a sanctioned
     deviation (then "never in .env" needs rewording) or the launcher must avoid persisting it.

  Impact: a NEW jwt-mode app has no end-to-end path from `npdev-manager.exe --set-secret` to a
  running app with OAuth enabled -- an operator must copy-and-fill the example by hand, exactly the
  manual step SEC-11's architecture was meant to remove. The M7 local proof worked because the
  harness injected NPDEV_OAUTH_GOOGLE_* env directly (the same values the launcher would export),
  which is why this leg's absence went unnoticed until now.

  UPDATE 2026-09-17 (option (a) IMPLEMENTED + LIVE-VERIFIED):
  - NPDevManager gains headless --get-secret <profile> and --delete-secret <profile> (twins of the
    existing --set-secret; value on stdout only on success, errors on stderr, empty value is not
    printed as success; the read-window security tradeoff is documented at the code site).
  - Both emitted launchers (Run-FinalApp.ps1/Start-App.ps1 and run-final-app.sh/start-app.sh) now
    MATERIALIZE secrets/oauth-google.env when absent and npdev-manager is reachable: profiles
    '<base>.client-id' / '<base>.client-secret', base = NPDEV_OAUTH_GOOGLE_KEYRING_PROFILE
    (default 'oauth-google'), binary overridable via NPDEV_MANAGER_EXE. Absent file AND absent
    Manager binary -> app boots with OAuth disabled (login screen hides the button).
  - Verification (real Windows Credential Manager, fake values, all cleaned up after):
    --set-secret/--get-secret round trip clean; missing profile -> exit 1 with clear stderr;
    --delete-secret idempotent; the BYTE-FOR-BYTE EMITTED sh function ran the rebuilt
    npdev-manager.exe and wrote the env file ('Materialized oauth-google.env ...'); the app then
    booted with OAuth enabled using ONLY the materialized values (config probe enabled:true) while
    the no-file/no-keyring boot reported enabled:false; both fake keyring profiles deleted after.
  - Generator contract test OperationalRunbookOauthEnvContractTest pins the materialize+load
    contract on all four launchers; full generator suite green (534 tests).

  REMAINING (kept OPEN -- design question 2, owner decision): option (a) PERSISTS an app-local
  secrets/oauth-google.env with the secret in plaintext, which technically deviates from SEC-11
  decision 3's literal "never in .env". Either sanction the .env-file contract (and reword the
  decision) or move later to option (b) (launcher reads the keyring directly and only sets process
  env, no persisted file). REG-211 (jwt-mode credential table) and the real-Google browser run are
  the other remaining SEC-11 items.

  RESOLUTION (2026-09-18): option (b) implemented. Both launcher families (PowerShell + POSIX sh)
  now read the Google OAuth client id/secret directly from the OS credential store via
  npdev-manager --get-secret and inject them into the process environment (Set-Item -Path env: /
  export). No file is written or loaded -- the secrets/oauth-google.env file path, the
  materialize-when-absent logic, and the load-from-file block are all removed. The .example file
  now documents the keyring path and the direct-env fallback, not a copy-and-fill operation.
  SEC-11 decision 3 ("never in .env") is now literally satisfied. Contract test updated.
  Generator suite 534 green.
guard:
  kind: test
  ref: >-
    NPDevGenerator/generator/src/test/java/com/npdev/generator/dbconfig/OperationalRunbookOauthEnvContractTest.java#emitsExampleAndKeyringTransportContract
  asserts: >-
    the emitted launcher's OAuth secret transport reads the client id/secret directly from the OS
    credential store via npdev-manager --get-secret and injects them into the process environment,
    with no oauth-google.env file materialized or loaded -- the option (b) resolution this item's
    2026-09-18 RESOLUTION describes; the POSIX twin is posixTwinsCarryTheSameKeyringContract in the
    same class
  provenRed: true