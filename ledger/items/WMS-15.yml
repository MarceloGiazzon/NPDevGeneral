id: WMS-15
title: >-
  Expedicao's 'Confirmar Saida' (E15) is a plain one-click flow with no second confirmation step or
  item listing, unlike the original GeneXus screen's explicit named-items confirmation
type: GAP
severity: LOW
status: DONE
opened: 2026-09-26
closed: 2026-09-27
verification: VERIFIED_LIVE
source: >-
  WMSOFFICE_SCREEN_PARITY_CHECKLIST.md 2.4 line E15, source-verified in this session (2026-09-26)
  while cross-referencing NPDEV_FEATURE_PLAN_2026-09-24.md's Wave 8 against the older WMS-9 record
  (WMS-9's own E15 line had scored this "PASS by declaration" from the flow's mere existence,
  without checking whether it actually confirms anything). Recorded first in
  AppGen/apps/_official/WmsOffice/definition/parity.json (Wave 8 residual #3). NOT fixed this
  session -- deliberately deferred, see detail.
surface: >-
  AppGen/apps/_official/WmsOffice/definition/model.json (ExpedicaoDemandaPanel's
  ConfirmarSaidaExpedicao action/flow)
detail: |
  ConfirmarSaidaExpedicao (the flow behind ExpedicaoDemandaPanel's "Confirmar Saida" button) is a
  flat invariantCheck -> updateConcept -> emitEvent -> return, the same shape as any other one-click
  flow action -- no client-side confirmation dialog, no listing of the specific items/quantities
  being confirmed out, before the write happens. The checklist's own line (per the original GeneXus
  manual) expects an explicit SECOND confirmation step naming the listed items before the exit is
  committed.

  NOT fixed this session: the platform DSL has no declarative "confirmation dialog" or
  "type/click-to-confirm gate" primitive (the same limitation WMS-9's own Z1-Z6/Reset work already
  hit and worked around by hand-authoring reset-ambiente.html outside the generated panel system
  entirely, since a plain declarative button would repeat the exact "zero confirmation" defect one
  level up). Fixing E15 the same way -- a bespoke hand-authored confirmation page bypassing
  ExpedicaoDemandaPanel -- is a real, small design decision (does it replace the panel action
  entirely, or add a second gate in front of it?), not a typo fix, and was judged out of scope for
  an unplanned pickup alongside R16/WMS-14 in the same session. Left here, same as WMS-9 left it,
  for whoever picks this up next with time to make that call.

  Two options for whoever closes this: (a) a hand-authored confirmation page (reset-ambiente.html's
  own pattern) sitting in front of the existing ConfirmarSaidaExpedicao flow, listing the
  Expedicao's itens before submitting; (b) wait for/propose a genuine declarative confirmation-gate
  primitive in the panel-action schema, which would also unblock any other screen needing the same
  shape (this is the second time it has been hit -- Reset first, now this).

  CLOSED 2026-09-27, option (b), but simpler than expected: `flow.action.confirmationText` already
  existed in the DSL schema (parsed/compiled/canonical-JSON round-tripped for flows since before this
  session -- see CompiledFlow.getAction/CompiledActionMetadata.getConfirmationText, and
  canonical-demo's own model.json already declares it on several flows), but NOTHING ever read it
  back out anywhere in the generator or runtime -- confirmed by grepping confirmationText/
  successMessage/failureHint across NPDevGenerator and NPDevRuntimeHost source and finding zero
  consumers, only test fixtures and sample models. Same class of dead metadata as `inputFormHint`'s
  own documented caveat. Wired it up for real instead of hand-authoring a bypass page:
    1. `PanelRuntime.panelActions()` (NPDevRuntimeHost/src/main/java/com/finalexec/npdev/service/
       PanelRuntime.java) now resolves a binding:"flow" action's own invoked-flow confirmationText
       (via a new `flowConfirmationText` helper looking the flow up in the live CompiledModel) and
       includes it in the panel's live GET /panels/{name} actions response.
    2. business-ui-app.mustache's two action-button code paths (the panel-header loop and the
       per-row loop) now gate the click with `window.confirm(confirmationText)` before calling
       executeDeclaredPanelAction, when the resolved action carries one.
    3. WmsOffice's ConfirmarSaidaExpedicao flow (model.json) now declares
       `action.confirmationText`.
  This closes the primitive gap platform-wide, not just for this one screen -- any flow can now
  declare `action.confirmationText` and get a real client-side gate, wherever it's invoked from a
  declared Panel action.

  Verification: PARTIAL, honestly scoped. Full runtimehost-core test compile (`compileJava`) was a
  false-positive pass -- PanelRuntime.java is NOT among the app-independent files split into that
  module (it imports `com.npdev.generated.*`), so it was never actually recompiled by that run.
  Real verification was a full `Build-FinalApp.ps1` against the assembled `wmsoffice-browser` app --
  `:compileJava`, the FULL `:test` task (including PanelRuntimeFlowActionTest,
  PanelRuntimeRowScopedActionTest, etc.), `:check`, and `:build` all green, no regressions. Then a
  live REST check against the booted app (bootstrapped a throwaway admin via
  /api/auth/bootstrap-admin, logged in for a JWT): GET
  /api/runtime/metadata/ui/panels/ExpedicaoDemandaPanel's `actions[]` entry for
  ConfirmarSaidaExpedicao now carries the declared confirmationText verbatim. NOT verified: an actual
  browser click showing the `window.confirm()` dialog and a Cancel actually blocking the write --
  the JS wiring was read/reasoned through but not driven live in a browser (ScrapForAI). Low risk
  given the API-level plumbing is proven and the JS change is a single straightforward guard clause,
  but flag this if WMS-15 is ever revisited and something looks off client-side.

  2026-09-29: closed a real gap `check-done-item-guards.py` caught -- this item had been DONE with
  NO guard block at all, so nothing would fail if `flowConfirmationText` regressed or was deleted.
  Added `PanelRuntimeFlowConfirmationTextTest` (NPDevRuntimeHost/src/test/java/com/finalexec/), a
  minimal `CompiledModel`+`CompiledPanel`+`CompiledFlow` fixture asserting (a) a binding:"flow"
  action surfaces its invoked flow's `action.confirmationText` on the live panel-actions response,
  and (b) a flow with none declared carries no `confirmationText` key at all (not a null/undefined
  that could misfire `window.confirm(undefined)`). Verified green via the real assembled-app path
  (`run-runtimehost-gate.ps1`, not a standalone `gradlew -p NPDevRuntimeHost` -- that module's
  build.gradle is a template and cannot build alone; PanelRuntime.java imports
  `com.npdev.generated.*`, exactly the false-positive-compile trap this item's own PARTIAL note
  above already flagged). Still does not close the "actual browser click" gap noted above.
guard:
  kind: test
  ref: NPDevRuntimeHost/src/test/java/com/finalexec/PanelRuntimeFlowConfirmationTextTest.java#flowBoundActionSurfacesItsInvokedFlowsConfirmationText
  asserts: >-
    A binding:"flow" CompiledPanelAction whose invoked CompiledFlow declares
    action.confirmationText carries that exact text on PanelRuntime.loadPanel's live actions[]
    response (the flowConfirmationText helper PanelRuntime.panelActions() calls). Re-open this item
    if the helper stops being called, starts reading the wrong flow, or the field name it writes
    ("confirmationText") drifts from what business-ui-app.mustache's window.confirm(...) gate reads.
