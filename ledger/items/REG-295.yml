id: REG-295
title: >-
  A create (POST) carrying a caller-supplied id that belongs to another tenant overwrites that tenant's row and moves it into the caller's tenant
type: BUG
severity: HIGH
status: OPEN
opened: 2026-10-23
closed: null
source: >-
  Read-only audit of generated-CRUD tenant isolation (2026-10-23). Every read/update/delete/restore/bond path is
  tenant-filtered; this create path is the one exception. Upsert keying confirmed by reading
  JdbcBusinessConceptStore.save/executeUpsert; not yet reproduced by a test.
surface: NPDevRuntimeHost/runtimehost-core JdbcBusinessConceptStore (save, executeUpsert, saveVersioned); NPDevKernel storage/sql dialect upserts; NPDevGenerator DtoEmitter (caller-supplied create id)
detail: |
  DtoEmitter.java:50 allows a caller-supplied id on create and GeneratedCrudRuntimeSupport.ensureGeneratedId (~616)
  keeps it. DefaultConceptGateway's findByIdForUpdate(tenantA, id) finds nothing, so the write is treated as a create;
  JdbcBusinessConceptStore.save -> executeUpsert (~1035) runs the dialect upsert keyed on the id column only
  (Postgres ON CONFLICT (id) DO UPDATE, H2 MERGE ... KEY(id)); the business table PK is (id) alone
  (SchemaRealizationEmitter ~561) and tenant_id is an ordinary updated column, so tenant B's row is overwritten and
  re-homed into tenant A. MySQL (STOR-11: UPDATE first, INSERT only if nothing matched) and the row_version path
  (saveVersioned) are unconfirmed. Reachable by any tenant-A caller with create permission who knows a tenant-B UUID
  (v4, not enumerable, but leaks via links/exports/logs). No test, probe or ledger item covers a cross-tenant create id;
  there is also no HTTP-level cross-tenant test of GET/PUT/DELETE /api/<concept>/{id}.
resolution: >-
  Done when a create whose id already exists in another tenant is refused (a generic conflict that reveals nothing
  beyond the UUID the caller supplied) and never rewrites that row, on every engine path (native upsert, MySQL
  two-step, row_version), with a must-error test proven red at the store level, plus a gateway/HTTP-level test.
note: >-
  2026-10-23: filed. Candidate fixes: refuse in the store's create path when the id exists under another tenant
  (dialect-free, one choke point); or tenant-guard the upsert's UPDATE branch per dialect; or a (tenant_id, id) PK
  (a schema break needing a migration).
  2026-10-23: confirmed by reading on all four engines -- every business table has row_version
  (SchemaRealizationEmitter ~553/~323), so save() always reaches saveVersioned; for a create (rowVersion null)
  currentRowVersion checks id AND tenant_id (~1112), finds nothing and calls executeUpsert keyed on id only (~1523).
  H2 MERGE KEY(id), Postgres ON CONFLICT (id) DO UPDATE SET tenant_id=EXCLUDED.tenant_id, MySQL UPDATE ... WHERE id=?
  (matches, INSERT never runs), SQL Server MERGE ON id WHEN MATCHED UPDATE SET tenant_id -- all overwrite and
  re-home silently. No JPA on the path; both service writes (gateway save, then saveToConceptStore) go through it.
  Chosen fix: in JdbcBusinessConceptStore.save, before either branch, SELECT 1 WHERE id=? AND tenant_id<>? (no
  deleted_at filter) -> ConceptStoreUniqueViolationException (409 unique_integrity_failed), message naming no tenant.
  2026-10-23: write-path audit (non-CRUD). Every caller-id write either reaches JdbcBusinessConceptStore.save (aggregate
  commit AggregateRuntime ~266/~538 -- a SECOND HTTP entry point to test; panel conceptMutation; procedure saveConcept;
  batch PATCH reads tenant-filtered first; seed), has its own guard (flow createConcept/updateConcept via
  PostgresPersistenceCapabilityAdapter rowOwnership, TEN-1), or is a plain INSERT that fails on the PK (orchestration
  create, CSV/SQL import, data promotion, snapshot restore). Restore is already tenant-scoped. LOW residuals, not in
  this item's done-when: rowOwnership (~270) treats a NULL tenant_id row as SAME_TENANT; both that guard and the
  planned save() SELECT are check-then-act without a row lock (do the check inside the same transaction / lock the
  row); CrudOrchestrationSupport.existsByUniqueFields (~1015-1050) has no tenant filter, so another tenant's unique
  value silently skips an orchestration create (small existence oracle).
  2026-10-23: HTTP-level witness authored (not yet run):
  NPDevSamples/dsl-conformance-max/behavior-probes/90-cross-tenant-crud.json. Probe
  cross-tenant-create-with-existing-id-is-refused (requires jdbc, knownFailure REG-295) POSTs tenant B's ShelfLayout
  id as tenant A and wants 409 with B's row unchanged; companion cross-tenant-get-put-delete-answers-not-found (no
  marker, both engines) covers the GET/PUT/DELETE gap. New run_probes.py "requires": ["jdbc"] (--storage /
  NPDEV_PROBE_STORAGE) and run-behavior-probes.ps1 -StorageVariant h2local. Awaits a Windows T1 run:
  run-behavior-probes.ps1 -StorageVariant h2local -Only 90-cross-tenant (expect KNOWN until the store fix lands,
  then drop knownFailure), plus a default run (expect PASS + SKIP).
