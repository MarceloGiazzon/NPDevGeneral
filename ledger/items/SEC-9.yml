id: SEC-9
title: >-
  B2: plugin:java-controller crosses the process boundary -- every mounted controller's HTTP request
  is now dispatched through the same OS-process-isolated pool B1 built for Java migration hooks,
  reflectively invoked inside a real separate child process instead of running in-process with the
  app's full privileges (B30)
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-09-05
closed: 2026-09-05
source: >-
  REAL_LIFT_PLAN_2026-09-03.md, Track B package B2 (B30) -- the user's chosen next package after B1
  (STOR-25) closed. REG-204 had declared plugin:java-controller a trusted tier "by design" because a
  controller mount had no CapabilityCall interception point a process boundary could sit behind; this
  package builds that interception point (a host-side proxy + in-child dispatcher) rather than leaving
  the declaration as the final answer.
