id: XREF-1
title: No model-wide reference index; the edges exist only inside panel provenance, for 1 of the 35 schema
  definitions that carry references
type: GAP
severity: HIGH
status: DONE
opened: 2026-08-17
source: 'XREF_EPHEMERAL_PACKS_PLAN-2026-08-17.md measurements M3 and M10. Machine-enumerated from NPDevContract/schemas/model.schema.json:
  35 definitions carrying references, 70 reference-bearing keys.'
surface: dsl/reference-index
files:
- NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/xref/ReferenceIndex.java
- NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/xref/ReferenceEdge.java
- schemas/ai/model-xref.schema.json
detail: 'Nothing in the platform can answer "what references this field?". The reference surface is 70
  keys

  across 35 schema definitions -- `panelDataSource`{concept, query, procedure, onRowLoad,

  parentDataSource, parentField, childField, addFormFields}; `panelAction`{concept, procedure, flow,

  dataSource, inputFields}; `procedureStep`{concept, query, procedure, capability, event, target};

  `referenceDefinition`{target, displayField, lookupFields, previewFields, searchFields};

  `aggregateCollection`{concept, childField}; `guidePageGadget`{query, x, y, series} -- plus

  free-text expression strings (`where`, `having`, `visibleWhen`, `enabledWhen`, `readonlyWhen`,

  `condition`, `expr`, `$var.field`) and `layout.fields[]`.


  Half the engine already exists: `CompiledMetadataCanonicalJson.toPanelProvenance()` (line 676)

  computes `reads`/`writes`/`invokes` as qualified `Concept.field` edges, resolving

  `fieldBindings[].source` against `dataSources[].concept`. It returns `null` unless

  `metadata.generatedBy` is stamped (AutoPanel- or selector-expanded panels only) and covers panels

  only. That walk is the working prototype and must be refactored to DELEGATE to the index rather

  than duplicated.


  Computed in Java, not Python (plan D1): pack/context composition and `qualifierId::Name`

  qualification exist only in `ModelSourceResolver`/`JsonModelParser`, so a Python reimplementation

  is REG-108''s exact shape. Emitted as its own artifact `npdev/model-xref.json` beside

  `compiled-model.json` (plan D2), because `compiled-metadata.json`''s `catalogs` has no contract

  schema at all and an independent file is directly consumable by the CLI, the Monitor and the

  Editor without a running app.


  `Resolution.UNDECIDABLE` is load-bearing: an arbitrary `visibleWhen` predicate, or a `$var.field`

  where `$var` came from a `capabilityCall`, cannot be resolved statically without an expression

  evaluator. Classify those explicitly. REG-185 errors on `UNRESOLVED` only. Letting "we cannot be

  sure" silently become "resolved" is exactly how REG-185''s silence happened in the first place.

  '
closed: '2026-08-18'
verification: VERIFIED_LIVE
resolution: '`com.npdev.dsl.v1.xref.ReferenceIndex` walks every reference-bearing key and classifies each

  edge RESOLVED / UNRESOLVED / UNDECIDABLE, carrying the structural `path` of the occurrence.

  Emitted as `npdev/model-xref.json` (schema `schemas/ai/model-xref.schema.json`) by

  `XrefEmitter`, and by the new `:NPDevContract:dsl:modelXref` Gradle task for the CLI.


  The first corpus sweep reported 173 unresolved edges and 172 were WRONG -- each one a real

  NPDev rule the walker did not know: a dotted `fieldBindings[].source`, a data source taking

  its concept from its query, a role-scoped panel `visibility`, `generated.action.X`, and

  groupBy join paths. All five are pinned as regression tests, because the failure mode of a

  noisy checker is not "some noise", it is being switched off.


  Building XREF-3 on top then found three edge `path`s that addressed no real JSON location

  (`...source.field`, `steps[0].$p.birthDay`, `where[0]`), invisible for as long as the index

  was only ever read.

  '
guard:
  kind: test
  ref: NPDevContract/dsl/src/test/java/com/npdev/dsl/v1/ReferenceIndexTest.java
  asserts: each coverage class produces the right edges; an orderBy naming an aggregate alias and an inherited
    field are NOT reported; an expression outside the grammar is UNDECIDABLE rather than either extreme;
    edge order is stable across builds
  provenRed: true
