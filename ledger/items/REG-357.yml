id: REG-357
title: >-
  The capabilities catalogue (docs/DSL_CAPABILITIES.html) exists and lists all 785 keywords with their evidence, but 677 keywords have no written justification, 104 no example, 105 no official sample, and nothing yet teaches them to a non-specialist
type: GAP
severity: MEDIUM
status: PARTIAL
opened: 2026-11-22
source: >-
  Owner, 2026-11-22: "Esse docto e muito importante. De certa forma sao as capacidades de NPDev. Tudo deve estar justificado. Nao pode haver pecas sobrando. Tambem para cada ha que haver la
  presenca em um json de exemplo ... O publico sao especialistas e nao especialistas. Temos que ensinar e ser didaticos. Por outro lado, 725 ainda e bastante. Por isso ter partes programadas
  manualmente e importante, porque o sistema nao pode prever tudo, sob risco de super inchar. Com a possibilidade de criar seu codigo, pode ser abrir mao de termos mais especificos."
surface: docs, contract/schemas, keyword-budget
files:
  - scripts/docs/generate_dsl_capabilities.py
  - docs/DSL_CAPABILITIES.html
  - scripts/quality/check-dsl-keyword-reference.py
  - scripts/policy/dsl-keyword-admissions
  - scripts/policy/dsl-keyword-meanings
  - NPDevSamples/dsl-conformance-max/Input/model.json
detail: |
  BUILT 2026-11-22: scripts/docs/generate_dsl_capabilities.py renders docs/DSL_CAPABILITIES.html, one filterable and sortable row per keyword (758 budget slots + 27 model-root keys = 785),
  with: noun, the type it takes, what it does, Implemented (parser / downstream code, by name), Official samples (a schema-guided walk of every model of role showcase, canary or dsl-fixture
  plus the built-in packs -- 50 models -- so a key is credited only to the definition that declares it), Tested (test files naming it), Corpus (used in dsl-conformance-max), a real JSON example
  copied from a sample, the written justification from the admission records, and a status listing what is missing. Rows open into a detail view. scripts/quality/check-dsl-keyword-reference.py
  fails when the page lists a different keyword set than the schema. Driven in a real Chrome: 10 of 10 checks (rows, cards, filters, search, sort, detail, phone width, console).
  MEASURED 2026-11-22: 785 keywords; used by an official sample 680 (105 not); named by a test 632; example available 681 (104 not); written justification 108 (677 not); complete on all five
  pieces of evidence 87; unused (no official sample AND no test) 47; named by no platform code at all 8; named only by the parser 54. Evidence by name is indicative where a name is shared
  by several keywords (the page flags those).
  The unused 47 (candidates, each to be removed or given a sample and a test): autoPanelSurface.labelField, capability.specializes, capabilityContractSchemaRef.conceptRef/.schemaRef,
  concept.specializesFloat, event.payloadSchemaRef, event.specializes, generatedActionDescriptor.* (7 slots of a definition nothing in the schema references), guidePageTheme.logoUrl,
  httpConnectorAuth.usernameEnvVar, pack:augments/extensionPoints/fieldConventions/firstPublishedVersion/functions/imports, packRef.allowSideBySide, panelFieldBinding.enabledWhen/readonlyWhen,
  17 presentationMetadata hints, referenceDefinition.defaultFilterBehavior/.multiple, schemaObject.duplicationPolicy/.itemIdentityField/.uniqueItems, screenPanel.enabledWhen. Note pack:augments,
  pack:fieldConventions and pack:functions are real, recent features: they are unused only in the PACKS of the official corpus, so the right fix is a sample, not removal.
  STORY LAYER, 2026-11-22 (owner: "para cada um vou querer uma historinha ... uma justificativa em linguagem cotidiana, algo tangivel"): this is a SEPARATE layer from the 104 missing JSON examples.
  The page now reads scripts/policy/dsl-keyword-stories/stories-*.json (slot id -> story; the generator refuses a story for a keyword the schema lacks), shows it first in each row's detail under
  "In everyday words", has a Story column and a "No story" filter, and "complete" now needs six pieces (code, official sample, test, example, story, written reason). PILOT: 17 stories written
  (field.required/unique/maxLength/sensitive/derivedExpression/defaultExpression/enumValues/reference, fieldConvention.match, concept.lifecycle/access/indexes, role.concepts, experience.for,
  flow.trigger/runAs/expose); 768 keywords still have none; 3 rows are complete (experience.for, fieldConvention.match, flow.trigger). The owner judges the tone before the rest are written.
  Style rule (in the file's $comment): a real person or place first, the problem second, what the keyword does third; no jargon; ~70 words; never promise more than the technical meaning says.
  TO DO (owner's requirements): (1) every keyword justified in writing -- extend the admission-record rule to the 677 older keywords, or record a one-line reason per keyword; (2) a JSON example for
  every keyword -- add the 104 missing to dsl-conformance-max (or remove the keyword); (3) every keyword explained for a non-specialist with an everyday story (see STORY LAYER; English, the product language -- a Portuguese rendering is a separate decision); (4) decide the 47 unused ones (remove, or sample+test) and the 8 named by no code; (5) apply the owner's
  principle when deciding: the language stays small and a rare need goes to code the author writes (function, flow step, JavaScript page, Java class -- REG-354/355), not to one more keyword; the
  target "below 725" is therefore still wanted, and this page is the tool that says what may go.
  SHRINK 2026-11-22 (owner: "700 plus is too much ... almost a language on json", then "Delete tiers 1-3" and "Tier 4 stays"): a six-tier analysis
  (D:\WorkSpace\NPDev\NPDev_General__OutsideRepo\dsl-shrink\shrink-candidates-v2.csv, rerunnable tools beside it) was followed by the DELETION of 40 keywords from the four schema mirrors,
  JsonModelParser, the compiled model and its writers, the corpus, the AppGen apps (including their $ref member files) and the tests (BREAKING.md 2026-11-22): the synonyms (field.ref/values,
  invariant expression/rule, step phase/payload/delayMinutes/delayMs, flow.schedule, enumOption displayLabel/help/iconHint/badgeHint, ...), 13 keywords nothing acted on, and the unreachable
  generatedActionDescriptor definition. frozenCount 758 -> 718 (the "below 725" target of done_when is met); the catalogue lists 745 rows. KEPT after reading the code, although the first analysis
  called them synonyms: flow.startEndpoint (registers the flow in the generated trusted-flow registry; only the coverage fixture uses it) and workbenchAction.applyTo with its three sub-keywords (appends
  a row; afterAction cannot, the expression language has no list-append function). OPEN decisions for the owner: tier 6 (44 slots that keep old data or history -- renamedFrom, uid, the conversion
  language, pack migrations -- plus 7 inheritance beyond concepts and 7 pack/context machinery), tier 5 merges (43 rows: field built on schemaObject, typed metadata, picker settings in one place),
  and what to do with startEndpoint/applyTo. DECIDED 2026-11-22 (owner, after the explanation): tier 6 -- cut NOTHING; tier 5 -- NO merges (the shrink stops at 718; startEndpoint/applyTo stay as they
  are). The 163 behaviour probes were then run against the shrunk model: 162 green on the first run, the one red (87-served-metadata asserting the deleted action.successMessage) was a stale probe,
  fixed. STORIES 2026-11-22: nouns Screen (stories-screen-1..4.json, 200 slots), Flow (stories-flow-1..2.json, 75), Capability (stories-capability-1..2.json, 53), Experience (stories-experience-1.json, 41), Pack file + Pack (stories-pack-1.json, 42), Query, Model root, Module, Role, Property, Event and Function
  (stories-query-1 / model-root-1 / module-1 / role-1 / property-1 / event-function-1.json, 121) written in full: ALL 745 keywords now have a story (min 15, mean 35, max 63 words, no code in them);
  the owner has not yet judged the tone of the 532 stories written after the Concept parts (Screen, Flow, Capability, Experience, Pack, Query, Model root, Module, Role, Property, Event, Function).
  REST OF REG-357, 2026-11-22 (owner: do only 20% of the remaining cases, mixed complexity): every 5th keyword within each kind of value (boolean, text, number, choice, list, object, reference) was taken
  per missing piece. DONE: 129 written reasons (scripts/policy/dsl-keyword-reasons/reasons-batch-1.json, read by the generator, shown as "Written reason"); 6 keywords now used by the coverage fixture with
  an example (presentationMetadata.listColumnOrder/tab/enabledWhen, schemaObject.uniqueItems/duplicationPolicy, autoPanelSurface.fields), 163/163 behaviour probes green; 8 keywords named by a unit test
  (FieldHintsAndArrayRulesSurviveCompileTest: width, summaryCard, searchFields, displayMode, field uniqueItems/itemIdentityField, duplicationPolicy, domainType.baseType). Completeness 76 -> 148 of 745 rows.
  BATCH 2, 2026-11-22 (same 20% method): 101 more written reasons (scripts/policy/dsl-keyword-reasons/reasons-batch-2.json; they state the need and carry no evidence counts, which go stale); the catalogue
  MEASURER had two defects that made the gaps look bigger than they were, both fixed in scripts/docs/generate_dsl_capabilities.py: (a) a definition that is only an alias of another one (uiField -> presentationMetadata) was not followed, so every
  presentationMetadata.* keyword used through field.ui showed "no official sample" (81 -> 62 missing samples, 80 -> 61 examples); (b) the test scan did not read NPDevContract/dsl/src/test or NPDevGenerator/generator/src/test and its
  string pattern could not match "$ref"/"$schema" (131 -> 8 keywords with no test; the batch-1 note blaming "tracked files only" was a wrong diagnosis). Fixture: panel.uid, panelFieldBinding.enabledWhen/readonlyWhen and
  a deprecated field added to dsl-conformance-max (validates with 0 errors); FormSwitchesAndOverridesSurviveCompileTest names formPresentation, showInDefaultWebUi, invariant.override, property.securityRelevant. Completeness 148 -> 251 of 745 rows.
  NOTE: keywords that say "declared procedure" (autoPanelDataSource.procedure, transactionHooks.onLoad, workbenchAction.procedure ...) are NOT dangling: since REG-342 the name resolves against flows (PanelValidation.java:181); only their schema descriptions are stale (a follow-up, with REG-358).
  STILL OPEN (next sessions, same 20% method): 407 written reasons, 8 tests, 61 official samples, 60 examples, 5 validator-only
  keywords, 145 used only by the coverage fixture (no real model). Left out on purpose as complex: concept.renamedFrom (needs the restart-revision probe), pack:signature, pack:fieldConventions/propertyScopes
  (pack files), transactionHooks.onValidate, queryParameter.schema, panel bindings/layout children (they change served panel metadata that probes assert), autoPanel.name (admin may not repeat the name).
  The catalogue's Implemented column was rebuilt (layers: parser / plumbing / validated / build / runtime / tooling, accessor calls counted, a Real models
  column that leaves out the coverage fixture): the old "parser only" label was wrong for keywords the code reads through accessors (9 of the first 14 "unsupported" keywords were live).
done_when: >-
  Every row of docs/DSL_CAPABILITIES.html is complete (implemented, used by an official sample, tested, exemplified, justified, explained in plain language) or the keyword is gone from the schema;
  the budget frozenCount is below 725 or the owner has restated the target.
