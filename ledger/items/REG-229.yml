id: REG-229
title: >-
  run-runtimehost-gate.ps1's :test task fails 7 of 882 tests deterministically (2 consecutive
  identical runs), all with an identical Spring ApplicationContext bootstrap failure
  (UnsatisfiedDependencyException chained 4 levels deep into a NoSuchBeanDefinitionException) --
  NonDefaultRuntimeSurfaceProfileIntegrationTest, RuntimeHealthEndpointIT,
  RuntimePluginFilesystemDiscoveryIntegrationTest, RuntimePluginStatusControllerIntegrationTest,
  SupportedCoreControllerBlackBoxIntegrationTest (both its tests), and
  SupportedRuntimeSurfaceAllowlistIntegrationTest.
type: BUG
severity: HIGH
status: DONE
opened: 2026-09-20
source: >-
  Found running run-runtimehost-gate.ps1 (sample: simple-contact-intake) to validate this session's
  own REG-226 fix (PasswordResetController). Ran the gate TWICE in a row (once before, once after
  an unrelated model.json/AllocationCapability.java edit for WMS-9 C7) -- both runs failed the
  EXACT SAME 7 tests with the EXACT SAME condensed failure signature: `java.lang.IllegalStateException
  at DefaultCacheAwareContextLoaderDelegate.java:180`, chained through
  `UnsatisfiedDependencyException at ConstructorResolver.java:804` four times, then
  `BeanCreationException at ConstructorResolver.java:657` ->
  `BeanInstantiationException at SimpleInstantiationStrategy.java:200` -> one more
  `UnsatisfiedDependencyException` -> `NoSuchBeanDefinitionException at
  DefaultListableBeanFactory.java:2322`. Determinism across two independent runs (same tests, same
  line numbers, both times) rules out ordinary test-order flakiness -- this is a real, reproducible
  context-load failure, not noise. A JVM paging-file warning
  ("os::commit_memory ... failed; arquivo de paginacao muito pequeno") printed adjacent to the
  failures in both runs but is very likely coincidental/cosmetic, not causal -- real memory
  exhaustion would not plausibly fail the exact same 7 tests, in the exact same way, twice in a row.
  None of the 7 failing test classes have anything to do with this session's actual edits
  (PasswordResetController/ChangePasswordController auth controllers, WmsOffice's
  AllocationCapability.java, or model.json flow/procedure changes) -- they are RuntimeHost
  admin/plugin/health/surface-profile integration tests, an unrelated part of the module.
surface: >-
  Not root-caused -- exact missing bean is unknown. Gradle's condensed `--console=plain` failure
  summary (what run-runtimehost-gate.ps1's own log capture shows) prints only
  `Caused by: <ExceptionClass> at <File>.java:<line>` for each level of the cause chain, never the
  exception MESSAGE (which would name the actual missing bean type/qualifier) -- getting that
  requires either the full JUnit XML report (deleted by the gate's own "Sample output cleanup"
  step before this was noticed) or a targeted `--tests` rerun preserving
  `<sample>/Output/App/build/test-results/test/*.xml`, neither attempted yet (out of scope for the
  four unrelated WMS-9 tasks this session was actually doing). Candidate starting points for whoever
  picks this up: the 4-deep UnsatisfiedDependencyException chain suggests a bean whose own
  constructor depends on another bean that itself fails, at least 4 levels into some dependency
  graph -- likely a shared `@Configuration`/filter-chain bean these six test classes all pull in
  (they cluster around runtime-surface-profile/plugin-status/health, suggesting a common
  `RuntimeSurfaceProfile`-adjacent bean, not per-test-class setup).
detail: |
  FIXED 2026-09-20. Root-caused by regenerating simple-contact-intake directly and rerunning the 6
  failing classes with `--stacktrace`, preserving `build/test-results/test/TEST-*.xml` (the gate's
  own condensed console log never prints the exception MESSAGE, only the class+line chain -- the XML
  has the full `Caused by:` chain including the actual missing-bean message).

  ROOT CAUSE (bug #1, the one this item was filed for): `NpdevRuntimeModeConfig.tracingPackBridge`
  (NPDevRuntimeHost/runtimehost-core/.../config/NpdevRuntimeModeConfig.java) declared a
  `DataSource dataSource` constructor parameter but, unlike every other JDBC-backed bean in that
  same file, was gated ONLY by `@ConditionalOnProperty(npdev.tracing.pack-bridge.enabled,
  matchIfMissing=true)` -- not also by `npdev.storage.mode=jdbc`. simple-contact-intake's model
  resolves to the InMemory engine, which bakes
  `spring.autoconfigure.exclude=...DataSourceAutoConfiguration...` into the generated
  application-npdev-db.properties (loaded via spring.config.import, highest precedence) -- so no
  DataSource bean exists at all. The 6 failing test classes are plain `@SpringBootTest`s that (unlike
  AbstractScenarioIntegrationTest subclasses) never restore `spring.autoconfigure.exclude`, so
  Spring tried and failed to construct tracingPackBridge, throwing UnsatisfiedDependencyException ->
  ... -> NoSuchBeanDefinitionException for javax.sql.DataSource, chained 4 levels deep through
  `inProcExecutionTracer`'s own `ObjectProvider<TracingPackBridge>#getIfAvailable()` call (which does
  NOT swallow a bean-creation failure the way it swallows a genuinely-absent bean definition).
  FIX: added the same `@ConditionalOnProperty(npdev.storage.mode=jdbc)` guard every sibling bean in
  the file already carries, alongside a `@ConditionalOnExpression("${npdev.tracing.pack-bridge.enabled:true}")`
  to preserve the separate opt-out flag (two `@ConditionalOnProperty` on one method does not compile
  -- not `@Repeatable` -- so the second condition uses a different annotation type; both are pure
  Environment-property checks, so neither is evaluation-order-dependent on when
  DataSourceAutoConfiguration itself runs, unlike `@ConditionalOnBean(DataSource.class)` would have
  been on this plain, non-auto-configuration `@Configuration` class).

  ROOT CAUSE (bug #2, previously MASKED by bug #1): fixing bug #1 let `inProcExecutionTracer`
  actually construct successfully for the first time in these contexts, which surfaced a second,
  independent pre-existing bug: `InProcExecutionTracer` (NPDevKernel adapter class) `implements
  ExecutionTracer, TraceStore, TraceSummaryStore` -- all three. Once that singleton is instantiated,
  Spring's type-based lookup also treats it as a `TraceStore` candidate, alongside the dedicated
  `inProcTraceStore` bean (added earlier for TraceStore.noop() wiring) -> NoUniqueBeanDefinitionException,
  "found 2: inProcExecutionTracer,inProcTraceStore". FIX: marked `inProcTraceStore` `@Primary`.

  VERIFICATION: (1) narrow repro -- regenerated simple-contact-intake, ran the exact 6 originally-
  failing test classes directly against the assembled app with `--stacktrace`: all pass, BUILD
  SUCCESSFUL, exit 0. (2) authoritative repro -- reran the actual
  `pwsh -NoProfile -File scripts/quality/run-runtimehost-gate.ps1` end-to-end (not a narrowed
  substitute): its own `enforceSingleSchemaRealizationSource test` step against the freshly
  regenerated assembled app (the same 882-test run this item was filed against) is now BUILD
  SUCCESSFUL, 8/8 tasks, no failures -- REG-229's specific 7 failures are gone. The gate's overall
  run still exits failed, but ONLY on the separate `runtimehost-core:test` task's 4 pre-existing
  OAuthGoogleControllerTest failures (196 tests, 4 failed, 3 skipped) -- the exact REG-230 failure
  signature already isolated via git-stash in the prior session as unrelated to anything touched
  here. No new failures introduced anywhere in either test run.

  BLAST RADIUS (resolved): tracingPackBridge's bug affected every generated app resolving to the
  InMemory engine (not just simple-contact-intake) whenever any test/context didn't itself restore
  spring.autoconfigure.exclude -- likely wider than the 6 classes caught here, just not exercised by
  gates that only assemble a jdbc/postgres-profile sample. `run-runtimehost-gate.ps1` -- one of the
  four T2 gates `run-all-gates.ps1` bundles -- is no longer red on this failure mode; REG-230 is the
  one remaining reason it doesn't report fully green (tracked separately, not started).
