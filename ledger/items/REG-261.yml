id: REG-261
title: >-
  A parallelAwait forEach is not resumed by publishing its events: it stays WAITING_EVENT until an explicit /resume
type: BUG
severity: HIGH
status: OPEN
opened: 2026-10-20
closed: null
source: >-
  ENF-1 behaviour probe fl-parallel-await-resumes-itself-when-last-event-arrives (NPDevSamples/dsl-conformance-max/behavior-probes/20-flow.json), found while checking
  that the booted dsl-conformance-max app OBEYS what the DSL schema accepts.
surface: generated-app runtime (dsl-conformance-max)
detail: |
  KNOWN DEFECT: for a parallelAwait forEach, publishing the awaited event for EVERY iteration (POST
  /api/events/publish, correlation '<exec>::forEach:await-line-approved-parallel:<i>', i=0,1) should
  resume the execution to COMPLETED just as a single awaitEvent does (see fl-await-event-resumes-only-
  on-matching-correlation). ACTUAL: both publishes return 202 and the execution stays WAITING_EVENT
  (currentStepIndex 0, resumeAttemptCount 0) for at least 30 s -- only an explicit POST
  /api/executions/<id>/resume completes it (proved by fl-parallel-await-joins-all-iteration-events).
resolution: >-
  Fix the runtime, then remove "knownFailure": "REG-261" from probe fl-parallel-await-resumes-itself-when-last-event-arrives; the runner turns that probe red
  the moment it passes with the marker still set, so the marker cannot outlive the bug.
