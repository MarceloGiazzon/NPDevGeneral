id: RUN-31
title: >-
  Four pre-existing, mutually-unrelated gate gaps surfaced by running the full run-all-gates.ps1
  for W1.2 -- none caused by W1.2, none touched by it, bundled here rather than filed separately
  since each is a one-line-cause, low-effort item
type: GAP
severity: LOW
status: DONE
opened: 2026-09-13
closed: 2026-09-14
verification: UNIT_TESTED
guard:
  kind: test
  ref: NPDevKernel/kernel/src/test/java/com/npdev/kernel/concepts/DefaultConceptGatewayDegradedConcurrencyTest.java#degradedModeSaveRaceIsLoudNotSilent
  asserts: >-
    the degraded-mode save/delete race tests pass their forced two-thread race deterministically on
    :kernel:test, now with join()/await() timeouts widened 5s->30s (RUN-31 #1) so they no longer
    treat scheduler-delayed-not-hung racers as a CAS-logic failure; a disposable scratch test
    (deleted, not committed) reproduced the exact original failure shape at the exact recorded
    assertion by simulating that delay against the old 5s value, positively confirming the
    mechanism before the fix was applied.
  provenRed: true
source: >-
  Discovered while closing W1.2 (NPDEV_ROADMAP_2026-09-12.md Wave 1) and running its own prescribed
  full run-all-gates.ps1 verification. Confirmed unrelated to W1.2 the same way RUN-30 confirmed its
  own gap unrelated to W1.1: by tracing each to files W1.2 never touched.
surface: NPDevKernel/kernel, NPDevKernel/adapters/file-store-objectstore, NPDevContract/dsl/parser,
  NPDevGenerator/generator/emitters, AppGen/apps/_scratch
detail: |
  1. `DefaultConceptGatewayDegradedConcurrencyTest > degradedModeSaveRaceIsLoudNotSilent()` FAILS
     unfiltered on `:kernel:test` (`org.opentest4j.AssertionFailedError` at
     `DefaultConceptGatewayDegradedConcurrencyTest.java:116`). A concurrency/timing test in the
     degraded-mode concept gateway -- W1.2 never touched `NPDevKernel/kernel` at all. Likely a
     flaky race in the test's own timing assumptions rather than a real product defect, but not
     investigated further here (wrong subsystem for this session).
  2. `S3ObjectStoreFileStoreAdapterMinioLiveTest > initializationError` FAILS
     (`java.lang.IllegalStateException` at `S3ObjectStoreFileStoreAdapterMinioLiveTest.java:42`).
     Name and shape (`...LiveTest`, `initializationError`) strongly suggest a live-MinIO
     integration test that should be skipped when MinIO/Docker isn't running locally --
     `scripts/policy/local-test-profile.json`'s documented `enabledEngines: [h2, sqlserver]`
     deliberately keeps Docker off for local/agent work (NPDev_General/CLAUDE.md, "Local machine
     resource policy"), so this test needs the same skip-cleanly treatment `PostgresTestSupport`
     already gets, not a hard `initializationError`. Not fixed here: wrong subsystem, and the real
     fix is a Docker-skip guard in a file this session never opened.
  3. Two pre-existing `security-pattern-sweep.py` hits remain untriaged after W1.2's own 7 new
     WorkspaceMenuSeeder hits were triaged (`scripts/quality/security-pattern-sweep-allowlist.json`,
     frozenCount raised 567 -> 574 this session): `NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/
     parser/ModelSourceResolver.java:1046` (`sql-string-building`, "DROP statement is assembled with
     refQualifier spliced in rather than bound as a parameter") and `NPDevGenerator/generator/src/
     main/java/com/npdev/generator/emitters/GeneratedContentHash.java:60`
     (`swallowed-security-exception`, "catch (IOException | NoSuchAlgorithmException) returns null").
     Neither file is touched by W1.2. Each needs the same triage every other entry in that allowlist
     got: read the exact code, decide genuine-finding/safe/needs-deep-review, record a fingerprint +
     reason.
  4. `AppGen/apps/_scratch/lineage-verify` has no entry in `scripts/quality/corpus-roles.json`
     (`validate-corpus.py` reports it "MISSING" role, alongside 64 other models that all correctly
     resolve). Pre-existing before this session -- confirmed present in the very first
     `validate-corpus.py` run of this session, before any W1.2 file existed. Also already
     independently noted (not fixed) by W0.3's own ledger item the prior session. Needs one
     `corpusRole` entry (`dsl-fixture`/`engine-variant`/`repro-case`/`showcase`) in
     `scripts/quality/corpus-roles.json`, chosen by whoever knows what that scratch app is for.
notes: |
  Not chased further here: none is in W1.2's surface (WorkspaceMenuSeeder, the workspace pack,
  Build-NpdevApp.ps1's menu-key generation, the new navigation-reprojection probe/checker), and each
  is independently small enough to close in isolation whenever a session owns that subsystem. #3 and
  #4 are the cheapest (a docs/SECURITY_PATTERN_SWEEP_2026-07.md-style triage note + allowlist entry;
  one JSON line respectively) if someone wants a quick win.

  UPDATE 2026-09-13, three of four closed:

  #4 CLOSED: added `"AppGen/apps/_scratch/lineage-verify": "dsl-fixture"` to
  `scripts/quality/corpus-roles.json` -- read the model itself (two concepts, `MedicalInvoice
  specializes Invoice`) rather than guessing; it exists purely to exercise the specialization/lineage
  DSL feature, matching dsl-fixture's own definition ("exists to exercise DSL surface... not a
  demo") over repro-case (no specific past bug) or showcase. Verified: `validate-corpus.py` now
  reports "every model declares a corpusRole" (65/65), zero MISSING.

  #3 CLOSED: triaged both hits as SAFE, with fingerprints added to
  `scripts/quality/security-pattern-sweep-allowlist.json` (frozenCount 574 -> 576, `frozenCountWhy`
  extended with the reasoning). `b1b5948d78f0` (ModelSourceResolver.java:1046) is a genuine FALSE
  POSITIVE: read the full method (checkMemberVisibility, lines 1024-1048) -- it is a plain Java
  PACK_VISIBILITY exception-message string built with ordinary `+` concatenation, never SQL; the
  sweep's SQL_VERB regex (`\bDROP\b`, case-insensitive) matched the ordinary English word "drop" in
  "...or drop it from..." with no way to tell prose from a SQL keyword. `7809b81aca86`
  (GeneratedContentHash.java:60) is a deliberate, documented null-on-failure contract -- verified
  against BOTH real callers (not just the class's own javadoc): FinalAppAssembler.java:597 and
  ExtensionInventoryEmitter.java:227 both check `!= null` FIRST and treat a null as CHANGED (the
  fail-safe direction), never as a false unchanged/clean match, so the exact REG-39 failure mode this
  pattern watches for is structurally prevented. Verified: `security-pattern-sweep.py` now reports
  "0 needing triage" (689/689 cleared); `--fail-on-new` and `--self-test` both exit 0.

  #2 CLOSED: `S3ObjectStoreFileStoreAdapterMinioLiveTest.startMinioAndAdapter()` called
  `MINIO.start()` unconditionally in `@BeforeAll` with no Docker-availability guard at all -- fixed
  by copying `PostgresTestSupport.postgresEnabled()`'s exact env-var convention
  (`NPDEV_TEST_PROFILE_ENGINES=minio` or `CI=true`) into a new `minioEnabled()` and an
  `Assumptions.assumeTrue` call at the top of `@BeforeAll`, so the class aborts cleanly instead of
  reporting an opaque `initializationError`. Added `"minio"` to `local-test-profile.json`'s
  `allEngines` (not `enabledEngines` -- stays off by default, same as postgres/mysql) and extended
  its `note` for discoverability. Verified: `:adapters:file-store-objectstore:test --tests
  '*MinioLiveTest*'` now BUILD SUCCESSFUL; JUnit XML shows `tests="3" skipped="3" errors="0"` --
  a genuine clean skip, not a vanished/uncounted class. NOT verified: the opt-in
  (`NPDEV_TEST_PROFILE_ENGINES=minio`) path actually passing against a real MinIO container --
  Docker is unavailable on this machine (`docker info` fails), consistent with this platform's own
  documented local-machine policy. The fix is structurally identical to PostgresTestSupport's
  already-trusted pattern (same env-var parsing, same Assumptions call), and CI (which runs the full
  matrix) is where this class actually gets exercised against a real container.

  #1 NOT CLOSED, genuinely investigated rather than deferred again: read
  `DefaultConceptGatewayDegradedConcurrencyTest.degradedModeSaveRaceIsLoudNotSilent` in full plus its
  target, `DefaultConceptGateway.saveWithinTransaction` and `InMemoryConceptStore.save()`. The CAS
  logic itself looks airtight: `InMemoryConceptStore.save()` is a single `synchronized` method that
  correctly compares-and-bumps `rowVersion`, so two threads racing into it with the SAME read version
  (both seeing 0, since the seed's own unconditional write sets `current.rowVersion()=0` before the
  race begins, ruling out a null-rowVersion skip-the-CAS path) should deterministically let exactly
  one through -- Java's `synchronized` guarantees this independent of scheduling. Ran the test
  `--rerun-tasks` FIFTEEN consecutive times fresh (not from cache) specifically trying to reproduce
  the failure RUN-31 recorded: all 15 green, 0 failures, confirmed by grepping the full build log for
  any FAIL/BUILD FAILED line (none). Could not reproduce, and could not find a concrete logic defect
  by inspection -- left OPEN rather than declared fixed, per this repo's own standing discipline
  against closing something on "I looked and it seems fine" without either a reproduction or a
  positive proof. Most likely explanation, unconfirmed: a genuine but rare test-infrastructure timing
  issue under heavier machine load (e.g. mid-`run-all-gates.ps1`, with many concurrent Gradle
  workers) rather than a product defect -- if it recurs, the next session should capture the ACTUAL
  stack trace/assertion message from a real failing run (this session never got one to examine) before
  investigating further, since 15/15 clean here means the next reproduction is the first real
  evidence to work from.

  UPDATE 2026-09-14, #1 root-caused and fixed: re-read the recorded failure location itself --
  `org.opentest4j.AssertionFailedError at DefaultConceptGatewayDegradedConcurrencyTest.java:116` --
  and line 116 is the test's own `assertTrue(failureA.get() != null ^ failureB.get() != null, ...)`
  check, which runs immediately after two `threadX.join(TimeUnit.SECONDS.toMillis(5))` calls. A
  fixed 5s join is a pure hang-safety net (the barrier already forces the race deterministically;
  nothing after release should legitimately take long), not race logic -- so a racer merely delayed
  past 5s by scheduler contention (not hung) would leave its `AtomicReference` still null when the
  assertion runs, failing the exact XOR check at the exact recorded line, with no CAS defect
  involved. Built a disposable scratch test (`Run31HypothesisScratchTest.java`, never committed,
  deleted after use) that kept the real barrier/CAS path untouched but added a 6s sleep to one
  racer after it passes the deterministic barrier (simulating scheduler starvation, not a hang),
  then ran the identical assertion with the old 5s joins: FAILED with
  `org.opentest4j.AssertionFailedError at Run31HypothesisScratchTest.java:117` -- same assertion,
  same failure shape, confirming the mechanism by reproduction rather than by inspection alone.
  Fix applied to the real test: widened both `threadX.join(...)` calls (save test and its sibling
  delete test) and `waitUntilBothRead()`'s `bothRead.await(...)` from 5s to 30s in
  `DefaultConceptGatewayDegradedConcurrencyTest.java`, each with a comment noting these are
  hang-safety nets widened for RUN-31, not part of the race logic. Verified:
  `:kernel:test --tests DefaultConceptGatewayDegradedConcurrencyTest --rerun-tasks` BUILD SUCCESSFUL;
  full `:kernel:test --rerun-tasks` also run to confirm no regressions elsewhere.
