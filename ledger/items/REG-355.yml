id: REG-355
title: >-
  Java a browser AI writes (a capability, a conversion hook) is accepted by the relay when the machine's code setting is `all`, but cannot be added to an app from here: nothing writes it into the generator's hash-pinned extension manifest
type: FEATURE
severity: LOW
status: DONE
opened: 2026-11-21
closed: 2026-11-26
verification: VERIFIED_LIVE
source: >-
  Split out of REG-354 (owner, 2026-11-21: "default A, but on my environment C -- accept all"). The setting, the confirmation, the provenance record and removal exist and are
  proven for JavaScript pages; Java needs the generator side.
surface: cli/relay, generator/extensions, kernel/security
files:
  - NPDevCli/npdev_relay_codepolicy.py
  - NPDevCli/npdev_relay_engine.py
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/emitters/UntrustedExtensionEmitter.java
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/emitters/UntrustedExtensionManifest.java
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/emitters/PluginJavaSourcePolicy.java
  - NPDevKernel/kernel/src/main/java/com/npdev/kernel/security/UntrustedExtensionBytecodeInspector.java
detail: |
  Today, with relay.codeFromBrowserAi = all, an answer carrying capabilities/*.java or conversion-hooks/* passes ingest (status allowed, `code.kind` java-capability / conversion-hook, a scan in words)
  and is then sent back NEEDS_FIX with one sentence ("cannot be added to an app from here yet ... a JavaScript page under web/ is fine"); nothing is half applied (test_relay_codepolicy).
  Why it is not just "write the file": the generator reads Java only through <model folder>/trusted-source-manifest.json (hash-pinned sources) and the model's procedure/panel/widget/flow
  references (UntrustedExtensionManifest.referencesFrom / validateHash), after PluginJavaSourcePolicy (source) and the kernel's UntrustedExtensionBytecodeInspector (bytecode) -- the platform's own
  safeguard for Java, which is the right one to reuse instead of the relay inventing a second. So the work is: (1) the AI must be told the extension contract (class shape, NPDevProcedureContext,
  the model reference) and the briefing measured; (2) the relay writes the source AND a manifest entry with its sha256 AND checks that the model references it; (3) the generation-time policy
  and inspector refusals reach the person in words; (4) Undo and remove-code remove all three; (5) one real round on the Manager window.
  DONE 2026-11-21 (code, parts 1 partly, 2, 4): the first Java kind is `java-extension` -- ONE class bound to a FLOW (the platform's own seam: flows[].metadata.untrustedExtensionEntrypoint + a
  manifest entry of kind `flow`), not the invented capabilities/* path (java-capability and conversion-hook stay "cannot be added from here": different seams with no manifest of their
  own). NPDevCli/npdev_relay_extensions.py: `extensions/<Name>.java` is accepted only with the machine setting at `all` and one confirmation; before anything is accepted the engine checks the class
  contract (`public final class <Name>` with `Map<String,Object> execute(NPDevProcedureContext ctx)`, 30 000 characters), that exactly one flow names it, that the app has a role (admin if
  there is one, else the first; never none), and that no flow names a class that exists nowhere; the manifest entry is MADE by the relay (the sha256 is computed here, never taken from the AI),
  merged with the entries already there and written in the same all-or-nothing step as the class, the record and model.json, so Undo removes all of it (test: snapshot equals the one before);
  `remove-code` removes the class and its entry (the last entry removes the manifest) and returns javaExtensions[<path>] = {manifest, stillNamedBy} because the model is the author's and is not
  edited (a flow still naming a removed class fails generation closed). The briefing for mode `all` tells the AI the class contract. A new-app conversation refuses a class (it belongs to an
  existing app). Cross-language guard: NPDevGenerator .../test/resources/relay-java-extension is the folder the relay writes, UntrustedExtensionRelayWrittenTest generates an app from it (the
  trusted class and a registry entry bound to the flow and role ADMIN appear; a class edited after pinning is refused by the hash) and test_relay_extensions pins the fixture to manifest_text.
  Tests: test_relay_extensions 12, the relay suite 567, UntrustedExtension* generator tests.
  STILL OPEN: (1) the briefing text was not measured with a real browser AI (does it send the class, the flow and a role in one answer?); (3) a refusal by PluginJavaSourcePolicy or the bytecode inspector
  happens at GENERATION and reaches the person only as the generator's own error, not yet as a sentence in the Manager (the relay's scan lists what the class does, in words, before the tick);
  (5) no real chat AI was asked for a Java class. DRIVEN on the real installed Manager 0.13.43 (scratch canary copy, scripted answer): the class showed ONE required box saying it runs on the app's server, Apply was off until
  it was ticked, nothing was written before Apply, then extensions/Greeter.java was byte for byte, the manifest entry bound it to flow:GreetFlow and role admin with the sha256 of the file on disk, model.json named it,
  browser-ai-code.json recorded it as java-extension, and Undo removed the class, the entry and the record and restored model.json. PROVEN in the Manager too (second run, a scratch app laid out like the Manager's own: model folder `<name>` + `<name>-app`; the first run's folder was refused as "not an npdev-init app" before generating, and an earlier
  version of the tour's generation check passed vacuously on the generic "The app could not be built." -- both corrected): after Apply the Manager's generate_app_from_model ACCEPTED the pinned class and the platform emitted
  npdev-generated/src/main/java/com/npdev/generated/trusted/Greeter.java; the build that followed failed only at the forced missing-libs step (exit code 1, its log names "Missing NPDev RuntimeHost libs"); Undo removed the class,
  the manifest entry and the record and restored model.json (tour 16 of 16 checks, part B only). REFUSALS seen on the real Manager (NPDev_General__OutsideRepo/reg354-355-tour/refusal-tour.mjs, 7 of 8): the flow class goes through TrustedJavaSourcePolicy (a CLOSED import list: List, Map, Set, Optional, UUID,
  BigDecimal, Instant, no static or wildcard imports, and forbidden identifiers such as Thread, File, Runtime, System.exit), NOT PluginJavaSourcePolicy (that one is for plugins, capabilities and hooks). The first
  briefing said "use only java.util", which would let an AI write java.util.ArrayList and be refused only at generation, so the import rule is now MIRRORED in npdev_relay_extensions (pinned to the Java sets by
  test_relay_extensions) and the briefing lists the allowed imports. R1 (an ArrayList import) is sent back at paste time naming the import and the allowed list, nothing written. R2 (Thread.sleep, which the relay
  cannot see) is accepted and ticked, then the platform refuses at generation: "Forbidden Java source use in extensions/Greeter.java: forbidden method call Thread.sleep; forbidden identifier Thread" -- but the
  window shows it INSIDE the generator log with the Java stack trace (`Exception in thread "main" java.lang.IllegalStateException ... at com.npdev.generator...`), so the person does not read a sentence (the one
  failing check). Undo took every part out. DONE 2026-11-21 (3, the sentence): Manager 0.13.44 recognises the generator's `Forbidden Java source use in <file>: <reasons>` and `Trusted|Plugin Java source syntax error in <file>: <reasons>` (browserai.js javaRefusal, in the
  generate_app_from_model catch) and shows one sentence instead of the log with its stack trace: headline "The platform refused the Java class the AI wrote.", details "<file> uses something a flow class may not use: <reasons>.
  Press Undo to take the class out of your app, or ask the AI for a version without it." (a syntax error says "has a writing mistake"), both with Portuguese entries in ui/i18n/pt.json (the reasons stay the generator's own
  identifiers). Guards: a render-check scenario (check-manager-ui-render.mjs, 403/403) that feeds the real error text and asserts the sentence, no stack trace, no fix button, no build run; check-manager-i18n; and the real
  window: installed 0.13.44, refusal tour 9 of 9 (R1 ArrayList sent back at paste time, R2 Thread.sleep refused at generation and READ AS A SENTENCE, Undo took every part out). The Portuguese rendering of the sentence was not
  looked at in the window (only the catalogue entries are checked). STILL OPEN: the kernel's bytecode inspector (a boot gate) on a real boot; a real build of an app with the class (the libs were forced missing); a real chat AI asked
  for a class.
  OWNER DECISIONS 2026-11-24 ("all recommended"): (14) java-capability and conversion-hook are declared UNSUPPORTED from a browser AI -- they have no manifest seam and conversion hooks are SQL/declarative
  (boundary B13); the relay keeps its sentence for them and nothing is built; only the flow-bound `extensions/<Name>.java` kind is in scope here. (13) the real chat-AI round (a Java class) is one pilot
  sitting with the owner: a prepared prompt and steps, the owner pastes the AI's answer back; it does not block anything.
  READ 2026-11-25 (not run): the boot gate named in STILL OPEN, PluginBytecodeBootGate, reads npdev/plugin-bytecode/plugin-owned-classes.txt, which RuntimeApiEmitter writes for the classes of MOUNTED PLUGINS only
     (emitPluginBytecodeGateManifestIfNeeded). The relay's `extensions/<Name>.java` is a flow-bound trusted class (TrustedJavaSourcePolicy, emitted as generated/trusted/<Name>.java and compiled with the app), so whether
     that gate ever sees it was NOT established; it may not apply to this kind at all. A real boot of an app built with a relay-written class (generate, build, boot, call the flow) would settle it; it needs a full app
     definition (config, db, smoke plan) around the fixture and was not built in the 2026-11-25 session. Not the owner's pilot: no chat AI is needed for it.
  ANSWERED 2026-11-25 by reading the code that builds the gate's list (no boot): the manifest is fed from exactly two sources, `emitJavaSourceMounts` and `emitJavaControllerMounts` (RuntimeApiEmitter lines 296-298),
  both PLUGIN mount plans; a flow-bound `extensions/<Name>.java` is never in it, so PluginBytecodeBootGate does NOT see this kind of class. The safeguard for it is the generation-time `TrustedJavaSourcePolicy`, which is
  stricter than the bytecode denylist: a CLOSED import list (List, Map, Set, Optional, UUID, BigDecimal, Instant; no static or wildcard import) plus forbidden identifiers (Runtime, Process, ProcessBuilder, Class, ClassLoader,
  ServiceLoader, Thread, File, Path, URL, URI, Socket, HttpClient, Method, Field, MethodHandles, ScriptEngine, Executor, CompletableFuture), the java.io/nio.file/net/reflect/invoke/concurrent/script prefixes, and System.exit/
  getenv/getProperty-style calls. So the done_when's "or the bytecode inspector rejects it" does not apply to a flow-bound class: it is refused by the source policy (seen on the real window, R1/R2 above). Considered as an OPTIONAL
  hardening (also list the flow-bound class resources in the gate's manifest) and NOT BUILT, after reading the inspector (2026-11-25, owner said yes to "the optionals", then the code said no): UntrustedExtensionBytecodeInspector bans
  java/lang/invoke/LambdaMetafactory (its own javadoc, "the denylist's intended ..."), while neither TrustedJavaSourcePolicyVisitor nor PluginJavaSourcePolicyVisitor mentions lambdas, so a lambda or method reference in a flow
  class (`list.forEach(x -> ...)`, with java.util.List allowed) passes the source policy today and WORKS; with the class in the gate's manifest the app would refuse to BOOT (B30) with no sentence for the person, a regression for a
  benefit that is mostly redundant (the source policy is an import allow-list, and the identifiers the two lists share -- Runtime, Process, ProcessBuilder, Class, ClassLoader, ServiceLoader, Thread, ThreadLocal, Timer, the
  executors -- are forbidden in both; the one thing only the inspector bans is the lambda machinery). To build it right, one of two changes comes first: an inspector mode that lets a flow-bound class use LambdaMetafactory (kernel +
  generator + RuntimeHost, three modules and the twin-pair rule), or a source rule that says "no lambdas" up front (breaks authors). Neither is worth it without a real incident; leave as is unless a flow class ever gets past
  the source policy.
  DONE 2026-11-26, THE PILOT (round B; same setup as REG-354's pilot paragraph: installed Manager 0.13.44, scratch copy of the canary, Gemini "Neon" at high effort, real clipboard round trip). Ask "Add a flow written in Java that returns the
  tenant id": ONE answer, outcome READY at round 1 (prompt 44,853 bytes, answer 7,444 bytes). The briefing question is answered YES: the AI sent the class, the flow that names it (GetTenantId, bound to CanaryTask with the placeholder step)
  and a role (Operator, full CRUD on the two concepts + EXECUTE_FLOW) in ONE answer. The preview asked ONE box (the class runs on the app's server); Apply stayed off until ticked. The relay wrote extensions/GetTenantId.java, a manifest entry
  (flow-gettenantid, kind flow, runtimeBinding flow:GetTenantId, requiredRole Operator, sha256 computed by the relay and equal to the file's), browser-ai-code.json (java-extension, origin browser-ai) and three changes in model.json (flow, role,
  version 1.0 -> 1.1). The platform ACCEPTED the class: the generated app holds npdev-generated/.../trusted/GetTenantId.java and build/classes/.../trusted/GetTenantId.class, and the app BOOTED (health 200). This closes "a real build of an app with
  the class" and "a real chat AI asked for a class". Undo ("Desfeito. Seu app esta como antes."): class, extensions/, manifest, record gone, model.json and the other 3 files byte for byte the original. The platform's refusal sentence was not
  seen with a real AI (the AI's class was valid); it is proven with scripted answers on the real window (R1/R2 above). Not exercised: Manager Remove button on a Java class (the CLI's forget() is covered by test_relay_extensions) and calling the flow
  (the app needs sign-in). The scratch app, its two relay conversations and its process were removed afterwards; the two conversations are kept in NPDev_General__OutsideRepo/reg354-355-pilot/evidence.
guard:
  kind: test
  ref: NPDevCli/tests/test_relay_extensions.py
  asserts: >-
    a flow-bound extensions/<Name>.java is accepted only with the machine setting at `all` and one confirmation, after the class contract, the closed import list and the flow/role checks; the relay computes the manifest entry's sha256 itself;
    Undo restores the snapshot and remove-code takes class, manifest entry and record out; UntrustedExtensionRelayWrittenTest generates an app from the relay's own output and refuses a class edited after pinning.
  provenRed: false
done_when: >-
  With the setting at `all`, a browser AI's answer that adds a Java procedure referenced by the model is confirmed by the owner, written with its manifest entry, generated, and refused in words when
  PluginJavaSourcePolicy or the bytecode inspector rejects it; Undo and remove-code take every part out; proven on the real Manager window.
