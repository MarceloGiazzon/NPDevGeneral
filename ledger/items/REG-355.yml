id: REG-355
title: >-
  Java a browser AI writes (a capability, a conversion hook) is accepted by the relay when the machine's code setting is `all`, but cannot be added to an app from here: nothing writes it into the generator's hash-pinned extension manifest
type: FEATURE
severity: LOW
status: PARTIAL
opened: 2026-11-21
source: >-
  Split out of REG-354 (owner, 2026-11-21: "default A, but on my environment C -- accept all"). The setting, the confirmation, the provenance record and removal exist and are
  proven for JavaScript pages; Java needs the generator side.
surface: cli/relay, generator/extensions, kernel/security
files:
  - NPDevCli/npdev_relay_codepolicy.py
  - NPDevCli/npdev_relay_engine.py
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/emitters/UntrustedExtensionEmitter.java
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/emitters/UntrustedExtensionManifest.java
  - NPDevGenerator/generator/src/main/java/com/npdev/generator/emitters/PluginJavaSourcePolicy.java
  - NPDevKernel/kernel/src/main/java/com/npdev/kernel/security/UntrustedExtensionBytecodeInspector.java
detail: |
  Today, with relay.codeFromBrowserAi = all, an answer carrying capabilities/*.java or conversion-hooks/* passes ingest (status allowed, `code.kind` java-capability / conversion-hook, a scan in words)
  and is then sent back NEEDS_FIX with one sentence ("cannot be added to an app from here yet ... a JavaScript page under web/ is fine"); nothing is half applied (test_relay_codepolicy).
  Why it is not just "write the file": the generator reads Java only through <model folder>/trusted-source-manifest.json (hash-pinned sources) and the model's procedure/panel/widget/flow
  references (UntrustedExtensionManifest.referencesFrom / validateHash), after PluginJavaSourcePolicy (source) and the kernel's UntrustedExtensionBytecodeInspector (bytecode) -- the platform's own
  safeguard for Java, which is the right one to reuse instead of the relay inventing a second. So the work is: (1) the AI must be told the extension contract (class shape, NPDevProcedureContext,
  the model reference) and the briefing measured; (2) the relay writes the source AND a manifest entry with its sha256 AND checks that the model references it; (3) the generation-time policy
  and inspector refusals reach the person in words; (4) Undo and remove-code remove all three; (5) one real round on the Manager window.
  DONE 2026-11-21 (code, parts 1 partly, 2, 4): the first Java kind is `java-extension` -- ONE class bound to a FLOW (the platform's own seam: flows[].metadata.untrustedExtensionEntrypoint + a
  manifest entry of kind `flow`), not the invented capabilities/* path (java-capability and conversion-hook stay "cannot be added from here": different seams with no manifest of their
  own). NPDevCli/npdev_relay_extensions.py: `extensions/<Name>.java` is accepted only with the machine setting at `all` and one confirmation; before anything is accepted the engine checks the class
  contract (`public final class <Name>` with `Map<String,Object> execute(NPDevProcedureContext ctx)`, 30 000 characters), that exactly one flow names it, that the app has a role (admin if
  there is one, else the first; never none), and that no flow names a class that exists nowhere; the manifest entry is MADE by the relay (the sha256 is computed here, never taken from the AI),
  merged with the entries already there and written in the same all-or-nothing step as the class, the record and model.json, so Undo removes all of it (test: snapshot equals the one before);
  `remove-code` removes the class and its entry (the last entry removes the manifest) and returns javaExtensions[<path>] = {manifest, stillNamedBy} because the model is the author's and is not
  edited (a flow still naming a removed class fails generation closed). The briefing for mode `all` tells the AI the class contract. A new-app conversation refuses a class (it belongs to an
  existing app). Cross-language guard: NPDevGenerator .../test/resources/relay-java-extension is the folder the relay writes, UntrustedExtensionRelayWrittenTest generates an app from it (the
  trusted class and a registry entry bound to the flow and role ADMIN appear; a class edited after pinning is refused by the hash) and test_relay_extensions pins the fixture to manifest_text.
  Tests: test_relay_extensions 12, the relay suite 567, UntrustedExtension* generator tests.
  STILL OPEN: (1) the briefing text was not measured with a real browser AI (does it send the class, the flow and a role in one answer?); (3) a refusal by PluginJavaSourcePolicy or the bytecode inspector
  happens at GENERATION and reaches the person only as the generator's own error, not yet as a sentence in the Manager (the relay's scan lists what the class does, in words, before the tick);
  (5) no real chat AI was asked for a Java class. DRIVEN on the real installed Manager 0.13.43 (scratch canary copy, scripted answer): the class showed ONE required box saying it runs on the app's server, Apply was off until
  it was ticked, nothing was written before Apply, then extensions/Greeter.java was byte for byte, the manifest entry bound it to flow:GreetFlow and role admin with the sha256 of the file on disk, model.json named it,
  browser-ai-code.json recorded it as java-extension, and Undo removed the class, the entry and the record and restored model.json. PROVEN in the Manager too (second run, a scratch app laid out like the Manager's own: model folder `<name>` + `<name>-app`; the first run's folder was refused as "not an npdev-init app" before generating, and an earlier
  version of the tour's generation check passed vacuously on the generic "The app could not be built." -- both corrected): after Apply the Manager's generate_app_from_model ACCEPTED the pinned class and the platform emitted
  npdev-generated/src/main/java/com/npdev/generated/trusted/Greeter.java; the build that followed failed only at the forced missing-libs step (exit code 1, its log names "Missing NPDev RuntimeHost libs"); Undo removed the class,
  the manifest entry and the record and restored model.json (tour 16 of 16 checks, part B only). REFUSALS seen on the real Manager (NPDev_General__OutsideRepo/reg354-355-tour/refusal-tour.mjs, 7 of 8): the flow class goes through TrustedJavaSourcePolicy (a CLOSED import list: List, Map, Set, Optional, UUID,
  BigDecimal, Instant, no static or wildcard imports, and forbidden identifiers such as Thread, File, Runtime, System.exit), NOT PluginJavaSourcePolicy (that one is for plugins, capabilities and hooks). The first
  briefing said "use only java.util", which would let an AI write java.util.ArrayList and be refused only at generation, so the import rule is now MIRRORED in npdev_relay_extensions (pinned to the Java sets by
  test_relay_extensions) and the briefing lists the allowed imports. R1 (an ArrayList import) is sent back at paste time naming the import and the allowed list, nothing written. R2 (Thread.sleep, which the relay
  cannot see) is accepted and ticked, then the platform refuses at generation: "Forbidden Java source use in extensions/Greeter.java: forbidden method call Thread.sleep; forbidden identifier Thread" -- but the
  window shows it INSIDE the generator log with the Java stack trace (`Exception in thread "main" java.lang.IllegalStateException ... at com.npdev.generator...`), so the person does not read a sentence (the one
  failing check). Undo took every part out. STILL OPEN: (3) a Manager sentence for a generation refusal (browserai.js stop() could recognise `Forbidden Java source use in <file>: <reasons>` and say it in words, with a
  Portuguese text; needs a Manager rebuild, a version bump and the render check); the kernel's bytecode inspector (a boot gate) on a real boot; a real build of an app with the class (the libs were forced missing).
done_when: >-
  With the setting at `all`, a browser AI's answer that adds a Java procedure referenced by the model is confirmed by the owner, written with its manifest entry, generated, and refused in words when
  PluginJavaSourcePolicy or the bytecode inspector rejects it; Undo and remove-code take every part out; proven on the real Manager window.
