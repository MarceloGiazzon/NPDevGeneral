id: W1.2
title: >-
  WorkspaceMenuSeeder has two seed modes and NEITHER reconciles -- insert-if-empty returns
  immediately once the table has any row, so a model/menu.json change never reaches the nav;
  upsert-if-fingerprint-changed deletes every row for the tenant (including every manual edit an
  app author made via generic CRUD) on ANY change. The author has to choose between a navigation
  the model can never correct and one that destroys their work on every redeploy.
