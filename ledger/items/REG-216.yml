id: REG-216
title: >-
  An aggregate root's auto-synthesized Selection panel "New" button eagerly attempts a blank
  conceptMutation create, which can never succeed once the root concept has any required field
  beyond id -- the working mechanism (open the paired Workbench's own empty-shell "new" page) is
  already proven live one click away and unused by this button
type: GAP
severity: MEDIUM
status: DONE
opened: 2026-09-19
closed: 2026-09-19
verification: VERIFIED_LIVE
source: >-
  Found live alongside REG-215 while browser-verifying NPDEV_MEGA_ROADMAP.md Session 8/11 against
  WmsOffice (:8084). After REG-215 fixed the id-merge bug, MovimentoSelection's "New" button still
  fails (now on Movimento.entidadeId, a real required business field) because it always tries to
  persist a fully-blank record in one shot.
surface: >-
  NPDevContract/dsl/src/main/java/com/npdev/dsl/v1/compiler/AutoPanelExpander.java
  (newRecordAction/selectionPanel, ~lines 240-244), NPDevGenerator's business-ui-app.mustache
  (renderDeclaredPanel's per-action button loop, app.js ~line 1905: executeDeclaredPanelAction).
detail: |
  The WORKING flow already exists and was verified live in the same session: navigating directly
  to /npdev-workbench/MovimentoWorkbench.html and clicking ITS OWN "New" button loads
  ?id=new -- an empty editable shell (header fields + itens/posicoes bands + Save/Sugerir
  Destino/Sugerir Origem/Recalcular Saldos), matching PanelRuntime.loadWorkbench's documented
  "no id -> empty descriptor" contract (com.finalexec.npdev.service.PanelRuntime:819-853) and
  workbench-page.html.mustache's openRow("new") (wbId = "" for the "new" id). Adding a row and
  clicking "Recalcular Saldos" genuinely returns "Balanced." -- the whole depth-2/balance primitive
  works end-to-end THROUGH THIS PAGE.

  The auto-generated Selection panel (MovimentoSelection, rendered inside the generic
  npdev-business-ui shell, NOT the dedicated workbench page) is a SEPARATE, parallel surface for
  the same aggregate root. Its "New" button was wired by AutoPanelExpander to the generic
  conceptMutation "new" action (newRecordAction) -- the same mechanism an ordinary flat concept's
  Selection panel uses successfully via openForm's inline create-then-submit form (see
  business-ui-app.mustache ~line 3134) -- but Movimento (and presumably every aggregate root with
  more than an id) can never satisfy a blank create, by design: the whole point of an aggregate is
  that its required shape is filled in across the multi-band editor, not a flat form.

  WHAT WOULD CLOSE IT: give the Selection panel's compiled metadata a link to its paired workbench
  (mirroring the WORKBENCH panel's own `metadata.put("selectionPanel", selectionPanelName)` at
  AutoPanelExpander.java:227, but in reverse -- e.g. `metadata.put("workbenchPanel", base +
  "Workbench")` on the selectionPanel built at line 240-244), and either (a) drop
  newRecordAction from the aggregate-root Selection panel entirely, replacing its "New" button with
  a plain client-side navigation to the paired workbench's own url (the same
  `panelMeta.workbenchUrl` field renderDeclaredPanel already reads at app.js:1855, applied to just
  the button instead of the whole panel body), or (b) special-case action.name === "new" in the
  per-action button loop (app.js ~1905-1911) to navigate instead of calling
  executeDeclaredPanelAction whenever panelMeta.workbenchPanel is present. (a) is more consistent
  with the existing workbenchUrl precedent and needs no new client dispatch branch beyond reusing
  the link-rendering the Workbench panel already has.

  Deliberately NOT attempted in the same session as REG-215: this touches the DSL compiler AND the
  169KB generated-per-app business-ui-app.mustache (CLAUDE.md: do not full-read, high blast radius
  across every generated app) -- a considered two-layer change, not a narrow bug patch. REG-215's
  fix stands on its own (a real, general defect, fully fixed and verified); this item is the
  correctly-scoped follow-on for the remaining UX gap.
  Done when: clicking "New" on an aggregate root's Selection panel (e.g. MovimentoSelection) lands
  the user on the paired Workbench's empty-shell editor, with no server round-trip attempting a
  blank create.

  FIX APPLIED 2026-09-19: applied option (a) from the candidates above, close to the letter --
  `AutoPanelExpander.aggregateWorkbench()` (NPDevContract/dsl/.../compiler/AutoPanelExpander.java,
  ~line 240) now stamps the aggregate-root Selection panel's own metadata with
  `workbenchPanel: <base>Workbench` (the reverse of the Workbench panel's existing
  `metadata.selectionPanel` back-reference at line 227). `BusinessUiEmitter.panelNodes()`
  (NPDevGenerator/.../emitters/BusinessUiEmitter.java) reads that key and emits a
  `newWorkbenchUrl: /npdev-workbench/<Workbench>.html?id=new` field on the panel's boot-manifest
  node whenever it's present -- the same `?id=new` convention the Workbench page's own "New" button
  already uses, not a new one. `business-ui-app.mustache`'s per-action button loop
  (`renderDeclaredPanel`) special-cases `action.name === "new"` when `panelMeta.newWorkbenchUrl` is
  set: instead of the generic `executeDeclaredPanelAction` (a conceptMutation POST), it renders the
  same-styled button wired to a plain `window.location.href` navigation -- zero server round-trip.
  The plain (non-aggregate) Selection panel helper used for ordinary flat concepts
  (`AutoPanelExpander.selectionPanel()`, ~line 889) is untouched, so the new behavior cannot leak
  onto a concept that has no paired Workbench.

  Regression tests added on both sides of the plumbing: `AggregateWorkbenchExpansionTest` (DSL)
  asserts `selection.metadata().get("workbenchPanel")` equals `"ExpedicaoWorkbench"`;
  `BusinessUiEmitterWorkbenchTest` (generator) asserts the emitted
  `generated-ui-manifest.json` contains
  `"newWorkbenchUrl":"/npdev-workbench/ExpedicaoWorkbench.html?id=new"`. Both green
  (`AggregateWorkbenchExpansionTest`: 11/11, 0 failures/errors;
  `BusinessUiEmitterWorkbenchTest`: 3/3, 0 failures/errors -- verified via each suite's own
  test-results XML, not just gradle exit code). An independent code-review pass (code-review skill,
  medium effort, no findings) confirmed the client-side special-case sits after the existing
  `scope==="row"`/`visibleWhen` guards, returns early so it can't fall through to the generic
  action-button path, and computes its `disabled` state the same way the generic path does.

  LIVE VERIFICATION (real browser, not REST): regenerated+rebuilt a fresh `wmsoffice` FinalApp
  (`D:\WorkSpace\NPDev\Build\generated-finalapps\wmsoffice`, port 8100, fresh empty H2) via
  `Rebuild-And-Restage.ps1 -AppFolder D:\WorkSpace\NPDev\Build\wmsoffice-browser -SkipLibs`
  (generator-runtime cache refreshed; runtimehost-libs untouched since this fix has no
  kernel/adapter changes). The scratch build root had no `wmsoffice-keys/` (regeneration doesn't
  spare it, same known gap as REG-220's follow-up note) -- worked around identically to that prior
  session by generating a fresh throwaway dev RSA keypair via `openssl genpkey`/`openssl rsa
  -pubout`. Bootstrapped a fresh ADMIN user via the app's own self-disabling
  `POST /api/auth/bootstrap-admin` (only works while the identity tables are empty), then a real
  `POST /api/auth/login` for a JWT. Drove the app through ScrapForAI (headless Chromium):
  navigated to `/npdev-business-ui/`, injected the JWT into `localStorage['npdev.shell.token']`
  (the same key `login.html` itself writes), re-navigated so the shell picked it up, hash-routed to
  `#concept-__panel-MovimentoSelection__`, and clicked the panel's real "New" button. RESULT:
  the browser navigated to `http://127.0.0.1:8100/npdev-workbench/MovimentoWorkbench.html?id=new`
  -- the Workbench's genuine empty-shell editor (blank Header fields, `itens` grid at "0 rows",
  Save/Sugerir Destino/Sugerir Origem/Recalcular Saldos buttons all present) -- with zero
  `pageErrors` and zero console errors of any kind. Screenshots:
  `D:\WorkSpace\NPDev\Build\scrapforai-artifacts\job_RI7J05ZlzjrI\screenshots\before_click_new.png`
  (MovimentoSelection panel, "New" button visible) and `...\after_click_new.png` (the landed
  Workbench empty-shell page). This is the exact scenario the guard below was proven red against
  pre-fix (job_7otCE9C02yKL, a 500 on Movimento.entidadeId) -- now green, no server call at all.
guard:
  kind: live
  ref: ScrapForAI click "New" on http://127.0.0.1:8100 MovimentoSelection (job_RI7J05ZlzjrI)
  asserts: clicking "New" navigates client-side to /npdev-workbench/MovimentoWorkbench.html?id=new with zero server round-trip and zero page/console errors
  provenRed: true
