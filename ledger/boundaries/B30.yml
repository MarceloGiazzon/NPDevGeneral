id: B30
title: "Plugins are admission-checked, not sandboxed -- plugin:java-source runs OS-process-isolated with a memory/CPU ceiling; plugin:java-controller still runs in-process with the application's full privileges"
codeLinked: true
codeLinkedNote: >-
  2026-08-27 (SEC-3 remediation, Model A). SHIPPED the two admission gates over the shared
  constant-pool inspector `com.npdev.kernel.security.TrustedSourceBytecodeInspector` (moved into
  NPDevKernel from the generator so both sides consume one denylist; pool-resolving, boundary-safe
  exact-owner matching, curated java.util.concurrent.* set so benign primitives like the shipped
  auditLog capability's AtomicLong stay usable): (1) GENERATION time -- `PluginJavaSourcePolicy`
  (NPDevGenerator, source-AST twin of the bytecode policy, rule sets DERIVED from the kernel
  constants) refuses emission of plugin:java-source/plugin:java-controller source referencing
  forbidden capability escapes; (2) BOOT time -- `PluginBytecodeBootGate` (NPDevRuntimeHost), a
  Spring bean that reads the generator-written per-app manifest
  `npdev/plugin-bytecode/plugin-owned-classes.txt` (npdev-plugin-bytecode-gate twin-pair token),
  inspects every listed class file's COMPILED bytecode plus its `$`-siblings (inner/anonymous
  classes compile to separate files invisible to a top-level-only listing), and refuses app start
  with `new BoundaryBootException(new BoundaryViolation("B30", "boot",
  "B30:plugin_bytecode_violation: ...", Instant.now()))` on any DIRECT reference (filesystem/
  network IO, Runtime/Process/ProcessBuilder, reflection, Class/ClassLoader/ServiceLoader, Thread/
  ThreadLocal/Timer, executor/async detachment incl. TimeUnit, javax.script., sun./jdk. internals,
  java.lang.System.exit/getenv/getProperty*). Verified live: 8 kernel inspector tests + 12
  generator PluginJavaSourcePolicyTest cases + 5 PluginBytecodeBootGateTest boot-refusal tests
  (System.exit, filesystem, socket, process, detached-async, lambda/inner-class escapes refused;
  Runtime-exception neighbours and AtomicLong accepted).

  2026-09-01 (SEC-5, SEC-6) + 2026-09-02 (SEC-7): Model B SHIPPED for `plugin:java-source`
  specifically, superseding this row's original "SEC-3 stays OPEN only for the process-isolation
  (Model B) track: memory/CPU" close. Every `plugin:java-source` invocation now dispatches through
  `PluginIpcChildProcessPool` (`NPDevRuntimeHost/.../npdev/service/pluginipc/`) -- a real, separate
  OS process per worker (JVM child, IPC over stdin/stdout, `@argfile`-passed classpath), wired into
  production dispatch (`PluginIpcCapabilityHandler`, SEC-5) with its own measured timeout floor
  (`PluginTimeoutHint`, SEC-6: 5000ms vs the shared handler default of 1000ms, against a real
  measured 223-393ms cold start / 1-2ms warm). `PluginProcessResourceLimiter.forCurrentOs()`
  attaches a REAL OS-level ceiling per worker -- `PluginWindowsJobObjectResourceLimiter`
  (`CreateJobObjectW`+`SetInformationJobObject`+`AssignProcessToJobObject`, hard memory + CPU-rate
  caps, `JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE`) on Windows, `PluginLinuxCgroupResourceLimiter`
  (`systemd-run --scope`, `MemoryMax=`) on Linux -- degrading to `PluginNoOpResourceLimiter` (logs a
  loud WARNING the moment a non-zero limit is requested but unenforceable, firing at BOOT since pool
  workers start synchronously in the `@Bean` constructor, not only on first plugin invocation) when
  neither is available. SEC-7 turned the ceiling ON by default (previously wired but shipped at 0/0
  = unbounded): `npdev.runtime.plugin-ipc-pool.memory-limit-mb=512` /
  `.cpu-rate-percent=50` in the RuntimeHost template's `application.properties` (copied into every
  generated app), chosen from a real measurement against the lib-probe app's Guava-hashing
  SignWithLibrary flow through the real HTTP dispatch path (8 calls + a CRUD create, real
  `WorkingSetSize` sampled via `Win32_Process`): peaked at ~91MB per child worker under a live
  512MB Job Object ceiling, all calls succeeded -- 5.6x headroom, left generous rather than tightened
  to the observed peak (see `ledger/items/SEC-7.yml`). QUAL-51 (2026-09-01) had already root-caused
  and fixed the adjacent startup-commit hazard (HotSpot's ergonomic `InitialHeapSize` -- physical/64
  -- committing past a modest ceiling before the JVM's own `main()` runs, independent of workload)
  with an explicit scaled-down `-Xms` whenever a memory ceiling is configured.

  The boundary's residue is now narrower, not gone: `plugin:java-controller` is UNCHANGED (still
  in-process, memory/CPU unbounded -- Model B was scoped to `plugin:java-source` only). Package 4.4
  (B30-B, REG-204, 2026-09-03) answers the open design question `BOUNDARY_LIFT_PLAN_2026-09-02.md`
  wave 4 posed: `plugin:java-controller` is declared a TRUSTED tier BY DESIGN, not a gap awaiting a
  fix -- a controller mount is a raw Spring `@RestController` wired by `DispatcherServlet`, with no
  `CapabilityCall` interception point a process boundary could sit behind (SEC-5's own reason for
  excluding it from the IPC pool). `RuntimeApiEmitter.emitJavaControllerMounts` now prints a
  generation-time warning naming each mounted controller's capability, so an author sees the trust
  tier for every app that actually mounts one. Servlet-level interception remains a recorded,
  deliberately-not-built option, revisited only if third-party plugin distribution becomes a
  product goal. Static analysis at
  both ends is still the ONLY admission gate -- a proxy class elsewhere on the app classpath that
  performs a forbidden capability on the plugin's behalf, or a plugin that busy-loops inside its own
  process without exceeding the memory/CPU ceiling, is still outside what either the bytecode
  inspector or the OS ceiling catches. A hostile, determined `plugin:java-source` is now BOUNDED
  (cannot exhaust host memory/CPU, cannot survive the wall-clock timeout by ignoring interrupt) but
  still not fully contained; a hostile `plugin:java-controller` is unchanged from Model A.

  2026-09-05 (SEC-9, REAL_LIFT_PLAN_2026-09-03.md package B2): the residue this row narrowed to on
  2026-08-27 -- "unchanged, still in-process, memory/CPU unbounded" -- is GONE. `plugin:java-controller`
  now crosses the process boundary the same way `plugin:java-source` and B13's Java migration hooks
  already do: `FinalExecApplication`'s `@ComponentScan` excludes the reserved
  `com.npdev.generated.plugin.*` package outright, so a mounted controller's copied source (still
  admitted through the unchanged `PluginJavaSourcePolicy.validatePluginJavaSource` escape check) never
  becomes a live Spring bean at all. `PluginControllerSecurityConfig` (app tree) registers a
  `SimpleUrlHandlerMapping` at `Ordered.HIGHEST_PRECEDENCE` pointing every mount's `basePath` at
  `PluginControllerProxyHandler` (runtimehost-core, reusable across any generated app); the proxy
  builds a request envelope (method, matched route, path variables, query params, JSON-or-string body)
  and dispatches it through the SAME `PluginIpcChildProcessPool` bean B1 built, using a new
  generation-time-derived route table (`npdev/plugin-runtime/plugin-controller-routes.json`, from a
  real AST pass -- `PluginControllerRouteVisitor` -- GeneratedPluginMountPlan runs alongside its
  existing regex-based basePath-containment check) so `ManifestDrivenJavaControllerPluginHandler`
  (the in-child dispatcher) can reflectively resolve and invoke the matched method. A minimal,
  explicitly-scoped parameter binder (no-arg / `@PathVariable` / `@RequestParam` / `@RequestBody`, each
  requiring an EXPLICIT annotation name so binding never depends on the `-parameters` compiler flag)
  is admitted at GENERATION time, not request time -- any other parameter shape
  (`HttpServletRequest`, `Authentication`, an injected service) is refused before the app ever exists.
  SEC-7's memory/CPU ceilings and killed-child/interrupted-checkout failure modes apply unchanged (same
  pool, no new isolation machinery); the proxy maps a killed/timed-out child to HTTP 504 rather than a
  hang or a 500. Callbacks are rejected in v1 (matching every other production `PluginIpcHostSession`
  caller today) -- a controller mount gets no DataSource, no Spring context, no host classloader, full
  stop; a real host-callback path is a separable follow-up. Verified live via
  `run-r10-plugin-controller-proof.py` against a real generated app
  (`NPDevSamples/probes/p7-plugin-controller`): the ADMIN-gated mount answers with the EXACT body the
  old in-process controller produced (indistinguishable to the caller), the SUPERUSER-gated mount still
  returns 403 for the same caller (D9's enforcement re-verified after a real bug -- the first attempt
  left the role interceptor wired the old `WebMvcConfigurer.addInterceptors` way, which a
  `SimpleUrlHandlerMapping` bean never auto-detects; fixed by attaching a basePath-scoped
  `MappedInterceptor` directly to the mapping instance), and a new `@PathVariable`/`@RequestParam`
  route proves the binder end to end through the generator's own emitted manifest. Manually confirmed
  via `Win32_Process` (SEC-7's own proof methodology): the booted app shows two real child `java.exe`
  processes running `PluginIpcChildProcessMain`, not an in-process stand-in. Cold/warm overhead measured
  (~514ms cold, ~7-13ms warm after the first couple of calls) -- comparable in shape to SEC-6's own
  java-source measurement, isolation left unconditional (no trusted-in-process opt-out was built,
  matching `plugin:java-source`'s own posture). **The boundary's residue is now the same statement B30's
  `plugin:java-source` half already carries**: static analysis at both ends is still the ONLY admission
  gate -- a proxy class elsewhere on the app classpath performing a forbidden capability on a mounted
  controller's behalf, or a controller busy-looping inside its own bounded process without exceeding
  the memory/CPU ceiling, is still outside what either the bytecode inspector or the OS ceiling catches.
  A hostile `plugin:java-controller` is now BOUNDED (cannot exhaust host memory/CPU, cannot survive the
  wall-clock timeout by ignoring interrupt) the same way `plugin:java-source` already was -- but still
  not fully contained. See `ledger/items/SEC-9.yml` for the full done-when list and the real bug found
  closing it.
ref: "docs/ACCEPTED_BOUNDARIES.md#B30"
classification: HITTABLE
