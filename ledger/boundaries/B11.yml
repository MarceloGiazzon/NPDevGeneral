id: B11
title: "H2 (and MySQL, STOR-2) have no transactional DDL -- a failed hook verifySql rolls back DML but not DDL"
codeLinked: true
codeLinkedNote: >-
  POSTURAL: the underlying engine limitation is still upstream behaviour, not a choice NPDev makes --
  H2 and MySQL commit DDL implicitly, so a rollback takes the DML and leaves the DDL, permanently, on
  those engines. BOUNDARY_LIFT_PLAN_2026-09-02.md package 3.4 (STOR-20) closed the SHAPE that exposes
  it (a hand-written hook mixing DDL with a verifySql could be authored blind) by making the boot
  REFUSE it outright, opt-in, before running the hook at all. **REAL_LIFT_PLAN_2026-09-03.md package
  A1 (STOR-21) goes one step further: the same shape can now be automatically SPLIT into idempotent,
  journaled phases and RUN, resuming past a real process crash, instead of only being refused.**
  `-Dnpdev.schema.conversionHooks.mixedDdlVerify=split` (a third opt-in value beside `warn`/`refuse`,
  default stays `warn`, unchanged -- same "no existing app breaks without notice on upgrade" reasoning
  STOR-20 used for `refuse`, and flipping the DEFAULT to `split` is likewise a deliberately deferred
  follow-up) decomposes the hook's SQL into single-statement phases via `ConversionHookPhaseSplitter`,
  rewriting each recognized DDL statement (ADD COLUMN / CREATE TABLE / CREATE [UNIQUE] INDEX) through
  the SAME `SqlDialect#guardedXxx` surface (STOR-5) generated `conversions[]` hooks already use, and
  recognizing `ALTER COLUMN SET|DROP NOT NULL` as idempotent by nature. `MigrationPhaseJournal` (a NEW
  table, `npdev_migration_phase_journal`) records each phase's completion BEFORE the next one starts,
  keyed by a `migrationId` stable across every boot converging the same schema transition -- so a boot
  that crashes mid-hook resumes on the next boot at the first phase not yet completed, never re-runs
  an already-applied phase, and never needs a human repair step. A statement the splitter does not
  recognize (a bare `DROP COLUMN`, an exotic `ALTER`) still BLOCKS the whole split and refuses before
  running anything, naming the exact statement -- `split` mode narrows the refusal's residue, it does
  not weaken it. Proven with a real killed child JVM (`MigrationKillMidPhaseCrashResumeTest` +
  `MigrationKillMidPhaseHarness`, `Runtime.halt()` mid-migration, not a simulated exception), not just
  unit-level reasoning. `refuse` and `warn` modes are UNCHANGED (their existing tests re-run
  unmodified). A remedy sentence is still also appended to PartialApplicationTruth#afterRollback's
  truthful diagnosis, for the case a mixed hook runs anyway (warn mode, or an engine the pattern
  doesn't match). Rule 5 (post-hook re-diff) is unchanged, the engine-independent backstop. Open,
  owner-only (B11.4, deliberately unanswered in the row itself): whether H2 (file) should remain the
  zero-prerequisite default engine given that it is the one engine where a failed conversion hook can
  leave DDL applied and DML rolled back -- a product tradeoff, not an engineering question this entry
  can resolve.
