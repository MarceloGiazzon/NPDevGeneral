id: B11
title: "A mixed-DDL conversion hook is split into guarded, journalled, resumable phases BY DEFAULT on the engines that need it"
codeLinked: true
codeLinkedNote: >-
  LIFTED 2026-09-08 by POSTURAL_LIFT_PLAN_2026-09-07.md package P7 (ledger/items/STOR-35.yml): the
  row's own deferred follow-up -- "flipping the DEFAULT to split" -- is done, with the safety
  package the flip required. The engine limitation itself is unchanged and permanent (H2/MySQL
  commit DDL implicitly; Postgres/SQL Server roll back fully -- upstream behaviour, never a code
  choice). What changed: -Dnpdev.schema.conversionHooks.mixedDdlVerify now DEFAULTS to split. A
  hook that mixes DDL with a verifySql on a non-transactional-DDL engine is decomposed into
  single-statement phases via ConversionHookPhaseSplitter, each rewritten to its dialect-guarded
  idempotent form -- the recognised vocabulary grew from (ADD COLUMN / CREATE TABLE / CREATE
  [UNIQUE] INDEX / ALTER COLUMN SET|DROP NOT NULL) to also include DROP INDEX (routes through the
  existing SqlDialect.guardedDropIndexIfExists) and ALTER TABLE ... DROP COLUMN (new
  SqlDialect.guardedDropColumn: native DROP COLUMN IF EXISTS on H2/Postgres/SQL Server, an
  information_schema-gated PREPARE/EXECUTE on MySQL 8, which has no IF EXISTS) -- and journaled in
  npdev_migration_phase_journal before the next one starts, so a crash mid-hook resumes at the
  first incomplete phase. A statement the splitter still cannot render idempotent (an in-place type
  change, a RENAME COLUMN -- the column's current live shape is unknowable to the splitter, so
  blocking is the honest answer and it stays) does NOT begin refusing under the new default: the
  mode tracks EXPLICIT vs DEFAULT as a real field (ResolvedMixedDdlVerify), and a default-mode
  splitter-block falls back to the previous warn-and-proceed behavior with the named log line
  B11:split_blocked_fell_back_to_warn: -- no app that boots today stops booting. An EXPLICIT =split
  still refuses with B11:mixed_ddl_verify_refused: naming the exact statement; =warn and =refuse
  set explicitly behave exactly as before. Proven: the crash-resume test now also runs with NO
  property set at all (MigrationKillMidPhaseCrashResumeTest#aKilledMigrationResumesThroughTheDefaultSplitModeWithNoPropertySet,
  the child asserts the property is null), in addition to the original explicit-split case, and
  -Dnpdev.schema.conversionHooks.mixedDdlVerify=warn restores the previous behaviour byte-for-byte.
  BREAKING.md carries the prescribed entry. Open, owner-only (B11.4, ASKED 2026-09-08, ANSWERED:
  the owner decided H2 (file) REMAINS the zero-prerequisite default engine despite being the one
  engine where a failed conversion hook can leave DDL applied and DML rolled back -- recorded in
  STOR-35's detail).
  Residual: H2 and MySQL still have no transactional DDL -- upstream behaviour, not a choice, and no
  platform code changes it. A statement the splitter still cannot render idempotent falls back to
  warn, where a failed verify can leave DDL applied with DML rolled back.
