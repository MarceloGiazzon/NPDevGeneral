codeLinkedNote: >-
  POSTURAL: no diagnostic fires because there is nothing to hit. This row records the ABSENCE of a
  gate rather than a refusal -- a destructive item already claimed by a conversion hook is not
  token-gated, because authoring the hook is the acknowledgment (owner-approved, ADR-0008,
  2026-07-25, no conditions). The gates that DO exist belong to the surrounding rules, not to this
  boundary: unclaimed destructive items stay fully token-gated, and rule 5 re-diffs to verify every
  claim. Revisit trigger: the owner revokes or conditions the ADR.
