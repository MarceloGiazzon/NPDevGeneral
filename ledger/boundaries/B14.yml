id: B14
title: "Sanctioned destruction: a hook-resolved destructive item needs no token (rule 6)"
kind: POSTURAL
userFacingText: ""  # nothing user-reachable: this row REMOVES a gate, so there is no refusal to render
workaround: "None is needed, and the doc row states no user action: authoring the hook IS the acknowledgment. Unclaimed destructive items remain fully token-gated, and rule 5 verifies every claim by re-diffing."
enforcingDiagnosticCodes: []
