id: B5
title: "Schema-ahead detection closes by refusal, not reconstruction"
codeLinked: true
codeLinkedNote: >-
  2026-08-25 (remediation plan W2.3). SchemaLifecycleExecutor.beforeMigrate already threw
  `BoundaryBootException(new BoundaryViolation("B5", "boot", ...))` for REG-8 Trigger C before this
  session (Wave 2, commit 50ddf3ea, 2026-08-21 -- landed before the 2026-08-23 audit that produced
  this remediation plan, which read the OLD pre-Wave-2 note describing this as unwired without
  re-tracing the live code, exactly the same stale-premise shape as B19). `BoundaryViolation` has no
  separate `code` field, only `boundaryId` -- the declared code is now carried as a
  `B5:schema_ahead_detected:` message prefix, the same convention B2/B4/B9/B10 use, so it appears in
  both the boot log and BoundaryViolationResponse's JSON body (BoundaryViolation.toJson()'s
  "message" field).
  Proven by SchemaLifecycleExecutorDatabaseMigratedPastBuildTest (asserts both boundaryId=="B5" and
  the code prefix).

  B5-A (REG-198, boundary-lift 2026-09-02 package 2.3): the row's own revisit trigger ("a full
  schema-history snapshot is stored per boot") fired. `SchemaSnapshotStore` now writes a full
  desired-schema snapshot per fingerprint (`npdev_schema_snapshot`) inside `afterMigrate`'s existing
  fingerprint-write connection block; `SchemaAheadAnalysis` diffs this build's own desired schema
  against the ahead fingerprint's snapshot via the EXISTING `SchemaDiffEngine`/`SafetyClass`
  vocabulary (no parallel classification ladder), bucketing each item as proceed-ignoring /
  needs-the-newer-build / needs-a-destructive-downgrade. Appended to both the boot refusal message
  and the 503 JSON body; `SchemaAheadMain` (`npdev db schema-ahead --report`) renders the same
  analysis with no app boot required, mirroring `SchemaVerifyMain`'s own no-boot shape. No diagnostic
  code changed (`B5:schema_ahead_detected:` is unchanged, only followed by more detail) -- no new
  twin-pair-registry entry needed, same reasoning SEC-7 recorded for B30's own register update. The
  refusal itself is unchanged: it still fires in every case (downgrade stays unsupported); a database
  that reached the ahead fingerprint before this shipped, or via mark-done (neither writes a
  snapshot), degrades to a plain explanation instead of an itemized one.
  Proven by SchemaLifecycleExecutorSchemaAheadDiagnosisTest (both the real-snapshot itemized case and
  the no-snapshot-recorded graceful fallback) and SchemaAheadAnalysisTest (the resolution mapping for
  every SafetyClass bucket, plus a snapshot JSON round-trip).

  B5-B (REG-199, boundary-lift 2026-09-02 package 4.1): turns B5-A's diagnosis into an action for the
  PURE-SUPERSET case only. `ReverseMigrationPlanner` computes a fresh live diff (never the stored
  snapshot -- that stays advisory-only) via the same plumbing the Impact Report uses, buckets it with
  the EXISTING `SchemaAheadAnalysis.resolutionFor`, and refuses the whole plan outright (never a
  silent partial reversal) if any item needs the newer build OR is a type-narrowing item (out of scope
  per the plan's own done-when). Ready plans execute behind the SAME `DestructiveAckToken` function
  the forward path uses, reusing `DestructiveRecreationPass`'s DROP primitives and
  `SchemaDropSnapshotWriter`'s pre-drop snapshot unchanged. Clearing the ahead-gate needed no new
  fingerprint-writing plumbing: one more `npdev_schema_history` row is enough for the next normal boot
  to self-converge through the untouched `beforeMigrate`/`afterMigrate` path. `npdev db reverse-migrate
  --preview`/`--ack-token` (ReverseMigrateMain) mirrors `db schema-ahead`'s no-boot CLI shape. B5 stays
  HITTABLE: narrowed further (additive-only ahead diffs are now actionable), not lifted -- any
  ambiguous or type-narrowing diff still refuses unconditionally, exactly as before.
  Proven by SchemaLifecycleExecutorReverseMigrationTest (a real pure-superset reversal end-to-end,
  including the REAL beforeMigrate boot clean afterward; and a rename-shaped diff refusing as
  ambiguous) and ReverseMigrationPlannerTest (classify()'s bucket mapping, pure/no-DB).

  B5-C (STOR-24, REAL_LIFT_PLAN_2026-09-03.md package A3, "real lift", 2026-09-03): **reclassifies to
  LIFTED for the additive case.** Every prior package (B5-A, B5-B) made the refusal more informative or
  reversible; this one makes it not fire at all when every difference is additive. Two changes:
  (1) `PostgresPersistenceCapabilityAdapter` (`findById`/`query`/the tenant-scoped `findById`) and
  `JdbcBusinessConceptStore` (`findById`/`findByIdForUpdate`/`findAll`/`findAllCapped`) build an
  EXPLICIT column list from THIS BUILD's own compiled model, never `select *` -- a column a newer
  build added is never even asked for, so it structurally cannot leak into a record this build reads,
  mirroring the write side's own pre-existing "accepted only when resolved to actual columns"
  discipline (class javadoc). (2) `SchemaCompatibilityVerdict` -- a NEW class, deliberately NOT built
  on `SchemaAheadAnalysis` despite the similar vocabulary (that class answers "what would a DOWNGRADE
  destroy", the wrong question for booting compatibly, which never touches the ahead schema at all) --
  runs when Trigger C fires, BEFORE the refusal: for each live column absent from this build's manifest,
  nullable or defaulted is TOLERABLE (this build's projected writes omit it safely), NOT NULL with no
  default is INCOMPATIBLE (this build's own INSERT would violate it); a whole extra table is TOLERABLE
  (never referenced). Symmetrically, anything THIS build's manifest declares that live is missing is
  ALWAYS INCOMPATIBLE (the classic REG-8 rollback shape a first draft of this class got vacuously wrong
  by only checking one direction -- caught by regression coverage, fixed before this closed). If every
  difference is tolerable, the boot proceeds with an itemized log line naming what it is ignoring and
  why, and `npdev_schema_history` records `PROCEED_SCHEMA_AHEAD_COMPATIBLE`; if anything is
  incompatible, the EXISTING B5-A itemized refusal fires completely unchanged. A verdict computation
  failure degrades to the safe refusal (never silently permits an unsafe boot).
  Proven by `SchemaCompatibilityVerdictTest` (direct, 20x-repeated per case: extra nullable column,
  extra NOT-NULL-defaulted column, extra table all tolerable; a NOT-NULL-no-default extra column and a
  missing desired column both always incompatible), `PostgresPersistenceCapabilityAdapterSchemaAheadCompatibilityTest`
  and `JdbcBusinessConceptStoreSchemaAheadCompatibilityTest` (the projection change, including that an
  update never clobbers a column it never selected), and integration coverage in
  `SchemaLifecycleExecutorDatabaseMigratedPastBuildTest` (a nullable extra column, a NOT-NULL-defaulted
  extra column, and a whole extra table all boot normally through the real `beforeMigrate` path; the
  classic column-drop rollback still refuses, unchanged). QUAL-55 tracks one INTEGRATION test removed
  for unrelated, unexplained flakiness in the surrounding Trigger C/history-seeding harness -- ruled
  out as a `SchemaCompatibilityVerdict` logic bug via the 20x-repeated direct coverage above, and ruled
  out as a stale-dialect-singleton read; the removed test's two claims are each still covered reliably
  by the tests above.
ref: "docs/ACCEPTED_BOUNDARIES.md#B5, SchemaCompatibilityVerdict.java, SchemaCompatibilityVerdictTest.java, PostgresPersistenceCapabilityAdapter.java#selectListSql, JdbcBusinessConceptStore.java#selectListSql, STOR-24, QUAL-55, REAL_LIFT_PLAN_2026-09-03.md package A3"
classification: LIFTED
