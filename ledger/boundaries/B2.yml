id: B2
title: "Expression-valued backfills require an explicit dry-run + acknowledgment"
codeLinked: true
codeLinkedNote: >-
  2026-08-25 (remediation plan W2.3). Re-traced from the real code: the actual "requires ack"
  refusal is a BOOT-time refusal (BackfillPass.applyRequiredFieldBackfills, merged into
  SchemaLifecycleExecutor's required-field-backfill pass), not purely a REST endpoint as this note
  previously said -- the REST preview/acknowledge endpoints
  (GET .../expression-backfill-preview, POST .../acknowledge) are how an operator RESOLVES it, not
  where it fires. The refusal string is now prefixed `B2:expression_backfill_requires_ack:`,
  discoverable in the boot log/exception message; `BoundaryViolation("B2", "backfill", ...)` (Wave 2,
  commit 50ddf3ea) separately covers a DIFFERENT B2 precondition (no physical database configured)
  at the REST preview endpoint -- not this code, since that failure is not the "requires ack" case.
  Proven by SchemaLifecycleExecutorRequiredFieldBackfillTest#unacknowledgedExpressionDefaultWithRealExpressionTextStillRefusesUnchanged.
ref: "docs/ACCEPTED_BOUNDARIES.md#B2"
