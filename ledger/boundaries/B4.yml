id: B4
title: "Multi-instance migration is a real lock, not detect-and-refuse"
kind: HITTABLE
userFacingText: "Another app instance holds the migration lock. Wait for it to finish or clear the claim via the admin endpoint."
workaround: "The second instance waits/refuses under the real lock (Postgres advisory lock or H2 atomic claim row); use ControlPanel's clear() only as a deliberate manual escape hatch."
enforcingDiagnosticCodes: ["B4:migration_lock_held"]
codeLinked: true
codeLinkedNote: "Enforced at boot time by MigrationClaimStore (a lock/claim mechanism), surfaced as a boot-time refusal/exception in NPDevRuntimeHost, not a DSL ValidationDiagnostic -- outside this session's ValidationDiagnostic-scoped boundaryId mechanism."
ref: "docs/ACCEPTED_BOUNDARIES.md#B4"
