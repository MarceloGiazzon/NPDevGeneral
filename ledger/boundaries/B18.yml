id: B18
title: "Row-level write authorization's check-then-act window is closed on save AND delete -- by locking under a real transaction manager, by compare-and-swap without one"
codeLinked: false
codeLinkedNote: >-
  2026-09-07 (REG-210, POSTURAL_LIFT_PLAN_2026-09-07.md package P2): LIFTED. The check-then-act
  window was only ever half-closed: save() already wrapped its whole body in the TransactionRunner
  and read via ConceptStore.findByIdForUpdate, but delete() had NO runInTransaction wrapper at all
  and read through the plain, unlocked findById -- the doc, the JavaDoc and this row's old text all
  described delete code that did not exist. Half (a) makes delete match its documentation: the whole
  body now runs inside transactionRunner and reads through findByIdForUpdate, so a concurrent writer
  blocks the way save already blocks. Half (b) closes the degraded mode: TransactionRunner.none()
  now answers isTransactional() == false, and both write paths compare-and-swap against the row
  version the read just returned instead of relying on a lock that does not exist -- an update goes
  through the version-carrying ConceptStore.save, a delete through a new 4-arg
  ConceptStore.deleteById(..., expectedRowVersion) (real WHERE ... AND row_version = ? in
  JdbcBusinessConceptStore, synchronized CAS in InMemoryConceptStore), and a lost race becomes a
  loud ConceptStoreOptimisticLockException instead of a silent overwrite. The authorization-reassignment
  scenario (a second actor who already holds write access reassigning ownership mid-window) is closed AT
  THE WRITE level by the same two mechanisms: under a lock the writes serialize, in degraded mode the
  reassignment bumped the version so the stale write is refused loudly and never persists. What no
  mechanism can do is re-run the authorization decision against the row's FINAL state on the loser's
  behalf -- the gateway refuses the write, it cannot prove the decision itself was still right; that is
  inherent to any snapshot-then-decide shape, not a window that lets a stale write land.

  Residual: a table generated before LNCH-16 has no row_version column, so the degraded-mode guard
  cannot engage there and the window stays open until the column exists (the read returns no
  version, so nothing to compare). A degraded-mode loser gets an exception to retry, not a block --
  the outcome is safe, not transparent.
