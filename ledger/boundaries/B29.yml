id: B29
title: "Every engine answers a row cap as a whole statement; no dialect method returns a fragment an engine cannot mean"
codeLinked: false
codeLinkedNote: >-
  2026-09-07 (STOR-30, POSTURAL_LIFT_PLAN_2026-09-07.md package P1): LIFTED. The unreachable throw
  is deleted rather than documented: `SqlDialect.rowLimit(long)` is gone from the interface, and
  `rowLimited(String, long)` -- the whole-statement question every real caller actually asks (four
  production sites: JdbcEventStore x2, PostgresPersistenceCapabilityAdapter x2; the only other
  match in the tree was the test stub, now implementing `rowLimited`) -- is abstract, answered by
  each engine in the shape IT can mean: a `LIMIT` suffix on H2/MySQL/Postgres (each engine's former
  `rowLimit` body moved into a private `rowLimitSuffix(long)`, non-positive rejection preserved),
  a `SELECT TOP n` prefix rewrite on SQL Server. The class-javadoc "unresolved one" section and the
  "Known S5 gap" paragraph are gone -- there is no gap to record. codeLinked stays false honestly:
  there is no diagnostic because the question is no longer asked at an altitude where one engine
  cannot answer it, and adding a capability token no caller consults would be dead code wearing a
  safety label.

  Residual: a caller that genuinely needs a bare suffix has no method to call -- by design. The
  fix for such a caller is a dialect method that builds the whole statement (`existsProbe` is the
  precedent), never a `rowLimit` that returns something it cannot mean.
ref: "docs/ACCEPTED_BOUNDARIES.md#B29 -- storage/OPEN_ITEMS_PLAN.md 6, storage/FULL_SUPPORT_PLAN.md W1.3"
classification: LIFTED