id: B9
title: "Snapshot restore is operator-driven, one (snapshot, table) pair at a time -- never restore all"
kind: HITTABLE
userFacingText: "Snapshot restore is scoped to one table at a time. Preview and restore each table individually."
workaround: "Call the preview endpoint first, resolve any reported conflicts by hand, then restore for that exact (snapshot, table) pair -- repeat per table."
enforcingDiagnosticCodes: ["B9:single_table_scope"]
codeLinked: true
codeLinkedNote: >-
  2026-08-25 (remediation plan W2.3). SchemaDropSnapshotRestorer.apply already threw
  `BoundaryBootException(new BoundaryViolation("B9", "restore", ...))` before this session (Wave 2,
  commit 50ddf3ea). This is the boundary's ONE runtime refusal (the named table must exist before it
  can be restored into) -- there is no separate "you asked for more than one table" check to attach
  a code to, because the API signature itself (one snapshot, one table, per call) never accepts more
  than one; "single_table_scope" describes the whole endpoint's shape, and this refusal is its one
  reachable manifestation. Code carried as a `B9:single_table_scope:` message prefix, same convention
  as the other five. Proven by SchemaDropSnapshotRestorerTest#applyRefusesWhenLiveTableIsMissing.
ref: "docs/ACCEPTED_BOUNDARIES.md#B9"
