id: B13
title: "Conversion hooks are SQL-only -- no Java DataMigrationHook (declarative conversions[] vocabulary covers copy/split/lookup/merge/convert)"
kind: HITTABLE
userFacingText: "This conversion references a concept or field that does not exist in the pack."
workaround: "Declare a conversions[] entry (copy/split/lookup/merge/convert) instead of hand-writing convert.sql; for the uncovered case (retyping an EXISTING column in place), fall back to an operator-authored SQL hook."
enforcingDiagnosticCodes:
  - "B13:unresolvable_join_path"
codeLinked: true
codeLinkedNote: "PackValidation now prefixes unresolvable join path errors with B13:unresolvable_join_path:, and ValidationDiagnosticNormalizer extracts the boundaryId and strips the prefix before pattern matching."
ref: "docs/ACCEPTED_BOUNDARIES.md#B13"
