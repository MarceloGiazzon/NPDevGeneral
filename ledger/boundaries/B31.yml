id: B31
title: "H2Local boots share the database file over H2's own auto-server; overlapping boots coexist"
codeLinked: true
codeLinkedNote: >-
  2026-09-05 (ALL_HITTABLE_LIFT_PLAN_2026-09-05.md package P2, STOR-27): the timeout refusal below
  is now the OPT-OUT path, not the default. `H2LocalBootLockEnvironmentPostProcessor` rewrites
  `spring.datasource.url` before any bean exists: an `H2_LOCAL` URL naming no `AUTO_SERVER=` token
  at all gets `;AUTO_SERVER=TRUE` appended, so the first process serves the file over H2's own TCP
  endpoint and every later process connects through it instead of racing the file -- no lock, no
  wait, no refusal. A URL that already names `AUTO_SERVER` either way (including the four
  pre-existing `MigrationKillMid*` tests, which pin `AUTO_SERVER=FALSE` on purpose) is never
  touched, and `H2LocalBootLock` itself is skipped entirely once AUTO_SERVER is active -- there is
  nothing left for a file lock to protect. Both places that mint an H2Local JDBC URL for a
  generated app now mint `AUTO_SERVER=TRUE` honestly, registered as a twin pair. See
  `ledger/items/STOR-27.yml` for the full trace. **Reclassified LIFTED** (was HITTABLE): a rolling
  restart's brief overlap no longer waits or refuses at all in the default configuration; the
  original lock-and-refuse mechanism remains, fully tested, as the explicit opt-out
  (`npdev.h2local.autoServer=false` or a URL naming `AUTO_SERVER=FALSE`).

  2026-09-05 (REAL_LIFT_PLAN_2026-09-03.md package B4-closure, REG-207): B4's own multi-process
  migration lock (MigrationMutex/MigrationClaimStore) is proven safe under real two-process contention
  for Postgres/MySQL/SQL Server (session advisory locks) and H2Server (a row lock in a dedicated
  npdev_lock schema, over H2Server's own TCP endpoint -- MigrationLockConcurrentBootTest). H2Local
  (jdbc:h2:file:..., a raw embedded-file connection with no server process arbitrating access) had NO
  multi-process boot protection at all: a second OS process racing the same file (the realistic case
  is a rolling restart's brief overlap, not two permanent instances -- H2Local is inherently
  single-process for its whole lifetime) hit H2's own "database already in use" exception on its very
  first DataSource.getConnection() call, which fires during Spring's own Hikari pool construction --
  strictly BEFORE SchemaLifecycleExecutor/MigrationMutex ever run -- so it surfaced as a raw, uncaught
  BeanCreationException, not a wait or a clean diagnostic. Deliberately NOT filed under B4: B4 is
  specifically about migration serialization; this fires on ANY overlapping H2Local boot regardless of
  a pending migration, and B4.yml/MigrationClaimStore.java's own "not worth a new file-lock sidecar"
  prose is about REG-7.2's unrelated bookkeeping-row residue and remains accurate as written.
  H2LocalBootLock (new, com.finalexec.db) + H2LocalBootLockEnvironmentPostProcessor (registered via
  META-INF/spring.factories as a Spring Boot EnvironmentPostProcessor -- the framework's own SPI for
  running before ANY bean, including the DataSource bean, is created) close the gap: an OS-level
  FileChannel.tryLock() on a sidecar file beside the H2 data file, in a bounded poll loop
  (npdev.h2local.bootLock.waitSeconds, its own budget -- deliberately not shared with
  npdev.schema.lock.waitSeconds, since this is a rolling-restart file-handle release, not an unbounded
  migration), held for the app's full lifetime and released on ContextClosedEvent (with an idempotent
  JVM-shutdown-hook fallback). A same-JVM OverlappingFileLockException (e.g. a cached @SpringBootTest
  context reusing the same file) is treated as ordinary contention, not a crash. On timeout, throws
  BoundaryBootException prefixed B31:h2local_boot_lock_held:, flowing through FinalExecApplication's
  existing catch/exit-code-4 handling with zero changes to that file. Proven by
  H2LocalBootLockCrossProcessTest against two REAL java processes (wait-then-succeed, and
  wait-then-refuse-with-the-named-diagnostic).
ref: "docs/ACCEPTED_BOUNDARIES.md#B31"
classification: LIFTED
