id: B3
title: "FK/index checking is missing-only for DDL purposes -- surplus is now REPORTED (advisory-only), never acted on"
codeLinked: false
codeLinkedNote: >-
  POSTURAL: no diagnostic fires because there is nothing to hit. Real code exists -- classification
  (ConstraintSurplusClassifier, 15/15 vectors from b3-classification-vectors.json), the diff hook
  (SchemaDiffEngine#findSurplusConstraints, reusing the desired/current pair the ordinary diff already
  computes) and both ImpactReportText/ImpactReportJson renderers -- but every one of them only ADDS an
  advisory section. There is no refusal, no ValidationDiagnostic and no drop path, so there is no
  diagnostic identity for a boundaryId to attach to. The row's own text records the choice
  deliberately: a gate that failed a build on surplus would turn a DBA's performance index into a
  build failure, a materially larger decision than reporting it, and reporting extras as something to
  fix would propose dropping primary-key indexes -- which is the failure this boundary exists to
  prevent.
ref: "docs/ACCEPTED_BOUNDARIES.md#B3 -- DATABASES_AND_MIGRATIONS.md §15, SER-G8, REG-129, REG-145, NPDevRuntimeHost/.../db/schemastate/ConstraintSurplusClassifier.java, .../SchemaDiffEngine.java#findSurplusConstraints, .../SchemaImpactFacade.java, NPDevGenerator/.../dbconfig/SchemaRealizationEmitter.java#collectIndexes"
