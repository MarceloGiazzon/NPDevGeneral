id: B3
title: "Surplus constraints are classified and reported advisory-only at boot; an operator can drop a FOREIGN-classified one explicitly, itemized and token-gated, and nothing else is droppable by any path"
codeLinked: true
codeLinkedNote: >-
  2026-09-07 (STOR-31, POSTURAL_LIFT_PLAN_2026-09-07.md package P3): LIFTED. The classification and
  advisory reporting the row already described are unchanged (ConstraintSurplusClassifier, 15/15
  vectors; the Impact Report's surplus section still never changes verdict and never proposes a
  drop). What is new is the operator decision the residue demanded: `npdev db surplus` / the
  ControlPanel endpoints preview the classified droppable set (FOREIGN-classified only) with a
  dropToken, and a drop executes ONLY a FOREIGN-classified constraint the operator explicitly names,
  with a token that is recomputed-and-compared against the CURRENT live surplus (a changed set
  refuses with B3:surplus_token_stale:). A non-FOREIGN name (a primary-key backing index, an
  IMPLICIT/PLATFORM_DECLARED/UNCLASSIFIABLE constraint) is refused by its CLASSIFICATION, never by
  name, with B3:surplus_not_foreign:<name>:<classification>; an unknown name refuses with
  B3:surplus_not_present:<name>. Every executed drop is recorded in npdev_schema_history as a
  SURPLUS_DROPPED row (with the re-create DDL) BEFORE the drop statement runs, one statement per
  constraint, stopping at the first failure and reporting what already dropped. Nothing ever drops
  at boot, in a gate, or without the explicit request plus a matching token. New dialect method
  SqlDialect.guardedDropConstraint (Postgres/H2/SQL Server IF EXISTS; MySQL information_schema
  guard, legal only inside the dialect package).

  Residual: NPDev still never removes a constraint on its own. IMPLICIT and PLATFORM_DECLARED
  constraints are permanently undroppable through the platform, and an UNCLASSIFIABLE one is refused
  rather than guessed at -- an abstention is never a licence. The advisory report remains
  byte-identical when nobody calls the new endpoints.
