id: B28
title: "A model change is applied by an atomic swap; a change built once into a snapshot bean (a new invariant rule, a new CRUD-reachable field) still needs a restart"
codeLinked: true
codeLinkedNote: >-
  2026-09-05 (ALL_HITTABLE_LIFT_PLAN_2026-09-05.md package P4, REG-208): the split-brain residue
  below is closed structurally. `NpdevCapabilityBindingConfig`'s standalone `CompiledModel` bean is
  DELETED -- `modelHolder(NPDevModelProvider)` is the only place one is ever constructed -- so a
  reintroduced direct `CompiledModel` injection anywhere in the RuntimeHost template now fails to
  wire at Spring startup instead of silently caching a stale model. Every remaining holder (35+
  classes, more than the plan's own 22-file estimate) was converted one of two ways: a bean that
  just looks things up (`PanelRuntime`, `AggregateRuntime`, `ProcedureRunner`,
  `JdbcBusinessConceptStore`, most controllers) now calls `ModelHolder.get()` fresh per call; a bean
  that builds something ONCE at construction got a real `ModelReloadListener` (new on `ModelHolder`,
  notified inside the write lock) that rebuilds it in place --
  `NpdevCapabilityBindingConfig.capabilityRegistry`, `InMemoryConceptStore` (kernel-side, wired via a
  plain `setModel` since the kernel cannot depend on `com.finalexec.config.ModelHolder`),
  `NpdevObservabilityConfig`'s sensitive-field registration, and `NpdevCronSchedulerService`
  (stops and re-registers every schedule from the reloaded model). The full-reload endpoint's
  default flipped to enabled. A second, previously-unaudited surface was found only by a failing
  boot: `NPDevGenerator`'s own mustache templates emit PER-APP classes
  (`com.npdev.generated.runtime.service.KernelFacade`, `...controllers.GeneratedQueryController`)
  that also directly injected `CompiledModel` -- fixed the same way, in the generator templates
  themselves, so every future generated app gets the fix too. See `ledger/items/REG-208.yml` for
  the full trace, including how this was found (a `NoSuchBeanDefinitionException` four Spring
  constructor-resolution frames deep, only visible by reading a raw JUnit XML stack trace after the
  digest-log summarization truncated it).

  **Reclassified LIFTED, PARTIAL** (was HITTABLE) -- honestly narrower than the plan's own
  "Reclassify" text, which named only "a change requiring newly generated code" as the residual.
  Measured reality is broader: `NpdevCapabilityBindingConfig.invariantEngine` (`CelInvariantEngine`
  has no in-place rebuild), `conceptGateway`'s semantic-policy component, `propertyResolver`, and
  `kernelRunner`'s flow-definition provider are ALL built once from a model snapshot with no
  listener, same as `generatedCrudRuntimeSupport`'s own concept-metadata caches -- meaning a
  reloaded model's new FIELD is not visible to the generated CRUD REST surface specifically (though
  it IS visible to `PanelRuntime`/`AggregateRuntime`/`ProcedureRunner` and anything reading through
  `ConceptGateway` directly), and a new invariant rule or capability binding still needs a restart
  exactly like new generated code would. `RuntimeInvariantEngineFactory` proves the alternative
  shape works (captures `modelHolder`, calls `.get()` fresh per request) -- the template a future
  fix to `GeneratedCrudRuntimeSupport` would follow; not attempted this session, out of scope given
  this package's size relative to the packages still ahead of it in the same plan.

  2026-09-21 (D1, server-driven UI structural rewrite Phase 1, `ledger/items/REG-235.yml`): closed
  ONE of the four residuals named just above. `GeneratedCrudRuntimeSupport` took a raw
  `CompiledModel` in its constructor and cached it in a `final` field -- the one straggler that
  violated `ModelHolder`'s own documented convention (every other model-consuming bean holds a live
  reference and calls `.get()` fresh). Converted to hold a `Supplier<CompiledModel>` (not
  `ModelHolder` itself -- this class lives in a `:kernel` adapter, which cannot depend on
  `NPDevRuntimeHost`; `NpdevCapabilityBindingConfig` now wires `modelHolder::get`) and read it live
  at all 7 internal use sites. Proven by
  `GeneratedCrudRuntimeSupportModelReloadTest#aConceptAddedAfterConstructionIsVisibleWithoutRebuildingTheInstance`:
  construct once, swap the model, confirm the SAME instance sees a newly-added concept immediately.
  Still needs a restart, unchanged by this fix (Phase 2, not attempted): `CelInvariantEngine` (no
  in-place rebuild for a new invariant rule), `ConceptGateway`'s semantic-policy component,
  `propertyResolver`, and `KernelRunner`'s flow-definition provider are all still built once from a
  model snapshot with no reload listener. A brand-new CONCEPT (not just a new field) still needs a
  restart regardless (Phase 3, not attempted) -- live DDL has no runtime code path at all today
  (`SchemaLifecycleExecutor` only runs at boot), and `GeneratedConceptCrudController`'s per-concept
  `register_*` methods are baked in at generation time.

  2026-08-25 (remediation plan W2.4a). `ModelHolder.java` (AtomicReference<CompiledModel> +
  ReadWriteLock) and `MetadataHotSwapController`'s `POST /api/admin/runtime/metadata-hotswap/
  model-reload` both exist and give only a PARTIAL swap -- only `ModelHolder.get()` consumers
  observe the new model, every singleton constructed with a directly-injected `CompiledModel` at
  application-context startup keeps the old one, a split-brain state. This session gated the
  endpoint: disabled by default behind `npdev.runtime.hotswap.full-model-reload-enabled` (checked
  AFTER the pre-existing SUPERUSER auth gate, so a caller cannot even discover the flag's existence
  without already holding SUPERUSER), so the reachable do-not-ship mechanism cannot be invoked by
  accident. The disabled-by-default refusal returns a structured JSON body carrying
  `code: "FULL_MODEL_RELOAD_DISABLED"` -- the same `{"ok": false, "code": ..., "message": ...}`
  shape `MetadataHotSwapController`'s own `/apply` endpoint already used for its failures, not the
  `BoundaryViolation`/`ValidationDiagnostic` prefix conventions the other ten HITTABLE boundaries
  use (a third ad-hoc shape; see docs/ACCEPTED_BOUNDARIES.md's classification-table note for the
  full inventory of shapes in use). Proven by 3 tests in
  MetadataHotSwapControllerStandaloneTest.java: disabled-by-default returns 404 with this code even
  for an authenticated SUPERUSER, auth is still checked ahead of the flag, and the explicit opt-in
  genuinely works. Completing the fix -- migrating every direct `CompiledModel` injection to
  `ModelHolder.get()` -- is real follow-up work (plan option (b)), not attempted this session.

  2026-09-21 (D1 Phase 2 planning, same day as the Phase 1 entry above): found a 5th residual this
  boundary's tracked list had never named, even though it already self-documents as one --
  `NpdevAuthConfig.executionAuthorizationPolicy` (`NPDevRuntimeHost/src/main/java/com/finalexec/
  config/NpdevAuthConfig.java:33-37`) wraps `DefaultExecutionAuthorizationPolicy` (a kernel adapter,
  which must not depend on `ModelHolder`) and caches app-declared roles once at construction from
  `modelHolder.get()` -- its own javadoc already calls this "a named residual, same shape as
  `NpdevCapabilityBindingConfig#invariantEngine`," it was just never added to this file's list.
  Tracked as REG-239 (not implemented yet); same fix shape as `invariantEngine`'s once REG-236 lands.
  Also fixed a related doc drift found at the same time:
  `MetadataHotSwapController`'s class javadoc omitted `propertyResolver` from its own residual list
  (it's one of the 4 beans `NpdevCapabilityBindingConfig` names) and wrongly listed "property
  resolution" as something that already observes reloads today -- both corrected in place.

  2026-09-21 (D1 Phase 2, `ledger/items/REG-236.yml` + `REG-237.yml`, same day as the planning
  entry above): closed 3 of the original 4 named residuals outright (`invariantEngine`,
  `conceptGateway`'s semantic policy, `propertyResolver` -- REG-236) and the 4th (`KernelRunner`'s
  flow-definition provider -- REG-237) for its mechanical half only. Two different fix shapes were
  needed, not REG-235's single pattern: `invariantEngine` and `conceptGateway` cache the result of
  a real full-model walk, so they got a `ModelReloadListener`-driven rebuild-in-place wrapper
  (`ReloadableInvariantEngine`, `LiveConceptGatewaySemanticPolicy`) -- the SAME idiom
  `capabilityRegistry` already used, chosen specifically because a `Supplier`-based "read live
  every call" port would have repeated that expensive walk on every request. `propertyResolver`
  fit REG-235's `Supplier<CompiledModel>` pattern (cheap per-call reads), plus a second,
  independently-discovered fix: its `PropertyExplanation` cache was keyed by a `version` that a
  model reload alone never bumped, so it needed explicit cache invalidation on top of the live
  read, or it would have kept serving stale cached values. `KernelRunner`'s flow-definition
  provider got the snapshot-swap treatment (an `AtomicReference<Snapshot>` + `reload(...)`) for
  NEW `execute()`/`resumeExecution()` lookups only -- REG-237's own text explains why the
  resume-across-a-reshaped-flow hazard is pre-existing, not newly introduced, and why fixing it is
  separate work (REG-238, open).

  Still needs a restart, unchanged by these two items: `NpdevAuthConfig.executionAuthorizationPolicy`
  (REG-239, open, tracked above) is now the ONLY bean built once from a model snapshot with no
  reload path at all. A durable `WAITING_EVENT` flow instance resuming across a reshaped flow is a
  separate, narrower residual (REG-238, open) -- not "still needs a restart" in the traditional
  sense (a restart doesn't even fix it; only a not-yet-designed shape-fingerprint guard would).
ref: "docs/ACCEPTED_BOUNDARIES.md#B28"
classification: LIFTED, PARTIAL
