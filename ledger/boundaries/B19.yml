id: B19
title: "bandPickers accepts the same filter/multiSelect shape a plain FK field's picker does -- but a band picker still requires a named panel, so without one they are inert"
kind: POSTURAL
userFacingText: ""  # nothing user-reachable: a filter/multiSelect with no panel is silently inert, never refused
workaround: "Declare filter/multiSelect alongside a real panel on a bandPickers entry; for a genuinely dynamic band filter today, give the referenced Selection panel its own declared query where clause instead."
enforcingDiagnosticCodes: []
codeLinked: false
codeLinkedNote: >-
  POSTURAL: no diagnostic fires because there is nothing to hit. Re-traced by REG-135 step 1 (B19 was
  missing from that session's own starting classification draft):
  PanelValidation.validateBandPickers checks band NAMES, not whether a picker's filter/multiSelect has
  a panel to work with, so a band picker declared without a panel simply does not fetch -- the
  filter/multiSelect are inert, silently. That silence IS the boundary; there is no refusal for a
  boundaryId to attach to. WorkbenchBandPickerAst/CompiledWorkbenchBandPicker do carry the same two
  properties FieldPickerAst declares (one shape, two authoring surfaces); what is genuinely still
  unmerged is a no-panel fetch path targeting the band's own concept directly, plus client/server
  enforcement of a dynamic per-request filter on the panel-data endpoint. Revisit trigger: a no-panel
  band picker becomes a real authoring need.
ref: "docs/ACCEPTED_BOUNDARIES.md#B19 -- AW-P2 (7e1096e), docs/architecture/AGGREGATE_WORKBENCH_PLAN.md, Move 9 A3"
