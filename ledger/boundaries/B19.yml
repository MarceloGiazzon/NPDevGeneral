id: B19
title: "bandPickers accepts the same filter/multiSelect shape a plain FK field's picker does -- but a band picker still requires a named panel, so filter/multiSelect declared without one has nothing to apply to"
codeLinked: true
codeLinkedNote: >-
  2026-08-25 (remediation plan W2.5). Re-traced from the real code, not the prior classification:
  PanelValidation.validateBandPickers (NPDevContract/dsl/.../validation/PanelValidation.java) has
  ALWAYS required panel unconditionally on every declared band picker -- not "band names only" as
  this boundary's prior POSTURAL classification claimed (that claim was traced from
  JsonModelParser's own comment about the AST widening, not from reading validateBandPickers itself,
  which already contained `else if (!hasText(entry.getValue().panel())) { errors.add(...  "panel is
  required"); }` before this session touched it). So a no-panel band picker was never silently
  inert -- it was always a hard validation refusal; the boundary's only real gap was that the
  refusal carried no boundaryId, so nothing could programmatically distinguish it as B19 rather than
  an ordinary validation bug. Fixed: the error message is now prefixed `B19:band_picker_requires_panel:`,
  following the exact `B1:`/`B13:` convention (ValidationDiagnosticNormalizer.BOUNDARY_PREFIX_IDS
  strips the prefix before downstream pattern-matching, same as those two). Proven by
  AutoPanelWorkbenchTypedSurfaceValidationTest#bandPickersMissingPanelDiagnosticCarriesB19BoundaryId,
  which asserts exactly one ValidationDiagnostic with getBoundaryId()=="B19" for a bandPickers entry
  declaring multiSelect with no panel.

  Not added to NPDevSamples/dsl-conformance-max: that corpus is scanned for POSITIVE feature
  coverage by check-dsl-coverage.py (bandPicker.filter is already covered there, WITH a panel) --
  it has no mechanism for an intentionally-invalid fixture, and adding one would break that sample's
  own validity for every other tracked feature in the same file. The DSL unit test above is the real
  witness for this negative case.
ref: "docs/ACCEPTED_BOUNDARIES.md#B19 -- AW-P2 (7e1096e), docs/architecture/AGGREGATE_WORKBENCH_PLAN.md, Move 9 A3"
