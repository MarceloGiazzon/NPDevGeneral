sourceFile: README.md
preamble:
- type: prose
  text: |
    # NPDev

    [![NPDev CI Validation](https://github.com/MarceloGiazzon/NPDevGeneral/actions/workflows/npdev-ci-validation.yml/badge.svg?branch=main)](https://github.com/MarceloGiazzon/NPDevGeneral/actions/workflows/npdev-ci-validation.yml?query=branch%3Amain)

    **The layer between the prompt and the code.**

    AI made *creating* software effortless. It did not make *owning* it effortless — and that is where
    projects now die: business rules drift, nobody can say what the system guarantees, and every change
    means asking the AI again and hoping.

    NPDev puts an inspectable specification between human intent and running code. You declare what
    your application **is** — its concepts, its invariants, its capabilities, its events, its
    orchestration. NPDev deterministically compiles that into a hardened Java/Spring Boot system —
    database, REST API, admin screens, role-based access, durable background processes — as source you
    own outright, operable from a GUI without ever opening a terminal.

    **An AI can write the specification. An AI cannot quietly mutate the rules you declared in it.**

    ---
sections:
- level: 2
  title: The problem this exists to solve
  blocks:
  - type: prose
    text: |2

      An AI can build you an invoicing app from one sentence. It works. Then:

      - You cannot inspect what it guarantees.
      - You cannot reason about whether it is still correct.
      - You cannot evolve it safely.
      - Every change goes back through a prompt, and the answers stop being consistent.

      Creation was easy; understanding is absent; evolution becomes impossible. Eventually the system is
      rewritten, or handed to specialists who cannot reason about where it came from. The promise of
      simplicity collapses exactly when the system starts to matter.

      **The problem is not the AI. It is that nothing sits between intent and implementation.**

      NPDev is that missing layer — model-driven development and domain-driven design, re-engineered for
      an age where the model is machine-authored and the code is disposable.

      ---
- level: 2
  title: Don't encode accidents. Declare invariants.
  blocks:
  - type: prose
    text: |2

      | | |
      |---|---|
      | **Accidents** | which framework, which table layout, which endpoint shape, which widget |
      | **Invariants** | *there cannot be two users with the same document number* |

      AI can regenerate accidents infinitely and should. **AI must never invent an invariant.** Humans own
      those. NPDev's design follows from that split: the specification holds the truths, the generator
      owns everything downstream of them, and regeneration is cheap precisely because nothing you care
      about lives in the generated code.

      ---
- level: 2
  title: The five things the layer has to contain
  blocks:
  - type: prose
    text: |2

      Not a manifesto — these are keys in the model file, checked by a JSON Schema and a semantic
      validator before anything is generated.

      | The idea | In your model | What it buys you |
      |---|---|---|
      | **Concepts are open boxes** | `concepts[]`, each with fields, rules, a `truthLevel` | Nothing is a black box. Look once and see a concept; look deeper and see its fields, its validations, its generated code |
      | **Invariants are declared, not encoded** | `invariants[]`, `unique`, `expression` | Business truth enforced server-side where it cannot be bypassed — and where a regeneration cannot quietly drop it |
      | **Capabilities are contracts** | `capabilities[]` + `bindings[]` | A named promise: inputs, guarantees, outcomes. The implementation is swappable; the contract is not |
      | **Events are semantic facts** | `events[]` | `InvoiceCompleted`, not `invoiceService.complete()`. Causality is visible instead of buried in a call stack |
      | **Orchestration is declarative** | `orchestrationRules[]`, `flows[]` | *When `InvoiceCompleted`, require payment, then emit the fiscal document, then notify.* No glue code, full traceability, safe to regenerate |

      Every box carries a **truth level** — `T0` idea, `T1` declared, `T2` generated, `T3` runs locally,
      `T4` tested, `T5` evidence-backed, `T6` release-approved. Strictness rises only when you claim
      stronger truth. **Release gates block false release claims; they never block imagination.**
      Doctrine: [`docs/architecture/NPDEV_BOX_OBJECT_TRUTH_VISION.md`](docs/architecture/NPDEV_BOX_OBJECT_TRUTH_VISION.md).

      ---
- level: 2
  title: Prefer not to use a terminal?
  blocks:
  - type: prose
    text: |2

      **NPDev Manager** installs everything for you — Java included — and runs your app from a window.
      [Download it](https://github.com/MarceloGiazzon/NPDevGeneral/releases/latest) (Windows: the
      `NPDev.Manager_*_x64-setup.exe` asset; Linux: the `.AppImage`), double-click, and you never touch a
      command line. Full manual, Linux instructions, and
      troubleshooting → [`docs/MANAGER.md`](docs/MANAGER.md)

      ---
- level: 2
  title: See it run
  blocks:
  - type: prose
    text: |2

      **Requires Java 17+ and Python 3** — Docker is optional, only needed for the Docker run path.
      `./npdev doctor` checks all of it and tells you exactly what is missing. (It runs from the clone —
      there is nothing to install on your PATH first.)
  - type: fence
    lang: sh
    text: |-
      ./npdev doctor                       # is this machine ready? (Java 17+, Python, disk)
      ./npdev setup                        # one-time: build NPDev's own jars locally
      ./npdev init ../my-app               # a small, runnable app, OUTSIDE the clone
      ./npdev dev --model ../my-app/model.json    # build it, run it, and watch it
  - type: prose
    text: |2

      **→ open http://localhost:8080**

      Your app lives **outside** the clone (`../my-app`), and `npdev init` refuses to scaffold inside it —
      an app buried in NPDev's own git history is one nobody else could clone, and one this repo would try
      to track. Every command above runs from the clone, so nothing depends on what you named the folder.

      Log in with the key in `SUPER_USER_KEY.txt`, written to that folder on first start.

      **Four commands.** You now have list and edit screens, a REST API behind them, a database, and
      authentication.

      Leave `npdev dev` running. Add a field to `model.json`, save, and watch:
  - type: fence
    lang: ''
    text: |-
      14:09:02  changed: model.json
      14:09:02  validate ......................................... ok
      14:09:47  ready in 45.2s   http://localhost:8080
  - type: prose
    text: |2

      On Windows the app stops for the rebuild — Windows will not replace a jar a running process
      holds — so there is a short gap with no app on every save. On Linux and macOS the old app
      keeps serving until the new one is ready.

      The screens, the API and the database column are all there. **Get it wrong and it says so without
      taking your app down** — validation runs before anything is touched.

      ---
- level: 2
  title: What you can build
  blocks:
  - type: prose
    text: |2

      This is the part worth reading. **Every row below is a declaration in your model file — not code
      you write.**
- level: 3
  title: Data
  blocks:
  - type: prose
    text: |2

      | You write | You get |
      |---|---|
      | a concept with fields | table, REST API, list/create/edit screens, validation |
      | **13 field types** — text, numbers, dates, enums, references, files, arrays, objects | the right column type, the right input widget, the right validation |
      | a `domainType` | format, validation, widget and label defined **once**, reused everywhere |
      | `{"type":"unique","fields":["isbn"]}` | a real DB constraint, server validation, and a clear error |
      | an `expression` invariant | business rules enforced where they cannot be bypassed |
      | a `reference` field | foreign key, joins, cascade rules, and a searchable picker in the UI |
      | `extends` on a concept | inheritance — shared fields declared once |
      | `derivedExpression` | computed values evaluated server-side, so every client agrees |
      | `indexes` | the indexes your queries need, created and tracked |
- level: 3
  title: Behaviour
  blocks:
  - type: prose
    text: |2

      | You write | You get |
      |---|---|
      | a `flow` with steps | **13 step types** — call, branch, loop, create, update, emit, schedule, await, return |
      | any flow | **durable execution: it survives a process restart and resumes where it stopped** |
      | `awaitEvent` | a process that pauses for an approval or a webhook — for days, across deploys |
      | `forEach`, including parallel | isolated iterations that each resume correctly after a crash |
      | `scheduleEvent` / `schedule` | delayed and recurring work, with no separate scheduler |
      | a `procedure` | reusable server-side logic with parameters and a return value |
      | an `orchestrationRule` | when *this* event happens, run *that* |
      | a `capability` + `binding` | name an operation, swap its implementation without touching the model |
- level: 3
  title: Screens
  blocks:
  - type: prose
    text: |2

      | You write | You get |
      |---|---|
      | nothing | a generated admin UI for every concept, from day one |
      | a `panel` | a real screen with a route, several data sources, layout, and actions |
      | `visibility` / `enabledWhen` | conditional display driven by rules, not JavaScript |
      | an `action` | a button that runs a flow — including ones that stream a generated file back |
      | an `aggregate` | a **master-detail-detail workbench**, saved in one transaction, with commit hooks |
      | a `guidePage` | in-app guidance attached to the screen it explains |
- level: 3
  title: Access
  blocks:
  - type: prose
    text: |2

      | You write | You get |
      |---|---|
      | `roles` + `grants` | roles and what they may do |
      | `requiredRole` | access **enforced at the API**, not just hidden in the UI |
      | row-level rules | control over *which rows* each user sees |
      | `sensitive` on a field | special handling in logs, traces, and exports |
      | — | JWT or API-key auth, a super-user key issued on first boot, and a built-in ControlPanel for users, roles and schedules |
- level: 3
  title: Queries and reporting
  blocks:
  - type: prose
    text: |2

      | You write | You get |
      |---|---|
      | a named `query` | parameterised, permission-checked queries — no SQL built by hand in a controller |
      | `groupBy` + `aggregates` + `having` | roll-ups (`sum`, `count`, `avg`) **joined across concepts** — dashboards without a reporting layer |
      | `tracePolicy` | execution tracing declared per query/procedure instead of remembered — every create/update/delete/restore is audited automatically, with a field diff, whether or not you ask |
- level: 3
  title: Changing it later
  blocks:
  - type: prose
    text: |2

      | You write | You get |
      |---|---|
      | **save the file** | `npdev dev` validates, regenerates, rebuilds and restarts — automatically |
      | a new field | the schema evolves against the live database — it is not dropped and recreated |
      | `renamedFrom` | the column and its contents move together |
      | `conversions` | reshape existing data as part of the change: split, copy, look up, merge |
      | a typo | an error naming the exact path, **and your app still running on the last good model** |
      | — | destructive changes refused unless you acknowledge them explicitly |
      | — | snapshots around risky migrations, and a real lock so two instances cannot migrate at once |
- level: 3
  title: Growing it
  blocks:
  - type: prose
    text: |2

      | You write | You get |
      |---|---|
      | `fragments` | split a large model across files |
      | `packs` | reusable model modules shared between applications |
      | `contexts` + `imports` | bounded contexts, so one team's `Order` is not another's |
      | `propertyScopes` | configuration that cascades: global → tenant → user, in a declared order |
      | — | multi-tenancy, H2 for development and PostgreSQL, MySQL or SQL Server for production |

      **Full reference: `docs/FEATURES.md`.**

      ---
- level: 2
  title: The escape hatch, and why it does not drift
  blocks:
  - type: prose
    text: |2

      Every standard needs an escape hatch, or people route around the standard entirely. Reality will
      always produce a requirement the declared step vocabulary does not cover.

      **So NPDev never asks you to edit generated code.** Your code is referenced *from* the model and
      lives *beside* the generated app, hash-pinned, so a regeneration cannot overwrite it and a modified
      copy cannot silently run:

      | Escape hatch | How it survives a regeneration |
      |---|---|
      | `untrustedExtensionEntrypoint` on a procedure | your own Java class, pinned by hash in the app's `untrusted-extension-manifest.json`, admitted through the same bytecode/AST safety gate as a mounted plugin |
      | `untrustedExtensionEntrypoint` on a panel | your own HTML/JS asset, hash-pinned into the app — for bringing an existing page with you |
      | a `capability` with a swapped `binding` | the contract stays in the model; the implementation is yours and is resolved at runtime |
      | the generated REST API | a bespoke frontend is just another client — outside the blast radius of a regeneration entirely |

      Regeneration deliberately spares exactly three directories inside a built app — `data`, `logs`,
      `secrets` — so a rebuild never costs you your database, your history, or your keys.

      **"Untrusted" names the safety posture the platform applies, not a judgement on the author.** Where
      each hatch sits relative to the declarative paths — and when *not* to reach for one — is
      [`docs/NPDEV_FEATURE_GUIDE.md`](docs/NPDEV_FEATURE_GUIDE.md).
- level: 3
  title: Custom code is a fork signal
  blocks:
  - type: prose
    text: |2

      One exception is an exception. Five exceptions piling up inside one concept mean the concept was
      wrong: `Invoice` was never one thing — it was `MedicalInvoice` and `RentalInvoice` all along.

      `specializes` says exactly that in the model: this concept is a specialization of that one. When the
      parent comes from a pack, the parent version is **pinned** to the pack version you last generated
      against, and generation refuses once the pack has moved — unless you set `specializesFloat` to opt
      that concept into tracking the pack's current version. **Inheritance drift becomes a decision you
      make, not something that happens to you.**

      ---
- level: 2
  title: What you actually get
  blocks:
  - type: prose
    text: ""
  - type: fence
    lang: ''
    text: |-
      Java 17 · Spring Boot · Gradle · H2 (dev) / PostgreSQL, MySQL or SQL Server (production)
      REST API · generated admin UI · JWT or API-key auth · Docker Compose included
  - type: prose
    text: |2

      **A normal Gradle project.** Open it in your IDE, read it, commit it, deploy it anywhere you deploy
      Spring Boot. **If you stopped using NPDev tomorrow, your application would keep working.**
- level: 3
  title: Enterprise infrastructure without a platform team
  blocks:
  - type: prose
    text: |2

      The JVM is the point, not the price of admission. Someone building their first real system is
      usually pushed onto fragile serverless wiring or a low-code vendor's lock-in, and both buckle under
      real load, real data, and real audit questions. NPDev hands that same person a multi-threaded,
      transactional, battle-tested backend — the stack banks run on — with connection pooling,
      migrations, durable execution and role enforcement already wired.

      The trade-off is explicit, and it is a good one: **a small VPS running a JVM container is a rounding
      error next to hiring someone to configure Kubernetes, connection pools and backup pipelines.** NPDev
      absorbs the architectural complexity; you keep full ownership of the stack, and you can walk away
      from NPDev without losing it.

      ---
- level: 2
  title: Changing your mind is the normal case
  blocks:
  - type: prose
    text: |2

      Add a field to your model, regenerate, and the app follows — the screens, the API, and the database
      schema. Rename something and say so with `renamedFrom`, and it is understood as a rename.

      Most business applications are wrong three times before they are right. **NPDev is built for the
      third version, not the first.**

      ---
- level: 2
  title: Who this is for
  blocks:
  - type: prose
    text: |2

      **A good fit for** internal tools, admin systems, operations back-offices, line-of-business
      apps — anything with real entities, real rules, real users, and a schema that will change a dozen
      times before it settles.

      **Also a good fit if you want an AI to write it.** The model is JSON with a strict schema and a
      validator that returns typed, machine-readable errors, so an agent can author, check its own work,
      and correct itself — and every rule it must not touch is declared somewhere a human can review it.
      See `docs/AUTHORING_WITH_AI.md`.

      **And a good fit for the senior developer who is nobody's idea of a beginner.** The declarative
      layer is not there because you cannot write the code; it is there so you do not write it for the
      fifth time — and so that when you do reach for code, the reach is surgical and it survives the next
      regeneration.

      **Not a good fit if you want** a bespoke consumer-facing UI (NPDev generates a functional admin
      interface, not a designed product surface), a microservice generator (one model is one deployable
      app), or frozen APIs today.

      ---
- level: 2
  title: Honest limitations
  blocks:
  - type: prose
    text: |2

      - **Custom screens are hand-written.** You get a working admin UI plus declarable panels and
        workbenches; a polished, bespoke frontend is built against the generated REST API like any other
        client.
      - **One model is one deployable app.** Bounded contexts exist inside a model; this is not a
        microservice generator.
      - **The app restarts to pick up a model change.** `npdev dev` makes that automatic and
        reports it, but it is a restart, not hot reload.
      - **Pre-1.0 and deliberately unstable.** See below.

      The current, complete list of designed limits is `docs/ACCEPTED_BOUNDARIES.md` — kept accurate on
      purpose, because a stale limitations page costs more trust than a short feature list.

      ---
- level: 2
  title: The CLI
  blocks:
  - type: prose
    text: ""
  - type: fence
    lang: sh
    text: |-
      ./npdev doctor                    # check this machine
      ./npdev setup                     # build NPDev's jars locally (once per clone)
      ./npdev init <name>               # scaffold a new model, with git history
      ./npdev dev                       # watch the model; rebuild + restart on save
      ./npdev run app                   # generate, build, boot, health-check (one shot)
      ./npdev validate model <path>     # full structural + semantic check, no generation
      ./npdev generate app --model <m> --config <c> --output <dir>
      ./npdev mcp install               # connect an AI tool to NPDev
      ./npdev why B13                   # explain an accepted design limit (id or the code you just hit)
      ./npdev db verify --app <dir>     # does the live database match the model? No app boot required.
  - type: prose
    text: |2

      `npdev --help` describes every command. **Windows:** `npdev.bat`, same arguments.

      For AI-authored models, `./npdev normalize ai-model <path>` rewrites a draft into canonical form
      before validation.

      ---
- level: 2
  title: Stability policy (pre-1.0)
  blocks:
  - type: prose
    text: |2

      NPDev is pre-1.0 and **deliberately unstable**. The model DSL, generated code layout, and internal
      APIs will change without deprecation cycles.

      **This is a design position, not an apology.** NPDev models are meant to be machine-authored — an
      agent writes them from your specification. **A breaking DSL change costs one regeneration, not a
      migration project.** We would rather fix a design mistake than carry it for a decade.

      Every breaking change ships with an `npdev migrate` codemod that rewrites existing models
      automatically, a one-line entry in `BREAKING.md`, and the reason it was worth breaking.

      **If you need frozen APIs today, NPDev is not ready for you.** We freeze at 1.0, and not one release
      before.

      ---
- level: 2
  title: Where to go next
  blocks:
  - type: prose
    text: |2

      | If you want to… | Go to |
      |---|---|
      | **build your own app** | `docs/YOUR_FIRST_APP.md` — about 15 minutes |
      | **have an AI write the model** | `docs/AUTHORING_WITH_AI.md` |
      | **see everything it can do** | `docs/FEATURES.md` |
      | understand the concepts | `docs/NPDEV_CONCEPTS_DEEP_DIVE.md` |
      | deploy properly (Postgres, Docker, env vars) | `docs/DEPLOYMENT.md` |
      | use MySQL or SQL Server | `docs/reference/USING_MYSQL_AND_SQL_SERVER.md` — supported, with caveats the page calls out |
      | know how schema changes work | `docs/DATABASES_AND_MIGRATIONS.md` |
      | know what NPDev **won't** do | `docs/ACCEPTED_BOUNDARIES.md` |
      | fix a broken setup | `npdev doctor`, then `docs/GETTING_STARTED.md` |
      | see where the platform is heading | `docs/architecture/NPDEV_BOX_OBJECT_TRUTH_VISION.md` |
      | browse everything else | [`docs/README.md`](docs/README.md) — the full documentation index |

      ---
- level: 2
  title: License and status
  blocks:
  - type: prose
    text: |2

      Apache-2.0 (see `LICENSE`). Pre-1.0; the git tag (e.g. `beta1.4`) is the authoritative release
      version. Two other numbers exist and mean something narrower: `npdev --version` reports the
      portable CLI wrapper's own version, and the Gradle module version pinned in each module's
      `build.gradle` (e.g. `NPDevContract/dsl/build.gradle`) is an internal JAR-artifact version, not the
      platform's. Separately, every model declares `"dslVersion": "1.0.0"` — that is the *model JSON
      format* version, unrelated to any of the above; it has never changed, including across the
      "DSL 2.0" flowStep-vocabulary change (`BREAKING.md`).

      The latest tag as of this writing is `beta1.20` (cut 2026-08-26); `main` moves continuously between
      tags, so a tag is a point-in-time cut, not a live mirror of `HEAD` — check
      `git tag --sort=-creatordate` for the current one rather than trusting a number written into this
      file. (`beta1.5` and `beta1.6` each accumulated drift against `main` before being superseded; the
      practice since is to cut the next tag fresh at `main` rather than try to move a published one.)

      **`main` is the sole working/release branch** (as of 2026-08-07, REG-139/I2 + FINAL_PLAN.md/F1) —
      no second long-lived branch is kept in sync with it, and all work lands directly on `main`. That
      policy claim is about there being no competing *release* branch, not about the repo having zero
      other branches at any given moment: short-lived feature/experiment branches accumulate on both
      `origin` and locally and are cleaned up periodically, some already fully merged and some abandoned
      mid-experiment — neither carries release state that isn't already on `main`. See
      `docs/RELEASE_PROCESS.md`'s "Merge cadence" section for why a drifting second *working* branch was
      a real, previously-recurring problem (150 and then 71 commits of drift), and why collapsing to one
      working branch removes that failure mode by construction.
