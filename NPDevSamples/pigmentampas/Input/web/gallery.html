<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pigmentampas - Gallery</title>
  <link rel="stylesheet" href="shell.css" />
  <script src="shell.js" defer></script>
  <style>
    .gallery { padding: 14px; max-width: 1100px; margin: 0 auto; font-size: 13px; }
    .gallery h2 { margin: 0 0 10px; font-size: 16px; }
    .status { min-height: 18px; opacity: .8; margin-bottom: 8px; }
    .status.error { color: #b3261e; opacity: 1; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
    .card { display: block; border: 1px solid rgba(128,128,128,.35); border-radius: 8px; padding: 10px;
            color: inherit; text-decoration: none; }
    .card:hover { border-color: #1a73e8; }
    .card .title { font-weight: 600; margin-top: 8px; }
    .card .meta { opacity: .7; font-size: 12px; }
    .thumb { position: relative; margin: 0 auto; }
    .thumb .cell { position: absolute; width: 22px; height: 22px; border-radius: 50%;
                   background-size: cover; background-position: center; }
    .thumb .cell.empty { background: #888; opacity: .25; }
  </style>
</head>
<body>
  <main class="gallery">
    <h2>Gallery</h2>
    <div id="status" class="status">Loading...</div>
    <div id="cards" class="cards"></div>
  </main>
  <script>
  (function () {
    "use strict";
    // Pigmentampas gallery: every mosaic the PublishedMosaics query returns, each with a 30-cell hex
    // thumbnail (rows of 3-4-5-6-5-4-3 caps) cropped around the most densely painted part of the board.
    // Same odd-r offset geometry as studio.html: odd rows sit half a cap to the right.
    var SHAPE = [3, 4, 5, 6, 5, 4, 3], SIZE = 22, ROW_STEP = 19, MAX_CARDS = 48;
    var api, capById = {};

    function $(id) { return document.getElementById(id); }
    function setStatus(text, isError) {
      var el = $("status");
      el.textContent = text;
      el.className = "status" + (isError ? " error" : "");
    }

    // The crop whose middle (6-wide) row is row r0 starting at column c0, as [row, col] pairs.
    // Each row is centred on the same x, measured in cap widths including the odd-row half shift.
    function crop(r0, c0) {
      var cx = c0 + 2.5 + (r0 % 2) / 2, cells = [];
      SHAPE.forEach(function (w, i) {
        var r = r0 + i - 3;
        var start = Math.round(cx - (w - 1) / 2 - (r % 2) / 2);
        for (var c = start; c < start + w; c++) cells.push([r, c]);
      });
      return cells;
    }

    function densestCrop(grid, rows, cols) {
      var best = null, bestCount = -1;
      for (var r0 = 3; r0 <= rows - 4; r0++) {
        for (var c0 = 0; c0 <= cols - 6; c0++) {
          var cells = crop(r0, c0), count = 0, inside = true;
          for (var i = 0; i < cells.length; i++) {
            var p = cells[i];
            if (p[1] < 0 || p[1] >= cols) { inside = false; break; }
            if (grid[p[0] + "," + p[1]]) count++;
          }
          if (inside && count > bestCount) { best = cells; bestCount = count; }
        }
      }
      return best || crop(3, 0);
    }

    function renderThumb(tree) {
      var grid = {};
      (tree.cells || []).forEach(function (cell) { if (cell.capId) grid[cell.row + "," + cell.col] = cell.capId; });
      var cells = densestCrop(grid, tree.rows || 20, tree.cols || 33);
      var minX = Infinity, minR = Infinity;
      cells.forEach(function (p) {
        minX = Math.min(minX, p[1] + (p[0] % 2) / 2);
        minR = Math.min(minR, p[0]);
      });
      var thumb = document.createElement("div");
      thumb.className = "thumb";
      thumb.style.width = (6 * SIZE) + "px";
      thumb.style.height = ((SHAPE.length - 1) * ROW_STEP + SIZE) + "px";
      cells.forEach(function (p) {
        var el = document.createElement("span");
        var cap = capById[grid[p[0] + "," + p[1]]];
        el.className = "cell" + (cap ? "" : " empty");
        el.style.left = ((p[1] + (p[0] % 2) / 2 - minX) * SIZE) + "px";
        el.style.top = ((p[0] - minR) * ROW_STEP) + "px";
        if (cap) {
          el.style.backgroundColor = cap.dominantColor || "#999";
          if (cap.image) el.style.backgroundImage = "url(\"" + api.fileUrl(cap.image) + "\")";
          el.title = cap.label;
        }
        thumb.appendChild(el);
      });
      return thumb;
    }

    function card(mosaic) {
      var a = document.createElement("a");
      a.className = "card";
      a.href = "studio.html?id=" + encodeURIComponent(mosaic.id);
      var title = document.createElement("div");
      title.className = "title";
      title.textContent = mosaic.title;
      var meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = [mosaic.code, mosaic.ownerUsername, mosaic.status].filter(Boolean).join(" - ");
      a.appendChild(document.createElement("div"));
      a.appendChild(title);
      a.appendChild(meta);
      return a;
    }

    function start() {
      api = window.NPDevShell.api;
      api.ready().then(function () {
        return Promise.all([
          api.get("/api/queries/ApprovedCaps?limit=1000"),
          api.get("/api/queries/PublishedMosaics?limit=" + MAX_CARDS)
        ]);
      }).then(function (res) {
        ((res[0] && res[0].rows) || []).forEach(function (cap) { capById[cap.id] = cap; });
        var mosaics = (res[1] && res[1].rows) || [];
        if (!mosaics.length) { setStatus("No published mosaics yet."); return; }
        setStatus(mosaics.length + " published mosaic" + (mosaics.length === 1 ? "" : "s") + ".");
        var cards = $("cards");
        // One aggregate read per mosaic fills its thumbnail; the card shows as soon as the list is in.
        mosaics.forEach(function (m) {
          var el = card(m);
          cards.appendChild(el);
          api.get("/api/runtime/aggregate/MosaicAggregate/" + encodeURIComponent(m.id)).then(function (tree) {
            el.replaceChild(renderThumb(tree), el.firstChild);
          }).catch(function () { /* card stays without a thumbnail */ });
        });
      }).catch(function (err) {
        setStatus("Gallery failed to load: " + err.message, true);
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      if (!window.NPDevShell || !window.NPDevShell.api) {
        setStatus("The NPDev shell (shell.js) did not load - this page must be served by the app.", true);
        return;
      }
      start();
    });
  })();
  </script>
</body>
</html>
