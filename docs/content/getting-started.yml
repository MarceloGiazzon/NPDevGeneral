sourceFile: docs/GETTING_STARTED.md
preamble:
- type: prose
  text: |
    # Getting Started

    This is the actual first hour: check the machine, create an app with `npdev init`, run it, then
    change the model and watch the change land. Start from the repository root. On Linux and macOS,
    use the portable `npdev` entrypoint; on Windows use `npdev.bat` with the same arguments (examples
    below use `./npdev` — swap in `npdev.bat` and backslash paths on Windows).

    Requires Java 17+ and Python 3 (the `npdev` CLI is Python itself), with Gradle and PowerShell
    fetched on demand — Docker is optional, only needed for the container run path described in
    `docs/DEPLOYMENT.md`. `./npdev doctor` checks everything below and tells you exactly what is
    missing.
sections:
- level: 2
  title: 1. Validate a model
  blocks:
  - type: prose
    text: ""
  - type: fence
    lang: sh
    text: |-
      ./npdev --version
      ./npdev validate model NPDevContract/dsl/resources/Models/canonical-demo/model.json
  - type: prose
    text: |2

      `validate model` runs full structural + semantic validation by default (it shells out to
      Gradle — a few seconds once Gradle is warm, several minutes the very first time, while the
      distribution and the DSL's dependency graph download) and exits non-zero with a diagnostic
      report if the model has a real defect. Pass `--structural-only` for a fast JSON-Schema-only
      check that skips Gradle entirely --
      useful as an inner-loop syntax check, but its success message says explicitly that semantic checks
      did not run, so it can't be mistaken for the full check. `--semantic` still works too, as a
      documented no-op alias (it's already the default).
- level: 2
  title: 2. Create and run an app of your own
  blocks:
  - type: prose
    text: |2

      The README's quick path is the one that is executed nightly against a bare container, so it is
      the path this page documents. Three commands once, then one command forever:
  - type: fence
    lang: sh
    text: |-
      ./npdev doctor                       # is this machine ready? (Java 17+, Python 3, disk)
      ./npdev setup                        # one-time: build NPDev's own jars locally
      ./npdev init ../my-app               # a small, runnable app, OUTSIDE the clone
      ./npdev dev --model ../my-app/model.json    # build it, run it, and watch it
  - type: prose
    text: |2

      `npdev doctor` checks the machine and says exactly what is missing — run it first if anything
      below fails. `npdev setup` compiles NPDev's own jars once per clone (it tries a prebuilt
      download first; the first run can take several minutes either way). `npdev init ../my-app`
      scaffolds a complete app folder outside the clone — model, config, a real H2Local database,
      README, and git history — and refuses to scaffold inside the repo. `npdev dev` generates,
      builds, boots, and then watches the model; every save re-runs the whole sequence.

      NPDev keeps its build output in a `Build/` directory NEXT TO your clone, never inside it — set
      `NPDEV_BUILD_ROOT` to put it somewhere else (a clone in a read-only parent directory is the
      classic case where this matters).

      On first boot the app writes `SUPER_USER_KEY.txt` next to its own files — log in to
      `/control-panel.html` with that key. The H2Local database keeps your data across restarts, so
      step 3 below actually demonstrates schema evolution instead of rebuilding an empty database.

      The `generate app` + Docker path this page used to teach is still supported and documented —
      it is the deployment path, in `docs/DEPLOYMENT.md` (build the jar first; the Dockerfile
      packages an already-built jar, it does not build one).
- level: 2
  title: 3. Change the model, regenerate
  blocks:
  - type: prose
    text: |2

      Edit `model.json` in the app you created — add a field, add a concept, anything small — and
      watch `npdev dev` regenerate. The generator diffs the new shape against what's already there
      (schema evolution, not drop-and-recreate) — see `docs/DATABASES_AND_MIGRATIONS.md` for how
      renames and destructive changes are handled.

      `npdev dev` validates first, so a typo prints an error naming the exact path and leaves the
      running app alone on the last good model — it does not take the app down.

      **Now build something of your own.** `docs/YOUR_FIRST_APP.md` walks a real first app end to
      end, including the two refusals every newcomer meets in week one (renames, and destructive
      changes that need an acknowledgment).
- level: 2
  title: '4. Before you change a field: who uses it?'
  blocks:
  - type: prose
    text: ""
  - type: fence
    lang: sh
    text: |-
      # every place this field is referenced -- panels, queries, procedures, flows
      ./npdev inspect usage --model <model.json> --of Patient.birthDate

      # the same question about a whole concept, or about a named object
      ./npdev inspect usage --model <model.json> --of Patient
      ./npdev inspect usage --model <model.json> --of procedure:EnrichRows

      # every reference that does NOT resolve; exits 2 if any is a real orphan
      ./npdev inspect usage --model <model.json> --orphans

      # the same answer as a self-contained HTML page you can open or send to someone
      ./npdev inspect usage --model <model.json> --of Patient.birthDate --diagram usage.html
  - type: prose
    text: |2

      A field is referenced from more places than it looks: a panel's table columns and field bindings,
      a query's `orderBy` and `where`, a procedure's steps, a visibility rule. Renaming or removing one
      without checking those is the most common way to break a model that still validates.

      Each result carries the exact structural `path` of the reference (for example
      `panels[PatientsPanel].fieldBindings[2].field`), which is what `npdev migrate rename --cascade`
      edits when it updates them for you.

      Three outcomes, and the third one matters:

      - **RESOLVED** -- the target exists.
      - **UNRESOLVED** -- nothing by that name exists. This is a real defect, and `npdev validate model`
        now fails on it.
      - **UNDECIDABLE** -- the reference could not be worked out without running the app (an expression
        outside the predicate grammar, a `$var.field` whose producing step declares no shape). It is
        reported, never counted as clean, and never treated as a failure. "We could not check this" and
        "we checked it and it was fine" are different answers, and a tool that prints them identically
        is how a broken model comes to validate cleanly.
- level: 2
  title: Other useful commands
  blocks:
  - type: prose
    text: ""
  - type: fence
    lang: sh
    text: |-
      ./npdev doctor
      ./npdev normalize ai-model golden-ai-scenarios/base-ai-loop/ai-model.json
      ./npdev report bootstrap
  - type: prose
    text: |2

      `doctor` checks this machine is ready -- Java 17 and `JAVA_HOME` agreement, Python, git, disk
      space, and whether the runtimehost jars (`./npdev setup`) and AI knowledge index are staged; safe
      to run any time. `normalize ai-model` is the first step of the AI-authoring loop
      (`docs/ai/AI_KNOWLEDGE_LOOP_AND_TOOLING_PLAN.md`). `./npdev report bootstrap` regenerates the
      maintainer status reports under `scripts/reports/out/`.

      `./npdev init my-app` scaffolds a new app directory (model/config/a real database/README/git
      history) instead of copying `canonical-demo` by hand -- see `docs/YOUR_FIRST_APP.md`. `./npdev mcp
      install --client claude-code` (or `claude-desktop`, or `--print`) connects an AI client to NPDev's
      MCP tools -- see `docs/AUTHORING_WITH_AI.md`.
- level: 3
  title: Driving NPDev from a program, not a terminal
  blocks:
  - type: prose
    text: |2

      `doctor`, `setup`, and `init` all accept `--json`, which is an *additive* second output mode --
      the human summary printed without the flag is unchanged (byte-for-byte), so this is safe to add to
      an existing script without breaking anyone reading the terminal output. Pass `--json` and nothing
      but a machine-readable object (or, for `setup`, a stream of them) goes to stdout; any narration
      moves to stderr instead.

      - **`npdev doctor --json`** emits one `npdev-cli-result.v1` object with a `checks` array -- one
        record per check (`id`, `status`: `pass`/`fail`/`warn`, `found`, `expected`, `detail`, `fix`,
        `fixCommand`), including the ones that passed (the human summary only ever prints failures and
        warnings, so passing checks are otherwise invisible to a caller). `java-present`/`java-version`
        resolve `JAVA_HOME` before falling back to PATH, matching Gradle's own resolution order -- a
        private JDK works even with nothing on PATH at all.
      - **`npdev setup --json`** emits one `npdev-cli-event.v1` object per line (JSON Lines) as each
        phase (`jars`, `knowledge-index`) starts and finishes, ending with one `npdev-cli-result.v1`
        object. `setup` tries a prebuilt `runtimehost-libs-<tag>.zip` Release asset first on a tagged
        commit (checksum-verified against a sibling `SHA256SUMS`), and always falls back to a full local
        build -- untagged commit, no asset published, download failure, checksum mismatch, or
        `--build-local` passed. Either way, the result object's `jarsSource` field (and a trailing
        `Jars source:` line in the human output) says which path was actually taken.
      - **`npdev init my-app --json`** emits one object with `created.directory` (always absolute --
        a calling program has no shared working directory to resolve a relative path against),
        `created.files`, `gitInitialised`, and `nextCommand`. `gitInitialised` is `false` on a machine
        with no git — the scaffold still succeeds and `gitIdentityNotice` carries the sentence explaining
        what is missing.

      This exists for the same reason `npdev run app`/`npdev verify` already print structured JSON: an
      AI agent driving NPDev through MCP, CI asserting on fields instead of grepping sentences, or a
      future GUI (the NPDev Manager) all need a result they can parse, not prose meant for a human.

      `npdev verify --tier T0|T1|T2|T3` is the one entry point for this repo's verification tiers, from
      an inner-loop syntax/schema check (T0, ~1s) up through a full canary build+boot+smoke (T1, a few
      minutes) to the complete gate suite (T2) and release-readiness evidence (T3) -- see
      `scripts/quality/run-fast-gate.ps1`'s own doc comment for what each tier actually covers.
- level: 2
  title: Authoring in the editor
  blocks:
  - type: prose
    text: |2

      The browser-based authoring UI (concepts, fields, flows, panels) as an alternative to hand-editing
      model JSON is already built into every app you generate -- open **`/model-authoring.html`** on
      your running app (e.g. `http://localhost:8080/model-authoring.html`). No separate install or
      server needed; it covers the starter templates and the common scaffolding and editing actions.

      This page replaced the old React bundle at `/npdev-ui-react/`, which was removed on 2026-08-20
      (EDIT-12) -- a generated app returns 404 for that route. See `BREAKING.md` for the full history.
- level: 2
  title: When running from another directory
  blocks:
  - type: prose
    text: |2

      Set `NPDEV_ROOT` to the workspace root before invoking `npdev`.
  - type: fence
    lang: sh
    text: |-
      export NPDEV_ROOT="$(pwd)"
      ./npdev validate model NPDevContract/dsl/resources/Models/canonical-demo/model.json
  - type: prose
    text: ""
- level: 2
  title: PowerShell scripts
  blocks:
  - type: prose
    text: |2

      PowerShell scripts under `scripts/quality` (`run-all-gates.ps1`, `run-fast-gate.ps1`, and friends)
      are the primary maintainer path for this repo's own development, not a legacy compatibility layer
      -- `npdev verify` above shells out to them directly. The portable `npdev`/`npdev.bat` commands in
      this doc are what an app author or an AI-authoring agent needs; the PowerShell scripts are what a
      platform maintainer runs to validate a change to NPDev itself.
