      Apache-2.0 (see `LICENSE`). Pre-1.0; the git tag (e.g. `beta1.4`) is the authoritative release
      version. Two other numbers exist and mean something narrower: `npdev --version` reports the
      portable CLI wrapper's own version, and the Gradle module version pinned in each module's
      `build.gradle` (e.g. `NPDevContract/dsl/build.gradle`) is an internal JAR-artifact version, not the
      platform's. Separately, a model may declare `"dslVersion": "1.0.0"` (optional; omitted means 1.0.0) — that is the *model JSON
      format* version, unrelated to any of the above; it has never changed, including across the
      "DSL 2.0" flowStep-vocabulary change (`BREAKING.md`).

      The latest tag as of this writing is `beta1.20` (cut 2026-08-26); `main` moves continuously between
      tags, so a tag is a point-in-time cut, not a live mirror of `HEAD` — check
      `git tag --sort=-creatordate` for the current one rather than trusting a number written into this
      file. (`beta1.5` and `beta1.6` each accumulated drift against `main` before being superseded; the
      practice since is to cut the next tag fresh at `main` rather than try to move a published one.)

      **`main` is the only branch.** All work is committed directly to `main`. No feature, topic or
      release branch exists, locally or on `origin`. A stray branch, for example one opened by
      Dependabot, is folded into `main` or deleted when it is found. See `docs/RELEASE_PROCESS.md`'s
      "Merge cadence" section for why a drifting second working branch was a real, recurring problem
      (150 and then 71 commits of drift), and why having one branch removes that failure mode by
      construction.
