<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Admin Panel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 32px;
      color: #172033;
      background: #f7f8fb;
    }

    main {
      max-width: 880px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #d8deea;
      border-radius: 8px;
      padding: 24px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 16px;
    }

    button {
      border: 1px solid #1f5eff;
      background: #1f5eff;
      color: #ffffff;
      border-radius: 6px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #ffffff;
    }

    th,
    td {
      text-align: left;
      border-bottom: 1px solid #d8deea;
      padding: 10px 8px;
    }

    th {
      background: #eef3ff;
      font-size: 13px;
      text-transform: uppercase;
    }

    #status {
      margin-left: 12px;
      color: #2e6b3f;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>User Admin Panel</h1>
    <button id="createUsers" type="button">create users</button>
    <span id="status"></span>

    <table aria-label="Users">
      <thead>
        <tr>
          <th>Id</th>
          <th>Name</th>
          <th>Email</th>
          <th>Active</th>
        </tr>
      </thead>
      <tbody id="usersTable"></tbody>
    </table>
  </main>

  <script>
    const fallbackUsers = [
      { id: "u-001", name: "Ana Silva", email: "ana@example.test", active: true },
      { id: "u-002", name: "Bruno Costa", email: "bruno@example.test", active: true },
      { id: "u-003", name: "Carla Rocha", email: "carla@example.test", active: true }
    ];

    function renderUsers(users) {
      const body = document.getElementById("usersTable");
      body.innerHTML = "";
      for (const user of users) {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${user.id}</td>
          <td>${user.name}</td>
          <td>${user.email}</td>
          <td>${user.active ? "yes" : "no"}</td>
        `;
        body.appendChild(row);
      }
    }

    async function callCreateUsersProcedure() {
      if (window.NPDev && typeof window.NPDev.callProcedure === "function") {
        return window.NPDev.callProcedure("create-users", {
          requestedBy: "panel-user",
          source: "user-admin-panel"
        });
      }
      return {
        createdCount: fallbackUsers.length,
        users: fallbackUsers
      };
    }

    document.getElementById("createUsers").addEventListener("click", async () => {
      const result = await callCreateUsersProcedure();
      renderUsers(result.users || []);
      document.getElementById("status").textContent = `${result.createdCount || 0} users created`;
    });
  </script>
</body>
</html>
