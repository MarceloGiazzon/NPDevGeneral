# BT-1: NO hardcoded org.gradle.projectcachedir here -- see NPDevKernel/gradle.properties' own
# comment (REG-136) for the full reasoning. sync-runtimehost-libs.ps1 / npdev_cli.py's
# gradle_project_cache_args("runtimehost-core") pass --project-cache-dir per invocation instead, so
# this file stays portable to any machine.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xms512m -Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=4
