# REG-10: NO hardcoded org.gradle.projectcachedir here. This file is the RuntimeHost TEMPLATE,
# copied verbatim into every generated FinalApp by FinalAppAssembler. A hardcoded
# D:/WorkSpace/NPDev/Build/... path is a dev-machine-only build-output-policy setting that makes
# every generated app non-portable: gradle reads projectcachedir during wrapper bootstrap (before any
# CLI/env override can take effect), so on a Linux runner -- or any machine without that exact D:
# path -- the generated app's `gradlew bootJar` breaks. The CI workflow already sed-strips this line
# from every module it builds directly, but it cannot reach a FinalApp's gradle.properties that only
# exists after the generator runs inside a test. Leaving it unset lets gradle use its portable default
# (<projectDir>/.gradle), which works on any OS. (The other platform modules keep their projectcachedir
# for the dev-machine build-output policy; RuntimeHost is a template, never built standalone, so it
# must not impose a dev path on generated apps.)
org.gradle.jvmargs=-Xms1g -Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.workers.max=8