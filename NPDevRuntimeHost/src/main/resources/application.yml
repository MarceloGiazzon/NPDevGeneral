server:
  port: 8080

spring:
  config:
    import: "optional:classpath:application-npdev-db.properties,optional:classpath:application-npdev-auth.properties,optional:classpath:application-npdev-log.properties"

  # LIFT-UPLOAD-P3: Spring's own multipart defaults (1MB/10MB) silently reject anything bigger --
  # the platform's own limit is the field's declared file.maxSizeBytes (FileUploadController),
  # so this ceiling just needs to be generous enough not to be the actual constraint in practice.
  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 25MB

  datasource:
    url: jdbc:postgresql://localhost:5432/finalexec
    username: finalexec
    password: finalexec
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/schema-realization

logging:
  level:
    org.hibernate.SQL: INFO

# --- Added: Actuator exposure for local testing ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
