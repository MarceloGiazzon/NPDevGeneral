server:
  port: 8080

spring:
  config:
    import: "optional:classpath:application-npdev-db.properties"

  datasource:
    url: jdbc:postgresql://localhost:5432/finalexec
    username: finalexec
    password: finalexec
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/schema-realization

logging:
  level:
    org.hibernate.SQL: INFO

# --- Added: Actuator exposure for local testing ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
