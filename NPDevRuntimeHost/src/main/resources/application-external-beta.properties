# External beta profile - JWT authentication
npdev.auth.enabled=true
npdev.auth.mode=jwt

# Override these in the deployment environment or docker/compose env
npdev.auth.jwt.issuer=${NPDEV_JWT_ISSUER:}
npdev.auth.jwt.audience=${NPDEV_JWT_AUDIENCE:}
npdev.auth.jwt.public-key-path=${NPDEV_JWT_PUBLIC_KEY_PATH:}

# JWT is the active external-beta auth path; API key auth must not be used.
npdev.auth.api-keys=

# External beta is intended for the governed postgres runtime lane.
npdev.runtime.mode=postgres
server.port=8080
