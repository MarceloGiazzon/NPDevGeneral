spring:
  main:
    allow-bean-definition-overriding: true

npdev:
  auth:
    mode: apikey
    api-keys: "api-dev=dev:developer:admin;dev-key=dev:developer:admin"
  security:
    apiKey:
      required: true
    encodedMappings: "api-dev=dev:developer:admin;dev-key=dev:developer:admin"
    apiKeys:
      api-dev:
        actor: developer
        tenant: dev
        roles: [admin]
      dev-key:
        actor: developer
        tenant: dev
        roles: [admin]

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    com.finalexec: DEBUG
    com.finalexec.config: INFO
    com.npdev.generated.runtime: DEBUG
    com.npdev.kernel: DEBUG
    com.npdev.kernel.capabilities: DEBUG
