spring:
  main:
    allow-bean-definition-overriding: true

npdev:
  auth:
    mode: apikey
    # T1/C2: no key is seeded here anymore -- dev now fails closed exactly like application-default
    # and application-prod do. This used to publish "api-dev=dev:developer:admin;dev-key=...", a
    # known ADMIN credential in a public repository; StartupValidator.validateAuth() now refuses to
    # boot until one is supplied externally, via NPDEV_AUTH_API_KEYS/NPDEV_AUTH_APIKEYS (env var
    # takes precedence over this file, replacing it outright -- single String property, no merge) --
    # exactly what _ops/Run-FinalApp.ps1 / _ops/run-final-app.sh's Ensure-NpdevApiKey already
    # provisions per app into secrets/api-key.env before every boot.

# QUAL-13 verification: comment-only change under NPDevRuntimeHost/**, no workflow file touched --
# proves manager-harness.yml's new pull_request.paths entry fires on its own. Throwaway; this PR is
# not meant to merge.
logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    com.finalexec: DEBUG
    com.finalexec.config: INFO
    com.npdev.generated.runtime: DEBUG
    com.npdev.kernel: DEBUG
    com.npdev.kernel.capabilities: DEBUG
