# Logging
# R7 Stage B (profiles, SEC-1): 'dev' is deliberately NOT set as the implicit Spring default
# profile here anymore. It used to be (spring.profiles.default=dev), which meant every launcher
# that started the jar with no --spring.profiles.active flag silently got application-dev.yml's
# known api-dev/dev-key mapping active (Stage A already fail-closed the AUTH-FILTER'S fallback for
# a missing/malformed mapping; this is the separate case of a mapping that IS present and valid,
# just implicitly and unintentionally so). Leaving this unset means Spring's own reserved 'default'
# profile activates instead whenever nothing explicit is passed -- application-default.properties
# (governed execution mode, no auth keys) -- so an un-profiled boot now fails closed at
# StartupValidator.validateAuth() rather than quietly running as dev. Every supported launcher
# already passes an explicit profile: _ops/Run-FinalApp.ps1 (OperationalRunbookEmitter,
# --spring.profiles.active=$Profile, default 'dev'), Build-NpdevApp.ps1/Build-ClaudeApp.ps1
# (--spring.profiles.active=dev,step0,trial), the packaged-app proof tests, and the README this
# template emits (FinalAppAssembler#writeAppReadme: java -jar ... --spring.profiles.active=dev).
# LNCH-8: correlation id (stamped by CorrelationIdFilter) in every log line.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} ${LOG_LEVEL_PATTERN:-%5p} [%X{correlationId:--}] %logger{39} : %m%n%wEx

# R9.2: rolling size+time-capped FILE logging, using Spring Boot's own logback rolling-policy
# support (logging.logback.rollingpolicy.*) -- no custom logback.xml, no bespoke rotator written
# for this. Setting logging.file.name switches on Spring Boot's built-in RollingFileAppender
# (SizeAndTimeBasedRollingPolicy) ALONGSIDE the console appender above, not instead of it, so the
# _ops launchers' Tee-Object/tee of console output (D10, MON-6) is unaffected.
#
# App-relative ('logs/app.log', not an absolute path), so it lands in the SAME 'logs' directory the
# launchers already tee into and the SAME directory every regeneration spares: under a bare
# launcher that resolves to <appRoot>/logs (Run-FinalApp.ps1 already Set-Location's there before
# starting java); under the Docker path it resolves to /app/logs, inside the app-data named volume
# docker-compose.yml already mounts over /app, so rolled segments survive container recreation the
# same way SUPER_USER_KEY.txt does.
#
# Named 'app.log', not 'app-<timestamp>.log' (the launcher's own per-run filename, D10) -- an
# 'app-*.log' collision would fold Spring's own rolled segments into the file set
# `npdev monitor logs export` globs (NPDevCli/npdev_monitor.py: logs_dir.glob("app-*.log")) and
# break the "one file per run" invariant that export already relies on.
logging.file.name=logs/app.log
# LNCH-8: the same correlationId-tagged pattern as the console line above -- rotation must not
# blind a file log line the console (and the launcher's tee of it) already carries.
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} ${LOG_LEVEL_PATTERN:-%5p} [%X{correlationId:--}] %logger{39} : %m%n%wEx
# Roll at 10MB (size) or daily (time), whichever comes first -- Spring Boot's default rolled-file
# name pattern already encodes both (${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz), so only the ceiling values
# below are needed to make rotation size+time-capped rather than time-only.
logging.logback.rollingpolicy.max-file-size=10MB
# Keep at most 14 rolled segments...
logging.logback.rollingpolicy.max-history=14
# ...AND cap the total directory at 200MB regardless of history count, so a burst day cannot blow
# the retention window before max-history catches up -- Spring Boot enforces whichever limit is
# hit first.
logging.logback.rollingpolicy.total-size-cap=200MB
# Every property above is a standard Spring Boot logging.* key, relaxed-bound from an env var the
# same way every other npdev.* setting in this file is (e.g.
# LOGGING_LOGBACK_ROLLINGPOLICY_MAX_FILE_SIZE) -- an operator retunes the caps without editing a
# generated file, and a soak can shrink them to force rollover in seconds without recompiling.

# Hosting (P1): platforms that inject PORT (Render, Koyeb, Fly) win; SERVER_PORT still works for
# Docker/compose and the _ops launchers, which set it explicitly; 8080 is the local default.
server.port=${PORT:${SERVER_PORT:8080}}

# SEC-11 (NPDEV_MEGA_ROADMAP.md Session 3b): Google OAuth client id/secret are injected by the
# launcher from the OS credential store (Manager keyring) -- never commit them, never put them in
# a .env, never in the model. The endpoint overrides let a deployment point the flow at a local
# fake provider (the live-verification harness), with Google's real endpoints as the default.
npdev.auth.oauth.google.client-id=${NPDEV_OAUTH_GOOGLE_CLIENT_ID:}
npdev.auth.oauth.google.client-secret=${NPDEV_OAUTH_GOOGLE_CLIENT_SECRET:}
npdev.auth.oauth.google.authorization-endpoint=${NPDEV_OAUTH_GOOGLE_AUTHORIZATION_ENDPOINT:https://accounts.google.com/o/oauth2/v2/auth}
npdev.auth.oauth.google.token-endpoint=${NPDEV_OAUTH_GOOGLE_TOKEN_ENDPOINT:https://oauth2.googleapis.com/token}
npdev.auth.oauth.google.tokeninfo-endpoint=${NPDEV_OAUTH_GOOGLE_TOKENINFO_ENDPOINT:https://oauth2.googleapis.com/tokeninfo}
# Same shape, GitHub's second OAuth provider (no OIDC id_token/tokeninfo -- a REST user lookup
# instead, hence the extra user-emails-endpoint the Google block has no equivalent for).
npdev.auth.oauth.github.client-id=${NPDEV_OAUTH_GITHUB_CLIENT_ID:}
npdev.auth.oauth.github.client-secret=${NPDEV_OAUTH_GITHUB_CLIENT_SECRET:}
npdev.auth.oauth.github.authorization-endpoint=${NPDEV_OAUTH_GITHUB_AUTHORIZATION_ENDPOINT:https://github.com/login/oauth/authorize}
npdev.auth.oauth.github.token-endpoint=${NPDEV_OAUTH_GITHUB_TOKEN_ENDPOINT:https://github.com/login/oauth/access_token}
npdev.auth.oauth.github.user-endpoint=${NPDEV_OAUTH_GITHUB_USER_ENDPOINT:https://api.github.com/user}
npdev.auth.oauth.github.user-emails-endpoint=${NPDEV_OAUTH_GITHUB_USER_EMAILS_ENDPOINT:https://api.github.com/user/emails}
npdev.auth.oauth.state-ttl-seconds=${NPDEV_OAUTH_STATE_TTL_SECONDS:600}

# Health run/stop (S5.3 lift): NPDEV_OPS_DIR is set by every _ops launcher script to its own
# absolute path (ControlPanelHealthController.java's own comment has the full reasoning) --
# absent when the jar is run directly rather than through a launcher, in which case the health
# panel degrades to read-only (no id resolves against a real script without this).
npdev.ops.dir=${NPDEV_OPS_DIR:}
npdev.health.run-timeout-seconds=${NPDEV_HEALTH_RUN_TIMEOUT_SECONDS:600}

# Actuator
# LNCH-8: metrics/prometheus exposed here but gated by ActuatorAdminGuardFilter (SUPERUSER only)
# -- health/info stay open (Docker/orchestrator healthchecks have no credentials, LNCH-7).
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

spring.flyway.out-of-order=true

# SEC-7 (B30-A): OS-level resource ceiling for plugin:java-source child JVMs (PluginIpcChildProcessPool
# -> PluginProcessResourceLimiter.forCurrentOs(), Windows Job Object / Linux systemd-run --scope), ON by
# default -- the mechanism (SEC-3/4/5/6) shipped live-fire proven but at 0/0 (unbounded) defaults.
# Generous, not tight (design doc section 3's own guidance): measured against a REAL plugin:java-source
# mount (lib-probe's Guava-hashing SignWithLibrary flow, 8 live HTTP calls + a CRUD create through the
# real dispatch path) peaking at ~91MB WorkingSet per child worker under a live 512MB ceiling -- 5.6x
# headroom on this measurement, left generous for heavier real plugins rather than tightened to the
# observed peak. A host/OS with no real limiting mechanism available degrades to NoOpResourceLimiter,
# which logs a WARNING loudly and immediately (pool workers start at boot) rather than silently.
npdev.runtime.plugin-ipc-pool.memory-limit-mb=512
npdev.runtime.plugin-ipc-pool.cpu-rate-percent=50
