# NPDev runtime plugin coherence for the default boot path
# The generated app stays disposable; these defaults live in the RuntimeHost base template.
#
# REG-180 (option b): npdev.runtime.supported-surface-enforced=true is INTENTIONALLY scoped to THIS
# file -- Spring's reserved 'default' profile, which loads only on a fully UN-PROFILED boot. No real
# launcher boots un-profiled, so the controller-allowlist enforcement stays dormant on every documented
# path. Moving this flag onto a real profile (dev/prod/trial) would 404 the ControlPanel/SUPERUSER
# admin surface (it is not in runtime-supported-controllers.json allowedControllers).
npdev.runtime.surface-profile=supported-core
npdev.runtime.supported-surface-enforced=true
npdev.runtime.deployment-profile=dev
npdev.runtime.deployment.bindings-manifest=npdev/bindings/dev.bindings.json
npdev.runtime.deployment.plugin-manifest=npdev/plugins/default.plugin-manifest.json
npdev.runtime.execution-environment=dev
npdev.execution.mode=${NPDEV_EXECUTION_MODE:governed}
npdev.deploy.model-path=${NPDEV_DEPLOY_MODEL_PATH:${user.dir}\\npdev-generated\\src\\main\\resources\\npdev\\model.json}
npdev.strict-execution.enabled=${NPDEV_STRICT_EXECUTION_ENABLED:true}
npdev.strict-execution.generated-root=${NPDEV_STRICT_EXECUTION_GENERATED_ROOT:${user.dir}\\npdev-generated}
