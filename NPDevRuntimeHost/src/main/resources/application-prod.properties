# R7 Stage B (profiles, SEC-1). DockerDeploymentEmitter's docker-compose.yml / .env.example have
# named SPRING_PROFILES_ACTIVE=prod (or prod,postgres for a Postgres-engine app) since LNCH-7 --
# but until this file, no application-prod.properties existed anywhere in this template, so a
# Docker deployment ran that profile on Spring's bare, unconfigured defaults. This file is that
# missing backing config.
#
# Deliberately minimal and engine-agnostic:
# - npdev.runtime.mode / npdev.storage.mode / the datasource are NOT set here. Those come from the
#   separate 'postgres' Spring profile plus explicit env vars (docs/CONFIGURATION.md
#   #mode-and-profile-contract) -- exactly what docker-compose.yml already wires up
#   (SPRING_PROFILES_ACTIVE=prod,postgres for a Postgres-engine app, prod alone for
#   InMemory/H2Local/H2Server). Baking a storage choice into this file would fight that.
# - npdev.execution.mode is NOT set here either. Its Java-level default
#   (NpdevObservabilityConfig#runtimeExecutionPolicy, "${npdev.execution.mode:governed}") is already
#   "governed" -- the strict npdev-generated/ hash check (StrictExecutionValidator) stays ON. Only
#   application-dev.properties opts OUT, to "relaxed". prod inherits the safe default rather than
#   restating it.
# npdev.runtime.deployment-profile is DELIBERATELY left unset (Java-level default "default",
# NpdevPluginConfig#runtimePluginProfile). This is a SEPARATE knob from the Spring profile with a
# real runtime coupling that live boot testing caught: RuntimePluginProfileResolver resolves it
# either by inference (classpath resources npdev/bindings/<name>.bindings.json +
# npdev/plugins/<name>.plugin-manifest.json, which is how 'dev' resolves -- both files are
# generated per-app) or against a small HARDCODED fallback map ({default, warning} only). Setting
# this to 'prod' with neither an inferred pair nor an explicit
# npdev.runtime.deployment.bindings-manifest/plugin-manifest override throws
# "Unknown deployment plugin profile 'prod'" at boot (confirmed live) -- there is no generated
# prod.bindings.json/prod.plugin-manifest.json, and inventing a fourth plugin-bindings variant is
# unrelated plugin-package policy, out of scope for R7. Leaving it unset resolves to 'default',
# the same bindings/plugin-manifest pair application-default.properties already uses.
#
# npdev.runtime.execution-environment=prod is independently safe to set explicitly: it is a
# DIFFERENT, pre-existing, string-only label (no fallback-map lookup) that
# CapabilityAdapterResolver#activeEnvironment already anticipates -- its own preferredOrder array
# already lists {dev, test, stage, prod, default} for gating which plugin packages admit.
npdev.runtime.execution-environment=prod

# Fail closed, not fail open: no admin API key is seeded here, unlike application-dev.yml's known
# api-dev/dev-key pair. npdev.auth.api-keys is left UNSET on purpose -- StartupValidator.validateAuth()
# then refuses to boot until one is supplied externally (NPDEV_AUTH_APIKEYS env var, exactly as
# docker-compose.yml already requires: ${NPDEV_AUTH_APIKEYS:?NPDEV_AUTH_APIKEYS must be set in .env}),
# or via the same Ensure-NpdevApiKey / secrets/api-key.env mechanism _ops/Run-FinalApp.ps1 uses for a
# local dev boot (R7 Stage C). Either way, an operator who does not supply a key gets a boot failure
# naming exactly what is missing (docs/CONFIGURATION.md#authentication), never a silent fallback to a
# known credential.
npdev.auth.mode=apikey
