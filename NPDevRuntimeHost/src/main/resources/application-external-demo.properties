# Canonical governed external package demonstration path.
# Launch with --spring.profiles.active=dev,filesystem,external-demo to prove
# filesystem discovery + governance + package realization through one explicit
# deployment-facing runtime path without changing generated business code.
npdev.runtime.plugin-package-discovery-mode=filesystem-folder
npdev.runtime.plugin-package-directory=${NPDEV_RUNTIME_PLUGIN_PACKAGE_DIRECTORY:./npdev-generated/src/main/resources/npdev/plugin-packages}
npdev.execution.mode=relaxed
