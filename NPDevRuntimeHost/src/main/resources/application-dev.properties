management.endpoints.web.exposure.include=health,info,mappings,beans

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/finalexec
spring.datasource.username=finalexec
spring.datasource.password=finalexec

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Dev: keep Flyway ON so NPDev schema (including concept tables like users) is created
spring.flyway.enabled=true

# Optional: show SQL while developing
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# NPDev runtime plugin coherence for the default boot path
# The generated app stays disposable; these defaults live in the RuntimeHost base template.
npdev.runtime.deployment-profile=dev
npdev.runtime.deployment.bindings-manifest=npdev/bindings/dev.bindings.json
npdev.runtime.deployment.plugin-manifest=npdev/plugins/default.plugin-manifest.json
npdev.runtime.execution-environment=dev
npdev.execution.mode=relaxed
