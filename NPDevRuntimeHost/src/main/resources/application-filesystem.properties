# Explicit deployment-facing filesystem plugin discovery profile.
# Launch with --spring.profiles.active=dev,filesystem for the basic externalized path
# or --spring.profiles.active=dev,filesystem,external-demo for the canonical governed demo path,
# without changing generated business code or DSL resources.
npdev.runtime.plugin-package-discovery-mode=filesystem-folder
npdev.runtime.plugin-package-directory=${NPDEV_RUNTIME_PLUGIN_PACKAGE_DIRECTORY:runtime-data/plugins}
