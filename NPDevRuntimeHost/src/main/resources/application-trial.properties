# Trial-friendly local runtime defaults.
# This profile is meant for canonical demo and official sample runs where the
# app lives in an isolated FinalExec folder and should discover generated
# plugin packages without extra operator setup.
npdev.runtime.plugin-package-discovery-mode=filesystem-folder
npdev.runtime.plugin-package-directory=${NPDEV_RUNTIME_PLUGIN_PACKAGE_DIRECTORY:./npdev-generated/src/main/resources/npdev/plugin-packages}
npdev.runtime.plugin-execution-summary-path=runtime-data/trial/plugin-executions.jsonl
