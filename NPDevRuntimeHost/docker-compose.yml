services:
  postgres:
    image: postgres:16
    container_name: finalexec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finalexec
      POSTGRES_USER: finalexec
      POSTGRES_PASSWORD: finalexec
    ports:
      - "5432:5432"
    volumes:
      - finalexec_pgdata:/var/lib/postgresql/data

volumes:
  finalexec_pgdata:
