// Template only. NPDevGenerator materializes this file as build.gradle in an assembled FinalExec app.
// Do not build directly from NPDevRuntimeHost; build from the generated final app root.
//
// R3 (MASTER-ROADMAP.md Step 9 / ledger QUAL-6): the -PenableCoverage=true JaCoCo gate lives ONLY in
// the sibling build.gradle.template (the file that actually ships, and the one
// scripts/quality/run-runtimehost-gate.ps1 exercises via an assembled app) -- not duplicated here.
// Bare-checkout pin: kept in sync with the sibling build.gradle.template (Spring Boot 3.5.16).
// Both files must be bumped together when updating Spring Boot; no gate builds this file directly.

import groovy.json.JsonSlurper

plugins {
    // BARE-CHECKOUT PIN — keep in sync with build.gradle.template. Dependabot can only scan this
    // file, so manual sync to the template is required when either is bumped.
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'java'
    id 'org.flywaydb.flyway' version '10.10.0'
}

group = 'com.finalexec'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

def resolveNpdevRuntimeLibsDir = {
    def configured = providers.gradleProperty('npdevRuntimeHostLibsDir')
            .orElse(providers.environmentVariable('NPDEV_RUNTIMEHOST_LIBS_DIR'))
            .orNull
    if (configured != null && !configured.toString().trim().isEmpty()) {
        return file(configured.toString().trim())
    }

    def current = projectDir
    while (current != null) {
        if (new File(current, '.npdev-root').isFile()) {
            return new File(current.parentFile, "${current.name}__OutsideRepo/runtimehost-libs")
        }
        current = current.parentFile
    }

    return file("${rootProject.projectDir.name}__OutsideRepo/runtimehost-libs")
}

def npdevRuntimeHostLibsDir = resolveNpdevRuntimeLibsDir()
def javaSourceRoot = file('src/main/java').canonicalFile
def testJavaSourceRoot = file('src/test/java').canonicalFile
def generatedRuntimeRequiredFiles = [
        'npdev-generated/src/main/java/com/npdev/generated/runtime/service/RuntimeContextService.java',
        'npdev-generated/src/main/java/com/npdev/generated/runtime/service/KernelFacade.java',
        'npdev-generated/src/main/java/com/npdev/generated/runtime/config/RuntimeApiKeyAuthFilter.java'
]

def generatedRuntimeMountPresent = {
    generatedRuntimeRequiredFiles.every { file(it).isFile() }
}

def relativeJavaSourcePath = { File root, File sourceFile ->
    sourceFile.canonicalPath
            .substring(root.path.length() + 1)
            .replace(File.separator, '/')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.postgresql:postgresql:42.7.4'

    // ---------------------------------------------------------------------------------------
    // storage/FULL_SUPPORT_PLAN.md gap A, and this is its concrete cause.
    //
    // MySQL and SQL Server were selectable in db.definition.json, wired through DatabaseEngine
    // with JDBC URLs and default ports, given full SqlDialect implementations, and green on
    // 14/14 conformance vectors against REAL containers. And NO GENERATED APP COULD EVER HAVE
    // CONNECTED TO EITHER, because this file -- the template copied into every FinalApp -- put
    // no driver for them on the classpath. Measured, CI run 31272786548:
    //
    //     Cannot load driver class: com.mysql.cj.jdbc.Driver
    //
    // The app failed at DataSource creation, before a single line of NPDev's own code ran. Tier B
    // could never have caught it: it hands out a raw JDBC connection from a driver the TEST
    // classpath has. That is the whole reason the plan ranks "a generated app boots" as gap A --
    // "the dialect works" and "an app works" turn out to be very different claims.
    //
    // Declared like h2 and postgres already are: unconditionally, not per-engine. Conditional
    // emission would be smaller on disk and would put an engine's usability behind a code path
    // that only runs for that engine -- which is the shape of the bug being fixed.
    //
    // Flyway 10+ needs a per-database module alongside the driver, which is why
    // flyway-database-postgresql is above; without the matching two, Flyway refuses the engine at
    // boot with a different message and the driver fix alone would have looked wrong.
    // ---------------------------------------------------------------------------------------
    runtimeOnly 'com.mysql:mysql-connector-j:9.1.0'
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc:12.8.1.jre11'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'org.flywaydb:flyway-sqlserver'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // LNCH-8: the Prometheus registry so /actuator/prometheus actually exposes something --
    // Actuator alone only gives the generic /actuator/metrics JSON view, not the scrape format.
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'com.networknt:json-schema-validator:1.5.6'

    // HARDEN-OBJSTORE-P2: the S3-compatible file-store adapter (file-store-objectstore, staged via
    // npdevRuntimeHostLibsDir like the other kernel adapters) needs the AWS SDK v2 S3 client on the
    // runtime classpath -- declared here as a normal Maven dependency since the jar-staging
    // mechanism only copies this workspace's own project jars, not their third-party dependencies.
    implementation platform('software.amazon.awssdk:bom:2.28.11')
    implementation 'software.amazon.awssdk:s3'

    // LNCH-11: the mail-smtp adapter (staged via npdevRuntimeHostLibsDir like the other kernel
    // adapters) needs Jakarta Mail on the runtime classpath -- same reason as the AWS SDK above:
    // jar-staging only copies this workspace's own project jars, not their third-party deps.
    implementation 'org.eclipse.angus:angus-mail:2.0.5'

    // REG-12 Slice 3: the document-render-inproc adapter (staged via npdevRuntimeHostLibsDir like
    // the other kernel adapters) needs OpenHTMLtoPDF/PDFBox on the runtime classpath -- same reason
    // as the AWS SDK/Jakarta Mail above: jar-staging only copies this workspace's own project jars,
    // not their third-party deps. Caught live: without this, DocumentRenderController#renderPdf
    // threw NoClassDefFoundError on the first real request.
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testImplementation 'org.testcontainers:testcontainers:1.21.4'
    testImplementation 'org.testcontainers:jdbc:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.awaitility:awaitility:4.2.0'
    testImplementation 'com.icegreen:greenmail-junit5:2.1.0'
    runtimeOnly 'com.h2database:h2'
    testRuntimeOnly 'com.h2database:h2'

    // Runtime extension jars are staged outside the source/evidence workspace.
    implementation fileTree(dir: npdevRuntimeHostLibsDir, include: ['*.jar'])
}

configurations.configureEach {
    resolutionStrategy.force(
            'org.testcontainers:testcontainers:1.21.4',
            'org.testcontainers:jdbc:1.21.4',
            'org.testcontainers:junit-jupiter:1.21.4',
            'org.testcontainers:postgresql:1.21.4'
    )
}

tasks.register('verifyNpdevRuntimeHostLibs') {
    group = 'verification'
    description = 'Checks that local RuntimeHost jars were staged outside the workspace before compilation.'

    doLast {
        def manifestFile = new File(npdevRuntimeHostLibsDir, 'runtimehost-libs-manifest.json')
        if (!manifestFile.isFile()) {
            throw new GradleException("Missing NPDev RuntimeHost libs manifest in ${npdevRuntimeHostLibsDir}. Run scripts/runtimehost/sync-runtimehost-libs.ps1 -BuildLocalJars.")
        }
        def manifest = new JsonSlurper().parse(manifestFile)
        def requiredJars = (manifest.requiredStagedJars ?: []).collect { it.toString().trim() }.findAll { !it.isEmpty() }
        if (requiredJars.isEmpty()) {
            throw new GradleException("NPDev RuntimeHost libs manifest did not declare requiredStagedJars: ${manifestFile}.")
        }
        def missing = requiredJars.findAll { !new File(npdevRuntimeHostLibsDir, it).isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing NPDev RuntimeHost jars in ${npdevRuntimeHostLibsDir}: ${missing}. Run scripts/runtimehost/sync-runtimehost-libs.ps1 -BuildLocalJars.")
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('verifyNpdevRuntimeHostLibs')
}

