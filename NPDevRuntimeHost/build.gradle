def runtimeSurfaceManifest = new JsonSlurper().parse(file('src/main/resources/npdev/runtime-supported-controllers.json'))
def supportedCoreControllerNames = (runtimeSurfaceManifest.allowedControllers ?: []).collect { it.toString().trim() }.findAll { !it.isEmpty() }
// REG-163: deferredControllers must be COMPILED (allowedControllers UNION deferredControllers), not
// excluded outright -- RuntimeControllerAllowlistConfig's runtime filter (npdev.runtime.surface
// -profile=non-default|experimental) can only REMOVE an already-registered bean definition, never
// add one back for a class that was compiled out of sourceSets.main entirely. Before this fix, the
// compile-time gate was strictly NARROWER than the runtime one it exists only to backstop, making
// deferredControllers/the non-default profile permanently dead code regardless of profile.
def deferredControllerNames = (runtimeSurfaceManifest.deferredControllers ?: []).collect { it.toString().trim() }.findAll { !it.isEmpty() }
def compiledControllerNames = (supportedCoreControllerNames + deferredControllerNames).toSet()
def supportedCoreServiceNames = (runtimeSurfaceManifest.supportedCoreServiceComponents ?: []).collect { it.toString().trim() }.findAll { !it.isEmpty() }
def supportedCoreServicePatterns = (runtimeSurfaceManifest.supportedCoreServicePatterns ?: []).collect { it.toString().trim() }.findAll { !it.isEmpty() }
// REG-163: the analogous gap for services -- nonDefaultServicePatterns/experimentalServicePatterns
// name the services a deferredControllers-listed controller needs at runtime under the non-default/
// experimental profile; without compiling them too, a deferred controller would compile but fail to
// wire (its own dependency missing), which is no more usable than not compiling at all.
def experimentalServicePatterns = (runtimeSurfaceManifest.experimentalServicePatterns ?: [])
        .collect { it.toString().trim() }.findAll { !it.isEmpty() }
def deferredServicePatterns = ((runtimeSurfaceManifest.nonDefaultServicePatterns ?: [])
        + experimentalServicePatterns)
        .collect { it.toString().trim() }.findAll { !it.isEmpty() }

def toRelativeSourcePath = { File sourceFile ->
    relativeJavaSourcePath(javaSourceRoot, sourceFile)
}

def generatedRuntimeDependentMainSources = fileTree('src/main/java') {
    include '**/*.java'
}.files.findAll { sourceFile ->
    sourceFile.text.contains('com.npdev.generated.')
}.collect(toRelativeSourcePath)

def generatedRuntimeDependentTestSources = fileTree('src/test/java') {
    include '**/*.java'
}.files.findAll { sourceFile ->
    sourceFile.text.contains('com.npdev.generated.')
}.collect { sourceFile -> relativeJavaSourcePath(testJavaSourceRoot, sourceFile) }

/**
 * Move 11 W1. Tests that reference a MAIN class which is itself excluded when the generated-runtime
 * mount is absent. Those tests contain no `com.npdev.generated.` text of their own, so
 * generatedRuntimeDependentTestSources cannot see them -- they simply fail compileTestJava with
 * "cannot find symbol", breaking `gradlew test` for the whole bare template (the documented
 * GATE-H2/GATE-PG workflow in docs/SCHEMA_ENGINE_REBUILD_PLAN.md).
 *
 * This was previously a hand-maintained list of two names below. It went stale the moment Panel/
 * Workbench runtime tests were added (6 files, none listed), and a hand-list of a transitively
 * DERIVABLE fact will go stale again. So derive it: any test source naming an excluded main class,
 * matched on the class's simple name at a word boundary. Deliberately conservative in the
 * over-exclusion direction -- this applies ONLY when the mount is absent, and the assembled-app gate
 * (mount present, run-runtimehost-gate.ps1) compiles and runs every one of them exactly as before.
 */
def excludedMainSimpleNames = generatedRuntimeDependentMainSources
        .collect { it.tokenize('/').last().replace('.java', '') }
        .toSet()

def testsReferencingExcludedMainSources = fileTree('src/test/java') {
    include '**/*.java'
}.files.findAll { sourceFile ->
    String text = sourceFile.text
    excludedMainSimpleNames.any { simpleName -> text =~ /\b${java.util.regex.Pattern.quote(simpleName)}\b/ }
}.collect { sourceFile -> relativeJavaSourcePath(testJavaSourceRoot, sourceFile) }

def matchesSupportedPattern = { String simpleName, List<String> patterns ->
    patterns.any { pattern ->
        StringBuilder regex = new StringBuilder()
        pattern.each { ch ->
            if (ch == '*') {
                regex.append('.*')
            } else {
                regex.append(java.util.regex.Pattern.quote(String.valueOf(ch)))
            }
        }
        simpleName ==~ regex.toString()
    }
}

// REG-163 (found while verifying the fix above): a nonDefaultServicePatterns-matching service can
// itself reference an experimentalServicePatterns-matching class as a compile-time dependency (e.g.
// RuntimeTopologyExplorerService/CapabilityIntegrationPanelService both construct-inject
// FlowBuilderService/GovernanceWorkspaceService). That dependency can never be satisfied in ANY
// generated app: FinalAppAssembler's own UNSUPPORTED_RUNTIME_HOST_SERVICE_SOURCES hardcodes
// com/finalexec/npdev/service/experimental/*.java as excluded at COPY time, unconditionally -- a
// separate enforcement point this compile-time gate has no visibility into, so the file is simply
// never present to compile against, regardless of what this manifest says. Compiling the referencing
// file anyway (per the deferredServicePatterns union above) trades a correct exclusion for a real
// "cannot find symbol" compile failure -- confirmed live against the assembled simple-contact-intake
// sample. Detected the same way generatedRuntimeDependentMainSources/testsReferencingExcludedMainSources
// already detect a text-level dependency on excluded content, rather than hardcoding file names.
// A bare word-boundary scan over the RAW file text (needed -- these dependencies are referenced as
// unqualified simple names with no import statement at all, since the file was never actually
// compilable to begin with) would false-positive on a class name mentioned only in a // or /* */
// comment (confirmed live: TenantOperationalAdministrationService's own comment referencing
// TemplateLibraryManagementService, an unrelated experimental class, wrongly excluded it). Strip
// comments first -- deliberately simple (no string-literal-aware handling), matching this file's
// existing "good enough for real source, not a full Java parser" bar elsewhere.
def stripJavaComments = { String text ->
    text.replaceAll(/(?s)\/\*.*?\*\//, ' ').replaceAll(/(?m)\/\/[^\n]*/, ' ')
}

def referencesAnExperimentalService = { File sourceFile ->
    if (experimentalServicePatterns.isEmpty()) {
        return false
    }
    String text = stripJavaComments(sourceFile.text)
    experimentalServicePatterns.any { pattern ->
        StringBuilder regex = new StringBuilder()
        pattern.each { ch -> regex.append(ch == '*' ? '\\w*' : java.util.regex.Pattern.quote(String.valueOf(ch))) }
        text =~ /\b${regex}\b/
    }
}

def unsupportedRuntimeHostServiceSources = fileTree('src/main/java/com/finalexec/npdev/service') {
    include '**/*.java'
}.files
        .findAll { sourceFile ->
            String simpleName = sourceFile.name.replace('.java', '')
            boolean notInAnyCompiledSet = !supportedCoreServiceNames.contains(simpleName) &&
                    !matchesSupportedPattern(simpleName, supportedCoreServicePatterns) &&
                    !matchesSupportedPattern(simpleName, deferredServicePatterns)
            notInAnyCompiledSet || referencesAnExperimentalService(sourceFile)
        }
        .collect(toRelativeSourcePath)

// REG-163: computed AFTER unsupportedRuntimeHostServiceSources on purpose -- a deferredControllers-
// listed controller (e.g. RuntimeTopologyExplorerController) can itself construct-inject a service
// that just got excluded above for its OWN unsatisfiable experimental dependency
// (RuntimeTopologyExplorerService). Same transitive problem one level up: compiling the controller
// anyway just moves the "cannot find symbol" failure from the service to its caller. Reuses the same
// text-level word-boundary detection against the now-final excluded-service simple names, exactly
// like generatedRuntimeDependentMainSources/testsReferencingExcludedMainSources already do for the
// generated-runtime-mount-absent case.
def excludedServiceSimpleNames = unsupportedRuntimeHostServiceSources
        .collect { it.tokenize('/').last().replace('.java', '') }
        .toSet()

def referencesAnExcludedService = { File sourceFile ->
    if (excludedServiceSimpleNames.isEmpty()) {
        return false
    }
    String text = stripJavaComments(sourceFile.text)
    excludedServiceSimpleNames.any { simpleName -> text =~ /\b${java.util.regex.Pattern.quote(simpleName)}\b/ }
}

// Shipped no-op when the generated-runtime mount is present (the assembled-app gate -- the only
// path that actually compiles and runs these controllers). Applied ONLY when the mount is absent
// (a bare-template checkout), mirroring testsReferencingExcludedMainSources above: a controller
// whose service dependency is itself excluded because it imports com.npdev.generated.* can no more
// compile than that service can. Without this, unsupportedRuntimeHostServiceSources' generated-
// mount exclusion leaves such a controller referenced-but-uncompiled, and compileJava fails with
// "cannot find symbol" (confirmed live: RuntimeTopologyExplorerController -> RuntimeTopology
// ExplorerService -> KernelFacade).
def referencesMountExcludedMainClass = { File sourceFile ->
    if (generatedRuntimeMountPresent() || excludedMainSimpleNames.isEmpty()) {
        return false
    }
    String text = stripJavaComments(sourceFile.text)
    excludedMainSimpleNames.any { simpleName -> text =~ /\b${java.util.regex.Pattern.quote(simpleName)}\b/ }
}

def unsupportedRuntimeHostControllerSources = fileTree('src/main/java/com/finalexec/api') {
    include '**/*Controller.java'
}.files
        .findAll { sourceFile ->
            String simpleName = sourceFile.name.replace('.java', '')
            !compiledControllerNames.contains(simpleName) || referencesAnExcludedService(sourceFile)
                    || referencesMountExcludedMainClass(sourceFile)
        }
        .collect(toRelativeSourcePath)

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir 'npdev-generated/src/main/java'
            unsupportedRuntimeHostControllerSources.each { exclude it }
            unsupportedRuntimeHostServiceSources.each { exclude it }
            if (!generatedRuntimeMountPresent()) {
                generatedRuntimeDependentMainSources.each { exclude it }
            }
        }
        resources {
            srcDir 'src/main/resources'
            srcDir 'npdev-generated/src/main/resources'
        }
    }
    test {
        java {
            modelSpecificGeneratedAppTests.each { exclude it }
            // LNCH-1 Phase 7 (task 7.2): Docker-dependent (Testcontainers Postgres) -- must not run,
            // or even compile, as part of the plain `test` task (no com.npdev.generated. reference,
            // so generatedRuntimeDependentTestSources' auto-exclusion would not otherwise catch it;
            // see generatedRuntimeIntegrationTestSources above for the integrationTest inclusion).
            // Docker-dependent (Testcontainers Postgres): excluded from the default `test` so a plain
            // run never needs Docker. It is mount-INDEPENDENT (pure schema-lifecycle, no generated
            // runtime), so it can be run directly against a bare template on demand via
            // `-PincludePostgresMatrix` -- this is GATE-PG in docs/SCHEMA_ENGINE_REBUILD_PLAN.md:
            //   gradlew test --tests com.finalexec.db.SchemaLifecycleExecutorPostgresProofMatrixTest -PincludePostgresMatrix
            if (!providers.gradleProperty('includePostgresMatrix').present) {
                exclude 'com/finalexec/db/SchemaLifecycleExecutorPostgresProofMatrixTest.java'
                // Same rule for the schema-engine-rebuild Postgres golden tests (Testcontainers):
                // excluded from the default `test`, included on demand via -PincludePostgresMatrix.
                exclude 'com/finalexec/db/schemastate/CurrentSchemaReaderPostgresTest.java'
                // SER-P7.5: the conversion-hook Postgres twin (Testcontainers) -- same rule.
                exclude 'com/finalexec/db/ConversionHookRunnerPostgresTest.java'
                // Move 9 A4: the H2->Postgres data-promotion proof -- same rule (real Testcontainers
                // Postgres container, must not run or compile as part of the plain `test` task).
                exclude 'com/finalexec/db/CrossEngineDataPromotionTest.java'
            }
            // Tests that exercise MAIN classes excluded when the generated-runtime mount is absent (a
            // bare-template checkout, e.g. running GATE-H2/GATE-PG directly per
            // docs/SCHEMA_ENGINE_REBUILD_PLAN.md). They contain no com.npdev.generated. text, so the
            // generatedRuntimeDependentTestSources heuristic above cannot catch them, and they fail
            // compileTestJava with "cannot find symbol" -- a transitive-dependency gap the text heuristic
            // can't see. Excluded ONLY when the mount is absent, so the assembled-app gate (mount present)
            // still compiles and runs them exactly as before.
            if (!generatedRuntimeMountPresent()) {
                // R1 Stage 1 (MASTER-ROADMAP.md): this exclusion was previously unconditional, so it
                // ran even when a real generated-runtime mount WAS present -- silently skipping
                // AgentProxyControllerTest and 5 siblings (21 @Test) that guard the SUPERUSER gate in
                // front of the provider API key. It belongs here: these tests import
                // com.npdev.generated. classes that only exist when the mount is present.
                generatedRuntimeDependentTestSources.each { exclude it }
                // Derived (Move 11 W1) -- see testsReferencingExcludedMainSources above.
                testsReferencingExcludedMainSources.each { exclude it }
                // Second-order, and therefore NOT derivable from the rule above: these two name main
                // classes that are themselves fine, but which transitively import an excluded one
                // (ConceptQueryController -> RuntimeContextService; ActuatorAdminGuardFilter).
                exclude 'com/finalexec/api/ConceptQueryControllerTest.java'
                exclude 'com/finalexec/config/ActuatorAdminGuardFilterTest.java'
            }
        }
    }
    integrationTest {
        java {
            srcDir 'src/test/java'
            generatedRuntimeIntegrationTestSources.each { include it }
        }
        resources {
            srcDir 'src/test/resources'
        }
        compileClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('reportRuntimeSupportedSurface') {
    group = 'verification'
    description = 'Prints the supported-core RuntimeHost source allowlist used for packaging.'

    doLast {
        println "Allowed supported-core controllers: ${supportedCoreControllerNames.sort(false)}"
        println "Supported-core service components: ${supportedCoreServiceNames.sort(false)}"
        println "Supported-core service patterns: ${supportedCoreServicePatterns.sort(false)}"
        println "Excluded controller sources: ${unsupportedRuntimeHostControllerSources.sort(false)}"
        println "Excluded service sources: ${unsupportedRuntimeHostServiceSources.sort(false)}"
    }
}

/**
 * Runtime resource policy:
 * - application.* must come only from src/main/resources
 * - generated resources may provide npdev metadata/static assets/templates
 * - runtime schema-realization SQL comes from db/schema-realization
 * - schema-realization analysis artifacts must never go into runtime classpath
 * - stateful upgrade management remains unsupported in the generated app
 */
tasks.named('processResources', Copy) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    doFirst {
        delete(destinationDir)
    }

    // Generated resources first, including generated schema-realization artifacts.
    from('npdev-generated/src/main/resources') {
        exclude('**/application.yml')
        exclude('**/application.yaml')
        exclude('**/application.properties')
        exclude('db/schema-snapshots/**')
    }

    // Handwritten resources last and authoritative.
    from('src/main/resources') {
        exclude('db/schema-snapshots/**')
    }
}

tasks.register('enforceSingleSchemaRealizationSource') {
    group = 'verification'
    description = 'Ensures generated apps contain schema-realization artifacts.'

    doLast {
        def migrationJars = fileTree(dir: 'libs', include: ['npdev-migrations-*.jar']).files
        if (!migrationJars.isEmpty()) {
            throw new GradleException(
                    "Schema-realization helper jar(s) found in libs/: ${migrationJars}. " +
                        "Canonical runtime source is src/main/resources/db/schema-realization, so stateful upgrade tooling must not be packaged into FinalExec."
            )
        }

        File realizationDir = file('npdev-generated/src/main/resources/db/schema-realization')
        if (!realizationDir.exists()) {
            throw new GradleException(
                    "Generated schema-realization directory not found: ${realizationDir}"
            )
        }

        def realizationFiles = fileTree(realizationDir).matching {
            include('**/*.sql')
            include('**/*.json')
        }.files

        if (realizationFiles.isEmpty()) {
            throw new GradleException(
                    "No generated schema-realization artifacts found in ${realizationDir}"
            )
        }

        println "Generated schema-realization source: npdev-generated/src/main/resources/db/schema-realization"
        println "Generated schema-realization artifacts found: ${realizationFiles.size()}"
    }
}

tasks.named('bootRun') {
    dependsOn 'enforceSingleSchemaRealizationSource'
}

tasks.named('test') {
    // enforceSingleSchemaRealizationSource verifies an ASSEMBLED FinalApp carries its generated
    // schema-realization artifacts under npdev-generated/ -- meaningless for a bare-template checkout
    // (no mount), where it can only fail. Depend on it only when the mount is present, so the
    // assembled-app gate keeps the guarantee while a direct GATE-H2/GATE-PG run against the template
    // (docs/SCHEMA_ENGINE_REBUILD_PLAN.md) can execute the mount-independent unit tests.
    if (generatedRuntimeMountPresent()) {
        dependsOn 'enforceSingleSchemaRealizationSource'
    }
    // R1 Stage 4 (MASTER-ROADMAP.md Track C item C3): every AbstractScenarioIntegrationTest
    // subclass carries @Tag("integration"). Before this, `test` had NO excludeTags at all -- the
    // ONLY thing keeping a tagged scenario test out of the plain `test` run was remembering to
    // hand-list it in modelSpecificGeneratedAppTests above, which is exactly the kind of
    // "one place updated, its twin forgotten" gap this repo's twin-pair rules exist to catch
    // elsewhere. This makes the tag itself authoritative so a FUTURE AbstractScenarioIntegrationTest
    // subclass can never silently leak into `test` even if someone forgets the hand-list.
    useJUnitPlatform {
        excludeTags 'integration'
    }
    // Perf: forked test JVMs default to 512m and do NOT inherit org.gradle.jvmargs.
    // Deliberately no maxParallelForks here: these are Spring Boot slices sharing a
    // context and (under the postgres profile) Testcontainers DB state, so concurrent
    // forks would contend. Heap + parallel GC are the safe wins.
    maxHeapSize = '2g'
    jvmArgs '-XX:+UseParallelGC'
    def activeProfiles = providers.gradleProperty('spring.profiles.active')
            .orElse(providers.environmentVariable('SPRING_PROFILES_ACTIVE'))
            .orNull
    if (activeProfiles != null && !activeProfiles.toString().trim().isEmpty()) {
        systemProperty 'spring.profiles.active', activeProfiles.toString().trim()
    }
    // Schema-engine rebuild Phase 3.2: the read-only shadow parity assertion is ON BY DEFAULT -- every
    // test that drives SchemaLifecycleExecutor.beforeMigrate now also asserts the shadow SchemaDiffEngine
    // agrees with the live engine on schema-driven decisions (non-schema overrides are scoped out in
    // ShadowParityProbe). This makes parity a standing invariant: a future change that makes the shadow
    // diverge fails here. Override with -Pnpdev.schema.shadow.assert=false; point .logFile at a path to
    // capture divergences for analysis.
    def shadowAssert = System.getProperty('npdev.schema.shadow.assert') ?: providers.gradleProperty('npdev.schema.shadow.assert').getOrNull()
    systemProperty 'npdev.schema.shadow.assert', (shadowAssert != null && !shadowAssert.toString().trim().isEmpty() ? shadowAssert.toString().trim() : 'true')
    def shadowLog = System.getProperty('npdev.schema.shadow.logFile') ?: providers.gradleProperty('npdev.schema.shadow.logFile').getOrNull()
    if (shadowLog != null && !shadowLog.toString().trim().isEmpty()) {
        systemProperty 'npdev.schema.shadow.logFile', shadowLog.toString().trim()
    }
    // SER Phase 4 COMPLETE: classify + SchemaDeltaReport + all four mutation passes now consume the
    // canonical SchemaDiff directly (no re-derivation left to self-check), so the per-pass equivalence
    // asserts (npdev.schema.classify/rename/widen/backfill.*) that guarded each switch are retired.
    // The end-to-end guard is now the behavior tests + the shadow parity assert (above), which stays on.
    if (System.getProperty('os.name', '').toLowerCase().contains('win')
            && System.getenv('DOCKER_HOST') == null) {
        environment 'DOCKER_HOST', 'npipe:////./pipe/dockerDesktopLinuxEngine'
        systemProperty 'docker.host', 'npipe:////./pipe/dockerDesktopLinuxEngine'
        systemProperty 'docker.client.strategy', 'org.testcontainers.dockerclient.NpipeSocketClientProviderStrategy'
    }
}

tasks.register('verifyGeneratedRuntimeMount') {
    group = 'verification'
    description = 'Fails clearly when the generated runtime mount required by integrationTest is missing.'

    doLast {
        def missing = generatedRuntimeRequiredFiles.findAll { !file(it).isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "generated-runtime-mount missing: integrationTest requires generated runtime sources under npdev-generated. " +
                            "Missing required file(s): ${missing}. Generate a final app with NPDevGenerator, then run ./gradlew integrationTest from the generated app root."
            )
        }
    }
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Runs generated-runtime-dependent RuntimeHost integration tests.'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    dependsOn tasks.named('verifyGeneratedRuntimeMount')
    useJUnitPlatform {
        includeTags 'integration'
    }
    def activeProfiles = providers.gradleProperty('spring.profiles.active')
            .orElse(providers.environmentVariable('SPRING_PROFILES_ACTIVE'))
            .orElse('test,postgres')
            .get()
    systemProperty 'spring.profiles.active', activeProfiles.toString().trim()
    if (System.getProperty('os.name', '').toLowerCase().contains('win')
            && System.getenv('DOCKER_HOST') == null) {
        environment 'DOCKER_HOST', 'npipe:////./pipe/dockerDesktopLinuxEngine'
        systemProperty 'docker.host', 'npipe:////./pipe/dockerDesktopLinuxEngine'
        systemProperty 'docker.client.strategy', 'org.testcontainers.dockerclient.NpipeSocketClientProviderStrategy'
    }
}

tasks.named('compileIntegrationTestJava') {
    dependsOn tasks.named('verifyGeneratedRuntimeMount')
}

tasks.register('runtimeSchemaRealizationPreflight') {
    group = 'verification'
    description = 'Preflights schema-realization SQL assets before runtime startup.'

    doLast {
        def realizationDir = file('npdev-generated/src/main/resources/db/schema-realization')
        if (!realizationDir.isDirectory()) {
            throw new GradleException("Missing schema-realization directory: ${realizationDir}")
        }
        def sqlFiles = fileTree(realizationDir) { include '*.sql' }.files.sort { it.name }
        if (sqlFiles.isEmpty()) {
            throw new GradleException("No schema-realization SQL files found in ${realizationDir}")
        }
        def destructivePattern = ~/(?i)\b(drop|truncate|delete\s+from|alter\s+table\s+\S+\s+drop)\b/
        def destructiveHits = sqlFiles.findAll { file ->
            file.getText('UTF-8') =~ destructivePattern
        }
        if (!destructiveHits.isEmpty()) {
            throw new GradleException("Runtime schema-realization preflight rejected destructive SQL: ${destructiveHits*.name}")
        }
        println "Runtime schema-realization preflight OK. SQL files checked: ${sqlFiles.size()}"
    }
}

