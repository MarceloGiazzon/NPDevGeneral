include 'adapters:runtime-support'
project(':adapters:runtime-support').projectDir = file('../NPDevKernel/adapters/runtime-support')
include 'adapters:flow-compiled'
project(':adapters:flow-compiled').projectDir = file('../NPDevKernel/adapters/flow-compiled')
include 'adapters:flowinstance-inproc'
