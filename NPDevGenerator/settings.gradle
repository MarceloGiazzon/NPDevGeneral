// A1 (Cold Clone Audit 2026-08-28): the platform's own builds must resolve a 17 toolchain the
// same way a generated app does -- a machine whose only JDK is 21+ used to pass `npdev doctor`
// and then fail `npdev setup` with "No matching toolchains found". Same registration the
// generated-app template ships (NPDevRuntimeHost/settings.gradle.template); with the 9.5.1
// wrapper raise (A2) this plugin's 1.0.0 is the version proven on this Gradle line.
// `plugins {}` MUST be the first statement -- even rootProject.name above it is a hard compile
// error (confirmed live, settings.gradle.template's own header). Offline opt-out is Gradle's
// native -Dorg.gradle.java.installations.auto-download=false, not removing this block.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'npdev-generator'

include 'generator'
include 'tools:npdev-cli'

// A2 migration (Gradle 8.5 -> 9.5.1, 2026-08-28): Gradle 9 refuses to configure a project whose
// directory does not exist, and until now this settings file overrode every ':adapters:*' child's
// projectDir into NPDevKernel/adapters/ WITHOUT declaring the ':adapters' group itself -- Gradle
// 8.5 tolerated the phantom parent ('Configuring project ':adapters' without an existing directory
// is not allowed' is a 9.5.1 error; setting projectDir on an UNINCLUDED ':adapters' then fails
// with 'Project with path :adapters could not be found'). The group's home is the kernel adapter
// tree every child points into, so include it and declare its directory.
include 'adapters'
project(':adapters').projectDir = file('../NPDevKernel/adapters')

// Generator build dependencies are explicit sibling contracts, not an NPDev_General root build.
include 'core'
project(':core').projectDir = file('../NPDevKernel/core')
include 'kernel'
project(':kernel').projectDir = file('../NPDevKernel/kernel')
include 'dsl'
project(':dsl').projectDir = file('../NPDevContract/dsl')
include 'adapters:bulkhead-inproc'
project(':adapters:bulkhead-inproc').projectDir = file('../NPDevKernel/adapters/bulkhead-inproc')
include 'adapters:audit-inproc'
project(':adapters:audit-inproc').projectDir = file('../NPDevKernel/adapters/audit-inproc')
include 'adapters:audit-postgres'
project(':adapters:audit-postgres').projectDir = file('../NPDevKernel/adapters/audit-postgres')
include 'adapters:circuit-inproc'
