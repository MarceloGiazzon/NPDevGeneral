plugins {
    id 'application'
}

application {
    mainClass = 'com.npdev.generator.GeneratorMain'
}

// REG-102 fix (MASTER_AI_PLATFORM_PROGRAMME_v2.md Wave 1.2): a real, working "diff two model.json
// snapshots and classify the change" entry point, deliberately its OWN JavaExec task rather than a
// new GeneratorMain flag -- GeneratorMain.Args.parse unconditionally rejects any --migration-prefixed
// argument (a guard against a different, retired thing), which is exactly why the OLD CLI wiring
// (`npdev migration diff`) never worked. Mirrors :NPDevContract:dsl:validateModel's JavaExec pattern.
tasks.register('classifyModelChange', JavaExec) {
    group = 'verification'
    description = 'Diff two model.json snapshots (current, optional baseline) and classify the change as METADATA_ONLY / SAFE_ADDITIVE / BACKFILL_REQUIRED / MANUAL_REVIEW.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.npdev.generator.schemaevolution.ModelChangeClassifierMain'
    // A --emitCompiledModelTo refusal (exit 2) must reach the caller's exit code (a fast-path script
    // branches on it), not fail this Gradle invocation itself -- same reasoning as :validateModel's
    // own ignoreExitValue.
    ignoreExitValue = true
    def cliArgs = []
    if (project.hasProperty('currentPath')) {
        cliArgs << '--current' << project.getProperty('currentPath')
    }
    if (project.hasProperty('baselinePath')) {
        cliArgs << '--baseline' << project.getProperty('baselinePath')
    }
    if (project.hasProperty('reportOut')) {
        cliArgs << '--out' << project.getProperty('reportOut')
    }
    // Wave 1.3 (LC-C2): when set, the current model's compiled JSON is written to this path IFF the
    // classification is METADATA_ONLY -- refuses (non-zero exit) otherwise. See
    // ModelChangeClassifierMain's own javadoc for exactly which running-app behavior this does (and
    // does not) refresh.
    if (project.hasProperty('emitCompiledModelTo')) {
        cliArgs << '--emitCompiledModelTo' << project.getProperty('emitCompiledModelTo')
    }
    // Fast Lane plan item 1a (REG-103 follow-up): same METADATA_ONLY-gated contract as
    // emitCompiledModelTo above, but for RuntimeMetadataService's compiled-metadata.json +
    // per-catalog metadata/*.manifest.json catalogs -- see ModelChangeClassifierMain's javadoc.
    if (project.hasProperty('emitMetadataTo')) {
        cliArgs << '--emitMetadataTo' << project.getProperty('emitMetadataTo')
    }
    args = cliArgs
}

// Wave 2, E2 (AI_AUTHORING_CONTRACT-2026-07-31.md Part 9, "the load-bearing piece"): the
// Custodian's diff gate as a real, callable command. Own JavaExec task for the same reason as
// classifyModelChange above -- GeneratorMain's arg parser is not where this belongs.
tasks.register('authorDiffGate', JavaExec) {
    group = 'verification'
    description = 'AI Authoring Contract Custodian diff gate: checks a submitted model.json against its previous version and a submission manifest (A2/A3/A4/A5/A7/A9/A10, C1/C2).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.npdev.generator.authoring.AuthoringDiffGateMain'
    ignoreExitValue = true
    def cliArgs = []
    if (project.hasProperty('previousPath')) {
        cliArgs << '--previous' << project.getProperty('previousPath')
    }
    if (project.hasProperty('submittedPath')) {
        cliArgs << '--submitted' << project.getProperty('submittedPath')
    }
    if (project.hasProperty('manifestPath')) {
        cliArgs << '--manifest' << project.getProperty('manifestPath')
    }
    if (project.hasProperty('reportOut')) {
        cliArgs << '--out' << project.getProperty('reportOut')
    }
    // E5: on a PASS only, archives the previous model verbatim to <dir>/<version>-<sha256>.json.
    if (project.hasProperty('archiveDir')) {
        cliArgs << '--archiveDir' << project.getProperty('archiveDir')
    }
    args = cliArgs
}

// REG-49 residual (docs/REMAINDER_CLOSURE_PLAN.md 3.3): ServiceBaseDeleteFlowRowLevelAuthzBehaviorTest
// compiles+runs a real generated *ServiceBase.java through the REAL GeneratedCrudRuntimeSupport, whose
// resolveCurrentExecutionContext() internally calls spring-web's RequestContextHolder/
// ServletRequestAttributes -- the only way to feed it a caller identity. That class is loaded by
// whichever classloader also has spring-web/jakarta-servlet-api on it (JVM class resolution uses the
// REFERENCING class's own defining loader, not the caller's), so those two jars must be visible
// wherever GeneratedCrudRuntimeSupport itself is loaded -- they cannot be scoped to only the test's own
// child URLClassLoader.
//
// They also cannot simply be added to the main `test` task's classpath: TrustedSourceEmitterGeneratedActionTest
// and its JDBC sibling hand-write their OWN minimal stub classes under these exact same package/class
// names (org.springframework.stereotype.Service, jakarta.servlet.http.HttpServletRequest, ...) and
// compile+load them through an isolated URLClassLoader that reuses `System.getProperty("java.class.path")`
// for its own javac -classpath. Adding real spring-web/jakarta-servlet-api to the shared
// testRuntimeClasspath lets the real classes shadow those tests' own stubs via parent-first classloader
// delegation -- confirmed live: both threw NoSuchMethodError the first time this was tried.
//
// The fix is a genuinely separate Gradle source set + Test task (not a same-task system-property
// trick): a fully independent classpath, so neither side can affect the other.
sourceSets {
    behaviorTest {
        java.srcDir 'src/behaviorTest/java'
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    behaviorTestImplementation.extendsFrom testImplementation
    behaviorTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation project(':dsl')
    implementation project(':core')
    implementation project(':kernel')

    implementation 'com.github.spullara.mustache.java:compiler:0.9.14'
    implementation 'org.slf4j:slf4j-simple:2.0.16'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'org.jsoup:jsoup:1.17.2'
    // SER-P7.2: generation-time validation of conversion-hook.schema.json (ConversionHookEmitter).
    implementation 'com.networknt:json-schema-validator:1.5.6'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation project(':adapters:audit-inproc')
    testImplementation project(':adapters:audit-postgres')
    testImplementation project(':adapters:events-inproc')
    testImplementation project(':adapters:eventstore-postgres')
    testImplementation project(':adapters:flowinstance-inproc')
    testImplementation project(':adapters:flowinstance-postgres')
    testImplementation project(':adapters:idempotency-inproc')
    testImplementation project(':adapters:idempotency-postgres')
    testImplementation project(':adapters:tracing-inproc')
    testImplementation project(':adapters:tracestore-postgres')
    testImplementation 'com.h2database:h2:2.2.224'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.postgresql:postgresql:42.7.4'
    testImplementation 'org.flywaydb:flyway-core:10.10.0'
    testImplementation 'org.flywaydb:flyway-database-postgresql:10.10.0'

    // HARDEN-OBJSTORE-P4: live packaged-app proof needs a real MinIO endpoint + an S3 client to
    // assert bytes landed in the bucket under the tenant prefix.
    testImplementation platform('software.amazon.awssdk:bom:2.28.11')
    testImplementation 'software.amazon.awssdk:s3'
    testImplementation 'org.testcontainers:minio:1.21.4'

    // behaviorTest: isolated from the above on purpose -- see the sourceSets note.
    behaviorTestImplementation project(':adapters:expression-cel')
    behaviorTestImplementation 'org.springframework:spring-web:6.1.12'
    behaviorTestImplementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    behaviorTestImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
}

tasks.named('run') {
    // Make relative paths like test-models\... work from NPDev root
    workingDir rootProject.projectDir
}

tasks.named('test') {
    useJUnitPlatform()
    // Perf: forked test JVMs default to 512m and do NOT inherit org.gradle.jvmargs.
    // maxParallelForks is held at 2 (not 4): this suite drives Testcontainers/MinIO
    // and also packages and boots whole generated FinalApps (which bind ports),
    // so concurrent forks contend. Raise only with evidence the suite stays green.
    maxHeapSize = '2g'
    maxParallelForks = 2
    jvmArgs '-XX:+UseParallelGC'
}

tasks.register('behaviorTest', Test) {
    description = 'REG-49 residual: behavioral tests needing a real spring-web/jakarta-servlet-api, ' +
            'isolated from the main test task classpath (see sourceSets.behaviorTest above).'
    group = 'verification'
    testClassesDirs = sourceSets.behaviorTest.output.classesDirs
    classpath = sourceSets.behaviorTest.runtimeClasspath
    useJUnitPlatform()
    maxHeapSize = '2g'
}

tasks.named('check') {
    dependsOn tasks.named('behaviorTest')
}
