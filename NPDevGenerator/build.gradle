plugins {
    id 'base'
}

def resolveNpdevBuildRoot = {
    def prop = providers.gradleProperty('npdevBuildRoot').getOrNull()
    if (prop != null && !prop.trim().isEmpty()) {
        return file(prop)
    }
    def configured = System.getenv('NPDEV_BUILD_ROOT')
    if (configured != null && !configured.trim().isEmpty()) {
        return file(configured)
    }
    // npdev-build-root-resolution: find the repo root by its CONTENTS, not its NAME. A clone named
    // anything but 'NPDev_General' used to fall through to a fallback that disagreed with
    // scripts/npdev-common.ps1's Get-NPDevBuildRoot by one directory -- see that function's comment
    // for the CI failure it caused. Same predicate as WorkspaceRootLocator.java.
    def sourceRoot = rootDir
    while (sourceRoot != null && !(new File(sourceRoot, 'NPDevContract').isDirectory()
            && new File(sourceRoot, 'NPDevGenerator').isDirectory()
            && new File(sourceRoot, 'NPDevKernel').isDirectory())) {
        sourceRoot = sourceRoot.parentFile
    }
    if (sourceRoot != null && sourceRoot.parentFile != null) {
        return new File(sourceRoot.parentFile, 'Build')
    }
    return new File(rootDir.parentFile, 'Build')
}

def npdevExternalBuildRoot = resolveNpdevBuildRoot()

allprojects {
    def safeProjectPath = project.path == ':' ? 'root' : project.path.substring(1).replace(':', '/')
    layout.buildDirectory.set(new File(npdevExternalBuildRoot, "gradle/${rootProject.name}/${safeProjectPath}"))

    group = 'com.npdev'
    version = '0.1.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    // R3 (MASTER-ROADMAP.md Step 9 / ledger QUAL-6): applies to :generator, :tools:npdev-cli and
    // every sibling contract/kernel/dsl/adapter project this multi-project build pulls in.
    // Unconditional -- none of these ship into a generated FinalApp (see NPDevRuntimeHost/
    // build.gradle.template's own gating comment for the one build that does).
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.0'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        // Perf: see note on :generator:test. Forked test JVMs default to 512m
        // and do NOT inherit org.gradle.jvmargs.
        maxHeapSize = '2g'
        maxParallelForks = 2
        jvmArgs '-XX:+UseParallelGC'
        // R3: any test run (including :generator's own custom `behaviorTest` task, which is a
        // Test-typed task too) also produces a fresh JaCoCo XML report as a byproduct.
        finalizedBy tasks.named('jacocoTestReport')
    }

    tasks.withType(JacocoReport).configureEach {
        reports {
            xml.required = true
            html.required = false
        }
    }
}

tasks.register('generatorQualityGate') {
    group = 'verification'
    description = 'Runs the independent NPDevGenerator verification build.'
    dependsOn ':generator:test'
    dependsOn ':tools:npdev-cli:test'
}

